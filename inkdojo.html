<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Ink Dojo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* One look: a night dojo lit by lanterns. The whole page is the game's canvas. */
:root { --night: #120f19; --paper: #efe6d0; color-scheme: dark; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--paper); overflow: hidden; overscroll-behavior: none; }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#safe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
/* the tilt button: invisible, over the circle the game draws by the paper (a real button, so iPhones accept its tap) */
#tiltBtn { position: fixed; z-index: 2; margin: 0; padding: 0; border: 0; border-radius: 50%; background: transparent; opacity: 0; touch-action: manipulation; -webkit-tap-highlight-color: transparent; cursor: pointer; }
</style>
</head>
<body>
<canvas id="game" aria-label="Ink Dojo: a dojo of fighters, and a pad of paper to write your moves on"></canvas>
<div id="safe"></div>
<button id="tiltBtn" type="button" aria-label="Tilt to walk" hidden></button>
<script>
// ── Ink Dojo: the four ways, their twenty moves each, and the reader that judges a written glyph ──
const INK = (() => {
'use strict';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// shapes, in pad units: the pad is a circle of radius 1, x to the right, y down (0° points right, 90° down, 270° up)
const arc = (cx, cy, r, a0, a1, n = 64) => Array.from({ length: n + 1 }, (_, i) => { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }; });
const spiral = (cx, cy, r0, r1, a0, turns, n = 140) => Array.from({ length: n + 1 }, (_, i) => { const k = i / n, a = (a0 + 360 * turns * k) * Math.PI / 180, r = r0 + (r1 - r0) * k; return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }; });
const poly = (...v) => { const o = []; for (let i = 0; i < v.length; i += 2) o.push({ x: v[i], y: v[i + 1] }); return o; };
const quad = (x0, y0, x1, y1, x2, y2, n = 40) => Array.from({ length: n + 1 }, (_, i) => { const t = i / n, u = 1 - t; return { x: u * u * x0 + 2 * u * t * x1 + t * t * x2, y: u * u * y0 + 2 * u * t * y1 + t * t * y2 }; });
const hwave = (x0, x1, yc, amp, cycles, n = 90) => Array.from({ length: n + 1 }, (_, i) => { const u = i / n; return { x: x0 + (x1 - x0) * u, y: yc - amp * Math.sin(TAU * cycles * u) }; });
const vwave = (y0, y1, xc, amp, cycles, n = 90) => Array.from({ length: n + 1 }, (_, i) => { const u = i / n; return { x: xc + amp * Math.sin(TAU * cycles * u), y: y0 + (y1 - y0) * u }; });
const curve = (f, n = 120) => Array.from({ length: n + 1 }, (_, i) => f(i / n));
const join = (...parts) => parts.flatMap((p, i) => (i ? p.slice(1) : p));
const star = (cx, cy, r) => Array.from({ length: 6 }, (_, i) => { const a = (-90 + i * 144) * Math.PI / 180; return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }; });

// more shapes
const ellipse = (cx, cy, rx, ry, a0 = -90, a1 = 270, n = 72) => Array.from({ length: n + 1 }, (_, i) => { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; return { x: cx + Math.cos(a) * rx, y: cy + Math.sin(a) * ry }; });
const ngon = (cx, cy, r, k, a0 = -90) => Array.from({ length: k + 1 }, (_, i) => { const a = (a0 + i * 360 / k) * Math.PI / 180; return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }; });
const sawRing = (cx, cy, r1, r2, k) => Array.from({ length: 2 * k + 1 }, (_, i) => { const a = (-90 + i * 180 / k) * Math.PI / 180, r = i % 2 ? r2 : r1; return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }; });

// the four ways: what each is good at, what it lacks, and its twist
const WAYS = {
  water: { name: 'Water', animal: 'Snake', style: 'Tai Chi', color: '#4ab4ff', beats: 'fire',
    blurb: 'Heals best and controls the fight from range, and puts fire out, but its hits are light and earth drinks it up.', twist: 'Soak and freeze',
    twistWhat: 'Water soaks them and slows them; ice freezes a soaked foe solid. Puddles you leave on the floor make your water spells stronger, and fill your ki faster, while you stand in them. A soaked fire fighter’s flames come out damp.',
    ink: 'Light, unbroken ink.' },
  fire: { name: 'Fire', animal: 'Leopard', style: 'Muay Thai', color: '#ff6a3a', beats: 'air',
    blurb: 'Hits hardest and its burns keep hurting, but it defends poorly, barely heals, and water damps it.', twist: 'Heat',
    twistWhat: 'Every fire spell heats you up. Hot fire hits harder, but past the red line you start to burn yourself. Vent lets it all out in one blast. Running hot brings your ki back faster; being soaked damps your fire and slows the heat.',
    ink: 'A pooled start, then quick and thin.' },
  earth: { name: 'Earth', animal: 'Tiger', style: 'Hung Gar', color: '#c9a35c', beats: 'water',
    blurb: 'The toughest, and its stones block shots, but it is slow on its feet and slow to cast.', twist: 'Stones',
    twistWhat: 'Some spells raise rocks and walls that stay on the floor and block the way. Others throw them, roll them, or shatter them into shards. Standing your ground brings your ki back faster, and stone can’t burn.',
    ink: 'Heavy, slow, pressed ink.' },
  air: { name: 'Air', animal: 'Crane', style: 'Capoeira', color: '#f1dc6a', beats: 'earth',
    blurb: 'The fastest, and it throws foes about, but it has the least health and its single hits are small.', twist: 'Wind',
    twistWhat: 'Moving builds wind. Your air spells hit harder the more wind you carry, and standing still lets it die away. Keep moving and your ki comes back faster too.',
    ink: 'Light, fast ink.' },
};
const WAY_ORDER = ['water', 'fire', 'earth', 'air'];

// each spell: its key, name, a one-word kind, its ki cost, what it does, how to write it, its strokes, which strokes are
// closed loops, where the ink must pool (0 the start, 1 the end), and the ink it wants (light, steady, heavy or any).
// In each way's list, the order is the order they're learned: the first eight from the start, then one per fighter beaten.
const S = (key, name, tag, cost, what, how, strokes, o = {}) => ({ key, role: key, name, tag, cost, what, how, strokes: Array.isArray(strokes[0]) ? strokes : [strokes], closed: o.closed || null, pools: o.pools || null, ink: o.ink || 'any', loose: !!o.loose });
const MOVES = {
  water: [
    S('lash', 'Water Lash', 'Strike', 6, 'A whip of water lashes out to mid range and soaks them.', 'A long S from the bottom left up to the top right, curling into a small hook at the end.',
      join(quad(-0.7, 0.62, -0.72, 0, -0.05, 0), quad(-0.05, 0, 0.6, 0, 0.58, -0.45), arc(0.4, -0.45, 0.18, 0, -230)), { ink: 'light' }),
    S('bullet', 'Water Bullet', 'Shot', 8, 'A fast bullet of water that soaks them.', 'A raindrop: from its point at the top, round the bottom and back up to the point.',
      curve(u => { const t = u * TAU; return { x: 0.42 * Math.sin(t) * Math.sin(t / 2), y: 0.05 - 0.55 * Math.cos(t) }; }), { closed: [true], ink: 'light' }),
    S('bubble', 'Bubble Shield', 'Absorb', 12, 'A bubble of water round you takes the next hits for you. When it bursts, it splashes and soaks them.', 'A big circle near the rim.',
      arc(0, 0, 0.72, -90, 270), { closed: [true], ink: 'light', loose: true }),
    S('puddle', 'Puddle', 'Pool', 8, 'Splash a puddle under them: it soaks and slows whoever stands in it. Your water spells are stronger while you stand in one.', 'A wide flat oval low on the pad.',
      ellipse(0, 0.42, 0.62, 0.2), { closed: [true], ink: 'light' }),
    S('rain', 'Healing Rain', 'Heal', 18, 'A little cloud rains on you and mends you, more if you stand in water. It puts out burns.', 'A cloud: along the flat bottom, then three bumps back over the top.',
      join(poly(-0.514, 0.2, 0.514, 0.2), arc(0.38, 0, 0.24, 56, -120), arc(0, -0.14, 0.3, -20, -160), arc(-0.38, 0, 0.24, -60, 124)), { closed: [true], ink: 'light' }),
    S('glide', 'Stream Glide', 'Glide', 8, 'Ride a stream across the floor, fast, leaving a trail of water behind you.', 'A long ripple across the middle: two waves.',
      hwave(-0.78, 0.78, 0, 0.21, 2), { ink: 'light' }),
    S('geyser', 'Geyser', 'Burst', 14, 'A jet of water bursts up under them: it hits, drenches them for a long time and slows them. Twice as strong if they stand in a puddle.', 'Straight up the left of the middle, then arch over to the right and down a little, like a fountain.',
      join(poly(-0.2, 0.75, -0.2, -0.3), arc(0.08, -0.3, 0.28, 180, 360), poly(0.36, -0.3, 0.36, -0.05)), { ink: 'light' }),
    S('shards', 'Ice Shards', 'Chill', 12, 'Three shards of ice that chill them and slow them down, for longer if they are soaked.', 'Three spikes from one point low in the middle: up to the left and back, straight up and back, up to the right.',
      poly(0, 0.55, -0.5, -0.35, 0, 0.55, 0, -0.65, 0, 0.55, 0.5, -0.35), { ink: 'light' }),
    S('whirlpool', 'Whirlpool', 'Trap', 18, 'A whirlpool opens under them: it drags them to its middle and soaks them.', 'From the right-hand rim, spiral in two turns and pool in the centre.',
      spiral(0, 0, 0.85, 0.1, 0, 2), { pools: [[1]], ink: 'steady' }),
    S('freeze', 'Freeze', 'Freeze', 16, 'The only way to freeze: a soaked foe freezes solid wherever they stand, and every puddle turns to ice. A dry foe is only chilled.', 'A snowflake’s arms: one stroke straight down the middle, then one straight across.',
      [poly(0, -0.65, 0, 0.65), poly(-0.65, 0, 0.65, 0)]),
    S('tidal', 'Tidal Wave', 'Wash', 20, 'A wide wave rolls across the ring: it soaks them, puts out their fire and lava, and wears away their stones.', 'A big wave: rise from the bottom left to a crest at the top right, then curl over.',
      join(quad(-0.8, 0.5, -0.3, -0.55, 0.3, -0.45), arc(0.3, -0.2, 0.25, -90, 140)), { ink: 'light' }),
    S('mist', 'Mist Veil', 'Conceal', 12, 'A mist wraps round you: most of their shots miss, and they lose track of you.', 'A sideways figure of eight across the middle, without lifting the brush.',
      curve(u => { const t = u * TAU; return { x: 0.68 * Math.sin(t), y: 0.28 * Math.sin(2 * t) }; }), { closed: [true], ink: 'light' }),
    S('undertow', 'Undertow', 'Yank', 12, 'A current drags them to you, soaked and slowed.', 'From the top right, hook round and in to the centre. Pool the ink at the end.',
      spiral(0, 0, 0.72, 0.1, -45, 0.85), { pools: [[1]], ink: 'steady' }),
    S('mirror', 'Reflecting Pool', 'Reflect', 10, 'A mirror of water at your feet sends the next shot back at whoever threw it.', 'A bowl: straight across, then round underneath back to the start.',
      join(poly(-0.6, -0.12, 0.6, -0.12), arc(0, -0.12, 0.6, 0, 180)), { closed: [true], ink: 'light' }),
    S('dragon', 'Water Dragon', 'Summon', 22, 'A serpent of water coils out, chases them and bites three times.', 'A tall snaking line from the bottom to the top: two and a half bends.',
      vwave(0.75, -0.75, 0, 0.22, 2.5), { ink: 'light' }),
    S('pushhands', 'Push Hands', 'Counter', 10, 'Stand ready for a moment: if they strike you up close, you catch the blow and throw them, soaked.', 'A long level line across the middle with one loop in it, like a hand turning a blow aside.',
      join(poly(-0.8, 0.1, 0, 0.1), arc(0, -0.12, 0.22, 90, -270), poly(0, 0.1, 0.8, 0.1)), { ink: 'light' }),
    S('ebb', 'Ebb and Flow', 'Swap', 12, 'Flow past them: you trade places in an instant, and they are left soaked.', 'Two currents passing: two strokes, a ripple along the top, then another along the bottom.',
      [hwave(-0.62, 0.62, -0.24, 0.13, 1.5), hwave(-0.62, 0.62, 0.24, 0.13, 1.5)], { ink: 'light' }),
    S('draw', 'Draw from the Pond', 'Ki', 0, 'Draw ki from the water round you. Far more if you stand in a puddle.', 'A deep cup in the middle.',
      arc(0, -0.15, 0.5, 180, 0), { ink: 'light' }),
    S('double', 'Water Double', 'Decoy', 12, 'A double of you, made of water, stays behind while you slip aside. Their spells go at it, and it bursts into a puddle.', 'Two strokes: two small circles side by side.',
      [arc(-0.3, 0, 0.22, -90, 270), arc(0.3, 0, 0.22, -90, 270)], { closed: [true, true], ink: 'light' }),
    S('flood', 'Great Flood', 'Ultimate', 60, 'The ring floods: a huge wave crashes over them, then everything freezes.', 'Pool in the centre, spiral out one and a half turns, then climb to the top.',
      join(spiral(0, 0, 0.04, 0.5, 0, 1.5), quad(-0.5, 0, -0.58, -0.62, 0.06, -0.92)), { pools: [[0]], ink: 'steady' }),
  ],
  fire: [
    S('jab', 'Flame Jab', 'Strike', 6, 'A fist wrapped in fire. It sets them burning.', 'A small tick in the middle: down a little, then up and to the right. Pool the ink first.',
      poly(-0.3, -0.05, -0.08, 0.25, 0.42, -0.42), { pools: [[0]], ink: 'light' }),
    S('fireball', 'Fireball', 'Shot', 10, 'A ball of fire that bursts where it lands.', 'A small triangle high on the pad.',
      poly(0, -0.72, 0.25, -0.3, -0.25, -0.3, 0, -0.72), { closed: [true], ink: 'light' }),
    S('breath', 'Flame Breath', 'Cone', 14, 'Breathe a cone of fire at them for a moment.', 'A wide < opening to the right: from the top right to a point on the left and back out. Pool the ink first.',
      poly(0.62, -0.55, -0.45, 0, 0.62, 0.55), { pools: [[0]] }),
    S('rocket', 'Rocket Step', 'Dash', 9, 'Jets of fire hurl you away across the floor, leaving a burning trail behind you for them.', 'Two little zigzags at the bottom left, then one long stroke to the top right. Pool the ink first.',
      join(poly(-0.72, 0.72, -0.6, 0.5, -0.5, 0.66, -0.38, 0.46), poly(-0.38, 0.46, 0.66, -0.62)), { pools: [[0]], ink: 'light' }),
    S('flameshield', 'Flame Shield', 'Thorns', 10, 'A ring of flame round you: it blunts their blows and burns whoever hits you.', 'A sun: a jagged circle of ten points round the centre.',
      sawRing(0, 0, 0.62, 0.42, 10), { closed: [true] }),
    S('roundhouse', 'Roundhouse Flame', 'Sweep', 14, 'A spinning kick throws a ring of fire all round you.', 'A Z: across the top, down to the bottom left, across the bottom.',
      poly(-0.55, -0.5, 0.55, -0.5, -0.55, 0.5, 0.55, 0.5)),
    S('firewall', 'Fire Wall', 'Barrier', 16, 'A line of flame between you and them: it burns and slows whoever crosses it.', 'A row of flames: a zigzag of four peaks across the middle.',
      poly(-0.8, 0.2, -0.6, -0.25, -0.4, 0.2, -0.2, -0.25, 0, 0.2, 0.2, -0.25, 0.4, 0.2, 0.6, -0.25, 0.8, 0.2), { ink: 'light' }),
    S('vent', 'Vent', 'Release', 6, 'Let all your heat out in one blast round you. The hotter you are, the bigger it is.', 'A big peak: from the bottom left up to the top and down to the bottom right. Pool the ink first.',
      poly(-0.6, 0.62, 0, -0.68, 0.6, 0.62), { pools: [[0]] }),
    S('embers', 'Ember Spray', 'Volley', 12, 'A fan of embers. Each one sets them burning.', 'An M across the top of the pad.',
      poly(-0.55, -0.1, -0.3, -0.66, 0, -0.3, 0.3, -0.66, 0.55, -0.1), { ink: 'light' }),
    S('charge', 'Sticky Charge', 'Bomb', 18, 'A burning charge sticks to them and blows up a moment later, unless they shake it off with a dodge or a dash.', 'An X: one stroke, then the other.',
      [poly(-0.5, -0.5, 0.5, 0.5), poly(0.5, -0.5, -0.5, 0.5)]),
    S('knee', 'Burning Knee', 'Break', 14, 'A rising knee bursting with fire that smashes through shields, armour and guards, and burns.', 'A tall N: up, slash down to the bottom right, up again. Pool the ink first.',
      poly(-0.35, 0.65, -0.35, -0.65, 0.35, 0.65, 0.35, -0.65), { pools: [[0]] }),
    S('whip', 'Fire Whip', 'Grapple', 12, 'A whip of flame catches them and hauls you in to them for a burning blow.', 'A 7: across the top, then a long slash down to the left.',
      poly(-0.5, -0.55, 0.5, -0.55, -0.15, 0.68), { ink: 'light' }),
    S('lava', 'Lava Pool', 'Zone', 18, 'The floor under them melts: they slow to a crawl and burn.', 'A W low on the pad.',
      poly(-0.6, 0.15, -0.3, 0.66, 0, 0.32, 0.3, 0.66, 0.6, 0.15)),
    S('ignite', 'Ignite', 'Detonate', 10, 'Every burn on them flares up at once. The longer they have been burning, the harder it hits.', 'A lightning bolt from the top to the bottom.',
      poly(0.25, -0.75, -0.2, -0.05, 0.2, 0.05, -0.25, 0.75), { ink: 'light' }),
    S('fury', 'Fury', 'Fury', 10, 'Let the fire take you: for a few seconds your spells come out twice as fast and hit harder, but your heat climbs fast.', 'A triangle that spirals in: round the outside once, then in to the middle.',
      poly(0, -0.7, 0.65, 0.5, -0.65, 0.5, 0, -0.38, 0.32, 0.22, -0.3, 0.22, 0, -0.05), { ink: 'light' }),
    S('meteor', 'Meteor', 'Blast', 26, 'A burning rock falls from the sky onto them and leaves molten ground.', 'An arrow pointing down to the left: the shaft from the top right, then the head.',
      [poly(0.6, -0.6, -0.45, 0.45), poly(-0.45, 0.02, -0.45, 0.45, -0.02, 0.45)]),
    S('firework', 'Firework', 'Lob', 16, 'A rocket arcs over walls and stones and bursts over them in a shower of sparks.', 'A diamond round the centre.',
      poly(0, -0.62, 0.42, 0, 0, 0.62, -0.42, 0, 0, -0.62), { closed: [true], ink: 'light' }),
    S('phoenix', 'Phoenix Rise', 'Heal', 14, 'Burn your heat into life: the hotter you are, the more it mends. It puts out your own burns.', 'A big V: from the top left down to a point and up to the top right.',
      poly(-0.62, -0.55, 0, 0.62, 0.62, -0.55)),
    S('brand', 'Searing Brand', 'Mark', 10, 'Burn your mark onto them: for a while every spell of yours hits them harder.', 'A star of two triangles: one pointing up, then one pointing down.',
      [poly(0, -0.62, 0.54, 0.31, -0.54, 0.31, 0, -0.62), poly(0, 0.62, -0.54, -0.31, 0.54, -0.31, 0, 0.62)], { closed: [true, true] }),
    S('inferno', 'Inferno', 'Ultimate', 60, 'A star of fire bursts across the ring, then explodes again.', 'A five-pointed star in one stroke.',
      star(0, 0.05, 0.75), { closed: [true] }),
  ],
  earth: [
    S('fist', 'Stone Fist', 'Strike', 8, 'A fist cased in rock. Heavy, and it knocks them back.', 'A T: across the top, then straight down the middle. Press hard.',
      [poly(-0.5, -0.5, 0.5, -0.5), poly(0, -0.5, 0, 0.6)], { ink: 'heavy' }),
    S('rock', 'Rock Throw', 'Shot', 10, 'Tear a rock from the floor and throw it. If one of your stones is beside you, you throw that instead, much harder.', 'One stroke straight up the middle. Pool the ink at the bottom first.',
      poly(0, 0.7, 0, -0.7), { pools: [[0]], ink: 'heavy' }),
    S('wall', 'Stone Wall', 'Wall', 12, 'A wall of stone rises between you: it stops shots and blocks the way.', 'Battlements: across the middle, a square tooth up at each end and a dip between.',
      poly(-0.75, 0.2, -0.75, -0.25, -0.3, -0.25, -0.3, 0.2, 0.3, 0.2, 0.3, -0.25, 0.75, -0.25, 0.75, 0.2), { ink: 'heavy' }),
    S('spike', 'Earth Spike', 'Spike', 14, 'A spike of rock bursts up under them. It stays there as a stone.', 'Two strokes: the ground along the bottom, then a spike straight up from its middle.',
      [poly(-0.6, 0.55, 0.6, 0.55), poly(0, 0.55, 0, -0.7)], { ink: 'heavy' }),
    S('skin', 'Stone Skin', 'Armor', 14, 'Your skin turns to stone: you take half the damage, burns can’t take hold and nothing knocks you back, but you move slower.', 'A big square round the centre. Pool the ink where you start.',
      poly(-0.55, -0.55, 0.55, -0.55, 0.55, 0.55, -0.55, 0.55, -0.55, -0.55), { closed: [true], pools: [[0]], ink: 'heavy' }),
    S('quake', 'Quake', 'Stun', 16, 'Stamp: a shockwave runs through the ground all round you and knocks them off their feet. It can’t touch anyone in the air.', 'A long level line low on the pad. Pool at both ends, like two planted feet.',
      poly(-0.75, 0.45, 0.75, 0.45), { pools: [[0, 1]], ink: 'heavy' }),
    S('statue', 'Jade Statue', 'Statue', 14, 'Turn to jade for a moment: nothing can hurt or move you, but you can’t act either. You come out of it mended a little.', 'A square cup: down, across the bottom, back up.',
      poly(-0.42, -0.1, -0.42, 0.55, 0.42, 0.55, 0.42, -0.1), { ink: 'heavy' }),
    S('shatter', 'Shatter', 'Burst', 12, 'Every stone you have raised bursts into flying shards. The more stones near them, the more it hurts.', 'A broken line: a short stroke on the left, a gap, then a short stroke on the right.',
      [poly(-0.7, 0, -0.22, 0), poly(0.22, 0, 0.7, 0)], { ink: 'heavy' }),
    S('boulder', 'Boulder Roll', 'Roll', 18, 'A boulder rolls across the ring at them, crushing. It uses one of your stones if it can.', 'Two strokes: a small square on the left, then a line rolling out to the right.',
      [poly(-0.68, -0.18, -0.32, -0.18, -0.32, 0.18, -0.68, 0.18, -0.68, -0.18), poly(-0.2, 0, 0.72, 0)], { closed: [true, false], ink: 'heavy' }),
    S('quicksand', 'Quicksand', 'Sink', 16, 'The floor under them turns to sand: they sink, slow to a crawl, and take damage while they are in it.', 'A funnel: across the top, slant in to a narrow bottom, and back up.',
      poly(-0.62, -0.45, 0.62, -0.45, 0.2, 0.5, -0.2, 0.5, -0.62, -0.45), { closed: [true], ink: 'heavy' }),
    S('sand', 'Sand Blast', 'Blind', 12, 'A spray of sand stings them and blinds them, so their spells come out weak.', 'A dune: from the bottom left, two square steps up, across the top, and two steps down again.',

// nothing on this page scrolls or zooms

window.addEventListener('keydown', e => {
  keys[e.code] = true; audio();
  if (e.code === 'Escape' && overlay && overlay.kind === 'scroll') overlay = null;
  if ((e.code === 'KeyM' || e.code === 'Tab') && state === 'play' && !overlay) { overlay = { kind: 'scroll', t: 0 }; e.preventDefault(); }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; stick = null; });

// ── the loop ──
let last = performance.now(), MANUAL = false;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try { if (!MANUAL) update(dt); render(); } catch (err) { console.error(err); }
}
// if the page is updated while it's open, come back to the dojo rather than to the title
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ playing: state === 'play' })); } catch (_) {}
function boot(data) {
  if (data && data.playing === true) { const s = loadSave(); if (s) { save = s; continueGame(); } }
  requestAnimationFrame(frame);
}
if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data || {});

// ── for tests: start a way, write a move as a steady hand would, step time by hand ──
window.INKDOJO = {
  get state() { return state; }, get overlay() { return overlay; }, get fight() { return FIGHT; }, get player() { return player; }, get foes() { return FOES; }, get master() { return MASTERF; }, get save() { return save; },
  begin(way) { beginGame(way); }, cont() { save = loadSave(); continueGame(); },
  write(key, o = {}) { const m = MOVES[save.way].find(m => m.key === key); return padJudge(writeOut(m, { wobble: 0.01, ...o })); },
  // cast any spell straight away, as anyone, at a given strength (for looking at spells)
  castAs(who, id, P = 1) { const f = who === 'foe' ? FIGHT && FIGHT.foe : player, [way, key] = id.split(':'), m = MOVES[way].find(m => m.key === key); if (!f || !m) return false; f.ki = Math.max(f.ki, m.cost); if (!startMove(f, m, P, foeOf(f))) return false; f.act.t = 0; return true; },
  manual(on) { MANUAL = on; }, step(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) update(dt); },
  tapOverlay() { const b = buttons[buttons.length - 1]; if (b) b.go(); }, close() { overlay = null; },
  teleport(x, y) { player.x = x; player.y = y; updateCam(0, true); },
  koFoe() { if (FIGHT && FIGHT.on) knockedOut(FIGHT.foe, player); }, koMe() { if (FIGHT && FIGHT.on) knockedOut(player, FIGHT.foe); },
  get tilt() { return TILT; }, tiltBubble,
  // a bot plays you: it walks as a fighter would and writes the spell a fighter would pick, by hand (so not always neatly)
  // the player played by a fighter's mind too, so two ways can be weighed against each other on equal terms
  dmgLog(on) { if (on) DMGLOG = {}; const L = DMGLOG; if (!on) DMGLOG = null; return L; },
  aiPlayer(dt) { const foe = FIGHT && FIGHT.foe; if (!BOT || !foe || !FIGHT.on) return; aiFight(player, foe, dt); const sp = player.speed * moveMul(player) || 1; BOT.mx = player.vx / sp; BOT.my = player.vy / sp; },
  bot(on, o = {}) { BOT = on ? { mx: 0, my: 0, ...o } : null; if (on && player) player.ai.cd = {}; },
  botStep(dt, K, wobble) {
    const foe = FIGHT && FIGHT.foe; if (!BOT || !foe || !FIGHT.on) return null;
    const d = aiWalk(player, foe, dt); BOT.mx = d.mx; BOT.my = d.my;
    if (player.act || !canCast(player) || PAD.judgeAt) return null;
    const c = aiChoose(player, foe, myMoves(), dt, K); if (!c) return null;
    const R = padJudge(writeOut(c.move, { wobble: wobble ?? (0.008 + Math.random() * 0.03), seed: Math.random() * 9 }));
    return R && R.verdict !== 'fizzle' ? c.move.key : 'fizzle';
  },
  INK, ROSTER, MOVES, RANKS, WAYMOD, ADV, HALL, YOU, learnedCount, myMoves, padJudge, startFight, setSound, spawnMaster, setupWorld, resetFighter,
  get shots() { return SHOTS; }, get waves() { return WAVES; }, get zones() { return ZONES; }, get ents() { return ENTS; }, get stones() { return STONES; }, get fx() { return FX; },
};
})();
