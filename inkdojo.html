<style>
/* One look: a night dojo lit by lanterns. The whole page is the game's canvas. */
:root { --night: #120f19; --paper: #efe6d0; color-scheme: dark; }
html, body { margin: 0; height: 100%; background: var(--night); color: var(--paper); overflow: hidden; overscroll-behavior: none; }
#game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#safe { position: fixed; visibility: hidden; pointer-events: none; padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
</style>
</head>
<body>
<canvas id="game" aria-label="Ink Dojo: a dojo of fighters, and a pad of paper to write your moves on"></canvas>
<div id="safe"></div>

// ── Ink Dojo: the four ways, their twenty moves each, and the reader that judges a written glyph ──
const INK = (() => {
'use strict';
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// shapes, in pad units: the pad is a circle of radius 1, x to the right, y down (0° points right, 90° down, 270° up)
const arc = (cx, cy, r, a0, a1, n = 64) => Array.from({ length: n + 1 }, (_, i) => { const a = (a0 + (a1 - a0) * i / n) * Math.PI / 180; return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }; });
const spiral = (cx, cy, r0, r1, a0, turns, n = 140) => Array.from({ length: n + 1 }, (_, i) => { const k = i / n, a = (a0 + 360 * turns * k) * Math.PI / 180, r = r0 + (r1 - r0) * k; return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }; });
const poly = (...v) => { const o = []; for (let i = 0; i < v.length; i += 2) o.push({ x: v[i], y: v[i + 1] }); return o; };
const quad = (x0, y0, x1, y1, x2, y2, n = 40) => Array.from({ length: n + 1 }, (_, i) => { const t = i / n, u = 1 - t; return { x: u * u * x0 + 2 * u * t * x1 + t * t * x2, y: u * u * y0 + 2 * u * t * y1 + t * t * y2 }; });
const hwave = (x0, x1, yc, amp, cycles, n = 90) => Array.from({ length: n + 1 }, (_, i) => { const u = i / n; return { x: x0 + (x1 - x0) * u, y: yc - amp * Math.sin(TAU * cycles * u) }; });
const vwave = (y0, y1, xc, amp, cycles, n = 90) => Array.from({ length: n + 1 }, (_, i) => { const u = i / n; return { x: xc + amp * Math.sin(TAU * cycles * u), y: y0 + (y1 - y0) * u }; });
const curve = (f, n = 120) => Array.from({ length: n + 1 }, (_, i) => f(i / n));
const join = (...parts) => parts.flatMap((p, i) => (i ? p.slice(1) : p));
const star = (cx, cy, r) => Array.from({ length: 6 }, (_, i) => { const a = (-90 + i * 144) * Math.PI / 180; return { x: cx + Math.cos(a) * r, y: cy + Math.sin(a) * r }; });

  air: { name: 'Air', animal: 'Crane', style: 'Capoeira', color: '#f1dc6a', beats: 'earth',

    ink: 'Light, fast ink.' },

    M('flurry', 'Hundred Fists', 'A square zigzag up the pad: across, up, back, up, across, up.', poly(-0.35, 0.65, 0.35, 0.65, 0.35, 0.22, -0.35, 0.22, -0.35, -0.22, 0.35, -0.22, 0.35, -0.65)),
    M('launcher', 'Rising Stone', 'Three steps climbing to the top right. Pool at the top.', poly(-0.65, 0.55, -0.22, 0.55, -0.22, 0.12, 0.22, 0.12, 0.22, -0.32, 0.65, -0.32), { pools: [[1]], ink: 'heavy' }),

    M('wave', 'Earth Rift', 'A big L: down the left side and along the bottom. Pool where it ends.', poly(-0.55, -0.65, -0.55, 0.55, 0.65, 0.55), { pools: [[1]], ink: 'heavy' }),
    M('zone', 'Pit Trap', 'A square cup low on the pad: down, across, up.', poly(-0.42, 0.0, -0.42, 0.62, 0.42, 0.62, 0.42, 0.0), { ink: 'heavy' }),

for (const w of WAY_ORDER) MOVES[w].forEach((m, i) => {
  m.way = w; m.id = w + ':' + m.role; m.order = ROLES.indexOf(m.role);
  if (!m.closed) m.closed = m.strokes.map(() => false);
  if (!m.pools) m.pools = m.strokes.map(() => []);
});

// ── the reader: each stroke resampled to N points; shape compared after centring and sizing, then size, place, pooling and ink ──
const N = 48;
const pathLen = p => { let L = 0; for (let i = 1; i < p.length; i++) L += Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y); return L; };
function resample(pts, n) {
  const p = pts.map(q => ({ x: q.x, y: q.y })), I = pathLen(p) / (n - 1);
  if (!(I > 0)) return Array.from({ length: n }, () => ({ x: p[0].x, y: p[0].y }));
  const out = [{ x: p[0].x, y: p[0].y }];
  let D = 0;
  for (let i = 1; i < p.length; i++) {
    const d = Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y);
    if (d > 0 && D + d >= I) {
      const k = (I - D) / d, q = { x: p[i - 1].x + k * (p[i].x - p[i - 1].x), y: p[i - 1].y + k * (p[i].y - p[i - 1].y) };
      out.push(q); p.splice(i, 0, q); D = 0;
    } else D += d;
  }
  while (out.length < n) out.push({ x: p[p.length - 1].x, y: p[p.length - 1].y });
  return out.slice(0, n);
}
function frame(ps) {
  let cx = 0, cy = 0;
  for (const q of ps) { cx += q.x; cy += q.y; }
  cx /= ps.length; cy /= ps.length;
  let r = 0;
  for (const q of ps) r += (q.x - cx) ** 2 + (q.y - cy) ** 2;
  r = Math.sqrt(r / ps.length) || 1e-6;
  return { cx, cy, r, n: ps.map(q => ({ x: (q.x - cx) / r, y: (q.y - cy) / r })) };
}
// sharp turns (a square has four, a circle none): the turning over three steps, counted at its peaks

      const X = x0 + (i % cols) * cw, Y = top + Math.floor(i / cols) * ch, known = m.order < learnedCount(), M = { cx: X + cw / 2, cy: Y + r + 4, r };
      paper(ctx, M, true);
      if (known) glyphGuide(ctx, M, m, '#2e2216', 0.95, false, 2);
      else { ctx.fillStyle = 'rgba(18,15,25,0.55)'; ctx.beginPath(); ctx.arc(M.cx, M.cy, r, 0, TAU); ctx.fill(); ctx.font = `${r * 0.8}px ${DISPLAY}`; ctx.fillStyle = C.muted; ctx.fillText('?', M.cx, M.cy + r * 0.28); }
      ctx.font = `bold 11px ${BODY}`; ctx.fillStyle = known ? Wy.color : C.fizzle; ctx.fillText(known ? m.name : '—', X + cw / 2, Y + 2 * r + 18, cw - 6);
      ctx.font = `10px ${BODY}`; ctx.fillStyle = known ? C.muted : '#5d566a'; ctx.fillText(`${ROLE[m.role].label}${known ? ' · ' + ROLE[m.role].cost + ' ki' : ''}`, X + cw / 2, Y + 2 * r + 31, cw - 6);
      if (known) buttons.push({ x: X, y: Y, w: cw, h: ch, go: () => { O.pick = m; } });
    });
    if (O.pick) {
      // a move's card: what it does and how to write it
      const m = O.pick, bw = Math.min(W - 32, 380), bh = 250, bx = cx - bw / 2, by = H / 2 - bh / 2;
      roundRect(bx, by, bw, bh, 16); ctx.fillStyle = C.night2; ctx.fill(); ctx.strokeStyle = Wy.color; ctx.lineWidth = 2; ctx.stroke();
      const M = { cx: bx + 70, cy: by + 80, r: 52 }; paper(ctx, M); glyphGuide(ctx, M, m, '#2e2216', 0.95, false, 2.5);
      ctx.textAlign = 'left'; ctx.font = `22px ${DISPLAY}`; ctx.fillStyle = Wy.color; ctx.fillText(m.name, bx + 136, by + 52, bw - 150);
      ctx.font = `12px ${BODY}`; ctx.fillStyle = C.muted; ctx.fillText(`${ROLE[m.role].label} · ${ROLE[m.role].cost} ki`, bx + 136, by + 72);
      ctx.font = `13px ${BODY}`; ctx.fillStyle = C.fg; wrapText(moveWhat(m), bx + 136, by + 94, bw - 150, 17);
      ctx.fillStyle = C.paper; ctx.font = `13px ${BODY}`; wrapText('How: ' + m.how, bx + 20, by + 160, bw - 40, 17);
      ctx.textAlign = 'center';
      const tb = { x: bx + 20, y: by + bh - 50, w: bw / 2 - 26, h: 36, go: () => { PAD.guide = m; overlay = null; } }, cb = { x: cx + 6, y: by + bh - 50, w: bw / 2 - 26, h: 36, go: () => { O.pick = null; } };
      pill(tb, 'Trace it', Wy.color); pill(cb, 'Back', C.muted);
      buttons = [tb, cb];
      return;
    }
    const close = { x: cx - 60, y: H - 46, w: 120, h: 34, go: () => { overlay = null; } };
    pill(close, 'Close', C.muted); buttons.push(close);
    return;
  }
  if (O.kind === 'learn') {
    const f = O.foe, m = O.move, Wy = WAYS[save.way];
    ctx.font = `${Math.min(30, W / 12)}px ${DISPLAY}`; ctx.fillStyle = C.gold; ctx.fillText(`${f.name} bows`, cx, H * 0.14);
    ctx.font = `14px ${BODY}`; ctx.fillStyle = C.fg; ctx.fillText(m ? 'and shows you a move of your way:' : 'You already know all twenty moves.', cx, H * 0.14 + 28);
    if (m) {
      const r = Math.min(W * 0.3, H * 0.18), M = { cx, cy: H * 0.14 + 60 + r, r }, cyc = O.demo.reduce((a, s) => a + s.dur, 0) + 0.2 * (O.demo.length - 1) + 1.4;
      paper(ctx, M);
      let tt = O.t % cyc; for (const s of O.demo) { inkStroke(ctx, M, s, C.sumi, tt); tt -= s.dur + 0.2; if (tt < 0) break; }
      glyphGuide(ctx, M, m, Wy.color, 0.35);
      let y = M.cy + r + 38;
      ctx.font = `${Math.min(28, W / 13)}px ${DISPLAY}`; ctx.fillStyle = Wy.color; ctx.fillText(m.name, cx, y);
      ctx.font = `13px ${BODY}`; ctx.fillStyle = C.muted; ctx.fillText(`${ROLE[m.role].label} · ${ROLE[m.role].cost} ki`, cx, y + 22);
      ctx.fillStyle = C.fg; ctx.font = `14px ${BODY}`; y = wrapText(moveWhat(m), cx, y + 46, Math.min(W - 40, 420), 19);
      ctx.fillStyle = C.paper; y = wrapText('How: ' + m.how, cx, y + 8, Math.min(W - 40, 420), 19);
    }
    if (O.t > 0.8) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(T * 4); ctx.font = `14px ${BODY}`; ctx.fillStyle = C.gold; ctx.fillText('Tap to carry on', cx, H - 30); ctx.globalAlpha = 1; buttons.push({ x: 0, y: 0, w: W, h: H, go: afterLearn }); }
    return;
  }
  if (O.kind === 'fallen') {
    const f = O.foe;
    ctx.font = `${Math.min(34, W / 11)}px ${DISPLAY}`; ctx.fillStyle = C.hp; ctx.fillText(`${f.name} wins this bout`, cx, H * 0.36);
    ctx.font = `15px ${BODY}`; ctx.fillStyle = C.fg;
    const tips = ['Watch what they write in the air above them: guard or spring away when a heavy blow is coming.', 'Out of ki? Your Focus move is free: write it to fill up fast.',
                  'Rough glyphs still work, only weaker. Clean ones hit full strength: open MOVES and trace one to practise.', `Your way beats ${WAYS[WAYS[save.way].beats].name}: try a fighter of that hall.`];
    wrapText(tips[(save.stats.falls - 1) % tips.length], cx, H * 0.36 + 34, Math.min(W - 40, 420), 21);
    if (O.t > 0.8) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(T * 4); ctx.font = `14px ${BODY}`; ctx.fillStyle = C.gold; ctx.fillText('Tap to try again', cx, H - 30); ctx.globalAlpha = 1; buttons.push({ x: 0, y: 0, w: W, h: H, go: afterFall }); }
    return;
  }
  if (O.kind === 'victory') {
    const Wy = WAYS[save.way], S = save.stats, mins = Math.max(1, Math.round(((S.t1 || Date.now()) - S.t0) / 60000));
    ctx.save(); ctx.strokeStyle = hexA(Wy.color, 0.25); ctx.lineWidth = 18; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, H * 0.3, Math.min(W, H) * 0.2, 2.4, 2.4 + TAU * 0.86 * Math.min(1, O.t / 1.5)); ctx.stroke(); ctx.restore();
    ctx.font = `${Math.min(36, W / 10)}px ${DISPLAY}`; ctx.fillStyle = C.gold; ctx.fillText('Grandmaster', cx, H * 0.3 - 6);
    ctx.font = `${Math.min(22, W / 16)}px ${DISPLAY}`; ctx.fillStyle = Wy.color; ctx.fillText(`of the Way of ${Wy.name}`, cx, H * 0.3 + 26);
    ctx.font = `15px ${BODY}`; ctx.fillStyle = C.fg;
    const lines = [`Every fighter in the dojo beaten, the Grandmaster too.`, `${mins} minute${mins === 1 ? '' : 's'} · ${S.falls} fall${S.falls === 1 ? '' : 's'} · ${S.casts} moves written · ${S.casts ? Math.round(100 * S.clean / S.casts) : 0}% clean`];
    lines.forEach((l, i) => ctx.fillText(l, cx, H * 0.56 + i * 24, W - 30));
    const b = { x: cx - 120, y: H * 0.56 + 70, w: 240, h: 48, go: () => { overlay = null; state = 'title'; choosing = true; pickWay = null; } };
    pill(b, 'Try another way', C.gold); buttons.push(b);
  }
}

// ── touch, mouse and keys ──
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  const x = e.clientX, y = e.clientY;
  if (overlay || state === 'title') { const b = [...buttons].reverse().find(b => hit(b, x, y)); if (b) { SFX.tap(); b.go(); } return; }
  const B = panelButtons();
  if (hit(B.moves, x, y)) { overlay = { kind: 'scroll', t: 0 }; SFX.tap(); return; }
  if (hit(B.sound, x, y)) { setSound(!soundOn); SFX.tap(); return; }
  if (TILT.on) { const b = tiltBubble(); if (Math.hypot(x - b.cx, y - b.cy) < b.r + 8) { TILT.relevel = true; SFX.tap(); return; } }
  if (inPad(x, y)) { if (!PAD.pen) { PAD.penId = e.pointerId; penDown(x, y, e); try { cv.setPointerCapture(e.pointerId); } catch (_) {} } return; }
  const inArena = x >= L.arena.x && x <= L.arena.x + L.arena.w && y >= L.arena.y && y <= L.arena.y + L.arena.h;
  if (inArena && !stick) { stick = { id: e.pointerId, x0: x, y0: y, x, y }; try { cv.setPointerCapture(e.pointerId); } catch (_) {} }
});
cv.addEventListener('pointermove', e => {
  if (PAD.pen && e.pointerId === PAD.penId) { const list = e.getCoalescedEvents ? e.getCoalescedEvents() : []; for (const ev of list.length ? list : [e]) penMove(ev.clientX, ev.clientY, evTime(ev), padPressure(ev)); }
  else if (stick && e.pointerId === stick.id) { stick.x = e.clientX; stick.y = e.clientY; }
});
const lift = e => { if (PAD.pen && e.pointerId === PAD.penId) penUp(); if (stick && e.pointerId === stick.id) stick = null; };
cv.addEventListener('pointerup', lift);
cv.addEventListener('pointercancel', lift);
cv.addEventListener('contextmenu', e => e.preventDefault());
// nothing on this page scrolls or zooms
for (const ev of ['touchstart', 'touchmove', 'touchend', 'gesturestart']) document.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
window.addEventListener('keydown', e => {
  keys[e.code] = true; audio();
  if (e.code === 'Escape' && overlay && overlay.kind === 'scroll') overlay = null;
  if ((e.code === 'KeyM' || e.code === 'Tab') && state === 'play' && !overlay) { overlay = { kind: 'scroll', t: 0 }; e.preventDefault(); }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; stick = null; });

// ── the loop ──
let last = performance.now(), MANUAL = false;
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  try { if (!MANUAL) update(dt); render(); } catch (err) { console.error(err); }
}
// if the page is updated while it's open, come back to the dojo rather than to the title
const hot = window.claude && window.claude.hot;
try { if (hot && hot.snapshot) hot.snapshot(() => ({ playing: state === 'play' })); } catch (_) {}
function boot(data) {
  if (data && data.playing === true) { const s = loadSave(); if (s) { save = s; continueGame(); } }
  requestAnimationFrame(frame);
}
if (hot && hot.ready) hot.ready(boot); else boot(hot && hot.data || {});

// ── for tests: start a way, write a move as a steady hand would, step time by hand ──
window.INKDOJO = {
  get state() { return state; }, get overlay() { return overlay; }, get fight() { return FIGHT; }, get player() { return player; }, get foes() { return FOES; }, get master() { return MASTERF; }, get save() { return save; },
  begin(way) { beginGame(way); }, cont() { save = loadSave(); continueGame(); },
  write(role, o = {}) { const m = MOVES[save.way].find(m => m.role === role); return padJudge(writeOut(m, { wobble: 0.01, ...o })); },
  manual(on) { MANUAL = on; }, step(n = 1, dt = 1 / 60) { for (let i = 0; i < n; i++) update(dt); },
  tapOverlay() { const b = buttons[buttons.length - 1]; if (b) b.go(); }, close() { overlay = null; },
  teleport(x, y) { player.x = x; player.y = y; updateCam(0, true); },
  koFoe() { if (FIGHT && FIGHT.on) knockedOut(FIGHT.foe, player); }, koMe() { if (FIGHT && FIGHT.on) knockedOut(player, FIGHT.foe); },
  get tilt() { return TILT; }, tiltBubble,
  INK, ROLE, ROSTER, MOVES, learnedCount, myMoves, padJudge, startFight, setSound, spawnMaster, setupWorld, get shots() { return SHOTS; }, get waves() { return WAVES; },
};
})();
</script>
