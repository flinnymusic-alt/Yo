// convex hull (monotone chain); points keep their tower reference if they have one
function hull(pts) {
  const p = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  if (p.length < 3) return p;
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lo = [], hi = [];
  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (hi.length >= 2 && cross(hi[hi.length - 2], hi[hi.length - 1], q) <= 0) hi.pop(); hi.push(q); }
  return lo.slice(0, -1).concat(hi.slice(0, -1));
}
function polyArea(poly) {
  let a = 0;
  for (let i = 0; i < poly.length; i++) { const p = poly[i], q = poly[(i + 1) % poly.length]; a += p.x * q.y - q.x * p.y; }
  return Math.abs(a) / 2;
}
function inPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) inside = !inside;
  }
  return inside;
}
// the corners of the field behind a team's base: its shape always reaches back to them
function backPts(team) {
  if (three()) { const a = TEAM_ANGLE3[team], r = ROUND_R * 1.15; return [-1, 1].map(s => ({ x: Math.cos(a + s * Math.PI / 3) * r, y: Math.sin(a + s * Math.PI / 3) * r })); }
  const sx = (team === 'blue' ? -1 : 1) * ARENA_W;
  return [{ x: sx, y: -ARENA_H }, { x: sx, y: ARENA_H }];
}
function teamShape(team, extra, without) {
  const pts = towersOf(team).filter(t => t !== without).map(t => ({ x: t.x, y: t.y, t }));
  if (extra) pts.push(extra);
  pts.push(...backPts(team));
  return hull(pts);
}

function computeTerritory() {
  const tw = {}, cnt = {};
  for (const team of TEAMS) { hulls[team] = teamShape(team); tw[team] = towersOf(team); cnt[team] = 0; }
  const nearest = (list, x, y) => { let m = Infinity; for (const t of list) { const d = Math.hypot(t.x - x, t.y - y); if (d < m) m = d; } return m; };
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    const k = j * COLS + i;
    if (!inOval[k]) { terr[k] = 0; continue; }
    const c = cellCenter(i, j), inside = [];
    for (const team of TEAMS) if (inPoly(c.x, c.y, hulls[team])) inside.push(team);
    let v = inside.length === 1 ? TEAM_CODE[inside[0]] : 0;
    if (inside.length > 1) {
      // where shapes overlap, the ground goes to whoever's tower is nearer
      let best = Infinity;
      for (const team of inside) { const d = nearest(tw[team], c.x, c.y); if (d < best) { best = d; v = TEAM_CODE[team]; } }
    }
    terr[k] = v;
    if (v) cnt[CODE_TEAM[v]]++;
  }
  for (const team of TEAMS) teams[team].cells = cnt[team];
  // the lines joining each side's towers (the edge of its shape) are laser walls
  links = [];
  for (const team of TEAMS) {
    const h = hulls[team];
    for (let i = 0; i < h.length; i++) {
      const a = h[i], c = h[(i + 1) % h.length];
      if (a.t && c.t) links.push({ a: a.t, b: c.t, team });
    }
  }
}

// Turrets go anywhere open: neutral ground or your own, not the enemy's,
// and not on top of a tree, rock or another building.
function canBuildAt(x, y, team = 'blue') {
  const own = cellOwner(x, y);
  if (own === -1 || (own && own !== TEAM_CODE[team])) return false;
  if (!inArena(x, y, 26)) return false;
  if (solidsNear(x, y).some(o => Math.hypot(o.x - x, o.y - y) < o.r + 22)) return false;
  // (a duel's wizard stand-in isn't a building, so it never blocks its own turret)
  return !allUnits().some(u => !u.dead && u.structure && !u.proxyOf && Math.hypot(u.x - x, u.y - y) < u.r + 30);
}

function buildTurret(team, x, y, elem) {
  { const S = stats(team); if (S) S.turret[elem] = (S.turret[elem] || 0) + 1; }
  addUnit(team, 'turret', x, y, elem);
  computeTerritory();
  ring(x, y, 120, TEAM_COLOR[team], 0.8);
  burst(x, y, TEAM_COLOR[team], 30, 260);
  SFX.summon();
  news('built', team, null, elem, 2.5);
}
function buildTitan(team, elem) {
  { const S = stats(team); if (S) S.titan[elem] = (S.titan[elem] || 0) + 1; }
  const p = homePt(team, 120, rnd(-60, 60)), u = addUnit(team, 'titan', p.x, p.y, elem);
  u.laneY = rnd(-200, 200); u.lane = rnd(-1, 1);
  SFX.awaken();
  news('titan', team, null, elem, 2.5);
}

// A computer team's build turn: a turret on the open spot that adds the most
// ground, or a titan when there's nowhere worth building.
function aiBuild(team) {
  const T = teams, sk = aiSkill();
  const base = polyArea(hulls[team]), opts = [];
  for (let k = 0, n = Math.round(20 + 60 * sk); k < n; k++) {
    const i = Math.floor(Math.random() * COLS), j = 1 + Math.floor(Math.random() * (ROWS - 2));
    if (terr[j * COLS + i] !== 0) continue;
    const c = cellCenter(i, j);
    if (!canBuildAt(c.x, c.y, team)) continue;
    opts.push({ c, g: polyArea(teamShape(team, c)) - base });
  }
  opts.sort((a, b) => b.g - a.g);
  // a sharp commander takes the best spot; a weaker one takes one of the better ones
  let best = opts.length ? opts[Math.min(opts.length - 1, Math.floor(Math.random() * Math.max(1, opts.length * (1 - sk) * 0.8)))] : null;
  if (best && best.g < 12000) best = null;
  // ground is worth 140: build when the land race is close or lost; when it's
  // safely won, a sharp commander sends a titan to press for points instead
  const rivalCells = Math.max(...TEAMS.filter(t => t !== team).map(t => T[t].cells));
  const safeLand = T[team].cells > rivalCells * 1.15;
  if (best && safeLand && Math.random() < sk * 0.7) best = null;
  // pick the element that counters what's out there (sharper = more often)
  const enemy = enemiesOf(team).filter(u => !u.dead && u.elem && !u.proxyOf);
  const army = enemy.filter(u => !u.structure), towers = enemy.filter(u => u.kind === 'turret');
  const elem = Math.random() < sk ? (counterTo(best ? army : towers) || ELEM_CYCLE[Math.floor(Math.random() * 5)]) : ELEM_CYCLE[Math.floor(Math.random() * 5)];
  if (best) buildTurret(team, best.c.x, best.c.y, elem);
  else buildTitan(team, elem);
}

// put a team's sigil somewhere in its own ground, away from its base
function placeSigil(team) {
  const want = TEAM_CODE[team], nx = nexusOf(team), cells = [];
  for (let j = 1; j < ROWS - 1; j++) for (let i = 0; i < COLS; i++) {
    if (terr[j * COLS + i] !== want) continue;
    const c = cellCenter(i, j);
    if (nx && Math.hypot(c.x - nx.x, c.y - nx.y) < 280) continue;
    if (blockedForFoot(c.x, c.y, 24)) continue;
    cells.push(c);
  }
  const c = cells.length ? cells[Math.floor(Math.random() * cells.length)] : homePt(team, 320, rnd(-200, 200));
  const s = addUnit(team, 'sigil', c.x + rnd(-25, 25), c.y + rnd(-25, 25));
  s.wall = SIGIL_WALL;
  ring(s.x, s.y, 60, TEAM_COLOR[team], 0.8);
  news('newsigil', team, null, null, 3);
}

function evenMix() { return Object.fromEntries(MINION_KINDS.map(k => [k, 1 / MINION_KINDS.length])); }

function startBattle(diff, list = ['blue', 'red'], guests = []) {
  setMode('battle');
  setArena(list);
  difficulty = diff;
  resetPlayer();
  clearCombat();
  curSide = 'blue';
  sideFx = { blue: newFx(), red: newFx(), green: newFx() };
  loadFx('blue');
  const fp = fountainPos();
  player.x = fp.x; player.y = fp.y; player.face = { x: 1, y: 0 };
  units = { blue: [], red: [], green: [] }; unitsVer++;
  foes = []; friends = units.blue; bshots = []; links = [];
  chests = []; scrolls = []; boat.x = boat.y = 1e6;
  discovered = new Set();
  bossesDown = 0; kills = 0; score = 0; elapsed = 0; tally = {}; masterHunter = false;
  banner = null; castMsg = null; reveal = null; wonShown = false;
  seq = []; curNode = null;
  // Every level starts with the same army; the commander is what changes (see aiBrain).
  // Very Hard gives the computer more (VH_EDGE); AI_UNIT tunes Hard and Very Hard.
  teams = {
    buildElem: 'fire', // the element of your next turret or titan
    order: 'spread', // your army: 'spread' pushes on its own, 'follow' sticks with you
    orders: { minion: 'attackTurrets', titan: 'attackTurrets' }, // what each group does when spread out
    time: MATCH_TIME, terrRecalc: 0,
    build: { team: TEAMS[0], t: buildEvery() }, pending: null, pendingG: {}, result: null,
    breakdown: {}, stats: newStats(), tally: {}, bonus: {}, skins: {},
    eclipse: planEclipses(),
  };
  for (const team of TEAMS) {
    teams[team] = { score: 0, cells: 0, wave: 4, minions: 10, wizards: 2, wizQ: [], sigilT: 0, mix: evenMix(), turn: 0,
                    brain: null, focus: new Map(), used: new Set(), ultCd: 30, leadMage: null, leader: null,
                    order: 'spread', orders: { minion: 'attackTurrets', titan: 'attackTurrets' }, buildElem: 'fire' };
    teams.breakdown[team] = {}; teams.tally[team] = 0; teams.bonus[team] = 0;
  }
  // the players: you, and any friends who joined; a team nobody plays is the computer's
  hostP.heroId = 'host'; hostP.team = 'blue';
  heroes = [{ id: 'host', team: 'blue', p: hostP, proxy: heroProxy('host', 'blue') }];
  for (const g of guests) addHero(g.id, g.team, g.skin);
  for (const h of heroes) units[h.team].push(h.proxy);
  if (diff === 'vhard') for (const team of TEAMS) if (isAI(team)) { teams[team].minions = Math.round(10 * VH_EDGE.minions); teams[team].wizards = VH_EDGE.wizards; }
  eclipseSeen = {};
  for (const team of TEAMS) {
    const b = homePt(team, 0);
    addUnit(team, 'nexus', b.x, b.y);
    // three turrets on the front line: the middle one a little forward so every one holds ground
    const els = ELEM_CYCLE.slice().sort(() => Math.random() - 0.5), d = teamDir(team);
    let spots;
    if (three()) {
      const a = TEAM_ANGLE3[team], at = (ang, r) => ({ x: Math.cos(ang) * r, y: Math.sin(ang) * r });
      spots = [at(a - 0.75, 760), at(a, 450), at(a + 0.75, 760)];
    } else {
      const edgeY = ARENA_H * Math.sqrt(1 - (FRONT_X / WORLD) ** 2) - 30; // just inside the oval's rim
      spots = [{ x: d.x * FRONT_X, y: -edgeY }, { x: d.x * (FRONT_X - 70), y: 0 }, { x: d.x * FRONT_X, y: edgeY }];
    }
    spots.forEach((p, i) => addUnit(team, 'turret', p.x, p.y, els[i]));
    const n = teams[team].wizards;
    for (let i = 0; i < n; i++) { const p = homePt(team, 130, (i - (n - 1) / 2) * 110); addUnit(team, 'wizard', p.x, p.y, ELEM_CYCLE[(i * 2 + TEAMS.indexOf(team)) % 5]); }
  }
  unitsVer++; setViews('blue');
  computeTerritory();
  for (const team of TEAMS) placeSigil(team);
  state = 'play';
  showBanner(collisionLine(), `${{ easy: 'Easy', medium: 'Medium', hard: 'Hard', vhard: 'Very Hard' }[diff]} · most points in 5 minutes preserves your universe`, 4.5);
}

// Who a unit fights: the nearest opponent it can see (walled sigils and bases are ignored).
function findTarget(u) {
  const opp = targetsFor(u.team);
  let best = null, bd = u.def.aggro;
  if (smartRed(u) && sharp(u)) {
    let bs = -Infinity;
    for (const o of opp) {
      if (o.dead || (o.unit && shielded(o))) continue;
      const d = Math.hypot(o.x - u.x, o.y - u.y) - (o.r || PLAYER_R);
      if (d > bd) continue;
      const sc = smartScore(u, o, d);
      if (sc > bs) { bs = sc; best = o; }
    }
    u.lastTgt = best;
    return best;
  }
  for (const o of opp) {
    if (o.dead || (o.unit && shielded(o))) continue;
    const d = Math.hypot(o.x - u.x, o.y - u.y) - (o.r || PLAYER_R);
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}

// A team's army stance, orders and leader are set by its players; the
// computer's armies always spread out and attack.
function teamStance(team) { return !teams || isAI(team) ? 'spread' : team === 'blue' ? teams.order : teams[team].order; }
function teamOrders(team) { return !teams || isAI(team) ? null : team === 'blue' ? teams.orders : teams[team].orders; }
// who a following army sticks with: whoever last called it, else the team's first player
function teamLeader(team) {
  const T = teams[team], h = (T && T.leader && heroById(T.leader)) || humansOn(team)[0];
  if (!h || h.gone) return null;
  return h.p === hostP ? (state === 'play' ? hostP : null) : (h.p.dead ? null : h.p);
}

function orderFor(u) {
  const ords = teamOrders(u.team);
  if (!ords) return 'attackTurrets';
  if (isMinion(u)) return ords.minion;
  if (u.kind === 'titan') return ords.titan;
  return 'attackTurrets';
}

// Where a guard stands: by the base, or by the turret most under threat
// (or the one furthest forward when none is).
function guardPost(u, what) {
  const home = nexusOf(u.team);
  if (what === 'base' || !teamList(u.team).some(t => t.kind === 'turret' && !t.dead)) return home;
  const enemies = enemiesOf(u.team).filter(o => !o.dead && !o.structure);
  let best = null, score = -Infinity;
  const d = teamDir(u.team);
  for (const t of teamList(u.team)) {
    if (t.kind !== 'turret' || t.dead) continue;
    const near = enemies.filter(o => Math.hypot(o.x - t.x, o.y - t.y) < 450).length;
    const sc = near * 1000 - (t.x * d.x + t.y * d.y) * 0.5 - Math.hypot(t.x - u.x, t.y - u.y) * 0.1;
    if (sc > score) { score = sc; best = t; }
  }
  return best || home;
}

// Where a unit heads when nothing is in reach: the nearest enemy sigil
// (unless walled), otherwise the nearest enemy turret, otherwise a base.
function objectiveFor(u) {
  if (smartRed(u)) { const o = smartObjective(u); if (o) return o; }
  const enemy = enemiesOf(u.team).filter(o => !o.dead && o.structure && !o.proxyOf && !shielded(o));
  const nearest = kind => {
    let best = null, bd = Infinity;
    for (const o of enemy) { if (o.kind !== kind) continue; const d = Math.hypot(o.x - u.x, o.y - u.y); if (d < bd) { bd = d; best = o; } }
    return best;
  };
  if (orderFor(u) === 'attackBase') { const nx = nearest('nexus'); if (nx) return nx; }
  if (u.kind !== 'titan') { const sig = nearest('sigil'); if (sig) return sig; }
  return nearest('turret') || nearest('nexus'); // no turrets left: go for a base
}

function unitAttack(u, tgt) {
  if (u.cd > 0 || u.hex > 0 || u.def.passive) return;
  if (!eclipseMult(u.elem)) { u.cd = 0.3; return; } // eclipsed: it can't fight
  u.cd = u.def.cd;
  const atk = tiredAtk(u) * (u.power || 1) * resDmgOut(u.team, tgt.team);
  if (isMinion(u)) u.tired = Math.min(1, (u.tired || 0) + TIRE_PER_SWING);
  if (u.def.ranged) {
    const dx = tgt.x - u.x, dy = tgt.y - u.y, d = Math.hypot(dx, dy) || 1;
    const big = u.structure, sp = big ? 360 : 420;
    const boom = u.kind === 'wizard' && Math.random() < 0.2 ? 70 : 0; // wizards sometimes throw a fireball
    const small = u.kind === 'archer';
    const oy = u.kind === 'turret' ? -u.r * 1.35 : 0; // turrets fire from their crystal
    bshots.push({ team: u.team, src: u.elem, elem: u.elem, x: u.x + dx / d * u.r, y: u.y + oy + dy / d * u.r, vx: dx / d * sp, vy: dy / d * sp,
                  dmg: u.def.dmg * atk * (boom ? 1.3 : 1), r: big ? 9 : boom ? 9 : small ? 4 : 6, life: 1.8, boom, arrow: small,
                  color: TYPE_COLOR[u.elem] || TEAM_COLOR[u.team], spin: rnd(0, TAU) });
    u.fireFlash = 0.18;
    return;
  }
  if (u.kind === 'titan') {
    // the slam lands a beat after the swing starts
    u.slamT = 0.5;
    u.slamAt = { x: tgt.x, y: tgt.y, tgt };
    return;
  }
  hitUnit(tgt, u.def.dmg * atk * matchup(u.elem, tgt), u.team);
}

function titanSlam(u) {
  const { x, y, tgt } = u.slamAt;
  const pw = (u.power || 1) * resDmgOut(u.team, tgt && tgt.team) * eclipseMult(u.elem);
  if (!pw) { u.slamAt = null; return; }
  if (tgt && !tgt.dead) hitUnit(tgt, u.def.dmg * pw * matchup(u.elem, tgt), u.team);
  // everything of the other sides nearby gets hit too
  const opp = targetsFor(u.team);
  for (const o of opp) if (o !== tgt && !o.dead && Math.hypot(o.x - x, o.y - y) < u.def.splash) hitUnit(o, u.def.dmg * 0.5 * pw * matchup(u.elem, o), u.team);
  ring(x, y, u.def.splash, TYPE_COLOR[u.elem] || TEAM_COLOR[u.team], 0.35);
  ring(x, y, u.def.splash * 0.5, '#d8c8a0', 0.25);
  if (u.elem) elemHit(u.elem, x, y, 2.6);
  for (let i = 0; i < 14; i++) {
    const a = rnd(0, TAU), sp = rnd(60, 180);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.5, r: rnd(3, 6), life: 1, decay: rnd(1.5, 2.5), color: '#8a7a5e' });
  }
  shake = Math.max(shake, 5);
  SFX.explode(false);
  u.slamAt = null;
}

// Damage from units, towers and laser walls (`by` is the team it counts for).
// Your own spells go through damageFoe.
function hitUnit(t, dmg, by) {
  if (t === player) { if (by) player.lastHitBy = by; hurtPlayer(dmg); return; }
  if (t.proxyOf) { const h = heroOf(t); if (!t.dead && h) { if (by) h.lastHitBy = by; hurtPlayer(dmg, h); } return; }
  if (t.kind === 'critter') { t.hp -= dmg; burst(t.x, t.y, '#ccc', 4, 100); if (t.hp <= 0) t.life = 0; return; }
  if (t.dead) return;
  if (by) t.lastHitBy = by;
  if (shielded(t)) {
    if (t.txtCd <= 0) { floatText(t.x, t.y - t.r - 10, shieldText(t), '#bde', 13); t.txtCd = 0.8; }
    return;
  }
  t.hp -= minionHit(t, mageGuard(t, dmg)) * (t.unit ? resDmgIn(t.team, by) : 1);
  t.flash = 0.12;
  if (t.hp <= 0) unitFell(t);
}

// which team brought something down (in a two-team match, simply the other one)
function killerOf(o, team) {
  const by = o.lastHitBy;
  if (by && by !== team && TEAMS.includes(by)) return by;
  return TEAMS.length === 2 ? otherTeam(team) : null;
}

// A unit is gone. The team that brought it down scores for it.
function unitFell(u) {
  if (u.mage && u.mage.phoenix > 0) {
    // a computer wizard's Phoenix: back up once, in flames
    u.mage.phoenix = 0; u.hp = u.maxHp;
    burst(u.x, u.y, '#ffb04a', 50, 420);
    floatText(u.x, u.y - 50, 'PHOENIX!', '#ff8a3a', 18);
    return;
  }
  u.dead = true;
  const by = killerOf(u, u.team);
  if (by) {
    if (u.kind === 'sigil') { teamScore(by, u.def.pts, u.x, u.y - u.r - 20, 'Sigils'); const S = stats(by); if (S) S.sigils++; }
    else if (u.kind !== 'nexus') scoreKill(by, isMinion(u) ? 'minion' : u.kind, u.x, u.y - u.r - 20);
  }
  burst(u.x, u.y, TEAM_COLOR[u.team], u.structure ? 60 : 14, u.structure ? 420 : 240);
  if (u.kind === 'wizard') teams[u.team].wizQ.push({ t: 12 });
  if (u.kind === 'sigil') {
    teams[u.team].sigilT = 3;
    shake = Math.max(shake, 10);
    SFX.bossDown();
    news('sigil', u.team, by, null, 3);
    if (by) teams.bonus[by] = (teams.bonus[by] || 0) + 1;
  }
  if (u.kind === 'nexus') { battleOver(u.team, by); return; }
  if (u.kind === 'turret') {
    shake = Math.max(shake, 12);
    SFX.explode(true);
    computeTerritory();
    news('turret', u.team, by, null, 3);
  }
}

// who'd get the ground bonus right now (null if the top is shared)
function groundLeader() {
  if (!teams) return null;
  let best = null, bc = -1, tie = false;
  for (const t of TEAMS) { const c = teams[t].cells; if (c > bc) { best = t; bc = c; tie = false; } else if (c === bc) tie = true; }
  return tie ? null : best;
}
// how a team did: a win (the top score alone), a draw (sharing it), or a loss
function resultFor(team) {
  const top = Math.max(...TEAMS.map(t => teams[t].score)), mine = teams[team].score;
  if (mine < top) return 'lose';
  return TEAMS.filter(t => teams[t].score === top).length > 1 ? 'draw' : 'win';
}

// The match ends when the clock runs out or a base falls. Destroying a base
// scores 100; the 140 for the most ground is paid now; then most points wins.
function battleOver(baseFell, by) {
  if (state !== 'play' && state !== 'dead') return;
  if (baseFell && by) { teams[by].score += BASE_BONUS; bookScore(by, 'Base', BASE_BONUS); }
  computeTerritory();
  if (teams.stats) teams.stats.land.push([Math.round(MATCH_TIME - teams.time), ...TEAMS.map(t => teams[t].cells)]);
  const g = groundLeader();
  if (g) { teams[g].score += GROUND_BONUS; teams.groundTo = g; bookScore(g, 'Most ground', GROUND_BONUS); }
  teams.endedBy = baseFell ? 'base' : 'time';

const heroById = id => heroes.find(h => h.id === id);

// the other players' wizards that are up, for the map
function otherHeroes() {
  if (net.role === 'guest') return guestOthers.filter(o => !o.dead);

const HERO_LOOK = { blue: ['#2d4a7a', '#3a7bc0'], red: ['#7a2d2d', '#c03a3a'], green: ['#2d6a4a', '#3ac07a'] };
function addHero(id, team, skin) {
  const keep = player;
  player = {};
  resetPlayer();
  const p = player;
  player = keep;
  const fp = fountainPos(team), d = teamDir(team);
  Object.assign(p, { heroId: id, team, x: fp.x, y: fp.y, face: { x: -d.x, y: -d.y }, tp: 0, robe: HERO_LOOK[team][0], hat: HERO_LOOK[team][1], book: new Set(), seq: [] });
  if (skin) p.look = skin;

// a stand-in so units, towers and spells can target and hit a player's wizard

  return { unit: true, proxyOf: of, team, kind: 'hero', def: { mult: {}, pts: 10, name: 'Wizard', reach: 0 }, structure: true, r: PLAYER_R, hp: 1, maxHp: 1, x: 0, y: 0, dead: false, txtCd: 0 };

// someone to run a side's spells as: you for blue, else one of its players, else its lead computer wizard
function casterFor(team) {

}

// each side's live spells: its shots, helpers, traps, pools, waves, meteors and storms
const newFx = () => ({ shots: [], allies: [], traps: [], zones: [], waves: [], meteors: [], storms: [] });
let sideFx = { blue: newFx(), red: newFx(), green: newFx() };

// Run fn as another side, or as another wizard: their wizard is "player", the
// other teams' units are the targets, and their own spells, helpers and pools
// are the live lists.
function withSide(side, fn, caster) {
  if (mode !== 'battle' || !teams || net.role === 'guest' || !TEAMS.includes(side)) return fn();
  const prevSide = curSide, prevPlayer = player, prevBook = discovered, prevSeq = seq;
  const swap = side !== prevSide, as = !!caster && caster !== player;
  if (swap) { stashFx(prevSide); loadFx(side); curSide = side; setViews(side); }
  if (as) { player = caster; discovered = caster.book || (caster.book = new Set()); seq = caster.seq || (caster.seq = []); }
  try { return fn(); }
  finally {
    if (as) { caster.seq = seq; player = prevPlayer; discovered = prevBook; seq = prevSeq; }
    if (swap) { stashFx(side); loadFx(prevSide); curSide = prevSide; setViews(prevSide); }
  }
}

// A friend's name as you'd say it ("Friend 1"), or the host
const heroName = id => (id === 'host' ? 'The host' : 'Friend ' + String(id).slice(1));
const DIFF_NAME = { easy: 'Easy', medium: 'Medium', hard: 'Hard', vhard: 'Very Hard' };
// Who plays on which team, as one player sees it: their own team is blue,
// and the team that's blue for the host takes their team's colour.
function rosterLines(meId, list, players, diff) {
  const me = players.find(p => p.id === meId), mine = me ? me.team : 'blue';
  const lab = t => (t === mine ? 'blue' : t === 'blue' ? mine : t);
  const who = id => (id === meId ? 'you' : id === 'host' ? 'the host' : heroName(id));
  return list.map(t => {
    const ps = players.filter(p => p.team === t).map(p => who(p.id));
    return { team: lab(t), mine: t === mine, text: ps.length ? ps.join(' & ') : `the computer (${DIFF_NAME[diff] || 'Medium'})` };
  }).sort((a, b) => TEAM_CODE[a.team] - TEAM_CODE[b.team]);
}

// The host starts the battle for everyone who joined (see the lobby below).
function startHostedBattle() {
  const L = lobby, list = L.three ? ['blue', 'red', 'green'] : ['blue', 'red'];
  if (!L.links.length) return;
  for (const l of L.links) if (!list.includes(l.team)) l.team = 'red';
  net.role = 'host'; versus = true; net.sendT = 0;
  net.send = m => { for (const l of lobby.links) l.send(m); };
  L.started = true;
  startBattle(L.diff, list, L.links.map(l => ({ id: l.id, team: l.team, skin: l.skin })));
  netEvents = []; // (the opening news is in each player's own start banner)
  unitSeq = 0; for (const t of TEAMS) for (const u of units[t]) if (!u.proxyOf) u.id = ++unitSeq;
  for (const h of heroes) if (h.p !== hostP && h.team !== 'blue' && h.p.look) teams.skins[h.team] = h.p.look;
  rivalP = (heroById('g1') || {}).p || null;

// a friend's wizard fell: back at their fountain in 5 seconds
function heroDown(p) {
  const h = heroById(p.heroId);
  if (!h) return;
  p.hp = 0; p.dead = true; p.respawnT = 5;
  h.proxy.dead = true;
  p.charging = null; p.loaded = null;
  burst(p.x, p.y, TEAM_COLOR[h.team], 30, 260);
  const by = killerOf(p, h.team);
  if (by) scoreKill(by, 'hero', p.x, p.y - 30);
  if (by === 'blue' && h.team !== 'blue') showBanner(`You defeated ${heroName(h.id)}’s wizard! +10`, '', 2.5);
  tellHero(h.id, ['you-fell']);
}

// friends' wizards: respawning, mana, buffs
function updateHeroes(dt) {
  for (const h of heroes) {
    const p = h.p;
    if (p === hostP || h.gone) continue;
    if (p.dead) {
      p.respawnT -= dt;
      if (p.respawnT <= 0) {
        const tp = (p.tp || 0) + 1;
        withSide(h.team, () => { resetPlayer(); }, p);
        const fp = fountainPos(h.team), d = teamDir(h.team);
        Object.assign(p, { dead: false, invuln: 2, tp, x: fp.x, y: fp.y, face: { x: -d.x, y: -d.y } });
      }
    }
    if (!p.dead) withSide(h.team, () => heroTimers(dt), p);
  }
  syncProxies();
}

// A friend's actions arrive here, tagged with who sent them (positions are in
// the host's coordinates).
function hostReceive(m, id) {

        if (fl > 0.01) p.face = { x: fx / fl, y: fy / fl };

    case 'fire': if (!p.dead) R(fireLoaded); break;
    case 'arrow': if (!p.dead && num(m.x) !== null && num(m.y) !== null) R(() => shootArrow(m.x, m.y)); break;
    case 'build':
      if (teams.pendingG[id] && !p.dead && teams.time > BUILD_CLOSE) {
        const elem = ELEM_CYCLE.includes(m.elem) ? m.elem : 'fire';
        if (m.key === 'turret') {

        } else { buildTitan(team, elem); delete teams.pendingG[id]; }
      }

      break;

    case 'orders': if ((m.grp === 'minion' || m.grp === 'titan') && ORDER_OPTS.some(o => o[0] === m.v)) (own ? teams.orders : TT.orders)[m.grp] = m.v; break;

    case 'bye': friendLeft(id); break;

// Someone left. On the host: a friend (the computer takes over their team if
// nobody else is on it). On a friend's phone: the host, which ends the battle.
function friendLeft(id) {
  if (net.role === 'host' || lobby.role === 'host') {
    const l = lobby.links.find(x => x.id === id);
    if (l) { lobby.links = lobby.links.filter(x => x !== l); try { l.close(); } catch (_) {} }
    if (!lobby.started) { renderRoom(); sendRoom(); return; }
    const h = heroById(id);
    if (!h || h.gone) return;
    h.gone = true; h.proxy.dead = true; h.p.dead = true; h.p.respawnT = 1e9;
    if (teams) delete teams.pendingG[id];
    if (state === 'won' || state === 'lost') return;
    const left = humansOn(h.team).length;
    showBanner(`${heroName(id)} left`, left ? 'The rest of their team carries on' : `The computer takes over ${TEAM_NAME[h.team].toLowerCase()}`, 3);
    return;
  }
  // the host is gone
  const playing = versus, over = state === 'won' || state === 'lost';
  leaveOnline(true);
  if (playing) {
    // (after the end, the report stays up; mid-battle, back to the menu with word of why)
    if (!over) { state = 'title'; menuPage = 'main'; openLobby(); lobbyStatus('The host left, so the battle ended.'); }
  } else {
    hangUp();
    lobbyStatus('The host closed the game.');
    renderRoom();
  }
}

// ── the live picture the host sends ──

    tr: all('traps').map(t => [Math.round(t.x), Math.round(t.y), t.arm > 0 ? 1 : 0, t.spec ? t.spec.elem : '']),

// ── a friend's phone: a copy of the battle, turned so their own team is blue ──
// The picture is reflected across the line halfway between the friend's base
// and blue's, so their base lands where blue's is; their team and blue swap
// names and any third team keeps its own. (In a two-team battle on the red
// side this is the old left-right mirror.) A reflection is its own inverse,
// so the same turn takes positions back to the host.
let guestUnits = new Map();

function viewFor(team, list) {
  if (team === 'blue') return { team, on: false, ux: 0, uy: 1 };
  const a = list.length === 3 ? TEAM_ANGLE3[team] : 0, axis = (a + Math.PI) / 2, tidy = v => Math.round(v * 1e9) / 1e9;
  return { team, on: true, ux: tidy(Math.cos(axis)), uy: tidy(Math.sin(axis)) };
}
function V(x, y) {
  if (!view.on) return { x, y };
  const d = 2 * (x * view.ux + y * view.uy);
  return { x: d * view.ux - x, y: d * view.uy - y };

const relabel = t => (t === view.team ? 'blue' : t === 'blue' ? view.team : t);
// the field's trees and rocks get the same turn (and are turned back afterwards)
let arenaTurned = null;
function turnArena(v) {
  const flip = A => {
    for (const o of A.list) { const d = 2 * (o.x * A.ux + o.y * A.uy); o.x = d * A.ux - o.x; o.y = d * A.uy - o.y; }
    A.grid.clear();
    for (const [k, g] of buildGrid(A.list)) A.grid.set(k, g);
  };
  if (arenaTurned) { flip(arenaTurned); arenaTurned = null; }
  if (v && v.on) { arenaTurned = { ux: v.ux, uy: v.uy, list: arenaSolids, grid: arenaGrid }; flip(arenaTurned); }

function startGuestBattle(m) {
  const list = Array.isArray(m.list) && (m.list.length === 2 || m.list.length === 3) ? m.list.slice() : ['blue', 'red'];
  const myTeam = list.includes(m.team) ? m.team : 'red';
  net.role = 'guest'; versus = true; net.myId = m.id; net.ordT = 0;
  setMode('battle'); setArena(list);
  Object.assign(view, viewFor(myTeam, list)); turnArena(view);
  difficulty = m.diff || 'easy';
  units = { blue: [], red: [], green: [] }; unitsVer++; heroes = []; curSide = 'blue';
  hostP.team = 'blue'; hostP.heroId = m.id;
  resetPlayer(); clearCombat();
  const fp = fountainPos(); player.x = fp.x; player.y = fp.y; player.face = { x: 1, y: 0 }; player.tp = 0;
  foes = []; friends = []; bshots = []; links = []; chests = []; scrolls = []; boat.x = boat.y = 1e6;
  discovered = new Set(); score = 0; elapsed = 0; kills = 0;
  teams = {
    time: MATCH_TIME, terrRecalc: 0, build: { team: 'blue', t: BUILD_EVERY }, pending: null, pendingO: null, result: null,
    order: 'spread', orders: { minion: 'attackTurrets', titan: 'attackTurrets' }, buildElem: 'water', skins: {}, tally: {},
  };
  for (const t of TEAMS) teams[t] = { score: 0, cells: 0, minions: 10, mix: evenMix() };
  guestUnits = new Map(); guestOthers = []; eclipseSeen = {};
  banner = null; castMsg = null; seq = []; curNode = null;
  const box = document.getElementById('lobby');

function unpackHero(h, into) {
  Object.assign(into, {
    hp: h.hp, maxHp: h.mhp, mana: h.mana, maxMana: h.mm, invuln: h.inv,
    charging: h.ch ? { key: h.ch[0], t: h.ch[1], max: h.ch[2] } : null,
    loaded: h.ld ? { key: h.ld[0], left: h.ld[1] } : null,
    dead: h.dead,
  });

  return into;
}

function guestReceive(m) {
  if (!m || m.t === 'bye') { friendLeft(); return; }

  const at = (x, y) => V(x, y), canon = i => CODE_TEAM[i + 1];

  const mine = m.hs.find(h => h[0] === net.myId);

    const me = mine[4];

    unpackHero(me, player);
    if (me.tp !== player.tp || me.dead) { const q = at(me.x, me.y); player.x = q.x; player.y = q.y; player.tp = me.tp; } // respawned or blinked
    if (me.dead) { if (state === 'play') { state = 'dead'; } overlayT = 5 - me.rt; }
    else if (state === 'dead') state = 'play';

  // the other players' wizards, and the looks of their teams
  teams.skins = {};

    const t = relabel(team);

    const q = at(pk.x, pk.y), f = at(pk.fx, pk.fy);
    if (!o) o = { heroId: id, x: q.x, y: q.y };
    unpackHero(pk, o);
    Object.assign(o, { team: t, tx: q.x, ty: q.y, face: { x: f.x, y: f.y }, look: sk || 'wizard', robe: HERO_LOOK[t][0], hat: HERO_LOOK[t][1] });
    if (Math.hypot(o.x - q.x, o.y - q.y) > 250 || pk.dead) { o.x = q.x; o.y = q.y; } // respawned or blinked
    others.push(o);
  }
  guestOthers = others;
  // scores, clocks and turns (your team is blue)
  m.tm.forEach((t, i) => { const T = teams[relabel(t)]; if (T) T.score = m.sc[i]; });
  teams.time = m.time;
  teams.tally = {}; m.tm.forEach((t, i) => { teams.tally[relabel(t)] = m.tl[i] || 0; });
  if (m.rs) { const r = {}; for (const t in m.rs) r[relabel(t)] = m.rs[t]; teams.res = r; }
  if (m.ec) teams.eclipse = m.ec;
  teams.build = { team: relabel(m.bt[0]), t: m.bt[1] };
  const teamOf = id => { const h = m.hs.find(x => x[0] === id); return h ? h[1] : 'blue'; };
  const myTurn = m.pg.find(p => p[0] === net.myId), theirs = m.pg.find(p => p[0] !== net.myId);
  if (!myTurn) teams.pending = null; else if (!teams.pending || teams.pending.t > myTurn[1] + 0.5) teams.pending = { t: myTurn[1] };
  teams.pendingO = theirs ? { team: relabel(teamOf(theirs[0])), t: theirs[1] } : null;
  // your team's orders (a teammate may have changed them; yours win for a moment)
  const oi = m.tm.indexOf(view.team);
  if (m.od && m.od[oi] && performance.now() - (net.ordT || 0) > 1500) {
    const [o, om, ot] = m.od[oi];
    teams.order = o === 'follow' ? 'follow' : 'spread'; teams.orders.minion = om; teams.orders.titan = ot;
  }
  // units: keep the same objects so they glide between pictures
  const seen = new Set(), lists = { blue: [], red: [], green: [] };
  for (const a of m.u) {
    const [id, ti, ki, x, y, hp, mhp, ei, wall, slam, face, ff, ret, cdf, st, tired] = a;
    const kind = UNIT_KINDS[ki], def = UNITS[kind], team = relabel(canon(ti)), q = at(x, y);
    if (!def || !lists[team]) continue;
    let u = guestUnits.get(id);
    if (!u) { u = { id, unit: true, kind, def, x: q.x, y: q.y, wob: rnd(0, TAU), slot: rnd(0, TAU), kx: 0, ky: 0, structure: !!def.structure, r: def.r }; guestUnits.set(id, u); }
    Object.assign(u, { team, tx: q.x, ty: q.y, hp, maxHp: mhp || def.hp, elem: ei >= 0 ? ELEM_CYCLE[ei] : null,
                       wall, slamT: slam, face: view.on ? -face : face, fireFlash: ff, retreat: !!ret, cd: cdf * def.cd, tired: tired || 0, dead: false });
    for (const k of STATUS_KEYS) u[k] = 0;
    if (st) for (let i = 0; i + 1 < st.length; i += 2) u[STATUS_KEYS[st[i]]] = st[i + 1];
    seen.add(id);
    lists[team].push(u);
  }
  for (const id of guestUnits.keys()) if (!seen.has(id)) guestUnits.delete(id);
  units = lists; unitsVer++;
  friends = lists.blue; foes = TEAMS.filter(t => t !== 'blue').flatMap(t => lists[t]);
  bshots = m.bs.map(([ti, x, y, vx, vy, r, el, ar]) => { const team = relabel(canon(ti)), q = at(x, y), v = at(vx, vy); return { team, x: q.x, y: q.y, vx: v.x, vy: v.y, r, elem: el || null, arrow: !!ar, spin: rnd(0, TAU), color: TYPE_COLOR[el] || TEAM_COLOR[team], life: 2 }; });
  shots = m.sh.map(([x, y, vx, vy, r, type]) => { const q = at(x, y), v = at(vx, vy); return { x: q.x, y: q.y, vx: v.x, vy: v.y, r, type, color: TYPE_COLOR[type] || '#fff', life: 2 }; });
  zones = m.zn.map(([type, x, y, r, life, max, el, poison, charged]) => { const q = at(x, y); return { type: type || undefined, x: q.x, y: q.y, r, life, max, charged, tick: 1,
    spec: el ? { elem: el, fx: new Set(poison ? ['poison'] : []) } : undefined }; });
  traps = m.tr.map(([x, y, arming, el]) => { const q = at(x, y); return { x: q.x, y: q.y, arm: arming ? 1 : 0, spec: el ? { elem: el } : undefined }; });
  tempSolids = m.ts.map(([x, y, r, life, el, solid]) => { const q = at(x, y); return { x: q.x, y: q.y, r, life, elem: el || undefined, solid: !!solid }; });
  allies = m.al.map(([kind, x, y, life, el, r, hp, mhp, ang]) => { const q = at(x, y); return { kind, x: q.x, y: q.y, life, max: life, elem: el || undefined, r, hp, maxHp: mhp, ang }; });
  waves = m.wv.map(([x, y, r, maxR]) => { const q = at(x, y); return { x: q.x, y: q.y, r, maxR, speed: 0, hit: new Set() }; });
  meteors = m.mt.map(([x, y, t, max]) => { const q = at(x, y); return { x: q.x, y: q.y, t, max }; });
  // effects and messages
  const say = e => {
    switch (e[0]) {
      case 'ft': { const q = at(e[1], e[2]); floatText(q.x, q.y, e[3], e[4], e[5]); break; }
      case 'ring': { const q = at(e[1], e[2]); ring(q.x, q.y, e[3], e[4], e[5]); break; }
      case 'eh': { const q = at(e[2], e[3]); elemHit(e[1], q.x, q.y, e[4]); break; }
      case 'msg': castMessage(e[1], e[2]); break;
      case 'banner': showBanner(e[1], e[2], e[3]); break;
      case 'you-fell': SFX.death(); break;
      case 'news': { const N = newsText(e[1], relabel(e[2]), e[3] ? relabel(e[3]) : null, e[4] || null); if (N) showBanner(N[0], N[1], e[5]); break; }
    }
  };
  for (const e of m.ev) {
    if (e[0] === 'to') { if (e[1] === net.myId) say(e.slice(2)); }
    else say(e);
  }
  // the end (from your side)
  if (m.over && m.end) {
    const E = m.end, rel = o => { const r = {}; for (const k in o || {}) r[TEAM_CODE[k] ? relabel(k) : k] = o[k]; return r; };
    teams.breakdown = rel(E.bd);
    if (E.ss) {
      const S = rel(E.ss);
      S.land = (E.ss.land || []).map(([t, ...c]) => [t, ...TEAMS.map(gt => c[m.tm.indexOf(relabel(gt))] || 0)]);
      teams.stats = S;
    }
    if (state !== 'won' && state !== 'lost') {
      teams.result = (E.res && E.res[view.team]) || 'lose';
      teams.endedBy = E.eb; teams.baseFell = E.bf ? relabel(E.bf) : null; teams.baseBy = E.bb ? relabel(E.bb) : null; teams.groundTo = E.gt ? relabel(E.gt) : null;
      state = teams.result === 'win' ? 'won' : 'lost';
      overlayT = 0; flash = 1; endScroll = 0;
      teams.result === 'win' ? SFX.bossDown() : SFX.death();
    }
  }
}

// the friend's own loop: move yourself, let everything else glide to the latest picture
function guestUpdate(dt) {
  elapsed += dt;
  if (state === 'play' && !player.dead) heroMove(dt);
  player.arrowCd = Math.max(0, (player.arrowCd || 0) - dt);
  const k = Math.min(1, dt * 12);
  for (const u of allUnits()) {
    const ox = u.x, oy = u.y;
    u.x += (u.tx - u.x) * k; u.y += (u.ty - u.y) * k; u.flash = Math.max(0, (u.flash || 0) - dt);
    u.walk = (u.walk || 0) + Math.hypot(u.x - ox, u.y - oy);
  }
  for (const o of guestOthers) if (o.tx !== undefined) { const ox = o.x; o.x += (o.tx - o.x) * k; o.y += (o.ty - o.y) * k; o.moving = Math.abs(o.x - ox) + Math.abs(o.ty - o.y) > 0.3; }
  for (const s of bshots) { s.x += s.vx * dt; s.y += s.vy * dt; s.spin += dt * 9; if (s.elem && !s.arrow && Math.random() < 0.5) shotTrail(s); }
  for (const s of shots) { s.x += s.vx * dt; s.y += s.vy * dt; }
  if (teams.pending) teams.pending.t = Math.max(0, teams.pending.t - dt);
  if (teams.pendingO) teams.pendingO.t = Math.max(0, teams.pendingO.t - dt);
  teams.time = Math.max(0, teams.time - dt);
  teams.terrRecalc -= dt;
  if (teams.terrRecalc <= 0) { teams.terrRecalc = 0.5; computeTerritory(); }
  decayVisuals(dt);
  // tell the host where you are (in their coordinates)
  net.posT -= dt;
  if (net.posT <= 0 && state === 'play') {
    net.posT = 0.05;
    const q = V(player.x, player.y), f = V(player.face.x, player.face.y);
    net.send({ t: 'pos', x: q.x, y: q.y, fx: f.x, fy: f.y, tp: player.tp });
  }
}

function netReceive(m, from) { if (net.role === 'host') hostReceive(m, from); else if (net.role === 'guest') guestReceive(m); }

// leave a game with friends (say goodbye first, unless they've gone already)
function leaveOnline(quiet) {
  if (!versus && !lobby.role) return;
  if (!quiet) try { net.send({ t: 'bye' }); } catch (_) {}
  if (net.role === 'guest') {
    turnArena(null); Object.assign(view, { team: 'blue', on: false, ux: 0, uy: 1 });
    // a friend's phone only shows the host's battle: leaving it means back to the menu
    if (state === 'play' || state === 'dead' || state === 'reveal') { state = 'title'; menuPage = 'main'; }
  }
  versus = false; net.role = null; net.myId = null;
  rivalP = null; guestOthers = [];
  const tryId = lobby.try;
  setTimeout(() => { if (lobby.try === tryId) hangUp(); }, quiet ? 0 : 300); // let the goodbye go out first
}

// ── lobby: host a game or join one with a code ──
// Two ways to find each other are tried side by side: PeerJS's free
// matchmaking server, and Trystero, which meets through public Nostr relays.
// If one is down the other still works. A friend says hello on every path
// that opens; the host answers the first hello from each friend with a
// welcome (and their slot, Friend 1 or 2) on that path, and the friend plays
// on the path the welcome came on. After that the phones talk directly.
const PEER_PREFIX = 'pentagram-duel-';
const PEERJS_URL = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const TRYSTERO_URL = 'https://cdn.jsdelivr.net/npm/trystero@0.26.0/+esm';
const TRYSTERO_APP = 'pentagram-duel-v1';
// relay servers for when two networks can't reach each other directly
const TURN = [{ urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' }];
const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }, ...TURN];
const MAX_FRIENDS = 2;
const NET_V = 2; // the lobby and pictures changed with three-player battles
const OLD_COPY = 'You and the host have different versions of Space Wizard. Both of you reload the page, then try again.';
const OLD_FRIEND = 'A friend tried to join with an older copy of Space Wizard. Ask them to reload the game page (or close it and open the link again), then join again.';
const NO_DIRECT = 'Found the game, but the two phones couldn’t connect directly. Some networks block this (often mobile data, or school and work Wi-Fi): try both phones on the same Wi-Fi, or switch one between Wi-Fi and mobile data. Still trying…';
const NO_DIRECT_HOST = 'A friend found your game, but your phones couldn’t connect directly. Some networks block this: try both phones on the same Wi-Fi, or switch one between Wi-Fi and mobile data.';
const GAME_URL = 'https://flinnymusic-alt.github.io/Yo/pentagram.html';
// inside another page (like the Claude artifact viewer) the connection services may be blocked
const embedded = (() => { try { return window.top !== window.self; } catch (_) { return true; } })();
// role/code: this phone's part; paths: the ways being tried; links (host): the
// friends who joined; guestPath (friend): the path to the host; room (friend):
// the host's latest setup; three/diff (host): the setup being chosen
const lobby = { role: null, code: null, paths: [], links: [], guestPath: null, state: {}, try: null, started: false,
                three: false, diff: 'medium', tok: null, myId: null, room: null, note: null, lastCode: null };

function loadPeer() {
  if (window.Peer) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = PEERJS_URL;
    s.onload = () => res(); s.onerror = () => rej(new Error('Could not load PeerJS'));
    document.head.appendChild(s);
  });
}
function hangUp() {
  for (const p of lobby.paths) try { p.close(); } catch (_) {}
  Object.assign(lobby, { paths: [], links: [], guestPath: null, role: null, state: {}, try: null, started: false, myId: null, room: null, note: null });
  keepAwake(false);
}

// While hosting, joining or playing with friends the screen stays on: a phone
// that locks (or leaves the game in the background) drops off the connection.
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (!on) { const w = wakeLock; wakeLock = null; if (w) await w.release(); return; }
    if (wakeLock || !navigator.wakeLock || document.visibilityState !== 'visible') return;
    const w = await navigator.wakeLock.request('screen');
    wakeLock = w;
    w.addEventListener('release', () => { if (wakeLock === w) wakeLock = null; });
  } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && (lobby.role || versus)) keepAwake(true); });

// Phones keep old tabs for days without reloading them, and everyone in a game
// needs the same version: the lobby checks this page against the newest copy.
let updateChecked = false;
async function checkForUpdate() {
  if (updateChecked || !/^https?:$/.test(location.protocol)) return;
  updateChecked = true;
  try {
    const res = await fetch(location.href.split('#')[0], { cache: 'no-store' });
    if (!res.ok) return;
    const tidy = t => t.replace(/\r\n/g, '\n');
    const html = tidy(await res.text());
    const theirs = (html.match(/<script>([\s\S]*?)<\/script>/g) || []).find(t => t.includes('const NET_V'));
    const mine = [...document.scripts].find(t => !t.src && t.textContent.includes('const NET_V'));
    if (!theirs || !mine) return;
    if (theirs.slice(8, -9) !== tidy(mine.textContent)) {
      const u = document.getElementById('lb-update');
      if (u) u.style.display = '';
    }
  } catch (_) {}
}
// load the newest copy (a fresh address, so no old copy is served from the cache)
function reloadFresh() { location.href = location.pathname + '?v=' + Date.now(); }

// the host: a message arrived from `key` (a connection or a peer id) on some path
function hostData(m, key, send, close) {
  if (!m || typeof m !== 'object' || lobby.role !== 'host') return;
  const known = lobby.links.find(l => l.key === key);
  if (known) {
    if (m.t === 'bye') friendLeft(known.id);
    else if (lobby.started) hostReceive(m, known.id);
    else if (m.t === 'skin') known.skin = m.v === 'space' ? 'space' : 'wizard';
    return;
  }
  if (m.t !== 'hello') return;
  if (m.v !== NET_V || typeof m.tok !== 'string') { send({ t: 'version', v: NET_V }); send({ t: 'bye' }); lobbyNote(OLD_FRIEND); return; }
  if (lobby.links.some(l => l.tok === m.tok)) return; // already in (the hello came on the other path too)
  if (lobby.started) { send({ t: 'started' }); return; }
  const id = ['g1', 'g2'].find(g => !lobby.links.some(l => l.id === g));
  if (!id) { send({ t: 'full' }); return; }
  const link = { id, tok: m.tok, key, send, close, skin: m.sk === 'space' ? 'space' : 'wizard', team: id === 'g1' ? 'red' : lobby.three ? 'green' : 'blue' };
  lobby.links.push(link);
  send({ t: 'welcome', id });
  SFX.discover();
  renderRoom(); sendRoom();
}
// the host: a friend's connection closed
function hostLost(key) { const l = lobby.links.find(x => x.key === key); if (l) friendLeft(l.id); }
// the setup, for the friends' screens
function roomInfo() { return { t: 'room', three: lobby.three, diff: lobby.diff, players: [{ id: 'host', team: 'blue' }, ...lobby.links.map(l => ({ id: l.id, team: l.team }))] }; }
function sendRoom() { if (lobby.role === 'host' && !lobby.started) for (const l of lobby.links) l.send(roomInfo()); }

// a friend: a message from the host
function guestData(m, path) {
  if (!m || typeof m !== 'object' || lobby.role !== 'guest') return;
  if (!lobby.guestPath) {
    if (m.t === 'welcome') {
      lobby.guestPath = path;
      for (const p of lobby.paths) if (p !== path) try { p.close(); } catch (_) {}
      lobby.paths = [path];
      lobby.myId = m.id;
      net.send = x => path.send(x);
      lobbyStatus('');
      renderRoom();
    } else if (m.t === 'full' || m.t === 'started' || m.t === 'version' || m.t === 'start') {
      // ('start' before a welcome: a host with an old copy, which starts a duel at once)
      if (m.t === 'start') try { path.send({ t: 'bye' }); } catch (_) {}
      const tryId = lobby.try;
      setTimeout(() => { if (lobby.try === tryId) hangUp(); }, m.t === 'start' ? 300 : 0); // (let the goodbye go out)
      lobby.note = null;
      lobbyStatus(m.t === 'full' ? 'That game is full: three players already.' : m.t === 'started' ? 'That game has already started.' : OLD_COPY);
      lobby.state = {}; lobby.role = 'gone'; // (no more status lines over this message)
    }
    return;
  }
  if (path !== lobby.guestPath) return;
  if (m.t === 'room') { lobby.room = m; renderRoom(); }
  else if (m.t === 'start') { if (!versus) startGuestBattle(m); }
  else if (versus) netReceive(m);
  else if (m.t === 'bye') friendLeft();
}
function guestPathClosed(path) { if (lobby.role === 'guest' && path === lobby.guestPath) friendLeft(); }
const hello = () => ({ t: 'hello', v: NET_V, tok: lobby.tok, sk: mySkin });

// how each path is doing, shown under the code
function pathState(name, st) {
  if (name) lobby.state[name] = st;
  if ((lobby.role !== 'host' && lobby.role !== 'guest') || lobby.guestPath || lobby.started) return;
  const S = lobby.state, mark = v => v === 'ok' ? '✓' : v === 'down' ? '✗' : '…';
  const line = `<small style="color:#888">server ${mark(S.peerjs)} · relays ${mark(S.nostr)}</small>`;
  const note = lobby.note ? `<span style="color:#ffb3b3">${lobby.note}</span><br>` : '';
  if (S.peerjs === 'down' && S.nostr === 'down') {
    lobbyStatus(note + 'Couldn’t reach either connection service. Check your internet, or try another network (mobile data or Wi-Fi).<br>' + line);
    return;
  }
  if (lobby.role === 'host') lobbyStatus(note + line);
  else lobbyStatus(note + `Looking for game ${lobby.code}…<br>` + line);
}
// something the players should know (stays above the connection line)
function lobbyNote(text) { lobby.note = text; pathState(); }

async function viaPeerJS(code, role, tryId) {
  try { await loadPeer(); } catch (_) { pathState('peerjs', 'down'); return; }
  if (lobby.try !== tryId) return; // gave up or started over meanwhile
  const peer = role === 'host' ? new Peer(PEER_PREFIX + code, Object.assign({ config: { iceServers: ICE_SERVERS } }, window.PEER_OPTS))
                               : new Peer(Object.assign({ config: { iceServers: ICE_SERVERS } }, window.PEER_OPTS));
  const path = { name: 'peerjs', conn: null,
    send: m => { const c = path.conn; try { if (c && c.open) c.send(m); } catch (_) {} },
    close: () => { try { peer.destroy(); } catch (_) {} } };
  lobby.paths.push(path);
  const live = () => lobby.try === tryId && !peer.destroyed;
  // a friend: call the host (and call again while the host isn't on the server)
  const call = () => {
    if (!live() || lobby.guestPath || peer.disconnected) return;
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json' });
    path.conn = conn;
    conn.on('open', () => { if (!lobby.guestPath && path.conn === conn) path.send(hello()); });
    conn.on('data', m => {
      // (if there were several calls, the one the host answered is the one to use)
      if (!lobby.guestPath && m && m.t === 'welcome') path.conn = conn;
      if (path.conn === conn) guestData(m, path);
    });
    conn.on('close', () => { if (path.conn === conn) guestPathClosed(path); });
    conn.on('iceStateChanged', st => { if (st === 'failed' && live() && !lobby.guestPath) lobbyNote(NO_DIRECT); });
  };
  peer.on('open', () => {
    pathState('peerjs', 'ok');
    if (role === 'guest' && !lobby.guestPath && !(path.conn && path.conn.open)) call();
  });
  // the host: each friend has their own connection
  if (role === 'host') peer.on('connection', conn => {
    const send = m => { try { if (conn.open) conn.send(m); } catch (_) {} };
    conn.on('data', m => hostData(m, conn, send, () => { try { conn.close(); } catch (_) {} }));
    conn.on('close', () => hostLost(conn));
    conn.on('iceStateChanged', st => { if (st === 'failed' && live() && !lobby.links.some(l => l.key === conn)) lobbyNote(NO_DIRECT_HOST); });
  });
  // the link to the server dropped (the phone slept, or switched apps for a moment): get back on
  const back = () => { if (live() && peer.disconnected) try { peer.reconnect(); } catch (_) {} };
  peer.on('disconnected', () => {
    if (!live()) return;
    if (!lobby.guestPath && !lobby.started) pathState('peerjs', 'wait');
    setTimeout(back, 2000);
  });
  const onShow = () => { if (!document.hidden) back(); };
  document.addEventListener('visibilitychange', onShow);
  const close = path.close;
  path.close = () => { document.removeEventListener('visibilitychange', onShow); close(); };
  peer.on('error', err => {
    if (!live()) return;
    const t = err && err.type;
    // a friend: the host's code isn't on the server just now (it may be getting back on): ask again shortly
    if (role === 'guest' && t === 'peer-unavailable') { if (!lobby.guestPath) setTimeout(call, 3000); return; }
    if (role === 'host' && t === 'unavailable-id') { lobby.lastCode = null; lobbyNote('That code is still taken on the server. Tap Back, then Host a game again for a new code.'); }
    // (a single friend's connection failing doesn't mean the server is down)
    const serverGone = ['network', 'server-error', 'socket-error', 'socket-closed', 'browser-incompatible', 'ssl-unavailable', 'invalid-id', 'invalid-key', 'unavailable-id'].includes(t);
    if (serverGone && !lobby.guestPath && !lobby.started) pathState('peerjs', 'down');
  });
}

async function viaTrystero(code, role, tryId) {
  let joinRoom, getRelaySockets;
  try { ({ joinRoom, getRelaySockets } = await import(TRYSTERO_URL)); } catch (_) { pathState('nostr', 'down'); return; }
  if (lobby.try !== tryId) return;
  let room;
  try {
    room = joinRoom(Object.assign({ appId: TRYSTERO_APP, turnConfig: TURN, relayConfig: { redundancy: 8, warnOnRelayFailure: false } }, window.TRYSTERO_OPTS), 'room-' + code);

  const T = mixTri(), lx = T.cx + T.R + 46, counts = waveKinds(teams.blue.mix, teams.blue.minions).reduce((m, k) => (m[k] = (m[k] || 0) + 1, m), {});
  let ly = P.mixY + 26;
  ctx.font = `italic 10px ${SERIF}`; ctx.fillStyle = '#999'; ctx.textAlign = 'right';
  ctx.fillText('next wave', lx + 100, ly); ctx.fillText('field', lx + 138, ly);
  for (const k of MINION_KINDS) {
    ly += 22;
    const e = UNITS[k].elem, onField = friends.filter(u => u.kind === k && !u.dead).length;
    drawGlyph(ELEM_GLYPH[e], lx + 6, ly - 4, 11, TYPE_COLOR[e]);
    ctx.textAlign = 'left'; ctx.font = `12px ${SERIF}`; ctx.fillStyle = TYPE_COLOR[e]; ctx.fillText(UNITS[k].name, lx + 18, ly);
    ctx.textAlign = 'right'; ctx.fillStyle = '#eee';
    ctx.fillText(`${counts[k] || 0} · ${Math.round(teams.blue.mix[k] * 100)}%`, lx + 100, ly);
    ctx.fillText(String(onField), lx + 138, ly);
  }
  ctx.textAlign = 'left'; ctx.font = `italic 10px ${SERIF}`; ctx.fillStyle = '#999';
  ctx.fillText(`${teams.blue.minions} minions a wave`, lx, ly + 22);
  // both sides' team powers, read live from what each army is made of
  head('Team powers', P.y + 524, three() ? 'from each army (Water slows all your rivals)' : 'from what each army is made of');
  const cw = (P.w - 70) / 5;
  TEAMS.forEach((team, row) => {
    const r = resOf(team), yy = P.y + 546 + row * 19;
    ctx.textAlign = 'left'; ctx.font = `bold 11px ${SERIF}`; ctx.fillStyle = TEAM_COLOR[team];
    ctx.fillText(teamLabel(team), P.x + 14, yy);
    CHARGE_TYPES.forEach((e, i) => {
      const v = Math.round(r[e] * 100), gx = P.x + 56 + cw * i;
      ctx.globalAlpha = v ? 1 : 0.35;
      drawGlyph(ELEM_GLYPH[e], gx + 6, yy - 4, 11, TYPE_COLOR[e]);
      ctx.textAlign = 'left'; ctx.fillStyle = '#eee'; ctx.font = `11px ${SERIF}`;
      ctx.fillText(`${v}%`, gx + 15, yy);
      ctx.globalAlpha = 1;
    });
  });
}

function soundHit(x, y) {
  const b = soundButton();
  return Math.hypot(x - b.x, y - b.y) < b.r + 6;
}

const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
function tiltLabelHit(x, y) {
  if (!isTouch) return false;
  const b = tiltButton();
  return Math.hypot(x - b.x, y - b.y) < b.r + 6;
}

// ── input ─────────────────────────────────────────────────────────────────────
function castMove(x, y) {
  finger = { x, y };
  const n = nodeAt(x, y);
  if (n !== curNode) {
    curNode = n;
    if (n !== null && seq.length < MAX_SEQ) {
      seq.push(NODE_ORDER[n]);
      nodePulse[n] = 1;
      SFX.node(NODE_ORDER[n], seq.length);
    }
  }
}

let titleButtons = [];
function tapOverlay(x, y) {
  if (state === 'title') {
    const b = x === undefined ? titleButtons[0] : titleButtons.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
    if (b) b.go();
    return true;
  }
  if (state === 'dead')  { if (overlayT > (mode === 'battle' ? 5 : 0.8)) respawn(); return true; }
  if (state === 'won')   { if (overlayT > 1.0) { leaveOnline(); state = mode === 'battle' ? 'title' : 'play'; menuPage = 'main'; } return true; }
  if (state === 'lost')  { if (overlayT > 1.0) { leaveOnline(); state = 'title'; menuPage = 'main'; } return true; }
  if (state === 'reveal') { if (reveal.t > 1.2) closeReveal(); return true; }
  return false;
}

function localPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioInit();
  if (paused) { resumeGame(); return; } // this tap only wakes the game
  const { x, y } = localPos(e);
  if (mode === 'battle' && (state === 'won' || state === 'lost')) {
    const b = endButton;
    if (b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { endScroll = 0; tapOverlay(); }
    else howtoDrag = { id: e.pointerId, y, s: endScroll, end: true };
    return;
  }
  if (state === 'title' && menuPage === 'howto') {
    const b = titleButtons.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
    if (b) b.go(); else howtoDrag = { id: e.pointerId, y, s: howtoScroll };
    return;
  }
  if (tapOverlay(x, y)) return;
  if (ordersOpen && mixHit(x, y)) { mixPtr = e.pointerId; setMixAt(x, y); try { canvas.setPointerCapture(e.pointerId); } catch (_) {} return; }
  if (ordersOpen && ordersHit(x, y)) return; // the open army panel comes first
  if (soundHit(x, y)) { toggleSound(); return; }
  if (tiltLabelHit(x, y)) {
    if (tilt.raw) { levelTilt(); castMessage('Tilt levelled', '#ccc'); }
    else { tilt.asked = false; tilt.warned = false; tilt.denied = false; tilt.granted = false; } // try again on this tap's release
    return;
  }
  if (ordersHit(x, y)) return;
  if (followHit(x, y)) { toggleOrder(); return; }
  const bb = buildButtonHit(x, y);
  if (bb) { if (bb.key === 'elem') teams.buildElem = bb.elem; else buildChoice(bb.key); return; }
  if (fireButtonHit(x, y)) { holdTilt(); fireLoaded(); tilt.pauseUntil = performance.now() + 400; return; }
  if (castPtr === null && inCastZone(x, y)) {
    holdTilt();
    castPtr = e.pointerId;
    seq = [];
    curNode = null;
    castMove(x, y);
  } else if (movePtr === null) {
    movePtr = e.pointerId;
    movePos = { x, y };
    moveStart = { x, y, t: performance.now(), moved: false, shooting: tiltActive() };
    if (moveStart.shooting && state === 'play') shootArrow(player.x + x - W / 2, player.y + y - playerScreenY());
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});

let mixPtr = null;
canvas.addEventListener('pointermove', e => {
  if (howtoDrag && e.pointerId === howtoDrag.id) {
    const v = howtoDrag.s - (localPos(e).y - howtoDrag.y);
    if (howtoDrag.end) endScroll = clamp(v, 0, endMax); else howtoScroll = clamp(v, 0, howtoMax);
    return;
  }
  if (e.pointerId === mixPtr) { const p = localPos(e); setMixAt(p.x, p.y); return; }
  if (e.pointerId === castPtr) { const p = localPos(e); castMove(p.x, p.y); }
  else if (e.pointerId === movePtr) {
    movePos = localPos(e);
    if (moveStart && Math.hypot(movePos.x - moveStart.x, movePos.y - moveStart.y) > 20) moveStart.moved = true;
  }
});

function endPointer(e, cancelled) {
  if (howtoDrag && e.pointerId === howtoDrag.id) howtoDrag = null;
  if (e.pointerId === mixPtr) mixPtr = null;
  if (e.pointerId === castPtr) {
    if (state === 'play' && !cancelled) castSequence();
    seq = []; castPtr = null; finger = null; curNode = null;
    tilt.pauseUntil = performance.now() + 400;
  }
  if (e.pointerId === movePtr) {
    // a quick tap on the field shoots an arrow at that spot
    if (!cancelled && state === 'play' && moveStart && !moveStart.shooting && !moveStart.moved && performance.now() - moveStart.t < 350) {
      shootArrow(player.x + moveStart.x - W / 2, player.y + moveStart.y - playerScreenY());
    }
    movePtr = null; movePos = null; moveStart = null;
  }
}

canvas.addEventListener('pointerup', e => {
  // a finished tap is what iOS accepts for the motion-sensor prompt
  askTiltFromTap();
  endPointer(e, false);
});
canvas.addEventListener('pointercancel', e => endPointer(e, true));
canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('wheel', e => {
  if (state === 'title' && menuPage === 'howto') { howtoScroll = clamp(howtoScroll + e.deltaY, 0, howtoMax); e.preventDefault(); }
  else if (mode === 'battle' && (state === 'won' || state === 'lost')) { endScroll = clamp(endScroll + e.deltaY, 0, endMax); e.preventDefault(); }
}, { passive: false });

window.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('#lobby')) return; // typing a room code
  audioInit();
  if (paused) { e.preventDefault(); resumeGame(); return; }
  if (e.code === 'KeyM') toggleSound();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Backspace'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  const confirm = e.code === 'Space' || e.code === 'Enter';
  if (state === 'title') {
    const pick = { Digit1: 0, Digit2: 1, Digit3: 2 }[e.code];
    if (pick !== undefined && titleButtons[pick]) titleButtons[pick].go();
    else if (confirm) tapOverlay();
    return;
  }
  if (state !== 'play') { if (confirm) tapOverlay(); return; }
  const el = KEY_TO_EL[e.code];
  if (el && castPtr === null && seq.length < MAX_SEQ) {
    seq.push(el);
    nodePulse[NODE_ORDER.indexOf(el)] = 1;
  }
  if (confirm && castPtr === null) { if (seq.length) castSequence(); else fireLoaded(); }
  if (e.code === 'KeyF') fireLoaded();
  if (e.code === 'KeyB') buildChoice('turret');
  if (e.code === 'KeyG' && mode === 'battle' && teams) toggleOrder();
  if (e.code === 'KeyT') buildChoice('titan');
  if ((e.code === 'Backspace' || e.code === 'Escape') && castPtr === null) seq = [];
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ── drawing helpers ──────────────────────────────────────────────────────────
function circle(x, y, r, fill, stroke, lw) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  if (fill)   { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Alchemical element symbols
function drawGlyph(el, x, y, s, color) {
  const h = s * 0.42;
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1.5, s * 0.09);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  if (el === 'F' || el === 'A') {
    ctx.moveTo(0, -h); ctx.lineTo(h * 0.95, h * 0.72); ctx.lineTo(-h * 0.95, h * 0.72); ctx.closePath();
    if (el === 'A') { ctx.moveTo(-h * 0.85, h * 0.1); ctx.lineTo(h * 0.85, h * 0.1); }
  } else if (el === 'W' || el === 'E') {
    ctx.moveTo(0, h); ctx.lineTo(h * 0.95, -h * 0.72); ctx.lineTo(-h * 0.95, -h * 0.72); ctx.closePath();
    if (el === 'E') { ctx.moveTo(-h * 0.85, -h * 0.1); ctx.lineTo(h * 0.85, -h * 0.1); }
  } else {
    ctx.arc(0, 0, h * 0.85, 0, TAU);
    ctx.moveTo(h * 0.3, 0);
    ctx.arc(0, 0, h * 0.3, 0, TAU);
  }
  ctx.stroke();
  ctx.restore();
}

function wrapText(text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, y);
      line = w;
      y += lineH;
    } else {
      line = test;
    }
  }
  if (line) { ctx.fillText(line, x, y); y += lineH; }
  return y;
}

// ── world rendering ──────────────────────────────────────────────────────────
function drawArena(camX, camY) {
  // a hedge of round treetops around the field
  for (let k = 0; k < 90; k++) {
    const a = k / 90 * TAU, x = Math.cos(a) * (ARENA_W + 46), y = Math.sin(a) * (ARENA_H + 46);
    if (!inView(x, y, 70, camX, camY)) continue;
    const sw = Math.sin(elapsed * 1.4 + k) * windAt() * 2;
    circle(x + 6, y + 10, 46, 'rgba(15,35,20,0.45)');
    circle(x + sw, y, 44, k % 2 ? '#2f5a30' : '#345f2f');
    circle(x - 12 + sw * 1.5, y - 12, 22, '#4d8a3c');
  }
  ovalPath(0); ctx.fillStyle = meadowPattern(); ctx.fill();
  ctx.save();
  ovalPath(0); ctx.clip();                                       // everything below stays inside the oval
  // each side's land carries its colour
  for (const team of TEAMS) {
    const b = homePt(team, 0), g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 700);
    g.addColorStop(0, TEAM_COLOR[team] + '33'); g.addColorStop(1, TEAM_COLOR[team] + '00');
    ctx.fillStyle = g; ctx.fillRect(b.x - 700, b.y - 700, 1400, 1400);
  }
  if (three()) {
    // three trodden roads into the middle, and soft lines where the lands meet
    ctx.lineCap = 'round';
    for (const team of TEAMS) {
      const b = homePt(team, 0);
      ctx.strokeStyle = 'rgba(210,185,130,0.16)'; ctx.lineWidth = 150;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(0, 0); ctx.stroke();
      ctx.strokeStyle = 'rgba(210,185,130,0.22)'; ctx.lineWidth = 80;
      ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(0, 0); ctx.stroke();
    }
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.setLineDash([18, 18]); ctx.lineWidth = 2;
    for (const team of TEAMS) {
      const a = TEAM_ANGLE3[team] + Math.PI / 3;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * ROUND_R, Math.sin(a) * ROUND_R); ctx.stroke();
    }
    ctx.setLineDash([]); ctx.lineCap = 'butt';
  } else {
    // the trodden road between the towers, a sandy path with soft edges
    const road = ctx.createLinearGradient(0, -70, 0, 70);
    road.addColorStop(0, 'rgba(210,185,130,0)'); road.addColorStop(0.3, 'rgba(210,185,130,0.38)');
    road.addColorStop(0.7, 'rgba(210,185,130,0.38)'); road.addColorStop(1, 'rgba(210,185,130,0)');
    ctx.fillStyle = road;
    ctx.fillRect(-BASE_X, -70, BASE_X * 2, 140);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.setLineDash([18, 18]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(0, -ARENA_H); ctx.lineTo(0, ARENA_H); ctx.stroke(); ctx.setLineDash([]);
  }
  // claimed ground (only the cells on screen)
  const i0 = Math.max(0, Math.floor((camX + ARENA_W) / CELL)), i1 = Math.min(COLS - 1, Math.floor((camX + W + ARENA_W) / CELL));
  const j0 = Math.max(0, Math.floor((camY + ARENA_H) / CELL)), j1 = Math.min(ROWS - 1, Math.floor((camY + H + ARENA_H) / CELL));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const v = terr[j * COLS + i];
    if (!v) continue;
    ctx.fillStyle = TERR_FILL[v];
    ctx.fillRect(-ARENA_W + i * CELL, -ARENA_H + j * CELL, CELL, CELL);
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(40,70,40,0.6)'; ctx.lineWidth = 6;
  ovalPath(0); ctx.stroke();
}

function drawLasers() {
  for (const l of links) {
    if (l.a.dead || l.b.dead) continue;
    const c = TEAM_COLOR[l.team], flick = 0.55 + Math.sin(elapsed * 20 + l.a.x) * 0.15;
    ctx.strokeStyle = c; ctx.globalAlpha = flick * 0.35; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.b.x, l.b.y); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.globalAlpha = flick; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.b.x, l.b.y); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

// ── the Ghibli look: a warm, windy afternoon ──
// A painted meadow, one breeze that moves the grass, trees, robes and the
// seeds in the air, cloud shadows sliding over the land, and soft light.
function windAt(t = elapsed) { return 0.55 + 0.3 * Math.sin(t * 0.37) + 0.15 * Math.sin(t * 1.13 + 1.7); } // about 0.1–1
function hash2(i, j) {
  let h = Math.imul(i | 0, 374761393) ^ Math.imul(j | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const clear = col => col[0] === '#' ? col.slice(0, 7) + '00' : col.replace(/[\d.]+\)$/, '0)');

// the meadow: painted once onto a tile, then repeated under everything
let meadow = null;
function meadowPattern() {
  if (meadow) return meadow;
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#5a8743'; g.fillRect(0, 0, S, S);
  let seed = 11;
  const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // soft washes of light and shade (wrapped, so the tile repeats seamlessly)
  const wash = (x, y, r, col) => {
    for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) {
      const gr = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r);
      gr.addColorStop(0, col); gr.addColorStop(1, clear(col));
      g.fillStyle = gr; g.fillRect(x + dx - r, y + dy - r, r * 2, r * 2);
    }
  };
  const cols = ['rgba(140,175,80,0.35)', 'rgba(55,95,50,0.35)', 'rgba(175,185,95,0.22)', 'rgba(75,120,62,0.3)', 'rgba(205,200,120,0.14)'];
  for (let i = 0; i < 70; i++) wash(R() * S, R() * S, 30 + R() * 100, cols[i % cols.length]);
  // little brushstrokes of grass
  g.lineCap = 'round';
  for (let i = 0; i < 1100; i++) {
    const x = R() * S, y = R() * S, l = 3 + R() * 7, a = -Math.PI / 2 + (R() - 0.5) * 1;
    g.strokeStyle = R() < 0.5 ? 'rgba(38,78,36,0.32)' : 'rgba(160,200,95,0.32)';
    g.lineWidth = 1 + R() * 1.3;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  // a scatter of tiny flowers
  for (let i = 0; i < 80; i++) {
    g.globalAlpha = 0.85; g.fillStyle = ['#fff6e0', '#ffe27a', '#f6b6c8', '#d6e6ff'][i % 4];
    g.beginPath(); g.arc(R() * S, R() * S, 1 + R() * 1.4, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  return (meadow = ctx.createPattern(c, 'repeat'));
}

// swaying grass tufts and flowers, made up on the spot for the cells on screen
function drawTufts(camX, camY) {
  const C = 44, w = windAt(), t = elapsed;
  const i0 = Math.floor(camX / C) - 1, i1 = Math.floor((camX + W) / C) + 1;
  const j0 = Math.floor(camY / C) - 1, j1 = Math.floor((camY + H) / C) + 1;
  ctx.lineCap = 'round';
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const h = hash2(i, j);
    if (h > 0.5) continue;
    const x = i * C + hash2(i, j + 99) * C, y = j * C + hash2(i + 99, j) * C;
    if (mode === 'battle' ? !inArena(x, y, 10) : (Math.abs(x) > WORLD || Math.abs(y) > WORLD || isWater(x, y))) continue;
    const sway = (Math.sin(t * 2.1 + x * 0.012 + y * 0.004) * 0.6 + 0.6) * w * 5;
    const n = 3 + Math.floor(h * 6);
    for (let k = 0; k < n; k++) {
      const bx = x + (k - n / 2) * 2.4, len = 7 + hash2(i * 7 + k, j) * 7;
      ctx.strokeStyle = k % 2 ? '#3e6e34' : '#78a84e';
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(bx, y);
      ctx.quadraticCurveTo(bx + sway * 0.3, y - len * 0.6, bx + sway + (k - n / 2) * 1.2, y - len);
      ctx.stroke();
    }
    if (h < 0.07) {
      // a flower nodding on its stem
      const fx = x + sway * 1.2, fy = y - 15;
      ctx.strokeStyle = '#4f7f3a'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + sway * 0.4, y - 9, fx, fy); ctx.stroke();
      const col = ['#fff6e0', '#ffd95a', '#f7a8c4', '#b9d4ff'][Math.floor(h * 57) % 4];
      for (let q = 0; q < 5; q++) { const a = q * TAU / 5 + t * 0.3; circle(fx + Math.cos(a) * 2.6, fy + Math.sin(a) * 2.6, 2, col); }
      circle(fx, fy, 1.6, '#ffb84a');
    }
  }
}

// the shadows of clouds passing overhead
function drawCloudShadows(camX, camY) {
  const P = 1900, t = elapsed, cx = camX + W / 2, cy = camY + H / 2;
  for (let k = 0; k < 6; k++) {
    let x = hash2(k, 1) * P + t * (16 + 8 * hash2(k, 2)), y = hash2(k, 3) * P + t * 4;
    x = cx + ((((x - cx) % P) + P * 1.5) % P) - P / 2;
    y = cy + ((((y - cy) % P) + P * 1.5) % P) - P / 2;
    const r = 220 + hash2(k, 4) * 200;
    if (!inView(x, y, r * 1.6, camX, camY)) continue;
    for (const [ox, oy, f] of [[0, 0, 1], [r * 0.6, r * 0.15, 0.7], [-r * 0.55, r * 0.2, 0.65]]) {
      const g = ctx.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, r * f);
      g.addColorStop(0, 'rgba(20,45,55,0.16)'); g.addColorStop(1, 'rgba(20,45,55,0)');
      ctx.fillStyle = g; ctx.fillRect(x + ox - r * f, y + oy - r * f, r * f * 2, r * f * 2);

// seeds, pollen, leaves and petals riding the breeze
let motes = [], moteClock = 0;
const MOTE_KINDS = ['seed', 'seed', 'pollen', 'pollen', 'leaf', 'petal'];
function newMote(camX, camY, anywhere) {
  return {
    kind: MOTE_KINDS[Math.floor(Math.random() * MOTE_KINDS.length)],
    x: anywhere ? camX + Math.random() * W : camX - 30, y: camY + Math.random() * H,
    vy: rnd(-8, 4), t: 0, ph: rnd(0, TAU), f: rnd(0.8, 1.8), s: rnd(0.8, 1.4), rot: rnd(0, TAU),
  };
}
function drawMotes(camX, camY) {
  const dt = Math.min(0.05, Math.max(0, elapsed - moteClock));
  moteClock = elapsed;
  while (motes.length < 42) motes.push(newMote(camX, camY, true));
  const w = windAt();
  for (let i = 0; i < motes.length; i++) {
    const m = motes[i];
    m.t += dt;
    m.x += (12 + w * 40) * m.s * dt + Math.sin(m.t * m.f + m.ph) * 14 * dt;
    m.y += (m.vy + Math.cos(m.t * m.f * 0.7 + m.ph) * 10) * dt;
    m.rot += dt * (1 + w) * m.f;
    if (m.x > camX + W + 40 || m.x < camX - 60 || m.y < camY - 60 || m.y > camY + H + 60) { motes[i] = newMote(camX, camY, false); continue; }
    if (m.kind === 'seed') {
      // dandelion fluff
      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = '#fffaf0'; ctx.lineWidth = 0.8;
      ctx.beginPath();
      for (let q = 0; q < 6; q++) { const a = m.rot * 0.3 + q * TAU / 6; ctx.moveTo(m.x, m.y); ctx.lineTo(m.x + Math.cos(a) * 3.5 * m.s, m.y + Math.sin(a) * 3.5 * m.s); }
      ctx.stroke();
      circle(m.x, m.y, 1, '#e8dcc0');
    } else if (m.kind === 'pollen') {
      ctx.globalAlpha = 0.25 + 0.2 * Math.sin(m.t * 3 + m.ph);
      circle(m.x, m.y, 4 * m.s, '#fff2b0');
      ctx.globalAlpha = 0.9; circle(m.x, m.y, 1.4 * m.s, '#fff8d8');
    } else {
      ctx.globalAlpha = 0.9;
      ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.rot);
      ctx.beginPath(); ctx.ellipse(0, 0, 3.6 * m.s, 1.7 * m.s, 0, 0, TAU);
      ctx.fillStyle = m.kind === 'leaf' ? (m.ph > 3 ? '#8fbf4a' : '#d9b94a') : '#f7b8cc';
      ctx.fill(); ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

// soft shafts of afternoon light, a warm glow and a gentle frame (screen space)
function drawAtmosphere() {
  const t = elapsed;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 3; k++) {
    const x = W * (0.1 + k * 0.32) + Math.sin(t * 0.2 + k) * 20, w = 50 + k * 30;
    const a = 0.05 + 0.03 * Math.sin(t * 0.5 + k * 2);
    const g = ctx.createLinearGradient(x, 0, x + H * 0.45, H);
    g.addColorStop(0, `rgba(255,236,180,${a})`); g.addColorStop(1, 'rgba(255,236,180,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + w, 0); ctx.lineTo(x + w + H * 0.45, H); ctx.lineTo(x + H * 0.45, H); ctx.closePath(); ctx.fill();
  }
  const sun = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(W, H) * 0.8);
  sun.addColorStop(0, 'rgba(255,214,150,0.12)'); sun.addColorStop(1, 'rgba(255,214,150,0)');
  ctx.fillStyle = sun; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H * 0.4, Math.min(W, H) * 0.35, W / 2, H * 0.4, Math.max(W, H) * 0.8);
  v.addColorStop(0, 'rgba(20,30,40,0)'); v.addColorStop(1, 'rgba(20,30,40,0.38)');

}

// a fluffy cloud, lit warm from below
function drawCloud(x, y, s, a) {
  ctx.globalAlpha = a;
  const puffs = [[0, 0, 1], [-0.9, 0.25, 0.7], [0.95, 0.2, 0.75], [-0.4, -0.45, 0.75], [0.45, -0.35, 0.8], [1.6, 0.4, 0.5], [-1.55, 0.45, 0.5]];
  for (const [px, py, r] of puffs) circle(x + px * s, y + py * s + s * 0.12, r * s, '#9c7aa8');
  for (const [px, py, r] of puffs) circle(x + px * s, y + py * s, r * s * 0.95, '#f4c6c0');
  for (const [px, py, r] of puffs) if (py < 0.3) circle(x + px * s - s * 0.1, y + py * s - s * 0.12, r * s * 0.6, '#fff1e6');
  ctx.globalAlpha = 1;
}
// the menu backdrop: a dusk sky over rolling hills, with clouds and first stars
function drawMenuSky() {
  const t = elapsed;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#12143a'); g.addColorStop(0.45, '#322c6c'); g.addColorStop(0.68, '#7a5088'); g.addColorStop(0.8, '#e0937e'); g.addColorStop(1, '#f3c27e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 46; i++) {
    ctx.globalAlpha = 0.25 + 0.55 * Math.abs(Math.sin(t * 0.7 + i * 1.3));
    circle(hash2(i, 3) * W, hash2(i, 4) * H * 0.42, 0.4 + hash2(i, 5) * 1.2, '#fff');
  }
  ctx.globalAlpha = 1;
  for (let k = 0; k < 5; k++) {
    const span = W + 360, cx = ((hash2(k, 7) * span + t * (5 + k * 2.5)) % span) - 180;
    drawCloud(cx, H * (0.07 + 0.075 * k), 18 + 18 * hash2(k, 8), 0.16 + 0.04 * k);
  }
  // rolling hills, far to near
  const hills = [['#4a3f72', 0.7, 22, 0.006], ['#33305a', 0.76, 28, 0.009], ['#22243f', 0.84, 20, 0.013]];
  for (const [col, base, amp, f] of hills) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 10; x += 10) ctx.lineTo(x, H * base - Math.sin(x * f + base * 9) * amp - Math.sin(x * f * 2.3) * amp * 0.4);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }
  // grass along the bottom, swaying, and fireflies
  const w = windAt();
  ctx.strokeStyle = '#1a1c30'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let x = 0; x < W; x += 6) {
    const len = 10 + hash2(x, 1) * 16, sway = (Math.sin(t * 2 + x * 0.05) * 0.5 + 0.6) * w * 6;
    ctx.moveTo(x, H); ctx.quadraticCurveTo(x + sway * 0.3, H - len * 0.6, x + sway, H - len);
  }
  ctx.stroke();
  for (let i = 0; i < 14; i++) {
    const x = (hash2(i, 9) * W + Math.sin(t * 0.4 + i) * 30 + W) % W, y = H * (0.78 + 0.18 * hash2(i, 10)) + Math.sin(t * 0.9 + i * 2) * 10;
    const a = Math.max(0, Math.sin(t * 1.5 + i * 1.7));
    ctx.globalAlpha = a * 0.35; circle(x, y, 6, '#f6ff9a');
    ctx.globalAlpha = a; circle(x, y, 1.8, '#fbffd0');
  }
  ctx.globalAlpha = 1;
}

// a soft billow of smoke, dust or glow (grows as it fades); colour must be #rrggbb
function puff(x, y, color, n, size, rise) {
  for (let i = 0; i < n; i++) {
    particles.push({ puff: true, x: x + rnd(-size, size) * 0.5, y: y + rnd(-size, size) * 0.3, vx: rnd(-30, 30), vy: -rise * rnd(0.6, 1.2),
                     r: size * rnd(0.6, 1), life: 1, decay: rnd(0.8, 1.3), color });

}
// leaves whirling out from a gust
function leafSwirl(x, y, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(spd * 0.4, spd);
    particles.push({ leaf: true, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: rnd(3, 5), life: 1, decay: rnd(0.9, 1.4),

function drawGround(camX, camY) {
  ctx.fillStyle = '#2c4a2e'; // deep woods beyond the edge
  ctx.fillRect(camX, camY, W, H);
  if (mode === 'battle') { drawArena(camX, camY); return; }
  ctx.fillStyle = meadowPattern();
  ctx.fillRect(-WORLD, -WORLD, WORLD * 2, WORLD * 2);

  // each guardian's land is tinted with its own colour
  for (const b of BOSSES) {
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 480);
    g.addColorStop(0, b.color + '26');
    g.addColorStop(1, b.color + '00');
    ctx.fillStyle = g;
    ctx.fillRect(b.x - 480, b.y - 480, 960, 960);
  }

  // the edge of the world: a soft line of woods
  ctx.strokeStyle = 'rgba(30,60,35,0.6)';
