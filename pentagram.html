// ── pentagram panel ──────────────────────────────────────────────────────────
function drawSeqPath(list, color) {
  if (!list.length) return;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let i = 1; i < list.length; i++) {
    const a = nodePos(NODE_ORDER.indexOf(list[i - 1])), b = nodePos(NODE_ORDER.indexOf(list[i]));
    const col = color || ELEMENTS[list[i]].color;
    if (a.x === b.x && a.y === b.y) {
      circle(a.x, a.y, PENT.S * 0.62 + (i % 3) * 4, null, col, 3);
      continue;
    }
    ctx.strokeStyle = col;
    ctx.lineWidth = 6;
    ctx.shadowColor = col;
    ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

function drawSlots(list, highlight) {
  const n = MAX_SEQ, s = PENT.slot, gap = 5;
  const total = n * s + (n - 1) * gap;
  const x0 = PENT.cx - total / 2;
  for (let i = 0; i < n; i++) {
    const x = x0 + i * (s + gap), y = PENT.slotY - s / 2;
    roundRect(x, y, s, s, 5);
    ctx.fillStyle = i < list.length ? 'rgba(30,20,50,0.9)' : 'rgba(255,255,255,0.05)';
    ctx.fill();
    ctx.strokeStyle = i < list.length ? ELEMENTS[list[i]].color : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = i === highlight ? 3 : 1.5;
    ctx.stroke();
    if (i < list.length) drawGlyph(list[i], x + s / 2, y + s / 2, s * 0.8, ELEMENTS[list[i]].color);
  }
  // how complex (and so how strong) the chain is so far
  if (list.length >= 2) {
    const key = list.join(''), pot = potencyOf(key), lx = x0 + total + 8;
    ctx.textAlign = 'left';
    ctx.font = 'bold 11px "Big Caslon", "Libre Caslon Text", Georgia, serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText(`cx ${complexityOf(key).toFixed(1)}`, lx, PENT.slotY - 2);
    ctx.fillStyle = pot > 1 ? '#ffd24a' : '#777';
    ctx.fillText(`×${pot.toFixed(2)}`, lx, PENT.slotY + 11);
  }
}

function drawPentagram(ghost) {
  const { cx, cy, R, S } = PENT;
  const g = ctx.createLinearGradient(0, panelTop - 30, 0, H);
  g.addColorStop(0, 'rgba(8,6,16,0)');
  g.addColorStop(0.2, 'rgba(8,6,16,0.82)');
  g.addColorStop(1, 'rgba(8,6,16,0.95)');
  ctx.fillStyle = g;
  ctx.fillRect(0, panelTop - 30, W, H - panelTop + 30);

  circle(cx, cy, R * 1.08, 'rgba(40,20,70,0.35)', 'rgba(199,125,255,0.3)', 2);
  ctx.strokeStyle = 'rgba(199,125,255,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= 5; i++) {
    const p = nodePos((i * 2) % 5);
    i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
  }
  ctx.stroke();

  const list = ghost || seq;
  drawSeqPath(list);

  if (!ghost && finger && seq.length) {
    const last = nodePos(NODE_ORDER.indexOf(seq[seq.length - 1]));
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(finger.x, finger.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  const showKeys = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
  const ecl = !ghost && mode === 'battle' && teams && teams.eclipse ? eclipseT() : null;
  for (let i = 0; i < 5; i++) {
    const el = NODE_ORDER[i], e = ELEMENTS[el], p = nodePos(i);
    const count = list.filter(v => v === el).length;
    const active = !ghost && castPtr !== null && curNode === i;
    const pulse = nodePulse[i];
    const s = S * (1 + pulse * 0.18);
    if (count || active) { ctx.shadowColor = e.color; ctx.shadowBlur = 18 + pulse * 20; }
    roundRect(p.x - s / 2, p.y - s / 2, s, s, 8);
    ctx.fillStyle = count ? 'rgba(40,24,64,0.95)' : 'rgba(22,16,34,0.95)';
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = e.color;
    ctx.lineWidth = active ? 4 : 2.5;
    ctx.stroke();
    drawGlyph(el, p.x, p.y, s * 0.72, e.color);
    if (count) {
      circle(p.x + s / 2, p.y - s / 2, 9, e.color);
      ctx.fillStyle = '#111';
      ctx.font = 'bold 11px "Big Caslon", "Libre Caslon Text", Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText(count, p.x + s / 2, p.y - s / 2 + 4);
    }
    if (showKeys) {
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.font = '10px "Big Caslon", "Libre Caslon Text", Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${e.name} [${e.key}]`, p.x, p.y + s / 2 + 12);
    }
    if (ecl !== null) {
      const ei = CHARGE_TYPES.indexOf(RUNE_ELEM[el]), left = eclipseLeft(ei, ecl), n = eclipseIn(ei, ecl);
      if (left) {
        roundRect(p.x - s / 2, p.y - s / 2, s, s, 8); ctx.fillStyle = 'rgba(6,6,14,0.66)'; ctx.fill();
        ctx.strokeStyle = 'rgba(255,106,106,0.8)'; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(p.x - s * 0.35, p.y + s * 0.35); ctx.lineTo(p.x + s * 0.35, p.y - s * 0.35); ctx.stroke();
        ctx.fillStyle = '#ddd'; ctx.font = `bold 11px ${SERIF}`; ctx.textAlign = 'center'; ctx.fillText(`${Math.ceil(left)}s`, p.x, p.y + s / 2 - 4);
      } else if (n <= ECLIPSE_WARN && ecl + n <= MATCH_TIME) {
        ctx.strokeStyle = 'rgba(10,6,20,0.9)'; ctx.globalAlpha = 0.5 + 0.4 * Math.sin(elapsed * 6); ctx.lineWidth = 3;
        roundRect(p.x - s / 2 - 5, p.y - s / 2 - 5, s + 10, s + 10, 11); ctx.stroke(); ctx.globalAlpha = 1;
      }
    }
  }

  drawSlots(list, ghost ? list.length - 1 : -1);

  if (castMsg && !ghost) {
    ctx.globalAlpha = Math.min(1, castMsg.life * 1.5);
    ctx.textAlign = 'center';
    ctx.font = 'bold 18px "Big Caslon", "Libre Caslon Text", Georgia, serif';
    ctx.fillStyle = castMsg.color;
    if (ctx.measureText(castMsg.text).width <= W - 24) ctx.fillText(castMsg.text, cx, PENT.msgY);
    else {
      // a longer hint: smaller, wrapped upward from the usual line
      ctx.font = `bold 14px ${SERIF}`;
      const lines = wrapLines(castMsg.text, W - 32);
      ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(8,6,16,0.85)';
      lines.forEach((l, i) => { const y = PENT.msgY - (lines.length - 1 - i) * 17; ctx.strokeText(l, cx, y); ctx.fillText(l, cx, y); });
    }
    ctx.globalAlpha = 1;
  }
}

function dim(a) { ctx.fillStyle = `rgba(5,3,10,${a})`; ctx.fillRect(0, 0, W, H); }

// ── menus ──
// Main: the title, your hero showing off on the left with Wizard / Space on

// a menu button: just the word, in capitals, filling its row top to bottom;
// a long word is squished sideways to fit rather than shrunk
let worldLockedT = 0;   // a tap on the locked Wide World makes its small print flash
function menuButton(b) {
  if (b.sub) {
    worldLockedT = Math.max(0, worldLockedT - 0.016);
    ctx.textAlign = 'center'; ctx.font = `13px ${SERIF}`;
    ctx.fillStyle = worldLockedT > 0 && Math.sin(worldLockedT * 30) > 0 ? '#ff9a9a' : '#d6d0e4';
    ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,8,30,0.85)';
    ctx.strokeText(b.sub, b.x + b.w / 2, b.y + b.h + 14); ctx.fillText(b.sub, b.x + b.w / 2, b.y + b.h + 14);
  }
  const word = b.title.toUpperCase();
  const fs = b.h * 1.3; // capitals are about 0.7 of the font size: this fills the row
  ctx.font = `${fs}px ${SERIF_BIG}`;
  ctx.textAlign = 'center';
  const w = ctx.measureText(word).width, sx = Math.min(1, b.w / w);
  ctx.save();
  ctx.translate(b.x + b.w / 2, b.y + b.h / 2 + fs * 0.35);
  ctx.scale(sx, 1);
  ctx.shadowColor = b.selected ? b.color : 'rgba(10,8,30,0.85)'; ctx.shadowBlur = b.selected ? 18 : 10;
  ctx.fillStyle = b.color;
  ctx.fillText(word, 0, 0);
  ctx.restore();
}

// your hero, big, doing a little routine: the wizard twirls sparks from the
// staff, the spacefarer floats and fires the blaster; tap it to make it cast
function drawMenuHero(cx, cy, s, dt) {
  menuT += dt;
  menuCast = Math.max(0, menuCast - dt);
  const t = menuT, every = 2.6, phase = (t % every) / every;
  const casting = menuCast > 0 || phase > 0.78;
  const elemCol = TYPE_COLOR[ELEM_CYCLE[Math.floor(t / every) % 5]];
  // a soft glow behind
  const g = ctx.createRadialGradient(cx, cy, 4, cx, cy, s * 34);
  g.addColorStop(0, mySkin === 'space' ? 'rgba(74,168,255,0.35)' : 'rgba(199,125,255,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, s * 34, 0, TAU); ctx.fill();
  ctx.save();
  if (mySkin === 'space') {
    // zero-g: drift, tilt, jetpack puffs, and a blaster shot now and then
    const bob = Math.sin(t * 1.6) * 5;
    ctx.translate(cx, cy + bob); ctx.rotate(Math.sin(t * 0.9) * 0.08); ctx.scale(s, s);
    if (Math.random() < 0.5) menuFx.push({ x: cx - 12 * s, y: cy + bob + 4 * s, vx: rnd(-30, -10), vy: rnd(20, 60), r: rnd(2, 4), life: 0.7, color: 'rgba(200,220,255,0.8)' });
    drawAstronaut(0, 0, 1, '#c77dff', '#4aa8ff', { x: 1, y: 0 }, casting ? '#fff' : elemCol);
    if (casting && Math.random() < 0.6) menuFx.push({ x: cx + 22 * s, y: cy + bob, vx: rnd(380, 520), vy: rnd(-20, 20), r: 3, life: 0.5, color: elemCol, bolt: true });
  } else {
    // the wizard bobs, raises the staff, and showers sparks of each element in turn
    const bob = Math.sin(t * 2) * 3, lift = casting ? 6 : 0;
    ctx.translate(cx, cy + bob); ctx.scale(s, s);
    drawWizardFigure(0, 0, Math.sin(t * 0.7) > 0 ? 1 : -1, '#4b2d7a', '#6a3fb0', casting ? '#fff' : elemCol, lift);
    const ox = cx + 16 * s, oy = cy + bob - (20 + lift) * s;
    const n = casting ? 3 : Math.random() < 0.3 ? 1 : 0;
    for (let i = 0; i < n; i++) { const a = rnd(-Math.PI, 0); const sp = rnd(60, casting ? 220 : 90); menuFx.push({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rnd(1.5, 3.5), life: 0.9, color: elemCol }); }
  }
  ctx.restore();
  // sparks, puffs and bolts
  for (const f of menuFx) {
    f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt; if (!f.bolt) f.vy += 60 * dt;
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 2));
    if (f.bolt) { ctx.strokeStyle = f.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(f.x - 14, f.y); ctx.lineTo(f.x, f.y); ctx.stroke(); }
    else circle(f.x, f.y, f.r, f.color);
  }
  ctx.globalAlpha = 1;
  menuFx = menuFx.filter(f => f.life > 0 && f.x < W + 20);
}

// ── how to play: moving pictures for the quick start ──
// Each loops on its own clock from when the page was opened. They're laid
// out 324 wide and scaled to fit the page.
const DEMO_W = 324, DEMO_H = { cast: 244, move: 140, build: 178 };
let howtoT0 = 0;
const ease = k => (k <= 0 ? 0 : k >= 1 ? 1 : k * k * (3 - 2 * k));
const ramp = (t, a, b) => ease((t - a) / (b - a)); // 0 until a, 1 from b, easing in between
const towards = (p, q, k) => ({ x: p.x + (q.x - p.x) * k, y: p.y + (q.y - p.y) * k });

// a patch of meadow to act things out on
function demoField(x, y, w, h) {
  roundRect(x, y, w, h, 10);
  ctx.fillStyle = meadowPattern(); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,0.22)'; ctx.lineWidth = 1.5; ctx.stroke();
}
// you, small: the wizard or the spacefarer, stepping along (step) or standing still
function demoHero(x, y, s, fx, step, lift) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const hop = step ? Math.abs(Math.sin(step)) * 3 : 0;
  circle(3, 12, 12, 'rgba(0,0,0,0.25)');
  if (mySkin === 'space') drawAstronaut(0, -hop, 1, '#c77dff', '#4aa8ff', { x: fx, y: 0 }, '#ffd24a');
  else drawWizardFigure(0, -hop, fx, '#4b2d7a', '#6a3fb0', '#c77dff', lift || 0);
  ctx.restore();
}
// a unit for a picture, without its health bar (and in your universe's style, whatever the last game was)
function demoUnit(kind, team, x, y, s, extra) {
  const keep = mode, d = UNITS[kind];
  mode = 'demo';
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  try { drawUnit(Object.assign({ kind, team, def: d, r: d.r, elem: d.elem, x: 0, y: 0, hp: 1, maxHp: 1, cd: 0, wob: x * 0.37, walk: 0, structure: !!d.structure }, extra), true); }
  finally { ctx.restore(); mode = keep; }
}
// a fingertip: a soft ring, rippling while it presses
function drawFinger(x, y, press, alpha) {
  if (alpha <= 0) return;
  ctx.globalAlpha = alpha;
  if (press > 0) { const k = press % 1; circle(x, y, 13 + k * 13, null, `rgba(255,255,255,${0.7 * (1 - k)})`, 2); }
  circle(x, y, 13, 'rgba(255,255,255,0.3)', 'rgba(255,255,255,0.95)', 2);
  circle(x, y, press > 0 ? 6 : 4, '#fff');
  ctx.globalAlpha = 1;
}

// 1) Making a spell: onto Fire, off and back onto Fire, across to Air, lift: a
// Fireball. It waits on the FIRE button, and a tap sends it at the imp.
function demoCast(t) {
  const LEN = 7.6, CAST = 1.85, PRESS = 2.85, HIT = 3.75;
  t %= LEN;
  // the field: you on the left, an imp on the right (gone in a flash when the fireball lands)
  demoField(0, 0, DEMO_W, 84);
  demoHero(46, 50, 1, 1, 0, t > PRESS && t < PRESS + 0.5 ? 7 : 0);
  const gone = ramp(t, HIT, HIT + 0.45);
  if (gone < 1) {
    ctx.globalAlpha = ramp(t, 0, 0.35) * (1 - gone);
    demoUnit('imp', 'red', 272, 50, 1.6, { flash: t > HIT && t < HIT + 0.2 ? 1 : 0 });
    ctx.globalAlpha = 1;
  }
  if (t > PRESS && t < HIT) {
    const k = (t - PRESS) / (HIT - PRESS), x = 64 + 200 * k, y = 30 + 18 * k - Math.sin(k * Math.PI) * 12;
    for (let i = 4; i >= 1; i--) circle(x - i * 8, y + i * 0.8, 7 - i * 1.3, `rgba(255,${110 + i * 25},40,${0.55 - i * 0.11})`);
    const g = ctx.createRadialGradient(x, y, 1, x, y, 12);
    g.addColorStop(0, '#fff'); g.addColorStop(0.35, '#ffb04a'); g.addColorStop(1, 'rgba(255,90,42,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 12, 0, TAU); ctx.fill();
  } else if (t >= HIT && t < HIT + 0.6) {
    const k = (t - HIT) / 0.6;
    circle(268, 46, 10 + k * 30, null, `rgba(255,170,60,${1 - k})`, 4);
    for (let i = 0; i < 8; i++) { const a = i * TAU / 8; circle(268 + Math.cos(a) * k * 28, 46 + Math.sin(a) * k * 28, 3.5 * (1 - k), '#ffd24a'); }
  }
  // the star, as in a game
  const cx = 150, cy = 158, R = 47, S = 28, FB = { x: 284, y: cy - 18 };
  const node = r => { const a = -Math.PI / 2 + NODE_ORDER.indexOf(r) * TAU / 5; return { x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R }; };
  const fade = 1 - ramp(t, CAST + 0.35, CAST + 0.75); // (the runes clear once the spell is made)
  const list = fade > 0 ? [[0.3, 'F'], [0.9, 'F'], [1.65, 'A']].filter(([at]) => t >= at).map(([, r]) => r) : [];
  circle(cx, cy, R * 1.12, 'rgba(40,20,70,0.35)', 'rgba(199,125,255,0.3)', 2);
  ctx.strokeStyle = 'rgba(199,125,255,0.3)'; ctx.lineWidth = 2; ctx.beginPath();
  for (let i = 0; i <= 5; i++) { const p = node(NODE_ORDER[(i * 2) % 5]); i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
  ctx.stroke();
  // where the finger is: sliding over the star, then lifted and over to FIRE (waiting just below it, so it can be read)
  const F = node('F'), A = node('A'), out = towards(F, { x: cx, y: cy }, 0.55), below = { x: FB.x - 4, y: FB.y + 42 };
  let fp = FB, down = 0, alpha = 1;
  if (t < 0.3) { fp = F; alpha = ramp(t, 0, 0.25); }
  else if (t < 0.6) { fp = towards(F, out, ease((t - 0.3) / 0.3)); down = t - 0.3; }
  else if (t < 0.9) { fp = towards(out, F, ease((t - 0.6) / 0.3)); down = t - 0.3; }

// a side's land around its towers: their outline, rounded out by d
function hullOf(pts) {
  const P = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  if (P.length < 3) return P;
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lo = [], hi = [];
  for (const p of P) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], p) <= 0) lo.pop(); lo.push(p); }
  for (const p of P.reverse()) { while (hi.length >= 2 && cross(hi[hi.length - 2], hi[hi.length - 1], p) <= 0) hi.pop(); hi.push(p); }
  return lo.slice(0, -1).concat(hi.slice(0, -1));
}
function blobPath(pts, d) {
  const h = hullOf(pts);
  ctx.beginPath();
  if (h.length === 1) { ctx.arc(h[0].x, h[0].y, d, 0, TAU); return; }
  h.forEach((p, i) => {
    const a = h[(i + h.length - 1) % h.length], b = h[(i + 1) % h.length];
    ctx.arc(p.x, p.y, d, Math.atan2(p.y - a.y, p.x - a.x) - Math.PI / 2, Math.atan2(b.y - p.y, b.x - p.x) - Math.PI / 2);
  });
  ctx.closePath();
}
function blobArea(pts, d) {
  const h = hullOf(pts);
  let a = 0, edge = 0;
  h.forEach((p, i) => { const q = h[(i + 1) % h.length]; a += p.x * q.y - q.x * p.y; edge += Math.hypot(q.x - p.x, q.y - p.y); });
  return Math.abs(a) / 2 + edge * d + Math.PI * d * d;
}

  // the report scrolls
  const top = 132, bottom = H - 62;
  ctx.save(); ctx.beginPath(); ctx.rect(0, top, W, bottom - top); ctx.clip();
  roundRect(L - 6, top, bw + 12, bottom - top, 12); ctx.fillStyle = 'rgba(10,8,30,0.7)'; ctx.fill();
  let y = top + 8 - endScroll;
  const S = teams.stats || newStats(), SS = TEAMS.map(t => S[t] || newStats()[t]), B = SS[0];
  const each = f => SS.map(f), RL = L + 6, RW = bw - 12;
  y = drawScoreTable(y) + 12;
  // land
  y = endHeading('Land', RL, RW, y);
  y = endHeads(RL, RW, y);
  const last = S.land[S.land.length - 1] || [0, ...TEAMS.map(t => teams[t].cells)];
  y = endRow('Ground held at the end', TEAMS.map((t, i) => Math.round(last[i + 1] / FIELD_CELLS * 100) + '%'), RL, RW, y);
  y = endRow('Points from land', TEAMS.map(t => teams.groundTo === t ? GROUND_BONUS : 0), RL, RW, y);
  if (S.land.length > 1) {
    const g = endLandGraph(S.land, L + 6, bw - 12, y + 12);
    y = g.y;
    ctx.textAlign = 'left'; ctx.fillStyle = '#ccc'; ctx.font = `italic 12px ${SERIF}`;
    ctx.fillText(g.switches ? `The lead in land changed hands ${g.switches} time${g.switches > 1 ? 's' : ''}.` : 'The lead in land never changed hands.', L + 6, y + 4);
    y += 14;
  }
  // sigils and kills
  y = endHeading('Sigils and kills', RL, RW, y + 8);
  y = endHeads(RL, RW, y);
  y = endRow('Sigils broken', each(X => X.sigils || 0), RL, RW, y);
  const K = (S, k) => (S.killed && S.killed[k]) || 0;
  y = endRow('Minions killed (1 each on the tally)', each(X => K(X, 'minion')), RL, RW, y);
  y = endRow('Titans killed (5 each)', each(X => K(X, 'titan')), RL, RW, y);
  y = endRow('Wizards and heroes killed (10 each)', each(X => K(X, 'wizard') + K(X, 'hero')), RL, RW, y);
  y = endRow('Kill tally (every 5 = 1 point)', each(X => X.tally || 0), RL, RW, y);
  y = endRow('Turrets destroyed (5 points each)', each(X => K(X, 'turret')), RL, RW, y);
  y = endRow('Points from kills', each(X => X.killPts || 0), RL, RW, y);
  // spells
  y = endHeading('Spells cast', RL, RW, y + 8);
  y = endHeads(RL, RW, y);
  for (const el of CHARGE_TYPES) {
    drawGlyph(ELEM_GLYPH[el], L + 14, y + 10, 13, TYPE_COLOR[el]);
    ctx.textAlign = 'left'; ctx.fillStyle = TYPE_COLOR[el]; ctx.font = `14px ${SERIF}`; ctx.fillText(ELEM_NAME[el], L + 26, y + 14);
    y = endRow('', each(X => X.spells[el] || 0), RL, RW, y);
  }
  const tot = o => Object.values(o || {}).reduce((a, b) => a + b, 0);
  y = endRow('Total', each(X => tot(X.spells)), RL, RW, y);
  for (const t of TEAMS) {
    const used = teams[t] && teams[t].used;
    if (!used || !used.size || t === 'blue') continue;
    ctx.textAlign = 'left'; ctx.fillStyle = TEAM_COLOR[t]; ctx.font = `italic 12px ${SERIF}`;
    ctx.fillText(`${TEAM_NAME[t]}’s wizards used ${used.size} different spells.`, L + 6, y + 12); y += 18;
  }
  // resonance
  y = endHeading('Resonance (average)', RL, RW, y + 8);
  y = endHeads(RL, RW, y);
  for (const el of CHARGE_TYPES) {
    const avg = S => S.resN ? Math.round(S.resSum[el] / S.resN * 100) + '%' : '–';
    drawGlyph(ELEM_GLYPH[el], L + 14, y + 10, 13, TYPE_COLOR[el]);
    ctx.textAlign = 'left'; ctx.fillStyle = TYPE_COLOR[el]; ctx.font = `13px ${SERIF}`; ctx.fillText(RES_TEXT[el], L + 26, y + 14);
    y = endRow('', each(avg), RL, RW, y);
  }
  // builds
  const elemCol = k => TYPE_COLOR[k];
  y = endHeading('Turrets built', RL, RW, y + 8);
  TEAMS.forEach((t, i) => y = endShares(teamLabel(t), SS[i].turret, elemCol, RL, RW, y));
  y = endHeading('Titans sent', RL, RW, y + 4);
  TEAMS.forEach((t, i) => y = endShares(teamLabel(t), SS[i].titan, elemCol, RL, RW, y));
  y = endKey(CHARGE_TYPES.map(e => [TYPE_COLOR[e], ELEM_NAME[e]]), L + 6, bw - 12, y);
  // minions
  y = endHeading('Minions sent', L + 6, bw - 12, y + 4);
  const kindCol = k => TYPE_COLOR[UNITS[k].elem];
  TEAMS.forEach((t, i) => y = endShares(teamLabel(t), SS[i].minions, kindCol, RL, RW, y));
  y = endKey(MINION_KINDS.map(k => [kindCol(k), `${UNITS[k].name} (${ELEM_NAME[UNITS[k].elem]})`]), L + 6, bw - 12, y);
  ctx.textAlign = 'left'; ctx.fillStyle = '#999'; ctx.font = `italic 12px ${SERIF}`;
  const theirs = TEAMS.slice(1).map((t, i) => `${tot(SS[i + 1].minions)} of ${TEAM_NAME[t].toLowerCase()}’s`);
  ctx.fillText(`${tot(B.minions)} of yours${theirs.length > 1 ? ', ' + theirs.slice(0, -1).join(', ') : ''} and ${theirs[theirs.length - 1]} took the field.`, L + 6, y + 6);
  y += 20;
  endMax = Math.max(0, y + endScroll - bottom + 8);
  endScroll = clamp(endScroll, 0, endMax);
  ctx.restore();
  if (endScroll < endMax - 4) {
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,210,74,0.85)'; ctx.font = `13px ${SERIF}`;
    ctx.fillText('▼ scroll for the full report', W / 2, bottom - 6 + Math.sin(elapsed * 4) * 2);
  }
  endButton = overlayT > 1 ? { title: 'Continue', color: '#c77dff', x: W / 2 - 90, y: H - 54, w: 180, h: 40 } : null;
  if (endButton) menuButton(endButton);
}

function drawWon() {
  if (mode === 'battle') { drawBattleEnd(true); return; }
  if (mode === 'adventure') { drawAdventureWon(); return; }
  dim(Math.min(0.75, overlayT));
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd24a';
  ctx.font = `bold ${Math.min(40, W / 11)}px "Big Caslon", "Libre Caslon Display", "Libre Caslon Text", Georgia, serif`;
  const y = panelTop * 0.35;
  ctx.fillText('The five guardians have fallen', W / 2, y);
  ctx.font = 'italic 15px "Big Caslon", "Libre Caslon Display", "Libre Caslon Text", Georgia, serif';
  ctx.fillText('Your universe holds… for now.', W / 2, y - 40);
  ctx.fillStyle = '#ddd';
  ctx.font = '16px "Big Caslon", "Libre Caslon Text", Georgia, serif';
  const m = Math.floor(elapsed / 60), s = Math.floor(elapsed % 60).toString().padStart(2, '0');
  ctx.fillText(`Score ${score.toLocaleString()}   ·   Time ${m}:${s}   ·   Foes ${kills}`, W / 2, y + 36);
  if (overlayT > 1) {
    ctx.fillStyle = '#c77dff';
    ctx.font = 'bold 17px "Big Caslon", "Libre Caslon Text", Georgia, serif';
    ctx.fillText('[ tap to keep exploring ]', W / 2, y + 76);
  }
}

// the pause screen, over the frozen game
function drawPaused() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  dim(0.62);
  const t = performance.now() / 1000, cy = H * 0.4;
  ctx.textAlign = 'center';
  ctx.shadowColor = '#c77dff'; ctx.shadowBlur = 22;
  ctx.fillStyle = '#efe9f8'; ctx.font = `${Math.round(Math.min(54, W / 6.5))}px ${SERIF_BIG}`;
  ctx.fillText('PAUSED', W / 2, cy);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#cfc8e0'; ctx.font = `italic 15px ${SERIF}`;
  ctx.fillText(mode === 'battle' ? 'The battle waits while you’re away' : 'Your adventure waits while you’re away', W / 2, cy + 34);
  let y = cy + 34;
  if (mode === 'battle' && teams) {
    // where things stand: the score and the time left
    y += 32;
    ctx.font = `bold 15px ${SERIF}`;
    const parts = TEAMS.flatMap(t => [[`${teamLabel(t)} ${teams[t].score}`, TEAM_COLOR[t]], ['  ·  ', '#888']]).concat([[`${clockText(Math.ceil(teams.time))} left`, '#fff']]);
    let x = W / 2 - parts.reduce((a, [p]) => a + ctx.measureText(p).width, 0) / 2;
    ctx.textAlign = 'left';
    for (const [p, c] of parts) { ctx.fillStyle = c; ctx.fillText(p, x, y); x += ctx.measureText(p).width; }
    ctx.textAlign = 'center';
  }
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 3);
  ctx.fillStyle = '#ffd24a'; ctx.font = `bold 17px ${SERIF}`;
  ctx.fillText(isTouch ? 'TAP TO CARRY ON' : 'CLICK OR PRESS A KEY TO CARRY ON', W / 2, y + 44);
  ctx.globalAlpha = 1;
}

// ── loop ─────────────────────────────────────────────────────────────────────
function tick(dt) {
  if (paused) return; // everything waits: clocks, foes, spells, messages
  if (net.role !== 'guest') dt = swingDt(dt);
  overlayT += dt;
  if (state !== 'title') updateCam(dt);
  for (let i = 0; i < 5; i++) nodePulse[i] = Math.max(0, nodePulse[i] - dt * 4);
  if (shake > 0) shake = Math.max(0, shake - dt * 40);
  if (flash > 0) flash = Math.max(0, flash - dt * 1.5);
  if (castMsg && (castMsg.life -= dt) <= 0) castMsg = null;
  if (banner && (banner.life -= dt) <= 0) banner = null;
  if (net.role === 'guest' && state !== 'title') { guestUpdate(dt); return; }
  if (net.role === 'host' && (state === 'won' || state === 'lost')) {
    net.sendT = (net.sendT || 0) - dt;
    if (net.sendT <= 0) { net.sendT = 1; net.send(makeSnapshot()); netEvents = []; }
  }
  if (state === 'play') update(dt);
  else if (state === 'dead' && mode === 'battle') {
    update(dt); // the battle goes on while you wait
    if (overlayT > 5 && state === 'dead') respawn();
  }
  else if (state === 'reveal') reveal.t += dt;
  else if (state === 'lore') lore.t += dt;
  else if (state === 'title') elapsed += dt;
}

function render() {
  // the menus and the game each have their own look
  if ((state === 'title') !== lookMenu) { lookMenu = state === 'title'; applyLook(); }
  // start every frame from a clean context, in case a previous frame threw mid-draw
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.setLineDash([]);
  ctx.fillStyle = '#0b0a12';
  ctx.fillRect(0, 0, W, H);
  if (state === 'title') {
    if (!player.face) resetPlayer();
    drawMenuSky();
    drawTitle();
    return;
  }
  drawWorld();
  drawAtmosphere();
  drawEclipseTint();
  drawEclipseClock(false); // faint, behind everything
  if (flash > 0) { ctx.fillStyle = `rgba(255,246,176,${flash * 0.7})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'play' && timeStop > 0) { ctx.fillStyle = 'rgba(200,200,220,0.28)'; ctx.fillRect(0, 0, W, H); }
  else if (state === 'play' && timeWarp > 0) { ctx.fillStyle = 'rgba(60,120,255,0.13)'; ctx.fillRect(0, 0, W, H); }
  if (LAB) { drawLab(); return; }
  if (state === 'reveal') { drawReveal(); return; }
  if (state === 'lore') { drawLore(); return; }
  if (state === 'map') { drawMapOverlay(); return; }
  if (state === 'book') { drawBook(); return; }
  if (state === 'naming' || state === 'shop') { dim(0.35); return; }
  drawHUD();
  if (mode !== 'battle') drawTitanBar();
  drawPentagram();
  drawFireButton();   // on top of the pentagram's backdrop
  drawFollowButton();
  drawOrderButton();
  drawBookButton();
  drawTravelButton();
  drawThreatArrows();
  drawTalk();
  drawSoundTilt();
  drawEclipseClock(true); // an eclipse near or on: in front
  drawOrders();
  if (state === 'dead') drawDead();
  if (state === 'won') drawWon();
  if (state === 'lost') drawBattleEnd(false);
}

let last = performance.now();
function loop(now) {
  // schedule first so one bad frame can't stop the game
  requestAnimationFrame(loop);
  if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const v = viewSize();
  if (v.w !== W || v.h !== H) resize();
  try {
    tick(dt);
    render();
    if (paused) drawPaused();
  } catch (err) {
    console.error(err);
  }
}
requestAnimationFrame(loop);
joinFromLink();
</script>
</body>
</html>
