// the nearest tree or rock standing across a walker's way, within `look` ahead of it
function treeAhead(e, ux, uy, look) {
  const r = e.r || 12;
  let hit = null, ha = Infinity;
  for (const s of solidsNear(e.x, e.y)) {
    const ox = s.x - e.x, oy = s.y - e.y, along = ox * ux + oy * uy;
    if (along <= 0 || along - s.r > look) continue;
    if (Math.abs(ox * uy - oy * ux) < s.r + r && along < ha) { ha = along; hit = s; }
  }
  return hit;
}
// The same, for something on foot: it steps round the trees and rocks in its way
// instead of pressing into them. It turns along the edge of whatever stands ahead,
// keeps to the side it chose till it's past, and if it still gets nowhere (wedged
// between trees, or against a house) it sets off the other way round for a moment.
function walkToward(e, tx, ty, spd, dt, stop) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  if (d <= stop || d === 0) return d;
  if (e.fly || (e.def && e.def.flying)) return moveToward(e, tx, ty, spd, dt, stop);
  const step = Math.min(spd * dt, d - stop), r = e.r || 12;
  let ux = dx / d, uy = dy / d, ahead = d;
  // stuck? (it got hardly anywhere it tried to go for a while, and not because one of your stone walls holds it):
  // work out a way through, or (if enough others are doing that this moment) set off the other way round
  e.stuckT = (e.stuckT || 0) + dt; e.stuckWant = (e.stuckWant || 0) + step;
  if (e.stuckT > 0.6) {
    const moved = e.stuckX == null ? Infinity : Math.hypot(e.x - e.stuckX, e.y - e.stuckY);
    if (e.stuckWant > 12 && moved < e.stuckWant * 0.25 && !solidTemps().some(b => Math.hypot(b.x - e.x, b.y - e.y) < b.r + r + 4)) {
      let way = null;
      if (!(elapsed < e.noWayTill) && waysLeft > 0) {
        waysLeft--; way = findWay(e, tx, ty);
        if (!way) e.noWayTill = elapsed + 3;   // (no way through from here: don't look again for a bit)
      }
      if (way) { e.way = { pts: way, i: 0, tx, ty, t: elapsed }; e.detour = 0; }
      else {
        e.roundSide = -(e.roundSide || 1);
        e.detour = 0.7 + Math.random() * 0.4;
        e.detourA = Math.atan2(uy, ux) + e.roundSide * 1.3;
      }
    }
    e.stuckT = 0; e.stuckWant = 0; e.stuckX = e.x; e.stuckY = e.y;
  }
  // following a way it worked out, while what it's after stays about where it was
  if (e.way && (elapsed - e.way.t > 8 || Math.hypot(tx - e.way.tx, ty - e.way.ty) > 160)) e.way = null;
  if (e.way) {
    const w = e.way;
    while (w.i < w.pts.length && Math.hypot(w.pts[w.i].x - e.x, w.pts[w.i].y - e.y) < 16) w.i++;
    if (w.i >= w.pts.length) e.way = null;
    else { const p = w.pts[w.i]; ahead = Math.hypot(p.x - e.x, p.y - e.y) || 1; ux = (p.x - e.x) / ahead; uy = (p.y - e.y) / ahead; }
  }
  if (e.detour > 0) {
    e.detour -= dt;
    ux = Math.cos(e.detourA); uy = Math.sin(e.detourA);
  } else {
    const hit = treeAhead(e, ux, uy, Math.min(ahead, r + 70));
    if (hit) {
      const ox = hit.x - e.x, oy = hit.y - e.y, od = Math.hypot(ox, oy) || 1;
      // go round on the side away from it (the shorter way), and stick to that side
      if (e.round !== hit) { e.round = hit; e.roundSide = ox * uy - oy * ux >= 0 ? 1 : -1; }
      const sx = -oy / od * e.roundSide, sy = ox / od * e.roundSide;   // along its edge
      const w = clamp(1 - (od - hit.r - r) / 70, 0.3, 1);
      ux = ux * (1 - w) + sx * w; uy = uy * (1 - w) + sy * w;
      const l = Math.hypot(ux, uy) || 1; ux /= l; uy /= l;
    }
  }
  e.x += ux * step;
  e.y += uy * step;
  return d;
}

function bossAttack(b) {
  const col = b.def.color;
  if (b.def.attack === 'ring') {
    for (let i = 0; i < b.def.shots; i++) {
      const a = i / b.def.shots * TAU + elapsed;
      enemyShots.push({ x: b.x, y: b.y, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220, r: 8, dmg: b.def.dmg * 0.5, life: 3, color: col });
    }
    return;
  }
  const base = Math.atan2(player.y - b.y, player.x - b.x);
  const n = b.def.shots;
  for (let i = 0; i < n; i++) {
    const a = base + (i - (n - 1) / 2) * 0.22;
    enemyShots.push({ x: b.x, y: b.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, r: 8, dmg: b.def.dmg * 0.5, life: 3, color: col });
  }
}

function updateBoss(b, dt, dp) {
  const home = Math.hypot(b.def.x - b.x, b.def.y - b.y);
  if (!b.aggro && dp < 380) {
    b.aggro = true;
    b.shotCd = 1.2;
    showBanner(b.def.name, 'awakens', 2);
    SFX.awaken();
  }
  if (b.aggro && (dp > 700 || home > 900)) b.aggro = false;

  if (b.aggro) {
    moveToward(b, player.x, player.y, b.spd * (b.slow > 0 ? 0.6 : 1), dt, b.r + PLAYER_R - 4);
    b.shotCd -= dt;
    if (b.shotCd <= 0) { b.shotCd = b.def.rate; bossAttack(b); }
    if (b.def.summon) {
      b.summonCd -= dt;
      if (b.summonCd <= 0) {
        b.summonCd = 7;
        for (let i = 0; i < 2; i++) spawnQueue.push(makeFoe(b.def.summon, b.x + rnd(-70, 70), b.y + rnd(-70, 70)));
        ring(b.x, b.y, b.r + 40, b.def.color, 0.5);
      }
    }
  } else {
    moveToward(b, b.def.x, b.def.y, b.spd, dt, 2);
    b.hp = Math.min(b.maxHp, b.hp + b.maxHp * 0.08 * dt);
  }
}

// Slow-mo and Time Stop act on enemies and their shots, never on you.
function timeScale() { return timeStop > 0 ? 0 : timeWarp > 0 ? 0.3 : 1; }

// Who a foe goes after: a taunting helper nearby, otherwise you.
function foeTarget(f) {
  let best = null, bd = 360;
  for (const a of allies) {
    if (a.kind !== 'imp' && a.kind !== 'golem' && !(a.kind === 'critter' && a.taunt)) continue;
    const d = Math.hypot(a.x - f.x, a.y - f.y);
    if (d < bd) { bd = d; best = a; }
  }
  return best || player;
}

function updateFoes(realDt) {
  if (mode === 'battle') return; // battle units are moved by updateBattle (stepUnit)
  const dt = realDt * timeScale();
  if (dt === 0) return; // time is stopped
  for (const f of foes) {
    if (f.dead || f.proxyOf || f.gate) continue;
    f.flash = Math.max(0, f.flash - dt);
    f.hitCd -= dt; f.slow -= dt; f.txtCd -= dt;
    if (f.poison > 0) {
      f.poison -= dt;
      f.poisonTick -= dt;
      if (f.poisonTick <= 0) { f.poisonTick = 0.5; damageFoe(f, f.poisonDps * 0.5, 'poison'); }
      if (f.dead) continue;
    }
    if (f.burn > 0) {
      f.burn -= dt;
      f.burnTick = (f.burnTick || 0) - dt;
      if (f.burnTick <= 0) { f.burnTick = 0.5; damageFoe(f, (f.burnDps || DOT_DPS) * 0.5, 'fire'); }
      if (f.dead) continue;
    }
    for (const k of ['hex', 'fear', 'confuse', 'root']) if (f[k] > 0) f[k] -= dt;
    // frozen, stunned or turned to stone: no moving, biting or shooting
    if (f.freeze > 0 || f.stun > 0 || f.stone > 0) {
      f.freeze = (f.freeze || 0) - dt; f.stun = (f.stun || 0) - dt; f.stone = (f.stone || 0) - dt;
      continue;
    }
    if (f.adv) { updateAdvFoe(f, dt); continue; }
    if (f.unit) {
      if (f.fear > 0) walkToward(f, f.x * 2 - player.x, f.y * 2 - player.y, f.spd, dt, 0);
      else if (f.confuse > 0) {
        if (Math.random() < dt * 1.5) f.wander = rnd(0, TAU);
        f.x += Math.cos(f.wander) * f.spd * dt; f.y += Math.sin(f.wander) * f.spd * dt;
      } else updateUnit(f, dt);
      if (!f.structure) {
        f.x += f.kx * dt; f.y += f.ky * dt;
        const dmp = Math.max(0, 1 - 7 * dt);
        f.kx *= dmp; f.ky *= dmp;
        f.x = clamp(f.x, -WORLD, WORLD); f.y = clamp(f.y, -boundY(), boundY());
        if (mode === 'battle') clampArena(f, f.r);
        if (!f.def.flying) pushOut(f, f.r);
      }
      continue;
    }
    const dp = Math.hypot(player.x - f.x, player.y - f.y);
    const px = f.x, py = f.y;
    let tgt = player;
    if (f.boss) {
      updateBoss(f, dt, dp);
      if (f.root > 0) { f.x = px; f.y = py; }
    } else {
      if (dp > 1300) { f.dead = true; continue; }
      let spd = f.spd * (f.slow > 0 ? 0.5 : 1) * (f.hex > 0 ? 0.4 : 1);
      if (f.root > 0) spd = 0;
      if (f.fear > 0) {
        walkToward(f, f.x * 2 - player.x, f.y * 2 - player.y, spd * 1.1, dt, 0); // run away
      } else if (f.confuse > 0) {
        if (Math.random() < dt * 1.5) f.wander = rnd(0, TAU);
        f.x += Math.cos(f.wander) * spd * dt; f.y += Math.sin(f.wander) * spd * dt;
      } else {
        tgt = foeTarget(f);
        (f.kind === 'bat' ? moveToward : walkToward)(f, tgt.x, tgt.y, spd, dt, f.r + (tgt === player ? PLAYER_R : tgt.r) - 2);
        if (f.kind === 'bat' && spd > 0) { f.x += Math.cos(elapsed * 7 + f.wob) * 40 * dt; f.y += Math.sin(elapsed * 9 + f.wob) * 40 * dt; }
      }
    }
    f.x += f.kx * dt; f.y += f.ky * dt;
    const damp = Math.max(0, 1 - 7 * dt);
    f.kx *= damp; f.ky *= damp;
    f.x = clamp(f.x, -WORLD, WORLD); f.y = clamp(f.y, -boundY(), boundY());
    if (f.kind !== 'bat') {
      if (isWater(f.x, f.y)) { f.x = px; f.y = py; } // only bats fly over the lake
      pushOut(f, f.r);
    }

    // bites: frogs, the frightened and the confused don't bite
    if (f.hex > 0 || f.fear > 0 || f.confuse > 0) continue;
    if (tgt !== player) {
      if (Math.hypot(tgt.x - f.x, tgt.y - f.y) < f.r + tgt.r + 4 && f.hitCd <= 0) {
        tgt.hp -= f.def.dmg; f.hitCd = 1;
        burst(tgt.x, tgt.y, '#ccc', 5, 120);
        if (tgt.hp <= 0) tgt.life = 0;
      }
    } else if (dp < f.r + PLAYER_R + 2 && f.hitCd <= 0) {
      hurtPlayer(f.def.dmg);
      f.hitCd = 1;
      knock(f, player.x, player.y, 160);
    }
  }

  // keep regular foes from piling onto one spot
  separate(foes.filter(f => !f.boss && !f.gate && !f.titan));

  if (spawnQueue.length) { foes.push(...spawnQueue); spawnQueue = []; }
  foes = foes.filter(f => !f.dead || f.boss || f.proxyOf);
}

function updateShots(dt) {
  for (const s of shots) {
    potency = s.pot || 1;
    // Seeking weaves curve toward the nearest foe
    if (s.spec && s.spec.finish === 'S' && s.fx === 'woven') {
      const t = nearestFoe(s.x, s.y, 320, s.hit);
      if (t) {
        const sp = Math.hypot(s.vx, s.vy), want = Math.atan2(t.y - s.y, t.x - s.x), cur = Math.atan2(s.vy, s.vx);
        let d = Math.atan2(Math.sin(want - cur), Math.cos(want - cur));
        const a = cur + clamp(d, -5 * dt, 5 * dt);
        s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp;
      }
    }
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; s.spin += dt * 8;
    shotTrailFx(s, dt);
    if (inWall(s.x, s.y)) { s.life = 0; burst(s.x, s.y, '#999', 4, 100); continue; }
    for (const f of foes) {
      if (s.life <= 0) break;
      if (f.dead || f.sub || s.hit.has(f)) continue;
      if (Math.hypot(f.x - s.x, f.y - s.y) < s.r + f.r) {
        if (f.mirrorT > 0 && !s.ally) {
          // the Mirror Titan's mirror sends your shot straight back at you
          enemyShots.push({ x: s.x, y: s.y, vx: -s.vx * 0.9, vy: -s.vy * 0.9, r: s.r + 1, dmg: s.dmg * 0.8, life: 2, color: TYPE_COLOR.mirror, elem: 'spirit', from: f, spin: 0 });
          ring(s.x, s.y, 22, TYPE_COLOR.mirror, 0.25); SFX.block(); s.life = 0;
          break;
        }
        s.hit.add(f);
        const dealt = damageFoe(f, s.dmg, s.type, s.ally);
        if (s.fx === 'woven') { applyWovenFx(f, s.spec, dealt, s); react(s.type, s.x, s.y, 40); wovenFinishHit(s, f); }
        shotImpact(s, f);
        if (s.fx === 'slow') f.slow = 2.5;
        if (s.fx === 'burn') setBurn(f, 2);
        if (s.fx === 'freeze') applyCC(f, 'freeze', 3);
        if (s.fx === 'hex') applyCC(f, 'hex', 6);
        if (s.fx === 'drain' && dealt) healPlayer(dealt * 0.6 / potency);
        if (s.fx === 'poison') setPoison(f, 3, 0.6);
        if (s.fx === 'explode') { SFX.explode(false); aoe(s.x, s.y, s.boomR, s.boom, s.type, 120); }
        else if (s.fx === 'woven') elemHit(ELEM_OF[s.type] || s.type, s.x, s.y, 0.8);
        if (s.pierce-- <= 0) s.life = 0;
      }
    }
  }
  shots = shots.filter(s => s.life > 0);

  const edt = dt * timeScale();
  for (const s of enemyShots) {
    if (s.homing && edt > 0) {
      const want = Math.atan2(player.y - s.y, player.x - s.x), cur = Math.atan2(s.vy, s.vx), sp = Math.hypot(s.vx, s.vy);
      const a = cur + clamp(Math.atan2(Math.sin(want - cur), Math.cos(want - cur)), -s.homing * edt, s.homing * edt);
      s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp;
    }
    s.x += s.vx * edt; s.y += s.vy * edt; s.life -= edt; s.spin = (s.spin || 0) + edt * 8;
    if (s.life <= 0 && s.boom) { shotBoom(s); s.boom = 0; }
    if (inWall(s.x, s.y)) { s.life = 0; shotBoom(s); continue; }
    if (solidTemps().some(b => Math.hypot(b.x - s.x, b.y - s.y) < b.r + s.r)) { s.life = 0; burst(s.x, s.y, '#999', 4, 100); continue; }
    const guard = allies.find(a => a.kind === 'golem' && Math.hypot(a.x - s.x, a.y - s.y) < a.r + s.r + 4);
    if (guard) { guard.hp -= s.dmg; if (guard.hp <= 0) guard.life = 0; s.life = 0; burst(s.x, s.y, '#aaa', 5, 100); continue; }
    if (Math.hypot(player.x - s.x, player.y - s.y) < s.r + PLAYER_R + (player.mirror > 0 ? 14 : 0)) {
      if (player.mirror > 0) {
        // Mirror Shield: send it back as your own shot; reflected magic hurts even guardians
        const sp = Math.hypot(s.vx, s.vy) || 1;
        launch(s.x, s.y, { x: -s.vx / sp, y: -s.vy / sp }, { dmg: s.dmg * 2, type: 'mirror', speed: sp * 1.4, r: s.r });
        SFX.block();
        s.life = 0;
        continue;
      }
      hurtPlayer(s.dmg); shotHitPlayer(s); s.life = 0;
      if (s.boom) { shotBoom(s); s.boom = 0; }
    }
  }
  enemyShots = enemyShots.filter(s => s.life > 0);
}

// one helper's moment: it follows and helps whoever is "player" (its summoner)
function stepAlly(a, dt) {
  potency = a.pot || 1;
  a.life -= dt; a.cd -= dt;
  if (a.kind === 'wisp') {
    // circles you and slowly heals you
    a.ang += 2.2 * dt;
    moveToward(a, player.x + Math.cos(a.ang) * 42, player.y + Math.sin(a.ang) * 42, 400, dt, 0);
    if (a.cd <= 0) {
      a.cd = 1;
      if (player.hp < player.maxHp) { healPlayer(0.8); fx.push({ kind: 'bolt', pts: [{ x: a.x, y: a.y }, { x: player.x, y: player.y }], life: 0.2, max: 0.2, color: '#9f9' }); }
    }
  } else if (a.kind === 'imp') {
    // runs ahead of you and draws enemies to it
    walkToward(a, player.x + player.face.x * 110, player.y + player.face.y * 110, 200, dt, 4);
    pushOut(a, a.r);
  } else if (a.kind === 'golem') {
    // plants itself between you and the nearest enemy; soaks bites and shots
    const t = nearestFoe(player.x, player.y, 400);
    const tx = t ? player.x + (t.x - player.x) * 0.45 : player.x + 50, ty = t ? player.y + (t.y - player.y) * 0.45 : player.y;
    walkToward(a, tx, ty, 120, dt, 4);
    pushOut(a, a.r);
  } else if (a.kind === 'critter') {
    updateCritter(a, dt);
  } else if (a.kind === 'dragon') {
    a.ang += 1.1 * dt;
    moveToward(a, player.x + Math.cos(a.ang) * 90, player.y + Math.sin(a.ang) * 60 - 40, 260, dt, 0);
    if (!player.loaded || player.loaded.key !== 'FFSAFF') a.life = Math.min(a.life, 1.5); // out of breath: flies off
  }
}
function updateAllies(dt) {
  const me = player;
  for (const a of allies) {
    // a helper sticks with (and heals) whoever summoned it
    player = a.owner || me;
    try { stepAlly(a, dt); } finally { player = me; }
  }
  allies = allies.filter(a => {
    if (a.life > 0) return true;
    if (a.kind === 'critter' && a.spec.finish === 'F') {
      // a Volatile helper goes out with a bang
      wovenBurstAt(a.x, a.y, 80, 2 * a.spec.power, a.spec);
      puff(a.x, a.y, '#8a7a70', 3, 18, 30);
    } else if (a.kind === 'imp') {
      // the decoy goes out with a bang
      aoe(a.x, a.y, 90, 4, 'fire', 220);
      burst(a.x, a.y, '#ff8a3a', 30, 320);
      SFX.explode(false);
    } else burst(a.x, a.y, '#aaa', 10, 120);
    return false;
  });
}

function updateEffects(dt) {
  for (const z of zones) {
    potency = z.pot || 1;
    z.life -= dt; z.tick -= dt;
    if (z.tick <= 0) {
      z.tick = 0.5;
      for (const f of foes) {
        if (f.dead || Math.hypot(f.x - z.x, f.y - z.y) > z.r + f.r) continue;
        if (z.type === 'fire') { damageFoe(f, 0.4, 'fire'); continue; } // meteor crater
        if (z.type === 'mud') { applyCC(f, 'root', 0.7); continue; }
        if (z.type === 'vortex') { damageFoe(f, 0.5, 'air'); continue; }
        if (z.type === 'spring') continue;
        if (z.type === 'inferno') { damageFoe(f, 1.3, 'fire'); setBurn(f, 2); knock(f, z.x, z.y, 260); continue; }
        if (z.type === 'tornado') { damageFoe(f, 0.7, 'air'); continue; }
        if (z.type === 'woven') {
          const dealt = damageFoe(f, 0.12 * z.spec.power, z.spec.elem);
          applyWovenFx(f, z.spec, dealt, z, true);
          if (z.charged > 0) { damageFoe(f, 0.2, 'lightning'); applyCC(f, 'stun', 0.5); }
          continue;
        }
        damageFoe(f, 0.08, 'poison');
        setPoison(f, 2, DOT_DPS * SPREAD);
      }
    }
  }
  potency = 1;
  for (const z of zones) {
    if (z.follow) { z.x = z.follow.x; z.y = z.follow.y; }
    if (z.type === 'tornado') {
      // drifting on, pulling everything near into it; whatever reaches the eye spins helpless
      z.x += z.vx * dt; z.y += z.vy * dt;
      for (const f of foes) {
        if (f.dead || f.structure) continue;
        const dx = z.x - f.x, dy = z.y - f.y, d = Math.hypot(dx, dy);
        if (d > z.r || d < 1) continue;
        const pull = (f.boss || f.titan ? 45 : 300) * dt;
        f.x += dx / d * Math.min(pull, d); f.y += dy / d * Math.min(pull, d);
        if (d < 60 && !f.boss && !f.titan) applyCC(f, 'stun', 0.4);
      }
    }
    if (z.type === 'vortex') {
      // drag everything inside toward the eye
      for (const f of foes) {
        if (f.dead || f.structure) continue;
        const dx = z.x - f.x, dy = z.y - f.y, d = Math.hypot(dx, dy);
        if (d > z.r || d < 6) continue;
        const pull = (f.boss ? 40 : 260) * dt;
        f.x += dx / d * Math.min(pull, d); f.y += dy / d * Math.min(pull, d);
      }
    }
    if (z.type === 'woven') {
      if (z.charged > 0 && z.charged < 90) z.charged -= dt;
      const fin = z.spec.finish;
      if (fin === 'W' && z.r0) z.r = Math.min(z.r0 * 1.7, z.r + z.r0 * 0.15 * dt);                 // Spreading
      if (fin === 'A' && z.r0) { const t = nearestFoe(z.x, z.y, 500); if (t) moveToward(z, t.x, t.y, 45, dt, 0); } // Drifting
      if (fin === 'S' && z.r0) for (const f of foes) {                                                 // Pulling
        if (f.dead || f.structure) continue;
        const dx = z.x - f.x, dy = z.y - f.y, d = Math.hypot(dx, dy);
        if (d < z.r * 1.3 && d > 8) { const pull = (f.boss ? 15 : 70) * dt; f.x += dx / d * pull; f.y += dy / d * pull; }
      }
      // a sacred circle (or any pool with a Spirit upgrade) heals you while you stand in it
      if ((z.spec.elem === 'spirit' || z.spec.heal) && Math.hypot(player.x - z.x, player.y - z.y) < z.r)
        player.hp = Math.min(player.maxHp, player.hp + 1.5 * (z.pot || 1) * dt);
      // a whirlwind drags enemies toward its eye
      if (z.spec.elem === 'air') for (const f of foes) {
        if (f.dead || f.structure) continue;
        const dx = z.x - f.x, dy = z.y - f.y, d = Math.hypot(dx, dy);
        if (d < z.r && d > 6) { const pull = (f.boss ? 20 : 90) * dt; f.x += dx / d * pull; f.y += dy / d * pull; }
      }
    }
    if (z.type === 'spring' && Math.hypot(player.x - z.x, player.y - z.y) < z.r) {
      player.hp = Math.min(player.maxHp, player.hp + 2.5 * (z.pot || 1) * dt);
      player.mana = Math.min(player.maxMana, player.mana + 1 * dt);
    }
  }
  for (const z of zones) if (z.life <= 0 && z.type === 'woven' && z.spec.finish === 'F' && z.r0 && !z.erupted) {
    // Erupting: the pool goes up in one last blast
    z.erupted = true; potency = z.pot || 1;
    wovenBurstAt(z.x, z.y, z.r * 1.1, 0.8 * z.spec.power, z.spec);
    puff(z.x, z.y, '#8a7a70', 3, 24, 40);
  }
  potency = 1;
  zones = zones.filter(z => z.life > 0);

  for (const t of traps) {
    potency = t.pot || 1;
    t.arm -= dt; t.life -= dt;
    if (t.arm > 0) continue;
    if (foes.some(f => !f.dead && Math.hypot(f.x - t.x, f.y - t.y) < f.r + 26)) {
      if (t.spec) { wovenBurstAt(t.x, t.y, 85 * t.spec.size, 2.2 * t.spec.power, t.spec); SFX.explode(false); t.life = 0; continue; }
      aoe(t.x, t.y, 75, 2.5, 'fire', 260);
      fx.push({ kind: 'nova', elem: 'fire', x: t.x, y: t.y, r: 75, life: 0.5, max: 0.5 });
      puff(t.x, t.y, '#8a7a70', 3, 20, 40);
      SFX.explode(false);
      t.life = 0;
    }
  }
  traps = traps.filter(t => t.life > 0);

  for (const b of tempSolids) {
    potency = b.pot || 1;
    if (curSide === 'blue') b.life -= dt;
    if (!b.spec || (b.side || 'blue') !== curSide) continue;
    b.tick -= dt;
    if (b.tick > 0) continue;
    b.tick = 0.5;
    for (const f of foes) {
      if (f.dead || f.structure || Math.hypot(f.x - b.x, f.y - b.y) > b.r + f.r + 8) continue;
      const dmg = b.elem === 'fire' ? 0.8 * b.spec.power : b.elem === 'air' ? 0.3 * b.spec.power : 0;
      const dealt = dmg ? damageFoe(f, dmg, b.elem) : 0;
      applyWovenFx(f, b.spec, dealt, b);
      if (b.elem === 'spirit') applyCC(f, 'confuse', 3 * b.spec.dur);
    }
    // Soothing walls mend the caster who shelters by them
    if (b.spec.finish === 'S' && Math.hypot(player.x - b.x, player.y - b.y) < 70) { player.hp = Math.min(player.maxHp, player.hp + 0.25); shapeBits(b.x, b.y - 10, 'plus', '#9dffb0', 1, 30, 50); }
  }
  if (curSide === 'blue') tempSolids = tempSolids.filter(b => {
    if (b.life > 0) return true;
    if (b.spec && b.spec.finish === 'F') {
      // Exploding walls go off as they crumble (on their caster's side)
      const side = b.side || 'blue', caster = side === curSide ? player : casterFor(side);
      if (caster) withSide(side, () => wovenBurstAt(b.x, b.y, 55, 1.5 * b.spec.power, b.spec), caster);
    }
    puff(b.x, b.y, '#c2a57a', 1, 12, 10);
    return false;
  });

  for (const w of waves) {
    potency = w.pot || 1;
    if (w.dir) {
      // a wall of water rolling forward: it hits each foe once and carries them along
      w.travel += w.speed * dt;
      for (const f of foes) {
        if (f.dead) continue;
        const rx = f.x - w.x, ry = f.y - w.y, along = rx * w.dir.x + ry * w.dir.y, perp = Math.abs(-rx * w.dir.y + ry * w.dir.x);
        if (perp > w.w / 2 + f.r || along > w.travel + f.r || along < w.travel - 70) continue;
        if (!w.hit.has(f)) { w.hit.add(f); damageFoe(f, w.dmg, w.type); }
        if (!f.structure && !f.sub) { const k = (f.knockK ?? (f.boss || f.titan ? 0.2 : 1)) * w.speed * dt; f.x += w.dir.x * k; f.y += w.dir.y * k; }
      }
      if (Math.random() < 0.9) { const o = rnd(-0.5, 0.5) * w.w; particles.push({ shape: 'drop', x: w.x + w.dir.x * w.travel - w.dir.y * o, y: w.y + w.dir.y * w.travel + w.dir.x * o, vx: w.dir.x * 120, vy: w.dir.y * 120 - 80, r: 3, life: 0.6, decay: 1.8, color: '#e8f8ff', rot: 0, spin: 0 }); }
      continue;
    }
    w.r += w.speed * dt;
    if (Math.random() < 0.8) { const a = rnd(0, TAU); particles.push({ shape: 'drop', x: w.x + Math.cos(a) * w.r, y: w.y + Math.sin(a) * w.r, vx: Math.cos(a) * 80, vy: Math.sin(a) * 80 - 90, r: 3, life: 0.7, decay: 1.8, color: '#e8f8ff', rot: 0, spin: 0 }); }
    for (const f of foes) {
      if (f.dead || w.hit.has(f)) continue;
      if (Math.abs(Math.hypot(f.x - w.x, f.y - w.y) - w.r) < f.r + 14) {
        w.hit.add(f);
        damageFoe(f, w.dmg, w.type);
        knock(f, w.x, w.y, 340);
      }
    }
  }
  waves = waves.filter(w => (w.dir ? w.travel < w.maxT : w.r < w.maxR));

  for (const m of meteors) {
    potency = m.pot || 1;
    if (m.delay > 0) { m.delay -= dt; continue; }
    m.t -= dt;
    if (m.t <= 0 && m.small) {
      for (const f of foes) {
        if (f.dead) continue;
        if (Math.hypot(f.x - m.x, f.y - m.y) < 75 + f.r) { damageFoe(f, 2.4, 'fire'); setBurn(f, 2); knock(f, m.x, m.y, 180); }
      }
      ring(m.x, m.y, 75, TYPE_COLOR.fire, 0.35);
      burst(m.x, m.y, '#ff8a3a', 26, 300);
      puff(m.x, m.y, '#8a7a70', 2, 22, 30);
      SFX.explode(false);
      shake = Math.max(shake, 5);
      continue;
    }
    if (m.t <= 0) {
      // the meteor strikes its mark full on; the blast around it is spread thinner
      for (const f of foes) {
        if (f.dead) continue;
        const d = Math.hypot(f.x - m.x, f.y - m.y);
        if (d < 200 + f.r) { damageFoe(f, d < 40 + f.r ? 24 : 8, 'fire'); knock(f, m.x, m.y, 380); }
      }
      ring(m.x, m.y, 200, TYPE_COLOR.fire, 0.4);
      react('fire', m.x, m.y, 200);
      SFX.explode(true);
      zones.push({ x: m.x, y: m.y, r: 140, life: 4, max: 4, tick: 0, type: 'fire', pot: potency });
      fx.push({ kind: 'cracks', ...crackLines(m.x, m.y, 220, 9), life: 2, max: 2 });
      fx.push({ kind: 'nova', elem: 'fire', x: m.x, y: m.y, r: 200, life: 0.6, max: 0.6 });
      puff(m.x, m.y, '#8a7a70', 6, 40, 50);
      burst(m.x, m.y, '#ff5a2a', 80, 560);
      burst(m.x, m.y, '#ffd24a', 40, 340);
      shake = Math.max(shake, 20);
      flash = Math.max(flash, 0.35);
    }
  }
  meteors = meteors.filter(m => m.t > 0);
  potency = 1;
  if (curSide === 'blue') decayVisuals(dt);
}

// shared visuals fade (once a frame, whoever's side is running)
function decayVisuals(dt) {
  for (const e of fx) e.life -= dt;
  fx = fx.filter(e => e.life > 0);

  const w = windAt();
  for (const p of particles) {
    if (p.home) { const dx = player.x - p.x, dy = player.y - p.y, d = Math.hypot(dx, dy) || 1; p.vx += dx / d * 900 * dt; p.vy += dy / d * 900 * dt; if (d < 16) p.life = 0; }
    if (p.shape) { p.rot += (p.spin || 0) * dt; if (p.shape === 'drop') p.vy += 160 * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    const damp = Math.max(0, 1 - (p.puff || p.leaf ? 1.5 : p.home ? 0.5 : p.shape ? 2.5 : 4) * dt);
    p.vx *= damp; p.vy *= damp;
    if (p.puff || p.leaf) p.vx += w * 30 * dt; // the breeze carries smoke and leaves
    if (p.leaf) { p.rot += p.spin * dt; p.vy += 10 * dt; }
    p.life -= p.decay * dt;
  }
  particles = particles.filter(p => p.life > 0);

  for (const t of floaters) { t.y -= 40 * dt; t.life -= dt; }
  floaters = floaters.filter(t => t.life > 0);
}

function showScroll(combo, title) {
  SFX.scroll();
  state = 'reveal';
  reveal = { combo, name: SPELLS[combo].name, title, t: 0, tip: mode === 'adventure' ? tipFor(combo) : null };
  movePtr = null; movePos = null; moveStart = null;
  castPtr = null; finger = null; seq = [];
  player.charging = null;
}
function openChest(c) {
  c.opened = true;
  showScroll(c.boss.def.reward, 'AN ANCIENT SCROLL');
}

function closeReveal() {
  reveal = null;
  if (mode === 'adventure') {
    state = 'play';
    if (ADV.world.won && !ADV.world.wonShown) { ADV.world.wonShown = true; advSave(); state = 'won'; overlayT = 0; banner = null; castMsg = null; SFX.bossDown(); }
    return;
  }
  if (bossesDown === BOSSES.length && !wonShown) {
    wonShown = true;
    state = 'won';
    overlayT = 0;
  } else {
    state = 'play';
  }
}

function heroMove(dt) {
  // movement: keyboard + held pointer on the field (not while waiting to respawn)
  let mx = 0, my = 0;
  if (state !== 'play') { movePos = null; for (const k in keys) keys[k] = false; }
  if (keys.KeyW || keys.ArrowUp)    my -= 1;
  if (keys.KeyS || keys.ArrowDown)  my += 1;
  if (keys.KeyA || keys.ArrowLeft)  mx -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (movePos && moveStart && moveStart.shooting) {
    const w = screenToWorld(movePos.x, movePos.y); shootArrow(w.x, w.y); // held: keep firing
  } else if (movePos && moveStart && (moveStart.moved || performance.now() - moveStart.t > 180)) {
    // without tilt, a held finger walks once it's clearly a hold or a drag, not a tap
    const ps = playerOnScreen(), dx = movePos.x - ps.x, dy = movePos.y - ps.y, d = Math.hypot(dx, dy);
    if (d > 14) { mx += dx / d; my += dy / d; }
  }
  const t = tiltVector();
  mx += t.x; my += t.y;
  if (player.fearT > 0 && player.fearFrom && state === 'play') { const fx0 = player.x - player.fearFrom.x, fy0 = player.y - player.fearFrom.y, fd = Math.hypot(fx0, fy0) || 1; mx = fx0 / fd; my = fy0 / fd; } // terrified: you run
  if (LAB) mx = my = 0;              // (in the Brush Lab you stand and write)
  // analog: a gentle tilt walks slowly, anything else is capped at full speed
  let ml = Math.hypot(mx, my);
  player.moving = ml > 0.02 && !player.charging && state === 'play' && !(player.stunT > 0); // charging a big spell roots you (and so does being stunned)
  if (player.moving) {
    mx /= ml; my /= ml;
    ml = Math.min(1, ml);
    movePlayer(mx, my, (player.onBoat ? 230 : 170) * ml * (player.haste > 0 ? 1.6 : 1) * (player.chill > 0 ? 0.6 : 1) * (mode === 'adventure' ? statusSlow() : 1) * dt);
    player.face = { x: mx, y: my };
    if (player.haste > 0 && Math.random() < 0.5) {
      particles.push({ x: player.x, y: player.y + 10, vx: 0, vy: 0, r: 3, life: 0.6, decay: 2, color: TYPE_COLOR.air });
    }
  }
}

function update(dt) {
  elapsed += dt;
  waysLeft = 1;

  heroMove(dt);

  // board the boat by walking into it
  player.boardCd = Math.max(0, player.boardCd - dt);
  if (!player.onBoat && player.boardCd <= 0 && dist(player, boat) < 52) {
    player.onBoat = true;
    player.x = boat.x; player.y = boat.y;
    castMessage('All aboard! Sail to land to step off', '#bfe6ff');
    SFX.splash();
  }

  heroTimers(dt);
  timeWarp = Math.max(0, timeWarp - dt);
  timeStop = Math.max(0, timeStop - dt);

  if (mode === 'battle') updateBattle(dt);
  else {
    // shoves slide you a little way, stopped by rock and walls (sliding along a wall)
    if (player.kx || player.ky) {
      const ok = (x, y) => !landBlocks(x, y, PLAYER_R) && !segWallHit(x, y, PLAYER_R) && !rectHit(x, y, PLAYER_R * 0.9);
      const n = Math.ceil(Math.hypot(player.kx, player.ky) * dt / 8);   // in short steps, so a big shove can't jump a wall
      for (let i = 0; i < n; i++) {
        const nx = player.x + player.kx * dt / n, ny = player.y + player.ky * dt / n;
        if (ok(nx, ny)) { player.x = nx; player.y = ny; } else if (ok(nx, player.y)) player.x = nx; else if (ok(player.x, ny)) player.y = ny; else break;
      }
      const damp = Math.max(0, 1 - 6 * dt); player.kx *= damp; player.ky *= damp;
      if (Math.abs(player.kx) + Math.abs(player.ky) < 5) player.kx = player.ky = 0;
    }
    updateSanctum(dt);
    updateWorld(dt);
    updateHazards(dt);
    if (LAB) updateLab(dt);
  }
  updateFoes(dt);
  potency = 1;
  updateShots(dt);
  updateAllies(dt);
  updateStorms(dt);
  updateEffects(dt);
  potency = 1;
  if (mode === 'battle' && teams) {
    // the other sides' spells, helpers, pools and storms
    for (const side of TEAMS) {
      if (side === 'blue') continue;
      const c = casterFor(side);
      if (c) withSide(side, () => { updateShots(dt); updateAllies(dt); updateStorms(dt); updateEffects(dt); }, c);
      potency = 1;
    }
    updateHeroes(dt);
    // ship the battle to your friends
    if (net.role === 'host') { net.sendT -= dt; if (net.sendT <= 0) { net.sendT = 0.1; net.send(makeSnapshot()); netEvents = []; } }
  }

  for (const c of chests) {
    if (!c.opened && c.boss.dead && state === 'play' && dist(c, player) < 44) openChest(c);
  }
  for (const sc of scrolls) {
    if (!sc.taken && state === 'play' && dist(sc, player) < 34) {
      sc.taken = true;
      showScroll(sc.combo, 'A LOST SCROLL');
    }
  }
}

// timers, mana and buffs for whichever hero is current
function heroTimers(dt) {
  if (player.charging) {
    player.charging.t -= dt;
    if (player.charging.t <= 0) { const k = player.charging.key; player.charging = null; releaseSpell(k); }
  }
  player.arrowCd = Math.max(0, player.arrowCd - dt);

  player.invuln  = Math.max(0, player.invuln - dt);
  if (mode !== 'battle') {
    player.chill = Math.max(0, (player.chill || 0) - dt);
    player.stunT = Math.max(0, (player.stunT || 0) - dt);
    player.hexT = Math.max(0, (player.hexT || 0) - dt);
    player.fearT = Math.max(0, (player.fearT || 0) - dt);
    if (player.poisonT > 0) {
      player.poisonT -= dt; player.poisonTick = (player.poisonTick || 0) - dt;
      if (player.poisonTick <= 0) { player.poisonTick = 0.5; sapPlayer(0.35); if (Math.random() < 0.5) floatText(player.x + rnd(-8, 8), player.y - 28, '-0.35', '#7dff4a', 12); }
    }
    if (player.burnT > 0) {
      player.burnT -= dt; player.burnTick = (player.burnTick || 0) - dt;
      if (player.burnTick <= 0) { player.burnTick = 0.5; sapPlayer(0.3); if (Math.random() < 0.5) floatText(player.x + rnd(-8, 8), player.y - 28, '-0.3', '#ff9a5a', 12); }
    }
  }
  player.skin    = Math.max(0, player.skin - dt);
  player.haste   = Math.max(0, player.haste - dt);
  player.empower = Math.max(0, player.empower - dt);
  const own = mode === 'battle' ? cellOwner(player.x, player.y) : 0, inEnemyGround = own > 0 && own !== TEAM_CODE[curSide];
  player.mana    = Math.min(player.maxMana, player.mana + (inEnemyGround ? 0.6 : 2.2) * dt);
  const fp = fountainPos(curSide);
  if ((player !== hostP || state === 'play') && !player.dead && Math.hypot(player.x - fp.x, player.y - fp.y) < SHRINE_R) {
    player.hp   = Math.min(player.maxHp, player.hp + 3 * dt);
    player.mana = Math.min(player.maxMana, player.mana + 3 * dt);
  }

  for (const k of ['omni', 'mirror', 'sanct', 'phoenix', 'regen']) player[k] = Math.max(0, player[k] - dt);
  if (player.regen > 0) player.hp = Math.min(player.maxHp, player.hp + 1.2 * dt);
}

// Walk (or sail) one step, sliding along obstacles.
function movePlayer(dx, dy, step) {
  let nx = clamp(player.x + dx * step, -boundX(), boundX());
  let ny = clamp(player.y + dy * step, -boundY(), boundY());
  if (mode === 'battle') { const c = clampArena({ x: nx, y: ny }, PLAYER_R); nx = c.x; ny = c.y; }
  if (player.onBoat) {
    // the boat stays on water; steering into land steps you ashore
    const ahead = { x: nx + dx * 14, y: ny + dy * 14 };
    if (isWater(ahead.x, ahead.y) && isWater(nx, ny)) {
      player.x = boat.x = nx; player.y = boat.y = ny; boat.ang = Math.atan2(dy, dx);
      return;
    }
    // step ashore straight ahead, or a little to either side if that spot is taken
    const base = Math.atan2(dy, dx);
    for (const off of [0, 0.4, -0.4, 0.8, -0.8]) {
      for (const reach of [36, 50]) {
        const lx = player.x + Math.cos(base + off) * reach, ly = player.y + Math.sin(base + off) * reach;
        if (blockedForFoot(lx, ly, PLAYER_R)) continue;
        player.onBoat = false;
        player.boardCd = 1.2;
        player.x = lx; player.y = ly;
        return;
      }
    }
    return;
  }
  // on foot: no wading into water, up rock or over a chasm; slide along whatever stops you
  const ok = (x, y) => mode === 'battle' || (!landBlocks(x, y, PLAYER_R) && !segWallHit(x, y, PLAYER_R));
  if (ok(nx, ny)) { player.x = nx; player.y = ny; }
  else if (ok(nx, player.y)) player.x = nx;
  else if (ok(player.x, ny)) player.y = ny;
  pushOut(player, PLAYER_R);
}


// ── battle mode ─────────────────────────────────────────────────────────────
// A 5-minute points match between blue (you) and red. It ends when the clock
// runs out (most points wins) or a home base is destroyed (its destroyer wins).
// Three ways to score:
//  · Ground: towers joined by laser lines enclose each side's ground. The
//    side holding more ground when the match ends scores 140.
//  · Kills fill a tally: a minion adds 1, a titan 5, a wizard (or a hero) 10;
//    every 5 on the tally is a point. A turret is worth 5 points outright,
//    and a duel friend's wizard 10.
//  · Sigils: each side has one sigil in its own ground. Destroying the
//    other side's scores 65 and earns a bonus build; it reappears elsewhere
//    behind a 15s wall. Destroying a base scores 100 and ends the match.
// Build turns alternate: on yours, build a turret (claims open ground) or a titan.
let difficulty = 'easy';
let friends = [];   // (battle) the current side's units: yours, except while another side's spells run
// every team's units and buildings, and the players' wizards' stand-ins
let units = { blue: [], red: [], green: [] };
let unitsVer = 0;   // goes up whenever a team's list changes
const enemyCache = {}, tgtCache = {};
// everything a team fights: the other teams' units, buildings and players' wizards
function enemiesOf(team) {
  const c = enemyCache[team];
  if (c && c.v === unitsVer) return c.list;
  const list = [];
  for (const t of TEAMS) if (t !== team) for (const u of units[t] || []) list.push(u);
  enemyCache[team] = { v: unitsVer, list };
  return list;
}
// the other sides' helpers, which can be hit as well
function helpersAgainst(team) {
  const out = [];
  for (const t of TEAMS) if (t !== team) for (const a of fxOf(t).allies) if (a.kind === 'critter' && a.life > 0) out.push(a);
  return out;
}
// the current side's view: "friends" are its units, "foes" what its spells can hit
function setViews(side) {
  if (mode !== 'battle' || !teams || net.role === 'guest') return;
  friends = units[side] || [];
  foes = enemiesOf(side).concat(helpersAgainst(side).map(helperTarget));
}
// what a team's units and towers fight (worked out once a frame)
function targetsFor(team) {
  const c = tgtCache[team];
  if (c && c.v === unitsVer && c.t === elapsed) return c.list;
  const list = enemiesOf(team).concat(helpersAgainst(team));
  tgtCache[team] = { v: unitsVer, t: elapsed, list };
  return list;
}
// someone on another team is a friend playing against you
const humanFoes = () => mode === 'battle' && !!teams && heroes.some(h => !h.gone && h.team !== (player.team || 'blue'));
let bshots = [];    // shots from units and towers
let teams = null;
let links = [];     // laser walls between friendly towers
const BUILD_CLOSE = 15; // no building in the last 15 seconds
const MATCH_TIME = 300, BUILD_EVERY = 10, SIGIL_WALL = 15, GROUND_BONUS = 140, BASE_BONUS = 100;
const FRONT_X = WORLD * 0.32; // the line (±) behind which each side holds 30% of the oval at the start
const TEAM_COLOR = { blue: '#4aa8ff', red: '#ff4a5a', green: '#47d98b' };

// a computer team's build turn comes up
function aiTurn(team, bonus) {
  const TT = teams[team];
  if (!planOk(TT.plan)) { dropPlan(team); TT.plan = aiPlan(team, walkable(BUILD_EVERY - 1)); }
  if (TT.plan.kind === 'titan') { const e = TT.plan.elem; dropPlan(team); buildTitan(team, e); return; }
  setOff(TT.plan);
  TT.pendingAI = { t: BUILD_EVERY - 1 }; // the same time a player gets to choose
}
// seconds until a team's next build turn
function turnIn(team) {
  const T = teams, n = TEAMS.length, d = (TEAMS.indexOf(team) - TEAMS.indexOf(T.build.team) + n) % n;
  return T.build.t + d * buildEvery();
}
// each frame: plans made ahead of a computer team's turn, and the turns under way
function updateAIBuilds(dt) {
  const T = teams;
  for (const team of TEAMS) {
    if (!isAI(team)) continue;
    const TT = T[team];
    if (!TT.pendingAI) {
      // its turn is coming: pick a spot and start walking
      if (turnIn(team) <= AI_PLAN_AHEAD && (!TT.plan || (TT.plan.kind === 'turret' && !planOk(TT.plan)))) { dropPlan(team); TT.plan = aiPlan(team, walkable(turnIn(team) + BUILD_EVERY - 1)); }
      // the wizard sets off just in time to be there when the turn comes
      if (planOk(TT.plan) && !TT.plan.by.buildAt && turnIn(team) <= walkTime(TT.plan) + 2) setOff(TT.plan);
      continue;
    }
    const P = TT.pendingAI;
    P.t -= dt;
    let plan = TT.plan;
    if (!planOk(plan)) {
      // the wizard fell or the spot was taken: another spot it can still reach, or a titan
      const e = plan && plan.elem;
      if (plan && plan.by && plan.by.buildAt) plan.by.buildAt = null;
      plan = TT.plan = aiPlan(team, walkable(P.t));
      if (plan.kind === 'titan') { dropPlan(team); buildTitan(team, e || plan.elem); continue; }
      setOff(plan);
    }
    const b = plan.by;
    if (Math.hypot(b.x - plan.x, b.y - plan.y) < 50) { // (close enough: crowds jostle)
      const e = plan.elem;
      dropPlan(team);
      if (canBuildAt(b.x, b.y, team)) buildTurret(team, b.x, b.y, e); else buildTitan(team, e);
    } else if (P.t <= 0) {
      // out of time: a titan instead
      const e = plan.elem;
      dropPlan(team);
      buildTitan(team, e);
    }
  }
}

// put a team's sigil somewhere in its own ground, away from its base
function placeSigil(team) {
  const want = TEAM_CODE[team], nx = nexusOf(team), cells = [];
  for (let j = 1; j < ROWS - 1; j++) for (let i = 0; i < COLS; i++) {
    if (terr[j * COLS + i] !== want) continue;
    const c = cellCenter(i, j);
    if (nx && Math.hypot(c.x - nx.x, c.y - nx.y) < 280) continue;
    if (blockedForFoot(c.x, c.y, 24)) continue;
    cells.push(c);
  }
  const c = cells.length ? cells[Math.floor(Math.random() * cells.length)] : homePt(team, 320, rnd(-200, 200));
  const s = addUnit(team, 'sigil', c.x + rnd(-25, 25), c.y + rnd(-25, 25));
  s.wall = SIGIL_WALL;
  ring(s.x, s.y, 60, TEAM_COLOR[team], 0.8);
  news('newsigil', team, null, null, 3);
}

function evenMix() { return Object.fromEntries(MINION_KINDS.map(k => [k, 1 / MINION_KINDS.length])); }

function startBattle(diff, list = ['blue', 'red'], guests = []) {
  setMode('battle');
  setArena(list);
  difficulty = diff;
  resetPlayer();
  clearCombat();
  curSide = 'blue';
  sideFx = { blue: newFx(), red: newFx(), green: newFx() };
  loadFx('blue');
  const fp = fountainPos();
  player.x = fp.x; player.y = fp.y; player.face = { x: 1, y: 0 };
  units = { blue: [], red: [], green: [] }; unitsVer++;
  foes = []; friends = units.blue; bshots = []; links = [];
  chests = []; scrolls = []; boat.x = boat.y = 1e6;
  discovered = new Set();
  bossesDown = 0; kills = 0; score = 0; elapsed = 0; tally = {}; masterHunter = false;
  banner = null; castMsg = null; reveal = null; wonShown = false;
  seq = []; curNode = null;
  // Every level starts with the same army; the commander is what changes (see aiBrain).
  // Very Hard gives the computer more (VH_EDGE); AI_UNIT tunes Hard and Very Hard.
  teams = {
    buildElem: 'fire', // the element of your next turret or titan
    order: 'spread', // your army: 'spread' pushes on its own, 'follow' sticks with you
    orders: { minion: 'attackTurrets', titan: 'attackTurrets' }, // what each group does when spread out
    time: MATCH_TIME, terrRecalc: 0,
    build: { team: TEAMS[0], t: buildEvery() }, pending: null, pendingG: {}, result: null,
    breakdown: {}, stats: newStats(), tally: {}, bonus: {}, skins: {},
    eclipse: planEclipses(),
  };
  for (const team of TEAMS) {
    teams[team] = { score: 0, cells: 0, wave: 4, minions: 10, wizards: 2, wizQ: [], sigilT: 0, mix: evenMix(), turn: 0,
                    brain: null, focus: new Map(), used: new Set(), ultCd: 30, leadMage: null, leader: null,
                    order: 'spread', orders: { minion: 'attackTurrets', titan: 'attackTurrets' }, buildElem: 'fire' };
    teams.breakdown[team] = {}; teams.tally[team] = 0; teams.bonus[team] = 0;
  }
  // the players: you, and any friends who joined; a team nobody plays is the computer's
  hostP.heroId = 'host'; hostP.team = 'blue';
  heroes = [{ id: 'host', team: 'blue', p: hostP, proxy: heroProxy('host', 'blue') }];
  for (const g of guests) addHero(g.id, g.team, g.skin);
  for (const h of heroes) units[h.team].push(h.proxy);
  if (diff === 'vhard') for (const team of TEAMS) if (isAI(team)) { teams[team].minions = Math.round(10 * VH_EDGE.minions); teams[team].wizards = VH_EDGE.wizards; }
  eclipseSeen = {};
  for (const team of TEAMS) {
    const b = homePt(team, 0);
    addUnit(team, 'nexus', b.x, b.y);
    // three turrets on the front line: the middle one a little forward so every one holds ground
    const els = ELEM_CYCLE.slice().sort(() => Math.random() - 0.5), d = teamDir(team);
    let spots;
    if (three()) {
      const a = TEAM_ANGLE3[team], at = (ang, r) => ({ x: Math.cos(ang) * r, y: Math.sin(ang) * r });
      spots = [at(a - 0.75, 760), at(a, 450), at(a + 0.75, 760)];
    } else {
      const edgeY = ARENA_H * Math.sqrt(1 - (FRONT_X / WORLD) ** 2) - 30; // just inside the oval's rim
      spots = [{ x: d.x * FRONT_X, y: -edgeY }, { x: d.x * (FRONT_X - 70), y: 0 }, { x: d.x * FRONT_X, y: edgeY }];
    }
    spots.forEach((p, i) => addUnit(team, 'turret', p.x, p.y, els[i]));
    const n = teams[team].wizards;
    for (let i = 0; i < n; i++) { const p = homePt(team, 130, (i - (n - 1) / 2) * 110); addUnit(team, 'wizard', p.x, p.y, ELEM_CYCLE[(i * 2 + TEAMS.indexOf(team)) % 5]); }
  }
  unitsVer++; setViews('blue');
  computeTerritory();
  for (const team of TEAMS) placeSigil(team);
  state = 'play';
  showBanner(collisionLine(), `${{ easy: 'Easy', medium: 'Medium', hard: 'Hard', vhard: 'Very Hard' }[diff]} · most points in 5 minutes preserves your universe`, 4.5);
}

// Who a unit fights: the nearest opponent it can see (walled sigils and bases are ignored).
function findTarget(u) {
  const opp = targetsFor(u.team);
  let best = null, bd = u.def.aggro;
  if (smartRed(u) && sharp(u)) {
    let bs = -Infinity;
    for (const o of opp) {
      if (o.dead || (o.unit && shielded(o))) continue;
      const d = Math.hypot(o.x - u.x, o.y - u.y) - (o.r || PLAYER_R);
      if (d > bd) continue;
      const sc = smartScore(u, o, d);
      if (sc > bs) { bs = sc; best = o; }
    }
    u.lastTgt = best;
    return best;
  }
  for (const o of opp) {
    if (o.dead || (o.unit && shielded(o))) continue;
    const d = Math.hypot(o.x - u.x, o.y - u.y) - (o.r || PLAYER_R);
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}

// A team's army stance, orders and leader are set by its players; the
// computer's armies always spread out and attack.
function teamStance(team) { return !teams || isAI(team) ? 'spread' : team === 'blue' ? teams.order : teams[team].order; }
function teamOrders(team) { return !teams || isAI(team) ? null : team === 'blue' ? teams.orders : teams[team].orders; }
// who a following army sticks with: whoever last called it, else the team's first player
function teamLeader(team) {
  const T = teams[team], h = (T && T.leader && heroById(T.leader)) || humansOn(team)[0];
  if (!h || h.gone) return null;
  return h.p === hostP ? (state === 'play' ? hostP : null) : (h.p.dead ? null : h.p);
}

function orderFor(u) {
  const ords = teamOrders(u.team);
  if (!ords) return 'attackTurrets';
  if (isMinion(u)) return ords.minion;
  if (u.kind === 'titan') return ords.titan;
  return 'attackTurrets';
}

// Where a guard stands: by the base, or by the turret most under threat
// (or the one furthest forward when none is).
function guardPost(u, what) {
  const home = nexusOf(u.team);
  if (what === 'base' || !teamList(u.team).some(t => t.kind === 'turret' && !t.dead)) return home;
  const enemies = enemiesOf(u.team).filter(o => !o.dead && !o.structure);
  let best = null, score = -Infinity;
  const d = teamDir(u.team);
  for (const t of teamList(u.team)) {
    if (t.kind !== 'turret' || t.dead) continue;
    const near = enemies.filter(o => Math.hypot(o.x - t.x, o.y - t.y) < 450).length;
    const sc = near * 1000 - (t.x * d.x + t.y * d.y) * 0.5 - Math.hypot(t.x - u.x, t.y - u.y) * 0.1;
    if (sc > score) { score = sc; best = t; }
  }
  return best || home;
}

// Where a unit heads when nothing is in reach: the nearest enemy sigil
// (unless walled), otherwise the nearest enemy turret, otherwise a base.
function objectiveFor(u) {
  if (smartRed(u)) { const o = smartObjective(u); if (o) return o; }
  const enemy = enemiesOf(u.team).filter(o => !o.dead && o.structure && !o.proxyOf && !shielded(o));
  const nearest = kind => {
    let best = null, bd = Infinity;
    for (const o of enemy) { if (o.kind !== kind) continue; const d = Math.hypot(o.x - u.x, o.y - u.y); if (d < bd) { bd = d; best = o; } }
    return best;
  };
  if (orderFor(u) === 'attackBase') { const nx = nearest('nexus'); if (nx) return nx; }
  if (u.kind !== 'titan') { const sig = nearest('sigil'); if (sig) return sig; }
  return nearest('turret') || nearest('nexus'); // no turrets left: go for a base
}

function unitAttack(u, tgt) {
  if (u.cd > 0 || u.hex > 0 || u.def.passive) return;
  if (!eclipseMult(u.elem)) { u.cd = 0.3; return; } // eclipsed: it can't fight
  u.cd = u.def.cd;
  const atk = tiredAtk(u) * (u.power || 1) * resDmgOut(u.team, tgt.team);
  if (isMinion(u)) u.tired = Math.min(1, (u.tired || 0) + TIRE_PER_SWING);
  if (u.def.ranged) {
    const dx = tgt.x - u.x, dy = tgt.y - u.y, d = Math.hypot(dx, dy) || 1;
    const big = u.structure, sp = big ? 360 : 420;
    const boom = u.kind === 'wizard' && Math.random() < 0.2 ? 70 : 0; // wizards sometimes throw a fireball
    const small = u.kind === 'archer';
    const oy = u.kind === 'turret' ? -u.r * 1.35 : 0; // turrets fire from their crystal
    bshots.push({ team: u.team, src: u.elem, elem: u.elem, x: u.x + dx / d * u.r, y: u.y + oy + dy / d * u.r, vx: dx / d * sp, vy: dy / d * sp,
                  dmg: u.def.dmg * atk * (boom ? 1.3 : 1), r: big ? 9 : boom ? 9 : small ? 4 : 6, life: 1.8, boom, arrow: small,
                  color: TYPE_COLOR[u.elem] || TEAM_COLOR[u.team], spin: rnd(0, TAU) });
    u.fireFlash = 0.18;
    return;
  }
  if (u.kind === 'titan') {
    // the slam lands a beat after the swing starts
    u.slamT = 0.5;
    u.slamAt = { x: tgt.x, y: tgt.y, tgt };
    return;
  }
  hitUnit(tgt, u.def.dmg * atk * matchup(u.elem, tgt), u.team);
}

function titanSlam(u) {
  const { x, y, tgt } = u.slamAt;
  const pw = (u.power || 1) * resDmgOut(u.team, tgt && tgt.team) * eclipseMult(u.elem);
  if (!pw) { u.slamAt = null; return; }
  if (tgt && !tgt.dead) hitUnit(tgt, u.def.dmg * pw * matchup(u.elem, tgt), u.team);
  // everything of the other sides nearby gets hit too
  const opp = targetsFor(u.team);
  for (const o of opp) if (o !== tgt && !o.dead && Math.hypot(o.x - x, o.y - y) < u.def.splash) hitUnit(o, u.def.dmg * 0.5 * pw * matchup(u.elem, o), u.team);
  ring(x, y, u.def.splash, TYPE_COLOR[u.elem] || TEAM_COLOR[u.team], 0.35);
  ring(x, y, u.def.splash * 0.5, '#d8c8a0', 0.25);
  if (u.elem) elemHit(u.elem, x, y, 2.6);
  for (let i = 0; i < 14; i++) {
    const a = rnd(0, TAU), sp = rnd(60, 180);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.5, r: rnd(3, 6), life: 1, decay: rnd(1.5, 2.5), color: '#8a7a5e' });
  }
  shake = Math.max(shake, 5);
  SFX.explode(false);
  u.slamAt = null;
}

// Damage from units, towers and laser walls (`by` is the team it counts for).
// Your own spells go through damageFoe.
function hitUnit(t, dmg, by) {
  if (t === player) { if (by) player.lastHitBy = by; hurtPlayer(dmg); return; }
  if (t.proxyOf) { const h = heroOf(t); if (!t.dead && h) { if (by) h.lastHitBy = by; hurtPlayer(dmg, h); } return; }
  if (t.kind === 'critter') { t.hp -= dmg; burst(t.x, t.y, '#ccc', 4, 100); if (t.hp <= 0) t.life = 0; return; }
  if (t.dead) return;
  if (by) t.lastHitBy = by;
  if (shielded(t)) {
    if (t.txtCd <= 0) { floatText(t.x, t.y - t.r - 10, shieldText(t), '#bde', 13); t.txtCd = 0.8; }
    return;
  }
  t.hp -= minionHit(t, mageGuard(t, dmg)) * (t.unit ? resDmgIn(t.team, by) : 1);
  t.flash = 0.12;
  if (t.hp <= 0) unitFell(t);
}

// which team brought something down (in a two-team match, simply the other one)
function killerOf(o, team) {
  const by = o.lastHitBy;
  if (by && by !== team && TEAMS.includes(by)) return by;
  return TEAMS.length === 2 ? otherTeam(team) : null;
}

// A unit is gone. The team that brought it down scores for it.
function unitFell(u) {
  if (u.mage && u.mage.phoenix > 0) {
    // a computer wizard's Phoenix: back up once, in flames
    u.mage.phoenix = 0; u.hp = u.maxHp;
    burst(u.x, u.y, '#ffb04a', 50, 420);
    floatText(u.x, u.y - 50, 'PHOENIX!', '#ff8a3a', 18);
    return;
  }
  u.dead = true;
  const by = killerOf(u, u.team);
  if (by) {
    if (u.kind === 'sigil') { teamScore(by, u.def.pts, u.x, u.y - u.r - 20, 'Sigils'); const S = stats(by); if (S) S.sigils++; }
    else if (u.kind !== 'nexus') scoreKill(by, isMinion(u) ? 'minion' : u.kind, u.x, u.y - u.r - 20);
  }
  burst(u.x, u.y, TEAM_COLOR[u.team], u.structure ? 60 : 14, u.structure ? 420 : 240);
  if (u.kind === 'wizard') teams[u.team].wizQ.push({ t: 12 });
  if (u.kind === 'sigil') {
    teams[u.team].sigilT = 3;
    shake = Math.max(shake, 10);
    SFX.bossDown();
    news('sigil', u.team, by, null, 3);
    if (by) teams.bonus[by] = (teams.bonus[by] || 0) + 1;
  }
  if (u.kind === 'nexus') { battleOver(u.team, by); return; }
  if (u.kind === 'turret') {
    shake = Math.max(shake, 12);
    SFX.explode(true);
    computeTerritory();
    news('turret', u.team, by, null, 3);
  }
}

// who'd get the ground bonus right now (null if the top is shared)
function groundLeader() {
  if (!teams) return null;
  let best = null, bc = -1, tie = false;
  for (const t of TEAMS) { const c = teams[t].cells; if (c > bc) { best = t; bc = c; tie = false; } else if (c === bc) tie = true; }
  return tie ? null : best;
}
// how a team did: a win (the top score alone), a draw (sharing it), or a loss
function resultFor(team) {
  const top = Math.max(...TEAMS.map(t => teams[t].score)), mine = teams[team].score;
  if (mine < top) return 'lose';
  return TEAMS.filter(t => teams[t].score === top).length > 1 ? 'draw' : 'win';
}

// The match ends when the clock runs out or a base falls. Destroying a base
// scores 100; the 140 for the most ground is paid now; then most points wins.
function battleOver(baseFell, by) {
  if (state !== 'play' && state !== 'dead') return;
  if (baseFell && by) { teams[by].score += BASE_BONUS; bookScore(by, 'Base', BASE_BONUS); }
  computeTerritory();
  if (teams.stats) teams.stats.land.push([Math.round(MATCH_TIME - teams.time), ...TEAMS.map(t => teams[t].cells)]);
  const g = groundLeader();
  if (g) { teams[g].score += GROUND_BONUS; teams.groundTo = g; bookScore(g, 'Most ground', GROUND_BONUS); }
  teams.endedBy = baseFell ? 'base' : 'time';
  teams.baseFell = baseFell; teams.baseBy = by || null;
  teams.result = resultFor('blue');
  state = teams.result === 'win' ? 'won' : 'lost';
  overlayT = 0; endScroll = 0;
  flash = 1;
  teams.result === 'win' ? SFX.bossDown() : SFX.death();
  if (net.role === 'host') { net.send(makeSnapshot()); netEvents = []; }
}

// One frame for a battle unit of any team: its burns and poison, being
// frozen, scared or confused, then its own moves, any knockback, and staying
// on the field.
function stepUnit(f, dt) {
  f.flash = Math.max(0, f.flash - dt);
  f.hitCd -= dt; f.slow -= dt; f.txtCd -= dt;
  if (f.poison > 0) {
    f.poison -= dt;
    f.poisonTick -= dt;
    if (f.poisonTick <= 0) { f.poisonTick = 0.5; dotHit(f, f.poisonDps * 0.5, 'poison', f.poisonBy); }
    if (f.dead) return;
  }
  if (f.burn > 0) {
    f.burn -= dt;
    f.burnTick = (f.burnTick || 0) - dt;
    if (f.burnTick <= 0) { f.burnTick = 0.5; dotHit(f, (f.burnDps || DOT_DPS) * 0.5, 'fire', f.burnBy); }
    if (f.dead) return;
  }
  for (const k of ['hex', 'fear', 'confuse', 'root']) if (f[k] > 0) f[k] -= dt;
  // frozen, stunned or turned to stone: no moving or fighting
  if (f.freeze > 0 || f.stun > 0 || f.stone > 0) {
    f.freeze = (f.freeze || 0) - dt; f.stun = (f.stun || 0) - dt; f.stone = (f.stone || 0) - dt;
    return;
  }
  if (f.fear > 0) { const p = f.fearFrom || f; walkToward(f, f.x * 2 - p.x, f.y * 2 - p.y, f.spd, dt, 0); }
  else if (f.confuse > 0) {
    if (Math.random() < dt * 1.5) f.wander = rnd(0, TAU);
    f.x += Math.cos(f.wander) * f.spd * dt; f.y += Math.sin(f.wander) * f.spd * dt;
  } else updateUnit(f, dt);
  if (!f.structure) {
    f.x += f.kx * dt; f.y += f.ky * dt;
    const dmp = Math.max(0, 1 - 7 * dt);
    f.kx *= dmp; f.ky *= dmp;
    clampArena(f, f.r);
    if (!f.def.flying) pushOut(f, f.r);
  }
}
// a tick of a burn or poison, counted for whoever started it
function dotHit(f, dmg, type, by) {
  const pb = dmgBy, pp = potency;
  dmgBy = by || null; potency = 1;
  try { damageFoe(f, dmg, type, true); } finally { dmgBy = pb; potency = pp; }
}

function updateUnit(u, dt) {
  if (u.stagger > 0) u.stagger = Math.max(0, u.stagger - STAGGER_FADE * dt);
  u.cd -= dt * (1 - (u.stagger || 0)) * (mode === 'battle' ? resRate(u.team) : 1); // rattled: attacks come slower
  if (u.fireFlash > 0) u.fireFlash -= dt;
  u.flash = Math.max(0, u.flash - dt);
  u.txtCd -= dt;
  if (u.slamT > 0) {
    u.slamT -= dt;
    if (u.slamT <= 0.18 && u.slamAt) titanSlam(u);
    if (u.slamT > 0) return; // a titan mid-swing stays put
  }
  if (u.kind === 'sigil') { u.wall = Math.max(0, u.wall - dt); return; }
  if (u.castT > 0) return; // a wizard winding up a spell stands still
  if (u.structure) {
    const t = findTarget(u);
    if (t && Math.hypot(t.x - u.x, t.y - u.y) <= u.def.range + (t.r || PLAYER_R)) unitAttack(u, t);
    return;
  }
  // hurt wizards fall back to their base to heal
  if (u.kind === 'wizard' && u.hp < u.maxHp * 0.3) u.retreat = true;
  // Very Hard: worn-out minions go home to rest instead of fighting at half strength
  if (smartRed(u) && aiSkill() >= 0.5 && sharp(u) && isMinion(u) && u.tired > 0.7 && !u.retreat) { u.retreat = true; u.inPush = false; }
  const home = nexusOf(u.team);
  let tx = null, ty = null;
  if (u.buildAt) {
    // walking out to build a turret (firing at anything in reach on the way, and while it waits there)
    const t = findTarget(u);
    if (t && Math.hypot(t.x - u.x, t.y - u.y) - (t.r || PLAYER_R) <= u.def.range) unitAttack(u, t);
    tx = u.buildAt.x; ty = u.buildAt.y;
    if (Math.hypot(tx - u.x, ty - u.y) < 4) tx = null;
  } else if (u.retreat && home) {
    const hp = homePt(u.team, 130); tx = hp.x; ty = hp.y;

  if (m.tg) { hostTerr = unpackTerr(m.tg); computeTerritory(); }
  teams.plans = (m.bp || []).map(([ti, x, y]) => { const q = at(x, y); return { team: relabel(canon(ti)), x: q.x, y: q.y }; });
  // your team's orders (a teammate may have changed them; yours win for a moment)
  const oi = m.tm.indexOf(view.team);
  if (m.od && m.od[oi] && performance.now() - (net.ordT || 0) > 1500) {
    const [o, om, ot] = m.od[oi];
    teams.order = o === 'follow' ? 'follow' : 'spread'; teams.orders.minion = om; teams.orders.titan = ot;
  }
  // units: keep the same objects so they glide between pictures
  const seen = new Set(), lists = { blue: [], red: [], green: [] };
  for (const a of m.u) {
    const [id, ti, ki, x, y, hp, mhp, ei, wall, slam, face, ff, ret, cdf, st, tired] = a;
    const kind = UNIT_KINDS[ki], def = UNITS[kind], team = relabel(canon(ti)), q = at(x, y);
    if (!def || !lists[team]) continue;
    let u = guestUnits.get(id);
    if (!u) { u = { id, unit: true, kind, def, x: q.x, y: q.y, wob: rnd(0, TAU), slot: rnd(0, TAU), kx: 0, ky: 0, structure: !!def.structure, r: def.r }; guestUnits.set(id, u); }
    Object.assign(u, { team, tx: q.x, ty: q.y, hp, maxHp: mhp || def.hp, elem: ei >= 0 ? ELEM_CYCLE[ei] : null,
                       wall, slamT: slam, face: view.on ? -face : face, fireFlash: ff, retreat: !!ret, cd: cdf * def.cd, tired: tired || 0, dead: false });
    for (const k of STATUS_KEYS) u[k] = 0;
    if (st) for (let i = 0; i + 1 < st.length; i += 2) u[STATUS_KEYS[st[i]]] = st[i + 1];
    seen.add(id);
    lists[team].push(u);
  }
  for (const id of guestUnits.keys()) if (!seen.has(id)) guestUnits.delete(id);
  units = lists; unitsVer++;
  friends = lists.blue; foes = TEAMS.filter(t => t !== 'blue').flatMap(t => lists[t]);
  bshots = m.bs.map(([ti, x, y, vx, vy, r, el, ar]) => { const team = relabel(canon(ti)), q = at(x, y), v = at(vx, vy); return { team, x: q.x, y: q.y, vx: v.x, vy: v.y, r, elem: el || null, arrow: !!ar, spin: rnd(0, TAU), color: TYPE_COLOR[el] || TEAM_COLOR[team], life: 2 }; });
  shots = m.sh.map(([x, y, vx, vy, r, type]) => { const q = at(x, y), v = at(vx, vy); return { x: q.x, y: q.y, vx: v.x, vy: v.y, r, type, color: TYPE_COLOR[type] || '#fff', life: 2 }; });
  zones = m.zn.map(([type, x, y, r, life, max, el, poison, charged]) => { const q = at(x, y); return { type: type || undefined, x: q.x, y: q.y, r, life, max, charged, tick: 1,
    spec: el ? { elem: el, fx: new Set(poison ? ['poison'] : []) } : undefined }; });
  traps = m.tr.map(([x, y, arming, el]) => { const q = at(x, y); return { x: q.x, y: q.y, arm: arming ? 1 : 0, spec: el ? { elem: el } : undefined }; });
  tempSolids = m.ts.map(([x, y, r, life, el, solid]) => { const q = at(x, y); return { x: q.x, y: q.y, r, life, elem: el || undefined, solid: !!solid }; });
  allies = m.al.map(([kind, x, y, life, el, r, hp, mhp, ang]) => { const q = at(x, y); return { kind, x: q.x, y: q.y, life, max: life, elem: el || undefined, r, hp, maxHp: mhp, ang }; });
  waves = m.wv.map(([x, y, r, maxR, dx, dy, travel, maxT, w]) => { const q = at(x, y); return dx !== undefined ? { x: q.x, y: q.y, dir: at(dx, dy), travel, maxT, w, speed: 0, hit: new Set() } : { x: q.x, y: q.y, r, maxR, speed: 0, hit: new Set() }; });
  meteors = m.mt.map(([x, y, t, max, small]) => { const q = at(x, y); return { x: q.x, y: q.y, t, max, small: !!small }; });
  // effects and messages
  const say = e => {
    switch (e[0]) {
      case 'ft': { const q = at(e[1], e[2]); floatText(q.x, q.y, e[3], e[4], e[5]); break; }
      case 'ring': { const q = at(e[1], e[2]); ring(q.x, q.y, e[3], e[4], e[5]); break; }
      case 'eh': { const q = at(e[2], e[3]); elemHit(e[1], q.x, q.y, e[4]); break; }
      case 'msg': castMessage(e[1], e[2]); break;
      case 'banner': showBanner(e[1], e[2], e[3]); break;
      case 'you-fell': SFX.death(); break;
      case 'news': { const N = newsText(e[1], relabel(e[2]), e[3] ? relabel(e[3]) : null, e[4] || null); if (N) showBanner(N[0], N[1], e[5]); break; }
    }
  };
  for (const e of m.ev) {
    if (e[0] === 'to') { if (e[1] === net.myId) say(e.slice(2)); }
    else say(e);
  }
  // the end (from your side)
  if (m.over && m.end) {
    const E = m.end, rel = o => { const r = {}; for (const k in o || {}) r[TEAM_CODE[k] ? relabel(k) : k] = o[k]; return r; };
    teams.breakdown = rel(E.bd);
    if (E.ss) {
      const S = rel(E.ss);
      S.land = (E.ss.land || []).map(([t, ...c]) => [t, ...TEAMS.map(gt => c[m.tm.indexOf(relabel(gt))] || 0)]);
      teams.stats = S;
    }
    if (state !== 'won' && state !== 'lost') {
      teams.result = (E.res && E.res[view.team]) || 'lose';
      teams.endedBy = E.eb; teams.baseFell = E.bf ? relabel(E.bf) : null; teams.baseBy = E.bb ? relabel(E.bb) : null; teams.groundTo = E.gt ? relabel(E.gt) : null;

}

// the friend's own loop: move yourself, let everything else glide to the latest picture
function guestUpdate(dt) {
  elapsed += dt;
  if (state === 'play' && !player.dead) heroMove(dt);
  player.arrowCd = Math.max(0, (player.arrowCd || 0) - dt);
  const k = Math.min(1, dt * 12);
  for (const u of allUnits()) {
    const ox = u.x, oy = u.y;
    u.x += (u.tx - u.x) * k; u.y += (u.ty - u.y) * k; u.flash = Math.max(0, (u.flash || 0) - dt);
    u.walk = (u.walk || 0) + Math.hypot(u.x - ox, u.y - oy);
  }
  for (const o of guestOthers) if (o.tx !== undefined) { const ox = o.x; o.x += (o.tx - o.x) * k; o.y += (o.ty - o.y) * k; o.moving = Math.abs(o.x - ox) + Math.abs(o.ty - o.y) > 0.3; }
  for (const s of bshots) { s.x += s.vx * dt; s.y += s.vy * dt; s.spin += dt * 9; if (s.elem && !s.arrow && Math.random() < 0.5) shotTrail(s); }
  for (const s of shots) { s.x += s.vx * dt; s.y += s.vy * dt; }
  if (teams.pending) teams.pending.t = Math.max(0, teams.pending.t - dt);
  if (teams.pendingO) teams.pendingO.t = Math.max(0, teams.pendingO.t - dt);
  teams.time = Math.max(0, teams.time - dt);
  teams.terrRecalc -= dt;
  if (teams.terrRecalc <= 0) { teams.terrRecalc = 0.5; computeTerritory(); }
  decayVisuals(dt);
  // tell the host where you are (in their coordinates)
  net.posT -= dt;
  if (net.posT <= 0 && state === 'play') {
    net.posT = lobby.guestPath && lobby.guestPath.relay ? 0.1 : 0.05; // (half as often on the slower backup route)
    const q = V(player.x, player.y), f = V(player.face.x, player.face.y);
    net.send({ t: 'pos', x: q.x, y: q.y, fx: f.x, fy: f.y, tp: player.tp });
  }
}

function netReceive(m, from) { if (net.role === 'host') hostReceive(m, from); else if (net.role === 'guest') guestReceive(m); }

// leave a game with friends (say goodbye first, unless they've gone already)
function leaveOnline(quiet) {
  if (!versus && !lobby.role) return;
  if (!quiet) try { net.send({ t: 'bye' }); } catch (_) {}
  if (net.role === 'guest') {
    if (lobby.role === 'guest') lobby.role = 'gone'; // (the paths close in a moment: nothing more from them)
    turnArena(null); Object.assign(view, { team: 'blue', on: false, ux: 0, uy: 1 }); hostTerr = null;
    // a friend's phone only shows the host's battle: leaving it means back to the menu
    if (state === 'play' || state === 'dead' || state === 'reveal') { state = 'title'; menuPage = 'main'; }
  }
  versus = false; net.role = null; net.myId = null;
  rivalP = null; guestOthers = [];
  const tryId = lobby.try;
  setTimeout(() => { if (lobby.try === tryId) hangUp(); }, quiet ? 0 : 300); // let the goodbye go out first
}

// ── lobby: host a game or join one with a code ──
// Three ways to find each other are tried side by side. PeerJS's free
// matchmaking server and Trystero (which meets through public Nostr relays)
// connect the two phones directly. Some networks never allow that, so there's
// a backup route too: public MQTT message servers pass the messages along,
// which is a little slower. A friend says hello on every path that opens; the
// host answers the first hello from each friend with a welcome (and their
// slot, Friend 1 or 2) on that path, and the friend plays on the path the
// welcome came on.
const PEER_PREFIX = 'pentagram-duel-';
const PEERJS_URL = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const TRYSTERO_URL = 'https://cdn.jsdelivr.net/npm/trystero@0.26.0/+esm';
const TRYSTERO_APP = 'pentagram-duel-v1';
// servers that pass the traffic on when two networks can't reach each other directly
const TURN = [
  { urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' },
  { urls: ['turn:openrelay.metered.ca:80', 'turn:openrelay.metered.ca:443', 'turns:openrelay.metered.ca:443?transport=tcp'], username: 'openrelayproject', credential: 'openrelayproject' },
];
const ICE_SERVERS = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun1.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }, ...TURN];
// the backup route's message servers (any one that both phones reach will do)
const RELAYS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081/mqtt', 'wss://mqtt.eclipseprojects.io/mqtt'];
const RELAY_TOPIC = 'space-wizard-duel/';
const RELAY_AFTER = 8;  // seconds a friend waits for a direct connection before trying the backup route as well
const RELAY_SNAP = 0.2; // seconds between battle pictures on the backup route
const MAX_FRIENDS = 2;
const NET_V = 2; // the lobby and pictures changed with three-player battles
const OLD_COPY = 'You and the host have different versions of Space Wizard. Both of you reload the page, then try again.';
const OLD_FRIEND = 'A friend tried to join with an older copy of Space Wizard. Ask them to reload the game page (or close it and open the link again), then join again.';
const NO_DIRECT = 'Found the game, but these networks won’t let the two phones connect directly. Trying the backup route…';
const NO_DIRECT_HOST = 'A friend found your game, but your networks won’t let the phones connect directly. They’ll come in by the backup route…';
const GAME_URL = 'https://flinnymusic-alt.github.io/Yo/pentagram.html';
// inside another page (like the Claude artifact viewer) the connection services may be blocked
const embedded = (() => { try { return window.top !== window.self; } catch (_) { return true; } })();
// role/code: this phone's part; paths: the ways being tried; links (host): the
// friends who joined; guestPath (friend): the path to the host; room (friend):
// the host's latest setup; three/diff (host): the setup being chosen; note:
// something to tell the players (soft: news, which a warning isn't covered by);
// found (friend): the host's phone answered; relayOn: the backup route is open
const lobby = { role: null, code: null, paths: [], links: [], guestPath: null, state: {}, try: null, started: false,
                three: false, diff: 'medium', tok: null, myId: null, room: null, note: null, soft: false, lastCode: null,
                found: false, relayOn: false };

function loadPeer() {
  if (window.Peer) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = PEERJS_URL;
    s.onload = () => res(); s.onerror = () => rej(new Error('Could not load PeerJS'));
    document.head.appendChild(s);
  });
}
function hangUp() {
  for (const p of lobby.paths) try { p.close(); } catch (_) {}
  Object.assign(lobby, { paths: [], links: [], guestPath: null, role: null, state: {}, try: null, started: false, myId: null, room: null, note: null,
                         soft: false, found: false, relayOn: false });
  keepAwake(false);
}

// While hosting, joining or playing with friends the screen stays on: a phone
// that locks (or leaves the game in the background) drops off the connection.
let wakeLock = null;
async function keepAwake(on) {
  try {
    if (!on) { const w = wakeLock; wakeLock = null; if (w) await w.release(); return; }
    if (wakeLock || !navigator.wakeLock || document.visibilityState !== 'visible') return;
    const w = await navigator.wakeLock.request('screen');
    wakeLock = w;
    w.addEventListener('release', () => { if (wakeLock === w) wakeLock = null; });
  } catch (_) {}
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && (lobby.role || versus)) keepAwake(true); });

// Phones keep old tabs for days without reloading them, and everyone in a game
// needs the same version: the lobby checks this page against the newest copy.
let updateChecked = false;
async function checkForUpdate() {
  if (updateChecked || !/^https?:$/.test(location.protocol)) return;
  updateChecked = true;
  try {
    const res = await fetch(location.href.split('#')[0], { cache: 'no-store' });
    if (!res.ok) return;
    const tidy = t => t.replace(/\r\n/g, '\n');
    const html = tidy(await res.text());
    const theirs = (html.match(/<script>([\s\S]*?)<\/script>/g) || []).find(t => t.includes('const NET_V'));
    const mine = [...document.scripts].find(t => !t.src && t.textContent.includes('const NET_V'));
    if (!theirs || !mine) return;
    if (theirs.slice(8, -9) !== tidy(mine.textContent)) {
      const u = document.getElementById('lb-update');
      if (u) u.style.display = '';
    }
  } catch (_) {}
}
// load the newest copy (a fresh address, so no old copy is served from the cache)
function reloadFresh() {
  const rejoin = (lobby.role === 'guest' || lobby.role === 'gone') && lobby.code ? '#join=' + lobby.code : ''; // (a friend joins the same game again)
  location.href = location.pathname + '?v=' + Date.now() + rejoin;
}

// the host: a message arrived from `key` (a connection or a peer id) on some path
function hostData(m, key, send, close) {
  if (!m || typeof m !== 'object' || lobby.role !== 'host') return;
  const known = lobby.links.find(l => l.key === key);
  if (known) {
    if (m.t === 'bye') friendLeft(known.id);
    // (the welcome went missing: the backup route says hello again until one arrives)
    else if (m.t === 'hello') { if (!lobby.started) { known.send({ t: 'welcome', id: known.id }); known.send(roomInfo()); } }
    else if (lobby.started) hostReceive(m, known.id);
    else if (m.t === 'skin') known.skin = m.v === 'space' ? 'space' : 'wizard';
    return;
  }
  if (m.t !== 'hello') return;
  if (m.v !== NET_V || typeof m.tok !== 'string') { send({ t: 'version', v: NET_V }); send({ t: 'bye' }); lobbyNote(OLD_FRIEND); return; }
  if (lobby.links.some(l => l.tok === m.tok)) return; // already in (the hello came on the other path too)
  if (lobby.started) { send({ t: 'started' }); return; }
  const id = ['g1', 'g2'].find(g => !lobby.links.some(l => l.id === g));
  if (!id) { send({ t: 'full' }); return; }
  const link = { id, tok: m.tok, key, send, close, skin: m.sk === 'space' ? 'space' : 'wizard', team: id === 'g1' ? 'red' : lobby.three ? 'green' : 'blue' };
  lobby.links.push(link);
  send({ t: 'welcome', id });
  if (lobby.soft) { lobby.note = null; lobby.soft = false; } // (news of a friend connecting: here they are)
  SFX.discover();
  renderRoom(); sendRoom(); pathState();
}
// the host: a friend's connection closed
function hostLost(key) { const l = lobby.links.find(x => x.key === key); if (l) friendLeft(l.id); }
// the setup, for the friends' screens
function roomInfo() { return { t: 'room', three: lobby.three, diff: lobby.diff, players: [{ id: 'host', team: 'blue' }, ...lobby.links.map(l => ({ id: l.id, team: l.team }))] }; }
function sendRoom() { if (lobby.role === 'host' && !lobby.started) for (const l of lobby.links) l.send(roomInfo()); }

// a friend: a message from the host
function guestData(m, path) {
  if (!m || typeof m !== 'object' || lobby.role !== 'guest') return;
  if (!lobby.guestPath) {
    if (m.t === 'welcome') {
      lobby.guestPath = path;
      for (const p of lobby.paths) if (p !== path) try { p.close(); } catch (_) {}
      lobby.paths = [path];
      lobby.myId = m.id;
      net.send = x => path.send(x);
      lobbyStatus('');
      renderRoom();
    } else if (m.t === 'full' || m.t === 'started' || m.t === 'version' || m.t === 'start') {
      // ('start' before a welcome: a host with an old copy, which starts a duel at once)
      if (m.t === 'start') try { path.send({ t: 'bye' }); } catch (_) {}
      const tryId = lobby.try;
      setTimeout(() => { if (lobby.try === tryId) hangUp(); }, m.t === 'start' ? 300 : 0); // (let the goodbye go out)
      lobby.note = null;
      lobbyStatus(m.t === 'full' ? 'That game is full: three players already.' : m.t === 'started' ? 'That game has already started.' : OLD_COPY);
      lobby.state = {}; lobby.role = 'gone'; // (no more status lines over this message)
    }
    return;
  }
  if (path !== lobby.guestPath) return;
  if (m.t === 'room') { lobby.room = m; renderRoom(); }
  else if (m.t === 'start') { if (!versus) startGuestBattle(m); }
  else if (versus) netReceive(m);
  else if (m.t === 'bye') friendLeft();
}
function guestPathClosed(path) { if (lobby.role === 'guest' && path === lobby.guestPath) friendLeft(); }
const hello = () => ({ t: 'hello', v: NET_V, tok: lobby.tok, sk: mySkin });

// how each path is doing, shown under the code
function pathState(name, st) {
  if (name) lobby.state[name] = st;
  if ((lobby.role !== 'host' && lobby.role !== 'guest') || lobby.guestPath || lobby.started) return;
  const S = lobby.state, mark = v => v === 'ok' ? '✓' : v === 'down' ? '✗' : v === 'off' ? '–' : '…';
  const mq = Object.keys(S).filter(k => k.startsWith('mq')).map(k => S[k]);
  const backup = !mq.length ? 'off' : mq.includes('ok') ? 'ok' : mq.every(v => v === 'down') ? 'down' : 'wait';
  const line = `<small style="color:#888">server ${mark(S.peerjs)} · relays ${mark(S.nostr)} · backup ${mark(backup)}</small>`;
  const note = lobby.note ? `<span style="color:#ffb3b3">${lobby.note}</span><br>` : '';
  const direct = S.peerjs === 'down' && S.nostr === 'down';
  // (a friend who can't reach either direct way tries the backup route straight away)
  if (direct && backup === 'off' && lobby.role === 'guest') { const t = lobby.try; setTimeout(() => startRelay(t), 0); }
  if (direct && backup === 'down') {
    lobbyStatus(note + 'Couldn’t reach any of the connection services. Check your internet, or try another network (mobile data or Wi-Fi).<br>' + line);
    return;
  }
  if (lobby.role === 'host') lobbyStatus(note + line);
  else lobbyStatus(note + `Looking for game ${lobby.code}…<br>` + line);
}
// something the players should know (stays above the connection line); soft
// news (how it's going) never covers a warning
function lobbyNote(text, soft) {
  if (soft && lobby.note && !lobby.soft) return;
  lobby.note = text; lobby.soft = !!soft; pathState();
}

async function viaPeerJS(code, role, tryId) {
  try { await loadPeer(); } catch (_) { pathState('peerjs', 'down'); return; }
  if (lobby.try !== tryId || lobby.guestPath) return; // gave up, started over or got in meanwhile
  const peer = role === 'host' ? new Peer(PEER_PREFIX + code, Object.assign({ config: { iceServers: ICE_SERVERS } }, window.PEER_OPTS))
                               : new Peer(Object.assign({ config: { iceServers: ICE_SERVERS } }, window.PEER_OPTS));
  const path = { name: 'peerjs', conn: null,
    send: m => { const c = path.conn; try { if (c && c.open) c.send(m); } catch (_) {} },
    close: () => { try { peer.destroy(); } catch (_) {} } };
  lobby.paths.push(path);
  const live = () => lobby.try === tryId && !peer.destroyed;
  // a friend: call the host (and call again while the host isn't on the server)
  const call = () => {
    if (!live() || lobby.guestPath || peer.disconnected) return;
    const conn = peer.connect(PEER_PREFIX + code, { reliable: true, serialization: 'json', metadata: { tok: lobby.tok } });
    path.conn = conn;
    conn.on('open', () => { if (!lobby.guestPath && path.conn === conn) path.send(hello()); });
    conn.on('data', m => {
      // (if there were several calls, the one the host answered is the one to use)
      if (!lobby.guestPath && m && m.t === 'welcome') path.conn = conn;
      if (path.conn === conn) guestData(m, path);
    });
    conn.on('close', () => { if (path.conn === conn) guestPathClosed(path); });
    // the host's phone answered (the phones start trying to reach each other) …
    conn.on('iceStateChanged', st => {
      if (st === 'checking' && live() && !lobby.guestPath && !lobby.found) { lobby.found = true; lobbyNote('Found the game. Connecting…', true); }
      if (st === 'failed') failed();
    });
    // … or they can't (PeerJS closes the connection first, so this comes as an error): try the backup route now
    const failed = () => { if (live() && !lobby.guestPath) { lobbyNote(NO_DIRECT, true); startRelay(tryId); } };
    conn.on('error', e => { if (e && e.type === 'negotiation-failed') failed(); });
  };
  peer.on('open', () => {
    pathState('peerjs', 'ok');
    if (role === 'guest' && !lobby.guestPath && !(path.conn && path.conn.open)) call();
  });
  // the host: each friend has their own connection
  if (role === 'host') peer.on('connection', conn => {
    const send = m => { try { if (conn.open) conn.send(m); } catch (_) {} };
    const tok = conn.metadata && conn.metadata.tok, inAlready = () => lobby.links.some(l => l.key === conn || (tok && l.tok === tok));
    if (live() && !lobby.started && !inAlready()) lobbyNote('A friend is connecting…', true);
    conn.on('data', m => hostData(m, conn, send, () => { try { conn.close(); } catch (_) {} }));

    const x = R() * S, y = R() * S, l = 3 + R() * 7, a = -Math.PI / 2 + (R() - 0.5) * 1;
    g.strokeStyle = R() < 0.5 ? 'rgba(38,78,36,0.32)' : 'rgba(160,200,95,0.32)';
    g.lineWidth = 1 + R() * 1.3;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }

  for (let i = 0; i < 80; i++) {
