function drawPlayer(p = player) {
  const { x, y } = p;
  if (p.onBoat) drawBoatAt(x, y + 6, Math.atan2(p.face.y, p.face.x));
  if (p.dead) return;
  if (p.invuln > 0 && Math.floor(p.invuln * 20) % 2) return;
  if (p.empower > 0) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, 40);
    g.addColorStop(0, 'rgba(255,90,42,0.45)'); g.addColorStop(1, 'rgba(255,90,42,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 40, 0, TAU); ctx.fill();
  }
  if (!p.onBoat) circle(x + 3, y + 12, 13, 'rgba(0,0,0,0.3)');
  const orb = p === player && seq.length ? ELEMENTS[seq[seq.length - 1]].color : '#c77dff';
  // squash and stretch: a springy step while walking, a slow breath when still
  const step = p.moving ? Math.sin(elapsed * 11) : 0, hop = Math.abs(step) * 3;
  const sq = p.moving ? Math.cos(elapsed * 22) * 0.06 : Math.sin(elapsed * 2.2) * 0.025;
  ctx.save();
  ctx.translate(x, y + 14); ctx.scale(1 - sq * 0.8, 1 + sq); ctx.translate(-x, -(y + 14) - hop);
  if (heroSkin(p) === 'space') {
    const accent = mode === 'battle' ? TEAM_COLOR[p.isRival || p === otherHero ? 'red' : 'blue'] : '#c77dff';
    drawAstronaut(x, y, 1, accent, accent, p.face, orb);
  } else drawWizardFigure(x, y, p.face.x, p.robe, p.hat, orb);
  ctx.restore();

  if (p.skin > 0) {
    // Stoneskin: six stone plates turning slowly around you
    for (let i = 0; i < 6; i++) {
      const a = elapsed * 0.8 + i * TAU / 6;
      ctx.save(); ctx.translate(x + Math.cos(a) * 24, y + Math.sin(a) * 20); ctx.rotate(a);
      ctx.fillStyle = '#a8845a'; ctx.fillRect(-4, -7, 8, 14); ctx.fillStyle = '#c9a77a'; ctx.fillRect(-4, -7, 3, 14);
      ctx.restore();
    }
  }
  if (p.omni > 0) {
    // a ring of every element's colour, spinning, plus a gold crown
    for (let i = 0; i < OMNI_TYPES.length; i++) {
      const a = elapsed * 3 + i * TAU / OMNI_TYPES.length;
      circle(x + Math.cos(a) * 36, y + Math.sin(a) * 36, 5, TYPE_COLOR[OMNI_TYPES[i]]);
    }
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath();
    ctx.moveTo(x - 11, y - 34); ctx.lineTo(x - 11, y - 44); ctx.lineTo(x - 5, y - 38); ctx.lineTo(x, y - 47);
    ctx.lineTo(x + 5, y - 38); ctx.lineTo(x + 11, y - 44); ctx.lineTo(x + 11, y - 34); ctx.closePath(); ctx.fill();
  }
  if (p.mirror > 0) {
    // Mirror Shield: a turning bubble of glassy facets that catch the light
    ctx.save(); ctx.translate(x, y); ctx.rotate(elapsed * 0.6);
    for (let i = 0; i < 6; i++) {
      const a = i * TAU / 6, sh = 0.35 + 0.45 * Math.max(0, Math.sin(elapsed * 4 + i * 1.3));
      ctx.fillStyle = `rgba(230,220,255,${sh * 0.35})`; ctx.strokeStyle = `rgba(255,255,255,${sh})`; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * 32, Math.sin(a) * 32); ctx.lineTo(Math.cos(a + TAU / 6) * 32, Math.sin(a + TAU / 6) * 32); ctx.closePath();
      ctx.fill(); ctx.beginPath(); ctx.moveTo(Math.cos(a) * 32, Math.sin(a) * 32); ctx.lineTo(Math.cos(a + TAU / 6) * 32, Math.sin(a + TAU / 6) * 32); ctx.stroke();
    }
    ctx.restore();
  }
  if (p.sanct > 0) {
    // Sanctuary: a golden dome with light rising through it
    const g = ctx.createRadialGradient(x, y, 10, x, y, 40);
    g.addColorStop(0, 'rgba(255,246,176,0.05)'); g.addColorStop(1, 'rgba(255,246,176,0.35)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 40, 0, TAU); ctx.fill();
    circle(x, y, 40, null, 'rgba(255,246,176,0.9)', 2);
    if (Math.random() < 0.4) particles.push({ shape: 'plus', x: x + rnd(-30, 30), y: y + rnd(-10, 20), vx: 0, vy: -50, r: 3, life: 0.8, decay: 1.4, color: '#fff6b0', rot: 0, spin: 0 });
  }
  if (p.regen > 0 && Math.random() < 0.25) {
    // Rejuvenate: leaves spiral up around you
    const a = rnd(0, TAU);
    particles.push({ leaf: true, x: x + Math.cos(a) * 18, y: y + 12, vx: -Math.sin(a) * 40, vy: -50, r: 3.5, life: 1, decay: 1.2, color: Math.random() < 0.7 ? '#8fdf6a' : '#d6f2a0', rot: a, spin: 6 });
  }
  if (p.empower > 0 && Math.random() < 0.35) particles.push({ x: x + rnd(-12, 12), y: y + rnd(-6, 12), vx: rnd(-10, 10), vy: -90, r: 2.5, life: 0.8, decay: 1.6, color: Math.random() < 0.5 ? '#ffb04a' : '#ff5a2a' });
  if (p.phoenix > 0) {
    // Phoenix: little wings of flame waiting to carry you back
    const f = Math.sin(elapsed * 6) * 0.25;
    for (const sd of [-1, 1]) {
      ctx.fillStyle = 'rgba(255,138,58,0.55)';
      ctx.beginPath(); ctx.moveTo(x + sd * 6, y);
      ctx.quadraticCurveTo(x + sd * 30, y - 26 - f * 20, x + sd * 34, y - 4); ctx.quadraticCurveTo(x + sd * 22, y + 2, x + sd * 6, y + 6); ctx.fill();
    }
  }
  if (p.haste > 0 && p.moving && p.face) {
    // Haste: speed lines streaming behind you
    ctx.strokeStyle = 'rgba(255,246,160,0.6)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
    for (let i = 0; i < 3; i++) {
      const o = (i - 1) * 9, px = -p.face.y, py = p.face.x;
      ctx.beginPath(); ctx.moveTo(x - p.face.x * 18 + px * o, y - p.face.y * 18 + py * o); ctx.lineTo(x - p.face.x * (34 + i * 6) + px * o, y - p.face.y * (34 + i * 6) + py * o); ctx.stroke();
    }
  }
  if (p.ward > 0) {
    // Ward: spirit runes circling you, one per blow it can stop
    circle(x, y, 30, 'rgba(199,125,255,0.10)', 'rgba(199,125,255,0.6)', 1.5);
    for (let i = 0; i < p.ward; i++) {
      const a = elapsed * 2 + i * TAU / p.ward;
      drawGlyph('S', x + Math.cos(a) * 30, y + Math.sin(a) * 30, 10, '#e6ccff');
    }
  }
}

function drawShot(s) {
  if (s.type === 'arrow') {
    const sp = Math.hypot(s.vx, s.vy) || 1, ux = s.vx / sp, uy = s.vy / sp;
    ctx.strokeStyle = '#d8c8a0'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.x - ux * 22, s.y - uy * 22); ctx.lineTo(s.x, s.y); ctx.stroke();
    ctx.fillStyle = '#ddd';
    ctx.beginPath(); ctx.moveTo(s.x + ux * 7, s.y + uy * 7);
    ctx.lineTo(s.x - uy * 4, s.y + ux * 4); ctx.lineTo(s.x + uy * 4, s.y - ux * 4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#c33'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(s.x - ux * 22 - uy * 4, s.y - uy * 22 + ux * 4); ctx.lineTo(s.x - ux * 18, s.y - uy * 18);
    ctx.moveTo(s.x - ux * 22 + uy * 4, s.y - uy * 22 - ux * 4); ctx.lineTo(s.x - ux * 18, s.y - uy * 18); ctx.stroke();
    return;
  }
  const sp = Math.hypot(s.vx, s.vy) || 1, ux = s.vx / sp, uy = s.vy / sp, r = s.r, t = elapsed;
  const glow = (rad, col) => { const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, rad); g.addColorStop(0, col); g.addColorStop(1, clear(col)); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(s.x, s.y, rad, 0, TAU); ctx.fill(); };
  const along = () => ctx.rotate(Math.atan2(uy, ux));
  const look = s.look === 'woven' ? 'w-' + ((s.spec && s.spec.elem) || ELEM_OF[s.type] || s.type) : s.look;
  switch (look) {
    case 'firebolt': case 'w-fire': {
      glow(r * 2.6, '#ff8a3a55');
      ctx.save(); ctx.translate(s.x, s.y); along();
      const fl = 1 + Math.sin(t * 30 + s.spin) * 0.15;
      ctx.fillStyle = '#ff5a2a';
      ctx.beginPath(); ctx.moveTo(-r * 3 * fl, 0); ctx.quadraticCurveTo(-r, -r * 1.2, r, 0); ctx.quadraticCurveTo(-r, r * 1.2, -r * 3 * fl, 0); ctx.fill();
      ctx.fillStyle = '#ffd24a';
      ctx.beginPath(); ctx.moveTo(-r * 1.8 * fl, 0); ctx.quadraticCurveTo(-r * 0.4, -r * 0.6, r * 0.7, 0); ctx.quadraticCurveTo(-r * 0.4, r * 0.6, -r * 1.8 * fl, 0); ctx.fill();
      circle(r * 0.2, 0, r * 0.35, '#fff6d0');
      ctx.restore(); break;
    }
    case 'frost': {
      glow(r * 2.4, '#bfe6ff66');
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.spin);
      ctx.strokeStyle = '#e8f8ff'; ctx.lineWidth = 2; ctx.lineCap = 'round';
      for (let i = 0; i < 6; i++) { const an = i * TAU / 6; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(Math.cos(an) * r * 1.4, Math.sin(an) * r * 1.4);
        ctx.moveTo(Math.cos(an) * r * 0.8, Math.sin(an) * r * 0.8); ctx.lineTo(Math.cos(an + 0.5) * r, Math.sin(an + 0.5) * r); ctx.stroke(); }
      circle(0, 0, r * 0.4, '#ffffff');
      ctx.restore(); break;
    }
    case 'spike': case 'w-earth': {
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.spin * 0.8);
      ctx.fillStyle = '#8a6a44'; ctx.beginPath();
      for (let i = 0; i < 6; i++) { const an = i * TAU / 6, rr = r * (i % 2 ? 0.9 : 1.3); ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#b5946a'; ctx.beginPath(); ctx.arc(-r * 0.3, -r * 0.3, r * 0.45, 0, TAU); ctx.fill();
      ctx.restore(); break;
    }
    case 'venom': {
      glow(r * 2, '#7dff4a44');
      ctx.save(); ctx.translate(s.x, s.y); along();
      ctx.fillStyle = '#4caf50'; ctx.beginPath(); ctx.moveTo(r * 1.8, 0); ctx.lineTo(-r * 0.4, -r * 0.55); ctx.lineTo(-r * 2.2, 0); ctx.lineTo(-r * 0.4, r * 0.55); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#c8ff8a'; ctx.beginPath(); ctx.moveTo(r * 1.8, 0); ctx.lineTo(r * 0.6, -r * 0.25); ctx.lineTo(r * 0.6, r * 0.25); ctx.fill();
      ctx.restore(); break;
    }
    case 'siphon': {
      // a little ghost with a wavy tail
      ctx.save(); ctx.translate(s.x, s.y); along();
      ctx.strokeStyle = 'rgba(230,204,255,0.7)'; ctx.lineWidth = r * 0.9; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(0, 0);
      for (let k = 1; k <= 8; k++) ctx.lineTo(-k * r * 0.6, Math.sin(t * 18 - k * 0.9) * r * 0.5 * (k / 8));
      ctx.stroke(); ctx.restore();
      glow(r * 2.2, '#c77dff77'); circle(s.x, s.y, r * 0.8, '#f3e6ff');
      circle(s.x - 1.5, s.y - 1, 1.1, '#5a2a8a'); circle(s.x + 1.5, s.y - 1, 1.1, '#5a2a8a');
      break;
    }
    case 'fireball': {
      glow(r * 3, '#ff8a3a66');
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.spin);
      for (let i = 0; i < 3; i++) { ctx.rotate(TAU / 3); ctx.fillStyle = i % 2 ? '#ff5a2a' : '#ff8a3a'; ctx.beginPath(); ctx.ellipse(r * 0.4, 0, r * 1.1, r * 0.6, 0.6, 0, TAU); ctx.fill(); }
      ctx.restore();
      circle(s.x, s.y, r * 0.75, '#ffd24a'); circle(s.x, s.y, r * 0.4, '#fffbe6');
      break;
    }
    case 'lance': {
      // a spear of light with afterimages
      for (let k = 3; k >= 0; k--) {
        ctx.globalAlpha = k ? 0.18 * (4 - k) : 1;
        ctx.save(); ctx.translate(s.x - ux * k * 14, s.y - uy * k * 14); along();
        const g = ctx.createLinearGradient(-r * 4, 0, r * 1.5, 0); g.addColorStop(0, 'rgba(230,204,255,0)'); g.addColorStop(1, '#ffffff');
        ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(r * 1.8, 0); ctx.lineTo(-r * 4, -r * 0.4); ctx.lineTo(-r * 4, r * 0.4); ctx.closePath(); ctx.fill();
        ctx.restore();
      }
      ctx.globalAlpha = 1; glow(r * 1.8, '#e6ccff88');
      break;
    }
    case 'icelance': {
      glow(r * 2.4, '#cfefff55');
      ctx.save(); ctx.translate(s.x, s.y); along();
      ctx.fillStyle = '#cfefff'; ctx.beginPath(); ctx.moveTo(r * 2.2, 0); ctx.lineTo(-r * 2.6, -r * 0.7); ctx.lineTo(-r * 2, 0); ctx.lineTo(-r * 2.6, r * 0.7); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(r * 2, 0); ctx.lineTo(-r * 1.8, -r * 0.2); ctx.stroke();
      ctx.restore(); break;
    }
    case 'hex': {
      glow(r * 2.4, '#b070ff55');
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.spin * 0.7);
      ctx.strokeStyle = '#d6b0ff'; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.arc(0, 0, r * 1.1, 0, TAU); ctx.stroke();
      ctx.beginPath();
      for (let i = 0; i <= 5; i++) { const an = -Math.PI / 2 + ((i * 2) % 5) * TAU / 5; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); }
      ctx.stroke(); ctx.restore(); break;
    }
    case 'prism': case 'mirror': {
      ctx.save(); ctx.translate(s.x, s.y); along();
      const g = ctx.createLinearGradient(-r * 2, 0, r * 2, 0);
      ['#ff5a2a', '#ffd24a', '#7dff4a', '#3ab0ff', '#c77dff'].forEach((c, i) => g.addColorStop(i / 4, c));
      ctx.fillStyle = s.look === 'mirror' ? '#e6ccff' : g;
      ctx.beginPath(); ctx.moveTo(r * 2, 0); ctx.lineTo(0, -r * 0.7); ctx.lineTo(-r * 2, 0); ctx.lineTo(0, r * 0.7); ctx.closePath(); ctx.fill();
      ctx.restore(); glow(r * 2, '#ffffff55'); break;
    }
    case 'w-water': {
      glow(r * 2.2, '#3ab0ff55');
      ctx.save(); ctx.translate(s.x, s.y); along();
      ctx.fillStyle = '#3ab0ff'; ctx.beginPath(); ctx.moveTo(-r * 2, 0); ctx.quadraticCurveTo(-r * 0.2, -r * 1.1, r, 0); ctx.quadraticCurveTo(-r * 0.2, r * 1.1, -r * 2, 0); ctx.fill();
      ctx.restore(); circle(s.x - r * 0.2, s.y - r * 0.3, r * 0.3, '#e8f8ff'); break;
    }
    case 'w-air': {
      glow(r * 2.6, '#fff6a066'); circle(s.x, s.y, r * 0.7, '#fffbe0');
      ctx.strokeStyle = '#fff6a0'; ctx.lineWidth = 1.5;
      for (let i = 0; i < 3; i++) { const an = s.spin * 2 + i * TAU / 3; ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x + Math.cos(an) * r * 1.2, s.y + Math.sin(an) * r * 1.2); ctx.lineTo(s.x + Math.cos(an + 0.5) * r * 1.9, s.y + Math.sin(an + 0.5) * r * 1.9); ctx.stroke(); }
      break;
    }
    case 'w-spirit': {
      glow(r * 2.4, '#c77dff66');
      ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.spin); ctx.fillStyle = '#f3e6ff'; ctx.beginPath();
      for (let i = 0; i < 10; i++) { const rr = i % 2 ? r * 0.45 : r * 1.3, an = i * Math.PI / 5; ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
      ctx.closePath(); ctx.fill(); ctx.restore(); break;
    }
    default: {
      const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, r * 2.2);
      g.addColorStop(0, '#fff'); g.addColorStop(0.35, s.color); g.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(s.x, s.y, r * 2.2, 0, TAU); ctx.fill();
    }
  }
  // a woven bolt shows its finish
  if (s.look === 'woven' && s.spec && s.spec.finish && !s.shard && !s.ally) {
    const f = s.spec.finish, col = TYPE_COLOR[s.spec.elem];
    if (f === 'S') { ctx.strokeStyle = '#ffffffaa'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(s.x, s.y, r * 2, s.spin, s.spin + 4); ctx.stroke(); }
    else if (f === 'F') { ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 20); circle(s.x, s.y, r * 1.6, null, '#ffb04a', 2); ctx.globalAlpha = 1; }
    else if (f === 'A') { ctx.strokeStyle = '#fff6a0'; ctx.lineWidth = 1; for (let i = 0; i < 2; i++) { const an = rnd(0, TAU); ctx.beginPath(); ctx.moveTo(s.x + Math.cos(an) * r, s.y + Math.sin(an) * r); ctx.lineTo(s.x + Math.cos(an) * r * 2.2 + rnd(-3, 3), s.y + Math.sin(an) * r * 2.2 + rnd(-3, 3)); ctx.stroke(); } }
    else if (f === 'W') circle(s.x, s.y, r * (1.5 + Math.sin(t * 12) * 0.25), null, '#bfe6ffaa', 1.5);
    else if (f === 'E') { ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(-s.spin); ctx.strokeStyle = col; ctx.lineWidth = 1.5; ctx.strokeRect(-r * 1.3, -r * 1.3, r * 2.6, r * 2.6); ctx.restore(); }
  }
}

function drawZone(z) {
  const a = Math.min(1, z.life);
  if (z.type === 'woven') { drawWovenPool(z, a); return; }
  if (z.type === 'mud') {
    circle(z.x, z.y, z.r, `rgba(90,60,30,${0.55 * a})`, `rgba(60,40,20,${0.8 * a})`, 3);
    for (let i = 0; i < 6; i++) circle(z.x + Math.cos(i * 1.7) * z.r * 0.55, z.y + Math.sin(i * 2.3) * z.r * 0.5, 5 + Math.sin(elapsed * 3 + i) * 2, `rgba(120,85,45,${a})`);
  } else if (z.type === 'vortex') {
    ctx.strokeStyle = `rgba(220,240,255,${0.5 * a})`; ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      for (let k = 0; k < 30; k++) {
        const rr = z.r * (1 - k / 30), ang = elapsed * 4 + i * TAU / 4 + k * 0.25;
        const x = z.x + Math.cos(ang) * rr, y = z.y + Math.sin(ang) * rr;
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    circle(z.x, z.y, 14, '#0a0a14', '#cfe8ff', 2);
    // debris whirling in toward the eye
    for (let i = 0; i < 14; i++) {
      const rr = z.r * (1 - ((elapsed * 0.35 + i / 14) % 1)), an = elapsed * 3.5 + i * 2.4 + (1 - rr / z.r) * 6;
      ctx.save(); ctx.translate(z.x + Math.cos(an) * rr, z.y + Math.sin(an) * rr); ctx.rotate(an * 2);
      ctx.fillStyle = i % 3 ? '#8fbf4a' : '#8a6a44'; ctx.globalAlpha = a;
      ctx.beginPath(); ctx.ellipse(0, 0, i % 3 ? 4 : 3, i % 3 ? 2 : 3, 0, 0, TAU); ctx.fill();
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  } else if (z.type === 'spring') {
    const g = ctx.createRadialGradient(z.x, z.y, 0, z.x, z.y, z.r);
    g.addColorStop(0, `rgba(120,255,170,${0.4 * a})`); g.addColorStop(1, 'rgba(60,200,140,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.fill();
    circle(z.x, z.y, z.r, null, `rgba(140,255,190,${0.6 * a})`, 2);
    // a little fountain at the heart, arcs of water falling back
    for (let i = 0; i < 10; i++) {
      const k = (elapsed * 0.9 + i / 10) % 1, an = i * TAU / 10;
      const px = z.x + Math.cos(an) * z.r * 0.6 * k, py = z.y + Math.sin(an) * z.r * 0.35 * k - Math.sin(k * Math.PI) * 34;
      circle(px, py, 3, `rgba(220,255,235,${a * (1 - k * 0.5)})`);
    }
    circle(z.x, z.y - 6, 6, `rgba(230,255,240,${a})`);
  }
}

function drawWovenPool(z, a) {
  const el = z.spec.elem, c = TYPE_COLOR[el], t = elapsed;
  const g = ctx.createRadialGradient(z.x, z.y, 0, z.x, z.y, z.r);
  g.addColorStop(0, c + '66'); g.addColorStop(1, c + '10');
  ctx.globalAlpha = a;
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.fill();
  circle(z.x, z.y, z.r, null, c + 'aa', 2);
  if (el === 'fire') for (let i = 0; i < 7; i++) {
    const px = z.x + Math.cos(i * 2.4) * z.r * 0.6, py = z.y + Math.sin(i * 1.7) * z.r * 0.5, h = 6 + Math.sin(t * 9 + i) * 3;
    ctx.fillStyle = i % 2 ? '#ffb04a' : '#ff5a2a'; ctx.beginPath(); ctx.moveTo(px - 4, py); ctx.quadraticCurveTo(px, py - h * 2, px + 4, py); ctx.fill();
  } else if (el === 'water') {
    ctx.strokeStyle = 'rgba(220,240,255,0.6)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) { const rr = ((t * 25 + i * z.r / 3) % z.r); ctx.beginPath(); ctx.arc(z.x, z.y, rr, 0, TAU); ctx.stroke(); }
  } else if (el === 'earth') {
    for (let i = 0; i < 9; i++) circle(z.x + Math.cos(i * 2.1 + t * 0.5) * z.r * 0.55, z.y + Math.sin(i * 1.3 + t * 0.5) * z.r * 0.5, 3, z.spec.fx.has('poison') ? '#7dff4a' : '#6b4a22');
  } else if (el === 'air') {
    ctx.strokeStyle = 'rgba(255,250,200,0.6)'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(z.x, z.y, z.r * (0.3 + i * 0.25), t * 4 + i, t * 4 + i + 2.2); ctx.stroke(); }
  } else if (el === 'spirit') {
    ctx.save(); ctx.translate(z.x, z.y); ctx.rotate(t * 0.4);
    ctx.strokeStyle = '#e6ccff'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i <= 5; i++) { const an = -Math.PI / 2 + ((i * 2) % 5) * TAU / 5; const px = Math.cos(an) * z.r * 0.7, py = Math.sin(an) * z.r * 0.7; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.stroke(); ctx.restore();
  }
  const fin = z.spec.finish;
  if (fin && z.r0) {
    if (fin === 'W') { ctx.setLineDash([6, 6]); circle(z.x, z.y, z.r + 6, null, c + '88', 1.5); ctx.setLineDash([]); }             // Spreading
    else if (fin === 'A') { ctx.strokeStyle = 'rgba(255,250,200,0.6)'; ctx.lineWidth = 2; for (let i = 0; i < 3; i++) { const yy = z.y - z.r * 0.4 + i * z.r * 0.4, xx = z.x - z.r * 0.5 + ((t * 40 + i * 20) % (z.r)); ctx.beginPath(); ctx.moveTo(xx - 10, yy); ctx.lineTo(xx + 10, yy); ctx.stroke(); } } // Drifting
    else if (fin === 'S') { ctx.strokeStyle = c + 'aa'; ctx.lineWidth = 1.5; for (let i = 0; i < 4; i++) { ctx.beginPath(); for (let k = 0; k < 16; k++) { const rr = z.r * (1 - k / 16), an = -t * 2 + i * TAU / 4 + k * 0.3; k ? ctx.lineTo(z.x + Math.cos(an) * rr, z.y + Math.sin(an) * rr) : ctx.moveTo(z.x + Math.cos(an) * rr, z.y + Math.sin(an) * rr); } ctx.stroke(); } } // Pulling
    else if (fin === 'F') { const k = 1 - z.life / z.max; circle(z.x, z.y, 6 + k * 14 + Math.sin(t * (6 + k * 20)) * 3, `rgba(255,${200 - k * 120},80,${0.4 + k * 0.5})`); }             // Erupting
  }
  if (z.charged > 0) {
    // crackling lightning across the water
    ctx.strokeStyle = 'rgba(180,255,255,0.9)'; ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      let px = z.x + rnd(-z.r, z.r) * 0.7, py = z.y + rnd(-z.r, z.r) * 0.7; ctx.moveTo(px, py);
      for (let i = 0; i < 4; i++) { px += rnd(-18, 18); py += rnd(-18, 18); ctx.lineTo(px, py); }
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

function drawEffects() {
  drawSideFx();
  drawSharedFx();
}

// one side's lingering spells, its charging hero and its shots
function drawSideFx() {
  for (const z of zones) {
    if (z.type === 'mud' || z.type === 'vortex' || z.type === 'spring' || z.type === 'woven') { drawZone(z); continue; }
    const a = Math.min(1, z.life) * 0.35;
    const g = ctx.createRadialGradient(z.x, z.y, 0, z.x, z.y, z.r);
    if (z.type === 'fire') { g.addColorStop(0, `rgba(255,110,40,${a * 1.5})`); g.addColorStop(1, 'rgba(120,30,10,0)'); }
    else { g.addColorStop(0, `rgba(125,255,74,${a})`); g.addColorStop(1, 'rgba(60,140,30,0)'); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.fill();
    if (z.type === 'fire') {
      for (let i = 0; i < 9; i++) {
        const px = z.x + Math.cos(i * 2.3) * z.r * 0.6, py = z.y + Math.sin(i * 1.9) * z.r * 0.5, h = 8 + Math.sin(elapsed * 9 + i) * 4;
        ctx.fillStyle = `rgba(255,${150 + (i % 3) * 30},60,${a * 2})`; ctx.beginPath(); ctx.moveTo(px - 5, py); ctx.quadraticCurveTo(px, py - h * 2, px + 5, py); ctx.fill();
      }
    } else {
      // Plague Cloud: green billows rolling and drifting
      for (let i = 0; i < 7; i++) {
        const bx = z.x + Math.cos(i * 1.3 + elapsed * 0.6) * z.r * 0.55, by = z.y + Math.sin(i * 2.1 + elapsed * 0.8) * z.r * 0.45, rr = 22 + Math.sin(elapsed * 2 + i) * 5;
        const pg = ctx.createRadialGradient(bx, by, 0, bx, by, rr);
        pg.addColorStop(0, `rgba(160,255,110,${a * 1.6})`); pg.addColorStop(1, 'rgba(120,200,80,0)');
        ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(bx, by, rr, 0, TAU); ctx.fill();
      }
      for (let i = 0; i < 4; i++) { const k = (elapsed * 0.7 + i / 4) % 1; circle(z.x + Math.cos(i * 2) * z.r * 0.4, z.y + Math.sin(i * 3) * z.r * 0.3 - k * 20, 2.5 * (1 - k), `rgba(200,255,150,${a * 2})`); }
    }
  }
  const ch = player.charging;
  if (ch) {
    // a ring tightens around the caster as the spell charges
    const k = 1 - ch.t / ch.max, tier = ch.key.length, col = TIER_COLOR[tier];
    if (tier === 7) {
      ctx.fillStyle = `rgba(20,0,8,${k * 0.5})`;
      ctx.fillRect(player.x - 3000, player.y - 3000, 6000, 6000);
      circle(player.x, player.y, 1000 * (1 - k) + 40, null, `rgba(255,51,85,${0.4 + k * 0.6})`, 4 + k * 8);
    } else {
      ctx.globalAlpha = 0.4 + k * 0.6;
      circle(player.x, player.y, 30 + (1 - k) * 25 * tier, null, col, 2 + k * 4);
      ctx.globalAlpha = 1;
    }
    for (let i = 0; i < tier; i++) {
      const a = elapsed * 6 + i * TAU / tier, d = 34 * (1 - k * 0.6);
      circle(player.x + Math.cos(a) * d, player.y + Math.sin(a) * d, 3 + k * 3, ELEMENTS[ch.key[i]].color);
    }
  }
  for (const w of waves) {
    // a rolling wave: deep water, a lighter face, and a crest of foam
    const a = 1 - w.r / w.maxR;
    circle(w.x, w.y, w.r - 12, null, `rgba(40,120,200,${a * 0.6})`, 18);
    circle(w.x, w.y, w.r, null, `rgba(80,180,240,${a})`, 10);
    for (let i = 0; i < 40; i++) {
      const an = i * TAU / 40, rr = w.r + 5 + Math.sin(elapsed * 14 + i * 1.7) * 3;
      circle(w.x + Math.cos(an) * rr, w.y + Math.sin(an) * rr, 3 + (i % 3), `rgba(240,250,255,${a})`);
    }
  }
  if (storms.length) {
    // Thunderstorm: a dark cloud rolls along above you
    const cx = player.x, cy = player.y - 150;
    ctx.globalAlpha = 0.75;
    for (const [ox, oy, r] of [[0, 0, 50], [-55, 10, 38], [55, 8, 40], [-25, -22, 34], [28, -20, 36], [90, 18, 26], [-90, 18, 26]]) circle(cx + ox + Math.sin(elapsed + ox) * 4, cy + oy, r, '#4a5268');
    for (const [ox, oy, r] of [[-20, -26, 22], [26, -24, 20], [0, -10, 26]]) circle(cx + ox, cy + oy, r, '#6a7488');
    ctx.globalAlpha = 1;
    if (Math.random() < 0.15) { ctx.fillStyle = 'rgba(200,240,255,0.25)'; ctx.beginPath(); ctx.arc(cx, cy, 90, 0, TAU); ctx.fill(); }
  }
  for (const m of meteors) {
    const k = 1 - m.t / m.max;
    circle(m.x, m.y, 200, `rgba(255,90,42,${0.08 + k * 0.15})`, `rgba(255,90,42,${0.4 + k * 0.4})`, 2);
    // its shadow grows as it falls; a long fiery tail follows it in
    ctx.fillStyle = `rgba(30,20,20,${0.15 + k * 0.35})`; ctx.beginPath(); ctx.ellipse(m.x, m.y, 30 + k * 40, (30 + k * 40) * 0.45, 0, 0, TAU); ctx.fill();
    const hx = m.x - 260 * (1 - k), hy = m.y - 420 * (1 - k);
    const tail = ctx.createLinearGradient(hx - 130, hy - 210, hx, hy);
    tail.addColorStop(0, 'rgba(255,90,42,0)'); tail.addColorStop(1, 'rgba(255,200,90,0.85)');
    ctx.strokeStyle = tail; ctx.lineWidth = 18; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hx - 130, hy - 210); ctx.lineTo(hx, hy); ctx.stroke();
    if (Math.random() < 0.6) particles.push({ x: hx, y: hy, vx: rnd(-60, 0), vy: rnd(-90, -20), r: 3, life: 0.7, decay: 1.8, color: '#ffd24a' });
    circle(hx, hy, 14, '#5a3a2a');
    const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, 30);
    g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#ffb04a'); g.addColorStop(1, 'rgba(255,90,42,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, 30, 0, TAU); ctx.fill();
  }
  for (const s of shots) drawShot(s);
}

// visuals everyone shares: rings, bolts, particles, floating numbers
// a shaped particle: a twinkling star, a healing plus, a glinting shard, a drop
function drawShapeBit(p, a) {
  ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
  ctx.globalAlpha = a; ctx.fillStyle = p.color;
  const r = p.r * (0.5 + 0.5 * a);
  if (p.shape === 'star') {
    ctx.beginPath();
    for (let i = 0; i < 8; i++) { const rr = i % 2 ? r * 0.35 : r * 1.3, an = i * Math.PI / 4; ctx.lineTo(Math.cos(an) * rr, Math.sin(an) * rr); }
    ctx.closePath(); ctx.fill();
  } else if (p.shape === 'plus') {
    ctx.fillRect(-r * 0.3, -r, r * 0.6, r * 2); ctx.fillRect(-r, -r * 0.3, r * 2, r * 0.6);
  } else if (p.shape === 'shard') {
    ctx.beginPath(); ctx.moveTo(r * 1.6, 0); ctx.lineTo(0, r * 0.45); ctx.lineTo(-r * 1.2, 0); ctx.lineTo(0, -r * 0.45); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = a * 0.8; ctx.fillStyle = '#fff'; ctx.fillRect(-r * 0.2, -r * 0.12, r * 0.8, r * 0.24);
  } else if (p.shape === 'drop') {
    ctx.beginPath(); ctx.moveTo(0, -r * 1.4); ctx.quadraticCurveTo(r, 0, 0, r); ctx.quadraticCurveTo(-r, 0, 0, -r * 1.4); ctx.fill();
  }
  ctx.restore();
}
// the casting sigil: the spell's runes around a turning circle, joined in casting order
function drawSigil(e, a) {
  const n = e.key.length, k = 1 - a, R = (e.small ? 16 : 22 + n * 7) * (0.75 + k * 0.5);
  ctx.save(); ctx.translate(e.x, e.y); ctx.scale(1, 0.55);
  ctx.globalAlpha = Math.min(1, a * 1.8) * (e.small ? 0.7 : 0.9);
  const rot = e.rot + k * 2.2;
  ctx.strokeStyle = TIER_COLOR[n] || '#fff'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, R, 0, TAU); ctx.stroke();
  ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(0, 0, R * 0.78, 0, TAU); ctx.stroke();
  const pts = [];
  for (let i = 0; i < n; i++) { const an = -Math.PI / 2 + i * TAU / n + rot; pts.push([Math.cos(an) * R * 0.78, Math.sin(an) * R * 0.78]); }
  ctx.lineWidth = 1.6;
  for (let i = 0; i < n; i++) {
    const [x1, y1] = pts[i], [x2, y2] = pts[(i + 1 + (n > 4 ? 1 : 0)) % n];
    ctx.strokeStyle = ELEMENTS[e.key[i]].color;
    ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  }
  if (!e.small) for (let i = 0; i < n; i++) {
    const an = -Math.PI / 2 + i * TAU / n + rot;
    drawGlyph(e.key[i], Math.cos(an) * (R + 9), Math.sin(an) * (R + 9), 11, ELEMENTS[e.key[i]].color);
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}
// a woven burst, shaped by its element
function drawNova(e, a) {
  const k = 1 - a, rr = e.r * (0.35 + k * 0.7), c = TYPE_COLOR[e.elem];
  ctx.globalAlpha = a;
  if (e.elem === 'fire') {
    for (let i = 0; i < 18; i++) {
      const an = i * TAU / 18, h = 10 + Math.sin(elapsed * 25 + i) * 4;
      const x = e.x + Math.cos(an) * rr, y = e.y + Math.sin(an) * rr;
      ctx.fillStyle = i % 2 ? '#ffb04a' : '#ff5a2a';
      ctx.beginPath(); ctx.moveTo(x - 5, y); ctx.quadraticCurveTo(x, y - h * 2.2, x + 5, y); ctx.fill();
    }
  } else if (e.elem === 'water') {
    circle(e.x, e.y, rr, null, '#bfe6ff', 4);
    for (let i = 0; i < 16; i++) { const an = i * TAU / 16 + k; circle(e.x + Math.cos(an) * rr * 1.08, e.y + Math.sin(an) * rr * 1.08 - k * 10, 3, '#e8f8ff'); }
  } else if (e.elem === 'earth') {
    for (let i = 0; i < 14; i++) {
      const an = i * TAU / 14, x = e.x + Math.cos(an) * rr, y = e.y + Math.sin(an) * rr - Math.sin(k * Math.PI) * 14;
      ctx.fillStyle = i % 2 ? '#8a6a44' : '#a8845a';
      ctx.beginPath(); ctx.moveTo(x - 6, y + 4); ctx.lineTo(x - 2, y - 7); ctx.lineTo(x + 6, y + 3); ctx.closePath(); ctx.fill();
    }
  } else if (e.elem === 'air') {
    ctx.strokeStyle = '#fff6a0'; ctx.lineWidth = 2.5; ctx.beginPath();
    for (let i = 0; i <= 40; i++) { const an = i * TAU / 40, r2 = rr + (i % 2 ? 9 : -9); i ? ctx.lineTo(e.x + Math.cos(an) * r2, e.y + Math.sin(an) * r2) : ctx.moveTo(e.x + Math.cos(an) * r2, e.y + Math.sin(an) * r2); }
    ctx.stroke();
  } else {
    ctx.strokeStyle = c; ctx.lineWidth = 2;
    for (let i = 0; i < 12; i++) { const an = i * TAU / 12 + k; ctx.beginPath(); ctx.moveTo(e.x + Math.cos(an) * rr * 0.4, e.y + Math.sin(an) * rr * 0.4); ctx.lineTo(e.x + Math.cos(an) * rr, e.y + Math.sin(an) * rr); ctx.stroke(); }
    circle(e.x, e.y, rr, null, '#e6ccff', 2);
  }
  ctx.globalAlpha = 1;
}

function drawSharedFx() {
  for (const e of fx) {
    const a = e.life / e.max;
    if (e.kind === 'ring') {
      ctx.globalAlpha = a;
      circle(e.x, e.y, e.r * (1.1 - a * 0.3), null, e.color, 3);
      ctx.globalAlpha = 1;
    } else if (e.kind === 'cone') {
      ctx.globalAlpha = a * 0.6;
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.moveTo(e.x, e.y);
      ctx.arc(e.x, e.y, e.range * (1.1 - a * 0.3), e.ang - e.half, e.ang + e.half);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (e.kind === 'bolt') {
      // lightning: a wide soft glow, a white-hot core, and little forks
      const path = [];
      for (let i = 0; i < e.pts.length - 1; i++) {
        const p = e.pts[i], q = e.pts[i + 1];
        path.push([p.x, p.y]);
        for (let k = 1; k < 7; k++) path.push([p.x + (q.x - p.x) * k / 7 + rnd(-11, 11), p.y + (q.y - p.y) * k / 7 + rnd(-11, 11)]);
        path.push([q.x, q.y]);
      }
      const stroke = (w, col, al) => { ctx.globalAlpha = al; ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); path.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.stroke(); };
      ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      stroke(10, e.color || '#8ff6ff', a * 0.25);
      stroke(4, e.color || '#a0ffff', a * 0.8);
      stroke(1.5, '#ffffff', a);
      ctx.globalAlpha = a * 0.7; ctx.strokeStyle = e.color || '#a0ffff'; ctx.lineWidth = 1.5;
      for (let i = 2; i < path.length - 1; i += 3) {
        const [x, y] = path[i];
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + rnd(-22, 22), y + rnd(-22, 22)); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (e.kind === 'sigil') {
      drawSigil(e, a);
    } else if (e.kind === 'nova') {
      drawNova(e, a);
    } else if (e.kind === 'rays') {
      // a starburst of light
      ctx.globalAlpha = a; ctx.strokeStyle = e.color; ctx.lineCap = 'round';
      for (let i = 0; i < 10; i++) {
        const an = e.rot + i * TAU / 10, r1 = e.r * (0.2 + (1 - a) * 0.5), r2 = e.r * (0.6 + (1 - a) * 0.8) * (i % 2 ? 0.7 : 1);
        ctx.lineWidth = i % 2 ? 1.5 : 3;
        ctx.beginPath(); ctx.moveTo(e.x + Math.cos(an) * r1, e.y + Math.sin(an) * r1); ctx.lineTo(e.x + Math.cos(an) * r2, e.y + Math.sin(an) * r2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (e.kind === 'streak') {
      ctx.globalAlpha = a; ctx.lineCap = 'round';
      ctx.strokeStyle = e.color; ctx.lineWidth = 6 * a; ctx.globalAlpha = a * 0.35;
      ctx.beginPath(); ctx.moveTo(e.x1, e.y1); ctx.lineTo(e.x2, e.y2); ctx.stroke();
      ctx.lineWidth = 2; ctx.globalAlpha = a;
      ctx.beginPath(); ctx.moveTo(e.x1, e.y1); ctx.lineTo(e.x2, e.y2); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (e.kind === 'cracks') {
      // the ground splits, then the cracks close up
      ctx.globalAlpha = Math.min(1, a * 2); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
      for (const [w, col] of [[5, 'rgba(60,40,20,0.75)'], [2, 'rgba(255,190,110,0.7)']]) {
        ctx.strokeStyle = col; ctx.lineWidth = w;
        for (const pts of e.lines) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.stroke(); }
      }
      ctx.globalAlpha = 1;
    } else if (e.kind === 'arcs') {
      // wind: crescent gusts sweeping outward
      ctx.globalAlpha = a; ctx.strokeStyle = e.color; ctx.lineCap = 'round';
      for (let i = 0; i < 6; i++) {
        const rr = e.r * (0.3 + (1 - a) * 0.8) + i * 6, an = e.rot + i * TAU / 6 + (1 - a) * 2;
        ctx.lineWidth = 3 - i * 0.3;
        ctx.beginPath(); ctx.arc(e.x, e.y, rr, an, an + 1.1); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    } else if (e.kind === 'flamewave') {
      // a rolling front of flame tongues sweeping outward
      const k = 1 - a, rr = e.range * (0.25 + k * 0.85);
      for (let i = 0; i <= 14; i++) {
        const an = e.ang - e.half + (i / 14) * e.half * 2, h = 16 + Math.sin(elapsed * 20 + i * 1.7) * 6;
        const x = e.x + Math.cos(an) * rr, y = e.y + Math.sin(an) * rr;
        const g = ctx.createRadialGradient(x, y, 0, x, y, h * 1.3);
        g.addColorStop(0, `rgba(255,246,176,${a})`); g.addColorStop(0.45, `rgba(255,140,58,${a * 0.9})`); g.addColorStop(1, 'rgba(255,90,42,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, h * 1.3, 0, TAU); ctx.fill();
      }
    } else if (e.kind === 'tendrils') {
      // terror: dark wisps creeping outward
      ctx.globalAlpha = a; ctx.strokeStyle = '#4a2070'; ctx.lineCap = 'round';
      for (let i = 0; i < 12; i++) {
        const an = i * TAU / 12 + e.rot, len = e.r * (0.3 + (1 - a) * 0.8);
        ctx.lineWidth = 5 * a + 1;
        ctx.beginPath(); ctx.moveTo(e.x, e.y);
        for (let k = 1; k <= 6; k++) { const d = len * k / 6, w = Math.sin(elapsed * 9 + k + i) * 10; ctx.lineTo(e.x + Math.cos(an) * d - Math.sin(an) * w, e.y + Math.sin(an) * d + Math.cos(an) * w); }
        ctx.stroke();
        circle(e.x + Math.cos(an) * len, e.y + Math.sin(an) * len, 3, '#c9a0ff');
      }
      ctx.globalAlpha = 1;
    } else if (e.kind === 'clock') {
      // a clock face for time magic, its hand racing round
      ctx.globalAlpha = a * 0.9; ctx.strokeStyle = e.color; ctx.lineWidth = 2;
      const rr = e.r * (0.7 + (1 - a) * 0.4);
      ctx.beginPath(); ctx.arc(e.x, e.y, rr, 0, TAU); ctx.stroke();
      for (let i = 0; i < 12; i++) { const an = i * TAU / 12; ctx.beginPath(); ctx.moveTo(e.x + Math.cos(an) * rr * 0.86, e.y + Math.sin(an) * rr * 0.86); ctx.lineTo(e.x + Math.cos(an) * rr, e.y + Math.sin(an) * rr); ctx.stroke(); }
      const h = (1 - a) * TAU * 2 - Math.PI / 2;
      ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(e.x, e.y); ctx.lineTo(e.x + Math.cos(h) * rr * 0.8, e.y + Math.sin(h) * rr * 0.8); ctx.stroke();
      ctx.globalAlpha = 1;
    } else if (e.kind === 'pillars') {
      // shafts of light rising around a holy place
      for (let i = 0; i < 8; i++) {
        const an = i * TAU / 8 + elapsed * 0.4, x = e.x + Math.cos(an) * e.r, y = e.y + Math.sin(an) * e.r * 0.6;
        const g = ctx.createLinearGradient(x, y, x, y - 120);
        g.addColorStop(0, `rgba(255,246,176,${a * 0.6})`); g.addColorStop(1, 'rgba(255,246,176,0)');
        ctx.fillStyle = g; ctx.fillRect(x - 6, y - 120, 12, 120);
      }
    }
  }
  for (const s of enemyShots) {
    circle(s.x, s.y, s.r + 3, 'rgba(0,0,0,0.4)');
    circle(s.x, s.y, s.r, s.color, '#fff', 1.5);
  }
  for (const p of particles) {
    const a = Math.max(0, Math.min(1, p.life));
    if (p.puff) {
      // a soft billow that swells as it fades
      const rr = p.r * (1 + (1 - a) * 2.2);
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rr);
      g.addColorStop(0, p.color); g.addColorStop(1, clear(p.color));
      ctx.globalAlpha = a * 0.5; ctx.fillStyle = g;
      ctx.fillRect(p.x - rr, p.y - rr, rr * 2, rr * 2);
      continue;
    }
    if (p.leaf) {
      ctx.globalAlpha = a;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot || 0);
      ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * 0.45, 0, 0, TAU); ctx.fillStyle = p.color; ctx.fill();
      ctx.restore();
      continue;
    }
    if (p.shape) { drawShapeBit(p, a); continue; }
    // sparks glow softly and shrink away
    const rr = p.r * (0.45 + 0.55 * a);
    ctx.globalAlpha = a * 0.25; circle(p.x, p.y, rr * 2.3, p.color);
    ctx.globalAlpha = a; circle(p.x, p.y, rr, p.color);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const t of floaters) {
    ctx.globalAlpha = Math.min(1, t.life / t.max * 1.5);
    ctx.font = `bold ${t.size}px "Big Caslon", "Libre Caslon Text", Georgia, serif`;
    ctx.fillStyle = '#000';
    ctx.fillText(t.text, t.x + 1, t.y + 1);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawWorld() {
  let camX = player.x - W / 2, camY = player.y - playerScreenY();
  if (shake > 0) { camX += rnd(-shake, shake); camY += rnd(-shake, shake); }
  ctx.save();
  ctx.translate(-camX, -camY);
  drawGround(camX, camY);
  drawShrine();
  if (mode !== 'battle') {
    drawLake(camX, camY);
    drawGrass(camX, camY);
    drawCastles(camX, camY);
  }
  if (mode === 'battle') drawTufts(camX, camY);
  drawCloudShadows(camX, camY);
  drawSolids(camX, camY);
  if (mode === 'battle') drawLasers();
  for (const b of tempSolids) {
    ctx.globalAlpha = Math.min(1, b.life);
    const t = elapsed;
    // walls burst up out of the ground
    const rise = b.born ? clamp((elapsed - b.born) / 0.22, 0, 1) : 1;
    ctx.save();
    if (rise < 1) { ctx.translate(b.x, b.y + b.r); ctx.scale(1, 0.15 + 0.85 * rise); ctx.translate(-b.x, -(b.y + b.r)); }
    if (b.elem === 'fire') {
      // a pillar of flame
      const h = b.r * (1.6 + Math.sin(t * 10 + b.x) * 0.25);
      const g = ctx.createRadialGradient(b.x, b.y, 2, b.x, b.y - h * 0.4, h);
      g.addColorStop(0, '#fff6b0'); g.addColorStop(0.4, '#ff8a3a'); g.addColorStop(1, 'rgba(255,90,42,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(b.x, b.y - h * 0.3, b.r, h, 0, 0, TAU); ctx.fill();
    } else if (b.elem === 'water') {
      // a block of ice
      ctx.beginPath();
      for (let i = 0; i < 6; i++) { const a2 = i * TAU / 6 + 0.5; i ? ctx.lineTo(b.x + Math.cos(a2) * b.r, b.y + Math.sin(a2) * b.r) : ctx.moveTo(b.x + Math.cos(a2) * b.r, b.y + Math.sin(a2) * b.r); }
      ctx.closePath(); ctx.fillStyle = 'rgba(190,230,255,0.85)'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      circle(b.x - 4, b.y - 4, 3, '#fff');
    } else if (b.elem === 'air') {
      // a column of wind
      ctx.strokeStyle = 'rgba(255,250,200,0.8)'; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (0.5 + i * 0.3), t * 6 + i * 2, t * 6 + i * 2 + 2.5); ctx.stroke(); }
    } else if (b.elem === 'spirit') {
      // a shimmering illusion: walk-through, but it scrambles the mind
      ctx.globalAlpha *= 0.55 + Math.sin(t * 4 + b.y) * 0.2;
      circle(b.x, b.y, b.r, 'rgba(199,125,255,0.35)', '#e6ccff', 1.5);
      circle(b.x, b.y, b.r * 0.4, '#e6ccff');
    } else {
      circle(b.x + 3, b.y + 5, b.r, 'rgba(0,0,0,0.3)');
      circle(b.x, b.y, b.r, '#7a6a55', '#4e4236', 3);
      circle(b.x - 4, b.y - 4, b.r * 0.4, '#958268');
    }
    ctx.restore();
    // a woven wall shows its finish
    const fin = b.spec && b.spec.finish;
    if (fin === 'S') circle(b.x, b.y, b.r + 6 + Math.sin(t * 3 + b.x) * 2, null, 'rgba(157,255,176,0.6)', 2);
    else if (fin === 'F' && Math.random() < 0.2) particles.push({ x: b.x + rnd(-8, 8), y: b.y - 6, vx: 0, vy: -50, r: 2, life: 0.6, decay: 2, color: '#ffb04a' });
    else if (fin === 'W') { ctx.globalAlpha *= 0.5 + 0.5 * Math.sin(t * 5 + b.y); drawShapeBit({ shape: 'star', x: b.x + 6, y: b.y - b.r, r: 3, color: '#e8f8ff', rot: t }, 1); }
    else if (fin === 'A') { ctx.strokeStyle = 'rgba(255,250,200,0.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, t * 5, t * 5 + 1.5); ctx.stroke(); }
    else if (fin === 'E') { ctx.strokeStyle = 'rgba(90,70,40,0.7)'; ctx.lineWidth = 2; ctx.strokeRect(b.x - b.r * 0.7, b.y - b.r * 0.7, b.r * 1.4, b.r * 1.4); }
    ctx.globalAlpha = 1;
  }
  drawTraps();
  if (versus && net.role === 'host') withSide('red', drawTraps);
  else if (aiMagic() && leadMage) withSide('red', drawTraps, leadMage);
  drawBoat();
  drawScrolls();
  for (const c of chests) drawChest(c);
  for (const f of foes) {
    if (f.dead || f.proxyOf) continue;
    if (f.x < camX - 120 || f.x > camX + W + 120 || f.y < camY - 120 || f.y > camY + H + 120) continue;
    f.boss ? drawBoss(f) : f.unit && !(f.hex > 0) ? drawUnit(f) : drawFoe(f);
  }
  for (const u of friends) if (!u.dead && inView(u.x, u.y, 120, camX, camY)) drawUnit(u);
  for (const sh of bshots) {
    if (sh.arrow) {
      const sp = Math.hypot(sh.vx, sh.vy) || 1;
      ctx.strokeStyle = sh.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sh.x - sh.vx / sp * 12, sh.y - sh.vy / sp * 12); ctx.lineTo(sh.x, sh.y); ctx.stroke();
      continue;
    }
    if (sh.elem) {
      circle(sh.x + 3, sh.y + 6, sh.r * 0.8, 'rgba(0,0,0,0.25)');
      drawElemShot(sh);
      // a thin ring in the shooter's team colour, so you can tell whose it is
      circle(sh.x, sh.y, sh.r * 1.5, null, TEAM_COLOR[sh.team] + '99', 1);
      continue;
    }
    circle(sh.x, sh.y, sh.r + 4, 'rgba(0,0,0,0.35)');
    circle(sh.x, sh.y, sh.r, sh.color, '#fff', 1.5);
  }
  for (const a of allies) drawAlly(a);
  drawPlayer();
  if (versus) {
    // your friend's wizard, helpers and spells
    if (net.role === 'host') withSide('red', () => { for (const a of allies) drawAlly(a); drawPlayer(); drawSideFx(); });
    else if (otherHero) drawPlayer(otherHero);
  } else if (aiMagic() && leadMage) withSide('red', () => { for (const a of allies) drawAlly(a); drawSideFx(); }, leadMage);
  drawSideFx();
  drawSharedFx();
  drawMotes(camX, camY);
  ctx.restore();
}

function drawTraps() {
  for (const t of traps) {
    const on = t.arm <= 0, c = t.spec ? TYPE_COLOR[t.spec.elem] : '#ff8a3a';

// how much ground each side holds, and whose build turn is next
// the match clock: big, and it warms up as time runs out
function clockText(t) { return `${Math.floor(t / 60)}:${Math.floor(t % 60).toString().padStart(2, '0')}`; }
// a dial counting down to the next build turn, beside the match clock
function drawBuildClock(cx, cy) {
  const T = teams, r = 14;
  let frac, num, col, label, sub, now = false;
  if (T.pending) {           // your turn right now
    frac = T.pending.t / (BUILD_EVERY - 1); num = Math.ceil(T.pending.t); col = '#ffd24a';
    label = 'BUILD NOW'; sub = 'turret or titan'; now = true;
  } else if (T.pendingRed) { // a duel friend choosing
    frac = T.pendingRed.t / (BUILD_EVERY - 1); num = Math.ceil(T.pendingRed.t); col = TEAM_COLOR.red;
    label = 'RED BUILDING'; sub = 'choosing now';
  } else {
    const mine = T.build.team === 'blue';
    frac = clamp(T.build.t / BUILD_EVERY, 0, 1); num = Math.ceil(T.build.t); col = TEAM_COLOR[T.build.team];
    label = mine ? 'YOUR BUILD' : 'RED BUILDS'; sub = `in ${num} second${num === 1 ? '' : 's'}`;
  }
  const pulse = now ? 0.75 + 0.25 * Math.abs(Math.sin(elapsed * 6)) : 1;
  circle(cx, cy, r + 2, 'rgba(0,0,0,0.6)');
  ctx.strokeStyle = 'rgba(255,255,255,0.15)'; ctx.lineWidth = 3.5;
  ctx.beginPath(); ctx.arc(cx, cy, r - 1, 0, TAU); ctx.stroke();
  ctx.globalAlpha = pulse;
  ctx.strokeStyle = col; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.arc(cx, cy, r - 1, -Math.PI / 2, -Math.PI / 2 + TAU * frac); ctx.stroke();
  ctx.fillStyle = col; ctx.textAlign = 'center'; ctx.font = `bold 14px ${SERIF}`;
  ctx.fillText(String(num), cx, cy + 5);
  ctx.textAlign = 'left'; ctx.font = `bold 12px ${SERIF}`;
  ctx.fillText(label, cx + r + 7, cy - 1);
  ctx.globalAlpha = 1;
  ctx.fillStyle = '#bbb'; ctx.font = `italic 11px ${SERIF}`;
  ctx.fillText(sub, cx + r + 7, cy + 12);
}
function drawMatchClock(x, y) {
  const t = teams.time, late = t <= 30, end = t <= 10;
  const txt = clockText(Math.ceil(t));
  ctx.font = 'bold 26px "Big Caslon", "Libre Caslon Text", Georgia, serif';
  ctx.textAlign = 'left';
  const tw = ctx.measureText(txt).width;
  roundRect(x - 6, y - 25, tw + 12, 32, 8);
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
  ctx.strokeStyle = end ? '#ff4a5a' : late ? '#ffd24a' : 'rgba(255,255,255,0.25)'; ctx.lineWidth = 1.5; ctx.stroke();
  const pulse = end ? 0.6 + 0.4 * Math.abs(Math.sin(elapsed * 6)) : 1;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = end ? '#ff6a6a' : late ? '#ffd24a' : '#fff';
  ctx.fillText(txt, x, y);
  ctx.globalAlpha = 1;
  drawBuildClock(x + tw + 34, y - 9);
  // the last ten seconds count down in the middle of the field
  if (end && state === 'play') {
    ctx.textAlign = 'center';
    ctx.font = `bold ${Math.round(64 + 20 * (1 - (t % 1)))}px "Big Caslon", "Libre Caslon Text", Georgia, serif`;
    ctx.globalAlpha = 0.55 + 0.4 * (t % 1);

}

// The minion mix: a pentagon with one corner per element (laid out like the
// casting pentagram). Drag the dot toward the kinds you want more of.
function mixTri() {
  const R = Math.min(46, W * 0.11), cx = 44 + R, cy = 214 + R, pts = {};
  MINION_KINDS.forEach((k, i) => { const a = -Math.PI / 2 + i * TAU / 5; pts[k] = { x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R }; });
  return { R, cx, cy, pts };
}
function mixPoint() {
  const T = mixTri(), m = teams.blue.mix;
  if (teams.blue.dot) return teams.blue.dot;
  return { x: MINION_KINDS.reduce((a, k) => a + T.pts[k].x * m[k], 0), y: MINION_KINDS.reduce((a, k) => a + T.pts[k].y * m[k], 0) };
}
let mixOpen = false;
function mixToggleRect() { return { x: 14, y: 176, w: 74, h: 22 }; }
function mixToggleHit(x, y) {
  if (mode !== 'battle' || !teams) return false;
  const r = mixToggleRect();
  return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
}
function mixHit(x, y) {
  if (mode !== 'battle' || !teams || !mixOpen) return false;
  const T = mixTri();
  return Math.hypot(x - T.cx, y - T.cy) < T.R + 22;
}
// set the mix from a point: the closer to a corner, the more of that kind
function setMixAt(x, y) {
  const T = mixTri();
  let dx = x - T.cx, dy = y - T.cy, d = Math.hypot(dx, dy);
  const lim = T.R * 0.95;
  if (d > lim) { dx *= lim / d; dy *= lim / d; }
  const px = T.cx + dx, py = T.cy + dy;
  const w = MINION_KINDS.map(k => 1 / (Math.hypot(px - T.pts[k].x, py - T.pts[k].y) ** 2 + T.R * T.R * 0.08));
  const tot = w.reduce((a, b) => a + b, 0);
  teams.blue.mix = Object.fromEntries(MINION_KINDS.map((k, i) => [k, w[i] / tot]));
  teams.blue.dot = { x: px, y: py };
  if (net.role === 'guest') { const now = performance.now(); if (now - (net.mixT || 0) > 150) { net.mixT = now; net.send({ t: 'mix', mix: teams.blue.mix }); } }
}
// each side's resonance: the five powers and how strong they are right now

      ctx.globalAlpha = v ? 1 : 0.3;

      if (v) ctx.fillText(String(v), cx + 6, yy + 13);

    });

}
function drawCharges() {
  if (mode !== 'battle' || !player.charge) return;
  const r = 7.5, gap = 4, y = 160;
  let x = 14 + r;
  for (const t of CHARGE_TYPES) {
    const c = player.charge[t], low = c < CHARGE_LOW, col = TYPE_COLOR[t];

function drawMixTri() {
  drawMixToggle();
  drawResonance();
  if (mode !== 'battle' || !teams || !mixOpen) return;
  const T = mixTri(), P = T.pts;
  ctx.beginPath();
  MINION_KINDS.forEach((k, i) => i ? ctx.lineTo(P[k].x, P[k].y) : ctx.moveTo(P[k].x, P[k].y));
  ctx.closePath();
  ctx.fillStyle = 'rgba(10,14,28,0.78)'; ctx.fill();
  ctx.strokeStyle = 'rgba(74,168,255,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
  // who beats whom: gold arrows along the Water → Fire → Air → Earth → Spirit cycle
  ctx.strokeStyle = 'rgba(255,210,74,0.55)'; ctx.fillStyle = 'rgba(255,210,74,0.75)'; ctx.lineWidth = 1.2;
  for (const e of ELEM_CYCLE) {
    const a = P[MINION_OF[e]], b = P[MINION_OF[elemBeats(e)]];
    const dx = b.x - a.x, dy = b.y - a.y, dl = Math.hypot(dx, dy);
    const sx = a.x + dx / dl * 9, sy = a.y + dy / dl * 9, ex = b.x - dx / dl * 9, ey = b.y - dy / dl * 9;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex, ey);
    ctx.lineTo(ex - dx / dl * 6 - dy / dl * 3.5, ey - dy / dl * 6 + dx / dl * 3.5); ctx.lineTo(ex - dx / dl * 6 + dy / dl * 3.5, ey - dy / dl * 6 - dx / dl * 3.5); ctx.closePath(); ctx.fill();
  }
  const counts = waveKinds(teams.blue.mix, teams.blue.minions).reduce((m, k) => (m[k] = (m[k] || 0) + 1, m), {});
  for (const k of MINION_KINDS) {
    const e = UNITS[k].elem, q = P[k], ox = q.x - T.cx, oy = q.y - T.cy, ol = Math.hypot(ox, oy);
    circle(q.x, q.y, 8, 'rgba(10,14,28,0.95)', TYPE_COLOR[e], 2);
    drawGlyph(ELEM_GLYPH[e], q.x, q.y, 11, TYPE_COLOR[e]);

    ctx.fillText(`${UNITS[k].name} ${counts[k] || 0}`, q.x + ox / ol * 22, q.y + oy / ol * 20 + 3);
  }
  const m = mixPoint();
  circle(m.x, m.y, 6, TEAM_COLOR.blue, '#fff', 2);
}

function drawBattleMap() {
  const w = Math.min(160, W * 0.38), h = w * ARENA_H / WORLD, x = W - w - 12, y = 12, k = w / (WORLD * 2);
  const mx = v => x + (v + WORLD) * k, my = v => y + (v + ARENA_H) * k;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, TAU); ctx.fill();
  const cw = CELL * k;
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    const v = terr[j * COLS + i];
    if (!v) continue;
    ctx.fillStyle = v === 1 ? 'rgba(74,168,255,0.45)' : 'rgba(255,74,90,0.45)';
    ctx.fillRect(x + i * cw, y + j * cw, cw + 0.5, cw + 0.5);
  }
  ctx.strokeStyle = 'rgba(199,125,255,0.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, TAU); ctx.stroke();
  for (const list of [friends, foes]) for (const u of list) {

      ctx.fillStyle = c; ctx.fill();

    } else if (u.structure) { ctx.fillStyle = c; const s = u.kind === 'nexus' ? 7 : 4; ctx.fillRect(mx(u.x) - s / 2, my(u.y) - s / 2, s, s); }

// ── pentagram panel ──────────────────────────────────────────────────────────
function drawSeqPath(list, color) {
  if (!list.length) return;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let i = 1; i < list.length; i++) {
    const a = nodePos(NODE_ORDER.indexOf(list[i - 1])), b = nodePos(NODE_ORDER.indexOf(list[i]));
    const col = color || ELEMENTS[list[i]].color;
    if (a.x === b.x && a.y === b.y) {
      circle(a.x, a.y, PENT.S * 0.62 + (i % 3) * 4, null, col, 3);
      continue;
    }
    ctx.strokeStyle = col;
    ctx.lineWidth = 6;
    ctx.shadowColor = col;
    ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

function drawSlots(list, highlight) {
  const n = MAX_SEQ, s = PENT.slot, gap = 5;
  const total = n * s + (n - 1) * gap;
  const x0 = PENT.cx - total / 2;
  for (let i = 0; i < n; i++) {
    const x = x0 + i * (s + gap), y = PENT.slotY - s / 2;
    roundRect(x, y, s, s, 5);
    ctx.fillStyle = i < list.length ? 'rgba(30,20,50,0.9)' : 'rgba(255,255,255,0.05)';
    ctx.fill();
    ctx.strokeStyle = i < list.length ? ELEMENTS[list[i]].color : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = i === highlight ? 3 : 1.5;
    ctx.stroke();
    if (i < list.length) drawGlyph(list[i], x + s / 2, y + s / 2, s * 0.8, ELEMENTS[list[i]].color);
  }
  // how complex (and so how strong) the chain is so far
  if (list.length >= 2) {
    const key = list.join(''), pot = potencyOf(key), lx = x0 + total + 8;
    ctx.textAlign = 'left';
    ctx.font = 'bold 11px "Big Caslon", "Libre Caslon Text", Georgia, serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText(`cx ${complexityOf(key).toFixed(1)}`, lx, PENT.slotY - 2);
    ctx.fillStyle = pot > 1 ? '#ffd24a' : '#777';
    ctx.fillText(`×${pot.toFixed(2)}`, lx, PENT.slotY + 11);
  }
}

function drawPentagram(ghost) {
  const { cx, cy, R, S } = PENT;
  const g = ctx.createLinearGradient(0, panelTop - 30, 0, H);
  g.addColorStop(0, 'rgba(8,6,16,0)');
  g.addColorStop(0.2, 'rgba(8,6,16,0.82)');
  g.addColorStop(1, 'rgba(8,6,16,0.95)');
  ctx.fillStyle = g;
  ctx.fillRect(0, panelTop - 30, W, H - panelTop + 30);

  circle(cx, cy, R * 1.08, 'rgba(40,20,70,0.35)', 'rgba(199,125,255,0.3)', 2);
  ctx.strokeStyle = 'rgba(199,125,255,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= 5; i++) {
    const p = nodePos((i * 2) % 5);
    i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
  }
  ctx.stroke();

  const list = ghost || seq;
  drawSeqPath(list);

  if (!ghost && finger && seq.length) {
    const last = nodePos(NODE_ORDER.indexOf(seq[seq.length - 1]));
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(finger.x, finger.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  const showKeys = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
  for (let i = 0; i < 5; i++) {
    const el = NODE_ORDER[i], e = ELEMENTS[el], p = nodePos(i);
    const count = list.filter(v => v === el).length;
    const active = !ghost && castPtr !== null && curNode === i;
    const pulse = nodePulse[i];
    const s = S * (1 + pulse * 0.18);
    if (count || active) { ctx.shadowColor = e.color; ctx.shadowBlur = 18 + pulse * 20; }
    roundRect(p.x - s / 2, p.y - s / 2, s, s, 8);
    ctx.fillStyle = count ? 'rgba(40,24,64,0.95)' : 'rgba(22,16,34,0.95)';
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = e.color;
    ctx.lineWidth = active ? 4 : 2.5;
    ctx.stroke();
    drawGlyph(el, p.x, p.y, s * 0.72, e.color);
    if (count) {
      circle(p.x + s / 2, p.y - s / 2, 9, e.color);
      ctx.fillStyle = '#111';
      ctx.font = 'bold 11px "Big Caslon", "Libre Caslon Text", Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText(count, p.x + s / 2, p.y - s / 2 + 4);
    }
    if (showKeys) {
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.font = '10px "Big Caslon", "Libre Caslon Text", Georgia, serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${e.name} [${e.key}]`, p.x, p.y + s / 2 + 12);
    }
  }

  drawSlots(list, ghost ? list.length - 1 : -1);

  if (castMsg && !ghost) {
    ctx.globalAlpha = Math.min(1, castMsg.life * 1.5);
    ctx.textAlign = 'center';
    ctx.font = 'bold 18px "Big Caslon", "Libre Caslon Text", Georgia, serif';
    ctx.fillStyle = castMsg.color;
    ctx.fillText(castMsg.text, cx, PENT.msgY);
    ctx.globalAlpha = 1;
  }
}

// ── menus ──
// Main: the title, your hero showing off on the left with Wizard / Space on

const SERIF = '"Big Caslon", "Libre Caslon Text", Georgia, serif';
const SERIF_BIG = '"Big Caslon", "Libre Caslon Display", "Libre Caslon Text", Georgia, serif';
let menuPage = 'main';
let menuFx = [], menuT = 0, menuCast = 0;
function goMenu(page) { menuPage = page; SFX.buff(); }

// a menu button: just the word, in capitals, filling its row top to bottom;

// your hero, big, doing a little routine: the wizard twirls sparks from the
// staff, the spacefarer floats and fires the blaster; tap it to make it cast
function drawMenuHero(cx, cy, s, dt) {
  menuT += dt;
  menuCast = Math.max(0, menuCast - dt);
  const t = menuT, every = 2.6, phase = (t % every) / every;
  const casting = menuCast > 0 || phase > 0.78;
  const elemCol = TYPE_COLOR[ELEM_CYCLE[Math.floor(t / every) % 5]];
  // a soft glow behind
  const g = ctx.createRadialGradient(cx, cy, 4, cx, cy, s * 34);
  g.addColorStop(0, mySkin === 'space' ? 'rgba(74,168,255,0.35)' : 'rgba(199,125,255,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, s * 34, 0, TAU); ctx.fill();
  ctx.save();
  if (mySkin === 'space') {
    // zero-g: drift, tilt, jetpack puffs, and a blaster shot now and then
    const bob = Math.sin(t * 1.6) * 5;
    ctx.translate(cx, cy + bob); ctx.rotate(Math.sin(t * 0.9) * 0.08); ctx.scale(s, s);
    if (Math.random() < 0.5) menuFx.push({ x: cx - 12 * s, y: cy + bob + 4 * s, vx: rnd(-30, -10), vy: rnd(20, 60), r: rnd(2, 4), life: 0.7, color: 'rgba(200,220,255,0.8)' });
    drawAstronaut(0, 0, 1, '#c77dff', '#4aa8ff', { x: 1, y: 0 }, casting ? '#fff' : elemCol);
    if (casting && Math.random() < 0.6) menuFx.push({ x: cx + 22 * s, y: cy + bob, vx: rnd(380, 520), vy: rnd(-20, 20), r: 3, life: 0.5, color: elemCol, bolt: true });
  } else {
    // the wizard bobs, raises the staff, and showers sparks of each element in turn
    const bob = Math.sin(t * 2) * 3, lift = casting ? 6 : 0;
    ctx.translate(cx, cy + bob); ctx.scale(s, s);
    drawWizardFigure(0, 0, Math.sin(t * 0.7) > 0 ? 1 : -1, '#4b2d7a', '#6a3fb0', casting ? '#fff' : elemCol, lift);
    const ox = cx + 16 * s, oy = cy + bob - (20 + lift) * s;
    const n = casting ? 3 : Math.random() < 0.3 ? 1 : 0;
    for (let i = 0; i < n; i++) { const a = rnd(-Math.PI, 0); const sp = rnd(60, casting ? 220 : 90); menuFx.push({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rnd(1.5, 3.5), life: 0.9, color: elemCol }); }
  }
  ctx.restore();
  // sparks, puffs and bolts
  for (const f of menuFx) {
    f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt; if (!f.bolt) f.vy += 60 * dt;

}

function drawReveal() {
  dim(0.8);
  const combo = reveal.combo;
  // replay the pattern one element at a time
  const cycle = combo.length + 2;
  const step = Math.min(combo.length, Math.floor((reveal.t * 2.2) % cycle) + 1);
  drawPentagram(combo.slice(0, step).split(''));

  ctx.textAlign = 'center';
  const maxW = Math.min(W - 40, 480);
  let y = Math.max(60, panelTop * 0.18);
  ctx.fillStyle = '#ffd24a';
  ctx.font = 'bold 16px "Big Caslon", "Libre Caslon Text", Georgia, serif';
  ctx.fillText(reveal.title, W / 2, y);
  y += 22;
  ctx.fillStyle = TIER_COLOR[combo.length];
  ctx.font = 'bold 13px "Big Caslon", "Libre Caslon Text", Georgia, serif';
  ctx.fillText(`TIER ${combo.length} · ${TIERS[combo.length].toUpperCase()} · COMPLEXITY ${complexityOf(combo).toFixed(1)} · POWER ×${potencyOf(combo).toFixed(2)}`, W / 2, y);
  y += 40;
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(36, W / 11)}px "Big Caslon", "Libre Caslon Display", "Libre Caslon Text", Georgia, serif`;
  ctx.fillText(reveal.name, W / 2, y);
  y += 28;
  ctx.fillStyle = '#bbb';
  ctx.font = '14px "Big Caslon", "Libre Caslon Text", Georgia, serif';
  ctx.fillText(combo.split('').map(c => ELEMENTS[c].name).join(' → '), W / 2, y);
  y += 22;
  const gs = Math.min(40, (W - 40) / combo.length - 6);
  const x0 = W / 2 - (combo.length * (gs + 6) - 6) / 2;
  for (let i = 0; i < combo.length; i++) {
    const el = combo[i], x = x0 + i * (gs + 6);
    roundRect(x, y, gs, gs, 6);
    ctx.fillStyle = 'rgba(30,20,50,0.9)'; ctx.fill();
    ctx.strokeStyle = ELEMENTS[el].color; ctx.lineWidth = 2; ctx.stroke();
    drawGlyph(el, x + gs / 2, y + gs / 2, gs * 0.75, ELEMENTS[el].color);
  }
  y += gs + 30;
  ctx.fillStyle = '#ffb08a';
  ctx.font = 'italic 15px "Big Caslon", "Libre Caslon Display", "Libre Caslon Text", Georgia, serif';
  y = wrapText('Memorise it. The scroll crumbles once you look away.', W / 2, y, maxW, 20);
  if (reveal.t > 1.2) {
    ctx.fillStyle = '#ffd24a';
    ctx.font = 'bold 16px "Big Caslon", "Libre Caslon Text", Georgia, serif';
    ctx.globalAlpha = 0.6 + Math.sin(elapsed * 3) * 0.4;
    ctx.fillText('[ tap to continue ]', W / 2, y + 16);
    ctx.globalAlpha = 1;
  }
}

  const cBlue = x + w * 0.66, cRed = x + w - 14;
  let ry = y + 20;
  ctx.font = 'bold 12px "Big Caslon", "Libre Caslon Text", Georgia, serif';
  ctx.textAlign = 'left'; ctx.fillStyle = '#aaa'; ctx.fillText('HOW IT WAS SCORED', x + 12, ry);
  ctx.textAlign = 'right'; ctx.fillStyle = TEAM_COLOR.blue; ctx.fillText('You', cBlue, ry);
  ctx.fillStyle = TEAM_COLOR.red; ctx.fillText('Red', cRed, ry);
  const cell = (e, cx, col) => {
    ctx.textAlign = 'right';
    if (!e) { ctx.fillStyle = '#555'; ctx.fillText('–', cx, ry); return; }
    ctx.fillStyle = col; ctx.font = 'bold 13px "Big Caslon", "Libre Caslon Text", Georgia, serif'; ctx.fillText(String(e.pts), cx, ry);
    ctx.fillStyle = '#888'; ctx.font = '11px "Big Caslon", "Libre Caslon Text", Georgia, serif';
    if (e.n > 1 && e.pts !== e.n) ctx.fillText(`×${e.n} `, cx - ctx.measureText(String(e.pts)).width - 10, ry);
  };
  for (const c of rows) {
    ry += rh;
    ctx.textAlign = 'left'; ctx.fillStyle = '#ddd'; ctx.font = '13px "Big Caslon", "Libre Caslon Text", Georgia, serif';
    ctx.fillText(c, x + 12, ry);
    cell(B.blue[c], cBlue, '#cfe6ff'); cell(B.red[c], cRed, '#ffd0d4');
  }
  if (!rows.length) { ry += rh; ctx.textAlign = 'left'; ctx.fillStyle = '#888'; ctx.font = '13px "Big Caslon", "Libre Caslon Text", Georgia, serif'; ctx.fillText('No points scored', x + 12, ry); }
  ry += rh + 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.moveTo(x + 10, ry - 15); ctx.lineTo(x + w - 10, ry - 15); ctx.stroke();
  ctx.font = 'bold 14px "Big Caslon", "Libre Caslon Text", Georgia, serif';
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.fillText('Total', x + 12, ry);
  ctx.textAlign = 'right'; ctx.fillStyle = TEAM_COLOR.blue; ctx.fillText(String(teams.blue.score), cBlue, ry);
  ctx.fillStyle = TEAM_COLOR.red; ctx.fillText(String(teams.red.score), cRed, ry);
  ctx.textAlign = 'center';
  return y + h;
}
// ── the end of a battle: the result, then a scrolling report on the match ──
let endScroll = 0, endMax = 0, endButton = null;
function endHeading(text, L, w, y) {
  ctx.textAlign = 'left'; ctx.fillStyle = '#ffd24a'; ctx.font = `19px ${SERIF_BIG}`;
  ctx.fillText(text.toUpperCase(), L, y + 18);
  ctx.strokeStyle = 'rgba(255,210,74,0.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L, y + 25); ctx.lineTo(L + w, y + 25); ctx.stroke();
  return y + 34;
}
// "You 12 · Red 4" on one line
function endPair(label, a, b, L, w, y) {
  ctx.font = `14px ${SERIF}`;
  ctx.textAlign = 'left'; ctx.fillStyle = '#efe9f8'; ctx.fillText(label, L, y + 14);
  ctx.textAlign = 'right';
  ctx.fillStyle = TEAM_COLOR.red; ctx.fillText(String(b), L + w, y + 14);
  ctx.fillStyle = TEAM_COLOR.blue; ctx.fillText(String(a), L + w - 56, y + 14);
  return y + 21;
}
// a bar split into coloured shares, with the percentage written in each
function endShares(label, counts, colorOf, L, w, y) {
  const keys = Object.keys(counts).filter(k => counts[k] > 0), total = keys.reduce((n, k) => n + counts[k], 0);
  ctx.font = `13px ${SERIF}`; ctx.textAlign = 'left'; ctx.fillStyle = '#ccc';
  ctx.fillText(label, L, y + 12);
  const bx = L + 46, bw = w - 46, by = y, bh = 18;
  roundRect(bx, by, bw, bh, 5); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill();
  if (!total) { ctx.fillStyle = '#888'; ctx.textAlign = 'center'; ctx.fillText('none', bx + bw / 2, by + 13); return y + 26; }
  let x = bx;
  for (const k of keys) {
    const f = counts[k] / total, sw = bw * f;
    ctx.fillStyle = colorOf(k); ctx.fillRect(x, by, sw, bh);
    if (sw > 30) { ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.font = `bold 11px ${SERIF}`; ctx.fillText(Math.round(f * 100) + '%', x + sw / 2, by + 13); }
    x += sw;
  }
  return y + 26;
}
// a key of colours under a shares bar
function endKey(items, L, w, y) {
  ctx.font = `12px ${SERIF}`; ctx.textAlign = 'left';
  let x = L;
  for (const [col, name] of items) {
    const tw = ctx.measureText(name).width + 22;
    if (x + tw > L + w) { x = L; y += 16; }
    circle(x + 5, y + 8, 5, col); ctx.fillStyle = '#ddd'; ctx.fillText(name, x + 13, y + 12); x += tw;
  }
  return y + 22;
}
// land held over the match: two lines, and a marker wherever the lead changed hands
function endLandGraph(land, L, w, y) {
  const h = 110, gx = L + 28, gw = w - 30, gy = y + 4;
  const pts = land.map(([t, b, r]) => [t, b / FIELD_CELLS * 100, r / FIELD_CELLS * 100]);
  const tMax = Math.max(60, ...pts.map(p => p[0])), top = Math.max(50, Math.ceil((Math.max(...pts.map(p => Math.max(p[1], p[2])), 0) + 5) / 10) * 10);
  const X = t => gx + t / tMax * gw, Y = v => gy + h - v / top * h;
  ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(gx, gy, gw, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1; ctx.font = `10px ${SERIF}`; ctx.fillStyle = '#999'; ctx.textAlign = 'right';
  for (let v = 0; v <= top; v += top / 2) { ctx.beginPath(); ctx.moveTo(gx, Y(v)); ctx.lineTo(gx + gw, Y(v)); ctx.stroke(); ctx.fillText(Math.round(v) + '%', gx - 4, Y(v) + 3); }
  ctx.textAlign = 'center';
  for (const t of [0, tMax / 2, tMax]) ctx.fillText(clockText(t), X(t), gy + h + 13);
  // where the lead switched
  let lead = null, switches = 0;
  for (const [t, b, r] of pts) {
    const now = b > r ? 'blue' : r > b ? 'red' : lead;
    if (lead && now && now !== lead) {
      switches++;
      ctx.strokeStyle = TEAM_COLOR[now]; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(X(t), gy); ctx.lineTo(X(t), gy + h); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = TEAM_COLOR[now]; ctx.font = `bold 10px ${SERIF}`;
      ctx.fillText(now === 'blue' ? 'you lead' : 'red leads', clamp(X(t), gx + 24, gx + gw - 24), gy - 3);
    }
    lead = now;
  }
  for (const [team, i] of [['blue', 1], ['red', 2]]) {
    ctx.strokeStyle = TEAM_COLOR[team]; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    ctx.beginPath(); pts.forEach((p, k) => k ? ctx.lineTo(X(p[0]), Y(p[i])) : ctx.moveTo(X(p[0]), Y(p[i]))); ctx.stroke();
  }
  return { y: gy + h + 20, switches };
}
function drawBattleEnd(win) {
  dim(Math.min(0.92, overlayT * 1.5));
  const draw = teams && teams.result === 'draw';
  const bw = Math.min(W - 28, 380), L = W / 2 - bw / 2;
  ctx.textAlign = 'center';
  ctx.fillStyle = draw ? '#ccc' : win ? '#ffd24a' : '#ff4a5a';
  ctx.font = `italic 14px ${SERIF}`;
  ctx.fillText(draw ? 'The two universes stay locked together…' : win ? 'Your universe is preserved!' : 'Your universe is being overwritten…', W / 2, 26);
  ctx.font = `${Math.min(48, W / 8)}px ${SERIF_BIG}`;
  ctx.fillText(draw ? 'DRAW' : win ? 'VICTORY' : 'DEFEAT', W / 2, 70);
  ctx.font = `bold 20px ${SERIF}`;
  ctx.fillStyle = TEAM_COLOR.blue; ctx.fillText(`You ${teams.blue.score}`, W / 2 - 70, 100);
  ctx.fillStyle = TEAM_COLOR.red; ctx.fillText(`Red ${teams.red.score}`, W / 2 + 70, 100);
  ctx.fillStyle = '#ccc'; ctx.font = `13px ${SERIF}`;
  ctx.fillText(teams.endedBy === 'base' ? (teams.baseFell === 'red' ? `You destroyed the red base! (+${BASE_BONUS})` : `Red destroyed your base (+${BASE_BONUS} to red)`) : 'Time’s up.', W / 2, 120);

  // the report scrolls
  const top = 132, bottom = H - 62;
  ctx.save(); ctx.beginPath(); ctx.rect(0, top, W, bottom - top); ctx.clip();
  roundRect(L - 6, top, bw + 12, bottom - top, 12); ctx.fillStyle = 'rgba(10,8,30,0.7)'; ctx.fill();
  let y = top + 8 - endScroll;
  const S = teams.stats || newStats(), B = S.blue, R = S.red;
  y = drawScoreTable(y) + 12;
  // land
  y = endHeading('Land', L + 6, bw - 12, y);
  const last = S.land[S.land.length - 1] || [0, teams.blue.cells, teams.red.cells];
  y = endPair('Ground held at the end', Math.round(last[1] / FIELD_CELLS * 100) + '%', Math.round(last[2] / FIELD_CELLS * 100) + '%', L + 6, bw - 12, y);
  y = endPair('Points from land', teams.groundTo === 'blue' ? GROUND_BONUS : 0, teams.groundTo === 'red' ? GROUND_BONUS : 0, L + 6, bw - 12, y);
  if (S.land.length > 1) {
    const g = endLandGraph(S.land, L + 6, bw - 12, y + 12);
    y = g.y;
    ctx.textAlign = 'left'; ctx.fillStyle = '#ccc'; ctx.font = `italic 12px ${SERIF}`;
    ctx.fillText(g.switches ? `The lead in land changed hands ${g.switches} time${g.switches > 1 ? 's' : ''}.` : 'The lead in land never changed hands.', L + 6, y + 4);
    y += 14;
  }
  // sigils and kills
  y = endHeading('Sigils and kills', L + 6, bw - 12, y + 8);
  ctx.textAlign = 'right'; ctx.font = `bold 12px ${SERIF}`; ctx.fillStyle = TEAM_COLOR.blue; ctx.fillText('You', L + bw - 62, y + 10); ctx.fillStyle = TEAM_COLOR.red; ctx.fillText('Red', L + bw - 6, y + 10); y += 14;
  y = endPair('Sigils broken', B.sigils, R.sigils, L + 6, bw - 12, y);
  const K = (S, k) => (S.killed && S.killed[k]) || 0;
  y = endPair('Minions killed (1 each on the tally)', K(B, 'minion'), K(R, 'minion'), L + 6, bw - 12, y);
  y = endPair('Titans killed (5 each)', K(B, 'titan'), K(R, 'titan'), L + 6, bw - 12, y);
  y = endPair('Wizards and heroes killed (10 each)', K(B, 'wizard') + K(B, 'hero'), K(R, 'wizard') + K(R, 'hero'), L + 6, bw - 12, y);
  y = endPair('Kill tally (every 5 = 1 point)', B.tally || 0, R.tally || 0, L + 6, bw - 12, y);
  y = endPair('Turrets destroyed (5 points each)', K(B, 'turret'), K(R, 'turret'), L + 6, bw - 12, y);
  ctx.font = `bold 14px ${SERIF}`;
  y = endPair('Points from kills', B.killPts, R.killPts, L + 6, bw - 12, y);
  // spells
  y = endHeading('Spells cast', L + 6, bw - 12, y + 8);
  ctx.textAlign = 'right'; ctx.font = `bold 12px ${SERIF}`; ctx.fillStyle = TEAM_COLOR.blue; ctx.fillText('You', L + bw - 62, y + 10); ctx.fillStyle = TEAM_COLOR.red; ctx.fillText('Red', L + bw - 6, y + 10); y += 14;
  for (const el of CHARGE_TYPES) {
    drawGlyph(ELEM_GLYPH[el], L + 14, y + 10, 13, TYPE_COLOR[el]);
    ctx.textAlign = 'left'; ctx.fillStyle = TYPE_COLOR[el]; ctx.font = `14px ${SERIF}`; ctx.fillText(ELEM_NAME[el], L + 26, y + 14);
    y = endPair('', B.spells[el] || 0, R.spells[el] || 0, L + 6, bw - 12, y);
  }
  const tot = o => Object.values(o).reduce((a, b) => a + b, 0);
  ctx.font = `bold 14px ${SERIF}`;
  y = endPair('Total', tot(B.spells), tot(R.spells), L + 6, bw - 12, y);
  if (difficulty === 'vhard' && !versus && teams.redUsed) {
    ctx.textAlign = 'left'; ctx.fillStyle = '#ff8ab0'; ctx.font = `italic 12px ${SERIF}`;
    ctx.fillText(`Red’s wizards used ${teams.redUsed.size} different spells.`, L + 6, y + 12); y += 18;
  }
  // resonance
  y = endHeading('Resonance (average)', L + 6, bw - 12, y + 8);
  for (const el of CHARGE_TYPES) {
    const avg = S => S.resN ? Math.round(S.resSum[el] / S.resN * 100) + '%' : '–';
    drawGlyph(ELEM_GLYPH[el], L + 14, y + 10, 13, TYPE_COLOR[el]);
    ctx.textAlign = 'left'; ctx.fillStyle = TYPE_COLOR[el]; ctx.font = `13px ${SERIF}`; ctx.fillText(RES_TEXT[el], L + 26, y + 14);
    y = endPair('', avg(B), avg(R), L + 6, bw - 12, y);
  }
  // builds
  const elemCol = k => TYPE_COLOR[k];
  y = endHeading('Turrets built', L + 6, bw - 12, y + 8);
  y = endShares('You', B.turret, elemCol, L + 6, bw - 12, y);
  y = endShares('Red', R.turret, elemCol, L + 6, bw - 12, y);
  y = endHeading('Titans sent', L + 6, bw - 12, y + 4);
  y = endShares('You', B.titan, elemCol, L + 6, bw - 12, y);
  y = endShares('Red', R.titan, elemCol, L + 6, bw - 12, y);
  y = endKey(CHARGE_TYPES.map(e => [TYPE_COLOR[e], ELEM_NAME[e]]), L + 6, bw - 12, y);
  // minions
  y = endHeading('Minions sent', L + 6, bw - 12, y + 4);
  const kindCol = k => TYPE_COLOR[UNITS[k].elem];
  y = endShares('You', B.minions, kindCol, L + 6, bw - 12, y);
  y = endShares('Red', R.minions, kindCol, L + 6, bw - 12, y);
  y = endKey(MINION_KINDS.map(k => [kindCol(k), `${UNITS[k].name} (${ELEM_NAME[UNITS[k].elem]})`]), L + 6, bw - 12, y);
  ctx.textAlign = 'left'; ctx.fillStyle = '#999'; ctx.font = `italic 12px ${SERIF}`;
  ctx.fillText(`${tot(B.minions)} of yours and ${tot(R.minions)} of red’s took the field.`, L + 6, y + 6);
  y += 20;
  endMax = Math.max(0, y + endScroll - bottom + 8);
  endScroll = clamp(endScroll, 0, endMax);
  ctx.restore();
  if (endScroll < endMax - 4) {
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,210,74,0.85)'; ctx.font = `13px ${SERIF}`;
    ctx.fillText('▼ scroll for the full report', W / 2, bottom - 6 + Math.sin(elapsed * 4) * 2);
  }
  endButton = overlayT > 1 ? { title: 'Continue', color: '#c77dff', x: W / 2 - 90, y: H - 54, w: 180, h: 40 } : null;
  if (endButton) menuButton(endButton);
}

function drawWon() {
  if (mode === 'battle') { drawBattleEnd(true); return; }
  dim(Math.min(0.75, overlayT));
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd24a';
  ctx.font = `bold ${Math.min(40, W / 11)}px "Big Caslon", "Libre Caslon Display", "Libre Caslon Text", Georgia, serif`;
  const y = panelTop * 0.35;
  ctx.fillText('The five guardians have fallen', W / 2, y);
  ctx.font = 'italic 15px "Big Caslon", "Libre Caslon Display", "Libre Caslon Text", Georgia, serif';
  ctx.fillText('Your universe holds… for now.', W / 2, y - 40);
  ctx.fillStyle = '#ddd';
  ctx.font = '16px "Big Caslon", "Libre Caslon Text", Georgia, serif';
  const m = Math.floor(elapsed / 60), s = Math.floor(elapsed % 60).toString().padStart(2, '0');
  ctx.fillText(`Score ${score.toLocaleString()}   ·   Time ${m}:${s}   ·   Foes ${kills}`, W / 2, y + 36);
  if (overlayT > 1) {
    ctx.fillStyle = '#c77dff';
    ctx.font = 'bold 17px "Big Caslon", "Libre Caslon Text", Georgia, serif';
    ctx.fillText('[ tap to keep exploring ]', W / 2, y + 76);
  }
}

// ── loop ─────────────────────────────────────────────────────────────────────
function tick(dt) {
  overlayT += dt;
  for (let i = 0; i < 5; i++) nodePulse[i] = Math.max(0, nodePulse[i] - dt * 4);
  if (shake > 0) shake = Math.max(0, shake - dt * 40);
  if (flash > 0) flash = Math.max(0, flash - dt * 1.5);
  if (castMsg && (castMsg.life -= dt) <= 0) castMsg = null;
  if (banner && (banner.life -= dt) <= 0) banner = null;
  if (net.role === 'guest' && state !== 'title') { guestUpdate(dt); return; }
  if (net.role === 'host' && (state === 'won' || state === 'lost')) {
    net.sendT = (net.sendT || 0) - dt;
    if (net.sendT <= 0) { net.sendT = 1; net.send(makeSnapshot()); netEvents = []; }
  }
  if (state === 'play') update(dt);
  else if (state === 'dead' && mode === 'battle') {
    update(dt); // the battle goes on while you wait
    if (overlayT > 5 && state === 'dead') respawn();
  }
  else if (state === 'reveal') reveal.t += dt;
  else if (state === 'title') elapsed += dt;
}

function render() {
  // start every frame from a clean context, in case a previous frame threw mid-draw
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.setLineDash([]);
  ctx.fillStyle = '#0b0a12';
  ctx.fillRect(0, 0, W, H);
  if (state === 'title') {
    if (!player.face) resetPlayer();
    drawMenuSky();
    drawTitle();
    return;
  }
  drawWorld();
  drawAtmosphere();
  if (flash > 0) { ctx.fillStyle = `rgba(255,246,176,${flash * 0.7})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'play' && timeStop > 0) { ctx.fillStyle = 'rgba(200,200,220,0.28)'; ctx.fillRect(0, 0, W, H); }
  else if (state === 'play' && timeWarp > 0) { ctx.fillStyle = 'rgba(60,120,255,0.13)'; ctx.fillRect(0, 0, W, H); }
  if (state === 'reveal') { drawReveal(); return; }
  drawHUD();
  drawPentagram();
  drawFireButton();   // on top of the pentagram's backdrop
  drawOrderButton();
  drawOrders();
  if (state === 'dead') drawDead();
  if (state === 'won') drawWon();
  if (state === 'lost') drawBattleEnd(false);
}

let last = performance.now();
function loop(now) {
  // schedule first so one bad frame can't stop the game
  requestAnimationFrame(loop);
  if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const v = viewSize();
  if (v.w !== W || v.h !== H) resize();
  try {
    tick(dt);
    render();
  } catch (err) {
    console.error(err);
  }
}
requestAnimationFrame(loop);
</script>
