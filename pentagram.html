<script>
const canvas = document.getElementById('c');
// The canvas only uses a web font once it's loaded, so ask for the Caslons up front.
try { for (const f of ['16px "Libre Caslon Text"', 'bold 16px "Libre Caslon Text"', 'italic 16px "Libre Caslon Text"', '40px "Libre Caslon Display"']) document.fonts.load(f); } catch (_) {}
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;

// Keep swipes inside the game: no page scrolling, pull-to-refresh or bounce.
for (const ev of ['touchstart', 'touchmove']) {
  document.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
}
document.addEventListener('gesturestart', e => e.preventDefault());

// ── sound effects (synthesised, no files) ───────────────────────────────────
const sfx = { ctx: null, out: null, noise: null, on: true, last: {} };
try { sfx.on = localStorage.getItem('pentagram-sound') !== 'off'; } catch (_) {}

function audioInit() {
  if (sfx.ctx) { if (sfx.ctx.state !== 'running') sfx.ctx.resume().catch(() => {}); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    sfx.ctx = new AC();
    sfx.out = sfx.ctx.createGain();
    sfx.out.gain.value = 0.45;
    sfx.out.connect(sfx.ctx.destination);
    const len = sfx.ctx.sampleRate;
    sfx.noise = sfx.ctx.createBuffer(1, len, len);
    const d = sfx.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (_) { sfx.ctx = null; }
}

// skip a sound if the same one played a moment ago (hit spam, poison ticks)
function sfxReady(name, gap) {
  if (!sfx.on || !sfx.ctx || sfx.ctx.state !== 'running') return false;
  const now = sfx.ctx.currentTime;
  if (gap && sfx.last[name] && now - sfx.last[name] < gap) return false;
  sfx.last[name] = now;
  return true;
}

function tone(freq, dur, type, vol, slideTo, delay) {
  const c = sfx.ctx, t = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(sfx.out);
  o.start(t); o.stop(t + dur + 0.05);
}

function hiss(dur, vol, filter, freq, slideTo, delay) {
  const c = sfx.ctx, t = c.currentTime + (delay || 0);
  const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  src.buffer = sfx.noise;
  f.type = filter || 'lowpass';
  f.frequency.setValueAtTime(freq || 1200, t);
  if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(sfx.out);
  src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
}

const EL_NOTE = { S: 880, A: 784, W: 659, F: 587, E: 440 };

const SFX = {
  node(el, n)   { if (sfxReady('node')) tone(EL_NOTE[el] * (1 + n * 0.06), 0.14, 'triangle', 0.22); },
  fizzle()      { if (!sfxReady('fizzle')) return; hiss(0.3, 0.15, 'lowpass', 1500, 200); tone(220, 0.3, 'sawtooth', 0.05, 70); },
  weave(key)    { if (!sfxReady('weave')) return; [...key].forEach((el, i) => tone(EL_NOTE[el], 0.18, 'triangle', 0.14, null, i * 0.045)); },
  loaded()      { if (sfxReady('loaded')) tone(1320, 0.12, 'sine', 0.1, null, 0.05); },
  charge(tier, dur) { if (sfxReady('charge')) { tone(110 + tier * 20, dur, 'sawtooth', 0.05, 330 + tier * 90); hiss(dur, 0.06, 'bandpass', 300, 3000); } },
  release(key) {
    if (!sfxReady('release', 0.04)) return;
    const tier = key.length, el = key[tier - 1];
    if (el === 'F') hiss(0.35, 0.18, 'bandpass', 700, 180);
    else if (el === 'W') { tone(900, 0.25, 'sine', 0.14, 300); hiss(0.2, 0.08, 'highpass', 4000); }
    else if (el === 'E') { tone(120, 0.3, 'sine', 0.3, 50); hiss(0.15, 0.1, 'lowpass', 400); }
    else if (el === 'A') hiss(0.3, 0.2, 'bandpass', 2500, 600);
    else { tone(1200, 0.4, 'sine', 0.1); tone(1800, 0.4, 'sine', 0.06, null, 0.03); }
    if (tier >= 4) boom(0.25 + tier * 0.1);
  },
  lightning()   { if (sfxReady('zap', 0.05)) { hiss(0.12, 0.2, 'highpass', 3000); tone(90, 0.1, 'square', 0.06, 40); } },
  arrow()       { if (sfxReady('arrow')) { hiss(0.08, 0.14, 'highpass', 3000); tone(700, 0.07, 'triangle', 0.08, 350); } },
  hit()         { if (sfxReady('hit', 0.05)) hiss(0.05, 0.1, 'bandpass', 1800); },
  immune()      { if (sfxReady('immune', 0.2)) { tone(1400, 0.12, 'square', 0.05); tone(1900, 0.1, 'square', 0.03, null, 0.02); } },
  kill()        { if (sfxReady('kill', 0.04)) tone(360, 0.18, 'triangle', 0.12, 90); },
  hurt()        { if (sfxReady('hurt', 0.1)) { tone(220, 0.22, 'sawtooth', 0.12, 80); hiss(0.1, 0.1, 'lowpass', 900); } },
  block()       { if (sfxReady('block')) tone(1000, 0.2, 'triangle', 0.12, 1400); },
  heal()        { if (sfxReady('heal')) [523, 659, 784].forEach((f, i) => tone(f, 0.3, 'sine', 0.1, null, i * 0.07)); },
  buff()        { if (sfxReady('buff')) [440, 554, 659, 880].forEach((f, i) => tone(f, 0.25, 'triangle', 0.08, null, i * 0.05)); },
  summon()      { if (sfxReady('summon')) { tone(200, 0.5, 'sawtooth', 0.06, 600); hiss(0.4, 0.08, 'bandpass', 400, 2400); } },
  explode(big)  { if (sfxReady('explode', 0.05)) boom(big ? 1.4 : 0.5); },
  freeze()      { if (sfxReady('freeze')) { hiss(0.9, 0.18, 'highpass', 6000, 2000); [1568, 2093, 2637].forEach((f, i) => tone(f, 0.5, 'sine', 0.05, null, i * 0.06)); } },
  awaken()      { if (sfxReady('awaken', 1)) { tone(55, 1.1, 'sawtooth', 0.14, 45); tone(58, 1.1, 'sawtooth', 0.1, 40); } },
  bossDown()    { if (!sfxReady('bossDown')) return; boom(1.2); [392, 523, 659, 784].forEach((f, i) => tone(f, 0.45, 'triangle', 0.12, null, 0.3 + i * 0.12)); },
  scroll()      { if (sfxReady('scroll')) [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.5, 'sine', 0.1, null, i * 0.08)); },
  eclipse()     { if (sfxReady('eclipse')) [392, 330, 262, 196].forEach((f, i) => tone(f, 0.8, 'sine', 0.08, null, i * 0.14)); },
  unveil()      { if (sfxReady('eclipse')) [523, 784].forEach((f, i) => tone(f, 0.6, 'sine', 0.05, null, i * 0.16)); },
  discover()    { if (sfxReady('discover')) [784, 1175].forEach((f, i) => tone(f, 0.35, 'triangle', 0.1, null, i * 0.1)); },
  splash()      { if (sfxReady('splash')) { hiss(0.5, 0.2, 'lowpass', 2000, 300); tone(300, 0.2, 'sine', 0.06, 150); } },
  death()       { if (sfxReady('death')) [392, 330, 262, 196].forEach((f, i) => tone(f, 0.4, 'triangle', 0.12, null, i * 0.18)); },
};
function boom(dur) { tone(90, dur, 'sine', 0.4, 28); hiss(dur, 0.3, 'lowpass', 900, 60); }

function toggleSound() {
  sfx.on = !sfx.on;
  try { localStorage.setItem('pentagram-sound', sfx.on ? 'on' : 'off'); } catch (_) {}
  audioInit();
  castMessage(sfx.on ? 'Sound on' : 'Sound off', '#ccc');
}

// ── the five elements ──
// Every attack belongs to one of the pentagram's five elements. Lightning is Air,
// poison is Earth, holy light is Spirit. Each element beats the next around the
// cycle Water → Fire → Air → Earth → Spirit → Water: 2.5× damage to the one it
// beats, and the other way round 0.4× (hitting the one that beats it); normal
// against everything else.
const ELEM_OF = { fire: 'fire', water: 'water', earth: 'earth', air: 'air', spirit: 'spirit', lightning: 'air', poison: 'earth', holy: 'spirit' };
const ELEM_CYCLE = ['water', 'fire', 'air', 'earth', 'spirit'];
const ELEM_GLYPH = { spirit: 'S', water: 'W', fire: 'F', earth: 'E', air: 'A' };
const ELEM_NAME = { spirit: 'Spirit', water: 'Water', fire: 'Fire', earth: 'Earth', air: 'Air' };
const ELEM_STRONG = 2.5, ELEM_WEAK = 0.4;
function elemMult(a, d) {
  const i = ELEM_CYCLE.indexOf(a), j = ELEM_CYCLE.indexOf(d);
  if (i < 0 || j < 0) return 1;
  const k = (j - i + 5) % 5;
  return k === 1 ? ELEM_STRONG : k === 4 ? ELEM_WEAK : 1;
}
function elemBeats(e) { return ELEM_CYCLE[(ELEM_CYCLE.indexOf(e) + 1) % 5]; }
function elemWeakTo(e) { const i = ELEM_CYCLE.indexOf(e); return [ELEM_CYCLE[(i + 4) % 5]]; }

// Power scales hard with chain length. Tier name is indexed by combo length.
const TIERS = ['', '', 'Minor', 'Adept', 'Greater', 'Monstrous', 'Omni King', 'Doomsday Destroyer'];

// Weaving an attack spell loads it onto the FIRE button. Weak spells give
// several quick shots; strong ones give fewer and root you while they charge.
const TIER_SHOTS  = [0, 0, 5, 3, 2, 1, 1, 1];
const TIER_WINDUP = [0, 0, 0, 0.25, 0.7, 1.2, 1.6, 2.2]; // seconds standing still per shot
// Complexity: length isn't everything. A chain gets stronger with more
// element types in it, and with a richer repetition pattern (how many
// different repeat counts it uses). 2 Spirit + 3 Air + 1 Water (counts 3,2,1)
// beats 2 + 2 + 2 (counts all the same), and both beat six of one rune.
// The water, earth and spirit lines were re-shaped so that no two lines look alike;
// each spell keeps the complexity (so the power) of the pattern it used to have.
const LINE_WAS = { WA: 'WW', WAE: 'WWA', WAEF: 'WWAW', WAEFW: 'WWAWW', EF: 'EE', EFS: 'EES', EFSE: 'EESE', EFSEE: 'EESEE',
                   SE: 'SS', SEW: 'SSA', SEWA: 'SSAW', SEWAF: 'SSAWS' };
function complexityOf(key) {
  key = LINE_WAS[key] || key;
  const counts = {};
  for (const c of key) counts[c] = (counts[c] || 0) + 1;
  const n = Object.values(counts);
  return key.length + 0.6 * (n.length - 1) + 0.4 * (new Set(n).size - 1);
}
// the Brush Lab, while you're in it (see further down), and the extra power its brush gives a spell
let LAB = null, brushPow = 1;
// extra power on top of what the spell's length already gives it
const potencyOf = key => Math.round(1.2 ** (complexityOf(key) - key.length) * brushPow * 100) / 100;
let potency = 1; // the power multiplier of whatever spell effect is running right now

// ── woven spells: the pattern behind most 3- and 4-rune combos ──
// 1st rune: what it's made of (its element).
// 2nd rune: its shape. Fire → bolt, Earth → wall, Water → pool, Air → burst, Spirit → creature.
// 3rd+ runes: upgrades. Fire: stronger, burns. Water: lasts longer, slows (water
// on water freezes). Earth: bigger, knocks back (a pool ending in Earth is buried
// as a mine). Air: one more shot, shocks. Spirit: confuses, or heals you.
// About 60% of 3-rune and 45% of 4-rune patterns are real; the rest fizzle.
// Hand-made spells keep their combos.
const RUNE_ELEM = { S: 'spirit', W: 'water', F: 'fire', E: 'earth', A: 'air' };
const RUNE_FORM = { F: 'bolt', E: 'wall', W: 'pool', A: 'burst', S: 'creature' };
const BOLT_NAME  = { fire: 'Flame Bolt', water: 'Tide Bolt', earth: 'Boulder', air: 'Spark Bolt', spirit: 'Soul Bolt' };
const WALL_NAME  = { fire: 'Fire Wall', water: 'Ice Wall', earth: 'Rampart', air: 'Wind Wall', spirit: 'Illusion Wall' };
const POOL_NAME  = { fire: 'Burning Ground', water: 'Puddle', earth: 'Quicksand', air: 'Whirlwind', spirit: 'Sacred Circle' };
const MINE_NAME  = { fire: 'Fire Mine', water: 'Frost Mine', earth: 'Stone Mine', air: 'Shock Mine', spirit: 'Hex Mine' };
const BURST_NAME = { fire: 'Fire Nova', water: 'Frost Nova', earth: 'Tremor', air: 'Thunderclap', spirit: 'Blessing' };
// creatures shoot (or bite) on their own; you can have three helpers at a time
const CRITTER = {
  fire:   { name: 'Ember Pup',      hp: 14, spd: 210, range: 40,  dmg: 1.4, cd: 0.8, melee: true },
  water:  { name: 'Bubble Frog',    hp: 16, spd: 150, range: 300, dmg: 0.9, cd: 1.1 },
  earth:  { name: 'Rock Turtle',    hp: 40, spd: 95,  range: 40,  dmg: 1.6, cd: 1.3, melee: true, taunt: true },
  air:    { name: 'Spark Sparrow',  hp: 10, spd: 260, range: 320, dmg: 0.8, cd: 0.6 },
  spirit: { name: 'Lantern Sprite', hp: 12, spd: 170, range: 260, dmg: 0.7, cd: 1.0, heals: true },

const hallOf = id => HALLS.find(h => h.id === id);

// ── the court, the arenas and the standing stones, as you walk about ──
function updateSanctum(dt) {
  // the altars teach their core move
  for (const al of ALTARS) {
    if (ADV.altars.includes(al.e) || Math.hypot(player.x - al.x, player.y - al.y) > 48) continue;
    ADV.altars.push(al.e);
    learnSpell(CORE[al.e], `THE ${ELEM_NAME[al.e].toUpperCase()} ALTAR`);
    if (reveal) reveal.note = ALTAR_NOTE[al.e];
    return;
  }
  for (const e of ZONE_ELEMS) {
    const g = gates[e];
    if (!g || g.t >= 99) continue;
    g.t += dt;
    if (g.settleAt && g.t >= g.settleAt) {
      g.settleAt = 0;
      settleGate(e);
      if (e === 'earth') { const p = zonePt(e, GATE_AT[e]); SFX.explode(true); shake = 16; puff(p.x, p.y, '#c2a57a', 6, 34, 20); }
    }
  }
  // the gale blows you back down its pass unless you're hasted
  const g = galeAt(player.x, player.y);
  if (g) {
    const a = zoneAng('air'), nx = player.x - Math.cos(a) * GALE_PUSH * dt, ny = player.y - Math.sin(a) * GALE_PUSH * dt;
    if (!landBlocks(nx, ny, PLAYER_R)) { player.x = nx; player.y = ny; }
    if (Math.random() < 0.4) particles.push({ x: player.x + rnd(-20, 20), y: player.y + rnd(-20, 20), vx: -Math.cos(a) * 300, vy: -Math.sin(a) * 300, r: 2, life: 0.5, decay: 2, color: '#fffbe0' });
  } else if (!ADV.zones.air.gate) {
    const a = zoneAng('air'), along = player.x * Math.cos(a) + player.y * Math.sin(a);
    if (along >= GALE_TO && Math.abs(-player.x * Math.sin(a) + player.y * Math.cos(a)) < CANYON + 40) openGate('air');
  }
  // the rune a fallen titan leaves
  for (const o of orbs) {
    o.t += dt;
    if (o.t > 0.6 && Math.hypot(player.x - o.x, player.y - o.y) < 40) {
      o.taken = true;
      learnSpell(o.key, o.title);
      if (arena && arena.phase === 'orb') { arena.phase = 'learned'; arena.t = 0; }
    }
  }
  orbs = orbs.filter(o => !o.taken);
  updateArena(dt);
  // the standing stones, and the way home beside each
  for (const e of ZONE_ELEMS) {
    const Z = ADV.zones[e];
    if (Z.stage < 3) continue;
    const m = zonePt(e, MONUMENT_AT), pt = zonePt(e, MONUMENT_AT + 105);
    const dm = Math.hypot(player.x - m.x, player.y - m.y);
    if (dm < 70 && !Z.loreShown) {
      Z.loreShown = true;
      const first = !Z.done;
      Z.done = true;
      ADV.check = zonePt(e, MONUMENT_AT - 120);
      advSave();
      showLore(e, first);
      return;
    }
    if (dm > 160) Z.loreShown = false;
    if (Math.hypot(player.x - pt.x, player.y - pt.y) < 34) {
      player.x = 0; player.y = 150;
      ADV.check = { x: 0, y: 150 }; advSave();
      flash = 0.6; SFX.scroll();
      showBanner('Back in the Sanctum', worldOpen() ? 'The World Gate stands open, below the court' : `${ZONE_ELEMS.filter(z => ADV.zones[z].done).length} of 5 elements mastered`, 3);
    }
  }
  // the world gate, once all five are mastered
  if (worldOpen() && segWalls.includes(WORLD_WALL)) {
    segWalls = segWalls.filter(w => w !== WORLD_WALL);
    afterPlay(1200, () => showBanner('The World Gate has opened!', 'It’s below the court. The wide world awaits', 4));
  }
  // things to pick up
  for (const p of pickups) {
    p.t -= dt;
    if (Math.hypot(player.x - p.x, player.y - p.y) < 30) {
      p.t = 0;
      if (p.kind === 'hp') healPlayer(4); else { player.mana = Math.min(player.maxMana, player.mana + 6); floatText(player.x, player.y - 30, '+6 mana', '#6af', 15); }
    }
  }
  pickups = pickups.filter(p => p.t > 0);
  updateCoins(dt);
}

}
function floatText(x, y, text, color, size) {

}
function burst(x, y, color, n, spd) {

// ── targeting & damage ───────────────────────────────────────────────────────
function nearestFoe(x, y, range, exclude) {
  let best = null, bd = range;
  for (const f of foes) {
    if (f.dead || f.sub || (exclude && exclude.has(f))) continue;
    const d = Math.hypot(f.x - x, f.y - y) - f.r;
    if (d < bd) { bd = d; best = f; }
  }
  return best;
}

function aimFrom(src, range) {
  const t = nearestFoe(src.x, src.y, range || 600);
  if (t) {
    const dx = t.x - src.x, dy = t.y - src.y, d = Math.hypot(dx, dy) || 1;
    return { x: dx / d, y: dy / d, t };
  }
  const q = src === player && mode === 'adventure' && WLD ? questNear(src.x, src.y, Math.min(range || 600, 330)) : null;
  if (q) { const dx = q.at.x - src.x, dy = q.at.y - src.y, d = Math.hypot(dx, dy) || 1; return { x: dx / d, y: dy / d, t: null }; }

}

const CHARGE_TYPES = ['spirit', 'water', 'fire', 'earth', 'air']; // pentagram order

// ── the eclipse clock ──
// Five rings, one per element, each turning at its own steady pace. When an
// element's mark reaches 12 o'clock that element is eclipsed: for 30 seconds
// it doesn't work at all (spells made of it can't be cast; minions, turrets,
// titans and wizards of that element stop fighting). Rings can line up, so
// eclipses can overlap. Most matches see one or two; some see more, and now
// and then a whole match is an eclipse season.
const ECLIPSE_LEN = 30, ECLIPSE_WARN = 8;
let eclipseSeen = {}; // what's been announced, per ring
function planEclipses() {
  const season = Math.random() < 0.07;
  const want = season ? 7 + Math.floor(Math.random() * 3) : pickW([[1, 40], [2, 35], [3, 15], [4, 10]]);
  const lo = 20, hi = MATCH_TIME - 20;
  let best = null, bestErr = 1e9;
  for (let n = 0; n < 5000; n++) {
    const rings = CHARGE_TYPES.map(() => { const per = season ? rnd(90, 200) : rnd(160, 1000); return { per: Math.round(per * 10) / 10, off: Math.round(rnd(0, per) * 10) / 10 }; });
    let total = 0, ok = true;
    for (const r of rings) for (let t = r.off; t <= MATCH_TIME; t += r.per) { if (t < lo || t > hi) ok = false; total++; }
    const err = Math.abs(total - want) + (ok ? 0 : 100);
    if (err < bestErr) { best = rings; bestErr = err; }
    if (!err) break;
  }
  return best;
}
const eclipseT = () => MATCH_TIME - teams.time;
// how far round its ring an element's mark is (0 = 12 o'clock)
function ringAngle(i, t) { const r = teams.eclipse[i]; return (((t - r.off) / r.per) % 1 + 1) % 1 * TAU; }
// seconds left in an element's eclipse (0 if it isn't eclipsed)
function eclipseLeft(i, t) {
  const r = teams.eclipse[i];
  if (t < r.off) return 0;
  const since = (t - r.off) % r.per;
  return since < ECLIPSE_LEN ? ECLIPSE_LEN - since : 0;
}
// seconds until an element's mark next reaches 12 o'clock
function eclipseIn(i, t) { const r = teams.eclipse[i]; return t < r.off ? r.off - t : r.per - (t - r.off) % r.per; }
// 0 while an element is eclipsed, otherwise 1
function eclipseMult(elem) {
  if (mode !== 'battle' || !teams || !teams.eclipse) return 1;
  const i = CHARGE_TYPES.indexOf(elem);
  return i < 0 || !eclipseLeft(i, eclipseT()) ? 1 : 0;
}
// a spell made of an eclipsed element can't be cast
function eclipseBlocked(key) {
  const el = RUNE_ELEM[key[0]];
  if (eclipseMult(el) > 0) return false;
  castMessage(`${ELEM_NAME[el]} is eclipsed · ${Math.ceil(eclipseLeft(CHARGE_TYPES.indexOf(el), eclipseT()))}s`, '#9aa0c0');
  SFX.fizzle();
  return true;
}

function damageFoe(f, dmg, rawType, fromHelper) {
  if (f.dead) return;
  if (f.gate) return gateHit(f, rawType);
  if (f.sub) return 0;
  if ((f.world || f.rival) && !f.awake && mode === 'adventure') f.world ? wakeTitan(f) : wakeRival(f);
  // an eclipsed element does nothing
  if (!eclipseMult(ELEM_OF[rawType] || rawType)) {
    if ((f.txtCd || 0) <= 0) { floatText(f.x, f.y - (f.r || 14) - 10, 'eclipsed', '#8a8aa0', 12); f.txtCd = 0.6; }
    return 0;
  }
  dmg *= potency;
  const by = dmgBy || curSide;
  if (f.proxyOf) { const h = heroOf(f), d = dmg * (player.empower > 0 && !fromHelper ? 2 : 1); if (h) { h.lastHitBy = by; hurtPlayer(d, h); } return d; }
  if (f.helper) { f.helper.hp -= dmg; burst(f.x, f.y, '#ccc', 4, 100); if (f.helper.hp <= 0) f.helper.life = 0; return dmg; }
  const type = ELEM_OF[rawType] || rawType; // lightning → air, poison → earth, holy → spirit
  if (f.unit && shielded(f)) {
    if (f.txtCd <= 0) { floatText(f.x, f.y - f.r - 10, shieldText(f), '#bde', 13); f.txtCd = 0.8; }
    SFX.immune();
    return;
  }
  let mult = 1;
  if (f.boss) {
    if (!f.def.weak.includes(type) && type !== 'prism' && type !== 'mirror') {
      SFX.immune();
      if (f.txtCd <= 0) { floatText(f.x, f.y - f.r - 10, 'IMMUNE', '#999', 15); f.txtCd = 0.6; }
      ring(f.x, f.y, f.r + 6, 'rgba(200,200,200,0.6)', 0.2);
      return;
    }
  } else if (f.adv) {
    if (f.sanctT > 0) { if (f.txtCd <= 0) { floatText(f.x, f.y - f.r - 14, 'Sanctuary', TYPE_COLOR.holy, 14); f.txtCd = 0.5; } SFX.immune(); return 0; }
    if (f.wardN > 0) { f.wardN--; floatText(f.x, f.y - f.r - 14, `blocked · ${f.wardN} left`, TYPE_COLOR.spirit, 13); ring(f.x, f.y, f.r + 12, TYPE_COLOR.spirit, 0.25); SFX.block(); return 0; }
    mult = type === 'prism' ? 1.5 : elemMult(type, f.elem);
    if (f.skinT > 0) mult *= 0.5;

    mult = f.def.mult[type] ?? (type === 'prism' ? 1.5 : 1);
  }
  if (f.hex > 0 || f.stone > 0) mult *= 1.5;

  floatText(f.x + rnd(-8, 8), f.y - f.r - 6, fmt(d) + (weak && !f.boss ? '!' : ''),
            weak ? '#ffe14a' : mult < 0.99 ? '#aaa' : '#fff', weak ? 17 : 13);

}

// Points: a beast's base worth grows as later, tougher versions spawn.

// Hunting bonuses: every 10 of one kind pays out, and 10 of every kind pays big.
const FOE_NAMES = { slime: 'Slimes', bat: 'Bats', skeleton: 'Skeletons', ember: 'Embers', shade: 'Shades' };
function huntBonus(f) {

function killFoe(f) {

function knock(f, fromX, fromY, force) {
  if (f.structure) return;
  const dx = f.x - fromX, dy = f.y - fromY, d = Math.hypot(dx, dy) || 1;
  const k = f.knockK ?? (f.boss || f.titan ? 0.15 : 1);

}

function aoe(x, y, rad, dmg, type, push) {

      if (push) knock(f, x, y, push);
    }
  }
  ring(x, y, rad, TYPE_COLOR[type], 0.4);
  react(type, x, y, rad);
}

function hurtPlayer(d, p = player) {
  if (p.isMage) return; // a computer wizard's caster: its wizard takes the hits
  if ((p === hostP ? state !== 'play' : p.dead) || p.invuln > 0 || p.omni > 0 || p.sanct > 0) return;
  if (p.ward > 0) {
    p.ward--;
    SFX.block();
    p.invuln = 0.3;
    ring(p.x, p.y, 30, TYPE_COLOR.spirit, 0.3);
    floatText(p.x, p.y - 30, 'blocked', TYPE_COLOR.spirit, 14);

  if (p.skin > 0) d *= 0.5;

  burst(p.x, p.y, '#f44', 8, 180);

}

function shoot(o) { launch(player.x, player.y, aimFrom(player), o); }

function chainLightning(dmg, jumps) {

  SFX.lightning();
  const pts = [{ x: player.x, y: player.y }];
  const hit = new Set();
  for (let i = 0; i < jumps && cur; i++) {

    pts.push({ x: cur.x, y: cur.y });
    damageFoe(cur, dmg * 0.7 ** i, 'lightning'); // each jump spreads it thinner

    cur = nearestFoe(cur.x, cur.y, 230, hit);

function targetPoint(range, ahead) {

  if (q) return { x: q.at.x, y: q.at.y };

// 7-element finale (after its long charge): everything nearby is erased and every

// Crown of All: while it lasts you can't be hurt, and every arrow you fire is a
// prism bolt that counts as every element (so it can hurt any guardian).
const OMNI_TYPES = ['fire', 'water', 'earth', 'air', 'lightning', 'poison', 'spirit', 'holy'];

function aimAngle() { const a = aimFrom(player, 400); return Math.atan2(a.y, a.x); }

// Crowd control. Guardians shrug off fear, confusion and hex, and take the rest for less time.
const CC_LABEL = { stun: 'STUNNED', root: 'ROOTED', fear: 'FLEES', confuse: 'CONFUSED', hex: 'HEXED', stone: 'STONE', freeze: 'FROZEN' };
function applyCC(f, kind, dur) {
  if (f.dead || f.structure || f.sub) return;
  if (f.boss || f.titan) {
    if (kind === 'fear' || kind === 'confuse' || kind === 'hex') {
      if (f.txtCd <= 0) { floatText(f.x, f.y - f.r - 10, 'RESISTS', '#999', 14); f.txtCd = 0.6; }
      return;
    }
    dur *= 0.4;
  }
  if (!(f[kind] > 0)) floatText(f.x, f.y - f.r - 18, CC_LABEL[kind], '#e0d0ff', 12);
  f[kind] = Math.max(f[kind] || 0, dur);
  if (kind === 'confuse') f.wander = rnd(0, TAU);
  if (kind === 'fear') f.fearFrom = { x: player.x, y: player.y }; // it runs from whoever scared it
}
function areaCC(x, y, r, kind, dur, color) {
  for (const f of foes) if (!f.dead && Math.hypot(f.x - x, f.y - y) < r + f.r) applyCC(f, kind, dur);
  ring(x, y, r, color, 0.6);
  burst(x, y, color, 30, 300);
}

function quake() {
  shake = Math.max(shake, 10);
  for (const f of foes) {
    if (f.dead || Math.hypot(f.x - player.x, f.y - player.y) > 220 + f.r) continue;
    damageFoe(f, 1.5, 'earth');
    applyCC(f, 'stun', 1.6);
  }
  for (let i = 0; i < 3; i++) ring(player.x, player.y, 80 + i * 70, TYPE_COLOR.earth, 0.4 + i * 0.15);
  burst(player.x, player.y, TYPE_COLOR.earth, 40, 320);
}

// Fan-shaped blast in front of the caster.
function cone(x, y, ang, range, half, dmg, type, effect) {
  for (const f of foes) {
    if (f.dead) continue;
    const dx = f.x - x, dy = f.y - y, d = Math.hypot(dx, dy);
    if (d > range + f.r) continue;
    let da = Math.atan2(dy, dx) - ang;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    if (Math.abs(da) > half + f.r / Math.max(d, 1)) continue;
    damageFoe(f, dmg, type);
    if (effect === 'burn') setBurn(f, 3, true);
  }
  if (type === 'fire') {
    fx.push({ kind: 'flamewave', x, y, ang, range, half, life: 0.45, max: 0.45 });
    for (let i = 0; i < 3; i++) { const d = range * (0.4 + i * 0.25); puff(x + Math.cos(ang) * d, y + Math.sin(ang) * d, '#8a7a70', 1, 18, 30); }
  } else fx.push({ kind: 'cone', x, y, ang, range, half, color: TYPE_COLOR[type], life: 0.35, max: 0.35 });
  react(type, x + Math.cos(ang) * range * 0.6, y + Math.sin(ang) * range * 0.6, range * 0.5);
}

function layTrap() {
  if (traps.length >= 6) traps.shift();
  traps.push({ x: player.x, y: player.y + 6, arm: 0.6, life: 40 });
  castMessage('Trap set', TYPE_COLOR.fire);
}

// Jump a short way in the direction you're facing, never into water or walls.
function blink() {
  if (player.onBoat) { castMessage('Can’t blink from a boat', '#bbb'); return; }
  const fx0 = player.x, fy0 = player.y;
  if (mode !== 'battle') {
    // a short jump along the ground: it stops at anything you couldn't walk through
    let to = null;
    for (let d = 10; d <= 170; d += 10) {
      const x = player.x + player.face.x * d, y = player.y + player.face.y * d;
      if (player === hostP && galeAt(x, y)) { galeThrow(); return; }
      if (blockedForFoot(x, y, PLAYER_R)) break;
      to = { x, y };
    }
    if (player === hostP && galeAt(fx0, fy0)) { galeThrow(); return; }
    if (to) { player.x = to.x; player.y = to.y; }
  } else for (let d = 170; d >= 30; d -= 10) {
    const x = clamp(player.x + player.face.x * d, -WORLD, WORLD), y = clamp(player.y + player.face.y * d, -boundY(), boundY());
    if (blockedForFoot(x, y, PLAYER_R)) continue;
    player.x = x; player.y = y;
    break;
  }
  player.invuln = Math.max(player.invuln, 0.25);
  burst(fx0, fy0, TYPE_COLOR.spirit, 18, 200);
  burst(player.x, player.y, TYPE_COLOR.air, 18, 200);
}

// A short wall of boulders between you and the nearest enemy. Blocks enemies and their shots.
function stoneWall() {
  const a = aimFrom(player, 500);
  const cx = player.x + a.x * 70, cy = player.y + a.y * 70;
  const px = -a.y, py = a.x;
  for (let i = -3; i <= 3; i++) {
    const x = cx + px * i * 26, y = cy + py * i * 26;
    if (isWater(x, y) || noGround(x, y)) continue;
    tempSolids.push({ x, y, r: 16, life: 9, kind: 'boulder', side: curSide, born: elapsed + (i + 3) * 0.04 });
    puff(x, y + 8, '#c2a57a', 1, 14, 10);
  }
  shake = Math.max(shake, 5);
}

// The dragon breathes a long cone of fire where you aim. Only when you press FIRE.
function dragonBreath() {
  const d = allies.find(a => a.kind === 'dragon');
  const src = d || player;
  const a = aimFrom(src, 500);
  cone(src.x, src.y, Math.atan2(a.y, a.x), 300, 0.45, 8, 'fire', 'burn');
  shake = Math.max(shake, 8);
  SFX.explode(false);
}

function updateStorms(dt) {
  for (const s of storms) {
    potency = s.pot || 1;
    s.t -= dt;
    if (s.t > 0) continue;
    s.t = 0.2;
    s.left--;
    // a storm spreads out: it strikes each foe at most once
    const struck = s.struck || (s.struck = new Set());
    const near = foes.filter(f => !f.dead && !struck.has(f) && Math.hypot(f.x - player.x, f.y - player.y) < 480);
    if (!near.length) continue;
    const f = near[Math.floor(Math.random() * near.length)];
    struck.add(f);
    damageFoe(f, 4, 'lightning');
    react('air', f.x, f.y, 40);
    SFX.lightning();
    fx.push({ kind: 'bolt', pts: [{ x: f.x + rnd(-40, 40), y: f.y - 420 }, { x: f.x, y: f.y }], life: 0.25, max: 0.25 });
    burst(f.x, f.y, TYPE_COLOR.lightning, 10, 220);
    shake = Math.max(shake, 4);
  }
  storms = storms.filter(s => s.left > 0);
}

// Helpers never attack on their own: the wisp heals, the imp and guardian draw
// enemies away from you, and the dragon only breathes when you press FIRE.
const ALLY_LIFE = { wisp: 15, imp: 8, golem: 20, dragon: 30 };
const ALLY_R = { wisp: 9, imp: 10, golem: 18, dragon: 26 };
const ALLY_HP = { imp: 10, golem: 40 };
// ── spell flair: trails, impacts, sigils and finishes ──
// Every cast draws a sigil under the caster made of that spell's own runes,
// in order, so no two spells look the same as they go off.
function castSigil(key, x, y, small) {
  fx.push({ kind: 'sigil', key, x, y: y + 10, rot: rnd(0, TAU), life: small ? 0.45 : 1, max: small ? 0.45 : 1, small: !!small });
}
// jagged cracks running out across the ground
function crackLines(x, y, r, n) {
  const lines = [];
  for (let i = 0; i < n; i++) {
    let a = i * TAU / n + rnd(-0.3, 0.3), px = x, py = y;
    const pts = [{ x: px, y: py }];
    for (let k = 0; k < 5; k++) { a += rnd(-0.5, 0.5); px += Math.cos(a) * r / 5; py += Math.sin(a) * r / 5; pts.push({ x: px, y: py }); }
    lines.push(pts);
  }
  return { x, y, lines };
}
// a shape-particle: 'star', 'plus', 'shard' or 'drop'
function shapeBits(x, y, shape, color, n, spd, up, size) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), v = rnd(spd * 0.3, spd);
    particles.push({ shape, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (up || 0), r: rnd(2.5, 4) * (size || 1), life: 1, decay: rnd(1, 1.8),
                     color, rot: rnd(0, TAU), spin: rnd(-8, 8) });
  }
}
// what each kind of shot leaves behind in the air
function shotTrailFx(s, dt) {
  const k = dt * 60, r = Math.random;
  const back = (spd, col, rad, life, extra) => {
    const sp = Math.hypot(s.vx, s.vy) || 1;
    particles.push(Object.assign({ x: s.x - s.vx / sp * s.r, y: s.y - s.vy / sp * s.r, vx: -s.vx / sp * spd + rnd(-20, 20), vy: -s.vy / sp * spd + rnd(-20, 20),
                                   r: rad, life, decay: 2.4, color: col }, extra || {}));
  };
  switch (s.look) {
    case 'firebolt': if (r() < 0.7 * k) back(60, r() < 0.5 ? '#ffb04a' : '#ff5a2a', rnd(2, 3.5), 0.8); break;
    case 'frost':    if (r() < 0.5 * k) back(30, '#e8f8ff', 2, 0.7, { shape: 'star', rot: 0, spin: 6 }); break;
    case 'spike':    if (r() < 0.25 * k) back(20, '#b59a72', 6, 0.6, { puff: true, decay: 2 }); break;
    case 'venom':    if (r() < 0.5 * k) particles.push({ shape: 'drop', x: s.x, y: s.y, vx: 0, vy: 70, r: 2.5, life: 0.7, decay: 2, color: '#7dff4a', rot: 0, spin: 0 }); break;
    case 'siphon':   if (r() < 0.6 * k) back(40, r() < 0.5 ? '#e6ccff' : '#c77dff', 2.2, 0.9); break;
    case 'fireball': if (r() < 0.6 * k) back(30, '#8a7a70', 9, 0.8, { puff: true, decay: 1.6 }); if (r() < 0.8 * k) back(80, '#ffd24a', 2.5, 0.7); break;
    case 'lance':    if (r() < 0.9 * k) back(0, '#fff6ff', 2, 0.35); break;
    case 'icelance': if (r() < 0.5 * k) back(10, '#e8f6ff', 7, 0.5, { puff: true, decay: 2.2 }); break;
    case 'hex':      if (r() < 0.5 * k) back(30, '#b070ff', 2, 0.8, { shape: 'star', rot: 0, spin: 4 }); break;
    case 'woven': {
      if (!s.spec || s.ally) break;
      // the infusion shows in the trail
      const inf = s.spec.infuse || s.spec.key[2];
      if (r() > 0.5 * k) break;
      if (inf === 'F') back(50, '#ffb04a', 2.4, 0.7);
      else if (inf === 'W') particles.push({ shape: 'drop', x: s.x, y: s.y, vx: 0, vy: 60, r: 2.2, life: 0.6, decay: 2, color: '#9fd8ff', rot: 0, spin: 0 });
      else if (inf === 'E') back(20, '#b59a72', 5, 0.5, { puff: true, decay: 2.2 });
      else if (inf === 'A') back(80, '#fff6a0', 1.6, 0.4, { shape: 'shard', rot: rnd(0, TAU), spin: 0 });
      else back(30, '#e6ccff', 2, 0.8, { shape: 'star', rot: 0, spin: 5 });
      break;
    }
  }
}
// what each kind of shot does as it hits (looks, and a few small twists)
function shotImpact(s, f) {
  switch (s.look) {
    case 'firebolt': puff(s.x, s.y, '#ffb04a', 1, 12, 20); burst(s.x, s.y, '#ff8a3a', 8, 160); break;
    case 'frost':
      // shatters: little shards nick whoever's close
      shapeBits(s.x, s.y, 'shard', '#dff4ff', 6, 220, 0, 1.2);
      ring(s.x, s.y, 26, '#cfefff', 0.3);
      for (const o of foes) if (o !== f && !o.dead && Math.hypot(o.x - s.x, o.y - s.y) < 55 + o.r) { damageFoe(o, s.dmg * 0.4, 'water'); o.slow = Math.max(o.slow || 0, 1.5); }
      break;
    case 'spike':
      // a heavy rock: it shoves
      if (!f.structure) knock(f, s.x - s.vx * 0.05, s.y - s.vy * 0.05, 170);
      puff(s.x, s.y, '#c2a57a', 2, 12, 10); shapeBits(s.x, s.y, 'shard', '#8a6a44', 5, 180, 40);
      break;
    case 'venom': {
      // the poison splashes onto one more foe nearby
      shapeBits(s.x, s.y, 'drop', '#7dff4a', 7, 160, 30);
      const o = nearestFoe(s.x, s.y, 110, new Set([f]));
      if (o) { setPoison(o, 2, 0.5); fx.push({ kind: 'streak', x1: s.x, y1: s.y, x2: o.x, y2: o.y, color: '#7dff4a', life: 0.3, max: 0.3 }); }
      break;
    }
    case 'siphon':
      // a stream of light flows back to the caster
      for (let i = 0; i < 10; i++) {
        const dx = player.x - s.x, dy = player.y - s.y, d = Math.hypot(dx, dy) || 1;
        particles.push({ x: s.x + rnd(-8, 8), y: s.y + rnd(-8, 8), vx: dx / d * rnd(250, 420), vy: dy / d * rnd(250, 420), r: 2.5, life: 0.9, decay: 1.6, color: '#e6ccff', home: true });
      }
      break;
    case 'fireball':
      fx.push({ kind: 'nova', elem: 'fire', x: s.x, y: s.y, r: s.boomR || 100, life: 0.5, max: 0.5 });
      puff(s.x, s.y, '#8a7a70', 4, 22, 40); puff(s.x, s.y, '#ffb04a', 2, 26, 20);
      burst(s.x, s.y, '#ffd24a', 18, 320);
      break;
    case 'lance':
      fx.push({ kind: 'rays', x: s.x, y: s.y, r: 40, color: '#fff6ff', life: 0.3, max: 0.3, rot: rnd(0, TAU) });
      break;
    case 'icelance':
      shapeBits(s.x, s.y, 'shard', '#e8f8ff', 8, 200, 0, 1.4);
      puff(s.x, s.y, '#e8f6ff', 2, 14, 6);
      break;
    case 'hex':
      puff(s.x, s.y, '#b070ff', 2, 16, 20); shapeBits(s.x, s.y, 'star', '#e6ccff', 6, 120, 30);
      break;
    case 'prism': case 'mirror':
      shapeBits(s.x, s.y, 'shard', ['#ff5a2a', '#ffd24a', '#7dff4a', '#3ab0ff', '#c77dff'][Math.floor(Math.random() * 5)], 6, 200);
      break;
    default:
      if (s.look !== 'woven') burst(s.x, s.y, s.color, 6, 150);
  }
}

// a woven bolt's finish on a hit
function wovenFinishHit(s, f) {
  const sp = s.spec;
  if (!sp || !sp.finish || s.ally || s.shard) return;
  const col = TYPE_COLOR[sp.elem];
  switch (sp.finish) {
    case 'F': // Bursting: a small blast
      wovenBurstAt(s.x, s.y, 60 * sp.size, 1.2 * sp.power, sp);
      puff(s.x, s.y, '#ffb04a', 2, 16, 20);
      break;
    case 'W': // Splashing: leaves a little pool of its element
      zones.push({ type: 'woven', x: s.x, y: s.y, r: 48 * sp.size, life: 2.5, max: 2.5, tick: 0, spec: sp, charged: 0 });
      shapeBits(s.x, s.y, 'drop', col, 8, 160, 40);
      break;
    case 'E': { // Shattering: splits into shards that fly on
      const a = Math.atan2(s.vy, s.vx);
      for (const da of [-0.5, 0, 0.5]) {
        launch(s.x, s.y, { x: Math.cos(a + da), y: Math.sin(a + da) }, { dmg: 0.7 * sp.power, type: sp.elem, speed: 420, r: 4, fx: 'woven', spec: sp, life: 0.5, look: 'woven' });
        shots[shots.length - 1].shard = true; shots[shots.length - 1].hit = new Set([f]);
      }
      shapeBits(s.x, s.y, 'shard', col, 6, 200);
      break;
    }
    case 'A': { // Chaining: a spark jumps to one more foe
      const o = nearestFoe(s.x, s.y, 170, new Set([f]));
      if (o) {
        damageFoe(o, 1.2 * sp.power, 'lightning'); applyWovenFx(o, sp, 0, s);
        fx.push({ kind: 'bolt', pts: [{ x: s.x, y: s.y }, { x: o.x, y: o.y }], life: 0.25, max: 0.25, color: '#fff6a0' });
      }
      break;
    }
    case 'S': // Seeking: (it already curved in) a puff of light
      fx.push({ kind: 'rays', x: s.x, y: s.y, r: 30, color: col, life: 0.3, max: 0.3, rot: rnd(0, TAU) });
      break;
  }
}

// ── woven spells in action ──
function solidTemps() { return tempSolids.filter(b => b.solid !== false); }

// Spread attacks (novas, waves, storms, blasts, pools: anything that hits
// everything in an area) hit each enemy for about half of what a direct attack
// of the same spell length does to its one target. Direct attacks stay the way
// to hurt one tough target; spread ones are for crowds. SPREAD is that share,
// and also the rate at which spread attacks set burns and poison going.
const SPREAD = 0.5, DOT_DPS = 0.8;
function setBurn(f, secs, spread) {
  const dps = spread ? DOT_DPS * SPREAD : DOT_DPS;
  f.burnDps = f.burn > 0 ? Math.max(f.burnDps || DOT_DPS, dps) : dps;
  f.burn = Math.max(f.burn || 0, secs);
  f.burnBy = dmgBy || curSide;
}
function setPoison(f, secs, dps) {
  f.poisonDps = f.poison > 0 ? Math.max(f.poisonDps || 0, dps) : dps;
  f.poison = Math.max(f.poison || 0, secs);
  f.poisonBy = dmgBy || curSide;
}
function applyWovenFx(f, sp, dealt, src, inPool, spreadHit) {
  if (!f || f.dead) return;
  const fx = sp.fx, spread = inPool || spreadHit;
  if (fx.has('burn')) setBurn(f, 2.5 * sp.dur, spread);
  if (fx.has('slow')) f.slow = Math.max(f.slow || 0, 2.5 * sp.dur);
  if (fx.has('freeze') && !inPool) applyCC(f, 'freeze', 1.4 * sp.dur);
  if (fx.has('knock')) { if (inPool) applyCC(f, 'root', 0.6); else if (src) knock(f, src.x, src.y, 220 * sp.size); }
  if (fx.has('shock')) applyCC(f, 'stun', 0.35);
  if (fx.has('confuse')) applyCC(f, 'confuse', 2.5 * sp.dur);
  if (fx.has('poison')) setPoison(f, 3, spread ? DOT_DPS * SPREAD : DOT_DPS);
  if (fx.has('drain') && dealt) healPlayer(dealt * 0.35 / potency); // dealt already carries the power
}

// Elements react: lightning electrifies water, fire ignites poison, water steams out fire.
function react(type, x, y, r) {
  const el = ELEM_OF[type] || type;
  for (const z of zones) {
    if (z.life <= 0 || Math.hypot(z.x - x, z.y - y) > z.r + r) continue;
    const zEl = z.spec ? z.spec.elem : z.type === 'fire' ? 'fire' : z.type === 'spring' ? 'water' : !z.type ? 'poison' : null;
    const poison = !z.type || (z.spec && z.spec.fx.has('poison'));
    if (el === 'air' && zEl === 'water' && !(z.charged > 0)) {
      z.charged = 4;
      floatText(z.x, z.y - z.r - 8, 'ELECTRIFIED!', TYPE_COLOR.lightning, 15);
      SFX.lightning();
    } else if (el === 'fire' && poison) {
      z.life = 0;
      floatText(z.x, z.y - z.r - 8, 'IGNITED!', TYPE_COLOR.fire, 16);
      aoe(z.x, z.y, z.r + 30, 3, 'fire', 220);
      burst(z.x, z.y, '#ff8a3a', 40, 380);
      SFX.explode(false);
      shake = Math.max(shake, 8);
    } else if (el === 'water' && zEl === 'fire') {
      z.life = 0;
      floatText(z.x, z.y - z.r - 8, 'STEAM!', '#ddd', 15);
      areaCC(z.x, z.y, z.r + 20, 'confuse', 2.5, 'rgba(230,230,230,0.8)');
    }
  }
  if (mode === 'adventure') reactHazards(el, x, y, r);
}

function wovenBurstAt(x, y, rad, dmg, sp) {
  for (const f of foes) {
    if (f.dead || Math.hypot(f.x - x, f.y - y) > rad + f.r) continue;
    const dealt = damageFoe(f, dmg, sp.elem);
    applyWovenFx(f, sp, dealt, { x, y }, false, true);
  }
  ring(x, y, rad, TYPE_COLOR[sp.elem], 0.45);
  fx.push({ kind: 'nova', elem: sp.elem, x, y, r: rad, life: 0.5, max: 0.5 });
  elemHit(sp.elem, x, y, 1.6 * sp.size);
  react(sp.elem, x, y, rad);
}

function castWoven(sp) {
  const col = TYPE_COLOR[sp.elem];
  if (sp.form === 'bolt') {
    const a = aimFrom(player), base = Math.atan2(a.y, a.x);
    for (let i = 0; i < sp.count; i++) {
      const ang = base + (i - (sp.count - 1) / 2) * 0.16;
      launch(player.x, player.y, { x: Math.cos(ang), y: Math.sin(ang) },
             { dmg: 2.4 * sp.power, type: sp.elem, speed: 540, r: 6 + 2 * sp.size, pierce: sp.pierce, fx: 'woven', spec: sp });
    }
  } else if (sp.form === 'burst') {
    if (sp.elem === 'spirit') {
      // Blessing: heal, plus a buff for each upgrade
      healPlayer(3 * sp.power);
      const t = 6 * sp.dur;
      if (sp.key.includes('F', 2)) player.empower = Math.max(player.empower, t);
      if (sp.key.includes('W', 2)) player.regen = Math.max(player.regen, t);
      if (sp.key.includes('E', 2)) player.skin = Math.max(player.skin, t);
      if (sp.key.includes('A', 2)) player.haste = Math.max(player.haste, t);
      if (sp.key.includes('S', 2)) player.ward = Math.max(player.ward, 2);
      // the finish adds one more gift
      if (sp.finish === 'F') wovenBurstAt(player.x, player.y, 110, 1.2 * sp.power, { ...sp, elem: 'fire', fx: new Set(['burn']) });
      else if (sp.finish === 'W') healPlayer(2);
      else if (sp.finish === 'E') for (const f of foes) { if (!f.dead && !f.structure && Math.hypot(f.x - player.x, f.y - player.y) < 140) knock(f, player.x, player.y, 260); }
      else if (sp.finish === 'A') player.haste = Math.max(player.haste, 3) + 2;
      else if (sp.finish === 'S') player.ward = (player.ward || 0) + 1;
      fx.push({ kind: 'rays', x: player.x, y: player.y, r: 80, color: '#fff6b0', life: 0.7, max: 0.7, rot: 0 });
      ring(player.x, player.y, 90, col, 0.6);
      shapeBits(player.x, player.y, 'plus', '#fff6b0', 10, 120, 80);
      return;
    }
    const rad = 150 * sp.size * (1 + 0.2 * (sp.count - 1));
    wovenBurstAt(player.x, player.y, rad, 1.2 * sp.power, sp); // half a bolt's 2.4: it hits everything around
    if (sp.finish === 'F') {
      // Echoing: a second pulse a moment later, on the caster's side
      const x = player.x, y = player.y, side = curSide, caster = player;
      afterPlay(450, () => { if (state === 'play' || state === 'dead') withSide(side, () => wovenBurstAt(x, y, rad * 0.8, 0.5 * sp.power, sp), caster); });
    }
    else if (sp.finish === 'W') zones.push({ type: 'woven', x: player.x, y: player.y, r: rad * 0.75, life: 2.5, max: 2.5, tick: 0, spec: sp, charged: 0, ringZone: true });
    else if (sp.finish === 'E') { for (const f of foes) if (!f.dead && !f.structure && Math.hypot(f.x - player.x, f.y - player.y) < rad + f.r) knock(f, player.x, player.y, 380); fx.push({ kind: 'cracks', ...crackLines(player.x, player.y, rad * 0.8, 7), life: 1.2, max: 1.2 }); }
    else if (sp.finish === 'A') for (let i = 0; i < 6; i++) { const a = i * TAU / 6; launch(player.x, player.y, { x: Math.cos(a), y: Math.sin(a) }, { dmg: 0.8 * sp.power, type: sp.elem, speed: 460, r: 4, fx: 'woven', spec: sp, life: 0.6 }); shots[shots.length - 1].shard = true; }
    else if (sp.finish === 'S') { const n = foes.filter(f => !f.dead && Math.hypot(f.x - player.x, f.y - player.y) < rad + f.r).length; if (n) healPlayer(0.5 * n); }
  } else if (sp.form === 'pool') {
    if (sp.mine) {
      if (traps.length >= 8) traps.shift();
      traps.push({ x: player.x, y: player.y + 6, arm: 0.6, life: 45, spec: sp });
      castMessage(`${MINE_NAME[sp.elem]} set`, col);
      return;
    }
    const p = targetPoint(480, 150);
    zones.push({ type: 'woven', x: p.x, y: p.y, r: 90 * sp.size, r0: 90 * sp.size, life: 5 * sp.dur, max: 5 * sp.dur, tick: 0, spec: sp, charged: 0 });
    if (sp.elem === 'air' && sp.count > 1) zones[zones.length - 1].charged = 99; // a charged whirlwind is a lightning storm
    react(sp.elem, p.x, p.y, 90 * sp.size);
  } else if (sp.form === 'wall') {
    const a = aimFrom(player, 500);
    const cx = player.x + a.x * 75, cy = player.y + a.y * 75, px = -a.y, py = a.x;
    const segs = Math.round(5 * sp.size) + (sp.count - 1) * 2 + (sp.finish === 'E' ? 2 : 0); // Towering: longer
    const life = 8 * sp.dur * (sp.finish === 'W' ? 1.5 : 1); // Enduring: lasts longer
    for (let i = 0; i < segs; i++) {
      const o = (i - (segs - 1) / 2) * 27, x = cx + px * o, y = cy + py * o;
      if (isWater(x, y) || noGround(x, y) || (mode === 'battle' && !inArena(x, y, 16))) continue;
      tempSolids.push({ x, y, r: 15, life, kind: 'wall', elem: sp.elem, spec: sp, solid: sp.elem !== 'spirit', tick: 0, side: curSide, born: elapsed });
      puff(x, y + 6, '#c2a57a', 1, 12, 8);
      // Repelling: the wall shoves foes away as it rises
      if (sp.finish === 'A') for (const f of foes) if (!f.dead && !f.structure && Math.hypot(f.x - x, f.y - y) < 70) knock(f, x, y, 260);
    }
    shake = Math.max(shake, 4);
  } else if (sp.form === 'creature') {
    summonCritter(sp);
  }
}

// Each player has up to three helpers (friends on one team keep their own);
// the computer's wizards share three per team.
const helperOf = (a, p) => (p.isMage ? !!(a.owner && a.owner.isMage) : (a.owner || hostP) === p);
function makeRoom() {
  for (let mine = allies.filter(a => helperOf(a, player)); mine.length >= MAX_HELPERS; mine.shift()) {
    const old = mine[0];
    allies.splice(allies.indexOf(old), 1);
    burst(old.x, old.y, '#aaa', 12, 140);
    castMessage('Your oldest helper fades', '#aaa');
  }
}

function summonCritter(sp) {
  makeRoom();
  const C = CRITTER[sp.elem], a = rnd(0, TAU);
  const tough = sp.finish === 'E' ? 1.5 : 1; // Armoured
  allies.push({ kind: 'critter', elem: sp.elem, spec: sp, owner: player, x: player.x + Math.cos(a) * 40, y: player.y + Math.sin(a) * 40,
                life: 25 * sp.dur, max: 25 * sp.dur, hp: C.hp * sp.size * tough, maxHp: C.hp * sp.size * tough, cd: 0.6, ang: a,
                r: 10 * Math.sqrt(sp.size), taunt: !!C.taunt, healT: 2 });
  burst(player.x + Math.cos(a) * 40, player.y + Math.sin(a) * 40, TYPE_COLOR[sp.elem], 24, 220);
}

function fireLoaded() {

  if (eclipseBlocked(L.key)) return;
  if (net.role === 'guest') { net.send({ t: 'fire' }); return; }
