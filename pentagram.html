  if (t) {
    const dx = t.x - src.x, dy = t.y - src.y, d = Math.hypot(dx, dy) || 1;
    return { x: dx / d, y: dy / d, t };
  }
  return { x: player.face.x, y: player.face.y, t: null };
}

// ── magic energy (battle) ──
// Every kind of magic has a little energy circle. Each use drains it a bit; it
// refills slowly. Below 40% that kind loses power (down to 40% damage when empty).
const CHARGE_TYPES = ['spirit', 'water', 'fire', 'earth', 'air']; // pentagram order
const CHARGE_LOW = 0.4, CHARGE_REGEN = 0.05, CHARGE_COST = 0.14;
function resetCharge() {
  player.charge = Object.fromEntries(CHARGE_TYPES.map(t => [t, 1]));
  player.chargeT = {};
}
function chargeMult(type) {
  const c = player.charge ? player.charge[type] : 1;
  return c >= CHARGE_LOW ? 1 : 0.4 + 0.6 * c / CHARGE_LOW;
}
// one drain per kind per moment, so a blast that hits a crowd costs about the same as a single hit
function drainCharge(type) {
  if (!player.charge) resetCharge();
  if (elapsed - (player.chargeT[type] ?? -9) < 0.35) return;
  player.chargeT[type] = elapsed;
  player.charge[type] = Math.max(0, player.charge[type] - CHARGE_COST);
}

function damageFoe(f, dmg, rawType, fromHelper) {
  if (f.dead) return;
  if (f.proxyOf) { const d = dmg * (player.empower > 0 && !fromHelper ? 2 : 1); hurtPlayer(d, heroOf(f)); return d; }
  if (f.helper) { f.helper.hp -= dmg; burst(f.x, f.y, '#ccc', 4, 100); if (f.helper.hp <= 0) f.helper.life = 0; return dmg; }
  const type = ELEM_OF[rawType] || rawType; // lightning → air, poison → earth, holy → spirit
  if (f.unit && shielded(f)) {
    if (f.txtCd <= 0) { floatText(f.x, f.y - f.r - 10, shieldText(f), '#bde', 13); f.txtCd = 0.8; }
    SFX.immune();
    return;
  }
  let mult = 1;
  if (f.boss) {
    if (!f.def.weak.includes(type) && type !== 'prism' && type !== 'mirror') {
      SFX.immune();
      if (f.txtCd <= 0) { floatText(f.x, f.y - f.r - 10, 'IMMUNE', '#999', 15); f.txtCd = 0.6; }
      ring(f.x, f.y, f.r + 6, 'rgba(200,200,200,0.6)', 0.2);
      return;
    }
  } else {
    mult = f.def.mult[type] ?? (type === 'prism' ? 1.5 : 1);
  }
  if (f.hex > 0 || f.stone > 0) mult *= 1.5;
  if (f.unit && f.elem) mult *= elemMult(type, f.elem);
  // Battle: each kind of magic has its own energy; drained kinds hit softer
  if (mode === 'battle' && CHARGE_TYPES.includes(type) && !fromHelper) {
    const cm = chargeMult(type);
    mult *= cm;
    drainCharge(type);
    if (cm < 0.8 && (player.chargeTxtCd || 0) <= 0) {
      floatText(player.x, player.y - 44, `${type} is drained · mix it up!`, TYPE_COLOR[type], 12);
      player.chargeTxtCd = 1.5;
    }
  }
  if (player.empower > 0 && !fromHelper) mult *= 2;
  const d = dmg * mult;
  f.hp -= d;
  if (rawType !== 'poison') SFX.hit();
  f.flash = 0.12;
  const weak = f.boss || mult > 1.01;
  floatText(f.x + rnd(-8, 8), f.y - f.r - 6, fmt(d) + (weak && !f.boss ? '!' : ''),
            weak ? '#ffe14a' : mult < 0.99 ? '#aaa' : '#fff', weak ? 17 : 13);
  if (f.hp <= 0) killFoe(f);
  return d;
}

// Points: a beast's base worth grows as later, tougher versions spawn.
function addScore(n, x, y, big) {
  score += n;
  floatText(x, y, '+' + n, '#ffd24a', big ? 26 : 15);
  if (score > best) { best = score; try { localStorage.setItem('pentagram-best', String(best)); } catch (_) {} }
}

// Hunting bonuses: every 10 of one kind pays out, and 10 of every kind pays big.
const FOE_NAMES = { slime: 'Slimes', bat: 'Bats', skeleton: 'Skeletons', ember: 'Embers', shade: 'Shades' };
function huntBonus(f) {
  const n = tally[f.kind] = (tally[f.kind] || 0) + 1;
  floatText(f.x, f.y - f.r - 6, `${FOE_NAMES[f.kind]} ${n % 10 || 10}/10`, '#bbb', 11);
  if (n % 10 === 0) {
    const bonus = f.def.pts * 10;
    addScore(bonus, player.x, player.y - 60, true);
    showBanner(`${n} ${FOE_NAMES[f.kind]}!`, `Hunting bonus +${bonus}`, 2.5);
    SFX.discover();
  }
  if (!masterHunter && Object.keys(FOES).every(k => (tally[k] || 0) >= 10)) {
    masterHunter = true;
    addScore(2000, player.x, player.y - 90, true);
    showBanner('MASTER HUNTER!', '10 of every creature · +2,000', 4);
    SFX.bossDown();
  }
}

function killFoe(f) {
  if (f.unit) {
    // battle units: points for your kill, then the usual fallout (respawns, shields, victory)
    kills++;
    SFX.kill();
    unitFell(f); // points go to blue
    return;
  }
  f.dead = true;
  f.boss ? SFX.bossDown() : SFX.kill();
  kills++;
  addScore(f.boss ? f.def.pts : Math.round(f.def.pts * f.maxHp / f.def.hp), f.x, f.y - f.r - 22, f.boss);
  if (!f.boss) huntBonus(f);
  burst(f.x, f.y, f.boss ? f.def.color : f.def.color, f.boss ? 70 : 14, f.boss ? 420 : 260);
  if (f.boss) {
    bossesDown++;
    shake = 14;
    showBanner(`${f.def.name} is defeated!`, 'Its chest is unsealed', 4);
  }
}

function knock(f, fromX, fromY, force) {
  if (f.structure) return;
  const dx = f.x - fromX, dy = f.y - fromY, d = Math.hypot(dx, dy) || 1;
  const k = f.boss ? 0.15 : 1;
  f.kx += dx / d * force * k;
  f.ky += dy / d * force * k;
}

function aoe(x, y, rad, dmg, type, push) {
  for (const f of foes) {
    if (f.dead) continue;
    if (Math.hypot(f.x - x, f.y - y) < rad + f.r) {
      damageFoe(f, dmg, type);
      if (push) knock(f, x, y, push);
    }
  }
  ring(x, y, rad, TYPE_COLOR[type], 0.4);
  react(type, x, y, rad);
}

function hurtPlayer(d, p = player) {
  if ((p === hostP ? state !== 'play' : p.dead) || p.invuln > 0 || p.omni > 0 || p.sanct > 0) return;
  if (p.ward > 0) {
    p.ward--;
    SFX.block();
    p.invuln = 0.3;
    ring(p.x, p.y, 30, TYPE_COLOR.spirit, 0.3);
    floatText(p.x, p.y - 30, 'blocked', TYPE_COLOR.spirit, 14);
    return;
  }
  if (p.skin > 0) d *= 0.5;
  p.hp -= d;
  SFX.hurt();
  p.invuln = 0.5;
  if (p === hostP) shake = Math.max(shake, 6);
  burst(p.x, p.y, '#f44', 8, 180);
  floatText(p.x, p.y - 30, '-' + fmt(d), '#f55', 16);
  if (p.hp <= 0 && p.phoenix > 0) {
    // Phoenix: rise from the ashes once, in a burst of flame
    p.phoenix = 0;
    p.hp = p.maxHp;
    p.invuln = 2;
    aoe(p.x, p.y, 200, 6, 'fire', 360);
    burst(p.x, p.y, '#ffb04a', 80, 520);
    flash = Math.max(flash, 0.6);
    SFX.explode(true);
    showBanner('The Phoenix rises!', '', 2.5);
    return;
  }
  if (p.hp <= 0 && p.isRival) { rivalDown(); return; }
  if (p.hp <= 0) {
    p.hp = 0;
    state = 'dead';
    SFX.death();
    overlayT = 0;
    seq = []; castPtr = null; finger = null;
  }
}

function healPlayer(n) {
  player.hp = Math.min(player.maxHp, player.hp + n);
  floatText(player.x, player.y - 30, '+' + fmt(n), '#6f6', 16);
  burst(player.x, player.y, '#6f6', 14, 150);
}

// ── spell effects ────────────────────────────────────────────────────────────
function launch(x, y, dir, o) {
  shots.push({
    x: x + dir.x * 18, y: y + dir.y * 18, vx: dir.x * o.speed, vy: dir.y * o.speed,
    r: o.r, dmg: o.dmg, type: o.type, fx: o.fx, boom: o.boom, boomR: o.boomR,
    pierce: o.pierce || 0, life: o.life || 1.6, hit: new Set(), color: TYPE_COLOR[o.type],
    spec: o.spec, ally: o.ally,
  });
}

function shoot(o) { launch(player.x, player.y, aimFrom(player), o); }

function chainLightning(dmg, jumps) {
  let cur = nearestFoe(player.x, player.y, 450);
  if (!cur) { castMessage('No target in range', '#8ff'); return; }
  SFX.lightning();
  const pts = [{ x: player.x, y: player.y }];
  const hit = new Set();
  for (let i = 0; i < jumps && cur; i++) {
    hit.add(cur);
    pts.push({ x: cur.x, y: cur.y });
    damageFoe(cur, dmg, 'lightning');
    react('air', cur.x, cur.y, 30);
    cur = nearestFoe(cur.x, cur.y, 230, hit);
  }
  fx.push({ kind: 'bolt', pts, life: 0.3, max: 0.3 });
}

function targetPoint(range, ahead) {
  const t = nearestFoe(player.x, player.y, range);
  if (t) return { x: t.x, y: t.y };
  return { x: player.x + player.face.x * ahead, y: player.y + player.face.y * ahead };
}

function plagueCloud() {
  const p = targetPoint(500, 150);
  zones.push({ x: p.x, y: p.y, r: 110, life: 6, max: 6, tick: 0 });
}

function tidalWave() {
  waves.push({ x: player.x, y: player.y, r: 20, maxR: 440, speed: 480, dmg: 8, type: 'water', hit: new Set() });
}

function meteor() {
  const p = targetPoint(650, 220);
  meteors.push({ x: p.x, y: p.y, t: 0.9, max: 0.9 });
}

function blizzard() {
  SFX.freeze();
  flash = 0.4;
  shake = Math.max(shake, 10);
  for (const f of foes) {
    if (f.dead || Math.hypot(f.x - player.x, f.y - player.y) > 460) continue;
    damageFoe(f, 22, 'water');
    f.freeze = 4;
    f.slow = 8;
  }
  ring(player.x, player.y, 460, '#cfefff', 0.8);
  for (let i = 0; i < 90; i++) {
    const a = rnd(0, TAU), d = rnd(0, 460);
    particles.push({ x: player.x + Math.cos(a) * d, y: player.y + Math.sin(a) * d - 60, vx: rnd(-30, 30), vy: rnd(60, 160),
                     r: rnd(2, 4), life: 1, decay: rnd(0.6, 1.2), color: '#e8f8ff' });
  }
}

// 7-element finale (after its long charge): everything nearby is erased and every
// guardian in range takes a massive hit of the one thing it can't resist.
function detonateDoom() {
  SFX.explode(true);
  flash = 1.6;
  shake = 34;
  enemyShots = [];
  for (const f of foes) {
    if (f.dead || Math.hypot(f.x - player.x, f.y - player.y) > 1000) continue;
    if (f.boss) damageFoe(f, 50, f.def.weak[0]);
    else damageFoe(f, 9999, 'holy');
    burst(f.x, f.y, '#ff3355', 18, 400);
  }
  for (let i = 0; i < 4; i++) ring(player.x, player.y, 250 + i * 250, i % 2 ? '#fff6b0' : '#ff3355', 0.9 + i * 0.2);
  burst(player.x, player.y, '#fff', 80, 700);
}

// Crown of All: while it lasts you can't be hurt, and every arrow you fire is a
// prism bolt that counts as every element (so it can hurt any guardian).
const OMNI_TYPES = ['fire', 'water', 'earth', 'air', 'lightning', 'poison', 'spirit', 'holy'];

function aimAngle() { const a = aimFrom(player, 400); return Math.atan2(a.y, a.x); }

// Crowd control. Guardians shrug off fear, confusion and hex, and take the rest for less time.
const CC_LABEL = { stun: 'STUNNED', root: 'ROOTED', fear: 'FLEES', confuse: 'CONFUSED', hex: 'HEXED', stone: 'STONE', freeze: 'FROZEN' };
function applyCC(f, kind, dur) {
  if (f.dead || f.structure) return;
  if (f.boss) {
    if (kind === 'fear' || kind === 'confuse' || kind === 'hex') {
      if (f.txtCd <= 0) { floatText(f.x, f.y - f.r - 10, 'RESISTS', '#999', 14); f.txtCd = 0.6; }
      return;
    }
    dur *= 0.4;
  }
  if (!(f[kind] > 0)) floatText(f.x, f.y - f.r - 18, CC_LABEL[kind], '#e0d0ff', 12);
  f[kind] = Math.max(f[kind] || 0, dur);
  if (kind === 'confuse') f.wander = rnd(0, TAU);
}
function areaCC(x, y, r, kind, dur, color) {
  for (const f of foes) if (!f.dead && Math.hypot(f.x - x, f.y - y) < r + f.r) applyCC(f, kind, dur);
  ring(x, y, r, color, 0.6);
  burst(x, y, color, 30, 300);
}

function quake() {
  shake = Math.max(shake, 10);
  for (const f of foes) {
    if (f.dead || Math.hypot(f.x - player.x, f.y - player.y) > 220 + f.r) continue;
    damageFoe(f, 1.5, 'earth');
    applyCC(f, 'stun', 1.6);
  }
  for (let i = 0; i < 3; i++) ring(player.x, player.y, 80 + i * 70, TYPE_COLOR.earth, 0.4 + i * 0.15);
  burst(player.x, player.y, TYPE_COLOR.earth, 40, 320);
}

// Fan-shaped blast in front of the caster.
function cone(x, y, ang, range, half, dmg, type, effect) {
  for (const f of foes) {
    if (f.dead) continue;
    const dx = f.x - x, dy = f.y - y, d = Math.hypot(dx, dy);
    if (d > range + f.r) continue;
    let da = Math.atan2(dy, dx) - ang;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    if (Math.abs(da) > half + f.r / Math.max(d, 1)) continue;
    damageFoe(f, dmg, type);
    if (effect === 'burn') { f.burn = Math.max(f.burn || 0, 3); }
  }
  fx.push({ kind: 'cone', x, y, ang, range, half, color: TYPE_COLOR[type], life: 0.35, max: 0.35 });
  react(type, x + Math.cos(ang) * range * 0.6, y + Math.sin(ang) * range * 0.6, range * 0.5);
}

function layTrap() {
  if (traps.length >= 6) traps.shift();
  traps.push({ x: player.x, y: player.y + 6, arm: 0.6, life: 40 });
  castMessage('Trap set', TYPE_COLOR.fire);
}

// Jump a short way in the direction you're facing, never into water or walls.
function blink() {
  if (player.onBoat) { castMessage('Can’t blink from a boat', '#bbb'); return; }
  const fx0 = player.x, fy0 = player.y;
  for (let d = 170; d >= 30; d -= 10) {
    const x = clamp(player.x + player.face.x * d, -WORLD, WORLD), y = clamp(player.y + player.face.y * d, -boundY(), boundY());
    if (blockedForFoot(x, y, PLAYER_R)) continue;
    player.x = x; player.y = y;
    break;
  }
  player.invuln = Math.max(player.invuln, 0.25);
  burst(fx0, fy0, TYPE_COLOR.spirit, 18, 200);
  burst(player.x, player.y, TYPE_COLOR.air, 18, 200);
}

// A short wall of boulders between you and the nearest enemy. Blocks enemies and their shots.
function stoneWall() {
  const a = aimFrom(player, 500);
  const cx = player.x + a.x * 70, cy = player.y + a.y * 70;
  const px = -a.y, py = a.x;
  for (let i = -3; i <= 3; i++) {
    const x = cx + px * i * 26, y = cy + py * i * 26;
    if (isWater(x, y)) continue;
    tempSolids.push({ x, y, r: 16, life: 9, kind: 'boulder', side: curSide });
    burst(x, y, TYPE_COLOR.earth, 5, 120);
  }
  shake = Math.max(shake, 5);
}

// The dragon breathes a long cone of fire where you aim. Only when you press FIRE.
function dragonBreath() {
  const d = allies.find(a => a.kind === 'dragon');
  const src = d || player;
  const a = aimFrom(src, 500);
  cone(src.x, src.y, Math.atan2(a.y, a.x), 300, 0.45, 8, 'fire', 'burn');
  shake = Math.max(shake, 8);
  SFX.explode(false);
}

function updateStorms(dt) {
  for (const s of storms) {
    s.t -= dt;
    if (s.t > 0) continue;
    s.t = 0.2;
    s.left--;
    const near = foes.filter(f => !f.dead && Math.hypot(f.x - player.x, f.y - player.y) < 480);
    if (!near.length) continue;
    const f = near[Math.floor(Math.random() * near.length)];
    damageFoe(f, 7, 'lightning');
    react('air', f.x, f.y, 40);
    SFX.lightning();
    fx.push({ kind: 'bolt', pts: [{ x: f.x + rnd(-40, 40), y: f.y - 420 }, { x: f.x, y: f.y }], life: 0.25, max: 0.25 });
    burst(f.x, f.y, TYPE_COLOR.lightning, 10, 220);
    shake = Math.max(shake, 4);
  }
  storms = storms.filter(s => s.left > 0);
}

// Helpers never attack on their own: the wisp heals, the imp and guardian draw
// enemies away from you, and the dragon only breathes when you press FIRE.
const ALLY_LIFE = { wisp: 15, imp: 8, golem: 20, dragon: 30 };
const ALLY_R = { wisp: 9, imp: 10, golem: 18, dragon: 26 };
const ALLY_HP = { imp: 10, golem: 40 };
// ── woven spells in action ──
function solidTemps() { return tempSolids.filter(b => b.solid !== false); }

function applyWovenFx(f, sp, dealt, src, inPool) {
  if (!f || f.dead) return;
  const fx = sp.fx;
  if (fx.has('burn')) f.burn = Math.max(f.burn || 0, 2.5 * sp.dur);
  if (fx.has('slow')) f.slow = Math.max(f.slow || 0, 2.5 * sp.dur);
  if (fx.has('freeze') && !inPool) applyCC(f, 'freeze', 1.4 * sp.dur);
  if (fx.has('knock')) { if (inPool) applyCC(f, 'root', 0.6); else if (src) knock(f, src.x, src.y, 220 * sp.size); }
  if (fx.has('shock')) applyCC(f, 'stun', 0.35);
  if (fx.has('confuse')) applyCC(f, 'confuse', 2.5 * sp.dur);
  if (fx.has('poison')) { f.poison = Math.max(f.poison || 0, 3); f.poisonDps = Math.max(f.poisonDps || 0, 0.8); }
  if (fx.has('drain') && dealt) healPlayer(dealt * 0.35);
}

// Elements react: lightning electrifies water, fire ignites poison, water steams out fire.
function react(type, x, y, r) {
  const el = ELEM_OF[type] || type;
  for (const z of zones) {
    if (z.life <= 0 || Math.hypot(z.x - x, z.y - y) > z.r + r) continue;
    const zEl = z.spec ? z.spec.elem : z.type === 'fire' ? 'fire' : z.type === 'spring' ? 'water' : !z.type ? 'poison' : null;
    const poison = !z.type || (z.spec && z.spec.fx.has('poison'));
    if (el === 'air' && zEl === 'water' && !(z.charged > 0)) {
      z.charged = 4;
      floatText(z.x, z.y - z.r - 8, 'ELECTRIFIED!', TYPE_COLOR.lightning, 15);
      SFX.lightning();
    } else if (el === 'fire' && poison) {
      z.life = 0;
      floatText(z.x, z.y - z.r - 8, 'IGNITED!', TYPE_COLOR.fire, 16);
      aoe(z.x, z.y, z.r + 30, 5, 'fire', 220);
      burst(z.x, z.y, '#ff8a3a', 40, 380);
      SFX.explode(false);
      shake = Math.max(shake, 8);
    } else if (el === 'water' && zEl === 'fire') {
      z.life = 0;
      floatText(z.x, z.y - z.r - 8, 'STEAM!', '#ddd', 15);
      areaCC(z.x, z.y, z.r + 20, 'confuse', 2.5, 'rgba(230,230,230,0.8)');
    }
  }
}

function wovenBurstAt(x, y, rad, dmg, sp) {
  for (const f of foes) {
    if (f.dead || Math.hypot(f.x - x, f.y - y) > rad + f.r) continue;
    const dealt = damageFoe(f, dmg, sp.elem);
    applyWovenFx(f, sp, dealt, { x, y });
  }
  ring(x, y, rad, TYPE_COLOR[sp.elem], 0.45);
  elemHit(sp.elem, x, y, 1.6 * sp.size);
  react(sp.elem, x, y, rad);
}

function castWoven(sp) {
  const col = TYPE_COLOR[sp.elem];
  if (sp.form === 'bolt') {
    const a = aimFrom(player), base = Math.atan2(a.y, a.x);
    for (let i = 0; i < sp.count; i++) {
      const ang = base + (i - (sp.count - 1) / 2) * 0.16;
      launch(player.x, player.y, { x: Math.cos(ang), y: Math.sin(ang) },
             { dmg: 2.4 * sp.power, type: sp.elem, speed: 540, r: 6 + 2 * sp.size, pierce: sp.pierce, fx: 'woven', spec: sp });
    }
  } else if (sp.form === 'burst') {
    if (sp.elem === 'spirit') {
      // Blessing: heal, plus a buff for each upgrade
      healPlayer(3 * sp.power);
      const t = 6 * sp.dur;
      if (sp.key.includes('F', 2)) player.empower = Math.max(player.empower, t);
      if (sp.key.includes('W', 2)) player.regen = Math.max(player.regen, t);
      if (sp.key.includes('E', 2)) player.skin = Math.max(player.skin, t);
      if (sp.key.includes('A', 2)) player.haste = Math.max(player.haste, t);
      if (sp.key.includes('S', 2)) player.ward = Math.max(player.ward, 2);
      ring(player.x, player.y, 90, col, 0.6);
      burst(player.x, player.y, '#fff6b0', 30, 220);
      return;
    }
    wovenBurstAt(player.x, player.y, 150 * sp.size * (1 + 0.2 * (sp.count - 1)), 2 * sp.power, sp);
  } else if (sp.form === 'pool') {
    if (sp.mine) {
      if (traps.length >= 8) traps.shift();
      traps.push({ x: player.x, y: player.y + 6, arm: 0.6, life: 45, spec: sp });
      castMessage(`${MINE_NAME[sp.elem]} set`, col);
      return;
    }
    const p = targetPoint(480, 150);
    zones.push({ type: 'woven', x: p.x, y: p.y, r: 90 * sp.size, life: 5 * sp.dur, max: 5 * sp.dur, tick: 0, spec: sp, charged: 0 });
    if (sp.elem === 'air' && sp.count > 1) zones[zones.length - 1].charged = 99; // a charged whirlwind is a lightning storm
    react(sp.elem, p.x, p.y, 90 * sp.size);
  } else if (sp.form === 'wall') {
    const a = aimFrom(player, 500);
    const cx = player.x + a.x * 75, cy = player.y + a.y * 75, px = -a.y, py = a.x;
    const segs = Math.round(5 * sp.size) + (sp.count - 1) * 2;
    for (let i = 0; i < segs; i++) {
      const o = (i - (segs - 1) / 2) * 27, x = cx + px * o, y = cy + py * o;
      if (isWater(x, y) || (mode === 'battle' && !inArena(x, y, 16))) continue;
      tempSolids.push({ x, y, r: 15, life: 8 * sp.dur, kind: 'wall', elem: sp.elem, spec: sp, solid: sp.elem !== 'spirit', tick: 0, side: curSide });
      burst(x, y, col, 4, 100);
    }
    shake = Math.max(shake, 4);
  } else if (sp.form === 'creature') {
    summonCritter(sp);
  }
}

function makeRoom() {
  while (allies.length >= MAX_HELPERS) {
    const old = allies.shift();
    burst(old.x, old.y, '#aaa', 12, 140);
    castMessage('Your oldest helper fades', '#aaa');
  }
}

function summonCritter(sp) {
  makeRoom();
  const C = CRITTER[sp.elem], a = rnd(0, TAU);
  allies.push({ kind: 'critter', elem: sp.elem, spec: sp, x: player.x + Math.cos(a) * 40, y: player.y + Math.sin(a) * 40,
                life: 25 * sp.dur, max: 25 * sp.dur, hp: C.hp * sp.size, maxHp: C.hp * sp.size, cd: 0.6, ang: a,
                r: 10 * Math.sqrt(sp.size), taunt: !!C.taunt, healT: 2 });
  burst(player.x + Math.cos(a) * 40, player.y + Math.sin(a) * 40, TYPE_COLOR[sp.elem], 24, 220);
}

function updateCritter(a, dt) {
  const C = CRITTER[a.elem], sp = a.spec;
  const t = nearestFoe(a.x, a.y, 420);
  const engage = t && Math.hypot(t.x - player.x, t.y - player.y) < 520;
  const spd = C.spd * (1 + 0.2 * (sp.count - 1));
  if (engage && C.melee) {
    const d = moveToward(a, t.x, t.y, spd, dt, a.r + t.r);
    if (d <= a.r + t.r + 8 && a.cd <= 0) {
      a.cd = C.cd;
      const dealt = damageFoe(t, C.dmg * sp.power, a.elem, true);
      applyWovenFx(t, sp, dealt, a);
      elemHit(a.elem, t.x, t.y, 0.6);
    }
  } else {
    // keep near you, circling
    a.ang += dt * (C.spd / 140);
    moveToward(a, player.x + Math.cos(a.ang) * 60, player.y + Math.sin(a.ang) * 45, spd, dt, 4);
    if (engage && a.cd <= 0 && Math.hypot(t.x - a.x, t.y - a.y) < C.range) {
      a.cd = C.cd / (1 + 0.3 * (sp.count - 1));
      launch(a.x, a.y, aimFrom(a, C.range), { dmg: C.dmg * sp.power, type: a.elem, speed: 480, r: 5, fx: 'woven', spec: sp, ally: true });
    }
  }
  if (C.heals || sp.heal) {
    a.healT -= dt;
    if (a.healT <= 0) { a.healT = 2; if (player.hp < player.maxHp) healPlayer(0.6); }
  }
  pushOut(a, a.r);
}

function summon(kind) {
  makeRoom();
  const a = rnd(0, TAU);
  allies.push({ kind, x: player.x + Math.cos(a) * 40, y: player.y + Math.sin(a) * 40,
                life: ALLY_LIFE[kind], max: ALLY_LIFE[kind], cd: 0.4, ang: a, r: ALLY_R[kind], hp: ALLY_HP[kind] || 0 });
  burst(player.x + Math.cos(a) * 40, player.y + Math.sin(a) * 40, kind === 'dragon' ? '#ff5a2a' : '#fff', kind === 'dragon' ? 50 : 16, 260);
}

function castSequence() {
  if (!seq.length) return;
  const key = seq.join('');
  if (net.role === 'guest') {
    // the host runs the spell; remember it here for your spell book
    seq = [];
    net.send({ t: 'cast', k: key });
    if (SPELLS[key]) { SFX.weave(key); discovered.add(key); } else SFX.fizzle();
    return;
  }
  const sp = SPELLS[key];
  seq = [];
  if (!sp) {
    player.mana = Math.max(0, player.mana - 1);
    castMessage('…fizzle', '#888');
    SFX.fizzle();
    burst(player.x, player.y, '#777', 10, 120);
    return;
  }
  if (player.mana < sp.cost) { castMessage('Not enough mana', '#6af'); return; }
  player.mana -= sp.cost;
  const tier = key.length;
  castMessage(tier >= 4 ? `${sp.name} · ${TIERS[tier]}` : sp.name, TIER_COLOR[tier]);
  burst(player.x, player.y, ELEMENTS[key[tier - 1]].color, 6 * tier, 100 + 50 * tier);
  if (isAttack(sp) || sp.fire) {
    // aimed spells load onto the FIRE button; weaving a new one replaces the old
    if (sp.fire) sp.cast();
    const n = sp.shots || TIER_SHOTS[tier];
    player.loaded = { key, left: n };
    castMessage(`${sp.name} ×${n} · tap FIRE`, TIER_COLOR[tier]);
    SFX.weave(key); SFX.loaded();
    if (sp.fire) SFX.summon();
  } else {
    if (tier >= 4) shake = Math.max(shake, (tier - 3) * 4);
    SFX.weave(key);
    (sp.kind === 'heal' ? SFX.heal : sp.kind === 'summon' ? SFX.summon : SFX.buff)();
    sp.cast();
  }
  if (!discovered.has(key)) {
    discovered.add(key);
    SFX.discover();
    showBanner(tier >= 5 ? `${TIERS[tier].toUpperCase()} SPELL!` : 'New spell discovered!',
               `${sp.name} · tier ${tier} ${TIERS[tier]} · ${sp.kind}`, tier >= 5 ? 4 : 3);
  }
}

// Press FIRE: quick spells go instantly, strong ones root you while they charge.
function fireLoaded() {
  const L = player.loaded;
  if (!L || player.charging || state !== 'play') return;
  if (net.role === 'guest') { net.send({ t: 'fire' }); return; }
  const tier = L.key.length;
  L.left--;
  if (L.left <= 0) player.loaded = null;
  const windup = SPELLS[L.key].windup ?? TIER_WINDUP[tier];
  if (windup > 0) { player.charging = { key: L.key, t: windup, max: windup }; SFX.charge(tier, windup); }
  else releaseSpell(L.key);
}

function releaseSpell(key) {
  SFX.release(key);
  const tier = key.length;
  if (tier >= 4) shake = Math.max(shake, (tier - 3) * 4);
  burst(player.x, player.y, TIER_COLOR[tier], 4 * tier, 80 + 40 * tier);
  const sp = SPELLS[key];
  (sp.fire || sp.cast)();
}

function shootArrow(wx, wy) {
  if (player.arrowCd > 0 || player.charging) return;
  if (net.role === 'guest') {
    player.arrowCd = player.omni > 0 ? 0.22 : 0.3;
    const dx = wx - player.x, dy = wy - player.y, d = Math.hypot(dx, dy) || 1;
    player.face = { x: dx / d, y: dy / d };
    SFX.arrow();
    net.send({ t: 'arrow', x: -wx, y: wy });
    return;
  }
  SFX.arrow();
  const dx = wx - player.x, dy = wy - player.y, d = Math.hypot(dx, dy) || 1;
  player.face = { x: dx / d, y: dy / d };
  if (player.omni > 0) {
    // Crown of All: prism bolts, still one per press
    player.arrowCd = 0.22;
    launch(player.x, player.y, player.face, { dmg: 3, type: 'prism', speed: 760, r: 8, life: 1 });
    return;
  }
  player.arrowCd = 0.3;
  launch(player.x, player.y, player.face, { dmg: 1, type: 'arrow', speed: 720, r: 5, life: 0.9 });
}

// ── update ───────────────────────────────────────────────────────────────────
function moveToward(e, tx, ty, spd, dt, stop) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  if (d <= stop || d === 0) return d;
  const step = Math.min(spd * dt, d - stop);
  e.x += dx / d * step;
  e.y += dy / d * step;
  return d;
}

function pickFoeKind(x, y) {
  const r = Math.random();
  for (const b of BOSSES) {
    if (Math.hypot(x - b.x, y - b.y) < 600 && r < 0.5) return b.minion;
  }
  const d = Math.hypot(x, y);
  if (d < 600)  return r < 0.65 ? 'slime' : 'bat';
  if (d < 1100) return r < 0.35 ? 'slime' : r < 0.6 ? 'bat' : r < 0.85 ? 'skeleton' : 'ember';
  return ['bat', 'skeleton', 'ember', 'shade', 'shade'][Math.floor(r * 5)];
}

function spawnFoes(dt) {
  spawnTimer -= dt;
  if (spawnTimer > 0) return;
  spawnTimer = Math.max(0.5, 1.4 - elapsed / 300);
  const cap = Math.min(24, 6 + Math.floor(elapsed / 25));
  if (foes.filter(f => !f.boss && !f.dead).length >= cap) return;
  const a = rnd(0, TAU), d = rnd(520, 760);
  const x = clamp(player.x + Math.cos(a) * d, -WORLD, WORLD);
  const y = clamp(player.y + Math.sin(a) * d, -WORLD, WORLD);
  if (Math.hypot(x, y) < 220) return;
  const kind = pickFoeKind(x, y);
  if ((kind !== 'bat' && isWater(x, y)) || blockedForFoot(x, y, 16)) return;
  foes.push(makeFoe(kind, x, y));
}

function bossAttack(b) {
  const col = b.def.color;
  if (b.def.attack === 'ring') {
    for (let i = 0; i < b.def.shots; i++) {
      const a = i / b.def.shots * TAU + elapsed;
      enemyShots.push({ x: b.x, y: b.y, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220, r: 8, dmg: b.def.dmg * 0.5, life: 3, color: col });
    }
    return;
  }
  const base = Math.atan2(player.y - b.y, player.x - b.x);
  const n = b.def.shots;
  for (let i = 0; i < n; i++) {
    const a = base + (i - (n - 1) / 2) * 0.22;
    enemyShots.push({ x: b.x, y: b.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, r: 8, dmg: b.def.dmg * 0.5, life: 3, color: col });
  }
}

function updateBoss(b, dt, dp) {
  const home = Math.hypot(b.def.x - b.x, b.def.y - b.y);
  if (!b.aggro && dp < 380) {
    b.aggro = true;
    b.shotCd = 1.2;
    showBanner(b.def.name, 'awakens', 2);
    SFX.awaken();
  }
  if (b.aggro && (dp > 700 || home > 900)) b.aggro = false;

  if (b.aggro) {
    moveToward(b, player.x, player.y, b.spd * (b.slow > 0 ? 0.6 : 1), dt, b.r + PLAYER_R - 4);
    b.shotCd -= dt;
    if (b.shotCd <= 0) { b.shotCd = b.def.rate; bossAttack(b); }
    if (b.def.summon) {
      b.summonCd -= dt;
      if (b.summonCd <= 0) {
        b.summonCd = 7;
        for (let i = 0; i < 2; i++) spawnQueue.push(makeFoe(b.def.summon, b.x + rnd(-70, 70), b.y + rnd(-70, 70)));
        ring(b.x, b.y, b.r + 40, b.def.color, 0.5);
      }
    }
  } else {
    moveToward(b, b.def.x, b.def.y, b.spd, dt, 2);
    b.hp = Math.min(b.maxHp, b.hp + b.maxHp * 0.08 * dt);
  }
}

// Slow-mo and Time Stop act on enemies and their shots, never on you.
function timeScale() { return timeStop > 0 ? 0 : timeWarp > 0 ? 0.3 : 1; }

// Who a foe goes after: a taunting helper nearby, otherwise you.
function foeTarget(f) {
  let best = null, bd = 360;
  for (const a of allies) {
    if (a.kind !== 'imp' && a.kind !== 'golem' && !(a.kind === 'critter' && a.taunt)) continue;
    const d = Math.hypot(a.x - f.x, a.y - f.y);
    if (d < bd) { bd = d; best = a; }
  }
  return best || player;
}

function updateFoes(realDt) {
  const dt = realDt * timeScale();
  if (dt === 0) return; // time is stopped
  for (const f of foes) {
    if (f.dead || f.proxyOf) continue;
    f.flash = Math.max(0, f.flash - dt);
    f.hitCd -= dt; f.slow -= dt; f.txtCd -= dt;
    if (f.poison > 0) {
      f.poison -= dt;
      f.poisonTick -= dt;
      if (f.poisonTick <= 0) { f.poisonTick = 0.5; damageFoe(f, f.poisonDps * 0.5, 'poison'); }
      if (f.dead) continue;
    }
    if (f.burn > 0) {
      f.burn -= dt;
      f.burnTick = (f.burnTick || 0) - dt;
      if (f.burnTick <= 0) { f.burnTick = 0.5; damageFoe(f, 0.4, 'fire'); }
      if (f.dead) continue;
    }
    for (const k of ['hex', 'fear', 'confuse', 'root']) if (f[k] > 0) f[k] -= dt;
    // frozen, stunned or turned to stone: no moving, biting or shooting
    if (f.freeze > 0 || f.stun > 0 || f.stone > 0) {
      f.freeze = (f.freeze || 0) - dt; f.stun = (f.stun || 0) - dt; f.stone = (f.stone || 0) - dt;
      continue;
    }
    if (f.unit) {
      if (f.fear > 0) moveToward(f, f.x * 2 - player.x, f.y * 2 - player.y, f.spd, dt, 0);
      else if (f.confuse > 0) {
        if (Math.random() < dt * 1.5) f.wander = rnd(0, TAU);
        f.x += Math.cos(f.wander) * f.spd * dt; f.y += Math.sin(f.wander) * f.spd * dt;
      } else updateUnit(f, dt);
      if (!f.structure) {
        f.x += f.kx * dt; f.y += f.ky * dt;
        const dmp = Math.max(0, 1 - 7 * dt);
        f.kx *= dmp; f.ky *= dmp;
        f.x = clamp(f.x, -WORLD, WORLD); f.y = clamp(f.y, -boundY(), boundY());
        if (mode === 'battle') clampArena(f, f.r);
        if (!f.def.flying) pushOut(f, f.r);
      }
      continue;
    }
    const dp = Math.hypot(player.x - f.x, player.y - f.y);
    const px = f.x, py = f.y;
    let tgt = player;
    if (f.boss) {
      updateBoss(f, dt, dp);
      if (f.root > 0) { f.x = px; f.y = py; }
    } else {
      if (dp > 1300) { f.dead = true; continue; }
      let spd = f.spd * (f.slow > 0 ? 0.5 : 1) * (f.hex > 0 ? 0.4 : 1);
      if (f.root > 0) spd = 0;
      if (f.fear > 0) {
        moveToward(f, f.x * 2 - player.x, f.y * 2 - player.y, spd * 1.1, dt, 0); // run away
      } else if (f.confuse > 0) {
        if (Math.random() < dt * 1.5) f.wander = rnd(0, TAU);
        f.x += Math.cos(f.wander) * spd * dt; f.y += Math.sin(f.wander) * spd * dt;
      } else {
        tgt = foeTarget(f);
        moveToward(f, tgt.x, tgt.y, spd, dt, f.r + (tgt === player ? PLAYER_R : tgt.r) - 2);
        if (f.kind === 'bat' && spd > 0) { f.x += Math.cos(elapsed * 7 + f.wob) * 40 * dt; f.y += Math.sin(elapsed * 9 + f.wob) * 40 * dt; }
      }
    }
    f.x += f.kx * dt; f.y += f.ky * dt;
    const damp = Math.max(0, 1 - 7 * dt);
    f.kx *= damp; f.ky *= damp;
    f.x = clamp(f.x, -WORLD, WORLD); f.y = clamp(f.y, -boundY(), boundY());
    if (f.kind !== 'bat') {
      if (isWater(f.x, f.y)) { f.x = px; f.y = py; } // only bats fly over the lake
      pushOut(f, f.r);
    }

    // bites: frogs, the frightened and the confused don't bite
    if (f.hex > 0 || f.fear > 0 || f.confuse > 0) continue;
    if (tgt !== player) {
      if (Math.hypot(tgt.x - f.x, tgt.y - f.y) < f.r + tgt.r + 4 && f.hitCd <= 0) {
        tgt.hp -= f.def.dmg; f.hitCd = 1;
        burst(tgt.x, tgt.y, '#ccc', 5, 120);
        if (tgt.hp <= 0) tgt.life = 0;
      }
    } else if (dp < f.r + PLAYER_R + 2 && f.hitCd <= 0) {
      hurtPlayer(f.def.dmg);
      f.hitCd = 1;
      knock(f, player.x, player.y, 160);
    }
  }

  // keep regular foes from piling onto one spot
  separate(foes.filter(f => !f.boss));

  if (spawnQueue.length) { foes.push(...spawnQueue); spawnQueue = []; }
  foes = foes.filter(f => !f.dead || f.boss || f.proxyOf);
}

function updateShots(dt) {
  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (inWall(s.x, s.y)) { s.life = 0; burst(s.x, s.y, '#999', 4, 100); continue; }
    for (const f of foes) {
      if (s.life <= 0) break;
      if (f.dead || s.hit.has(f)) continue;
      if (Math.hypot(f.x - s.x, f.y - s.y) < s.r + f.r) {
        s.hit.add(f);
        const dealt = damageFoe(f, s.dmg, s.type, s.ally);
        if (s.fx === 'woven') { applyWovenFx(f, s.spec, dealt, s); react(s.type, s.x, s.y, 40); }
        if (s.fx === 'slow') f.slow = 2.5;
        if (s.fx === 'burn') f.burn = Math.max(f.burn || 0, 2);
        if (s.fx === 'freeze') applyCC(f, 'freeze', 3);
        if (s.fx === 'hex') applyCC(f, 'hex', 6);
        if (s.fx === 'drain' && dealt) healPlayer(dealt * 0.6);
        if (s.fx === 'poison') { f.poison = Math.max(f.poison, 3); f.poisonDps = Math.max(f.poisonDps, 0.6); }
        if (s.fx === 'explode') { SFX.explode(false); aoe(s.x, s.y, s.boomR, s.boom, s.type, 120); burst(s.x, s.y, s.color, 22, 300); }
        else if (s.fx === 'woven') elemHit(ELEM_OF[s.type] || s.type, s.x, s.y, 0.8);
        else burst(s.x, s.y, s.color, 5, 140);
        if (s.pierce-- <= 0) s.life = 0;
      }
    }
  }
  shots = shots.filter(s => s.life > 0);

  const edt = dt * timeScale();
  for (const s of enemyShots) {
    s.x += s.vx * edt; s.y += s.vy * edt; s.life -= edt;
    if (inWall(s.x, s.y)) { s.life = 0; continue; }
    if (solidTemps().some(b => Math.hypot(b.x - s.x, b.y - s.y) < b.r + s.r)) { s.life = 0; burst(s.x, s.y, '#999', 4, 100); continue; }
    const guard = allies.find(a => a.kind === 'golem' && Math.hypot(a.x - s.x, a.y - s.y) < a.r + s.r + 4);
    if (guard) { guard.hp -= s.dmg; if (guard.hp <= 0) guard.life = 0; s.life = 0; burst(s.x, s.y, '#aaa', 5, 100); continue; }
    if (Math.hypot(player.x - s.x, player.y - s.y) < s.r + PLAYER_R + (player.mirror > 0 ? 14 : 0)) {
      if (player.mirror > 0) {
        // Mirror Shield: send it back as your own shot; reflected magic hurts even guardians
        const sp = Math.hypot(s.vx, s.vy) || 1;
        launch(s.x, s.y, { x: -s.vx / sp, y: -s.vy / sp }, { dmg: s.dmg * 2, type: 'mirror', speed: sp * 1.4, r: s.r });
        SFX.block();
        s.life = 0;
        continue;
      }
      hurtPlayer(s.dmg); s.life = 0;
    }
  }
  enemyShots = enemyShots.filter(s => s.life > 0);
}

function updateAllies(dt) {
  for (const a of allies) {
    a.life -= dt; a.cd -= dt;
    if (a.kind === 'wisp') {
      // circles you and slowly heals you
      a.ang += 2.2 * dt;
      moveToward(a, player.x + Math.cos(a.ang) * 42, player.y + Math.sin(a.ang) * 42, 400, dt, 0);
      if (a.cd <= 0) {
        a.cd = 1;
        if (player.hp < player.maxHp) { healPlayer(0.8); fx.push({ kind: 'bolt', pts: [{ x: a.x, y: a.y }, { x: player.x, y: player.y }], life: 0.2, max: 0.2, color: '#9f9' }); }
      }
    } else if (a.kind === 'imp') {
      // runs ahead of you and draws enemies to it
      moveToward(a, player.x + player.face.x * 110, player.y + player.face.y * 110, 200, dt, 4);
      pushOut(a, a.r);
    } else if (a.kind === 'golem') {
      // plants itself between you and the nearest enemy; soaks bites and shots
      const t = nearestFoe(player.x, player.y, 400);
      const tx = t ? player.x + (t.x - player.x) * 0.45 : player.x + 50, ty = t ? player.y + (t.y - player.y) * 0.45 : player.y;
      moveToward(a, tx, ty, 120, dt, 4);
      pushOut(a, a.r);
    } else if (a.kind === 'critter') {
      updateCritter(a, dt);
    } else if (a.kind === 'dragon') {
      a.ang += 1.1 * dt;
      moveToward(a, player.x + Math.cos(a.ang) * 90, player.y + Math.sin(a.ang) * 60 - 40, 260, dt, 0);
      if (!player.loaded || player.loaded.key !== 'FFSAFF') a.life = Math.min(a.life, 1.5); // out of breath: flies off
    }
  }
  allies = allies.filter(a => {
    if (a.life > 0) return true;
    if (a.kind === 'imp') {
      // the decoy goes out with a bang
      aoe(a.x, a.y, 90, 4, 'fire', 220);
      burst(a.x, a.y, '#ff8a3a', 30, 320);
      SFX.explode(false);
    } else burst(a.x, a.y, '#aaa', 10, 120);
    return false;
  });
}

function updateEffects(dt) {
  for (const z of zones) {
    z.life -= dt; z.tick -= dt;
    if (z.tick <= 0) {
      z.tick = 0.5;
      for (const f of foes) {
        if (f.dead || Math.hypot(f.x - z.x, f.y - z.y) > z.r + f.r) continue;
        if (z.type === 'fire') { damageFoe(f, 1.5, 'fire'); continue; } // meteor crater
        if (z.type === 'mud') { applyCC(f, 'root', 0.7); continue; }
        if (z.type === 'vortex') { damageFoe(f, 0.5, 'air'); continue; }
        if (z.type === 'spring') continue;
        if (z.type === 'woven') {
          const dealt = damageFoe(f, 0.5 * z.spec.power, z.spec.elem);
          applyWovenFx(f, z.spec, dealt, z, true);
          if (z.charged > 0) { damageFoe(f, 0.8, 'lightning'); applyCC(f, 'stun', 0.5); }
          continue;
        }
        damageFoe(f, 0.6, 'poison');
        f.poison = Math.max(f.poison, 2);
        f.poisonDps = Math.max(f.poisonDps, 1);
      }
    }
  }
  for (const z of zones) {
    if (z.type === 'vortex') {
      // drag everything inside toward the eye
      for (const f of foes) {
        if (f.dead || f.structure) continue;
        const dx = z.x - f.x, dy = z.y - f.y, d = Math.hypot(dx, dy);
        if (d > z.r || d < 6) continue;
        const pull = (f.boss ? 40 : 260) * dt;
        f.x += dx / d * Math.min(pull, d); f.y += dy / d * Math.min(pull, d);
      }
    }
    if (z.type === 'woven') {
      if (z.charged > 0 && z.charged < 90) z.charged -= dt;
      // a sacred circle (or any pool with a Spirit upgrade) heals you while you stand in it
      if ((z.spec.elem === 'spirit' || z.spec.heal) && Math.hypot(player.x - z.x, player.y - z.y) < z.r)
        player.hp = Math.min(player.maxHp, player.hp + 1.5 * dt);
      // a whirlwind drags enemies toward its eye
      if (z.spec.elem === 'air') for (const f of foes) {
        if (f.dead || f.structure) continue;
        const dx = z.x - f.x, dy = z.y - f.y, d = Math.hypot(dx, dy);
        if (d < z.r && d > 6) { const pull = (f.boss ? 20 : 90) * dt; f.x += dx / d * pull; f.y += dy / d * pull; }
      }
    }
    if (z.type === 'spring' && Math.hypot(player.x - z.x, player.y - z.y) < z.r) {
      player.hp = Math.min(player.maxHp, player.hp + 2.5 * dt);
      player.mana = Math.min(player.maxMana, player.mana + 1 * dt);
    }
  }
  zones = zones.filter(z => z.life > 0);

  for (const t of traps) {
    t.arm -= dt; t.life -= dt;
    if (t.arm > 0) continue;
    if (foes.some(f => !f.dead && Math.hypot(f.x - t.x, f.y - t.y) < f.r + 26)) {
      if (t.spec) { wovenBurstAt(t.x, t.y, 85 * t.spec.size, 3.5 * t.spec.power, t.spec); SFX.explode(false); t.life = 0; continue; }
      aoe(t.x, t.y, 75, 4, 'fire', 260);
      burst(t.x, t.y, '#ff8a3a', 26, 300);
      SFX.explode(false);
      t.life = 0;
    }
  }
  traps = traps.filter(t => t.life > 0);

  for (const b of tempSolids) {
    if (curSide === 'blue') b.life -= dt;
    if (!b.spec || (b.side || 'blue') !== curSide) continue;
    b.tick -= dt;
    if (b.tick > 0) continue;
    b.tick = 0.5;
    for (const f of foes) {
      if (f.dead || f.structure || Math.hypot(f.x - b.x, f.y - b.y) > b.r + f.r + 8) continue;
      const dmg = b.elem === 'fire' ? 0.8 * b.spec.power : b.elem === 'air' ? 0.3 * b.spec.power : 0;
      const dealt = dmg ? damageFoe(f, dmg, b.elem) : 0;
      applyWovenFx(f, b.spec, dealt, b);
      if (b.elem === 'spirit') applyCC(f, 'confuse', 3 * b.spec.dur);
    }
  }
  if (curSide === 'blue') tempSolids = tempSolids.filter(b => {
    if (b.life > 0) return true;
    burst(b.x, b.y, TYPE_COLOR.earth, 6, 100);
    return false;
  });

  for (const w of waves) {
    w.r += w.speed * dt;
    for (const f of foes) {
      if (f.dead || w.hit.has(f)) continue;
      if (Math.abs(Math.hypot(f.x - w.x, f.y - w.y) - w.r) < f.r + 14) {
        w.hit.add(f);
        damageFoe(f, w.dmg, w.type);
        knock(f, w.x, w.y, 340);
      }
    }
  }
  waves = waves.filter(w => w.r < w.maxR);

  for (const m of meteors) {
    m.t -= dt;
    if (m.t <= 0) {
      aoe(m.x, m.y, 200, 25, 'fire', 380);
      SFX.explode(true);
      zones.push({ x: m.x, y: m.y, r: 140, life: 4, max: 4, tick: 0, type: 'fire' });
      burst(m.x, m.y, '#ff5a2a', 80, 560);
      burst(m.x, m.y, '#ffd24a', 40, 340);
      shake = Math.max(shake, 20);
      flash = Math.max(flash, 0.35);
    }
  }
  meteors = meteors.filter(m => m.t > 0);
  if (curSide === 'blue') decayVisuals(dt);
}

// shared visuals fade (once a frame, whoever's side is running)
function decayVisuals(dt) {
  for (const e of fx) e.life -= dt;
  fx = fx.filter(e => e.life > 0);

  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    const damp = Math.max(0, 1 - 4 * dt);
    p.vx *= damp; p.vy *= damp;
    p.life -= p.decay * dt;
  }
  particles = particles.filter(p => p.life > 0);

  for (const t of floaters) { t.y -= 40 * dt; t.life -= dt; }
  floaters = floaters.filter(t => t.life > 0);
}

function showScroll(combo, title) {
  SFX.scroll();
  state = 'reveal';
  reveal = { combo, name: SPELLS[combo].name, title, t: 0 };
  movePtr = null; movePos = null; moveStart = null;
  castPtr = null; finger = null; seq = [];
  player.charging = null;
}
function openChest(c) {
  c.opened = true;
  showScroll(c.boss.def.reward, 'AN ANCIENT SCROLL');
}

function closeReveal() {
  reveal = null;
  if (bossesDown === BOSSES.length && !wonShown) {
    wonShown = true;
    state = 'won';
    overlayT = 0;
  } else {
    state = 'play';
  }
}

function heroMove(dt) {
  // movement: keyboard + held pointer on the field (not while waiting to respawn)
  let mx = 0, my = 0;
  if (state !== 'play') { movePos = null; for (const k in keys) keys[k] = false; }
  if (keys.KeyW || keys.ArrowUp)    my -= 1;
  if (keys.KeyS || keys.ArrowDown)  my += 1;
  if (keys.KeyA || keys.ArrowLeft)  mx -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (movePos && moveStart && moveStart.shooting) {
    shootArrow(player.x + movePos.x - W / 2, player.y + movePos.y - playerScreenY()); // held: keep firing
  } else if (movePos && moveStart && (moveStart.moved || performance.now() - moveStart.t > 180)) {
    // without tilt, a held finger walks once it's clearly a hold or a drag, not a tap
    const dx = movePos.x - W / 2, dy = movePos.y - playerScreenY(), d = Math.hypot(dx, dy);
    if (d > 14) { mx += dx / d; my += dy / d; }
  }
  const t = tiltVector();
  mx += t.x; my += t.y;
  // analog: a gentle tilt walks slowly, anything else is capped at full speed
  let ml = Math.hypot(mx, my);
  player.moving = ml > 0.02 && !player.charging && state === 'play'; // charging a big spell roots you
  if (player.moving) {
    mx /= ml; my /= ml;
    ml = Math.min(1, ml);
    movePlayer(mx, my, (player.onBoat ? 230 : 170) * ml * (player.haste > 0 ? 1.6 : 1) * dt);
    player.face = { x: mx, y: my };
    if (player.haste > 0 && Math.random() < 0.5) {
      particles.push({ x: player.x, y: player.y + 10, vx: 0, vy: 0, r: 3, life: 0.6, decay: 2, color: TYPE_COLOR.air });
    }
  }
}

function update(dt) {
  elapsed += dt;

  heroMove(dt);

  // board the boat by walking into it
  player.boardCd = Math.max(0, player.boardCd - dt);
  if (!player.onBoat && player.boardCd <= 0 && dist(player, boat) < 52) {
    player.onBoat = true;
    player.x = boat.x; player.y = boat.y;
    castMessage('All aboard! Sail to land to step off', '#bfe6ff');
    SFX.splash();
  }

  heroTimers(dt);
  timeWarp = Math.max(0, timeWarp - dt);
  timeStop = Math.max(0, timeStop - dt);

  if (mode === 'battle') updateBattle(dt);
  else spawnFoes(dt * timeScale());
  updateFoes(dt);
  updateShots(dt);
  updateAllies(dt);
  updateStorms(dt);
  updateEffects(dt);
  if (versus) updateRival(dt);

  for (const c of chests) {
    if (!c.opened && c.boss.dead && state === 'play' && dist(c, player) < 44) openChest(c);
  }
  for (const sc of scrolls) {
    if (!sc.taken && state === 'play' && dist(sc, player) < 34) {
      sc.taken = true;
      showScroll(sc.combo, 'A LOST SCROLL');
    }
  }
}

// timers, mana and buffs for whichever hero is current
function heroTimers(dt) {
  if (player.charging) {
    player.charging.t -= dt;
    if (player.charging.t <= 0) { const k = player.charging.key; player.charging = null; releaseSpell(k); }
  }
  player.arrowCd = Math.max(0, player.arrowCd - dt);

  player.invuln  = Math.max(0, player.invuln - dt);
  player.skin    = Math.max(0, player.skin - dt);
  player.haste   = Math.max(0, player.haste - dt);
  player.empower = Math.max(0, player.empower - dt);
  const inEnemyGround = mode === 'battle' && cellOwner(player.x, player.y) === (curSide === 'red' ? 1 : 2);
  player.mana    = Math.min(player.maxMana, player.mana + (inEnemyGround ? 0.6 : 2.2) * dt);
  const fp = fountainPos(curSide);
  if ((state === 'play' || curSide === 'red') && !player.dead && Math.hypot(player.x - fp.x, player.y - fp.y) < SHRINE_R) {
    player.hp   = Math.min(player.maxHp, player.hp + 3 * dt);
    player.mana = Math.min(player.maxMana, player.mana + 3 * dt);
  }

  for (const k of ['omni', 'mirror', 'sanct', 'phoenix', 'regen']) player[k] = Math.max(0, player[k] - dt);
  if (player.charge) for (const t of CHARGE_TYPES) player.charge[t] = Math.min(1, player.charge[t] + CHARGE_REGEN * dt);
  if (player.chargeTxtCd > 0) player.chargeTxtCd -= dt;
  if (player.regen > 0) player.hp = Math.min(player.maxHp, player.hp + 1.2 * dt);
}

// Walk (or sail) one step, sliding along obstacles.
function movePlayer(dx, dy, step) {
  let nx = clamp(player.x + dx * step, -WORLD, WORLD);
  let ny = clamp(player.y + dy * step, -boundY(), boundY());
  if (mode === 'battle') { const c = clampArena({ x: nx, y: ny }, PLAYER_R); nx = c.x; ny = c.y; }
  if (player.onBoat) {
    // the boat stays on water; steering into land steps you ashore
    const ahead = { x: nx + dx * 14, y: ny + dy * 14 };
    if (isWater(ahead.x, ahead.y)) {
      player.x = boat.x = nx; player.y = boat.y = ny;
      return;
    }
    // step ashore straight ahead, or a little to either side if that spot is taken
    const base = Math.atan2(dy, dx);
    for (const off of [0, 0.4, -0.4, 0.8, -0.8]) {
      for (const reach of [36, 50]) {
        const lx = player.x + Math.cos(base + off) * reach, ly = player.y + Math.sin(base + off) * reach;
        if (blockedForFoot(lx, ly, PLAYER_R)) continue;
        player.onBoat = false;
        player.boardCd = 1.2;
        player.x = lx; player.y = ly;
        return;
      }
    }
    return;
  }
  // on foot: no wading into the lake; slide along one axis if the other is blocked
  if (!isWater(nx, ny)) { player.x = nx; player.y = ny; }
  else if (!isWater(nx, player.y)) player.x = nx;
  else if (!isWater(player.x, ny)) player.y = ny;
  pushOut(player, PLAYER_R);
}


// ── battle mode ─────────────────────────────────────────────────────────────
// A 5-minute points match between blue (you) and red. It ends when the clock
// runs out (most points wins) or a home base is destroyed (its destroyer wins).
// Three ways to score:
//  · Ground: towers joined by laser lines enclose each side's ground. The
//    side holding more ground when the match ends scores 150.
//  · Kills: 1 per minion, 3 per wizard, 5 per titan, 5 per tower.
//  · Sigils: each side has one sigil in its own ground. Destroying the
//    other side's scores 30; it reappears elsewhere behind a 15s wall.
// Build turns alternate: on yours, build a turret (claims open ground) or a titan.
let difficulty = 'easy';
let friends = [];   // blue units and structures (your side)
let bshots = [];    // shots from units and towers
let teams = null;
let links = [];     // laser walls between friendly towers
const MATCH_TIME = 300, BUILD_EVERY = 10, SIGIL_WALL = 15, GROUND_BONUS = 150, BASE_BONUS = 40;
const FRONT_X = WORLD * 0.32; // the line (±) behind which each side holds 30% of the oval at the start
const TEAM_COLOR = { blue: '#4aa8ff', red: '#ff4a5a' };
const UNITS = {
  // five kinds of minion, one per element; weak alone but plentiful
  wisp:   { name: 'Wisp',   elem: 'spirit', pts: 1, hp: 3,   spd: 72, r: 9,  range: 140, dmg: 0.5, cd: 1.0, aggro: 220, ranged: true, flying: true },
  archer: { name: 'Archer', elem: 'water',  pts: 1, hp: 3,   spd: 64, r: 9,  range: 170, dmg: 0.6, cd: 1.2, aggro: 230, ranged: true },
  imp:    { name: 'Imp',    elem: 'fire',   pts: 1, hp: 3.5, spd: 84, r: 10, range: 24,  dmg: 0.9, cd: 0.9, aggro: 220 },
  brute:  { name: 'Brute',  elem: 'earth',  pts: 1, hp: 6,   spd: 56, r: 12, range: 24,  dmg: 0.8, cd: 1.1, aggro: 200 },
  flyer:  { name: 'Flyer',  elem: 'air',    pts: 1, hp: 3,   spd: 96, r: 9,  range: 22,  dmg: 0.6, cd: 0.8, aggro: 220, flying: true },
  wizard: { name: 'Wizard', pts: 3, hp: 26,  spd: 86, r: 15, range: 250, dmg: 2.5, cd: 1.4, aggro: 330, ranged: true },
  titan:  { name: 'Titan',  pts: 5, hp: 55,  spd: 32, r: 30, range: 48,  dmg: 3,   cd: 2.2, aggro: 240, splash: 45 },
  // turrets sting but don't dominate; a few focused hits bring one down
  turret: { name: 'Turret', pts: 5, hp: 45,  spd: 0,  r: 24, range: 260, dmg: 2.2, cd: 1.4, aggro: 260, ranged: true, structure: true },
  nexus:  { name: 'Base',   pts: 0, hp: 250, spd: 0,  r: 55, range: 300, dmg: 2.5, cd: 1.6, aggro: 300, ranged: true, structure: true },
  sigil:  { name: 'Sigil',  pts: 30, hp: 40, spd: 0,  r: 20, range: 0,   dmg: 0,   cd: 99,  aggro: 0,   structure: true, passive: true },
};
for (const k in UNITS) { UNITS[k].mult = {}; UNITS[k].color = '#ccc'; }
const MINION_KINDS = ['wisp', 'archer', 'imp', 'brute', 'flyer']; // pentagram order: S W F E A
const MINION_OF = { spirit: 'wisp', water: 'archer', fire: 'imp', earth: 'brute', air: 'flyer' };
const isMinion = u => MINION_KINDS.includes(u.kind);
// unit against unit: the five-element cycle decides
function matchup(attElem, defUnit) { return elemMult(attElem, defUnit && defUnit.elem); }

function teamSide(team) { return team === 'blue' ? -1 : 1; }
function otherTeam(team) { return team === 'blue' ? 'red' : 'blue'; }
function teamList(team) { return team === 'red' ? foes : friends; }
function nexusOf(team) { return teamList(team).find(u => u.kind === 'nexus' && !u.dead); }
function towersOf(team) { return teamList(team).filter(u => !u.dead && (u.kind === 'turret' || u.kind === 'nexus')); }
// a fresh sigil is walled in for a while
function shielded(u) { return u.kind === 'sigil' && u.wall > 0; }
function shieldText(u) { return `WALLED ${Math.ceil(u.wall)}s`; }
function fountainPos(side) { return mode === 'battle' ? { x: (side === 'red' ? 1 : -1) * (BASE_X - 170), y: 0 } : { x: 0, y: 0 }; }

function teamScore(team, n, x, y) {
  if (!teams || n <= 0) return;
  teams[team].score += n;
  floatText(x, y, '+' + n, TEAM_COLOR[team], n >= 30 ? 22 : 14);
}

function addUnit(team, kind, x, y, elem) {
  const def = UNITS[kind];
  const u = {
    elem: def.elem || elem || null,
    unit: true, team, kind, def, x, y, hp: def.hp, maxHp: def.hp, r: def.r, spd: def.spd * rnd(0.92, 1.08),
    structure: !!def.structure, cd: rnd(0.2, def.cd), laneY: clamp(y, -ARENA_H + 70, ARENA_H - 70),
    kx: 0, ky: 0, slow: 0, poison: 0, poisonDps: 0, poisonTick: 0, flash: 0, hitCd: 0, txtCd: 0,
    wob: rnd(0, TAU), dead: false, boss: false, wall: 0, laserT: 0, slot: rnd(0, TAU), walk: 0, slamT: 0,
  };
  u.id = ++unitSeq;
  teamList(team).push(u);
  return u;
}

// ── territory ──
// Each side's towers are joined by lines; the shape they make together with that
// side's back edge of the map is its ground. Where two shapes overlap, the ground
// goes to whoever's tower is nearer. Counted on a grid of small cells.
const CELL = 50, COLS = Math.ceil(WORLD * 2 / CELL), ROWS = Math.ceil(ARENA_H * 2 / CELL);
const terr = new Int8Array(COLS * ROWS); // 0 open ground, 1 blue, 2 red
const inOval = new Uint8Array(COLS * ROWS); // cells that are part of the field
let FIELD_CELLS = 0;
for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
  const c = { x: -WORLD + (i + 0.5) * CELL, y: -ARENA_H + (j + 0.5) * CELL };
  if (inArena(c.x, c.y)) { inOval[j * COLS + i] = 1; FIELD_CELLS++; }
}
let hulls = { blue: [], red: [] };
function cellCenter(i, j) { return { x: -WORLD + (i + 0.5) * CELL, y: -ARENA_H + (j + 0.5) * CELL }; }
function cellOwner(x, y) {
  const i = Math.floor((x + WORLD) / CELL), j = Math.floor((y + ARENA_H) / CELL);
  if (i < 0 || j < 0 || i >= COLS || j >= ROWS) return -1;
  return terr[j * COLS + i];
}

// convex hull (monotone chain); points keep their tower reference if they have one
function hull(pts) {
  const p = pts.slice().sort((a, b) => a.x - b.x || a.y - b.y);
  if (p.length < 3) return p;
  const cross = (o, a, b) => (a.x - o.x) * (b.y - o.y) - (a.y - o.y) * (b.x - o.x);
  const lo = [], hi = [];
  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }
  for (let i = p.length - 1; i >= 0; i--) { const q = p[i]; while (hi.length >= 2 && cross(hi[hi.length - 2], hi[hi.length - 1], q) <= 0) hi.pop(); hi.push(q); }
  return lo.slice(0, -1).concat(hi.slice(0, -1));
}
function polyArea(poly) {
  let a = 0;
  for (let i = 0; i < poly.length; i++) { const p = poly[i], q = poly[(i + 1) % poly.length]; a += p.x * q.y - q.x * p.y; }
  return Math.abs(a) / 2;
}
function inPoly(x, y, poly) {
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
    const a = poly[i], b = poly[j];
    if ((a.y > y) !== (b.y > y) && x < (b.x - a.x) * (y - a.y) / (b.y - a.y) + a.x) inside = !inside;
  }
  return inside;
}
function teamShape(team, extra) {
  const sx = teamSide(team) * WORLD;
  const pts = towersOf(team).map(t => ({ x: t.x, y: t.y, t }));
  if (extra) pts.push(extra);
  pts.push({ x: sx, y: -ARENA_H }, { x: sx, y: ARENA_H });
  return hull(pts);
}

function computeTerritory() {
  hulls.blue = teamShape('blue');
  hulls.red = teamShape('red');
  const bt = towersOf('blue'), rt = towersOf('red');
  const nearest = (list, x, y) => Math.min(...list.map(t => Math.hypot(t.x - x, t.y - y)));
  let b = 0, r = 0;
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    const c = cellCenter(i, j);
    if (!inOval[j * COLS + i]) { terr[j * COLS + i] = 0; continue; }
    const inB = inPoly(c.x, c.y, hulls.blue), inR = inPoly(c.x, c.y, hulls.red);
    let v = inB ? 1 : 0;
    if (inR && (!inB || nearest(rt, c.x, c.y) < nearest(bt, c.x, c.y))) v = 2;
    terr[j * COLS + i] = v;
    if (v === 1) b++; else if (v === 2) r++;
  }
  teams.blue.cells = b; teams.red.cells = r;
  // the lines joining each side's towers (the edge of its shape) are laser walls
  links = [];
  for (const team of ['blue', 'red']) {
    const h = hulls[team];
    for (let i = 0; i < h.length; i++) {
      const a = h[i], c = h[(i + 1) % h.length];
      if (a.t && c.t) links.push({ a: a.t, b: c.t, team });
    }
  }
}

function canBuildAt(x, y) {
  if (cellOwner(x, y) !== 0) return false;
  if (!inArena(x, y, 60)) return false;
  return !friends.concat(foes).some(u => !u.dead && u.structure && Math.hypot(u.x - x, u.y - y) < 140);
}

function buildTurret(team, x, y, elem) {
  addUnit(team, 'turret', x, y, elem);
  computeTerritory();
  ring(x, y, 120, TEAM_COLOR[team], 0.8);
  burst(x, y, TEAM_COLOR[team], 30, 260);
  SFX.summon();
  showBanner(`${team === 'blue' ? 'Your' : 'Red built a'} ${ELEM_NAME[elem]} turret${team === 'blue' ? ' is up!' : ''}`, `Strong vs ${ELEM_NAME[elemBeats(elem)]}`, 2.5);
}
function buildTitan(team, elem) {
  const sd = teamSide(team);
  addUnit(team, 'titan', sd * (BASE_X - 120), rnd(-60, 60), elem).laneY = rnd(-200, 200);
  SFX.awaken();
  showBanner(team === 'blue' ? `Your ${ELEM_NAME[elem]} titan marches out!` : `Red sends a ${ELEM_NAME[elem]} titan!`, `Strong vs ${ELEM_NAME[elemBeats(elem)]}`, 2.5);
}

// red's build turn: a turret on the open spot that adds the most ground, or a
// titan when there's nowhere worth building
function redBuild() {
  // Hard: red finds the best spot. Easy: any spot that gains a fair bit.
  const base = polyArea(hulls.red), good = [];
  let best = null, gain = 20000;
  for (let k = 0; k < 60; k++) {
    const i = Math.floor(Math.random() * COLS), j = 1 + Math.floor(Math.random() * (ROWS - 2));
    if (terr[j * COLS + i] !== 0) continue;
    const c = cellCenter(i, j);
    if (!canBuildAt(c.x, c.y)) continue;
    const g = polyArea(teamShape('red', c)) - base;
    if (g > 20000) good.push(c);
    if (g > gain) { gain = g; best = c; }
  }
  if (difficulty === 'easy' && good.length) best = good[Math.floor(Math.random() * good.length)];
  // red picks the element that beats what you field most
  const fav = MINION_KINDS.reduce((a, b) => teams.blue.mix[a] >= teams.blue.mix[b] ? a : b);
  const want = ELEM_CYCLE.find(e => elemBeats(e) === UNITS[fav].elem);
  const elem = difficulty === 'hard' ? want : ELEM_CYCLE[Math.floor(Math.random() * 5)];
  if (best) buildTurret('red', best.x, best.y, elem);
  else buildTitan('red', elem);
}

// put a team's sigil somewhere in its own ground, away from its base
function placeSigil(team) {
  const want = team === 'blue' ? 1 : 2, nx = nexusOf(team), cells = [];
  for (let j = 1; j < ROWS - 1; j++) for (let i = 0; i < COLS; i++) {
    if (terr[j * COLS + i] !== want) continue;
    const c = cellCenter(i, j);
    if (nx && Math.hypot(c.x - nx.x, c.y - nx.y) < 280) continue;
    if (blockedForFoot(c.x, c.y, 24)) continue;
    cells.push(c);
  }
  const c = cells.length ? cells[Math.floor(Math.random() * cells.length)] : { x: nx.x - teamSide(team) * 320, y: rnd(-200, 200) };
  const s = addUnit(team, 'sigil', c.x + rnd(-25, 25), c.y + rnd(-25, 25));
  s.wall = SIGIL_WALL;
  ring(s.x, s.y, 60, TEAM_COLOR[team], 0.8);
  if (team === 'blue') showBanner('Your sigil appeared', 'Its wall falls in 15s: defend it!', 3);
}

function evenMix() { return Object.fromEntries(MINION_KINDS.map(k => [k, 1 / MINION_KINDS.length])); }

function startBattle(diff) {
  setMode('battle');
  difficulty = diff;
  resetPlayer();
  clearCombat();
  const fp = fountainPos();
  player.x = fp.x; player.y = fp.y; player.face = { x: 1, y: 0 };
  foes = []; friends = []; bshots = []; links = [];
  chests = []; scrolls = []; boat.x = boat.y = 1e6;
  discovered = new Set();
  bossesDown = 0; kills = 0; score = 0; elapsed = 0; tally = {}; masterHunter = false;
  banner = null; castMsg = null; reveal = null; wonShown = false;
  seq = []; curNode = null;
  const hard = diff === 'hard';
  // Easy: evenly matched, so you tip the balance. Hard: red sends far more minions and an extra wizard.
  teams = {
    blue: { score: 0, cells: 0, wave: 4, minions: 10, wizards: 2, wizQ: [], sigilT: 0, mix: evenMix() },
    red:  { score: 0, cells: 0, wave: 4, minions: hard ? 16 : 10, wizards: hard ? 3 : 2, wizQ: [], sigilT: 0, mix: evenMix() },
    buildElem: 'fire', // the element of your next turret or titan
    order: 'spread', // your army: 'spread' pushes on its own, 'follow' sticks with you
    orders: { minion: 'attackTurrets', titan: 'attackTurrets' }, // what each group does when spread out
    time: MATCH_TIME, terrRecalc: 0,
    build: { team: 'blue', t: BUILD_EVERY }, pending: null, result: null,
  };
  for (const team of ['blue', 'red']) {
    const sd = teamSide(team);
    addUnit(team, 'nexus', sd * BASE_X, 0);
    // the middle turret sits a little forward so every one of the three holds ground
    const els = ELEM_CYCLE.slice().sort(() => Math.random() - 0.5);
    const edgeY = ARENA_H * Math.sqrt(1 - (FRONT_X / WORLD) ** 2) - 30; // just inside the oval's rim
    addUnit(team, 'turret', sd * FRONT_X, -edgeY, els[0]);
    addUnit(team, 'turret', sd * (FRONT_X - 70), 0, els[1]);
    addUnit(team, 'turret', sd * FRONT_X, edgeY, els[2]);
    const n = teams[team].wizards;
    for (let i = 0; i < n; i++) addUnit(team, 'wizard', sd * (BASE_X - 130), (i - (n - 1) / 2) * 110, ELEM_CYCLE[(i * 2 + (team === 'red' ? 1 : 0)) % 5]);
  }
  computeTerritory();
  placeSigil('blue');
  placeSigil('red');
  state = 'play';
  showBanner(hard ? 'Battle · Hard' : 'Battle · Easy', 'Most points in 5 minutes wins', 4.5);
}

// Who a unit fights: the nearest opponent it can see (walled sigils and bases are ignored).
function findTarget(u) {
  const opp = u.team === 'blue'
    ? foes.concat(rivalHelpers())
    : (state === 'play' && !player.onBoat ? [player] : []).concat(friends, allies.filter(a => a.kind === 'critter'));
  let best = null, bd = u.def.aggro;
  for (const o of opp) {
    if (o.dead || (o.unit && shielded(o))) continue;
    const d = Math.hypot(o.x - u.x, o.y - u.y) - (o.r || PLAYER_R);
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}

// Where a unit heads when nothing is in reach: the enemy sigil (unless walled),
// otherwise the nearest enemy turret, otherwise the edge of the enemy base.
// Your orders for a unit (red always attacks turrets, then the base).
function rivalHelpers() { return versus && net.role === 'host' ? redSide.allies.filter(a => a.kind === 'critter' && a.life > 0) : []; }
// a team's army stance and its leader (red only has one in a duel)
function teamStance(team) { return team === 'blue' ? teams.order : (versus && teams.redOrder) || 'spread'; }
function teamLeader(team) { return team === 'blue' ? (state === 'play' ? hostP : null) : (versus && rivalP && !rivalP.dead ? rivalP : null); }

function orderFor(u) {
  if (!teams) return 'attackTurrets';
  const ords = u.team === 'blue' ? teams.orders : versus ? teams.redOrders : null;
  if (!ords) return 'attackTurrets';
  if (isMinion(u)) return ords.minion;
  if (u.kind === 'titan') return ords.titan;
  return 'attackTurrets';
}

// Where a guard stands: by the base, or by the turret most under threat
// (or the one furthest forward when none is).
function guardPost(u, what) {
  const home = nexusOf(u.team);
  if (what === 'base' || !teamList(u.team).some(t => t.kind === 'turret' && !t.dead)) return home;
  const enemies = teamList(otherTeam(u.team)).filter(o => !o.dead && !o.structure);
  let best = null, score = -Infinity;
  for (const t of teamList(u.team)) {
    if (t.kind !== 'turret' || t.dead) continue;
    const near = enemies.filter(o => Math.hypot(o.x - t.x, o.y - t.y) < 450).length;
    const sc = near * 1000 - Math.abs(t.x) * 0.5 - Math.hypot(t.x - u.x, t.y - u.y) * 0.1;
    if (sc > score) { score = sc; best = t; }
  }
  return best || home;
}

function objectiveFor(u) {
  const enemy = teamList(otherTeam(u.team)).filter(o => !o.dead && o.structure && !shielded(o));
  if (orderFor(u) === 'attackBase') { const nx = nexusOf(otherTeam(u.team)); if (nx) return nx; }
  if (u.kind !== 'titan') { const sig = enemy.find(o => o.kind === 'sigil'); if (sig) return sig; }
  let best = null, bd = Infinity;
  for (const o of enemy) { if (o.kind !== 'turret') continue; const d = Math.hypot(o.x - u.x, o.y - u.y); if (d < bd) { bd = d; best = o; } }
  if (best) return best;
  const nx = nexusOf(otherTeam(u.team));
  return nx || null; // no turrets left: go for the base
}

function unitAttack(u, tgt) {
  if (u.cd > 0 || u.hex > 0 || u.def.passive) return;
  u.cd = u.def.cd;
  if (u.def.ranged) {
    const dx = tgt.x - u.x, dy = tgt.y - u.y, d = Math.hypot(dx, dy) || 1;
    const big = u.structure, sp = big ? 360 : 420;
    const boom = u.kind === 'wizard' && Math.random() < 0.2 ? 70 : 0; // wizards sometimes throw a fireball
    const small = u.kind === 'archer';
    const oy = u.kind === 'turret' ? -u.r * 1.35 : 0; // turrets fire from their crystal
    bshots.push({ team: u.team, src: u.elem, elem: u.elem, x: u.x + dx / d * u.r, y: u.y + oy + dy / d * u.r, vx: dx / d * sp, vy: dy / d * sp,
                  dmg: u.def.dmg * (boom ? 1.3 : 1), r: big ? 9 : boom ? 9 : small ? 4 : 6, life: 1.8, boom, arrow: small,
                  color: TYPE_COLOR[u.elem] || TEAM_COLOR[u.team], spin: rnd(0, TAU) });
    u.fireFlash = 0.18;
    return;
  }
  if (u.kind === 'titan') {
    // the slam lands a beat after the swing starts
    u.slamT = 0.5;
    u.slamAt = { x: tgt.x, y: tgt.y, tgt };
    return;
  }
  hitUnit(tgt, u.def.dmg * matchup(u.elem, tgt));
}

function titanSlam(u) {
  const { x, y, tgt } = u.slamAt;
  if (tgt && !tgt.dead) hitUnit(tgt, u.def.dmg * matchup(u.elem, tgt));
  // everything of the other side nearby gets hit too
  const opp = u.team === 'blue' ? foes : friends.concat(state === 'play' ? [player] : []);
  for (const o of opp) if (o !== tgt && !o.dead && Math.hypot(o.x - x, o.y - y) < u.def.splash) hitUnit(o, u.def.dmg * 0.5 * matchup(u.elem, o));
  ring(x, y, u.def.splash, TYPE_COLOR[u.elem] || TEAM_COLOR[u.team], 0.35);
  ring(x, y, u.def.splash * 0.5, '#d8c8a0', 0.25);
  if (u.elem) elemHit(u.elem, x, y, 2.6);
  for (let i = 0; i < 14; i++) {
    const a = rnd(0, TAU), sp = rnd(60, 180);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.5, r: rnd(3, 6), life: 1, decay: rnd(1.5, 2.5), color: '#8a7a5e' });
  }
  shake = Math.max(shake, 5);
  SFX.explode(false);
  u.slamAt = null;
}

// Damage from the AI and laser walls. Your own hits go through damageFoe.
function hitUnit(t, dmg) {
  if (t === player) { hurtPlayer(dmg); return; }
  if (t.proxyOf) { if (!t.dead) hurtPlayer(dmg, heroOf(t)); return; }
  if (t.kind === 'critter') { t.hp -= dmg; burst(t.x, t.y, '#ccc', 4, 100); if (t.hp <= 0) t.life = 0; return; }
  if (t.dead) return;
  if (shielded(t)) {
    if (t.txtCd <= 0) { floatText(t.x, t.y - t.r - 10, shieldText(t), '#bde', 13); t.txtCd = 0.8; }
    return;
  }
  t.hp -= dmg;
  t.flash = 0.12;
  if (t.hp <= 0) unitFell(t);
}

// A unit is gone. Whoever's side it wasn't on scores for it.
function unitFell(u) {
  u.dead = true;
  const by = otherTeam(u.team);
  teamScore(by, u.def.pts, u.x, u.y - u.r - 20);
  burst(u.x, u.y, TEAM_COLOR[u.team], u.structure ? 60 : 14, u.structure ? 420 : 240);
  if (u.kind === 'wizard') teams[u.team].wizQ.push({ t: 12 });
  if (u.kind === 'sigil') {
    teams[u.team].sigilT = 3;
    shake = Math.max(shake, 10);
    SFX.bossDown();
    showBanner(by === 'blue' ? 'You broke the red sigil! +30' : 'Red broke your sigil! +30 to red', 'A new one will appear', 3);
  }
  if (u.kind === 'nexus') { battleOver(u.team); return; }
  if (u.kind === 'turret') {
    shake = Math.max(shake, 12);
    SFX.explode(true);
    computeTerritory();
    showBanner(u.team === 'red' ? 'Red turret destroyed!' : 'Your turret has fallen!', 'That ground is open again', 3);
  }
}

// who'd get the ground bonus right now (null if level)
function groundLeader() {
  if (!teams || teams.blue.cells === teams.red.cells) return null;
  return teams.blue.cells > teams.red.cells ? 'blue' : 'red';
}

// The match ends when the clock runs out or a base falls. Destroying a base
// scores 40; the 150 for the most ground is paid now; then most points wins.
function battleOver(baseFell) {
  if (state !== 'play' && state !== 'dead') return;
  if (baseFell) teams[otherTeam(baseFell)].score += BASE_BONUS;
  computeTerritory();
  const g = groundLeader();
  if (g) { teams[g].score += GROUND_BONUS; teams.groundTo = g; }
  const b = teams.blue.score, r = teams.red.score;
  teams.endedBy = baseFell ? 'base' : 'time';
  teams.baseFell = baseFell;
  teams.result = b > r ? 'win' : b < r ? 'lose' : 'draw';
  state = teams.result === 'win' ? 'won' : 'lost';
  overlayT = 0;
  flash = 1;
  teams.result === 'win' ? SFX.bossDown() : SFX.death();
  if (versus && net.role === 'host') { net.send(makeSnapshot()); netEvents = []; }
}

function updateUnit(u, dt) {
  u.cd -= dt;
  if (u.fireFlash > 0) u.fireFlash -= dt;
  u.flash = Math.max(0, u.flash - dt);
  u.txtCd -= dt;
  if (u.slamT > 0) {
    u.slamT -= dt;
    if (u.slamT <= 0.18 && u.slamAt) titanSlam(u);
    if (u.slamT > 0) return; // a titan mid-swing stays put
  }
  if (u.kind === 'sigil') { u.wall = Math.max(0, u.wall - dt); return; }
  if (u.structure) {
    const t = findTarget(u);
    if (t && Math.hypot(t.x - u.x, t.y - u.y) <= u.def.range + (t.r || PLAYER_R)) unitAttack(u, t);
    return;
  }
  // hurt wizards fall back to their base to heal
  if (u.kind === 'wizard' && u.hp < u.maxHp * 0.3) u.retreat = true;
  const home = nexusOf(u.team);
  let tx = null, ty = null;
  if (u.retreat && home) {
    tx = home.x - teamSide(u.team) * 130; ty = home.y;
    if (Math.hypot(tx - u.x, ty - u.y) < 160) u.hp = Math.min(u.maxHp, u.hp + 8 * dt);
    if (u.hp >= u.maxHp * 0.95) u.retreat = false;
  } else if (teamStance(u.team) !== 'follow' && orderFor(u).startsWith('protect')) {
    // protect: hold near the base or a turret; only chase what comes close to it
    const post = guardPost(u, orderFor(u) === 'protectBase' ? 'base' : 'turrets');
    if (post) {
      const t = findTarget(u);
      if (t && Math.hypot(t.x - post.x, t.y - post.y) < 380) {
        const d = Math.hypot(t.x - u.x, t.y - u.y) - (t.r || PLAYER_R);
        if (d > u.def.range - 4) { tx = t.x; ty = t.y; } else unitAttack(u, t);
      } else {
        const rad = post.r + 40 + (u.wob % 1) * 50;
        const fwd = -teamSide(u.team) * 0.6; // stand mostly on the side facing the enemy
        tx = post.x + (Math.cos(u.slot) * 0.6 + fwd) * rad; ty = post.y + Math.sin(u.slot) * rad;
        if (Math.hypot(tx - u.x, ty - u.y) < 10) tx = null;
      }
    }
  } else if (teamStance(u.team) === 'follow' && teamLeader(u.team)) {
    // follow me: fight what comes near the leader, otherwise keep formation around them
    const L = teamLeader(u.team);
    const t = findTarget(u);
    if (t && Math.hypot(t.x - L.x, t.y - L.y) < 340) {
      const d = Math.hypot(t.x - u.x, t.y - u.y) - (t.r || PLAYER_R);
      if (d > u.def.range - 4) { tx = t.x; ty = t.y; } else unitAttack(u, t);
    } else {
      const rad = u.kind === 'titan' ? 120 : u.kind === 'wizard' ? 90 : 60 + (u.wob % 1) * 50;
      tx = L.x - L.face.x * 40 + Math.cos(u.slot) * rad;
      ty = L.y - L.face.y * 40 + Math.sin(u.slot) * rad;
      if (Math.hypot(tx - u.x, ty - u.y) < 10) tx = null;
    }
  } else {
    const t = findTarget(u);
    if (t) {
      const d = Math.hypot(t.x - u.x, t.y - u.y) - (t.r || PLAYER_R);
      if (d > u.def.range - 4) { tx = t.x; ty = t.y; } else unitAttack(u, t);
    } else {
      const o = objectiveFor(u);
      if (o) {
        // spread out along the field until close, then converge
        const near = Math.abs(o.x - u.x) < 420;
        tx = o.x; ty = near ? o.y : (u.laneY + o.y) / 2;
      }
    }
  }
  if (tx !== null) {
    const spd = u.spd * (u.slow > 0 ? 0.5 : 1) * (u.hex > 0 ? 0.4 : 1) * (u.root > 0 ? 0 : 1);
    const ox = u.x, oy = u.y;
    moveToward(u, tx, ty, spd, dt, 0);
    const moved = Math.hypot(u.x - ox, u.y - oy);
    u.walk += moved;
    u.face = u.x !== ox ? Math.sign(u.x - ox) : u.face || 1;
    if (u.kind === 'titan' && moved > 0 && Math.floor(u.walk / 34) !== Math.floor((u.walk - moved) / 34)) {
      // footfall: a puff of dust under the stepping foot
      const side = Math.floor(u.walk / 34) % 2 ? 1 : -1;
      for (let i = 0; i < 4; i++) particles.push({ x: u.x + side * u.r * 0.45, y: u.y + u.r * 0.95, vx: rnd(-40, 40), vy: rnd(-25, 0), r: rnd(2, 4), life: 0.8, decay: 2.2, color: '#7a6c54' });
    }
  }
}

// ── elemental shot effects ──
function shotTrail(sh) {
  const sp = Math.hypot(sh.vx, sh.vy) || 1, bx = -sh.vx / sp, by = -sh.vy / sp;
  const p = (color, r, life, spread) => particles.push({ x: sh.x + bx * sh.r, y: sh.y + by * sh.r, vx: bx * 40 + rnd(-spread, spread), vy: by * 40 + rnd(-spread, spread), r, life, decay: 2.6, color });
  switch (sh.elem) {
    case 'fire':   p(Math.random() < 0.5 ? '#ffb04a' : '#ff5a2a', rnd(2, 4), 0.8, 30); break;   // embers
    case 'water':  p('#bfe6ff', rnd(1.5, 2.5), 0.6, 20); break;                                 // droplets
    case 'earth':  p('#8a6a44', rnd(1.5, 3), 0.7, 25); break;                                   // grit
    case 'air':    p('rgba(255,250,200,0.8)', 1.5, 0.5, 40); break;                             // gusts
    case 'spirit': p(Math.random() < 0.5 ? '#e6ccff' : '#c77dff', rnd(1.5, 2.5), 0.9, 15); break; // motes
  }
}
// an impact shaped like its element; size scales the effect
function elemHit(elem, x, y, size) {
  if (versus && net.role === 'host') netEvents.push(['eh', elem, Math.round(x), Math.round(y), size]);
  const c = TYPE_COLOR[elem];
  const spray = (n, spd, color, rmin, rmax, up) => {
    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU), s = rnd(spd * 0.3, spd);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (up || 0), r: rnd(rmin, rmax), life: 1, decay: rnd(1.8, 3), color });
    }
  };
  switch (elem) {
    case 'fire':   spray(10 * size, 180 * size, '#ff5a2a', 2, 4, 60); spray(6 * size, 120 * size, '#ffd24a', 1.5, 3, 80); break;
    case 'water':  ring(x, y, 16 * size, '#bfe6ff', 0.35); spray(10 * size, 160 * size, '#3ab0ff', 1.5, 3, 40); break;
    case 'earth':  spray(8 * size, 140 * size, '#8a6a44', 2, 5); spray(5 * size, 90 * size, '#b5834a', 2, 4); break;
    case 'air':    ring(x, y, 14 * size, '#f5e663', 0.25); ring(x, y, 24 * size, 'rgba(255,250,200,0.6)', 0.4); spray(6 * size, 200 * size, '#fffbe0', 1, 2); break;
    case 'spirit': ring(x, y, 18 * size, c, 0.45); spray(10 * size, 120 * size, '#e6ccff', 1.5, 3); break;
  }
}
function drawElemShot(sh) {
  const sp = Math.hypot(sh.vx, sh.vy) || 1, ux = sh.vx / sp, uy = sh.vy / sp, r = sh.r;
  ctx.save();
  ctx.translate(sh.x, sh.y);
  switch (sh.elem) {
    case 'fire': {
      // a flickering fireball with a flame tail
      const fl = 1 + Math.sin(sh.spin * 3) * 0.15;
      ctx.rotate(Math.atan2(uy, ux));
      const g = ctx.createLinearGradient(-r * 3.5, 0, r, 0);
      g.addColorStop(0, 'rgba(255,90,42,0)'); g.addColorStop(0.6, 'rgba(255,90,42,0.8)'); g.addColorStop(1, '#ffd24a');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(-r * 3.5 * fl, 0); ctx.quadraticCurveTo(-r, -r * 1.1, r * 0.4, -r * 0.8); ctx.lineTo(r * 0.4, r * 0.8); ctx.quadraticCurveTo(-r, r * 1.1, -r * 3.5 * fl, 0); ctx.fill();
      const c2 = ctx.createRadialGradient(r * 0.2, 0, 0, r * 0.2, 0, r * 1.1);
      c2.addColorStop(0, '#fff'); c2.addColorStop(0.4, '#ffd24a'); c2.addColorStop(1, '#ff5a2a');
      ctx.fillStyle = c2; ctx.beginPath(); ctx.arc(r * 0.2, 0, r * fl, 0, TAU); ctx.fill();
      break;
    }
    case 'water': {
      // a droplet pointed the way it flies
      ctx.rotate(Math.atan2(uy, ux));
      ctx.beginPath(); ctx.moveTo(r * 1.6, 0); ctx.quadraticCurveTo(0, -r * 1.2, -r, 0); ctx.quadraticCurveTo(0, r * 1.2, r * 1.6, 0);
      ctx.fillStyle = '#3ab0ff'; ctx.fill();
      ctx.strokeStyle = '#bfe6ff'; ctx.lineWidth = 1.5; ctx.stroke();
      circle(r * 0.3, -r * 0.3, r * 0.3, 'rgba(255,255,255,0.85)');
      break;
    }
    case 'earth': {
      // a tumbling chunk of rock
      ctx.rotate(sh.spin);
      ctx.beginPath();
      for (let i = 0; i < 6; i++) { const a = i * TAU / 6, rr = r * (i % 2 ? 0.8 : 1.15); i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fillStyle = '#8a6a44'; ctx.fill(); ctx.strokeStyle = '#5a4430'; ctx.lineWidth = 1.5; ctx.stroke();
      circle(-r * 0.25, -r * 0.25, r * 0.3, '#b5834a');
      break;
    }
    case 'air': {
      // a spinning wind blade
      ctx.rotate(sh.spin * 1.5);
      ctx.strokeStyle = '#f5e663'; ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        ctx.lineWidth = 2.5 - i * 0.6; ctx.globalAlpha = 1 - i * 0.25;
        ctx.beginPath(); ctx.arc(0, 0, r * (1.4 - i * 0.35), i * 2.1, i * 2.1 + 2.2); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      circle(0, 0, r * 0.35, '#fffbe0');
      break;

    case 'spirit': {

      g.addColorStop(0, '#fff'); g.addColorStop(0.35, '#c77dff'); g.addColorStop(1, 'rgba(199,125,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 2.2, 0, TAU); ctx.fill();
