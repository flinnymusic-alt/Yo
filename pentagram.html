try { for (const f of ['16px "Libre Caslon Text"', 'bold 16px "Libre Caslon Text"', 'italic 16px "Libre Caslon Text"', '40px "Libre Caslon Display"']) document.fonts.load(f); } catch (_) {}
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;

// Keep swipes inside the game: no page scrolling, pull-to-refresh or bounce.
for (const ev of ['touchstart', 'touchmove']) {
  document.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
}
document.addEventListener('gesturestart', e => e.preventDefault());

// ── sound effects (synthesised, no files) ───────────────────────────────────
const sfx = { ctx: null, out: null, noise: null, on: true, last: {} };
try { sfx.on = localStorage.getItem('pentagram-sound') !== 'off'; } catch (_) {}

function audioInit() {
  if (sfx.ctx) { if (sfx.ctx.state !== 'running') sfx.ctx.resume().catch(() => {}); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    sfx.ctx = new AC();
    sfx.out = sfx.ctx.createGain();
    sfx.out.gain.value = 0.45;
    sfx.out.connect(sfx.ctx.destination);
    const len = sfx.ctx.sampleRate;
    sfx.noise = sfx.ctx.createBuffer(1, len, len);
    const d = sfx.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (_) { sfx.ctx = null; }
}

// skip a sound if the same one played a moment ago (hit spam, poison ticks)
function sfxReady(name, gap) {
  if (!sfx.on || !sfx.ctx || sfx.ctx.state !== 'running') return false;
  const now = sfx.ctx.currentTime;
  if (gap && sfx.last[name] && now - sfx.last[name] < gap) return false;
  sfx.last[name] = now;
  return true;
}

function tone(freq, dur, type, vol, slideTo, delay) {
  const c = sfx.ctx, t = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(sfx.out);
  o.start(t); o.stop(t + dur + 0.05);
}

function hiss(dur, vol, filter, freq, slideTo, delay) {
  const c = sfx.ctx, t = c.currentTime + (delay || 0);
  const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  src.buffer = sfx.noise;
  f.type = filter || 'lowpass';
  f.frequency.setValueAtTime(freq || 1200, t);
  if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(sfx.out);
  src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
}

const EL_NOTE = { S: 880, A: 784, W: 659, F: 587, E: 440 };

const SFX = {
  node(el, n)   { if (sfxReady('node')) tone(EL_NOTE[el] * (1 + n * 0.06), 0.14, 'triangle', 0.22); },
  fizzle()      { if (!sfxReady('fizzle')) return; hiss(0.3, 0.15, 'lowpass', 1500, 200); tone(220, 0.3, 'sawtooth', 0.05, 70); },
  weave(key)    { if (!sfxReady('weave')) return; [...key].forEach((el, i) => tone(EL_NOTE[el], 0.18, 'triangle', 0.14, null, i * 0.045)); },
  loaded()      { if (sfxReady('loaded')) tone(1320, 0.12, 'sine', 0.1, null, 0.05); },
  charge(tier, dur) { if (sfxReady('charge')) { tone(110 + tier * 20, dur, 'sawtooth', 0.05, 330 + tier * 90); hiss(dur, 0.06, 'bandpass', 300, 3000); } },
  release(key) {
    if (!sfxReady('release', 0.04)) return;
    const tier = key.length, el = key[tier - 1];
    if (el === 'F') hiss(0.35, 0.18, 'bandpass', 700, 180);
    else if (el === 'W') { tone(900, 0.25, 'sine', 0.14, 300); hiss(0.2, 0.08, 'highpass', 4000); }
    else if (el === 'E') { tone(120, 0.3, 'sine', 0.3, 50); hiss(0.15, 0.1, 'lowpass', 400); }
    else if (el === 'A') hiss(0.3, 0.2, 'bandpass', 2500, 600);
    else { tone(1200, 0.4, 'sine', 0.1); tone(1800, 0.4, 'sine', 0.06, null, 0.03); }
    if (tier >= 4) boom(0.25 + tier * 0.1);
  },
  lightning()   { if (sfxReady('zap', 0.05)) { hiss(0.12, 0.2, 'highpass', 3000); tone(90, 0.1, 'square', 0.06, 40); } },
  arrow()       { if (sfxReady('arrow')) { hiss(0.08, 0.14, 'highpass', 3000); tone(700, 0.07, 'triangle', 0.08, 350); } },
  hit()         { if (sfxReady('hit', 0.05)) hiss(0.05, 0.1, 'bandpass', 1800); },
  immune()      { if (sfxReady('immune', 0.2)) { tone(1400, 0.12, 'square', 0.05); tone(1900, 0.1, 'square', 0.03, null, 0.02); } },
  kill()        { if (sfxReady('kill', 0.04)) tone(360, 0.18, 'triangle', 0.12, 90); },
  hurt()        { if (sfxReady('hurt', 0.1)) { tone(220, 0.22, 'sawtooth', 0.12, 80); hiss(0.1, 0.1, 'lowpass', 900); } },
  block()       { if (sfxReady('block')) tone(1000, 0.2, 'triangle', 0.12, 1400); },
  heal()        { if (sfxReady('heal')) [523, 659, 784].forEach((f, i) => tone(f, 0.3, 'sine', 0.1, null, i * 0.07)); },
  buff()        { if (sfxReady('buff')) [440, 554, 659, 880].forEach((f, i) => tone(f, 0.25, 'triangle', 0.08, null, i * 0.05)); },
  summon()      { if (sfxReady('summon')) { tone(200, 0.5, 'sawtooth', 0.06, 600); hiss(0.4, 0.08, 'bandpass', 400, 2400); } },
  explode(big)  { if (sfxReady('explode', 0.05)) boom(big ? 1.4 : 0.5); },
  freeze()      { if (sfxReady('freeze')) { hiss(0.9, 0.18, 'highpass', 6000, 2000); [1568, 2093, 2637].forEach((f, i) => tone(f, 0.5, 'sine', 0.05, null, i * 0.06)); } },
  awaken()      { if (sfxReady('awaken', 1)) { tone(55, 1.1, 'sawtooth', 0.14, 45); tone(58, 1.1, 'sawtooth', 0.1, 40); } },
  bossDown()    { if (!sfxReady('bossDown')) return; boom(1.2); [392, 523, 659, 784].forEach((f, i) => tone(f, 0.45, 'triangle', 0.12, null, 0.3 + i * 0.12)); },
  scroll()      { if (sfxReady('scroll')) [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.5, 'sine', 0.1, null, i * 0.08)); },
  discover()    { if (sfxReady('discover')) [784, 1175].forEach((f, i) => tone(f, 0.35, 'triangle', 0.1, null, i * 0.1)); },
  splash()      { if (sfxReady('splash')) { hiss(0.5, 0.2, 'lowpass', 2000, 300); tone(300, 0.2, 'sine', 0.06, 150); } },
  death()       { if (sfxReady('death')) [392, 330, 262, 196].forEach((f, i) => tone(f, 0.4, 'triangle', 0.12, null, i * 0.18)); },
};
function boom(dur) { tone(90, dur, 'sine', 0.4, 28); hiss(dur, 0.3, 'lowpass', 900, 60); }

function toggleSound() {
  sfx.on = !sfx.on;
  try { localStorage.setItem('pentagram-sound', sfx.on ? 'on' : 'off'); } catch (_) {}
  audioInit();
  castMessage(sfx.on ? 'Sound on' : 'Sound off', '#ccc');
}

// ── the five elements ──
// Every attack belongs to one of the pentagram's five elements. Lightning is Air,
// poison is Earth, holy light is Spirit. Each element beats the next around the
// cycle Water → Fire → Air → Earth → Spirit → Water: double damage to the one it
// beats, half to the two it's weak against (the one that beats it, and the one
// after its prey), normal against itself and the remaining one.
const ELEM_OF = { fire: 'fire', water: 'water', earth: 'earth', air: 'air', spirit: 'spirit', lightning: 'air', poison: 'earth', holy: 'spirit' };
const ELEM_CYCLE = ['water', 'fire', 'air', 'earth', 'spirit'];

const ELEM_NAME = { spirit: 'Spirit', water: 'Water', fire: 'Fire', earth: 'Earth', air: 'Air' };
function elemMult(a, d) {
  const i = ELEM_CYCLE.indexOf(a), j = ELEM_CYCLE.indexOf(d);
  if (i < 0 || j < 0) return 1;
  const k = (j - i + 5) % 5;
  return k === 1 ? 2 : k === 2 || k === 4 ? 0.5 : 1;
}
function elemBeats(e) { return ELEM_CYCLE[(ELEM_CYCLE.indexOf(e) + 1) % 5]; }
function elemWeakTo(e) { const i = ELEM_CYCLE.indexOf(e); return [ELEM_CYCLE[(i + 4) % 5], ELEM_CYCLE[(i + 2) % 5]]; }

const TIER_SHOTS  = [0, 0, 5, 3, 2, 1, 1, 1];

// Complexity: length isn't everything. A chain gets stronger with more
// element types in it, and with a richer repetition pattern (how many
// different repeat counts it uses). 2 Spirit + 3 Air + 1 Water (counts 3,2,1)
// beats 2 + 2 + 2 (counts all the same), and both beat six of one rune.
function complexityOf(key) {
  const counts = {};
  for (const c of key) counts[c] = (counts[c] || 0) + 1;
  const n = Object.values(counts);
  return key.length + 0.6 * (n.length - 1) + 0.4 * (new Set(n).size - 1);
}
// extra power on top of what the spell's length already gives it
const potencyOf = key => Math.round(1.2 ** (complexityOf(key) - key.length) * 100) / 100;
let potency = 1; // the power multiplier of whatever spell effect is running right now

// ── woven spells: the pattern behind most 3- and 4-rune combos ──
// 1st rune: what it's made of (its element).
// 2nd rune: its shape. Fire → bolt, Earth → wall, Water → pool, Air → burst, Spirit → creature.
// 3rd+ runes: upgrades. Fire: stronger, burns. Water: lasts longer, slows (water
// on water freezes). Earth: bigger, knocks back (a pool ending in Earth is buried
// as a mine). Air: one more shot, shocks. Spirit: confuses, or heals you.
// About 60% of 3-rune and 45% of 4-rune patterns are real; the rest fizzle.
// Hand-made spells keep their combos.

function comboHash(k) {
  let h = 2166136261;
  for (const c of k) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); }
  h ^= h >>> 13; h = Math.imul(h, 0x5bd1e995); h ^= h >>> 15;
  return (h >>> 0) % 100;
}

function makeWoven(key) {
  const elem = RUNE_ELEM[key[0]], form = RUNE_FORM[key[1]], mods = key.slice(2).split('');
  const n = r => mods.filter(m => m === r).length;
  const tier = key.length;
  const spec = {
    key, elem, form, tier,
    power: (tier === 4 ? 1.6 : 1) * (1 + 0.4 * n('F')),
    dur: 1 + 0.6 * n('W'),
    size: 1 + 0.35 * n('E'),
    count: 1 + n('A'),
    pierce: n('E'),
    fx: new Set([BASE_FX[elem], ...mods.map(m => MOD_FX[m])]),
    heal: n('S') > 0,
  };
  if (spec.fx.has('slow') && n('W') >= (elem === 'water' ? 1 : 2)) spec.fx.add('freeze');
  if (elem === 'earth' && n('W')) spec.fx.add('poison'); // wet earth turns to poison mud
  if (form === 'pool' && mods[mods.length - 1] === 'E') spec.mine = true;
  if (tier === 4) { spec.infuse = mods[0]; spec.finish = mods[1]; }
  // name: upgrade words, then the base name
  const words = [];
  const nameMods = spec.mine ? mods.slice(0, -1) : spec.finish ? mods.slice(0, 1) : mods;
  for (const m of nameMods) {
    const w = MOD_WORD[m], i = words.indexOf(w);
    if (i >= 0) words[i] = 'Greater ' + w; else if (!words.includes('Greater ' + w)) words.push(w);
  }
  const base = form === 'bolt' ? BOLT_NAME[elem] : form === 'wall' ? WALL_NAME[elem] : form === 'burst' ? BURST_NAME[elem]
             : form === 'creature' ? CRITTER[elem].name : spec.mine ? MINE_NAME[elem] : POOL_NAME[elem];
  const kind = form === 'wall' ? 'defence' : form === 'creature' ? 'summon' : form === 'pool' ? 'control'
             : form === 'burst' && elem === 'spirit' ? 'buff' : 'attack';
  if (spec.finish && !spec.mine) words.unshift(FINISH_WORD[form === 'burst' && elem === 'spirit' ? 'blessing' : form][spec.finish]);
  return { name: [...words, base].join(' '), kind, cost: (tier === 4 ? 9 : 6) + (form === 'creature' ? 1 : 0), woven: spec, cast() { castWoven(spec); } };
}

// add the woven spells to the spell book
(function weaveSpellBook() {
  const R = 'SWFEA';
  for (const len of [3, 4]) {
    const gen = k => {
      if (k.length === len) { if (!SPELLS[k] && comboHash(k) < KEEP_PCT[len]) SPELLS[k] = makeWoven(k); return; }
      for (const c of R) gen(k + c);
    };
    gen('');
  }
})();

function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function fmt(v) { return (Math.round(v * 10) / 10).toString(); }

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

let W = 0, H = 0, DPR = 1;
let panelTop = 0;
const PENT = { cx: 0, cy: 0, R: 0, S: 0, slot: 0, slotY: 0, msgY: 0 };

// Size to the body, not the window: embedded views can start at 0×0 and
// grow later, and the body excludes any safe-area padding on phones.
function viewSize() {
  const b = document.body;
  return {
    w: (b && b.clientWidth)  || window.innerWidth  || 0,
    h: (b && b.clientHeight) || window.innerHeight || 0,
  };
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const v = viewSize();
  W = v.w;
  H = v.h;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const R = Math.max(60, Math.min(W * 0.3, H * 0.14, 130));
  PENT.R  = R;
  PENT.S  = R * 0.42;
  PENT.cx = W / 2;
  PENT.cy = H - R * 0.81 - PENT.S / 2 - 18;
  PENT.slot  = Math.min(28, (W - 40) / 8);
  PENT.slotY = PENT.cy - R - PENT.S / 2 - 16 - PENT.slot / 2;
  PENT.msgY  = PENT.slotY - PENT.slot / 2 - 16;
  panelTop   = PENT.msgY - 18;
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(document.body);
resize();

function nodePos(i) {
  const a = -Math.PI / 2 + i * TAU / 5;
  return { x: PENT.cx + Math.cos(a) * PENT.R, y: PENT.cy + Math.sin(a) * PENT.R };
}
function nodeAt(x, y) {
  const half = PENT.S * 0.62;
  for (let i = 0; i < 5; i++) {
    const p = nodePos(i);
    if (Math.abs(x - p.x) < half && Math.abs(y - p.y) < half) return i;
  }
  return null;
}
function inCastZone(x, y) {
  return Math.hypot(x - PENT.cx, y - PENT.cy) < PENT.R * 1.45 ||
         (y > panelTop && Math.abs(x - PENT.cx) < PENT.R * 1.6);
}
function playerScreenY() { return panelTop * 0.5; }

// wobbly shoreline so the lake isn't a perfect ellipse
function lakeRadiusScale(a) { return 1 + 0.06 * Math.sin(3 * a) + 0.04 * Math.sin(5 * a + 1); }
function inLake(x, y) {
  const dx = (x - LAKE.x) / LAKE.rx, dy = (y - LAKE.y) / LAKE.ry;
  const s = lakeRadiusScale(Math.atan2(dy, dx));
  return dx * dx + dy * dy < s * s;
}
function isWater(x, y) {
  if (mode === 'battle' || !inLake(x, y)) return false;
  for (const i of ISLANDS) if (Math.hypot(x - i.x, y - i.y) < i.r) return false;
  return true;
}
// point on the shore in a given direction from the lake centre
function shorePoint(dirX, dirY, inset) {
  const a = Math.atan2(dirY / LAKE.ry, dirX / LAKE.rx);
  const s = lakeRadiusScale(a) * inset;
  return { x: LAKE.x + Math.cos(a) * LAKE.rx * s, y: LAKE.y + Math.sin(a) * LAKE.ry * s };
}
// the dock faces the shrine
const DOCK = shorePoint(-LAKE.x, -LAKE.y, 1.0);
const BOAT_HOME = shorePoint(-LAKE.x, -LAKE.y, 0.95);

const walls = [];   // axis-aligned rectangles
const solids = [];  // circles: trees, rocks, towers
for (const c of CASTLES) {
  const { x, y, h, t } = c;
  // each side is a full wall, or two halves around a centred gate
  const side = (key, rx, ry, w, hh, horizontal) => {
    const gap = c.gates[key];
    if (!gap) { walls.push({ x: rx, y: ry, w, h: hh }); return; }
    if (horizontal) {
      const half = (w - gap) / 2;
      walls.push({ x: rx, y: ry, w: half, h: hh }, { x: rx + half + gap, y: ry, w: half, h: hh });
    } else {
      const half = (hh - gap) / 2;
      walls.push({ x: rx, y: ry, w, h: half }, { x: rx, y: ry + half + gap, w, h: half });
    }
  };
  side('N', x - h, y - h, 2 * h, t, true);
  side('S', x - h, y + h - t, 2 * h, t, true);
  side('W', x - h, y - h, t, 2 * h, false);
  side('E', x + h - t, y - h, t, 2 * h, false);
  for (const sx of [-1, 1]) for (const sy of [-1, 1]) solids.push({ x: x + sx * h, y: y + sy * h, r: 28, kind: 'tower', stone: c.stone });
}
function inCastle(x, y, pad) {
  return CASTLES.some(c => Math.abs(x - c.x) < c.h + pad && Math.abs(y - c.y) < c.h + pad);
}

// scenery, generated once
const deco = [];
(function makeScenery() {
  const R = mulberry32(1337);
  const clear = (x, y, r) => {
    if (Math.abs(x) > WORLD - 20 || Math.abs(y) > WORLD - 20) return false;
    if (Math.hypot(x, y) < 230) return false;
    if (BOSSES.some(b => Math.hypot(x - b.x, y - b.y) < 200 || Math.hypot(x - b.x, y - (b.y + b.r + 60)) < 90)) return false;
    if (inCastle(x, y, 70)) return false;
    const dx = (x - LAKE.x) / (LAKE.rx + 70), dy = (y - LAKE.y) / (LAKE.ry + 70);
    if (dx * dx + dy * dy < 1.25) return false;
    if (SCROLLS.some(s => Math.hypot(x - s.x, y - s.y) < 60)) return false;
    return !solids.some(s => Math.hypot(x - s.x, y - s.y) < s.r + r + 36); // leave room to walk between
  };
  const addTree = (x, y, s) => {
    const r = 13 * s;
    if (!clear(x, y, r)) return;
    solids.push({ x, y, r, kind: 'tree', s, v: R() });
  };
  for (const f of FORESTS) {
    for (let i = 0; i < 260; i++) {
      const a = R() * TAU, d = Math.sqrt(R()) * f.r;
      addTree(f.x + Math.cos(a) * d, f.y + Math.sin(a) * d, 0.8 + R() * 0.6);
    }
  }
  for (let i = 0; i < 260; i++) {
    const x = (R() * 2 - 1) * WORLD, y = (R() * 2 - 1) * WORLD, k = R();
    if (k < 0.5) addTree(x, y, 0.7 + R() * 0.6);
    else if (clear(x, y, 10)) solids.push({ x, y, r: 9 * (0.8 + R() * 0.6), kind: 'rock' });
  }
  while (deco.length < 220) {
    const x = (R() * 2 - 1) * WORLD, y = (R() * 2 - 1) * WORLD;
    if (!isWater(x, y)) deco.push({ x, y, kind: 'grass', s: 0.7 + R() * 0.7 });
  }
  // palms on the islands
  for (const i of ISLANDS) {
    solids.push({ x: i.x + i.r * 0.45, y: i.y + i.r * 0.35, r: 10, kind: 'palm' });
  }
})();

// spatial grid so collision checks only look at nearby solids
const GRID = 200;
const solidGrid = new Map();
for (const s of solids) {
  const k = Math.floor(s.x / GRID) + ',' + Math.floor(s.y / GRID);
  if (!solidGrid.has(k)) solidGrid.set(k, []);
  solidGrid.get(k).push(s);
}
function buildGrid(list) {
  const g = new Map();
  for (const s of list) {
    const k = Math.floor(s.x / GRID) + ',' + Math.floor(s.y / GRID);
    if (!g.has(k)) g.set(k, []);
    g.get(k).push(s);
  }
  return g;
}

// ── battle arena terrain ──
const ARENA_H = 780;   // the battle arena is an oval: WORLD wide, ARENA_H tall (half-axes)
function inArena(x, y, m) {
  const a = WORLD - (m || 0), b = ARENA_H - (m || 0);
  return (x / a) ** 2 + (y / b) ** 2 <= 1;
}
// pull a point back inside the oval (keeping a margin)
function clampArena(p, m) {
  const a = WORLD - (m || 0), b = ARENA_H - (m || 0), d = Math.hypot(p.x / a, p.y / b);
  if (d > 1) { p.x /= d; p.y /= d; }
  return p;
}
function ovalPath(grow) {
  ctx.beginPath(); ctx.ellipse(0, 0, WORLD + (grow || 0), ARENA_H + (grow || 0), 0, 0, TAU);
}
const BASE_X = 1450;   // the two big towers sit at ±BASE_X
const battleSolids = [];
(function makeArena() {
  const R = mulberry32(77);
  while (battleSolids.length < 46) {
    const x = (R() * 2 - 1) * 1050, y = (R() * 2 - 1) * (ARENA_H - 60);
    if (Math.abs(y) < 120) continue;                                  // keep the middle of the field open
    if (!inArena(x, y, 90)) continue;
    if (battleSolids.some(o => Math.hypot(o.x - x, o.y - y) < 80)) continue;
    const tree = R() < 0.6, sc = 0.8 + R() * 0.5;
    battleSolids.push(tree ? { x, y, r: 13 * sc, kind: 'tree', s: sc, v: R() } : { x, y, r: 10 * sc, kind: 'rock' });
  }
})();
const battleGrid = buildGrid(battleSolids);

let activeSolids = solids, activeGrid = solidGrid;
function setMode(m) {
  mode = m;
  activeSolids = m === 'battle' ? battleSolids : solids;
  activeGrid = m === 'battle' ? battleGrid : solidGrid;
}
function boundY() { return mode === 'battle' ? ARENA_H : WORLD; }

function solidsNear(x, y) {
  const gx = Math.floor(x / GRID), gy = Math.floor(y / GRID), out = [];
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const list = activeGrid.get((gx + i) + ',' + (gy + j));
    if (list) out.push(...list);
  }
  return out;
}

function inWall(x, y) {
  if (mode === 'battle') return false;
  return walls.some(w => x > w.x && x < w.x + w.w && y > w.y && y < w.y + w.h);
}

// shove a circle out of trees, rocks, towers and castle walls
function pushOut(e, r) {
  for (const s of solidsNear(e.x, e.y).concat(solidTemps())) {
    const dx = e.x - s.x, dy = e.y - s.y, d = Math.hypot(dx, dy), min = s.r + r;
    if (d < min && d > 0) { e.x = s.x + dx / d * min; e.y = s.y + dy / d * min; }
  }
  for (const w of (mode === 'battle' ? [] : walls)) {
    const px = clamp(e.x, w.x, w.x + w.w), py = clamp(e.y, w.y, w.y + w.h);
    const dx = e.x - px, dy = e.y - py, d = Math.hypot(dx, dy);
    if (d >= r) continue;
    if (d > 0) { e.x = px + dx / d * r; e.y = py + dy / d * r; continue; }
    // centre is inside the wall: leave by the shortest way out
    const l = e.x - w.x, rr = w.x + w.w - e.x, t = e.y - w.y, b = w.y + w.h - e.y, m = Math.min(l, rr, t, b);
    if (m === l) e.x = w.x - r; else if (m === rr) e.x = w.x + w.w + r;
    else if (m === t) e.y = w.y - r; else e.y = w.y + w.h + r;
  }
}

function blockedForFoot(x, y, r) {
  if (mode === 'battle' && !inArena(x, y, r)) return true;
  if (isWater(x, y)) return true;
  if (inWall(x, y)) return true;
  return solidsNear(x, y).concat(solidTemps()).some(s => Math.hypot(x - s.x, y - s.y) < s.r + r * 0.6);
}

    player.x = fp.x; player.y = fp.y; player.face = { x: 1, y: 0 }; player.invuln = 2;
    state = 'play';
    showBanner('You return to the fight', '', 2);
    return;
  }
  resetPlayer();
  clearCombat();
  foes = foes.filter(f => f.boss);
  for (const b of foes) {
    if (b.dead) continue;
    b.x = b.def.x; b.y = b.def.y; b.hp = b.maxHp; b.aggro = false;
    b.poison = 0; b.slow = 0; b.kx = b.ky = 0;
  }
  boat.x = BOAT_HOME.x; boat.y = BOAT_HOME.y;
  state = 'play';
  showBanner('You rise at the shrine', '', 2.5);
}

// ── feedback helpers ─────────────────────────────────────────────────────────
function showBanner(text, sub, life) {
  if (curSide === 'red') { if (versus) netEvents.push(['banner', text, sub, life]); return; }
  banner = { text, sub, life, max: life };
}
function castMessage(text, color) {
  if (curSide === 'red') { if (versus) netEvents.push(['msg', text, color]); return; }
  castMsg = { text, color, life: 1.6 };
}
function floatText(x, y, text, color, size) {
  if (versus && net.role === 'host') netEvents.push(['ft', Math.round(x), Math.round(y), text, color, size || 14]);
  floaters.push({ x, y, text, color, size: size || 14, life: 0.9, max: 0.9 });
}
function burst(x, y, color, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(40, spd || 260);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: rnd(2, 5), life: 1, decay: rnd(1.4, 2.8), color });
  }
}
function ring(x, y, r, color, life) {
  if (versus && net.role === 'host') netEvents.push(['ring', Math.round(x), Math.round(y), Math.round(r), color, life || 0.35]); fx.push({ kind: 'ring', x, y, r, color, life: life || 0.35, max: life || 0.35 }); }

// ── targeting & damage ───────────────────────────────────────────────────────
function nearestFoe(x, y, range, exclude) {
  let best = null, bd = range;
  for (const f of foes) {
    if (f.dead || (exclude && exclude.has(f))) continue;
    const d = Math.hypot(f.x - x, f.y - y) - f.r;
    if (d < bd) { bd = d; best = f; }
  }
  return best;
}

function aimFrom(src, range) {
  const t = nearestFoe(src.x, src.y, range || 600);
  if (t) {
    const dx = t.x - src.x, dy = t.y - src.y, d = Math.hypot(dx, dy) || 1;
    return { x: dx / d, y: dy / d, t };
  }
  return { x: player.face.x, y: player.face.y, t: null };
}

// ── magic energy (battle) ──
// Every kind of magic has a little energy circle. Each use drains it a bit; it
// refills slowly. Below 40% that kind loses power (down to 40% damage when empty).
const CHARGE_TYPES = ['spirit', 'water', 'fire', 'earth', 'air']; // pentagram order
const CHARGE_LOW = 0.4, CHARGE_REGEN = 0.05, CHARGE_COST = 0.14;
function resetCharge() {
  player.charge = Object.fromEntries(CHARGE_TYPES.map(t => [t, 1]));
  player.chargeT = {};
}
function chargeMult(type) {
  const c = player.charge ? player.charge[type] : 1;
  return c >= CHARGE_LOW ? 1 : 0.4 + 0.6 * c / CHARGE_LOW;
}
// one drain per kind per moment, so a blast that hits a crowd costs about the same as a single hit
function drainCharge(type) {
  if (!player.charge) resetCharge();
  if (elapsed - (player.chargeT[type] ?? -9) < 0.35) return;
  player.chargeT[type] = elapsed;
  player.charge[type] = Math.max(0, player.charge[type] - CHARGE_COST);
}

function damageFoe(f, dmg, rawType, fromHelper) {
  if (f.dead) return;
  dmg *= potency;
  if (f.proxyOf) { const d = dmg * (player.empower > 0 && !fromHelper ? 2 : 1); hurtPlayer(d, heroOf(f)); return d; }
  if (f.helper) { f.helper.hp -= dmg; burst(f.x, f.y, '#ccc', 4, 100); if (f.helper.hp <= 0) f.helper.life = 0; return dmg; }
  const type = ELEM_OF[rawType] || rawType; // lightning → air, poison → earth, holy → spirit
  if (f.unit && shielded(f)) {
    if (f.txtCd <= 0) { floatText(f.x, f.y - f.r - 10, shieldText(f), '#bde', 13); f.txtCd = 0.8; }
    SFX.immune();
    return;
  }
  let mult = 1;
  if (f.boss) {
    if (!f.def.weak.includes(type) && type !== 'prism' && type !== 'mirror') {
      SFX.immune();
      if (f.txtCd <= 0) { floatText(f.x, f.y - f.r - 10, 'IMMUNE', '#999', 15); f.txtCd = 0.6; }
      ring(f.x, f.y, f.r + 6, 'rgba(200,200,200,0.6)', 0.2);
      return;
    }
  } else {
    mult = f.def.mult[type] ?? (type === 'prism' ? 1.5 : 1);
  }
  if (f.hex > 0 || f.stone > 0) mult *= 1.5;
  if (f.unit && f.elem) mult *= elemMult(type, f.elem);
  // Battle: each kind of magic has its own energy; drained kinds hit softer
  if (mode === 'battle' && CHARGE_TYPES.includes(type) && !fromHelper) {
    const cm = chargeMult(type);
    mult *= cm;
    drainCharge(type);
    if (cm < 0.8 && (player.chargeTxtCd || 0) <= 0) {
      floatText(player.x, player.y - 44, `${type} is drained · mix it up!`, TYPE_COLOR[type], 12);
      player.chargeTxtCd = 1.5;
    }
  }
  if (player.empower > 0 && !fromHelper) mult *= 2;
  const d = f.unit ? minionHit(f, mageGuard(f, dmg * mult)) * resDmgIn(f.team) : dmg * mult;
  f.hp -= d;
  if (rawType !== 'poison') SFX.hit();
  f.flash = 0.12;
  const weak = f.boss || mult > 1.01;
  floatText(f.x + rnd(-8, 8), f.y - f.r - 6, fmt(d) + (weak && !f.boss ? '!' : ''),
            weak ? '#ffe14a' : mult < 0.99 ? '#aaa' : '#fff', weak ? 17 : 13);
  if (f.hp <= 0) killFoe(f);
  return d;
}

// Points: a beast's base worth grows as later, tougher versions spawn.
function addScore(n, x, y, big) {
  score += n;
  floatText(x, y, '+' + n, '#ffd24a', big ? 26 : 15);
  if (score > best) { best = score; try { localStorage.setItem('pentagram-best', String(best)); } catch (_) {} }
}

// Hunting bonuses: every 10 of one kind pays out, and 10 of every kind pays big.
const FOE_NAMES = { slime: 'Slimes', bat: 'Bats', skeleton: 'Skeletons', ember: 'Embers', shade: 'Shades' };
function huntBonus(f) {
  const n = tally[f.kind] = (tally[f.kind] || 0) + 1;
  floatText(f.x, f.y - f.r - 6, `${FOE_NAMES[f.kind]} ${n % 10 || 10}/10`, '#bbb', 11);
  if (n % 10 === 0) {
    const bonus = f.def.pts * 10;
    addScore(bonus, player.x, player.y - 60, true);
    showBanner(`${n} ${FOE_NAMES[f.kind]}!`, `Hunting bonus +${bonus}`, 2.5);
    SFX.discover();
  }
  if (!masterHunter && Object.keys(FOES).every(k => (tally[k] || 0) >= 10)) {
    masterHunter = true;
    addScore(2000, player.x, player.y - 90, true);
    showBanner('MASTER HUNTER!', '10 of every creature · +2,000', 4);
    SFX.bossDown();
  }
}

function killFoe(f) {
  if (f.unit) {
    // battle units: points for the kill, then the usual fallout (respawns, shields, victory)
    if (curSide !== 'red') kills++;
    SFX.kill();
    unitFell(f); // points go to blue
    return;
  }
  f.dead = true;
  f.boss ? SFX.bossDown() : SFX.kill();
  kills++;
  addScore(f.boss ? f.def.pts : Math.round(f.def.pts * f.maxHp / f.def.hp), f.x, f.y - f.r - 22, f.boss);
  if (!f.boss) huntBonus(f);
  burst(f.x, f.y, f.boss ? f.def.color : f.def.color, f.boss ? 70 : 14, f.boss ? 420 : 260);
  if (f.boss) {
    bossesDown++;
    shake = 14;
    showBanner(`${f.def.name} is defeated!`, 'Its chest is unsealed', 4);
  }
}

function knock(f, fromX, fromY, force) {
  if (f.structure) return;
  const dx = f.x - fromX, dy = f.y - fromY, d = Math.hypot(dx, dy) || 1;
  const k = f.boss ? 0.15 : 1;
  f.kx += dx / d * force * k;
  f.ky += dy / d * force * k;
}

function aoe(x, y, rad, dmg, type, push) {
  for (const f of foes) {
    if (f.dead) continue;
    if (Math.hypot(f.x - x, f.y - y) < rad + f.r) {
      damageFoe(f, dmg, type);
      if (push) knock(f, x, y, push);
    }
  }
  ring(x, y, rad, TYPE_COLOR[type], 0.4);
  react(type, x, y, rad);
}

function hurtPlayer(d, p = player) {
  if ((p === hostP ? state !== 'play' : p.dead) || p.invuln > 0 || p.omni > 0 || p.sanct > 0) return;
  if (p.ward > 0) {
    p.ward--;
    SFX.block();
    p.invuln = 0.3;
    ring(p.x, p.y, 30, TYPE_COLOR.spirit, 0.3);
    floatText(p.x, p.y - 30, 'blocked', TYPE_COLOR.spirit, 14);
    return;
  }
  if (p.skin > 0) d *= 0.5;
  p.hp -= d;
  SFX.hurt();
  p.invuln = 0.5;
  if (p === hostP) shake = Math.max(shake, 6);
  burst(p.x, p.y, '#f44', 8, 180);
  floatText(p.x, p.y - 30, '-' + fmt(d), '#f55', 16);
  if (p.hp <= 0 && p.phoenix > 0) {
    // Phoenix: rise from the ashes once, in a burst of flame
    p.phoenix = 0;
    p.hp = p.maxHp;
    p.invuln = 2;
    aoe(p.x, p.y, 200, 6, 'fire', 360);
    burst(p.x, p.y, '#ffb04a', 80, 520);
    flash = Math.max(flash, 0.6);
    SFX.explode(true);
    showBanner('The Phoenix rises!', '', 2.5);
    return;
  }
  if (p.hp <= 0 && p.isRival) { rivalDown(); return; }
  if (p.hp <= 0) {
    p.hp = 0;
    state = 'dead';
    // your fall scores for red: 1 point (10 in a duel, where it's your friend's kill)
    if (mode === 'battle' && teams) scoreKill('red', 'hero', p.x, p.y - 40);
    SFX.death();
    overlayT = 0;
    seq = []; castPtr = null; finger = null;
  }
}

function healPlayer(n) {
  n *= potency;
  player.hp = Math.min(player.maxHp, player.hp + n);
  floatText(player.x, player.y - 30, '+' + fmt(n), '#6f6', 16);
  burst(player.x, player.y, '#6f6', 14, 150);
}

// ── spell effects ────────────────────────────────────────────────────────────
function launch(x, y, dir, o) {
  shots.push({
    x: x + dir.x * 18, y: y + dir.y * 18, vx: dir.x * o.speed, vy: dir.y * o.speed,
    r: o.r, dmg: o.dmg, type: o.type, fx: o.fx, boom: o.boom, boomR: o.boomR,
    pierce: o.pierce || 0, life: o.life || 1.6, hit: new Set(), color: TYPE_COLOR[o.type],
    spec: o.spec, ally: o.ally, pot: potency !== 1 ? potency : undefined, // a helper's shot keeps its power
    look: o.look || (o.fx === 'woven' ? 'woven' : o.type), spin: rnd(0, TAU), born: elapsed,
  });
}

function shoot(o) { launch(player.x, player.y, aimFrom(player), o); }

function chainLightning(dmg, jumps) {
  let cur = nearestFoe(player.x, player.y, 450);
  if (!cur) { castMessage('No target in range', '#8ff'); return; }
  SFX.lightning();
  const pts = [{ x: player.x, y: player.y }];
  const hit = new Set();
  for (let i = 0; i < jumps && cur; i++) {
    hit.add(cur);
    pts.push({ x: cur.x, y: cur.y });
    damageFoe(cur, dmg, 'lightning');
    react('air', cur.x, cur.y, 30);
    cur = nearestFoe(cur.x, cur.y, 230, hit);
  }
  fx.push({ kind: 'bolt', pts, life: 0.3, max: 0.3 });
  for (const p of pts.slice(1)) { shapeBits(p.x, p.y, 'shard', '#fff6a0', 4, 160); fx.push({ kind: 'rays', x: p.x, y: p.y, r: 26, color: '#a0ffff', life: 0.25, max: 0.25, rot: rnd(0, TAU) }); }
}

function targetPoint(range, ahead) {
  const t = nearestFoe(player.x, player.y, range);
  if (t) return { x: t.x, y: t.y };
  return { x: player.x + player.face.x * ahead, y: player.y + player.face.y * ahead };
}

function plagueCloud() {
  const p = targetPoint(500, 150);
  zones.push({ x: p.x, y: p.y, r: 110, life: 6, max: 6, tick: 0 });
}

function tidalWave() {
  waves.push({ x: player.x, y: player.y, r: 20, maxR: 440, speed: 480, dmg: 8, type: 'water', hit: new Set() });
}

function meteor() {
  const p = targetPoint(650, 220);
  meteors.push({ x: p.x, y: p.y, t: 0.9, max: 0.9 });
}

function blizzard() {
  SFX.freeze();
  flash = 0.4;
  shake = Math.max(shake, 10);
  for (const f of foes) {
    if (f.dead || Math.hypot(f.x - player.x, f.y - player.y) > 460) continue;
    damageFoe(f, 22, 'water');
    f.freeze = 4;
    f.slow = 8;
  }
  ring(player.x, player.y, 460, '#cfefff', 0.8);
  for (let i = 0; i < 90; i++) {
    const a = rnd(0, TAU), d = rnd(0, 460);
    particles.push({ x: player.x + Math.cos(a) * d, y: player.y + Math.sin(a) * d - 60, vx: rnd(-30, 30), vy: rnd(60, 160),
                     r: rnd(2, 4), life: 1, decay: rnd(0.6, 1.2), color: '#e8f8ff' });
  }
}

// 7-element finale (after its long charge): everything nearby is erased and every
// guardian in range takes a massive hit of the one thing it can't resist.
function detonateDoom() {
  SFX.explode(true);
  flash = 1.6;
  shake = 34;
  enemyShots = [];
  for (const f of foes) {
    if (f.dead || Math.hypot(f.x - player.x, f.y - player.y) > 1000) continue;
    if (f.boss) damageFoe(f, 50, f.def.weak[0]);
    else damageFoe(f, 9999, 'holy');
    burst(f.x, f.y, '#ff3355', 18, 400);
  }
  for (let i = 0; i < 4; i++) ring(player.x, player.y, 250 + i * 250, i % 2 ? '#fff6b0' : '#ff3355', 0.9 + i * 0.2);
  burst(player.x, player.y, '#fff', 80, 700);
}

// Crown of All: while it lasts you can't be hurt, and every arrow you fire is a
// prism bolt that counts as every element (so it can hurt any guardian).
const OMNI_TYPES = ['fire', 'water', 'earth', 'air', 'lightning', 'poison', 'spirit', 'holy'];

function aimAngle() { const a = aimFrom(player, 400); return Math.atan2(a.y, a.x); }

// Crowd control. Guardians shrug off fear, confusion and hex, and take the rest for less time.
const CC_LABEL = { stun: 'STUNNED', root: 'ROOTED', fear: 'FLEES', confuse: 'CONFUSED', hex: 'HEXED', stone: 'STONE', freeze: 'FROZEN' };
function applyCC(f, kind, dur) {
  if (f.dead || f.structure) return;
  if (f.boss) {
    if (kind === 'fear' || kind === 'confuse' || kind === 'hex') {
      if (f.txtCd <= 0) { floatText(f.x, f.y - f.r - 10, 'RESISTS', '#999', 14); f.txtCd = 0.6; }
      return;
    }
    dur *= 0.4;
  }
  if (!(f[kind] > 0)) floatText(f.x, f.y - f.r - 18, CC_LABEL[kind], '#e0d0ff', 12);
  f[kind] = Math.max(f[kind] || 0, dur);
  if (kind === 'confuse') f.wander = rnd(0, TAU);
}
function areaCC(x, y, r, kind, dur, color) {
  for (const f of foes) if (!f.dead && Math.hypot(f.x - x, f.y - y) < r + f.r) applyCC(f, kind, dur);
  ring(x, y, r, color, 0.6);
  burst(x, y, color, 30, 300);
}

function quake() {
  shake = Math.max(shake, 10);
  for (const f of foes) {
    if (f.dead || Math.hypot(f.x - player.x, f.y - player.y) > 220 + f.r) continue;
    damageFoe(f, 1.5, 'earth');
    applyCC(f, 'stun', 1.6);
  }
  for (let i = 0; i < 3; i++) ring(player.x, player.y, 80 + i * 70, TYPE_COLOR.earth, 0.4 + i * 0.15);
  burst(player.x, player.y, TYPE_COLOR.earth, 40, 320);
}

// Fan-shaped blast in front of the caster.
function cone(x, y, ang, range, half, dmg, type, effect) {
  for (const f of foes) {
    if (f.dead) continue;
    const dx = f.x - x, dy = f.y - y, d = Math.hypot(dx, dy);
    if (d > range + f.r) continue;
    let da = Math.atan2(dy, dx) - ang;
    da = Math.atan2(Math.sin(da), Math.cos(da));
    if (Math.abs(da) > half + f.r / Math.max(d, 1)) continue;
    damageFoe(f, dmg, type);
    if (effect === 'burn') { f.burn = Math.max(f.burn || 0, 3); }
  }
  if (type === 'fire') {
    fx.push({ kind: 'flamewave', x, y, ang, range, half, life: 0.45, max: 0.45 });
    for (let i = 0; i < 3; i++) { const d = range * (0.4 + i * 0.25); puff(x + Math.cos(ang) * d, y + Math.sin(ang) * d, '#8a7a70', 1, 18, 30); }
  } else fx.push({ kind: 'cone', x, y, ang, range, half, color: TYPE_COLOR[type], life: 0.35, max: 0.35 });
  react(type, x + Math.cos(ang) * range * 0.6, y + Math.sin(ang) * range * 0.6, range * 0.5);
}

function layTrap() {
  if (traps.length >= 6) traps.shift();
  traps.push({ x: player.x, y: player.y + 6, arm: 0.6, life: 40 });
  castMessage('Trap set', TYPE_COLOR.fire);
}

// Jump a short way in the direction you're facing, never into water or walls.
function blink() {
  if (player.onBoat) { castMessage('Can’t blink from a boat', '#bbb'); return; }
  const fx0 = player.x, fy0 = player.y;
  for (let d = 170; d >= 30; d -= 10) {
    const x = clamp(player.x + player.face.x * d, -WORLD, WORLD), y = clamp(player.y + player.face.y * d, -boundY(), boundY());
    if (blockedForFoot(x, y, PLAYER_R)) continue;
    player.x = x; player.y = y;
    break;
  }
  player.invuln = Math.max(player.invuln, 0.25);
  burst(fx0, fy0, TYPE_COLOR.spirit, 18, 200);
  burst(player.x, player.y, TYPE_COLOR.air, 18, 200);
}

// A short wall of boulders between you and the nearest enemy. Blocks enemies and their shots.
function stoneWall() {
  const a = aimFrom(player, 500);
  const cx = player.x + a.x * 70, cy = player.y + a.y * 70;
  const px = -a.y, py = a.x;
  for (let i = -3; i <= 3; i++) {
    const x = cx + px * i * 26, y = cy + py * i * 26;
    if (isWater(x, y)) continue;
    tempSolids.push({ x, y, r: 16, life: 9, kind: 'boulder', side: curSide, born: elapsed + (i + 3) * 0.04 });
    puff(x, y + 8, '#c2a57a', 1, 14, 10);
  }
  shake = Math.max(shake, 5);
}

// The dragon breathes a long cone of fire where you aim. Only when you press FIRE.
function dragonBreath() {
  const d = allies.find(a => a.kind === 'dragon');
  const src = d || player;
  const a = aimFrom(src, 500);
  cone(src.x, src.y, Math.atan2(a.y, a.x), 300, 0.45, 8, 'fire', 'burn');
  shake = Math.max(shake, 8);
  SFX.explode(false);
}

function updateStorms(dt) {
  for (const s of storms) {
    potency = s.pot || 1;
    s.t -= dt;
    if (s.t > 0) continue;
    s.t = 0.2;
    s.left--;
    const near = foes.filter(f => !f.dead && Math.hypot(f.x - player.x, f.y - player.y) < 480);
    if (!near.length) continue;
    const f = near[Math.floor(Math.random() * near.length)];
    damageFoe(f, 7, 'lightning');
    react('air', f.x, f.y, 40);
    SFX.lightning();
    fx.push({ kind: 'bolt', pts: [{ x: f.x + rnd(-40, 40), y: f.y - 420 }, { x: f.x, y: f.y }], life: 0.25, max: 0.25 });
    burst(f.x, f.y, TYPE_COLOR.lightning, 10, 220);
    shake = Math.max(shake, 4);
  }
  storms = storms.filter(s => s.left > 0);
}

// Helpers never attack on their own: the wisp heals, the imp and guardian draw
// enemies away from you, and the dragon only breathes when you press FIRE.
const ALLY_LIFE = { wisp: 15, imp: 8, golem: 20, dragon: 30 };
const ALLY_R = { wisp: 9, imp: 10, golem: 18, dragon: 26 };
const ALLY_HP = { imp: 10, golem: 40 };
// ── spell flair: trails, impacts, sigils and finishes ──
// Every cast draws a sigil under the caster made of that spell's own runes,
// in order, so no two spells look the same as they go off.
function castSigil(key, x, y, small) {
  fx.push({ kind: 'sigil', key, x, y: y + 10, rot: rnd(0, TAU), life: small ? 0.45 : 1, max: small ? 0.45 : 1, small: !!small });
}
// jagged cracks running out across the ground
function crackLines(x, y, r, n) {
  const lines = [];
  for (let i = 0; i < n; i++) {
    let a = i * TAU / n + rnd(-0.3, 0.3), px = x, py = y;
    const pts = [{ x: px, y: py }];
    for (let k = 0; k < 5; k++) { a += rnd(-0.5, 0.5); px += Math.cos(a) * r / 5; py += Math.sin(a) * r / 5; pts.push({ x: px, y: py }); }
    lines.push(pts);
  }
  return { x, y, lines };
}
// a shape-particle: 'star', 'plus', 'shard' or 'drop'
function shapeBits(x, y, shape, color, n, spd, up, size) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), v = rnd(spd * 0.3, spd);
    particles.push({ shape, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - (up || 0), r: rnd(2.5, 4) * (size || 1), life: 1, decay: rnd(1, 1.8),
                     color, rot: rnd(0, TAU), spin: rnd(-8, 8) });
  }
}
// what each kind of shot leaves behind in the air
function shotTrailFx(s, dt) {
  const k = dt * 60, r = Math.random;
  const back = (spd, col, rad, life, extra) => {
    const sp = Math.hypot(s.vx, s.vy) || 1;
    particles.push(Object.assign({ x: s.x - s.vx / sp * s.r, y: s.y - s.vy / sp * s.r, vx: -s.vx / sp * spd + rnd(-20, 20), vy: -s.vy / sp * spd + rnd(-20, 20),
                                   r: rad, life, decay: 2.4, color: col }, extra || {}));
  };
  switch (s.look) {
    case 'firebolt': if (r() < 0.7 * k) back(60, r() < 0.5 ? '#ffb04a' : '#ff5a2a', rnd(2, 3.5), 0.8); break;
    case 'frost':    if (r() < 0.5 * k) back(30, '#e8f8ff', 2, 0.7, { shape: 'star', rot: 0, spin: 6 }); break;
    case 'spike':    if (r() < 0.25 * k) back(20, '#b59a72', 6, 0.6, { puff: true, decay: 2 }); break;
    case 'venom':    if (r() < 0.5 * k) particles.push({ shape: 'drop', x: s.x, y: s.y, vx: 0, vy: 70, r: 2.5, life: 0.7, decay: 2, color: '#7dff4a', rot: 0, spin: 0 }); break;
    case 'siphon':   if (r() < 0.6 * k) back(40, r() < 0.5 ? '#e6ccff' : '#c77dff', 2.2, 0.9); break;
    case 'fireball': if (r() < 0.6 * k) back(30, '#8a7a70', 9, 0.8, { puff: true, decay: 1.6 }); if (r() < 0.8 * k) back(80, '#ffd24a', 2.5, 0.7); break;
    case 'lance':    if (r() < 0.9 * k) back(0, '#fff6ff', 2, 0.35); break;
    case 'icelance': if (r() < 0.5 * k) back(10, '#e8f6ff', 7, 0.5, { puff: true, decay: 2.2 }); break;
    case 'hex':      if (r() < 0.5 * k) back(30, '#b070ff', 2, 0.8, { shape: 'star', rot: 0, spin: 4 }); break;
    case 'woven': {
      if (!s.spec || s.ally) break;
      // the infusion shows in the trail
      const inf = s.spec.infuse || s.spec.key[2];
      if (r() > 0.5 * k) break;
      if (inf === 'F') back(50, '#ffb04a', 2.4, 0.7);
      else if (inf === 'W') particles.push({ shape: 'drop', x: s.x, y: s.y, vx: 0, vy: 60, r: 2.2, life: 0.6, decay: 2, color: '#9fd8ff', rot: 0, spin: 0 });
      else if (inf === 'E') back(20, '#b59a72', 5, 0.5, { puff: true, decay: 2.2 });
      else if (inf === 'A') back(80, '#fff6a0', 1.6, 0.4, { shape: 'shard', rot: rnd(0, TAU), spin: 0 });
      else back(30, '#e6ccff', 2, 0.8, { shape: 'star', rot: 0, spin: 5 });
      break;
    }
  }
}
// what each kind of shot does as it hits (looks, and a few small twists)
function shotImpact(s, f) {
  switch (s.look) {
    case 'firebolt': puff(s.x, s.y, '#ffb04a', 1, 12, 20); burst(s.x, s.y, '#ff8a3a', 8, 160); break;
    case 'frost':
      // shatters: little shards nick whoever's close
      shapeBits(s.x, s.y, 'shard', '#dff4ff', 6, 220, 0, 1.2);
      ring(s.x, s.y, 26, '#cfefff', 0.3);
      for (const o of foes) if (o !== f && !o.dead && Math.hypot(o.x - s.x, o.y - s.y) < 55 + o.r) { damageFoe(o, s.dmg * 0.4, 'water'); o.slow = Math.max(o.slow || 0, 1.5); }
      break;
    case 'spike':
      // a heavy rock: it shoves
      if (!f.structure) knock(f, s.x - s.vx * 0.05, s.y - s.vy * 0.05, 170);
      puff(s.x, s.y, '#c2a57a', 2, 12, 10); shapeBits(s.x, s.y, 'shard', '#8a6a44', 5, 180, 40);
      break;
    case 'venom': {
      // the poison splashes onto one more foe nearby
      shapeBits(s.x, s.y, 'drop', '#7dff4a', 7, 160, 30);
      const o = nearestFoe(s.x, s.y, 110, new Set([f]));
      if (o) { o.poison = Math.max(o.poison || 0, 2); o.poisonDps = Math.max(o.poisonDps || 0, 0.5); fx.push({ kind: 'streak', x1: s.x, y1: s.y, x2: o.x, y2: o.y, color: '#7dff4a', life: 0.3, max: 0.3 }); }
      break;
    }
    case 'siphon':
      // a stream of light flows back to the caster
      for (let i = 0; i < 10; i++) {
        const dx = player.x - s.x, dy = player.y - s.y, d = Math.hypot(dx, dy) || 1;
        particles.push({ x: s.x + rnd(-8, 8), y: s.y + rnd(-8, 8), vx: dx / d * rnd(250, 420), vy: dy / d * rnd(250, 420), r: 2.5, life: 0.9, decay: 1.6, color: '#e6ccff', home: true });
      }
      break;
    case 'fireball':
      fx.push({ kind: 'nova', elem: 'fire', x: s.x, y: s.y, r: s.boomR || 100, life: 0.5, max: 0.5 });
      puff(s.x, s.y, '#8a7a70', 4, 22, 40); puff(s.x, s.y, '#ffb04a', 2, 26, 20);
      burst(s.x, s.y, '#ffd24a', 18, 320);
      break;
    case 'lance':
      fx.push({ kind: 'rays', x: s.x, y: s.y, r: 40, color: '#fff6ff', life: 0.3, max: 0.3, rot: rnd(0, TAU) });
      break;
    case 'icelance':
      shapeBits(s.x, s.y, 'shard', '#e8f8ff', 8, 200, 0, 1.4);
      puff(s.x, s.y, '#e8f6ff', 2, 14, 6);
      break;
    case 'hex':
      puff(s.x, s.y, '#b070ff', 2, 16, 20); shapeBits(s.x, s.y, 'star', '#e6ccff', 6, 120, 30);
      break;
    case 'prism': case 'mirror':
      shapeBits(s.x, s.y, 'shard', ['#ff5a2a', '#ffd24a', '#7dff4a', '#3ab0ff', '#c77dff'][Math.floor(Math.random() * 5)], 6, 200);
      break;
    default:
      if (s.look !== 'woven') burst(s.x, s.y, s.color, 6, 150);
  }
}

// a woven bolt's finish on a hit
function wovenFinishHit(s, f) {
  const sp = s.spec;
  if (!sp || !sp.finish || s.ally || s.shard) return;
  const col = TYPE_COLOR[sp.elem];
  switch (sp.finish) {
    case 'F': // Bursting: a small blast
      wovenBurstAt(s.x, s.y, 60 * sp.size, 1.2 * sp.power, sp);
      puff(s.x, s.y, '#ffb04a', 2, 16, 20);
      break;
    case 'W': // Splashing: leaves a little pool of its element
      zones.push({ type: 'woven', x: s.x, y: s.y, r: 48 * sp.size, life: 2.5, max: 2.5, tick: 0, spec: sp, charged: 0 });
      shapeBits(s.x, s.y, 'drop', col, 8, 160, 40);
      break;
    case 'E': { // Shattering: splits into shards that fly on
      const a = Math.atan2(s.vy, s.vx);
      for (const da of [-0.5, 0, 0.5]) {
        launch(s.x, s.y, { x: Math.cos(a + da), y: Math.sin(a + da) }, { dmg: 0.7 * sp.power, type: sp.elem, speed: 420, r: 4, fx: 'woven', spec: sp, life: 0.5, look: 'woven' });
        shots[shots.length - 1].shard = true; shots[shots.length - 1].hit = new Set([f]);
      }
      shapeBits(s.x, s.y, 'shard', col, 6, 200);
      break;
    }
    case 'A': { // Chaining: a spark jumps to one more foe
      const o = nearestFoe(s.x, s.y, 170, new Set([f]));
      if (o) {
        damageFoe(o, 1.2 * sp.power, 'lightning'); applyWovenFx(o, sp, 0, s);
        fx.push({ kind: 'bolt', pts: [{ x: s.x, y: s.y }, { x: o.x, y: o.y }], life: 0.25, max: 0.25, color: '#fff6a0' });
      }
      break;
    }
    case 'S': // Seeking: (it already curved in) a puff of light
      fx.push({ kind: 'rays', x: s.x, y: s.y, r: 30, color: col, life: 0.3, max: 0.3, rot: rnd(0, TAU) });
      break;
  }
}

// ── woven spells in action ──
function solidTemps() { return tempSolids.filter(b => b.solid !== false); }

function applyWovenFx(f, sp, dealt, src, inPool) {
  if (!f || f.dead) return;
  const fx = sp.fx;
  if (fx.has('burn')) f.burn = Math.max(f.burn || 0, 2.5 * sp.dur);
  if (fx.has('slow')) f.slow = Math.max(f.slow || 0, 2.5 * sp.dur);
  if (fx.has('freeze') && !inPool) applyCC(f, 'freeze', 1.4 * sp.dur);
  if (fx.has('knock')) { if (inPool) applyCC(f, 'root', 0.6); else if (src) knock(f, src.x, src.y, 220 * sp.size); }
  if (fx.has('shock')) applyCC(f, 'stun', 0.35);
  if (fx.has('confuse')) applyCC(f, 'confuse', 2.5 * sp.dur);
  if (fx.has('poison')) { f.poison = Math.max(f.poison || 0, 3); f.poisonDps = Math.max(f.poisonDps || 0, 0.8); }
  if (fx.has('drain') && dealt) healPlayer(dealt * 0.35 / potency); // dealt already carries the power
}

// Elements react: lightning electrifies water, fire ignites poison, water steams out fire.
function react(type, x, y, r) {
  const el = ELEM_OF[type] || type;
  for (const z of zones) {
    if (z.life <= 0 || Math.hypot(z.x - x, z.y - y) > z.r + r) continue;
    const zEl = z.spec ? z.spec.elem : z.type === 'fire' ? 'fire' : z.type === 'spring' ? 'water' : !z.type ? 'poison' : null;
    const poison = !z.type || (z.spec && z.spec.fx.has('poison'));
    if (el === 'air' && zEl === 'water' && !(z.charged > 0)) {
      z.charged = 4;
      floatText(z.x, z.y - z.r - 8, 'ELECTRIFIED!', TYPE_COLOR.lightning, 15);
      SFX.lightning();
    } else if (el === 'fire' && poison) {
      z.life = 0;
      floatText(z.x, z.y - z.r - 8, 'IGNITED!', TYPE_COLOR.fire, 16);
      aoe(z.x, z.y, z.r + 30, 5, 'fire', 220);
      burst(z.x, z.y, '#ff8a3a', 40, 380);
      SFX.explode(false);
      shake = Math.max(shake, 8);
    } else if (el === 'water' && zEl === 'fire') {
      z.life = 0;
      floatText(z.x, z.y - z.r - 8, 'STEAM!', '#ddd', 15);
      areaCC(z.x, z.y, z.r + 20, 'confuse', 2.5, 'rgba(230,230,230,0.8)');
    }
  }
}

function wovenBurstAt(x, y, rad, dmg, sp) {
  for (const f of foes) {
    if (f.dead || Math.hypot(f.x - x, f.y - y) > rad + f.r) continue;
    const dealt = damageFoe(f, dmg, sp.elem);
    applyWovenFx(f, sp, dealt, { x, y });
  }
  ring(x, y, rad, TYPE_COLOR[sp.elem], 0.45);
  fx.push({ kind: 'nova', elem: sp.elem, x, y, r: rad, life: 0.5, max: 0.5 });
  elemHit(sp.elem, x, y, 1.6 * sp.size);
  react(sp.elem, x, y, rad);
}

function castWoven(sp) {
  const col = TYPE_COLOR[sp.elem];
  if (sp.form === 'bolt') {
    const a = aimFrom(player), base = Math.atan2(a.y, a.x);
    for (let i = 0; i < sp.count; i++) {
      const ang = base + (i - (sp.count - 1) / 2) * 0.16;
      launch(player.x, player.y, { x: Math.cos(ang), y: Math.sin(ang) },
             { dmg: 2.4 * sp.power, type: sp.elem, speed: 540, r: 6 + 2 * sp.size, pierce: sp.pierce, fx: 'woven', spec: sp });
    }
  } else if (sp.form === 'burst') {
    if (sp.elem === 'spirit') {
      // Blessing: heal, plus a buff for each upgrade
      healPlayer(3 * sp.power);
      const t = 6 * sp.dur;
      if (sp.key.includes('F', 2)) player.empower = Math.max(player.empower, t);
      if (sp.key.includes('W', 2)) player.regen = Math.max(player.regen, t);
      if (sp.key.includes('E', 2)) player.skin = Math.max(player.skin, t);
      if (sp.key.includes('A', 2)) player.haste = Math.max(player.haste, t);
      if (sp.key.includes('S', 2)) player.ward = Math.max(player.ward, 2);
      // the finish adds one more gift
      if (sp.finish === 'F') wovenBurstAt(player.x, player.y, 110, 1.2 * sp.power, { ...sp, elem: 'fire', fx: new Set(['burn']) });
      else if (sp.finish === 'W') healPlayer(2);
      else if (sp.finish === 'E') for (const f of foes) { if (!f.dead && !f.structure && Math.hypot(f.x - player.x, f.y - player.y) < 140) knock(f, player.x, player.y, 260); }
      else if (sp.finish === 'A') player.haste = Math.max(player.haste, 3) + 2;
      else if (sp.finish === 'S') player.ward = (player.ward || 0) + 1;
      fx.push({ kind: 'rays', x: player.x, y: player.y, r: 80, color: '#fff6b0', life: 0.7, max: 0.7, rot: 0 });
      ring(player.x, player.y, 90, col, 0.6);
      shapeBits(player.x, player.y, 'plus', '#fff6b0', 10, 120, 80);
      return;
    }
    const rad = 150 * sp.size * (1 + 0.2 * (sp.count - 1));
    wovenBurstAt(player.x, player.y, rad, 2 * sp.power, sp);
    if (sp.finish === 'F') {
      // Echoing: a second pulse a moment later, on the caster's side
      const x = player.x, y = player.y, side = curSide, caster = player;
      setTimeout(() => { if (state === 'play' || state === 'dead') withSide(side, () => wovenBurstAt(x, y, rad * 0.8, 1.2 * sp.power, sp), caster); }, 450);
    }
    else if (sp.finish === 'W') zones.push({ type: 'woven', x: player.x, y: player.y, r: rad * 0.75, life: 2.5, max: 2.5, tick: 0, spec: sp, charged: 0, ringZone: true });
    else if (sp.finish === 'E') { for (const f of foes) if (!f.dead && !f.structure && Math.hypot(f.x - player.x, f.y - player.y) < rad + f.r) knock(f, player.x, player.y, 380); fx.push({ kind: 'cracks', ...crackLines(player.x, player.y, rad * 0.8, 7), life: 1.2, max: 1.2 }); }
    else if (sp.finish === 'A') for (let i = 0; i < 6; i++) { const a = i * TAU / 6; launch(player.x, player.y, { x: Math.cos(a), y: Math.sin(a) }, { dmg: 0.8 * sp.power, type: sp.elem, speed: 460, r: 4, fx: 'woven', spec: sp, life: 0.6 }); shots[shots.length - 1].shard = true; }
    else if (sp.finish === 'S') { const n = foes.filter(f => !f.dead && Math.hypot(f.x - player.x, f.y - player.y) < rad + f.r).length; if (n) healPlayer(0.5 * n); }
  } else if (sp.form === 'pool') {
    if (sp.mine) {
      if (traps.length >= 8) traps.shift();
      traps.push({ x: player.x, y: player.y + 6, arm: 0.6, life: 45, spec: sp });
      castMessage(`${MINE_NAME[sp.elem]} set`, col);
      return;
    }
    const p = targetPoint(480, 150);
    zones.push({ type: 'woven', x: p.x, y: p.y, r: 90 * sp.size, r0: 90 * sp.size, life: 5 * sp.dur, max: 5 * sp.dur, tick: 0, spec: sp, charged: 0 });
    if (sp.elem === 'air' && sp.count > 1) zones[zones.length - 1].charged = 99; // a charged whirlwind is a lightning storm
    react(sp.elem, p.x, p.y, 90 * sp.size);
  } else if (sp.form === 'wall') {
    const a = aimFrom(player, 500);
    const cx = player.x + a.x * 75, cy = player.y + a.y * 75, px = -a.y, py = a.x;
    const segs = Math.round(5 * sp.size) + (sp.count - 1) * 2 + (sp.finish === 'E' ? 2 : 0); // Towering: longer
    const life = 8 * sp.dur * (sp.finish === 'W' ? 1.5 : 1); // Enduring: lasts longer
    for (let i = 0; i < segs; i++) {
      const o = (i - (segs - 1) / 2) * 27, x = cx + px * o, y = cy + py * o;
      if (isWater(x, y) || (mode === 'battle' && !inArena(x, y, 16))) continue;
      tempSolids.push({ x, y, r: 15, life, kind: 'wall', elem: sp.elem, spec: sp, solid: sp.elem !== 'spirit', tick: 0, side: curSide, born: elapsed });
      puff(x, y + 6, '#c2a57a', 1, 12, 8);
      // Repelling: the wall shoves foes away as it rises
      if (sp.finish === 'A') for (const f of foes) if (!f.dead && !f.structure && Math.hypot(f.x - x, f.y - y) < 70) knock(f, x, y, 260);
    }
    shake = Math.max(shake, 4);
  } else if (sp.form === 'creature') {
    summonCritter(sp);
  }
}

function makeRoom() {
  while (allies.length >= MAX_HELPERS) {
    const old = allies.shift();
    burst(old.x, old.y, '#aaa', 12, 140);
    castMessage('Your oldest helper fades', '#aaa');
  }
}

function summonCritter(sp) {
  makeRoom();
  const C = CRITTER[sp.elem], a = rnd(0, TAU);
  const tough = sp.finish === 'E' ? 1.5 : 1; // Armoured
  allies.push({ kind: 'critter', elem: sp.elem, spec: sp, x: player.x + Math.cos(a) * 40, y: player.y + Math.sin(a) * 40,
                life: 25 * sp.dur, max: 25 * sp.dur, hp: C.hp * sp.size * tough, maxHp: C.hp * sp.size * tough, cd: 0.6, ang: a,
                r: 10 * Math.sqrt(sp.size), taunt: !!C.taunt, healT: 2 });
  burst(player.x + Math.cos(a) * 40, player.y + Math.sin(a) * 40, TYPE_COLOR[sp.elem], 24, 220);
}

function updateCritter(a, dt) {
  const C = CRITTER[a.elem], sp = a.spec;
  const t = nearestFoe(a.x, a.y, 420);
  const engage = t && Math.hypot(t.x - player.x, t.y - player.y) < 520;
  const swift = sp.finish === 'A' ? 1.3 : 1, keen = sp.finish === 'S' ? 1.4 : 1;
  const spd = C.spd * (1 + 0.2 * (sp.count - 1)) * swift;
  if (engage && C.melee) {
    const d = moveToward(a, t.x, t.y, spd, dt, a.r + t.r);
    if (d <= a.r + t.r + 8 && a.cd <= 0) {
      a.cd = C.cd / swift;
      const dealt = damageFoe(t, C.dmg * sp.power, a.elem, true);
      applyWovenFx(t, sp, dealt, a);
      elemHit(a.elem, t.x, t.y, 0.6);
    }
  } else {
    // keep near you, circling
    a.ang += dt * (C.spd / 140);
    moveToward(a, player.x + Math.cos(a.ang) * 60, player.y + Math.sin(a.ang) * 45, spd, dt, 4);
    if (engage && a.cd <= 0 && Math.hypot(t.x - a.x, t.y - a.y) < C.range * keen) {
      a.cd = C.cd / (1 + 0.3 * (sp.count - 1)) / swift;
      launch(a.x, a.y, aimFrom(a, C.range * keen), { dmg: C.dmg * sp.power, type: a.elem, speed: 480, r: 5, fx: 'woven', spec: sp, ally: true });
    }
  }
  if (C.heals || sp.heal || sp.finish === 'W') { // Kindly helpers heal you too
    a.healT -= dt;
    if (a.healT <= 0) { a.healT = 2; if (player.hp < player.maxHp) healPlayer(0.6); }
  }
  pushOut(a, a.r);
}

function summon(kind) {
  makeRoom();
  const a = rnd(0, TAU);
  allies.push({ kind, x: player.x + Math.cos(a) * 40, y: player.y + Math.sin(a) * 40,
                life: ALLY_LIFE[kind], max: ALLY_LIFE[kind], cd: 0.4, ang: a, r: ALLY_R[kind], hp: ALLY_HP[kind] || 0 });
  burst(player.x + Math.cos(a) * 40, player.y + Math.sin(a) * 40, kind === 'dragon' ? '#ff5a2a' : '#fff', kind === 'dragon' ? 50 : 16, 260);
}

// Run a spell at its complexity's power: what it creates remembers that power,
// and the buffs it gives last longer.
const BUFF_KEYS = ['skin', 'haste', 'empower', 'ward', 'mirror', 'sanct', 'regen', 'phoenix', 'omni'];
// one flourish per hand-made spell as it goes off (at the caster)
const FLAIR = {
  AA:   p => { fx.push({ kind: 'arcs', x: p.x, y: p.y, r: 150, color: '#fffbe0', rot: rnd(0, TAU), life: 0.5, max: 0.5 }); leafSwirl(p.x, p.y, 12, 280); },
  FE:   p => { puff(p.x, p.y + 6, '#ffb04a', 1, 12, 10); },
  WE:   p => { const t = targetPoint(420, 140); puff(t.x, t.y, '#7a5a32', 3, 22, 4); shapeBits(t.x, t.y, 'drop', '#8a6a44', 8, 150, 60); },
  WS:   p => { shapeBits(p.x, p.y, 'plus', '#9dffb0', 9, 70, 90, 1.2); puff(p.x, p.y, '#9dffb0', 1, 26, 10); },
  ES:   p => { for (let i = 0; i < 10; i++) { const a = i * TAU / 10; particles.push({ shape: 'shard', x: p.x + Math.cos(a) * 70, y: p.y + Math.sin(a) * 70, vx: -Math.cos(a) * 260, vy: -Math.sin(a) * 260, r: 4, life: 0.35, decay: 2.8, color: '#a8845a', rot: a, spin: 0 }); } },
  AS:   p => { fx.push({ kind: 'arcs', x: p.x, y: p.y, r: 50, color: '#fff6a0', rot: rnd(0, TAU), life: 0.4, max: 0.4 }); },
  SA:   p => { if (p.blinkFrom) { fx.push({ kind: 'streak', x1: p.blinkFrom.x, y1: p.blinkFrom.y, x2: p.x, y2: p.y, color: '#e6ccff', life: 0.35, max: 0.35 }); puff(p.blinkFrom.x, p.blinkFrom.y, '#c77dff', 2, 18, 20); fx.push({ kind: 'rays', x: p.x, y: p.y, r: 40, color: '#e6ccff', life: 0.35, max: 0.35, rot: 0 }); } },
  EWS:  p => { const t = targetPoint(500, 150); puff(t.x, t.y, '#7dff4a', 4, 30, 10); },

function castWithPotency(key, fn) {
  const pot = potencyOf(key);
  const lists = () => [shots, zones, storms, traps, allies, meteors, waves, tempSolids];
  const before = lists().map(l => new Set(l));
  const buffs = BUFF_KEYS.map(k => player[k] || 0);
  const prev = potency;
  potency = pot;
  const from = { x: player.x, y: player.y };
  try { fn(); if (FLAIR[key]) FLAIR[key]({ x: player.x, y: player.y, blinkFrom: key === 'SA' ? from : null }); }
  finally {
    potency = prev;
    lists().forEach((l, i) => { for (const o of l) if (!before[i].has(o) && o.pot == null) o.pot = pot; });
    BUFF_KEYS.forEach((k, i) => {
      const gain = (player[k] || 0) - buffs[i];
      if (gain > 0 && k !== 'phoenix') player[k] = buffs[i] + (k === 'ward' ? Math.round(gain * pot) : gain * pot);
