}

function drawBuildButtons() {
  if (mode !== 'battle' || !teams || !teams.pending || state !== 'play') return;
  const ok = canBuildAt(player.x, player.y);
  // element chips: what your turret or titan will be
  for (const c of buildChips()) {
    const on = teams.buildElem === c.elem;
    circle(c.x, c.y, c.r + (on ? 3 : 0), on ? TYPE_COLOR[c.elem] + '55' : 'rgba(10,14,28,0.9)', TYPE_COLOR[c.elem], on ? 3 : 1.5);
    drawGlyph(ELEM_GLYPH[c.elem], c.x, c.y, 20, TYPE_COLOR[c.elem]);
  }
  const e = teams.buildElem, ch = buildChips()[0], weak = elemWeakTo(e).map(x => ELEM_NAME[x]).join(' & ');
  ctx.textAlign = 'center'; ctx.font = '11px system-ui, sans-serif'; ctx.fillStyle = '#ddd';
  ctx.fillText(`${ELEM_NAME[e]}: strong vs ${ELEM_NAME[elemBeats(e)]} · weak vs ${weak}`, W / 2, ch.y + ch.r + 15);
  for (const bb of buildButtons()) {
    const turret = bb.key === 'turret', live = !turret || ok;
    roundRect(bb.x, bb.y, bb.w, bb.h, 10);
    ctx.fillStyle = 'rgba(16,22,40,0.92)'; ctx.fill();
    ctx.strokeStyle = live ? TEAM_COLOR.blue : '#555'; ctx.lineWidth = 2; ctx.stroke();
    ctx.textAlign = 'center';
    ctx.fillStyle = live ? '#fff' : '#888';
    ctx.font = 'bold 15px system-ui, sans-serif';
    ctx.fillText(`${turret ? 'Build' : 'Send'} ${ELEM_NAME[teams.buildElem]} ${turret ? 'Turret' : 'Titan'}`, bb.x + bb.w / 2, bb.y + 20);
    ctx.font = '10px system-ui, sans-serif';
    ctx.fillStyle = '#aaa';
    ctx.fillText(turret ? (ok ? 'here, on open ground' : 'walk onto open ground') : `turn ends in ${Math.ceil(teams.pending.t)}s`, bb.x + bb.w / 2, bb.y + 36);
  }
}

// one small creature dot per kind, filling up toward the next 10
function drawHunt(x, y) {
  ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'left';
  let cx = x;
  for (const k of Object.keys(FOES)) {
    const n = tally[k] || 0, frac = (n % 10) / 10;
    circle(cx + 6, y - 4, 6, 'rgba(0,0,0,0.5)', FOES[k].color, 1.5);
    if (frac > 0) {
      ctx.fillStyle = FOES[k].color;
      ctx.beginPath(); ctx.moveTo(cx + 6, y - 4); ctx.arc(cx + 6, y - 4, 6, -Math.PI / 2, -Math.PI / 2 + TAU * frac); ctx.closePath(); ctx.fill();
    }
    ctx.fillStyle = n >= 10 ? '#ffd24a' : '#bbb';
    const label = String(n);
    ctx.fillText(label, cx + 15, y);
    cx += 22 + ctx.measureText(label).width;
  }
  if (masterHunter) { ctx.fillStyle = '#ffd24a'; ctx.fillText('★', cx, y); }
}

function drawBattleMap() {
  const w = Math.min(160, W * 0.38), h = w * ARENA_H / WORLD, x = W - w - 12, y = 12, k = w / (WORLD * 2);
  const mx = v => x + (v + WORLD) * k, my = v => y + (v + ARENA_H) * k;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, TAU); ctx.fill();
  const cw = CELL * k;
  for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
    const v = terr[j * COLS + i];
    if (!v) continue;
    ctx.fillStyle = v === 1 ? 'rgba(74,168,255,0.45)' : 'rgba(255,74,90,0.45)';
    ctx.fillRect(x + i * cw, y + j * cw, cw + 0.5, cw + 0.5);
  }
  ctx.strokeStyle = 'rgba(199,125,255,0.6)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, TAU); ctx.stroke();
  for (const list of [friends, foes]) for (const u of list) {
    if (u.dead || u.proxyOf) continue;
    const c = TEAM_COLOR[u.team];
    if (u.kind === 'sigil') {
      // a bright diamond (white rim while walled), pulsing so you can find it
      const sx = mx(u.x), sy = my(u.y), d = 4.5 + Math.sin(elapsed * 5) * 1;
      ctx.beginPath(); ctx.moveTo(sx, sy - d); ctx.lineTo(sx + d, sy); ctx.lineTo(sx, sy + d); ctx.lineTo(sx - d, sy); ctx.closePath();
      ctx.fillStyle = c; ctx.fill();
      ctx.strokeStyle = u.wall > 0 ? '#fff' : '#ffd24a'; ctx.lineWidth = 1.5; ctx.stroke();
    } else if (u.structure) { ctx.fillStyle = c; const s = u.kind === 'nexus' ? 7 : 4; ctx.fillRect(mx(u.x) - s / 2, my(u.y) - s / 2, s, s); }
    else circle(mx(u.x), my(u.y), u.kind === 'titan' ? 2.8 : u.kind === 'wizard' ? 2 : 1, c);
  }
  const rival = net.role === 'host' ? rivalP : otherHero;
  if (versus && rival && !rival.dead) circle(mx(rival.x), my(rival.y), 3, '#ffb3b3', TEAM_COLOR.red, 1.5);
  circle(mx(player.x), my(player.y), 2.5, '#fff');
  return h;
}

function drawMinimap() {
  if (mode === 'battle') { drawBattleMap(); return; }
  const s = Math.min(110, W * 0.26), x = W - s - 12, y = 12, k = s / (WORLD * 2);
  const mx = v => x + (v + WORLD) * k, my = v => y + (v + WORLD) * k;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x, y, s, s);
  ctx.strokeStyle = 'rgba(199,125,255,0.5)'; ctx.lineWidth = 1; ctx.strokeRect(x, y, s, s);
  // terrain
  for (const f of FORESTS) circle(mx(f.x), my(f.y), f.r * k, 'rgba(40,110,60,0.55)');
  ctx.beginPath(); ctx.ellipse(mx(LAKE.x), my(LAKE.y), LAKE.rx * k, LAKE.ry * k, 0, 0, TAU);
  ctx.fillStyle = 'rgba(40,110,200,0.7)'; ctx.fill();
  for (const i of ISLANDS) circle(mx(i.x), my(i.y), Math.max(1.5, i.r * k), '#c9b27a');
  for (const c of CASTLES) { ctx.strokeStyle = '#aaa'; ctx.strokeRect(mx(c.x - c.h), my(c.y - c.h), c.h * 2 * k, c.h * 2 * k); }
  for (const sc of scrolls) if (!sc.taken) circle(mx(sc.x), my(sc.y), 2, '#efe0b8');
  circle(mx(boat.x), my(boat.y), 2, '#b07a40');
  circle(mx(0), my(0), 3, '#c77dff');
  for (const c of chests) {
    if (c.boss.dead && !c.opened) circle(mx(c.x), my(c.y), 3.5, '#ffd24a');
  }
  for (const b of foes) {
    if (!b.boss) continue;
    if (b.dead) { circle(mx(b.def.x), my(b.def.y), 3, '#555'); continue; }
    circle(mx(b.x), my(b.y), 4, b.def.color, '#000', 1);
  }
  circle(mx(player.x), my(player.y), 2.5, '#fff');
}

// ── pentagram panel ──────────────────────────────────────────────────────────
function drawSeqPath(list, color) {
  if (!list.length) return;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';
  for (let i = 1; i < list.length; i++) {
    const a = nodePos(NODE_ORDER.indexOf(list[i - 1])), b = nodePos(NODE_ORDER.indexOf(list[i]));
    const col = color || ELEMENTS[list[i]].color;
    if (a.x === b.x && a.y === b.y) {
      circle(a.x, a.y, PENT.S * 0.62 + (i % 3) * 4, null, col, 3);
      continue;
    }
    ctx.strokeStyle = col;
    ctx.lineWidth = 6;
    ctx.shadowColor = col;
    ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    ctx.shadowBlur = 0;
  }
}

function drawSlots(list, highlight) {
  const n = MAX_SEQ, s = PENT.slot, gap = 5;
  const total = n * s + (n - 1) * gap;
  const x0 = PENT.cx - total / 2;
  for (let i = 0; i < n; i++) {
    const x = x0 + i * (s + gap), y = PENT.slotY - s / 2;
    roundRect(x, y, s, s, 5);
    ctx.fillStyle = i < list.length ? 'rgba(30,20,50,0.9)' : 'rgba(255,255,255,0.05)';
    ctx.fill();
    ctx.strokeStyle = i < list.length ? ELEMENTS[list[i]].color : 'rgba(255,255,255,0.15)';
    ctx.lineWidth = i === highlight ? 3 : 1.5;
    ctx.stroke();
    if (i < list.length) drawGlyph(list[i], x + s / 2, y + s / 2, s * 0.8, ELEMENTS[list[i]].color);
  }
}

function drawPentagram(ghost) {
  const { cx, cy, R, S } = PENT;
  const g = ctx.createLinearGradient(0, panelTop - 30, 0, H);
  g.addColorStop(0, 'rgba(8,6,16,0)');
  g.addColorStop(0.2, 'rgba(8,6,16,0.82)');
  g.addColorStop(1, 'rgba(8,6,16,0.95)');
  ctx.fillStyle = g;
  ctx.fillRect(0, panelTop - 30, W, H - panelTop + 30);

  circle(cx, cy, R * 1.08, 'rgba(40,20,70,0.35)', 'rgba(199,125,255,0.3)', 2);
  ctx.strokeStyle = 'rgba(199,125,255,0.3)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= 5; i++) {
    const p = nodePos((i * 2) % 5);
    i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y);
  }
  ctx.stroke();

  const list = ghost || seq;
  drawSeqPath(list);

  if (!ghost && finger && seq.length) {
    const last = nodePos(NODE_ORDER.indexOf(seq[seq.length - 1]));
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 3;
    ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(finger.x, finger.y); ctx.stroke();
    ctx.setLineDash([]);
  }

  const showKeys = window.matchMedia && window.matchMedia('(pointer: fine)').matches;
  for (let i = 0; i < 5; i++) {
    const el = NODE_ORDER[i], e = ELEMENTS[el], p = nodePos(i);
    const count = list.filter(v => v === el).length;
    const active = !ghost && castPtr !== null && curNode === i;
    const pulse = nodePulse[i];
    const s = S * (1 + pulse * 0.18);
    if (count || active) { ctx.shadowColor = e.color; ctx.shadowBlur = 18 + pulse * 20; }
    roundRect(p.x - s / 2, p.y - s / 2, s, s, 8);
    ctx.fillStyle = count ? 'rgba(40,24,64,0.95)' : 'rgba(22,16,34,0.95)';
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = e.color;
    ctx.lineWidth = active ? 4 : 2.5;
    ctx.stroke();
    drawGlyph(el, p.x, p.y, s * 0.72, e.color);
    if (count) {
      circle(p.x + s / 2, p.y - s / 2, 9, e.color);
      ctx.fillStyle = '#111';
      ctx.font = 'bold 11px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(count, p.x + s / 2, p.y - s / 2 + 4);
    }
    if (showKeys) {
      ctx.fillStyle = 'rgba(255,255,255,0.45)';
      ctx.font = '10px system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(`${e.name} [${e.key}]`, p.x, p.y + s / 2 + 12);
    }
  }

  drawSlots(list, ghost ? list.length - 1 : -1);

  if (castMsg && !ghost) {
    ctx.globalAlpha = Math.min(1, castMsg.life * 1.5);
    ctx.textAlign = 'center';
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillStyle = castMsg.color;
    ctx.fillText(castMsg.text, cx, PENT.msgY);
    ctx.globalAlpha = 1;
  }
}

// ── overlays ─────────────────────────────────────────────────────────────────
function dim(a) { ctx.fillStyle = `rgba(5,3,10,${a})`; ctx.fillRect(0, 0, W, H); }

function drawTitle() {
  dim(0.72);
  const maxW = Math.min(W - 40, 520);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#c77dff';
  ctx.font = `bold ${Math.min(52, W / 8)}px Georgia, serif`;
  let y = Math.max(70, panelTop * 0.16);
  ctx.fillText('PENTAGRAM', W / 2, y);
  y += 34;
  ctx.fillStyle = '#e6e0f0';
  ctx.font = '15px system-ui, sans-serif';
  const lines = [
    'Slide across the five elements to weave a spell (up to seven). Release to cast. Most patterns fizzle: find the ones that work, and remember them.',
    'Tilt the phone (or hold and drag) to walk. Touch the field to shoot arrows. Attack spells load onto the FIRE button.',
    'Longer spells follow a pattern: what it’s made of, then its shape, then upgrades.',
  ];
  for (const l of lines) y = wrapText(l, W / 2, y, maxW, 20) + 8;
  ctx.fillStyle = '#ffb08a';
  ctx.font = 'italic 15px Georgia, serif';
  y = wrapText('A whisper: “Fire, then fire again…”', W / 2, y + 2, maxW, 20) + 6;

  // mode choices
  const bw = Math.min(300, W - 48), bh = 50, gap = 10, bx = W / 2 - bw / 2;
  const opts = [
    { title: 'Adventure', sub: 'Explore, hunt the five guardians, find the scrolls', color: '#c77dff', go: startGame },
    { title: 'Battle · Easy', sub: 'Score with ground, kills and sigils · even sides', color: TEAM_COLOR.blue, go: () => startBattle('easy') },
    { title: 'Battle · Hard', sub: 'Same rules, but red sends far more minions', color: TEAM_COLOR.red, go: () => startBattle('hard') },
    { title: 'Battle · vs Friend', sub: 'Play a friend online with a room code', color: '#ffd166', go: openLobby },
  ];
  titleButtons = opts.map((o, i) => ({ ...o, x: bx, y: y + i * (bh + gap), w: bw, h: bh }));
  for (const b of titleButtons) {
    roundRect(b.x, b.y, b.w, b.h, 10);
    ctx.fillStyle = 'rgba(20,14,34,0.92)'; ctx.fill();
    ctx.strokeStyle = b.color; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = b.color;
    ctx.font = 'bold 17px system-ui, sans-serif';
    ctx.fillText(b.title, W / 2, b.y + 22);
    ctx.fillStyle = '#bbb';
    ctx.font = '12px system-ui, sans-serif';
    ctx.fillText(b.sub, W / 2, b.y + 40);
  }
  y += opts.length * (bh + gap) + 14;
  if (best > 0) {
    ctx.fillStyle = '#ccc';
    ctx.font = '14px system-ui, sans-serif';
    ctx.fillText(`Best score ${best.toLocaleString()}`, W / 2, y);
  }
  ctx.globalAlpha = 1;
}

function drawReveal() {
  dim(0.8);
  const combo = reveal.combo;
  // replay the pattern one element at a time
  const cycle = combo.length + 2;
  const step = Math.min(combo.length, Math.floor((reveal.t * 2.2) % cycle) + 1);
  drawPentagram(combo.slice(0, step).split(''));

  ctx.textAlign = 'center';
  const maxW = Math.min(W - 40, 480);
  let y = Math.max(60, panelTop * 0.18);
  ctx.fillStyle = '#ffd24a';
  ctx.font = 'bold 16px system-ui, sans-serif';
  ctx.fillText(reveal.title, W / 2, y);
  y += 22;
  ctx.fillStyle = TIER_COLOR[combo.length];
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.fillText(`TIER ${combo.length} · ${TIERS[combo.length].toUpperCase()}`, W / 2, y);
  y += 40;
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(36, W / 11)}px Georgia, serif`;
  ctx.fillText(reveal.name, W / 2, y);
  y += 28;
  ctx.fillStyle = '#bbb';
  ctx.font = '14px system-ui, sans-serif';
  ctx.fillText(combo.split('').map(c => ELEMENTS[c].name).join(' → '), W / 2, y);
  y += 22;
  const gs = Math.min(40, (W - 40) / combo.length - 6);
  const x0 = W / 2 - (combo.length * (gs + 6) - 6) / 2;
  for (let i = 0; i < combo.length; i++) {
    const el = combo[i], x = x0 + i * (gs + 6);
    roundRect(x, y, gs, gs, 6);
    ctx.fillStyle = 'rgba(30,20,50,0.9)'; ctx.fill();
    ctx.strokeStyle = ELEMENTS[el].color; ctx.lineWidth = 2; ctx.stroke();
    drawGlyph(el, x + gs / 2, y + gs / 2, gs * 0.75, ELEMENTS[el].color);
  }
  y += gs + 30;
  ctx.fillStyle = '#ffb08a';
  ctx.font = 'italic 15px Georgia, serif';
  y = wrapText('Memorise it. The scroll crumbles once you look away.', W / 2, y, maxW, 20);
  if (reveal.t > 1.2) {
    ctx.fillStyle = '#ffd24a';
    ctx.font = 'bold 16px system-ui, sans-serif';
    ctx.globalAlpha = 0.6 + Math.sin(elapsed * 3) * 0.4;
    ctx.fillText('[ tap to continue ]', W / 2, y + 16);
    ctx.globalAlpha = 1;
  }
}

function drawDead() {
  if (mode === 'battle') {
    dim(Math.min(0.45, overlayT));
    ctx.textAlign = 'center';
    ctx.fillStyle = '#e44';
    ctx.font = `bold ${Math.min(40, W / 10)}px Georgia, serif`;
    ctx.fillText('YOU FELL', W / 2, panelTop * 0.4);
    ctx.fillStyle = '#ddd';
    ctx.font = '16px system-ui, sans-serif';
    ctx.fillText(`Back in the fight in ${Math.max(0, Math.ceil(5 - overlayT))}…`, W / 2, panelTop * 0.4 + 34);
    return;
  }
  dim(Math.min(0.7, overlayT));
  ctx.textAlign = 'center';
  ctx.fillStyle = '#e44';
  ctx.font = `bold ${Math.min(52, W / 8)}px Georgia, serif`;
  ctx.fillText('YOU FELL', W / 2, panelTop * 0.4);
  ctx.fillStyle = '#ddd';
  ctx.font = '16px system-ui, sans-serif';
  ctx.fillText(`Score ${score.toLocaleString()}   ·   Best ${best.toLocaleString()}`, W / 2, panelTop * 0.4 + 36);
  ctx.fillText('Your score and defeated guardians stay.', W / 2, panelTop * 0.4 + 58);
  if (overlayT > 0.8) {
    ctx.fillStyle = '#ffd24a';
    ctx.font = 'bold 18px system-ui, sans-serif';
    ctx.fillText('[ tap to rise at the shrine ]', W / 2, panelTop * 0.4 + 100);
  }
}

function drawBattleEnd(win) {
  dim(Math.min(0.75, overlayT));
  ctx.textAlign = 'center';
  ctx.fillStyle = win ? '#ffd24a' : '#ff4a5a';
  ctx.font = `bold ${Math.min(52, W / 8)}px Georgia, serif`;
  const y = panelTop * 0.35;
  const draw = teams && teams.result === 'draw';
  if (draw) ctx.fillStyle = '#ccc';
  ctx.fillText(draw ? 'DRAW' : win ? 'VICTORY' : 'DEFEAT', W / 2, y);
  ctx.font = 'bold 20px system-ui, sans-serif';
  ctx.fillStyle = TEAM_COLOR.blue; ctx.fillText(`You ${teams.blue.score}`, W / 2 - 70, y + 38);
  ctx.fillStyle = TEAM_COLOR.red; ctx.fillText(`Red ${teams.red.score}`, W / 2 + 70, y + 38);
  ctx.fillStyle = '#ddd';
  ctx.font = '15px system-ui, sans-serif';
  const why = teams.endedBy === 'base'
    ? (teams.baseFell === 'red' ? `You destroyed the red base! (+${BASE_BONUS})` : `Red destroyed your base. (+${BASE_BONUS} to red)`)
    : 'Time’s up.';
  ctx.fillText(why, W / 2, y + 64);
  ctx.fillText(teams.groundTo ? `Most ground: ${teams.groundTo === 'blue' ? 'you' : 'red'} (+${GROUND_BONUS})   ·   Your kills ${kills}` : `Ground level   ·   Your kills ${kills}`, W / 2, y + 86);
  if (overlayT > 1) {
    ctx.fillStyle = '#c77dff';
    ctx.font = 'bold 17px system-ui, sans-serif';
    ctx.fillText('[ tap to return to the title ]', W / 2, y + 118);
  }
}

function drawWon() {
  if (mode === 'battle') { drawBattleEnd(true); return; }
  dim(Math.min(0.75, overlayT));
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd24a';
  ctx.font = `bold ${Math.min(40, W / 11)}px Georgia, serif`;
  const y = panelTop * 0.35;
  ctx.fillText('The five guardians have fallen', W / 2, y);
  ctx.fillStyle = '#ddd';
  ctx.font = '16px system-ui, sans-serif';
  const m = Math.floor(elapsed / 60), s = Math.floor(elapsed % 60).toString().padStart(2, '0');
  ctx.fillText(`Score ${score.toLocaleString()}   ·   Time ${m}:${s}   ·   Foes ${kills}`, W / 2, y + 36);
  if (overlayT > 1) {
    ctx.fillStyle = '#c77dff';
    ctx.font = 'bold 17px system-ui, sans-serif';
    ctx.fillText('[ tap to keep exploring ]', W / 2, y + 76);
  }
}

// ── loop ─────────────────────────────────────────────────────────────────────
function tick(dt) {
  overlayT += dt;
  for (let i = 0; i < 5; i++) nodePulse[i] = Math.max(0, nodePulse[i] - dt * 4);
  if (shake > 0) shake = Math.max(0, shake - dt * 40);
  if (flash > 0) flash = Math.max(0, flash - dt * 1.5);
  if (castMsg && (castMsg.life -= dt) <= 0) castMsg = null;
  if (banner && (banner.life -= dt) <= 0) banner = null;
  if (net.role === 'guest' && state !== 'title') { guestUpdate(dt); return; }
  if (net.role === 'host' && (state === 'won' || state === 'lost')) {
    net.sendT = (net.sendT || 0) - dt;
    if (net.sendT <= 0) { net.sendT = 1; net.send(makeSnapshot()); netEvents = []; }
  }
  if (state === 'play') update(dt);
  else if (state === 'dead' && mode === 'battle') {
    update(dt); // the battle goes on while you wait
    if (overlayT > 5 && state === 'dead') respawn();
  }
  else if (state === 'reveal') reveal.t += dt;
  else if (state === 'title') elapsed += dt;
}

function render() {
  // start every frame from a clean context, in case a previous frame threw mid-draw
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.setLineDash([]);
  ctx.fillStyle = '#0b0a12';
  ctx.fillRect(0, 0, W, H);
  if (state === 'title') {
    if (!player.face) resetPlayer();
    drawWorld();
    drawPentagram();
    drawTitle();
    return;
  }
  drawWorld();
  if (flash > 0) { ctx.fillStyle = `rgba(255,246,176,${flash * 0.7})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'play' && timeStop > 0) { ctx.fillStyle = 'rgba(200,200,220,0.28)'; ctx.fillRect(0, 0, W, H); }
  else if (state === 'play' && timeWarp > 0) { ctx.fillStyle = 'rgba(60,120,255,0.13)'; ctx.fillRect(0, 0, W, H); }
  if (state === 'reveal') { drawReveal(); return; }
  drawHUD();
  drawPentagram();
  drawFireButton();   // on top of the pentagram's backdrop
  drawOrderButton();
  drawOrders();
  if (state === 'dead') drawDead();
  if (state === 'won') drawWon();
  if (state === 'lost') drawBattleEnd(false);
}

let last = performance.now();
function loop(now) {
  // schedule first so one bad frame can't stop the game
  requestAnimationFrame(loop);
  if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const v = viewSize();
  if (v.w !== W || v.h !== H) resize();
  try {
    tick(dt);
    render();
  } catch (err) {
    console.error(err);
  }
}
requestAnimationFrame(loop);
</script>
</body>
