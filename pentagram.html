// a menu button: just the word, in capitals, filling its row top to bottom;
// a long word is squished sideways to fit rather than shrunk
function menuButton(b) {
  const word = b.title.toUpperCase();
  const fs = b.h * 1.3; // capitals are about 0.7 of the font size: this fills the row
  ctx.font = `${fs}px ${SERIF_BIG}`;
  ctx.textAlign = 'center';
  const w = ctx.measureText(word).width, sx = Math.min(1, b.w / w);
  ctx.save();
  ctx.translate(b.x + b.w / 2, b.y + b.h / 2 + fs * 0.35);
  ctx.scale(sx, 1);
  ctx.shadowColor = b.selected ? b.color : 'rgba(10,8,30,0.85)'; ctx.shadowBlur = b.selected ? 18 : 10;
  ctx.fillStyle = b.color;
  ctx.fillText(word, 0, 0);
  ctx.restore();
}

// your hero, big, doing a little routine: the wizard twirls sparks from the
// staff, the spacefarer floats and fires the blaster; tap it to make it cast
function drawMenuHero(cx, cy, s, dt) {
  menuT += dt;
  menuCast = Math.max(0, menuCast - dt);
  const t = menuT, every = 2.6, phase = (t % every) / every;
  const casting = menuCast > 0 || phase > 0.78;
  const elemCol = TYPE_COLOR[ELEM_CYCLE[Math.floor(t / every) % 5]];
  // a soft glow behind
  const g = ctx.createRadialGradient(cx, cy, 4, cx, cy, s * 34);
  g.addColorStop(0, mySkin === 'space' ? 'rgba(74,168,255,0.35)' : 'rgba(199,125,255,0.35)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(cx, cy, s * 34, 0, TAU); ctx.fill();
  ctx.save();
  if (mySkin === 'space') {
    // zero-g: drift, tilt, jetpack puffs, and a blaster shot now and then
    const bob = Math.sin(t * 1.6) * 5;
    ctx.translate(cx, cy + bob); ctx.rotate(Math.sin(t * 0.9) * 0.08); ctx.scale(s, s);
    if (Math.random() < 0.5) menuFx.push({ x: cx - 12 * s, y: cy + bob + 4 * s, vx: rnd(-30, -10), vy: rnd(20, 60), r: rnd(2, 4), life: 0.7, color: 'rgba(200,220,255,0.8)' });
    drawAstronaut(0, 0, 1, '#c77dff', '#4aa8ff', { x: 1, y: 0 }, casting ? '#fff' : elemCol);
    if (casting && Math.random() < 0.6) menuFx.push({ x: cx + 22 * s, y: cy + bob, vx: rnd(380, 520), vy: rnd(-20, 20), r: 3, life: 0.5, color: elemCol, bolt: true });
  } else {
    // the wizard bobs, raises the staff, and showers sparks of each element in turn
    const bob = Math.sin(t * 2) * 3, lift = casting ? 6 : 0;
    ctx.translate(cx, cy + bob); ctx.scale(s, s);
    drawWizardFigure(0, 0, Math.sin(t * 0.7) > 0 ? 1 : -1, '#4b2d7a', '#6a3fb0', casting ? '#fff' : elemCol, lift);
    const ox = cx + 16 * s, oy = cy + bob - (20 + lift) * s;
    const n = casting ? 3 : Math.random() < 0.3 ? 1 : 0;
    for (let i = 0; i < n; i++) { const a = rnd(-Math.PI, 0); const sp = rnd(60, casting ? 220 : 90); menuFx.push({ x: ox, y: oy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, r: rnd(1.5, 3.5), life: 0.9, color: elemCol }); }
  }
  ctx.restore();
  // sparks, puffs and bolts
  for (const f of menuFx) {
    f.x += f.vx * dt; f.y += f.vy * dt; f.life -= dt; if (!f.bolt) f.vy += 60 * dt;
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life * 2));
    if (f.bolt) { ctx.strokeStyle = f.color; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(f.x - 14, f.y); ctx.lineTo(f.x, f.y); ctx.stroke(); }
    else circle(f.x, f.y, f.r, f.color);
  }
  ctx.globalAlpha = 1;
  menuFx = menuFx.filter(f => f.life > 0 && f.x < W + 20);
}

function drawHowTo(y, bx, bw) {
  menuButton({ title: 'How to Play', color: '#ffd24a', x: bx, y, w: bw, h: 44 });
  const top = y + 56, bottom = H - 66;
  ctx.save();
  ctx.beginPath(); ctx.rect(0, top, W, bottom - top); ctx.clip();
  roundRect(bx - 6, top, bw + 12, bottom - top, 12); ctx.fillStyle = 'rgba(10,8,30,0.78)'; ctx.fill();
  let yy = top + 6 - howtoScroll;
  const L = bx + 8, Wd = bw - 16;
  for (const [kind, text] of HOWTO) {
    if (kind === 'h') {
      yy += 16;
      ctx.textAlign = 'left'; ctx.fillStyle = '#ffd24a'; ctx.font = `22px ${SERIF_BIG}`;
      ctx.fillText(text.toUpperCase(), L, yy + 18);
      ctx.strokeStyle = 'rgba(255,210,74,0.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(L, yy + 26); ctx.lineTo(L + Wd, yy + 26); ctx.stroke();
      yy += 36;
    } else if (kind === 'p') {
      ctx.textAlign = 'left'; ctx.fillStyle = '#c77dff'; ctx.font = `15px ${SERIF}`;
      ctx.fillText('•', L + 2, yy + 14);
      ctx.fillStyle = '#efe9f8';
      yy = wrapText(text, L + 18, yy + 14, Wd - 18, 20) - 6;
    } else if (kind === 'star') {
      // the casting star, with a sample swipe drawn on it
      const cx = W / 2, cy = yy + 70, R = 54;
      const pt = i => { const a = -Math.PI / 2 + i * TAU / 5; return [cx + Math.cos(a) * R, cy + Math.sin(a) * R]; };
      ctx.strokeStyle = 'rgba(199,125,255,0.4)'; ctx.lineWidth = 1.5; ctx.beginPath();
      for (let i = 0; i <= 5; i++) { const [px, py] = pt((i * 2) % 5); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
      ctx.stroke();
      const order = ['S', 'W', 'F', 'E', 'A'];
      const k = (elapsed * 0.6) % 1;                         // a swipe: Earth then Water (Venom Dart)
      ctx.strokeStyle = '#ffd24a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      const [ax, ay] = pt(3), [bx2, by2] = pt(1);
      ctx.globalAlpha = 0.8; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ax + (bx2 - ax) * k, ay + (by2 - ay) * k); ctx.stroke(); ctx.globalAlpha = 1;
      order.forEach((r, i) => { const [px, py] = pt(i); circle(px, py, 15, 'rgba(10,8,30,0.9)', ELEMENTS[r].color, 2); drawGlyph(r, px, py, 16, ELEMENTS[r].color); });
      ctx.textAlign = 'center'; ctx.font = `italic 12px ${SERIF}`; ctx.fillStyle = '#ccc';
      ctx.fillText('Slide Earth → Water, then lift: Venom Dart', cx, cy + R + 30);
      yy += 160;
    } else if (kind === 'shapes') {
      // the five shapes

      items.forEach(([r, name], i) => {
        const cx = L + cw * (i + 0.5);
        circle(cx, yy + 22, 16, 'rgba(10,8,30,0.9)', ELEMENTS[r].color, 2);

      });
      yy += 68;
    } else if (kind === 'cycle') {
      // the element circle, with arrows to what each one beats

      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.fillStyle = 'rgba(255,255,255,0.8)';
      for (let i = 0; i < 5; i++) {
        const [x1, y1] = pos[i], [x2, y2] = pos[(i + 1) % 5], dx = x2 - x1, dy = y2 - y1, d = Math.hypot(dx, dy), ux = dx / d, uy = dy / d;
        const sx = x1 + ux * 20, sy = y1 + uy * 20, ex = x2 - ux * 22, ey = y2 - uy * 22;
        ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(ex + ux * 6, ey + uy * 6); ctx.lineTo(ex - uy * 5, ey + ux * 5); ctx.lineTo(ex + uy * 5, ey - ux * 5); ctx.closePath(); ctx.fill();
      }

    } else if (kind === 'H') {

      ctx.beginPath(); ctx.moveTo(L, yy); ctx.lineTo(L + Wd, yy); ctx.stroke();
      ctx.textAlign = 'center'; ctx.fillStyle = '#c77dff'; ctx.font = `26px ${SERIF_BIG}`;

    } else if (kind === 'res') {
      // each element's team power, and how strong it gets at full share

        ctx.fillText(RES_TEXT[e], L + 80, yy + 14);
        ctx.textAlign = 'right'; ctx.fillStyle = '#ffd24a';
        ctx.fillText(`up to ${Math.round(RES_MAX[e] * 100)}%`, L + Wd, yy + 14);
        yy += 21;
      }
      yy += 4;
    } else if (kind === 'minions') {
      // the five kinds of minion
      const roles = { wisp: 'flies, shoots from range', archer: 'longest range', imp: 'quick, fights up close', brute: 'tough, fights up close', flyer: 'fastest, flies' };
      for (const k of MINION_KINDS) {
        const e = UNITS[k].elem;

        ctx.fillStyle = '#efe9f8'; ctx.font = `13px ${SERIF}`;
        ctx.fillText(roles[k], L + 84, yy + 14);
        yy += 21;
      }

    } else if (kind === 'points') {

      ctx.font = `14px ${SERIF}`;
      for (const [what, pts] of rows) {
        ctx.textAlign = 'left'; ctx.fillStyle = '#efe9f8'; ctx.fillText(what, L + 18, yy + 14);
        ctx.textAlign = 'right'; ctx.fillStyle = '#ffd24a'; ctx.fillText(pts, L + Wd, yy + 14);

  howtoMax = Math.max(0, yy + howtoScroll - bottom + 16);

  titleButtons = [{ title: 'Back', color: '#c9c3d8', x: bx + bw / 2 - 70, y: H - 56, w: 140, h: 40, go: () => goMenu('main') }];
  menuButton(titleButtons[0]);
}

function drawReveal() {
  dim(0.8);
  const combo = reveal.combo;
  // replay the pattern one element at a time
  const cycle = combo.length + 2;
  const step = Math.min(combo.length, Math.floor((reveal.t * 2.2) % cycle) + 1);
  drawPentagram(combo.slice(0, step).split(''));

  ctx.textAlign = 'center';
  const maxW = Math.min(W - 40, 480);
  let y = Math.max(60, panelTop * 0.18);
  ctx.fillStyle = '#ffd24a';
  ctx.font = 'bold 16px "Big Caslon", "Libre Caslon Text", Georgia, serif';
  ctx.fillText(reveal.title, W / 2, y);
  y += 22;
  ctx.fillStyle = TIER_COLOR[combo.length];
  ctx.font = 'bold 13px "Big Caslon", "Libre Caslon Text", Georgia, serif';
  ctx.fillText(`TIER ${combo.length} · ${TIERS[combo.length].toUpperCase()} · COMPLEXITY ${complexityOf(combo).toFixed(1)} · POWER ×${potencyOf(combo).toFixed(2)}`, W / 2, y);
  y += 40;
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.min(36, W / 11)}px "Big Caslon", "Libre Caslon Display", "Libre Caslon Text", Georgia, serif`;
  ctx.fillText(reveal.name, W / 2, y);
  y += 28;
  ctx.fillStyle = '#bbb';
  ctx.font = '14px "Big Caslon", "Libre Caslon Text", Georgia, serif';
  ctx.fillText(combo.split('').map(c => ELEMENTS[c].name).join(' → '), W / 2, y);
  y += 22;
  const gs = Math.min(40, (W - 40) / combo.length - 6);
  const x0 = W / 2 - (combo.length * (gs + 6) - 6) / 2;
  for (let i = 0; i < combo.length; i++) {
    const el = combo[i], x = x0 + i * (gs + 6);
    roundRect(x, y, gs, gs, 6);
    ctx.fillStyle = 'rgba(30,20,50,0.9)'; ctx.fill();
    ctx.strokeStyle = ELEMENTS[el].color; ctx.lineWidth = 2; ctx.stroke();
    drawGlyph(el, x + gs / 2, y + gs / 2, gs * 0.75, ELEMENTS[el].color);
  }
  y += gs + 30;
  ctx.fillStyle = '#ffb08a';
  ctx.font = 'italic 15px "Big Caslon", "Libre Caslon Display", "Libre Caslon Text", Georgia, serif';
  y = wrapText('Memorise it. The scroll crumbles once you look away.', W / 2, y, maxW, 20);
  if (reveal.t > 1.2) {
    ctx.fillStyle = '#ffd24a';
    ctx.font = 'bold 16px "Big Caslon", "Libre Caslon Text", Georgia, serif';
    ctx.globalAlpha = 0.6 + Math.sin(elapsed * 3) * 0.4;
    ctx.fillText('[ tap to continue ]', W / 2, y + 16);
    ctx.globalAlpha = 1;
  }
}

// how each side's points were made
function drawScoreTable(y) {
  const B = teams.breakdown || {}, of = (t, c) => B[t] && B[t][c];
  const rows = SCORE_CATS.filter(c => TEAMS.some(t => of(t, c)));
  const w = Math.min(W - 32, 360), x = W / 2 - w / 2, rh = 21;
  const h = (rows.length + 2) * rh + 12;
  roundRect(x, y, w, h, 10); ctx.fillStyle = 'rgba(10,8,20,0.88)'; ctx.fill();
  ctx.strokeStyle = 'rgba(199,125,255,0.4)'; ctx.lineWidth = 1; ctx.stroke();
  // a column per team, the last against the right edge
  const col = {}, step = three() ? w * 0.22 : w * 0.34 - 14;
  TEAMS.forEach((t, i) => col[t] = x + w - 14 - (TEAMS.length - 1 - i) * step);
  let ry = y + 20;
  ctx.font = 'bold 12px "Big Caslon", "Libre Caslon Text", Georgia, serif';
  ctx.textAlign = 'left'; ctx.fillStyle = '#aaa'; ctx.fillText('HOW IT WAS SCORED', x + 12, ry);
  ctx.textAlign = 'right';
  for (const t of TEAMS) { ctx.fillStyle = TEAM_COLOR[t]; ctx.fillText(teamLabel(t), col[t], ry); }
  const cell = (e, cx, col) => {
    ctx.textAlign = 'right';
    if (!e) { ctx.fillStyle = '#555'; ctx.fillText('–', cx, ry); return; }
    ctx.fillStyle = col; ctx.font = 'bold 13px "Big Caslon", "Libre Caslon Text", Georgia, serif'; ctx.fillText(String(e.pts), cx, ry);
    ctx.fillStyle = '#888'; ctx.font = '11px "Big Caslon", "Libre Caslon Text", Georgia, serif';
    if (e.n > 1 && e.pts !== e.n) ctx.fillText(`×${e.n} `, cx - ctx.measureText(String(e.pts)).width - 10, ry);
  };
  for (const c of rows) {
    ry += rh;
    ctx.textAlign = 'left'; ctx.fillStyle = '#ddd'; ctx.font = '13px "Big Caslon", "Libre Caslon Text", Georgia, serif';
    ctx.fillText(c, x + 12, ry);
    for (const t of TEAMS) cell(of(t, c), col[t], TEAM_LIGHT[t]);
  }
  if (!rows.length) { ry += rh; ctx.textAlign = 'left'; ctx.fillStyle = '#888'; ctx.font = '13px "Big Caslon", "Libre Caslon Text", Georgia, serif'; ctx.fillText('No points scored', x + 12, ry); }
  ry += rh + 2;
  ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.beginPath(); ctx.moveTo(x + 10, ry - 15); ctx.lineTo(x + w - 10, ry - 15); ctx.stroke();
  ctx.font = 'bold 14px "Big Caslon", "Libre Caslon Text", Georgia, serif';
  ctx.textAlign = 'left'; ctx.fillStyle = '#fff'; ctx.fillText('Total', x + 12, ry);
  ctx.textAlign = 'right';
  for (const t of TEAMS) { ctx.fillStyle = TEAM_COLOR[t]; ctx.fillText(String(teams[t].score), col[t], ry); }
  ctx.textAlign = 'center';
  return y + h;
}

  return y + 14;
}
// a bar split into coloured shares, with the percentage written in each
function endShares(label, counts, colorOf, L, w, y) {
  const keys = Object.keys(counts).filter(k => counts[k] > 0), total = keys.reduce((n, k) => n + counts[k], 0);
  ctx.font = `13px ${SERIF}`; ctx.textAlign = 'left'; ctx.fillStyle = '#ccc';
  ctx.fillText(label, L, y + 12);
  const bx = L + 46, bw = w - 46, by = y, bh = 18;
  roundRect(bx, by, bw, bh, 5); ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fill();
  if (!total) { ctx.fillStyle = '#888'; ctx.textAlign = 'center'; ctx.fillText('none', bx + bw / 2, by + 13); return y + 26; }
  let x = bx;
  for (const k of keys) {
    const f = counts[k] / total, sw = bw * f;
    ctx.fillStyle = colorOf(k); ctx.fillRect(x, by, sw, bh);
    if (sw > 30) { ctx.fillStyle = '#111'; ctx.textAlign = 'center'; ctx.font = `bold 11px ${SERIF}`; ctx.fillText(Math.round(f * 100) + '%', x + sw / 2, by + 13); }
    x += sw;
  }
  return y + 26;
}
// a key of colours under a shares bar
function endKey(items, L, w, y) {
  ctx.font = `12px ${SERIF}`; ctx.textAlign = 'left';
  let x = L;
  for (const [col, name] of items) {
    const tw = ctx.measureText(name).width + 22;
    if (x + tw > L + w) { x = L; y += 16; }
    circle(x + 5, y + 8, 5, col); ctx.fillStyle = '#ddd'; ctx.fillText(name, x + 13, y + 12); x += tw;
  }
  return y + 22;
}
// land held over the match: two lines, and a marker wherever the lead changed hands
function endLandGraph(land, L, w, y) {
  const h = 110, gx = L + 28, gw = w - 30, gy = y + 4;
  const pts = land.map(([t, ...c]) => [t, ...c.map(v => v / FIELD_CELLS * 100)]);
  const tMax = Math.max(60, ...pts.map(p => p[0])), top = Math.max(50, Math.ceil((Math.max(...pts.map(p => Math.max(...p.slice(1))), 0) + 5) / 10) * 10);
  const X = t => gx + t / tMax * gw, Y = v => gy + h - v / top * h;
  ctx.fillStyle = 'rgba(255,255,255,0.05)'; ctx.fillRect(gx, gy, gw, h);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.lineWidth = 1; ctx.font = `10px ${SERIF}`; ctx.fillStyle = '#999'; ctx.textAlign = 'right';
  for (let v = 0; v <= top; v += top / 2) { ctx.beginPath(); ctx.moveTo(gx, Y(v)); ctx.lineTo(gx + gw, Y(v)); ctx.stroke(); ctx.fillText(Math.round(v) + '%', gx - 4, Y(v) + 3); }
  ctx.textAlign = 'center';
  for (const t of [0, tMax / 2, tMax]) ctx.fillText(clockText(t), X(t), gy + h + 13);
  // where the lead switched
  let lead = null, switches = 0, lastLabel = -1e9;
  for (const [t, ...v] of pts) {
    const hi = Math.max(...v), tops = TEAMS.filter((_, i) => v[i] === hi);
    const now = tops.length === 1 ? tops[0] : lead;
    if (lead && now && now !== lead) {
      switches++;
      ctx.strokeStyle = TEAM_COLOR[now]; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.moveTo(X(t), gy); ctx.lineTo(X(t), gy + h); ctx.stroke(); ctx.setLineDash([]);
      ctx.fillStyle = TEAM_COLOR[now]; ctx.font = `bold 10px ${SERIF}`;
      if (X(t) - lastLabel > 62) { ctx.fillText(now === 'blue' ? 'you lead' : `${TEAM_NAME[now].toLowerCase()} leads`, clamp(X(t), gx + 24, gx + gw - 24), gy - 3); lastLabel = X(t); }
    }
    lead = now;
  }
  for (const [team, i] of TEAMS.map((t, k) => [t, k + 1])) {
    ctx.strokeStyle = TEAM_COLOR[team]; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    ctx.beginPath(); pts.forEach((p, k) => k ? ctx.lineTo(X(p[0]), Y(p[i])) : ctx.moveTo(X(p[0]), Y(p[i]))); ctx.stroke();
  }
  return { y: gy + h + 20, switches };
}
function drawBattleEnd(win) {
  dim(Math.min(0.92, overlayT * 1.5));
  const draw = teams && teams.result === 'draw';
  const bw = Math.min(W - 28, 380), L = W / 2 - bw / 2;
  ctx.textAlign = 'center';
  ctx.fillStyle = draw ? '#ccc' : win ? '#ffd24a' : '#ff4a5a';
  ctx.font = `italic 14px ${SERIF}`;
  ctx.fillText(draw ? (three() ? 'The universes stay locked together…' : 'The two universes stay locked together…') : win ? 'Your universe is preserved!' : 'Your universe is being overwritten…', W / 2, 26);
  ctx.font = `${Math.min(48, W / 8)}px ${SERIF_BIG}`;
  ctx.fillText(draw ? 'DRAW' : win ? 'VICTORY' : 'DEFEAT', W / 2, 70);
  ctx.font = `bold ${three() ? 18 : 20}px ${SERIF}`;
  const gap = three() ? Math.min(118, W * 0.3) : 140;
  TEAMS.forEach((t, i) => { ctx.fillStyle = TEAM_COLOR[t]; ctx.fillText(`${teamLabel(t)} ${teams[t].score}`, W / 2 + (i - (TEAMS.length - 1) / 2) * gap, 100); });
  ctx.fillStyle = '#ccc'; ctx.font = `13px ${SERIF}`;
  const fell = teams.baseFell, by = teams.baseBy, lc = t => TEAM_NAME[t].toLowerCase();
  ctx.fillText(teams.endedBy !== 'base' || !fell ? 'Time’s up.'
    : by === 'blue' ? `You destroyed the ${lc(fell)} base! (+${BASE_BONUS})`
    : !by ? `The ${lc(fell)} base fell`
    : fell === 'blue' ? `${TEAM_NAME[by]} destroyed your base (+${BASE_BONUS} to ${lc(by)})`
    : `${TEAM_NAME[by]} destroyed the ${lc(fell)} base (+${BASE_BONUS} to ${lc(by)})`, W / 2, 120);

  // the report scrolls
  const top = 132, bottom = H - 62;
  ctx.save(); ctx.beginPath(); ctx.rect(0, top, W, bottom - top); ctx.clip();
  roundRect(L - 6, top, bw + 12, bottom - top, 12); ctx.fillStyle = 'rgba(10,8,30,0.7)'; ctx.fill();
  let y = top + 8 - endScroll;
  const S = teams.stats || newStats(), SS = TEAMS.map(t => S[t] || newStats()[t]), B = SS[0];
  const each = f => SS.map(f), RL = L + 6, RW = bw - 12;
  y = drawScoreTable(y) + 12;
  // land
  y = endHeading('Land', RL, RW, y);
  y = endHeads(RL, RW, y);
  const last = S.land[S.land.length - 1] || [0, ...TEAMS.map(t => teams[t].cells)];
  y = endRow('Ground held at the end', TEAMS.map((t, i) => Math.round(last[i + 1] / FIELD_CELLS * 100) + '%'), RL, RW, y);
  y = endRow('Points from land', TEAMS.map(t => teams.groundTo === t ? GROUND_BONUS : 0), RL, RW, y);
  if (S.land.length > 1) {
    const g = endLandGraph(S.land, L + 6, bw - 12, y + 12);
    y = g.y;
    ctx.textAlign = 'left'; ctx.fillStyle = '#ccc'; ctx.font = `italic 12px ${SERIF}`;
    ctx.fillText(g.switches ? `The lead in land changed hands ${g.switches} time${g.switches > 1 ? 's' : ''}.` : 'The lead in land never changed hands.', L + 6, y + 4);
    y += 14;
  }
  // sigils and kills
  y = endHeading('Sigils and kills', RL, RW, y + 8);
  y = endHeads(RL, RW, y);
  y = endRow('Sigils broken', each(X => X.sigils || 0), RL, RW, y);
  const K = (S, k) => (S.killed && S.killed[k]) || 0;
  y = endRow('Minions killed (1 each on the tally)', each(X => K(X, 'minion')), RL, RW, y);
  y = endRow('Titans killed (5 each)', each(X => K(X, 'titan')), RL, RW, y);
  y = endRow('Wizards and heroes killed (10 each)', each(X => K(X, 'wizard') + K(X, 'hero')), RL, RW, y);
  y = endRow('Kill tally (every 5 = 1 point)', each(X => X.tally || 0), RL, RW, y);
  y = endRow('Turrets destroyed (5 points each)', each(X => K(X, 'turret')), RL, RW, y);
  y = endRow('Points from kills', each(X => X.killPts || 0), RL, RW, y);
  // spells
  y = endHeading('Spells cast', RL, RW, y + 8);
  y = endHeads(RL, RW, y);
  for (const el of CHARGE_TYPES) {
    drawGlyph(ELEM_GLYPH[el], L + 14, y + 10, 13, TYPE_COLOR[el]);
    ctx.textAlign = 'left'; ctx.fillStyle = TYPE_COLOR[el]; ctx.font = `14px ${SERIF}`; ctx.fillText(ELEM_NAME[el], L + 26, y + 14);
    y = endRow('', each(X => X.spells[el] || 0), RL, RW, y);
  }
  const tot = o => Object.values(o || {}).reduce((a, b) => a + b, 0);
  y = endRow('Total', each(X => tot(X.spells)), RL, RW, y);
  for (const t of TEAMS) {
    const used = teams[t] && teams[t].used;
    if (!used || !used.size || t === 'blue') continue;
    ctx.textAlign = 'left'; ctx.fillStyle = TEAM_COLOR[t]; ctx.font = `italic 12px ${SERIF}`;
    ctx.fillText(`${TEAM_NAME[t]}’s wizards used ${used.size} different spells.`, L + 6, y + 12); y += 18;
  }
  // resonance
  y = endHeading('Resonance (average)', RL, RW, y + 8);
  y = endHeads(RL, RW, y);
  for (const el of CHARGE_TYPES) {
    const avg = S => S.resN ? Math.round(S.resSum[el] / S.resN * 100) + '%' : '–';
    drawGlyph(ELEM_GLYPH[el], L + 14, y + 10, 13, TYPE_COLOR[el]);
    ctx.textAlign = 'left'; ctx.fillStyle = TYPE_COLOR[el]; ctx.font = `13px ${SERIF}`; ctx.fillText(RES_TEXT[el], L + 26, y + 14);
    y = endRow('', each(avg), RL, RW, y);
  }
  // builds
  const elemCol = k => TYPE_COLOR[k];
  y = endHeading('Turrets built', RL, RW, y + 8);
  TEAMS.forEach((t, i) => y = endShares(teamLabel(t), SS[i].turret, elemCol, RL, RW, y));
  y = endHeading('Titans sent', RL, RW, y + 4);
  TEAMS.forEach((t, i) => y = endShares(teamLabel(t), SS[i].titan, elemCol, RL, RW, y));
  y = endKey(CHARGE_TYPES.map(e => [TYPE_COLOR[e], ELEM_NAME[e]]), L + 6, bw - 12, y);
  // minions
  y = endHeading('Minions sent', L + 6, bw - 12, y + 4);
  const kindCol = k => TYPE_COLOR[UNITS[k].elem];
  TEAMS.forEach((t, i) => y = endShares(teamLabel(t), SS[i].minions, kindCol, RL, RW, y));
  y = endKey(MINION_KINDS.map(k => [kindCol(k), `${UNITS[k].name} (${ELEM_NAME[UNITS[k].elem]})`]), L + 6, bw - 12, y);
  ctx.textAlign = 'left'; ctx.fillStyle = '#999'; ctx.font = `italic 12px ${SERIF}`;
  const theirs = TEAMS.slice(1).map((t, i) => `${tot(SS[i + 1].minions)} of ${TEAM_NAME[t].toLowerCase()}’s`);
  ctx.fillText(`${tot(B.minions)} of yours${theirs.length > 1 ? ', ' + theirs.slice(0, -1).join(', ') : ''} and ${theirs[theirs.length - 1]} took the field.`, L + 6, y + 6);
  y += 20;
  endMax = Math.max(0, y + endScroll - bottom + 8);
  endScroll = clamp(endScroll, 0, endMax);
  ctx.restore();
  if (endScroll < endMax - 4) {
    ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(255,210,74,0.85)'; ctx.font = `13px ${SERIF}`;
    ctx.fillText('▼ scroll for the full report', W / 2, bottom - 6 + Math.sin(elapsed * 4) * 2);
  }
  endButton = overlayT > 1 ? { title: 'Continue', color: '#c77dff', x: W / 2 - 90, y: H - 54, w: 180, h: 40 } : null;
  if (endButton) menuButton(endButton);
}

function drawWon() {
  if (mode === 'battle') { drawBattleEnd(true); return; }
  dim(Math.min(0.75, overlayT));
  ctx.textAlign = 'center';
  ctx.fillStyle = '#ffd24a';
  ctx.font = `bold ${Math.min(40, W / 11)}px "Big Caslon", "Libre Caslon Display", "Libre Caslon Text", Georgia, serif`;
  const y = panelTop * 0.35;
  ctx.fillText('The five guardians have fallen', W / 2, y);
  ctx.font = 'italic 15px "Big Caslon", "Libre Caslon Display", "Libre Caslon Text", Georgia, serif';
  ctx.fillText('Your universe holds… for now.', W / 2, y - 40);
  ctx.fillStyle = '#ddd';
  ctx.font = '16px "Big Caslon", "Libre Caslon Text", Georgia, serif';
  const m = Math.floor(elapsed / 60), s = Math.floor(elapsed % 60).toString().padStart(2, '0');
  ctx.fillText(`Score ${score.toLocaleString()}   ·   Time ${m}:${s}   ·   Foes ${kills}`, W / 2, y + 36);
  if (overlayT > 1) {
    ctx.fillStyle = '#c77dff';
    ctx.font = 'bold 17px "Big Caslon", "Libre Caslon Text", Georgia, serif';
    ctx.fillText('[ tap to keep exploring ]', W / 2, y + 76);
  }
}

// the pause screen, over the frozen game
function drawPaused() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;
  dim(0.62);
  const t = performance.now() / 1000, cy = H * 0.4;
  ctx.textAlign = 'center';
  ctx.shadowColor = '#c77dff'; ctx.shadowBlur = 22;
  ctx.fillStyle = '#efe9f8'; ctx.font = `${Math.round(Math.min(54, W / 6.5))}px ${SERIF_BIG}`;
  ctx.fillText('PAUSED', W / 2, cy);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#cfc8e0'; ctx.font = `italic 15px ${SERIF}`;
  ctx.fillText(mode === 'battle' ? 'The battle waits while you’re away' : 'Your adventure waits while you’re away', W / 2, cy + 34);
  let y = cy + 34;
  if (mode === 'battle' && teams) {
    // where things stand: the score and the time left
    y += 32;
    ctx.font = `bold 15px ${SERIF}`;
    const parts = TEAMS.flatMap(t => [[`${teamLabel(t)} ${teams[t].score}`, TEAM_COLOR[t]], ['  ·  ', '#888']]).concat([[`${clockText(Math.ceil(teams.time))} left`, '#fff']]);
    let x = W / 2 - parts.reduce((a, [p]) => a + ctx.measureText(p).width, 0) / 2;
    ctx.textAlign = 'left';
    for (const [p, c] of parts) { ctx.fillStyle = c; ctx.fillText(p, x, y); x += ctx.measureText(p).width; }
    ctx.textAlign = 'center';
  }
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 3);
  ctx.fillStyle = '#ffd24a'; ctx.font = `bold 17px ${SERIF}`;
  ctx.fillText(isTouch ? 'TAP TO CARRY ON' : 'CLICK OR PRESS A KEY TO CARRY ON', W / 2, y + 44);
  ctx.globalAlpha = 1;
}

// ── loop ─────────────────────────────────────────────────────────────────────
function tick(dt) {
  if (paused) return; // everything waits: clocks, foes, spells, messages
  overlayT += dt;
  for (let i = 0; i < 5; i++) nodePulse[i] = Math.max(0, nodePulse[i] - dt * 4);
  if (shake > 0) shake = Math.max(0, shake - dt * 40);
  if (flash > 0) flash = Math.max(0, flash - dt * 1.5);
  if (castMsg && (castMsg.life -= dt) <= 0) castMsg = null;
  if (banner && (banner.life -= dt) <= 0) banner = null;
  if (net.role === 'guest' && state !== 'title') { guestUpdate(dt); return; }
  if (net.role === 'host' && (state === 'won' || state === 'lost')) {
    net.sendT = (net.sendT || 0) - dt;
    if (net.sendT <= 0) { net.sendT = 1; net.send(makeSnapshot()); netEvents = []; }
  }
  if (state === 'play') update(dt);
  else if (state === 'dead' && mode === 'battle') {
    update(dt); // the battle goes on while you wait
    if (overlayT > 5 && state === 'dead') respawn();
  }
  else if (state === 'reveal') reveal.t += dt;
  else if (state === 'title') elapsed += dt;
}

function render() {
  // start every frame from a clean context, in case a previous frame threw mid-draw
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalAlpha = 1;
  ctx.shadowBlur = 0;
  ctx.setLineDash([]);
  ctx.fillStyle = '#0b0a12';
  ctx.fillRect(0, 0, W, H);
  if (state === 'title') {
    if (!player.face) resetPlayer();
    drawMenuSky();
    drawTitle();
    return;
  }
  drawWorld();
  drawAtmosphere();
  drawEclipseTint();
  drawEclipseClock(false); // faint, behind everything
  if (flash > 0) { ctx.fillStyle = `rgba(255,246,176,${flash * 0.7})`; ctx.fillRect(0, 0, W, H); }
  if (state === 'play' && timeStop > 0) { ctx.fillStyle = 'rgba(200,200,220,0.28)'; ctx.fillRect(0, 0, W, H); }
  else if (state === 'play' && timeWarp > 0) { ctx.fillStyle = 'rgba(60,120,255,0.13)'; ctx.fillRect(0, 0, W, H); }
  if (state === 'reveal') { drawReveal(); return; }
  drawHUD();
  drawPentagram();
  drawFireButton();   // on top of the pentagram's backdrop
  drawFollowButton();
  drawOrderButton();
  drawSoundTilt();
  drawEclipseClock(true); // an eclipse near or on: in front
  drawOrders();
  if (state === 'dead') drawDead();
  if (state === 'won') drawWon();
  if (state === 'lost') drawBattleEnd(false);
}

let last = performance.now();
function loop(now) {
  // schedule first so one bad frame can't stop the game
  requestAnimationFrame(loop);
  if (window.scrollX || window.scrollY) window.scrollTo(0, 0);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const v = viewSize();
  if (v.w !== W || v.h !== H) resize();
  try {
    tick(dt);
    render();
    if (paused) drawPaused();
  } catch (err) {
    console.error(err);
  }
}
requestAnimationFrame(loop);
</script>
