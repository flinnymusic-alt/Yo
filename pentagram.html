// ── drawing helpers ──────────────────────────────────────────────────────────
function circle(x, y, r, fill, stroke, lw) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  if (fill)   { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Alchemical element symbols
function drawGlyph(el, x, y, s, color) {
  const h = s * 0.42;
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1.5, s * 0.09);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  if (el === 'F' || el === 'A') {
    ctx.moveTo(0, -h); ctx.lineTo(h * 0.95, h * 0.72); ctx.lineTo(-h * 0.95, h * 0.72); ctx.closePath();
    if (el === 'A') { ctx.moveTo(-h * 0.85, h * 0.1); ctx.lineTo(h * 0.85, h * 0.1); }
  } else if (el === 'W' || el === 'E') {
    ctx.moveTo(0, h); ctx.lineTo(h * 0.95, -h * 0.72); ctx.lineTo(-h * 0.95, -h * 0.72); ctx.closePath();
    if (el === 'E') { ctx.moveTo(-h * 0.85, -h * 0.1); ctx.lineTo(h * 0.85, -h * 0.1); }
  } else {
    ctx.arc(0, 0, h * 0.85, 0, TAU);
    ctx.moveTo(h * 0.3, 0);
    ctx.arc(0, 0, h * 0.3, 0, TAU);
  }
  ctx.stroke();
  ctx.restore();
}

function wrapText(text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, y);
      line = w;
      y += lineH;
    } else {
      line = test;
    }
  }
  if (line) { ctx.fillText(line, x, y); y += lineH; }
  return y;
}

// ── world rendering ──────────────────────────────────────────────────────────
function drawArena(camX, camY) {
  // a hedge of round treetops around the field
  for (let k = 0; k < 90; k++) {
    const a = k / 90 * TAU, x = Math.cos(a) * (WORLD + 46), y = Math.sin(a) * (ARENA_H + 46);
    if (!inView(x, y, 70, camX, camY)) continue;
    const sw = Math.sin(elapsed * 1.4 + k) * windAt() * 2;
    circle(x + 6, y + 10, 46, 'rgba(15,35,20,0.45)');
    circle(x + sw, y, 44, k % 2 ? '#2f5a30' : '#345f2f');
    circle(x - 12 + sw * 1.5, y - 12, 22, '#4d8a3c');
  }
  ovalPath(0); ctx.fillStyle = meadowPattern(); ctx.fill();
  ctx.save();
  ovalPath(0); ctx.clip();                                       // everything below stays inside the oval
  // each side's land carries its colour
  for (const team of ['blue', 'red']) {
    const x = teamSide(team) * BASE_X, g = ctx.createRadialGradient(x, 0, 0, x, 0, 700);
    g.addColorStop(0, TEAM_COLOR[team] + '33'); g.addColorStop(1, TEAM_COLOR[team] + '00');
    ctx.fillStyle = g; ctx.fillRect(x - 700, -ARENA_H, 1400, ARENA_H * 2);
  }
  // the trodden road between the towers, a sandy path with soft edges
  const road = ctx.createLinearGradient(0, -70, 0, 70);
  road.addColorStop(0, 'rgba(210,185,130,0)'); road.addColorStop(0.3, 'rgba(210,185,130,0.38)');
  road.addColorStop(0.7, 'rgba(210,185,130,0.38)'); road.addColorStop(1, 'rgba(210,185,130,0)');
  ctx.fillStyle = road;
  ctx.fillRect(-BASE_X, -70, BASE_X * 2, 140);
  ctx.strokeStyle = 'rgba(255,255,255,0.12)'; ctx.setLineDash([18, 18]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -ARENA_H); ctx.lineTo(0, ARENA_H); ctx.stroke(); ctx.setLineDash([]);
  // claimed ground (only the cells on screen)
  const i0 = Math.max(0, Math.floor((camX + WORLD) / CELL)), i1 = Math.min(COLS - 1, Math.floor((camX + W + WORLD) / CELL));
  const j0 = Math.max(0, Math.floor((camY + ARENA_H) / CELL)), j1 = Math.min(ROWS - 1, Math.floor((camY + H + ARENA_H) / CELL));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const v = terr[j * COLS + i];
    if (!v) continue;
    ctx.fillStyle = v === 1 ? 'rgba(74,168,255,0.11)' : 'rgba(255,74,90,0.11)';
    ctx.fillRect(-WORLD + i * CELL, -ARENA_H + j * CELL, CELL, CELL);
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(40,70,40,0.6)'; ctx.lineWidth = 6;
  ovalPath(0); ctx.stroke();
}

function drawLasers() {
  for (const l of links) {
    if (l.a.dead || l.b.dead) continue;
    const c = TEAM_COLOR[l.team], flick = 0.55 + Math.sin(elapsed * 20 + l.a.x) * 0.15;
    ctx.strokeStyle = c; ctx.globalAlpha = flick * 0.35; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.b.x, l.b.y); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.globalAlpha = flick; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.b.x, l.b.y); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

// ── the Ghibli look: a warm, windy afternoon ──
// A painted meadow, one breeze that moves the grass, trees, robes and the
// seeds in the air, cloud shadows sliding over the land, and soft light.
function windAt(t = elapsed) { return 0.55 + 0.3 * Math.sin(t * 0.37) + 0.15 * Math.sin(t * 1.13 + 1.7); } // about 0.1–1
function hash2(i, j) {
  let h = Math.imul(i | 0, 374761393) ^ Math.imul(j | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const clear = col => col[0] === '#' ? col.slice(0, 7) + '00' : col.replace(/[\d.]+\)$/, '0)');

// the meadow: painted once onto a tile, then repeated under everything
let meadow = null;
function meadowPattern() {
  if (meadow) return meadow;
  const S = 512, c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  g.fillStyle = '#5a8743'; g.fillRect(0, 0, S, S);
  let seed = 11;
  const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  // soft washes of light and shade (wrapped, so the tile repeats seamlessly)
  const wash = (x, y, r, col) => {
    for (const dx of [-S, 0, S]) for (const dy of [-S, 0, S]) {
      const gr = g.createRadialGradient(x + dx, y + dy, 0, x + dx, y + dy, r);
      gr.addColorStop(0, col); gr.addColorStop(1, clear(col));
      g.fillStyle = gr; g.fillRect(x + dx - r, y + dy - r, r * 2, r * 2);
    }
  };
  const cols = ['rgba(140,175,80,0.35)', 'rgba(55,95,50,0.35)', 'rgba(175,185,95,0.22)', 'rgba(75,120,62,0.3)', 'rgba(205,200,120,0.14)'];
  for (let i = 0; i < 70; i++) wash(R() * S, R() * S, 30 + R() * 100, cols[i % cols.length]);
  // little brushstrokes of grass
  g.lineCap = 'round';
  for (let i = 0; i < 1100; i++) {
    const x = R() * S, y = R() * S, l = 3 + R() * 7, a = -Math.PI / 2 + (R() - 0.5) * 1;
    g.strokeStyle = R() < 0.5 ? 'rgba(38,78,36,0.32)' : 'rgba(160,200,95,0.32)';
    g.lineWidth = 1 + R() * 1.3;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  // a scatter of tiny flowers
  for (let i = 0; i < 80; i++) {
    g.globalAlpha = 0.85; g.fillStyle = ['#fff6e0', '#ffe27a', '#f6b6c8', '#d6e6ff'][i % 4];
    g.beginPath(); g.arc(R() * S, R() * S, 1 + R() * 1.4, 0, TAU); g.fill();
  }
  g.globalAlpha = 1;
  return (meadow = ctx.createPattern(c, 'repeat'));
}

// swaying grass tufts and flowers, made up on the spot for the cells on screen
function drawTufts(camX, camY) {
  const C = 44, w = windAt(), t = elapsed;
  const i0 = Math.floor(camX / C) - 1, i1 = Math.floor((camX + W) / C) + 1;
  const j0 = Math.floor(camY / C) - 1, j1 = Math.floor((camY + H) / C) + 1;
  ctx.lineCap = 'round';
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const h = hash2(i, j);
    if (h > 0.5) continue;
    const x = i * C + hash2(i, j + 99) * C, y = j * C + hash2(i + 99, j) * C;
    if (mode === 'battle' ? !inArena(x, y, 10) : (Math.abs(x) > WORLD || Math.abs(y) > WORLD || isWater(x, y))) continue;
    const sway = (Math.sin(t * 2.1 + x * 0.012 + y * 0.004) * 0.6 + 0.6) * w * 5;
    const n = 3 + Math.floor(h * 6);
    for (let k = 0; k < n; k++) {
      const bx = x + (k - n / 2) * 2.4, len = 7 + hash2(i * 7 + k, j) * 7;
      ctx.strokeStyle = k % 2 ? '#3e6e34' : '#78a84e';
      ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(bx, y);
      ctx.quadraticCurveTo(bx + sway * 0.3, y - len * 0.6, bx + sway + (k - n / 2) * 1.2, y - len);
      ctx.stroke();
    }
    if (h < 0.07) {
      // a flower nodding on its stem
      const fx = x + sway * 1.2, fy = y - 15;
      ctx.strokeStyle = '#4f7f3a'; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + sway * 0.4, y - 9, fx, fy); ctx.stroke();
      const col = ['#fff6e0', '#ffd95a', '#f7a8c4', '#b9d4ff'][Math.floor(h * 57) % 4];
      for (let q = 0; q < 5; q++) { const a = q * TAU / 5 + t * 0.3; circle(fx + Math.cos(a) * 2.6, fy + Math.sin(a) * 2.6, 2, col); }
      circle(fx, fy, 1.6, '#ffb84a');
    }
  }
}

// the shadows of clouds passing overhead
function drawCloudShadows(camX, camY) {
  const P = 1900, t = elapsed, cx = camX + W / 2, cy = camY + H / 2;
  for (let k = 0; k < 6; k++) {
    let x = hash2(k, 1) * P + t * (16 + 8 * hash2(k, 2)), y = hash2(k, 3) * P + t * 4;
    x = cx + ((((x - cx) % P) + P * 1.5) % P) - P / 2;
    y = cy + ((((y - cy) % P) + P * 1.5) % P) - P / 2;
    const r = 220 + hash2(k, 4) * 200;
    if (!inView(x, y, r * 1.6, camX, camY)) continue;
    for (const [ox, oy, f] of [[0, 0, 1], [r * 0.6, r * 0.15, 0.7], [-r * 0.55, r * 0.2, 0.65]]) {
      const g = ctx.createRadialGradient(x + ox, y + oy, 0, x + ox, y + oy, r * f);
      g.addColorStop(0, 'rgba(20,45,55,0.16)'); g.addColorStop(1, 'rgba(20,45,55,0)');
      ctx.fillStyle = g; ctx.fillRect(x + ox - r * f, y + oy - r * f, r * f * 2, r * f * 2);
    }
  }
}

// seeds, pollen, leaves and petals riding the breeze
let motes = [], moteClock = 0;
const MOTE_KINDS = ['seed', 'seed', 'pollen', 'pollen', 'leaf', 'petal'];
function newMote(camX, camY, anywhere) {
  return {
    kind: MOTE_KINDS[Math.floor(Math.random() * MOTE_KINDS.length)],
    x: anywhere ? camX + Math.random() * W : camX - 30, y: camY + Math.random() * H,
    vy: rnd(-8, 4), t: 0, ph: rnd(0, TAU), f: rnd(0.8, 1.8), s: rnd(0.8, 1.4), rot: rnd(0, TAU),
  };
}
function drawMotes(camX, camY) {
  const dt = Math.min(0.05, Math.max(0, elapsed - moteClock));
  moteClock = elapsed;
  while (motes.length < 42) motes.push(newMote(camX, camY, true));
  const w = windAt();
  for (let i = 0; i < motes.length; i++) {
    const m = motes[i];
    m.t += dt;
    m.x += (12 + w * 40) * m.s * dt + Math.sin(m.t * m.f + m.ph) * 14 * dt;
    m.y += (m.vy + Math.cos(m.t * m.f * 0.7 + m.ph) * 10) * dt;
    m.rot += dt * (1 + w) * m.f;
    if (m.x > camX + W + 40 || m.x < camX - 60 || m.y < camY - 60 || m.y > camY + H + 60) { motes[i] = newMote(camX, camY, false); continue; }
    if (m.kind === 'seed') {
      // dandelion fluff
      ctx.globalAlpha = 0.85;
      ctx.strokeStyle = '#fffaf0'; ctx.lineWidth = 0.8;
      ctx.beginPath();
      for (let q = 0; q < 6; q++) { const a = m.rot * 0.3 + q * TAU / 6; ctx.moveTo(m.x, m.y); ctx.lineTo(m.x + Math.cos(a) * 3.5 * m.s, m.y + Math.sin(a) * 3.5 * m.s); }
      ctx.stroke();
      circle(m.x, m.y, 1, '#e8dcc0');
    } else if (m.kind === 'pollen') {
      ctx.globalAlpha = 0.25 + 0.2 * Math.sin(m.t * 3 + m.ph);
      circle(m.x, m.y, 4 * m.s, '#fff2b0');
      ctx.globalAlpha = 0.9; circle(m.x, m.y, 1.4 * m.s, '#fff8d8');
    } else {
      ctx.globalAlpha = 0.9;
      ctx.save(); ctx.translate(m.x, m.y); ctx.rotate(m.rot);
      ctx.beginPath(); ctx.ellipse(0, 0, 3.6 * m.s, 1.7 * m.s, 0, 0, TAU);
      ctx.fillStyle = m.kind === 'leaf' ? (m.ph > 3 ? '#8fbf4a' : '#d9b94a') : '#f7b8cc';
      ctx.fill(); ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
}

// soft shafts of afternoon light, a warm glow and a gentle frame (screen space)
function drawAtmosphere() {
  const t = elapsed;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let k = 0; k < 3; k++) {
    const x = W * (0.1 + k * 0.32) + Math.sin(t * 0.2 + k) * 20, w = 50 + k * 30;
    const a = 0.05 + 0.03 * Math.sin(t * 0.5 + k * 2);
    const g = ctx.createLinearGradient(x, 0, x + H * 0.45, H);
    g.addColorStop(0, `rgba(255,236,180,${a})`); g.addColorStop(1, 'rgba(255,236,180,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + w, 0); ctx.lineTo(x + w + H * 0.45, H); ctx.lineTo(x + H * 0.45, H); ctx.closePath(); ctx.fill();
  }
  const sun = ctx.createRadialGradient(0, 0, 0, 0, 0, Math.max(W, H) * 0.8);
  sun.addColorStop(0, 'rgba(255,214,150,0.12)'); sun.addColorStop(1, 'rgba(255,214,150,0)');
  ctx.fillStyle = sun; ctx.fillRect(0, 0, W, H);
  ctx.restore();
  const v = ctx.createRadialGradient(W / 2, H * 0.4, Math.min(W, H) * 0.35, W / 2, H * 0.4, Math.max(W, H) * 0.8);
  v.addColorStop(0, 'rgba(20,30,40,0)'); v.addColorStop(1, 'rgba(20,30,40,0.38)');
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  // a soft shade under the top readouts so they stay readable on bright grass
  const top = ctx.createLinearGradient(0, 0, 0, 210);
  top.addColorStop(0, 'rgba(12,16,28,0.62)'); top.addColorStop(1, 'rgba(12,16,28,0)');
  ctx.fillStyle = top; ctx.fillRect(0, 0, W, 210);
}

// a fluffy cloud, lit warm from below
function drawCloud(x, y, s, a) {
  ctx.globalAlpha = a;
  const puffs = [[0, 0, 1], [-0.9, 0.25, 0.7], [0.95, 0.2, 0.75], [-0.4, -0.45, 0.75], [0.45, -0.35, 0.8], [1.6, 0.4, 0.5], [-1.55, 0.45, 0.5]];
  for (const [px, py, r] of puffs) circle(x + px * s, y + py * s + s * 0.12, r * s, '#9c7aa8');
  for (const [px, py, r] of puffs) circle(x + px * s, y + py * s, r * s * 0.95, '#f4c6c0');
  for (const [px, py, r] of puffs) if (py < 0.3) circle(x + px * s - s * 0.1, y + py * s - s * 0.12, r * s * 0.6, '#fff1e6');
  ctx.globalAlpha = 1;
}
// the menu backdrop: a dusk sky over rolling hills, with clouds and first stars
function drawMenuSky() {
  const t = elapsed;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#12143a'); g.addColorStop(0.45, '#322c6c'); g.addColorStop(0.68, '#7a5088'); g.addColorStop(0.8, '#e0937e'); g.addColorStop(1, '#f3c27e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 46; i++) {
    ctx.globalAlpha = 0.25 + 0.55 * Math.abs(Math.sin(t * 0.7 + i * 1.3));
    circle(hash2(i, 3) * W, hash2(i, 4) * H * 0.42, 0.4 + hash2(i, 5) * 1.2, '#fff');
  }
  ctx.globalAlpha = 1;
  for (let k = 0; k < 5; k++) {
    const span = W + 360, cx = ((hash2(k, 7) * span + t * (5 + k * 2.5)) % span) - 180;
    drawCloud(cx, H * (0.07 + 0.075 * k), 18 + 18 * hash2(k, 8), 0.16 + 0.04 * k);
  }
  // rolling hills, far to near
  const hills = [['#4a3f72', 0.7, 22, 0.006], ['#33305a', 0.76, 28, 0.009], ['#22243f', 0.84, 20, 0.013]];
  for (const [col, base, amp, f] of hills) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 10; x += 10) ctx.lineTo(x, H * base - Math.sin(x * f + base * 9) * amp - Math.sin(x * f * 2.3) * amp * 0.4);
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
  }
  // grass along the bottom, swaying, and fireflies
  const w = windAt();
  ctx.strokeStyle = '#1a1c30'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let x = 0; x < W; x += 6) {
    const len = 10 + hash2(x, 1) * 16, sway = (Math.sin(t * 2 + x * 0.05) * 0.5 + 0.6) * w * 6;
    ctx.moveTo(x, H); ctx.quadraticCurveTo(x + sway * 0.3, H - len * 0.6, x + sway, H - len);
  }
  ctx.stroke();
  for (let i = 0; i < 14; i++) {
    const x = (hash2(i, 9) * W + Math.sin(t * 0.4 + i) * 30 + W) % W, y = H * (0.78 + 0.18 * hash2(i, 10)) + Math.sin(t * 0.9 + i * 2) * 10;
    const a = Math.max(0, Math.sin(t * 1.5 + i * 1.7));
    ctx.globalAlpha = a * 0.35; circle(x, y, 6, '#f6ff9a');
    ctx.globalAlpha = a; circle(x, y, 1.8, '#fbffd0');
  }
  ctx.globalAlpha = 1;
}

// a soft billow of smoke, dust or glow (grows as it fades); colour must be #rrggbb
function puff(x, y, color, n, size, rise) {
  for (let i = 0; i < n; i++) {
    particles.push({ puff: true, x: x + rnd(-size, size) * 0.5, y: y + rnd(-size, size) * 0.3, vx: rnd(-30, 30), vy: -rise * rnd(0.6, 1.2),
                     r: size * rnd(0.6, 1), life: 1, decay: rnd(0.8, 1.3), color });
  }
}
// leaves whirling out from a gust
function leafSwirl(x, y, n, spd) {
  for (let i = 0; i < n; i++) {
    const a = rnd(0, TAU), s = rnd(spd * 0.4, spd);
    particles.push({ leaf: true, x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: rnd(3, 5), life: 1, decay: rnd(0.9, 1.4),
                     color: Math.random() < 0.6 ? '#8fbf4a' : '#e0c050', rot: rnd(0, TAU), spin: rnd(-12, 12) });
  }
}

function drawGround(camX, camY) {
  ctx.fillStyle = '#2c4a2e'; // deep woods beyond the edge
  ctx.fillRect(camX, camY, W, H);
  if (mode === 'battle') { drawArena(camX, camY); return; }
  ctx.fillStyle = meadowPattern();
  ctx.fillRect(-WORLD, -WORLD, WORLD * 2, WORLD * 2);

  // each guardian's land is tinted with its own colour
  for (const b of BOSSES) {
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 480);
    g.addColorStop(0, b.color + '26');
    g.addColorStop(1, b.color + '00');
    ctx.fillStyle = g;
    ctx.fillRect(b.x - 480, b.y - 480, 960, 960);
  }

  // the edge of the world: a soft line of woods
  ctx.strokeStyle = 'rgba(30,60,35,0.6)';
  ctx.lineWidth = 14;
  ctx.strokeRect(-WORLD, -WORLD, WORLD * 2, WORLD * 2);
}

function inView(x, y, pad, camX, camY) {
  return x > camX - pad && x < camX + W + pad && y > camY - pad && y < camY + H + pad;
}

function lakePath(grow) {
  ctx.beginPath();
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU, k = lakeRadiusScale(a);
    const x = LAKE.x + Math.cos(a) * (LAKE.rx * k + grow), y = LAKE.y + Math.sin(a) * (LAKE.ry * k + grow);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

function drawLake(camX, camY) {
  if (!inView(LAKE.x, LAKE.y, Math.max(LAKE.rx, LAKE.ry) + 80, camX, camY)) return;
  lakePath(16); ctx.fillStyle = '#c9b788'; ctx.fill();          // sandy bank
  lakePath(4);  ctx.fillStyle = '#e8f4f0'; ctx.globalAlpha = 0.6 + 0.2 * Math.sin(elapsed * 1.5); ctx.fill(); ctx.globalAlpha = 1; // foam at the edge
  lakePath(0);  ctx.fillStyle = '#4b97b5'; ctx.fill();
  lakePath(-40); ctx.fillStyle = '#3a82a6'; ctx.fill();
  lakePath(-120); ctx.fillStyle = '#2f6f95'; ctx.fill();
  // sunlight glinting on the water
  for (let i = 0; i < 46; i++) {
    const a = i * 2.39, d = 0.1 + (i * 0.618 % 0.85);
    const x = LAKE.x + Math.cos(a) * LAKE.rx * d + Math.sin(elapsed * 0.4 + i) * 12, y = LAKE.y + Math.sin(a) * LAKE.ry * d;
    const glint = Math.sin(elapsed * 2.2 + i * 1.7);
    if (glint < 0.4 || !isWater(x, y)) continue;
    ctx.globalAlpha = (glint - 0.4) * 1.4;
    ctx.beginPath(); ctx.ellipse(x, y, 7, 1.6, 0, 0, TAU); ctx.fillStyle = '#ffffff'; ctx.fill();
  }
  ctx.globalAlpha = 1;
  // lily pads near the shore
  for (let i = 0; i < 14; i++) {
    const a = i * 0.9 + 0.3, x = LAKE.x + Math.cos(a) * LAKE.rx * 0.86, y = LAKE.y + Math.sin(a) * LAKE.ry * 0.86 + Math.sin(elapsed + i) * 2;
    if (!isWater(x, y)) continue;
    ctx.fillStyle = '#5f9a48'; ctx.beginPath(); ctx.arc(x, y, 7, 0.4, TAU - 0.1); ctx.lineTo(x, y); ctx.fill();
    if (i % 3 === 0) circle(x + 2, y - 2, 2.4, '#ffc0d4');
  }
  // drifting ripples
  ctx.strokeStyle = 'rgba(230,248,255,0.35)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 40; i++) {
    const a = i * 2.39, d = 0.15 + (i * 0.618 % 0.8);
    const x = LAKE.x + Math.cos(a) * LAKE.rx * d + Math.sin(elapsed * 0.6 + i) * 10;
    const y = LAKE.y + Math.sin(a) * LAKE.ry * d;
    if (!isWater(x, y)) continue;
    ctx.beginPath(); ctx.moveTo(x - 10, y); ctx.quadraticCurveTo(x, y - 4, x + 10, y); ctx.stroke();
  }
  for (const i of ISLANDS) {
    circle(i.x, i.y, i.r + 8, 'rgba(230,210,150,0.35)');
    circle(i.x, i.y, i.r, '#c9b27a');
    circle(i.x + 6, i.y + 6, i.r * 0.7, '#8fa15a');
  }
  // dock
  const dx = DOCK.x - LAKE.x, dy = DOCK.y - LAKE.y, d = Math.hypot(dx, dy);
  ctx.save();
  ctx.translate(DOCK.x, DOCK.y);
  ctx.rotate(Math.atan2(dy / d, dx / d));
  ctx.fillStyle = '#7a5532';
  ctx.fillRect(-60, -14, 90, 28);
  ctx.strokeStyle = '#4e3520'; ctx.lineWidth = 2;
  for (let k = -55; k < 30; k += 12) { ctx.beginPath(); ctx.moveTo(k, -14); ctx.lineTo(k, 14); ctx.stroke(); }
  ctx.restore();
}

function drawBoat() {
  if (player.onBoat) return; // drawn under the player instead
  drawBoatAt(boat.x, boat.y, Math.atan2(LAKE.y - boat.y, LAKE.x - boat.x));
}
function drawBoatAt(x, y, ang) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(3, 5, 34, 15, 0, 0, TAU); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(36, 0); ctx.quadraticCurveTo(20, -16, -28, -13); ctx.lineTo(-30, 13); ctx.quadraticCurveTo(20, 16, 36, 0);
  ctx.fillStyle = '#8a5a2e'; ctx.fill();
  ctx.strokeStyle = '#4e3218'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#6b431f'; ctx.fillRect(-22, -9, 44, 18);
  ctx.restore();
}

function drawCastles(camX, camY) {
  for (const c of CASTLES) {
    if (!inView(c.x, c.y, c.h + 60, camX, camY)) continue;
    // flagstone courtyard
    ctx.fillStyle = 'rgba(120,115,110,0.22)';
    ctx.fillRect(c.x - c.h, c.y - c.h, c.h * 2, c.h * 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = -c.h; k <= c.h; k += 40) { ctx.moveTo(c.x + k, c.y - c.h); ctx.lineTo(c.x + k, c.y + c.h); ctx.moveTo(c.x - c.h, c.y + k); ctx.lineTo(c.x + c.h, c.y + k); }
    ctx.stroke();
    ctx.fillStyle = '#ddd';
    ctx.font = 'bold 12px "Big Caslon", "Libre Caslon Display", "Libre Caslon Text", Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText(c.name, c.x, c.y - c.h - 14);
  }
  for (const w of walls) {
    if (!inView(w.x + w.w / 2, w.y + w.h / 2, Math.max(w.w, w.h), camX, camY)) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(w.x + 4, w.y + 5, w.w, w.h);
    ctx.fillStyle = '#6d6a66';
    ctx.fillRect(w.x, w.y, w.w, w.h);
    // crenellations
    ctx.fillStyle = '#86827c';
    const horiz = w.w > w.h, len = horiz ? w.w : w.h;
    for (let k = 4; k < len - 6; k += 16) {
      if (horiz) ctx.fillRect(w.x + k, w.y + 2, 8, w.h - 4);
      else ctx.fillRect(w.x + 2, w.y + k, w.w - 4, 8);
    }
  }
}

function drawSolids(camX, camY) {
  for (const d of activeSolids) {
    if (!inView(d.x, d.y, 60, camX, camY)) continue;
    if (d.kind === 'tree') {
      // a round, fluffy tree that leans and breathes with the wind
      const R = 22 * d.s, w = windAt(), sw = (Math.sin(elapsed * 1.6 + d.x * 0.013) * 0.7 + 0.5) * w * 3 * d.s;
      ctx.fillStyle = 'rgba(20,45,28,0.35)';
      ctx.beginPath(); ctx.ellipse(d.x + 8, d.y + R * 0.55, R * 1.1, R * 0.55, 0, 0, TAU); ctx.fill();
      ctx.fillStyle = '#6b4a2e'; ctx.fillRect(d.x - 3 * d.s, d.y - 2, 6 * d.s, R * 0.55);
      const pal = d.v < 0.5 ? ['#2d5a30', '#3f7a3a', '#74ac52', '#b4d878'] : ['#34602c', '#4f8c3c', '#8cbc5a', '#cfe48a'];
      const clumps = [[0, -0.25, 0.75], [-0.55, 0, 0.55], [0.55, -0.05, 0.55], [-0.25, -0.7, 0.5], [0.3, -0.65, 0.5]];
      for (const [ox, oy, r] of clumps) circle(d.x + ox * R + sw * (0.4 - oy), d.y + oy * R, r * R, pal[0]);
      for (const [ox, oy, r] of clumps) circle(d.x + ox * R - R * 0.08 + sw * (0.6 - oy), d.y + oy * R - R * 0.1, r * R * 0.78, pal[1]);
      for (const [ox, oy, r] of clumps) if (oy < -0.1) circle(d.x + ox * R - R * 0.18 + sw * (0.8 - oy), d.y + oy * R - R * 0.22, r * R * 0.45, pal[2]);
      circle(d.x - R * 0.35 + sw, d.y - R * 0.85, R * 0.14, pal[3]);
    } else if (d.kind === 'rock') {
      // a mossy boulder
      ctx.fillStyle = 'rgba(20,45,28,0.3)';
      ctx.beginPath(); ctx.ellipse(d.x + 5, d.y + d.r * 0.6, d.r * 1.2, d.r * 0.5, 0, 0, TAU); ctx.fill();
      circle(d.x, d.y, d.r * 1.15, '#8a8a8e');
      circle(d.x + d.r * 0.2, d.y + d.r * 0.25, d.r * 0.8, '#6f7076');
      circle(d.x - d.r * 0.3, d.y - d.r * 0.35, d.r * 0.55, '#a8a6a2');
      ctx.fillStyle = '#6f9e48'; ctx.beginPath(); ctx.ellipse(d.x - d.r * 0.2, d.y - d.r * 0.75, d.r * 0.7, d.r * 0.32, -0.2, 0, TAU); ctx.fill();
    } else if (d.kind === 'palm') {
      ctx.strokeStyle = '#7a5a30'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(d.x, d.y + 10); ctx.lineTo(d.x + 3, d.y - 10); ctx.stroke();
      ctx.fillStyle = '#4f9a3a';
      for (let i = 0; i < 5; i++) {
        const a = i * TAU / 5 + 0.3 + Math.sin(elapsed * 1.8 + d.x) * 0.12 * windAt();
        ctx.beginPath(); ctx.ellipse(d.x + 3 + Math.cos(a) * 12, d.y - 10 + Math.sin(a) * 12, 13, 5, a, 0, TAU); ctx.fill();
      }
    } else if (d.kind === 'tower') {
      circle(d.x + 4, d.y + 6, d.r, 'rgba(0,0,0,0.3)');
      circle(d.x, d.y, d.r, '#6d6a66', '#4a4744', 3);
      circle(d.x, d.y, d.r * 0.6, '#86827c');
    }
  }
}

function drawGrass(camX, camY) {
  drawTufts(camX, camY);
  return;
  ctx.strokeStyle = '#2c4a2f';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (const d of deco) {
    if (!inView(d.x, d.y, 20, camX, camY)) continue;
    for (let i = -1; i <= 1; i++) { ctx.moveTo(d.x + i * 4, d.y + 5); ctx.lineTo(d.x + i * 6, d.y - 6 * d.s); }
  }
  ctx.stroke();
}

function drawScrolls() {
  for (const sc of scrolls) {
    if (sc.taken) continue;
    const y = sc.y - 6 + Math.sin(elapsed * 3 + sc.x) * 3;
    const g = ctx.createRadialGradient(sc.x, y, 0, sc.x, y, 40);
    g.addColorStop(0, 'rgba(255,230,150,0.45)'); g.addColorStop(1, 'rgba(255,230,150,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sc.x, y, 40, 0, TAU); ctx.fill();
    ctx.fillStyle = '#efe0b8';
    ctx.fillRect(sc.x - 12, y - 8, 24, 16);
    circle(sc.x - 12, y, 8, '#d8c48f');
    circle(sc.x + 12, y, 8, '#d8c48f');
    ctx.fillStyle = '#a33'; ctx.fillRect(sc.x - 2, y - 8, 4, 16);
  }
}

function drawShrine() {
  const fp = fountainPos();
  ctx.save();
  ctx.translate(fp.x, fp.y);
  drawShrineAt();
  ctx.restore();
}
function drawShrineAt() {
  const pulse = 0.5 + Math.sin(elapsed * 2) * 0.2;
  circle(0, 0, SHRINE_R, `rgba(199,125,255,${0.08 + pulse * 0.08})`, `rgba(199,125,255,${pulse})`, 2);
  ctx.strokeStyle = `rgba(199,125,255,${pulse * 0.8})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= 5; i++) {
    const a = -Math.PI / 2 + ((i * 2) % 5) * TAU / 5;
    const x = Math.cos(a) * SHRINE_R * 0.9, y = Math.sin(a) * SHRINE_R * 0.9;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
}

function drawChest(c) {
  const { x, y } = c;
  const ready = c.boss.dead && !c.opened;
  if (ready) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, 70);
    g.addColorStop(0, `rgba(255,220,90,${0.35 + Math.sin(elapsed * 4) * 0.15})`);
    g.addColorStop(1, 'rgba(255,220,90,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 70, y - 70, 140, 140);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(x - 19, y - 6, 42, 26);
  ctx.fillStyle = c.opened ? '#4a3420' : '#7a5230';
  ctx.fillRect(x - 22, y - 10, 44, 26);
  ctx.fillStyle = c.opened ? '#2a1c10' : '#8e6238';
  if (c.opened) ctx.fillRect(x - 22, y - 24, 44, 10);
  else ctx.fillRect(x - 22, y - 18, 44, 10);
  ctx.strokeStyle = '#d8b24a';
  ctx.lineWidth = 2;
  ctx.strokeRect(x - 22, y - 10, 44, 26);
  if (!c.boss.dead) {
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - 24, y - 16); ctx.lineTo(x + 24, y + 18);
    ctx.moveTo(x + 24, y - 16); ctx.lineTo(x - 24, y + 18);
    ctx.stroke();
    ctx.fillStyle = '#aaa';
    ctx.fillRect(x - 6, y - 2, 12, 10);
  } else if (!c.opened) {
    ctx.fillStyle = '#ffd24a';
    ctx.font = 'bold 12px "Big Caslon", "Libre Caslon Text", Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText('open me', x, y - 30);
  }
}

// status markers drawn over any enemy (already translated to its centre)
function drawStatus(f, r) {
  const t = elapsed;
  if (f.stone > 0) circle(0, 0, r + 1, 'rgba(140,140,140,0.85)', '#666', 2);
  if (f.burn > 0) for (let i = 0; i < 3; i++) circle(Math.sin(t * 9 + i * 2) * r * 0.6, -r * 0.4 - ((t * 40 + i * 9) % 14), 2.5, '#ffb04a');
  if (f.root > 0) { ctx.strokeStyle = '#6b4a22'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, r * 0.7, r + 4, 5, 0, 0, TAU); ctx.stroke(); }
  if (f.stun > 0) for (let i = 0; i < 3; i++) {
    const a = t * 6 + i * TAU / 3;
    circle(Math.cos(a) * r * 0.8, -r - 6 + Math.sin(a) * 3, 2.5, '#ffe14a');
  }
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px "Big Caslon", "Libre Caslon Text", Georgia, serif';
  if (f.fear > 0) { ctx.fillStyle = '#c9a0ff'; ctx.fillText('!', 0, -r - 6); }
  if (f.confuse > 0) { ctx.fillStyle = '#ff8ad8'; ctx.fillText('?', Math.sin(t * 5) * 6, -r - 6); }
}

function drawFoe(f) {
  const d = f.def, r = f.r, t = elapsed;
  ctx.save();
  ctx.translate(f.x, f.y);
  { const sq = Math.sin(t * 3 + (f.wob || 0)) * 0.03; ctx.scale(1 - sq, 1 + sq); } // breathing
  circle(3, r * 0.7, r * 0.8, 'rgba(0,0,0,0.25)');
  if (f.hex > 0) {
    ctx.beginPath(); ctx.ellipse(0, 2, 11, 8, 0, 0, TAU); ctx.fillStyle = '#4caf50'; ctx.fill();
    circle(-5, -5, 4, '#4caf50'); circle(5, -5, 4, '#4caf50');
    circle(-5, -5, 1.8, '#111'); circle(5, -5, 1.8, '#111');
  } else if (f.kind === 'slime') {
    const sq = Math.sin(t * 6 + f.wob) * 0.1;
    ctx.save(); ctx.scale(1 + sq, 1 - sq);
    ctx.beginPath(); ctx.ellipse(0, 2, r * 1.1, r * 0.9, 0, 0, TAU); ctx.fillStyle = d.color; ctx.fill();
    circle(-r * 0.35, -r * 0.25, r * 0.25, 'rgba(255,255,255,0.35)');
    ctx.restore();
    circle(-4, -1, 2.5, '#111'); circle(4, -1, 2.5, '#111');
  } else if (f.kind === 'bat') {
    const flap = Math.sin(t * 18 + f.wob) * 0.6;
    ctx.fillStyle = '#5a3a70';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(s * r * 2, -r * (0.6 + flap));
      ctx.lineTo(s * r * 1.4, r * 0.4);
      ctx.closePath(); ctx.fill();
    }
    circle(0, 0, r * 0.75, d.color);
    circle(-3, -2, 2, '#ff4'); circle(3, -2, 2, '#ff4');
  } else if (f.kind === 'skeleton') {
    ctx.strokeStyle = '#bbb'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, r * 1.1);
    ctx.moveTo(-r * 0.7, r * 0.5); ctx.lineTo(r * 0.7, r * 0.5); ctx.stroke();
    circle(0, -r * 0.2, r * 0.8, d.color);
    circle(-4, -r * 0.3, 3, '#111'); circle(4, -r * 0.3, 3, '#111');
    ctx.fillStyle = '#111'; ctx.fillRect(-4, r * 0.15, 8, 2);
  } else if (f.kind === 'ember') {
    const fl = 1 + Math.sin(t * 14 + f.wob) * 0.12;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2 * fl);
    g.addColorStop(0, 'rgba(255,140,40,0.5)'); g.addColorStop(1, 'rgba(255,80,20,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 2 * fl, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -r * 1.4 * fl); ctx.quadraticCurveTo(r, 0, 0, r); ctx.quadraticCurveTo(-r, 0, 0, -r * 1.4 * fl);
    ctx.fillStyle = d.color; ctx.fill();
    circle(0, r * 0.1, r * 0.45, '#ffd24a');
  } else if (f.kind === 'shade') {
    ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.moveTo(-r, r);
    ctx.quadraticCurveTo(-r * 1.1, -r * 1.3, 0, -r * 1.2);
    ctx.quadraticCurveTo(r * 1.1, -r * 1.3, r, r);
    for (let i = 0; i < 4; i++) ctx.lineTo(r - (i + 0.5) * r / 2, r - (i % 2 ? 0 : 6) + Math.sin(t * 6 + i) * 2);
    ctx.closePath(); ctx.fillStyle = d.color; ctx.fill();
    ctx.globalAlpha = 1;
    circle(-4, -r * 0.3, 2.5, '#c77dff'); circle(4, -r * 0.3, 2.5, '#c77dff');
  }
  if (f.flash > 0) circle(0, 0, r, 'rgba(255,255,255,0.7)');
  if (f.slow > 0) circle(0, 0, r + 3, null, 'rgba(58,176,255,0.8)', 2);
  if (f.poison > 0) circle(0, 0, r + 5, null, 'rgba(125,255,74,0.7)', 2);
  if (f.freeze > 0) circle(0, 0, r + 2, 'rgba(200,240,255,0.55)', '#e8f8ff', 2);
  drawStatus(f, r);
  ctx.restore();

  if (f.hp < f.maxHp) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(f.x - r, f.y - r - 12, r * 2, 4);
    ctx.fillStyle = '#e44'; ctx.fillRect(f.x - r, f.y - r - 12, r * 2 * Math.max(0, f.hp / f.maxHp), 4);
  }
}

function drawBoss(b) {
  if (b.dead) return;
  const d = b.def, r = b.r, t = elapsed;
  const aura = TYPE_COLOR[d.weak[0]];
  ctx.save();
  ctx.translate(b.x, b.y);

  // aura in the colour of what hurts it — a hint for the observant
  const pr = r + 14 + Math.sin(t * 3) * 5;
  const g = ctx.createRadialGradient(0, 0, r * 0.8, 0, 0, pr + 10);
  g.addColorStop(0, aura + '00'); g.addColorStop(0.7, aura + '55'); g.addColorStop(1, aura + '00');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, pr + 10, 0, TAU); ctx.fill();
  circle(4, r * 0.8, r * 0.9, 'rgba(0,0,0,0.3)');

  if (d.id === 'troll') {
    circle(0, 0, r, d.color, '#5a8bb0', 3);
    ctx.fillStyle = '#e8f6ff';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(i * 12 - 7, -r * 0.75); ctx.lineTo(i * 12, -r - 16 + Math.abs(i) * 5); ctx.lineTo(i * 12 + 7, -r * 0.75); ctx.fill();
    }

    circle(-8, -r * 0.4, 5, '#0b0');
    circle(8, -r * 0.4, 5, '#0b0');
    ctx.fillStyle = '#d8b24a';

    for (let i = 0; i <= 4; i++) ctx.lineTo(-r * 0.6 + i * r * 0.3, -r * (i % 2 ? 1.05 : 1.45));

// battle units, drawn in their team's colour
// ── looks: Wizard or Space ──
// In Adventure it's just how your hero looks. In Battle it's a side: your
// team takes your look and the enemy is the other one (in a duel, each
// player's side shows the look they picked).
let mySkin = 'wizard';
try { if (localStorage.getItem('pentagram-skin') === 'space') mySkin = 'space'; } catch (_) {}
// The story: parallel universes are converging, and only one survives where
// they meet. Your look is your universe.
const UNIVERSE = { wizard: 'Wizard', space: 'Space' };
function collisionLine() {
  return skinOf('red') === skinOf('blue') ? 'A mirror universe collides with yours!' : `The ${UNIVERSE[skinOf('red')]} universe collides with yours!`;
}
function setSkin(v) {
  mySkin = v === 'space' ? 'space' : 'wizard';
  try { localStorage.setItem('pentagram-skin', mySkin); } catch (_) {}
  SFX.buff();
}
function skinOf(team) {
  if (mode !== 'battle' || !teams || team === 'blue') return mySkin;
  if (versus) return teams.redSkin || 'wizard';
  return mySkin === 'space' ? 'wizard' : 'space';
}
function heroSkin(p) {
  if (mode !== 'battle') return mySkin;
  return skinOf(p.isRival || p === otherHero ? 'red' : 'blue');
}

// a spacefarer in a white suit; accent is the team colour, gun glows with the next spell
function drawAstronaut(x, y, s, accent, visor, face, gunColor) {
  const fx = face ? face.x : 1, fy = face ? face.y : 0, side = fx >= 0 ? 1 : -1;

  ctx.fillStyle = '#c9cfdb'; ctx.fillRect(-8, 8, 6, 7); ctx.fillRect(2, 8, 6, 7);
  ctx.fillStyle = '#5a6272'; ctx.fillRect(-9, 13, 8, 3); ctx.fillRect(1, 13, 8, 3);

  roundRect(-10, -6, 20, 17, 6); ctx.fillStyle = '#eef1f7'; ctx.fill();
  ctx.strokeStyle = '#9aa3b5'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = accent; ctx.fillRect(-10, 3, 20, 3);
  circle(-3, -1, 2, accent); circle(3, -1, 1.5, '#7dff9a');
  // blaster
  ctx.fillStyle = '#4a5060'; ctx.fillRect(side > 0 ? 8 : -20, -2, 12, 5);
  ctx.fillRect(side > 0 ? 12 : -14, 2, 3, 4);
  circle(side > 0 ? 21 : -21, 0.5, 3, gunColor);

  circle(0, -15, 11, '#f6f8fc', '#9aa3b5', 2);
  ctx.beginPath(); ctx.ellipse(fx * 3, -15 + fy * 1.5, 7.5, 5.5, 0, 0, TAU);
  const g = ctx.createLinearGradient(-7, -20, 7, -10);
  g.addColorStop(0, '#0d1630'); g.addColorStop(1, visor);
  ctx.fillStyle = g; ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.beginPath(); ctx.ellipse(fx * 3 - 3, -18 + fy * 1.5, 2.2, 1.2, -0.5, 0, TAU); ctx.fill();
  // antenna with a blinking light
  ctx.strokeStyle = '#9aa3b5'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-side * 6, -23); ctx.lineTo(-side * 8, -31); ctx.stroke();
  circle(-side * 8, -32, 2.2, Math.sin(elapsed * 5) > 0 ? accent : '#fff');
  ctx.restore();
}

// space versions of the battle units (drawn around 0,0; c = team colour, ec = element colour)

function drawUnit(u) {
  const c = TEAM_COLOR[u.team], t = elapsed, r = u.r;
  ctx.save();
  ctx.translate(u.x, u.y);
  if (!u.structure) {
    // a springy step while marching, a slow breath while standing
    const sq = Math.sin((u.walk || 0) * 0.5) * 0.06 + Math.sin(t * 2.4 + u.wob) * 0.02;
    ctx.scale(1 - sq * 0.7, 1 + sq);
  }
  const ec = TYPE_COLOR[u.elem] || c; // element colour
  if (u.kind !== 'sigil' && skinOf(u.team) === 'space') drawSpaceBody(u, c, ec, r, t);

    const hop = Math.abs(Math.sin(u.walk * 0.3)) * 3;
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(1, 11, 7, 2.5, 0, 0, TAU); ctx.fill();

  } else if (u.kind === 'wisp') {
    const fl = Math.sin(t * 3 + u.wob) * 3;
    const g = ctx.createRadialGradient(0, fl, 0, 0, fl, r * 2);
    g.addColorStop(0, '#fff'); g.addColorStop(0.35, ec); g.addColorStop(1, ec + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, fl, r * 2, 0, TAU); ctx.fill();
    circle(0, fl, r * 0.55, '#fff', c, 2);
    for (let i = 0; i < 3; i++) circle(Math.sin(t * 4 + i * 2) * 4, fl + r * 0.9 + i * 4, 2 - i * 0.5, ec);
  } else if (u.kind === 'archer') {
    const bob = Math.sin(u.walk * 0.25) * 1.5;
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(1, 10, 7, 2.5, 0, 0, TAU); ctx.fill();
    circle(0, bob, r * 0.8, '#2a2238', c, 2);
    circle(0, bob + 1, r * 0.3, ec);
    circle(0, -r * 0.7 + bob, r * 0.5, '#f1d2b0');
    ctx.strokeStyle = '#a07a40'; ctx.lineWidth = 2;
    const f = u.face || 1;
    ctx.beginPath(); ctx.arc(f * r * 0.9, bob, r * 0.8, -Math.PI / 2, Math.PI / 2, f < 0); ctx.stroke();
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(f * r * 0.9, -r * 0.8 + bob); ctx.lineTo(f * r * 0.9, r * 0.8 + bob); ctx.stroke();
  } else if (u.kind === 'brute') {
    const bob = Math.abs(Math.sin(u.walk * 0.18)) * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(1, 13, 10, 3, 0, 0, TAU); ctx.fill();
    roundRect(-r, -r - bob, r * 2, r * 1.9, 4); ctx.fillStyle = '#3a3040'; ctx.fill();
    ctx.strokeStyle = c; ctx.lineWidth = 2.5; ctx.stroke();

function drawCritter(a) {
  const c = TYPE_COLOR[a.elem], t = elapsed, r = a.r, x = a.x, y = a.y;
  circle(x + 2, y + r * 0.9, r * 0.8, 'rgba(0,0,0,0.25)');
  if (a.elem === 'fire') {          // Ember Pup: a little flame dog
    const hop = Math.abs(Math.sin(t * 12 + a.ang)) * 3;
    circle(x, y - hop, r, '#c84a1a', '#ffb04a', 2);
    ctx.fillStyle = '#ff8a3a';
    ctx.beginPath(); ctx.moveTo(x - r * 0.8, y - r * 0.5 - hop); ctx.lineTo(x - r * 0.4, y - r * 1.4 - hop); ctx.lineTo(x - r * 0.1, y - r * 0.6 - hop); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + r * 0.8, y - r * 0.5 - hop); ctx.lineTo(x + r * 0.4, y - r * 1.4 - hop); ctx.lineTo(x + r * 0.1, y - r * 0.6 - hop); ctx.fill();
    const fl = Math.sin(t * 16) * 3;
    ctx.beginPath(); ctx.moveTo(x - r, y - hop); ctx.quadraticCurveTo(x - r * 2, y - r - hop + fl, x - r * 1.6, y - r * 1.6 - hop); ctx.lineTo(x - r * 0.8, y - r * 0.3 - hop); ctx.fill();
    circle(x - 3, y - 2 - hop, 1.8, '#111'); circle(x + 3, y - 2 - hop, 1.8, '#111');
  } else if (a.elem === 'water') {   // Bubble Frog
    const sq = Math.sin(t * 5 + a.ang) * 0.08;
    ctx.beginPath(); ctx.ellipse(x, y, r * (1.1 + sq), r * (0.85 - sq), 0, 0, TAU); ctx.fillStyle = '#2f8fd8'; ctx.fill();
    circle(x - r * 0.45, y - r * 0.6, r * 0.35, '#bfe6ff'); circle(x + r * 0.45, y - r * 0.6, r * 0.35, '#bfe6ff');
    circle(x - r * 0.45, y - r * 0.6, r * 0.15, '#111'); circle(x + r * 0.45, y - r * 0.6, r * 0.15, '#111');
    circle(x + r * 1.1, y - r * 1.2 - (t * 20 % 12), 3, null, '#bfe6ff', 1);
  } else if (a.elem === 'earth') {   // Rock Turtle
    ctx.beginPath(); ctx.ellipse(x, y, r * 1.2, r * 0.9, 0, 0, TAU); ctx.fillStyle = '#6b5236'; ctx.fill();
    ctx.strokeStyle = '#3f3020'; ctx.lineWidth = 2; ctx.stroke();
    for (let i = 0; i < 3; i++) circle(x - r * 0.5 + i * r * 0.5, y - r * 0.15, r * 0.25, '#8a6a44');
    circle(x + r * 1.25, y, r * 0.35, '#8fa15a');
  } else if (a.elem === 'air') {     // Spark Sparrow
    const flap = Math.sin(t * 22 + a.ang) * 0.7;
    ctx.fillStyle = '#f5e663';
    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + sd * r * 1.8, y - r * (0.4 + flap)); ctx.lineTo(x + sd * r, y + r * 0.4); ctx.closePath(); ctx.fill(); }
    circle(x, y, r * 0.7, '#fff6b0', '#d8c000', 1.5);
    ctx.fillStyle = '#ff9a2a'; ctx.beginPath(); ctx.moveTo(x + r * 0.6, y); ctx.lineTo(x + r * 1.1, y + 2); ctx.lineTo(x + r * 0.6, y + 3); ctx.fill();
  } else {                           // Lantern Sprite
    const fl = Math.sin(t * 3 + a.ang) * 3;
    const g = ctx.createRadialGradient(x, y + fl, 0, x, y + fl, r * 2.2);
    g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#c77dff'); g.addColorStop(1, 'rgba(199,125,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y + fl, r * 2.2, 0, TAU); ctx.fill();
    roundRect(x - r * 0.5, y - r * 0.6 + fl, r, r * 1.2, 3); ctx.fillStyle = '#ffe9a8'; ctx.fill();
    ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 1.5; ctx.stroke();

// a woven helper wears its finish: a fuse, bubbles, armour, speed sparks or a halo

function drawAlly(a) {
  const fade = Math.min(1, a.life / 2);
  if (a.kind === 'critter') { ctx.globalAlpha = 0.4 + fade * 0.6; drawCritter(a); drawCritterFinish(a); ctx.globalAlpha = 1; return; }
  ctx.globalAlpha = 0.4 + fade * 0.6;

    const g = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, 20);
    g.addColorStop(0, 'rgba(230,200,255,0.9)'); g.addColorStop(1, 'rgba(199,125,255,0)');

  } else if (a.kind === 'imp') {

    ctx.fillStyle = '#ffb04a';
    ctx.beginPath(); ctx.moveTo(a.x - 8, a.y - 6); ctx.lineTo(a.x - 5, a.y - 16); ctx.lineTo(a.x - 2, a.y - 8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(a.x + 8, a.y - 6); ctx.lineTo(a.x + 5, a.y - 16); ctx.lineTo(a.x + 2, a.y - 8); ctx.fill();
    circle(a.x - 3, a.y - 1, 1.8, '#ff4'); circle(a.x + 3, a.y - 1, 1.8, '#ff4');
  } else if (a.kind === 'dragon') {
    const flap = Math.sin(elapsed * 8) * 0.5;
    circle(a.x + 6, a.y + 34, 22, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = '#8a1e14';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(a.x + s * 58, a.y - 30 - flap * 30);
      ctx.lineTo(a.x + s * 44, a.y + 6);
      ctx.lineTo(a.x + s * 24, a.y + 10);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = '#c0301c'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a.x, a.y + 10); ctx.quadraticCurveTo(a.x - 14, a.y + 34, a.x + 6, a.y + 44); ctx.stroke();
    circle(a.x, a.y, 16, '#c0301c', '#ffb04a', 2);
    circle(a.x, a.y - 18, 10, '#d8401e');
    circle(a.x - 4, a.y - 20, 2.2, '#ffd24a'); circle(a.x + 4, a.y - 20, 2.2, '#ffd24a');
  } else {

    ctx.strokeStyle = '#4a3e30'; ctx.lineWidth = 3; ctx.stroke();
    circle(a.x - 6, a.y - 5, 3, '#8ff'); circle(a.x + 6, a.y - 5, 3, '#8ff');
  }
  ctx.globalAlpha = 1;
}

function drawWizardFigure(x, y, fx, robe, hat, orb, staffLift = 0) {
  const w = windAt(), flap = Math.sin(elapsed * 6 + x * 0.05) * w;

  ctx.quadraticCurveTo(x + 4, y + 16 + flap * 2, x - 15 + flap, y + 14); ctx.closePath();

  ctx.globalAlpha = 0.5; circle(x - 5 + fx, y - 3.5, 1.8, '#f59a9a'); circle(x + 5 + fx, y - 3.5, 1.8, '#f59a9a'); ctx.globalAlpha = 1;

  ctx.beginPath(); ctx.moveTo(x - 13, y - 10); ctx.quadraticCurveTo(x + fx * 2, y - 24, x + fx * 4 + w * 5 + flap * 1.5, y - 32); ctx.lineTo(x + 13, y - 10); ctx.closePath();

  ctx.beginPath(); ctx.moveTo(x + 14, y + 14 - staffLift); ctx.lineTo(x + 16, y - 18 - staffLift); ctx.stroke();
