// split a wave between the three minion kinds by the mix (largest remainders)
function waveKinds(mix, n) {
  const raw = MINION_KINDS.map(k => mix[k] * n), out = raw.map(Math.floor);
  let left = n - out.reduce((a, b) => a + b, 0);
  const order = raw.map((v, i) => [v - Math.floor(v), i]).sort((a, b) => b[0] - a[0]);
  for (let k = 0; k < left; k++) out[order[k][1]]++;
  return MINION_KINDS.flatMap((k, i) => Array(out[i]).fill(k));
}
// red's mix: random on Easy; on Hard it leans toward whatever beats your favourite
function redMix() {
  const w = MINION_KINDS.map(() => 0.3 + Math.random());
  if (difficulty === 'hard') {
    const fav = MINION_KINDS.reduce((a, b) => teams.blue.mix[a] >= teams.blue.mix[b] ? a : b);
    const favElem = UNITS[fav].elem;
    const counter = MINION_KINDS.find(k => elemBeats(UNITS[k].elem) === favElem);
    w[MINION_KINDS.indexOf(counter)] += 1.6;
  }
  const t = w.reduce((a, b) => a + b, 0);
  return Object.fromEntries(MINION_KINDS.map((k, i) => [k, w[i] / t]));
}

function segDist(px, py, a, b) {
  const dx = b.x - a.x, dy = b.y - a.y, l2 = dx * dx + dy * dy || 1;
  const t = clamp(((px - a.x) * dx + (py - a.y) * dy) / l2, 0, 1);
  return Math.hypot(px - (a.x + dx * t), py - (a.y + dy * t));
}

function updateBattle(dt) {
  const T = teams;
  // match clock
  T.time -= dt;
  if (T.time <= 0) { T.time = 0; battleOver(null); return; }

  // space: recount the ground now and then; the bigger side scores every 15s
  T.terrRecalc -= dt;
  if (T.terrRecalc <= 0) { T.terrRecalc = 0.5; computeTerritory(); }

  // build turns alternate between the sides
  if (T.pending) {
    T.pending.t -= dt;
    if (T.pending.t <= 0) { T.pending = null; castMessage('Build turn passed', '#aaa'); }
  } else {
    T.build.t -= dt;
    if (T.build.t <= 0) {
      if (T.build.team === 'blue') {
        T.pending = { t: BUILD_EVERY - 1 };
        showBanner('Your build turn!', 'Turret: stand on open ground · or send a Titan', 3);
        SFX.discover();
      } else if (versus && rivalP && !rivalP.dead && net.role === 'host') {
        T.pendingRed = { t: BUILD_EVERY - 1 };
        netEvents.push(['banner', 'Your build turn!', 'Turret: stand on open ground · or send a Titan', 3]);
      } else redBuild();
      T.build.team = otherTeam(T.build.team);
      T.build.t = BUILD_EVERY;
    }
  }
  if (T.pending) T.build.t = Math.max(T.build.t, T.pending.t + 1); // red waits for you to finish
  if (T.pendingRed) {
    T.pendingRed.t -= dt;
    if (T.pendingRed.t <= 0) { T.pendingRed = null; netEvents.push(['msg', 'Build turn passed', '#aaa']); }
    T.build.t = Math.max(T.build.t, (T.pendingRed ? T.pendingRed.t : 0) + 1);
  }

  for (const team of ['blue', 'red']) {
    const S = T[team], sd = teamSide(team);
    S.wave -= dt;
    if (S.wave <= 0) {
      S.wave = 14;
      if (team === 'red' && !versus) S.mix = redMix();
      for (const kind of waveKinds(S.mix, S.minions)) {
        const u = addUnit(team, kind, sd * (BASE_X - 90) + rnd(-20, 20), rnd(-120, 120));
        u.laneY = rnd(-1, 1) * ARENA_H * 0.55;
      }
    }
    S.wizQ = S.wizQ.filter(q => {
      q.t -= dt;
      if (q.t > 0) return true;
      addUnit(team, 'wizard', sd * (BASE_X - 130), rnd(-90, 90), ELEM_CYCLE[Math.floor(Math.random() * 5)]);
      return false;
    });
    if (!teamList(team).some(u => u.kind === 'sigil' && !u.dead)) {
      S.sigilT -= dt;
      if (S.sigilT <= 0) placeSigil(team);
    }
  }

  // laser walls hurt enemies that cross them
  for (const l of links) {
    if (l.a.dead || l.b.dead) continue;
    const opp = l.team === 'blue' ? foes : friends.concat(state === 'play' ? [player] : []);
    for (const o of opp) {
      if (o.dead || o.structure) continue;
      if (segDist(o.x, o.y, l.a, l.b) > (o.r || PLAYER_R) + 4) continue;
      o.laserT = (o.laserT || 0) + dt;
      if (o.laserT >= 0.5) { o.laserT = 0; hitUnit(o, 1); burst(o.x, o.y, TEAM_COLOR[l.team], 4, 100); }
    }
  }

  for (const u of friends) {
    if (u.dead) continue;
    updateUnit(u, dt);
    if (!u.structure) {
      clampArena(u, u.r);
      if (!u.def.flying) pushOut(u, u.r);
    }
  }
  separate(friends);
  friends = friends.filter(u => !u.dead);

  for (const sh of bshots) {
    const sdt = sh.team === 'red' ? dt * timeScale() : dt;
    sh.x += sh.vx * sdt; sh.y += sh.vy * sdt; sh.life -= sdt;
    sh.spin += sdt * 9;
    if (sh.elem && !sh.arrow && Math.random() < 0.6) shotTrail(sh);
    if (sh.team === 'red' && solidTemps().some(b => Math.hypot(b.x - sh.x, b.y - sh.y) < b.r + sh.r)) { sh.life = 0; continue; }
    const opp = sh.team === 'red'
      ? (state === 'play' && !player.onBoat ? [player] : []).concat(friends, allies.filter(a => a.kind === 'critter'))
      : foes.concat(rivalHelpers());
    for (const o of opp) {
      if (o.dead || Math.hypot(o.x - sh.x, o.y - sh.y) > sh.r + (o.r || PLAYER_R)) continue;
      if (o === player && player.mirror > 0) {
        const sp = Math.hypot(sh.vx, sh.vy) || 1;
        launch(sh.x, sh.y, { x: -sh.vx / sp, y: -sh.vy / sp }, { dmg: sh.dmg * 2, type: 'mirror', speed: sp * 1.4, r: sh.r });
        SFX.block();
      } else {
        hitUnit(o, sh.dmg * matchup(sh.src, o));
        if (sh.boom) {
          for (const o2 of opp) if (o2 !== o && !o2.dead && Math.hypot(o2.x - sh.x, o2.y - sh.y) < sh.boom) hitUnit(o2, sh.dmg * 0.5);
          burst(sh.x, sh.y, sh.color, 16, 220);
        }
      }
      if (sh.elem) elemHit(sh.elem, sh.x, sh.y, sh.r >= 9 ? 1.3 : 0.8); else burst(sh.x, sh.y, sh.color, 5, 120);
      sh.life = 0;
      break;
    }
  }
  bshots = bshots.filter(sh => sh.life > 0);
}

// your build turn: the two choices

// keep a crowd of units from stacking on one spot
function separate(list) {
  const live = list.filter(u => !u.dead && !u.structure);
  for (let i = 0; i < live.length; i++) {
    for (let j = i + 1; j < live.length; j++) {
      const a = live[i], b = live[j];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
      if (d > 0 && d < min) {
        const push = (min - d) / 2;

        b.x += dx / d * push; b.y += dy / d * push;
      }
    }
  }
}

// The host's device runs the battle. The friend (guest) plays red, but their

  const t = a.asTarget; t.x = a.x; t.y = a.y; t.hp = a.hp; t.maxHp = a.maxHp; t.dead = a.life <= 0;

function makeRival() {

  resetPlayer();
  rivalP = player;
  player = keep;
  rivalP.isRival = true;
  rivalP.robe = '#7a2d2d'; rivalP.hat = '#c03a3a';

function startVersusHost(send) {

// your friend fell: back at their fountain in 5 seconds
function rivalDown() {
  rivalP.hp = 0; rivalP.dead = true; rivalP.respawnT = 5;
  rivalProxy.dead = true;
  rivalP.charging = null; rivalP.loaded = null;
  burst(rivalP.x, rivalP.y, TEAM_COLOR.red, 30, 260);
  teamScore('blue', 10, rivalP.x, rivalP.y - 30);
  showBanner('You defeated your friend’s wizard! +10', '', 2.5);
  netEvents.push(['you-fell']);
}

function updateRival(dt) {
  if (rivalP.dead) {
    rivalP.respawnT -= dt;
    if (rivalP.respawnT <= 0) {
      const tp = rivalP.tp + 1;
      withSide('red', () => { resetPlayer(); });
      Object.assign(rivalP, { isRival: true, robe: '#7a2d2d', hat: '#c03a3a', dead: false, invuln: 2, tp });
      const fp = fountainPos('red'); rivalP.x = fp.x; rivalP.y = fp.y; rivalP.face = { x: -1, y: 0 };
      rivalProxy.dead = false;
    }
  }
  rivalProxy.x = rivalP.x; rivalProxy.y = rivalP.y; rivalProxy.dead = !!rivalP.dead;
  withSide('red', () => {
    if (!player.dead) heroTimers(dt);
    updateShots(dt);
    updateAllies(dt);
    updateStorms(dt);
    updateEffects(dt);

  // ship the battle to your friend
  net.sendT -= dt;
  if (net.sendT <= 0) { net.sendT = 0.1; net.send(makeSnapshot()); netEvents = []; }
}

// your friend's actions arrive here (positions are in the host's coordinates)
function hostReceive(m) {
  if (!versus || !rivalP) return;
  const R = fn => withSide('red', fn);
  switch (m.t) {
    case 'pos':
      if (!rivalP.dead && !rivalP.charging && m.tp === rivalP.tp) { rivalP.x = m.x; rivalP.y = m.y; rivalP.face = { x: m.fx, y: m.fy }; }
      break;
    case 'cast': if (!rivalP.dead && /^[SWFEA]{1,7}$/.test(m.k)) R(() => { seq = m.k.split(''); castSequence(); }); break;
    case 'fire': if (!rivalP.dead) R(fireLoaded); break;
    case 'arrow': if (!rivalP.dead) R(() => shootArrow(m.x, m.y)); break;
    case 'build':
      if (teams.pendingRed && !rivalP.dead) {
        teams.buildElemRed = ELEM_CYCLE.includes(m.elem) ? m.elem : 'fire';
        if (m.key === 'turret') {
          if (canBuildAt(rivalP.x, rivalP.y)) { buildTurret('red', rivalP.x, rivalP.y, teams.buildElemRed); teams.pendingRed = null; }
          else netEvents.push(['msg', 'Stand on open ground to build a turret', '#ccc']);
        } else { buildTitan('red', teams.buildElemRed); teams.pendingRed = null; }
      }
      break;
    case 'mix': if (m.mix) teams.red.mix = Object.fromEntries(MINION_KINDS.map(k => [k, Math.max(0, +m.mix[k] || 0)])); break;
    case 'order': teams.redOrder = m.v === 'follow' ? 'follow' : 'spread'; break;

    case 'bye': friendLeft(); break;

function friendLeft() {
  if (!versus) return;

  if (net.role === 'host') {

    if (rivalP) { rivalP.dead = true; rivalP.respawnT = 1e9; }

// ── the friend's side: a mirrored copy of the battle ──

function screenAngle() {

function onOrient(e) {

  // wasn't accepted as a tap, or was dismissed, try again on the next one.
  if (typeof D.requestPermission === 'function') {

    tilt.pending = true;

      .then(r => { tilt.pending = false; if (r === 'granted') listen(); else tilt.denied = true; })

function tapOverlay(x, y) {
  if (state === 'title') {
    const b = x === undefined ? titleButtons[0] : titleButtons.find(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h);
    if (b) b.go();
    return true;
  }
  if (state === 'dead')  { if (overlayT > (mode === 'battle' ? 5 : 0.8)) respawn(); return true; }
  if (state === 'won')   { if (overlayT > 1.0) { leaveDuel(); state = mode === 'battle' ? 'title' : 'play'; } return true; }
  if (state === 'lost')  { if (overlayT > 1.0) { leaveDuel(); state = 'title'; } return true; }
  if (state === 'reveal') { if (reveal.t > 1.2) closeReveal(); return true; }
  return false;
}

function localPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioInit();
  const { x, y } = localPos(e);
  if (tapOverlay(x, y)) return;
  if (ordersOpen && ordersHit(x, y)) return; // the open orders panel comes first
  if (soundHit(x, y)) { toggleSound(); return; }
  if (tiltLabelHit(x, y)) {
    if (tilt.raw) { levelTilt(); castMessage('Tilt levelled', '#ccc'); }
    else { tilt.asked = false; tilt.warned = false; tilt.denied = false; tilt.granted = false; } // try again on this tap's release
    return;
  }
  if (ordersHit(x, y)) return;
  if (orderHit(x, y)) { toggleOrder(); return; }
  if (mixToggleHit(x, y)) { mixOpen = !mixOpen; return; }
  if (mixHit(x, y)) { mixPtr = e.pointerId; setMixAt(x, y); try { canvas.setPointerCapture(e.pointerId); } catch (_) {} return; }
  const bb = buildButtonHit(x, y);
  if (bb) { if (bb.key === 'elem') teams.buildElem = bb.elem; else buildChoice(bb.key); return; }
  if (fireButtonHit(x, y)) { holdTilt(); fireLoaded(); tilt.pauseUntil = performance.now() + 400; return; }
  if (castPtr === null && inCastZone(x, y)) {
    holdTilt();
    castPtr = e.pointerId;
    seq = [];
    curNode = null;
    castMove(x, y);
  } else if (movePtr === null) {
    movePtr = e.pointerId;
    movePos = { x, y };
    moveStart = { x, y, t: performance.now(), moved: false, shooting: tiltActive() };
    if (moveStart.shooting && state === 'play') shootArrow(player.x + x - W / 2, player.y + y - playerScreenY());
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});

let mixPtr = null;
canvas.addEventListener('pointermove', e => {
  if (e.pointerId === mixPtr) { const p = localPos(e); setMixAt(p.x, p.y); return; }
  if (e.pointerId === castPtr) { const p = localPos(e); castMove(p.x, p.y); }
  else if (e.pointerId === movePtr) {
    movePos = localPos(e);
    if (moveStart && Math.hypot(movePos.x - moveStart.x, movePos.y - moveStart.y) > 20) moveStart.moved = true;
  }
});

function endPointer(e, cancelled) {
  if (e.pointerId === mixPtr) mixPtr = null;
  if (e.pointerId === castPtr) {
    if (state === 'play' && !cancelled) castSequence();
    seq = []; castPtr = null; finger = null; curNode = null;
    tilt.pauseUntil = performance.now() + 400;
  }
  if (e.pointerId === movePtr) {
    // a quick tap on the field shoots an arrow at that spot
    if (!cancelled && state === 'play' && moveStart && !moveStart.shooting && !moveStart.moved && performance.now() - moveStart.t < 350) {
      shootArrow(player.x + moveStart.x - W / 2, player.y + moveStart.y - playerScreenY());
    }
    movePtr = null; movePos = null; moveStart = null;
  }
}

canvas.addEventListener('pointerup', e => {
  // a finished tap is what iOS accepts for the motion-sensor prompt
  askTiltFromTap();
  endPointer(e, false);
});
canvas.addEventListener('pointercancel', e => endPointer(e, true));
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  if (e.target && e.target.closest && e.target.closest('#lobby')) return; // typing a room code
  audioInit();
  if (e.code === 'KeyM') toggleSound();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Backspace'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  const confirm = e.code === 'Space' || e.code === 'Enter';
  if (state === 'title') {
    const pick = { Digit1: 0, Digit2: 1, Digit3: 2 }[e.code];
    if (pick !== undefined && titleButtons[pick]) titleButtons[pick].go();
    else if (confirm) tapOverlay();
    return;
  }
  if (state !== 'play') { if (confirm) tapOverlay(); return; }
  const el = KEY_TO_EL[e.code];
  if (el && castPtr === null && seq.length < MAX_SEQ) {
    seq.push(el);
    nodePulse[NODE_ORDER.indexOf(el)] = 1;
  }
  if (confirm && castPtr === null) { if (seq.length) castSequence(); else fireLoaded(); }
  if (e.code === 'KeyF') fireLoaded();
  if (e.code === 'KeyB') buildChoice('turret');
  if (e.code === 'KeyG' && mode === 'battle' && teams) toggleOrder();
  if (e.code === 'KeyT') buildChoice('titan');
  if ((e.code === 'Backspace' || e.code === 'Escape') && castPtr === null) seq = [];
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ── drawing helpers ──────────────────────────────────────────────────────────
function circle(x, y, r, fill, stroke, lw) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  if (fill)   { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Alchemical element symbols
function drawGlyph(el, x, y, s, color) {
  const h = s * 0.42;
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1.5, s * 0.09);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  if (el === 'F' || el === 'A') {
    ctx.moveTo(0, -h); ctx.lineTo(h * 0.95, h * 0.72); ctx.lineTo(-h * 0.95, h * 0.72); ctx.closePath();
    if (el === 'A') { ctx.moveTo(-h * 0.85, h * 0.1); ctx.lineTo(h * 0.85, h * 0.1); }
  } else if (el === 'W' || el === 'E') {
    ctx.moveTo(0, h); ctx.lineTo(h * 0.95, -h * 0.72); ctx.lineTo(-h * 0.95, -h * 0.72); ctx.closePath();
    if (el === 'E') { ctx.moveTo(-h * 0.85, -h * 0.1); ctx.lineTo(h * 0.85, -h * 0.1); }
  } else {
    ctx.arc(0, 0, h * 0.85, 0, TAU);
    ctx.moveTo(h * 0.3, 0);
    ctx.arc(0, 0, h * 0.3, 0, TAU);
  }
  ctx.stroke();
  ctx.restore();
}

function wrapText(text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, y);
      line = w;
      y += lineH;
    } else {
      line = test;
    }
  }
  if (line) { ctx.fillText(line, x, y); y += lineH; }
  return y;
}

// ── world rendering ──────────────────────────────────────────────────────────
function drawArena(camX, camY) {
  ovalPath(18); ctx.fillStyle = '#0d150f'; ctx.fill();          // a dark rim
  ovalPath(0); ctx.fillStyle = '#152018'; ctx.fill();
  ctx.save();
  ovalPath(0); ctx.clip();                                       // everything below stays inside the oval
  // each side's land carries its colour
  for (const team of ['blue', 'red']) {
    const x = teamSide(team) * BASE_X, g = ctx.createRadialGradient(x, 0, 0, x, 0, 700);
    g.addColorStop(0, TEAM_COLOR[team] + '33'); g.addColorStop(1, TEAM_COLOR[team] + '00');
    ctx.fillStyle = g; ctx.fillRect(x - 700, -ARENA_H, 1400, ARENA_H * 2);
  }
  // the trodden road between the towers
  ctx.fillStyle = 'rgba(120,100,70,0.22)';
  ctx.fillRect(-BASE_X, -60, BASE_X * 2, 120);
  ctx.strokeStyle = 'rgba(255,255,255,0.08)'; ctx.setLineDash([18, 18]); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(0, -ARENA_H); ctx.lineTo(0, ARENA_H); ctx.stroke(); ctx.setLineDash([]);
  // claimed ground (only the cells on screen)
  const i0 = Math.max(0, Math.floor((camX + WORLD) / CELL)), i1 = Math.min(COLS - 1, Math.floor((camX + W + WORLD) / CELL));
  const j0 = Math.max(0, Math.floor((camY + ARENA_H) / CELL)), j1 = Math.min(ROWS - 1, Math.floor((camY + H + ARENA_H) / CELL));
  for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++) {
    const v = terr[j * COLS + i];
    if (!v) continue;
    ctx.fillStyle = v === 1 ? 'rgba(74,168,255,0.11)' : 'rgba(255,74,90,0.11)';
    ctx.fillRect(-WORLD + i * CELL, -ARENA_H + j * CELL, CELL, CELL);
  }
  ctx.restore();
  ctx.strokeStyle = 'rgba(199,125,255,0.4)'; ctx.lineWidth = 3;
  ovalPath(0); ctx.stroke();
}

function drawLasers() {
  for (const l of links) {
    if (l.a.dead || l.b.dead) continue;
    const c = TEAM_COLOR[l.team], flick = 0.55 + Math.sin(elapsed * 20 + l.a.x) * 0.15;
    ctx.strokeStyle = c; ctx.globalAlpha = flick * 0.35; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.b.x, l.b.y); ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.globalAlpha = flick; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(l.a.x, l.a.y); ctx.lineTo(l.b.x, l.b.y); ctx.stroke();
    ctx.globalAlpha = 1;
  }
}

function drawGround(camX, camY) {
  ctx.fillStyle = '#060509';
  ctx.fillRect(camX, camY, W, H);
  if (mode === 'battle') { drawArena(camX, camY); return; }
  ctx.fillStyle = '#152018';
  ctx.fillRect(-WORLD, -WORLD, WORLD * 2, WORLD * 2);

  // each guardian's land is tinted with its own colour
  for (const b of BOSSES) {
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 480);
    g.addColorStop(0, b.color + '30');
    g.addColorStop(1, b.color + '00');
    ctx.fillStyle = g;
    ctx.fillRect(b.x - 480, b.y - 480, 960, 960);
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  const step = 80;
  const x0 = Math.floor(camX / step) * step, y0 = Math.floor(camY / step) * step;
  ctx.beginPath();
  for (let x = x0; x < camX + W + step; x += step) { ctx.moveTo(x, camY); ctx.lineTo(x, camY + H); }
  for (let y = y0; y < camY + H + step; y += step) { ctx.moveTo(camX, y); ctx.lineTo(camX + W, y); }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(199,125,255,0.35)';
  ctx.lineWidth = 3;
  ctx.strokeRect(-WORLD, -WORLD, WORLD * 2, WORLD * 2);
}

function inView(x, y, pad, camX, camY) {
  return x > camX - pad && x < camX + W + pad && y > camY - pad && y < camY + H + pad;
}

function lakePath(grow) {
  ctx.beginPath();
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU, k = lakeRadiusScale(a);
    const x = LAKE.x + Math.cos(a) * (LAKE.rx * k + grow), y = LAKE.y + Math.sin(a) * (LAKE.ry * k + grow);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

function drawLake(camX, camY) {
  if (!inView(LAKE.x, LAKE.y, Math.max(LAKE.rx, LAKE.ry) + 80, camX, camY)) return;
  lakePath(14); ctx.fillStyle = '#6b6044'; ctx.fill();          // muddy bank
  lakePath(0);  ctx.fillStyle = '#123a5c'; ctx.fill();
  lakePath(-40); ctx.fillStyle = '#0f3150'; ctx.fill();
  // drifting ripples
  ctx.strokeStyle = 'rgba(160,210,255,0.18)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 40; i++) {
    const a = i * 2.39, d = 0.15 + (i * 0.618 % 0.8);
    const x = LAKE.x + Math.cos(a) * LAKE.rx * d + Math.sin(elapsed * 0.6 + i) * 10;
    const y = LAKE.y + Math.sin(a) * LAKE.ry * d;
    if (!isWater(x, y)) continue;
    ctx.beginPath(); ctx.moveTo(x - 10, y); ctx.quadraticCurveTo(x, y - 4, x + 10, y); ctx.stroke();
  }
  for (const i of ISLANDS) {
    circle(i.x, i.y, i.r + 8, 'rgba(230,210,150,0.35)');
    circle(i.x, i.y, i.r, '#c9b27a');
    circle(i.x + 6, i.y + 6, i.r * 0.7, '#8fa15a');
  }
  // dock
  const dx = DOCK.x - LAKE.x, dy = DOCK.y - LAKE.y, d = Math.hypot(dx, dy);
  ctx.save();
  ctx.translate(DOCK.x, DOCK.y);
  ctx.rotate(Math.atan2(dy / d, dx / d));
  ctx.fillStyle = '#7a5532';
  ctx.fillRect(-60, -14, 90, 28);
  ctx.strokeStyle = '#4e3520'; ctx.lineWidth = 2;
  for (let k = -55; k < 30; k += 12) { ctx.beginPath(); ctx.moveTo(k, -14); ctx.lineTo(k, 14); ctx.stroke(); }
  ctx.restore();
}

function drawBoat() {
  if (player.onBoat) return; // drawn under the player instead
  drawBoatAt(boat.x, boat.y, Math.atan2(LAKE.y - boat.y, LAKE.x - boat.x));
}
function drawBoatAt(x, y, ang) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(3, 5, 34, 15, 0, 0, TAU); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(36, 0); ctx.quadraticCurveTo(20, -16, -28, -13); ctx.lineTo(-30, 13); ctx.quadraticCurveTo(20, 16, 36, 0);
  ctx.fillStyle = '#8a5a2e'; ctx.fill();
  ctx.strokeStyle = '#4e3218'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#6b431f'; ctx.fillRect(-22, -9, 44, 18);
  ctx.restore();
}

function drawCastles(camX, camY) {
  for (const c of CASTLES) {
    if (!inView(c.x, c.y, c.h + 60, camX, camY)) continue;
    // flagstone courtyard
    ctx.fillStyle = 'rgba(120,115,110,0.22)';
    ctx.fillRect(c.x - c.h, c.y - c.h, c.h * 2, c.h * 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = -c.h; k <= c.h; k += 40) { ctx.moveTo(c.x + k, c.y - c.h); ctx.lineTo(c.x + k, c.y + c.h); ctx.moveTo(c.x - c.h, c.y + k); ctx.lineTo(c.x + c.h, c.y + k); }
    ctx.stroke();
    ctx.fillStyle = '#ddd';
    ctx.font = 'bold 12px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText(c.name, c.x, c.y - c.h - 14);
  }
  for (const w of walls) {
    if (!inView(w.x + w.w / 2, w.y + w.h / 2, Math.max(w.w, w.h), camX, camY)) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(w.x + 4, w.y + 5, w.w, w.h);
    ctx.fillStyle = '#6d6a66';
    ctx.fillRect(w.x, w.y, w.w, w.h);
    // crenellations
    ctx.fillStyle = '#86827c';
    const horiz = w.w > w.h, len = horiz ? w.w : w.h;
    for (let k = 4; k < len - 6; k += 16) {
      if (horiz) ctx.fillRect(w.x + k, w.y + 2, 8, w.h - 4);
      else ctx.fillRect(w.x + 2, w.y + k, w.w - 4, 8);
    }
  }
}

function drawSolids(camX, camY) {
  for (const d of activeSolids) {
    if (!inView(d.x, d.y, 60, camX, camY)) continue;
    if (d.kind === 'tree') {
      circle(d.x + 4, d.y + 6, 22 * d.s, 'rgba(0,0,0,0.3)');
      circle(d.x, d.y, 22 * d.s, d.v < 0.5 ? '#1f3a24' : '#24422a');
      circle(d.x - 6 * d.s, d.y - 6 * d.s, 12 * d.s, '#2f5535');
    } else if (d.kind === 'rock') {
      circle(d.x, d.y, d.r * 1.15, '#3a3d44');
      circle(d.x - d.r * 0.3, d.y - d.r * 0.3, d.r * 0.5, '#4b4f58');
    } else if (d.kind === 'palm') {
      ctx.strokeStyle = '#7a5a30'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(d.x, d.y + 10); ctx.lineTo(d.x + 3, d.y - 10); ctx.stroke();
      ctx.fillStyle = '#3f8a3a';
      for (let i = 0; i < 5; i++) {
        const a = i * TAU / 5 + 0.3;
        ctx.beginPath(); ctx.ellipse(d.x + 3 + Math.cos(a) * 12, d.y - 10 + Math.sin(a) * 12, 13, 5, a, 0, TAU); ctx.fill();
      }
    } else if (d.kind === 'tower') {
      circle(d.x + 4, d.y + 6, d.r, 'rgba(0,0,0,0.3)');
      circle(d.x, d.y, d.r, '#6d6a66', '#4a4744', 3);
      circle(d.x, d.y, d.r * 0.6, '#86827c');
    }
  }
}

function drawGrass(camX, camY) {
  ctx.strokeStyle = '#2c4a2f';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (const d of deco) {
    if (!inView(d.x, d.y, 20, camX, camY)) continue;
    for (let i = -1; i <= 1; i++) { ctx.moveTo(d.x + i * 4, d.y + 5); ctx.lineTo(d.x + i * 6, d.y - 6 * d.s); }
  }
  ctx.stroke();
}

function drawScrolls() {
  for (const sc of scrolls) {
    if (sc.taken) continue;
    const y = sc.y - 6 + Math.sin(elapsed * 3 + sc.x) * 3;
    const g = ctx.createRadialGradient(sc.x, y, 0, sc.x, y, 40);
    g.addColorStop(0, 'rgba(255,230,150,0.45)'); g.addColorStop(1, 'rgba(255,230,150,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sc.x, y, 40, 0, TAU); ctx.fill();
    ctx.fillStyle = '#efe0b8';
    ctx.fillRect(sc.x - 12, y - 8, 24, 16);
    circle(sc.x - 12, y, 8, '#d8c48f');
    circle(sc.x + 12, y, 8, '#d8c48f');
    ctx.fillStyle = '#a33'; ctx.fillRect(sc.x - 2, y - 8, 4, 16);
  }
}

function drawShrine() {
  const fp = fountainPos();
  ctx.save();
  ctx.translate(fp.x, fp.y);
  drawShrineAt();
  ctx.restore();
}
function drawShrineAt() {
  const pulse = 0.5 + Math.sin(elapsed * 2) * 0.2;
  circle(0, 0, SHRINE_R, `rgba(199,125,255,${0.08 + pulse * 0.08})`, `rgba(199,125,255,${pulse})`, 2);
  ctx.strokeStyle = `rgba(199,125,255,${pulse * 0.8})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= 5; i++) {
    const a = -Math.PI / 2 + ((i * 2) % 5) * TAU / 5;
    const x = Math.cos(a) * SHRINE_R * 0.9, y = Math.sin(a) * SHRINE_R * 0.9;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
}

function drawChest(c) {
  const { x, y } = c;
  const ready = c.boss.dead && !c.opened;
  if (ready) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, 70);
    g.addColorStop(0, `rgba(255,220,90,${0.35 + Math.sin(elapsed * 4) * 0.15})`);
    g.addColorStop(1, 'rgba(255,220,90,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 70, y - 70, 140, 140);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(x - 19, y - 6, 42, 26);
  ctx.fillStyle = c.opened ? '#4a3420' : '#7a5230';
  ctx.fillRect(x - 22, y - 10, 44, 26);
  ctx.fillStyle = c.opened ? '#2a1c10' : '#8e6238';
  if (c.opened) ctx.fillRect(x - 22, y - 24, 44, 10);
  else ctx.fillRect(x - 22, y - 18, 44, 10);
  ctx.strokeStyle = '#d8b24a';
  ctx.lineWidth = 2;
  ctx.strokeRect(x - 22, y - 10, 44, 26);
  if (!c.boss.dead) {
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - 24, y - 16); ctx.lineTo(x + 24, y + 18);
    ctx.moveTo(x + 24, y - 16); ctx.lineTo(x - 24, y + 18);
    ctx.stroke();
    ctx.fillStyle = '#aaa';
    ctx.fillRect(x - 6, y - 2, 12, 10);
  } else if (!c.opened) {
    ctx.fillStyle = '#ffd24a';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('open me', x, y - 30);
  }
}

// status markers drawn over any enemy (already translated to its centre)
function drawStatus(f, r) {
  const t = elapsed;
  if (f.stone > 0) circle(0, 0, r + 1, 'rgba(140,140,140,0.85)', '#666', 2);
  if (f.burn > 0) for (let i = 0; i < 3; i++) circle(Math.sin(t * 9 + i * 2) * r * 0.6, -r * 0.4 - ((t * 40 + i * 9) % 14), 2.5, '#ffb04a');
  if (f.root > 0) { ctx.strokeStyle = '#6b4a22'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(0, r * 0.7, r + 4, 5, 0, 0, TAU); ctx.stroke(); }
  if (f.stun > 0) for (let i = 0; i < 3; i++) {
    const a = t * 6 + i * TAU / 3;
    circle(Math.cos(a) * r * 0.8, -r - 6 + Math.sin(a) * 3, 2.5, '#ffe14a');
  }
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px system-ui, sans-serif';
  if (f.fear > 0) { ctx.fillStyle = '#c9a0ff'; ctx.fillText('!', 0, -r - 6); }
  if (f.confuse > 0) { ctx.fillStyle = '#ff8ad8'; ctx.fillText('?', Math.sin(t * 5) * 6, -r - 6); }
}

function drawFoe(f) {
  const d = f.def, r = f.r, t = elapsed;
  ctx.save();
  ctx.translate(f.x, f.y);
  circle(3, r * 0.7, r * 0.8, 'rgba(0,0,0,0.25)');
  if (f.hex > 0) {
    ctx.beginPath(); ctx.ellipse(0, 2, 11, 8, 0, 0, TAU); ctx.fillStyle = '#4caf50'; ctx.fill();
    circle(-5, -5, 4, '#4caf50'); circle(5, -5, 4, '#4caf50');
    circle(-5, -5, 1.8, '#111'); circle(5, -5, 1.8, '#111');
  } else if (f.kind === 'slime') {
    const sq = Math.sin(t * 6 + f.wob) * 0.1;
    ctx.save(); ctx.scale(1 + sq, 1 - sq);
    ctx.beginPath(); ctx.ellipse(0, 2, r * 1.1, r * 0.9, 0, 0, TAU); ctx.fillStyle = d.color; ctx.fill();
    circle(-r * 0.35, -r * 0.25, r * 0.25, 'rgba(255,255,255,0.35)');
    ctx.restore();
    circle(-4, -1, 2.5, '#111'); circle(4, -1, 2.5, '#111');
  } else if (f.kind === 'bat') {
    const flap = Math.sin(t * 18 + f.wob) * 0.6;
    ctx.fillStyle = '#5a3a70';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(s * r * 2, -r * (0.6 + flap));
      ctx.lineTo(s * r * 1.4, r * 0.4);
      ctx.closePath(); ctx.fill();
    }
    circle(0, 0, r * 0.75, d.color);
    circle(-3, -2, 2, '#ff4'); circle(3, -2, 2, '#ff4');
  } else if (f.kind === 'skeleton') {
    ctx.strokeStyle = '#bbb'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, r * 1.1);
    ctx.moveTo(-r * 0.7, r * 0.5); ctx.lineTo(r * 0.7, r * 0.5); ctx.stroke();
    circle(0, -r * 0.2, r * 0.8, d.color);
    circle(-4, -r * 0.3, 3, '#111'); circle(4, -r * 0.3, 3, '#111');
    ctx.fillStyle = '#111'; ctx.fillRect(-4, r * 0.15, 8, 2);
  } else if (f.kind === 'ember') {
    const fl = 1 + Math.sin(t * 14 + f.wob) * 0.12;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2 * fl);
    g.addColorStop(0, 'rgba(255,140,40,0.5)'); g.addColorStop(1, 'rgba(255,80,20,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 2 * fl, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -r * 1.4 * fl); ctx.quadraticCurveTo(r, 0, 0, r); ctx.quadraticCurveTo(-r, 0, 0, -r * 1.4 * fl);
    ctx.fillStyle = d.color; ctx.fill();
    circle(0, r * 0.1, r * 0.45, '#ffd24a');
  } else if (f.kind === 'shade') {
    ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.moveTo(-r, r);
    ctx.quadraticCurveTo(-r * 1.1, -r * 1.3, 0, -r * 1.2);
    ctx.quadraticCurveTo(r * 1.1, -r * 1.3, r, r);
    for (let i = 0; i < 4; i++) ctx.lineTo(r - (i + 0.5) * r / 2, r - (i % 2 ? 0 : 6) + Math.sin(t * 6 + i) * 2);
    ctx.closePath(); ctx.fillStyle = d.color; ctx.fill();
    ctx.globalAlpha = 1;
    circle(-4, -r * 0.3, 2.5, '#c77dff'); circle(4, -r * 0.3, 2.5, '#c77dff');
  }
  if (f.flash > 0) circle(0, 0, r, 'rgba(255,255,255,0.7)');
  if (f.slow > 0) circle(0, 0, r + 3, null, 'rgba(58,176,255,0.8)', 2);
  if (f.poison > 0) circle(0, 0, r + 5, null, 'rgba(125,255,74,0.7)', 2);
  if (f.freeze > 0) circle(0, 0, r + 2, 'rgba(200,240,255,0.55)', '#e8f8ff', 2);
  drawStatus(f, r);
  ctx.restore();

  if (f.hp < f.maxHp) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(f.x - r, f.y - r - 12, r * 2, 4);
    ctx.fillStyle = '#e44'; ctx.fillRect(f.x - r, f.y - r - 12, r * 2 * Math.max(0, f.hp / f.maxHp), 4);
  }
}

function drawBoss(b) {
  if (b.dead) return;
  const d = b.def, r = b.r, t = elapsed;
  const aura = TYPE_COLOR[d.weak[0]];
  ctx.save();
  ctx.translate(b.x, b.y);

  // aura in the colour of what hurts it — a hint for the observant
  const pr = r + 14 + Math.sin(t * 3) * 5;
  const g = ctx.createRadialGradient(0, 0, r * 0.8, 0, 0, pr + 10);
  g.addColorStop(0, aura + '00'); g.addColorStop(0.7, aura + '55'); g.addColorStop(1, aura + '00');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, pr + 10, 0, TAU); ctx.fill();
  circle(4, r * 0.8, r * 0.9, 'rgba(0,0,0,0.3)');

  if (d.id === 'troll') {
    circle(0, 0, r, d.color, '#5a8bb0', 3);
    ctx.fillStyle = '#e8f6ff';
    for (let i = -2; i <= 2; i++) {
      ctx.beginPath(); ctx.moveTo(i * 12 - 7, -r * 0.75); ctx.lineTo(i * 12, -r - 16 + Math.abs(i) * 5); ctx.lineTo(i * 12 + 7, -r * 0.75); ctx.fill();
    }
    circle(-11, -6, 5, '#123'); circle(11, -6, 5, '#123');
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-14, 10); ctx.lineTo(-10, 24); ctx.lineTo(-6, 10); ctx.fill();
    ctx.beginPath(); ctx.moveTo(14, 10); ctx.lineTo(10, 24); ctx.lineTo(6, 10); ctx.fill();
  } else if (d.id === 'sentinel') {
    roundRect(-r, -r, r * 2, r * 2, 10); ctx.fillStyle = d.color; ctx.fill();
    ctx.strokeStyle = '#555a66'; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = '#2a2d33'; ctx.fillRect(-r * 0.7, -r * 0.35, r * 1.4, r * 0.3);
    const eye = Math.sin(t * 1.5) * r * 0.45;
    circle(eye, -r * 0.2, 7, '#f33');
    ctx.fillStyle = '#6d717c';
    for (const s of [-1, 1]) for (const v of [-1, 1]) circle(s * r * 0.75, v * r * 0.75, 4, '#6d717c');
  } else if (d.id === 'lich') {
    ctx.beginPath(); ctx.moveTo(-r * 1.1, r * 1.1); ctx.lineTo(0, -r * 0.2); ctx.lineTo(r * 1.1, r * 1.1); ctx.closePath();
    ctx.fillStyle = '#2b2233'; ctx.fill();
    circle(0, -r * 0.35, r * 0.72, d.color, '#8a8470', 2);
    circle(-8, -r * 0.4, 5, '#0b0');
    circle(8, -r * 0.4, 5, '#0b0');
    ctx.fillStyle = '#d8b24a';
    ctx.beginPath(); ctx.moveTo(-r * 0.6, -r * 0.9);
    for (let i = 0; i <= 4; i++) ctx.lineTo(-r * 0.6 + i * r * 0.3, -r * (i % 2 ? 1.05 : 1.45));
    ctx.lineTo(r * 0.6, -r * 0.9); ctx.closePath(); ctx.fill();
  } else if (d.id === 'titan') {
    circle(0, 0, r, '#4a2a1a', '#2a160c', 4);
    ctx.strokeStyle = `rgba(255,${120 + Math.sin(t * 5) * 60},40,0.95)`;
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(-r * 0.7, -r * 0.3); ctx.lineTo(-r * 0.2, 0); ctx.lineTo(-r * 0.4, r * 0.5);
    ctx.moveTo(r * 0.6, -r * 0.5); ctx.lineTo(r * 0.2, -r * 0.1); ctx.lineTo(r * 0.5, r * 0.4);
    ctx.moveTo(-r * 0.1, r * 0.3); ctx.lineTo(r * 0.1, r * 0.8);
    ctx.stroke();
    circle(-13, -r * 0.4, 6, '#ffd24a'); circle(13, -r * 0.4, 6, '#ffd24a');
  } else if (d.id === 'hydra') {
    for (let i = -1; i <= 1; i++) {
      const hx = i * r * 0.75 + Math.sin(t * 2 + i) * 6, hy = -r * 0.9 - (i === 0 ? 14 : 0) + Math.cos(t * 2.4 + i) * 5;
      ctx.strokeStyle = '#4b2878'; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.moveTo(i * r * 0.3, 0); ctx.lineTo(hx, hy); ctx.stroke();
      circle(hx, hy, 13, '#7b4ac0');
      circle(hx - 4, hy - 3, 2.5, '#7dff4a'); circle(hx + 4, hy - 3, 2.5, '#7dff4a');
    }
    circle(0, 8, r * 0.8, d.color, '#3a1a68', 3);
  }
  if (b.flash > 0) circle(0, 0, r, 'rgba(255,255,255,0.6)');
  if (b.slow > 0) circle(0, 0, r + 4, null, 'rgba(58,176,255,0.8)', 2);
  if (b.poison > 0) circle(0, 0, r + 7, null, 'rgba(125,255,74,0.7)', 2);
  if (b.freeze > 0) circle(0, 0, r + 2, 'rgba(200,240,255,0.5)', '#e8f8ff', 3);
  drawStatus(b, r);
  ctx.restore();

  if (b.aggro || b.hp < b.maxHp) {
    const w = 110;
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(b.x - w / 2, b.y - r - 34, w, 7);
    ctx.fillStyle = '#e33'; ctx.fillRect(b.x - w / 2, b.y - r - 34, w * Math.max(0, b.hp / b.maxHp), 7);
  }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px system-ui, sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(d.name, b.x, b.y - r - 40);
}

// battle units, drawn in their team's colour
function drawUnit(u) {
  const c = TEAM_COLOR[u.team], t = elapsed, r = u.r;
  ctx.save();
  ctx.translate(u.x, u.y);
  const ec = TYPE_COLOR[u.elem] || c; // element colour
  if (u.kind === 'imp') {
    const hop = Math.abs(Math.sin(u.walk * 0.3)) * 3;
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(1, 11, 7, 2.5, 0, 0, TAU); ctx.fill();
    circle(0, -hop, r * 0.85, '#2a2238', c, 2);
    ctx.fillStyle = ec;
    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(sd * 4, -r * 0.6 - hop); ctx.lineTo(sd * 7, -r * 1.35 - hop); ctx.lineTo(sd * 1.5, -r * 0.75 - hop); ctx.fill(); }
    const fl = 1 + Math.sin(t * 18 + u.wob) * 0.2;
    ctx.beginPath(); ctx.moveTo(0, -r * 0.2 - hop - 5 * fl); ctx.quadraticCurveTo(4, -hop, 0, 3 - hop); ctx.quadraticCurveTo(-4, -hop, 0, -r * 0.2 - hop - 5 * fl); ctx.fill();
    circle(-3, -2 - hop, 1.6, '#ffd24a'); circle(3, -2 - hop, 1.6, '#ffd24a');
  } else if (u.kind === 'wisp') {
    const fl = Math.sin(t * 3 + u.wob) * 3;
    const g = ctx.createRadialGradient(0, fl, 0, 0, fl, r * 2);
    g.addColorStop(0, '#fff'); g.addColorStop(0.35, ec); g.addColorStop(1, ec + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, fl, r * 2, 0, TAU); ctx.fill();
    circle(0, fl, r * 0.55, '#fff', c, 2);
    for (let i = 0; i < 3; i++) circle(Math.sin(t * 4 + i * 2) * 4, fl + r * 0.9 + i * 4, 2 - i * 0.5, ec);
  } else if (u.kind === 'archer') {
    const bob = Math.sin(u.walk * 0.25) * 1.5;
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(1, 10, 7, 2.5, 0, 0, TAU); ctx.fill();
    circle(0, bob, r * 0.8, '#2a2238', c, 2);
    circle(0, bob + 1, r * 0.3, ec);
    circle(0, -r * 0.7 + bob, r * 0.5, '#f1d2b0');
    ctx.strokeStyle = '#a07a40'; ctx.lineWidth = 2;
    const f = u.face || 1;
    ctx.beginPath(); ctx.arc(f * r * 0.9, bob, r * 0.8, -Math.PI / 2, Math.PI / 2, f < 0); ctx.stroke();
    ctx.strokeStyle = '#ddd'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(f * r * 0.9, -r * 0.8 + bob); ctx.lineTo(f * r * 0.9, r * 0.8 + bob); ctx.stroke();
  } else if (u.kind === 'brute') {
    const bob = Math.abs(Math.sin(u.walk * 0.18)) * 2;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.beginPath(); ctx.ellipse(1, 13, 10, 3, 0, 0, TAU); ctx.fill();
    roundRect(-r, -r - bob, r * 2, r * 1.9, 4); ctx.fillStyle = '#3a3040'; ctx.fill();
    ctx.strokeStyle = c; ctx.lineWidth = 2.5; ctx.stroke();
    circle(-r * 1.05, r * 0.2 - bob, 4.5, c); circle(r * 1.05, r * 0.2 - bob, 4.5, c);
    ctx.fillStyle = ec; ctx.fillRect(-r * 0.6, r * 0.1 - bob, r * 1.2, 3);
    ctx.fillStyle = '#fff'; ctx.fillRect(-5, -r * 0.5 - bob, 3, 2); ctx.fillRect(2, -r * 0.5 - bob, 3, 2);
  } else if (u.kind === 'flyer') {
    const flap = Math.sin(t * 16 + u.wob) * 0.6;
    ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.beginPath(); ctx.ellipse(2, 16, 8, 3, 0, 0, TAU); ctx.fill();
    ctx.fillStyle = c;
    for (const sd of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(0, -2); ctx.lineTo(sd * r * 1.9, -r * (0.5 + flap)); ctx.lineTo(sd * r * 1.2, r * 0.4); ctx.closePath(); ctx.fill();
    }
    circle(0, 0, r * 0.75, '#2a2238', c, 2);
    circle(-3, -1, 1.8, '#fff'); circle(3, -1, 1.8, '#fff');
    circle(0, 3, 2, ec);
  } else if (u.kind === 'wizard') {
    circle(3, 12, 12, 'rgba(0,0,0,0.3)');
    ctx.beginPath(); ctx.moveTo(-14, 14); ctx.lineTo(0, -8); ctx.lineTo(14, 14); ctx.closePath();
    ctx.fillStyle = u.team === 'blue' ? '#24466e' : '#6e2430'; ctx.fill();
    circle(0, -6, 7, '#f1d2b0');
    ctx.beginPath(); ctx.moveTo(-12, -10); ctx.lineTo(0, -30); ctx.lineTo(12, -10); ctx.closePath(); ctx.fillStyle = c; ctx.fill();
    ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(-13, 14); ctx.lineTo(-15, -16); ctx.stroke();
    circle(-15, -18, 4.5, ec, c, 1.5); // staff orb in the wizard's element
    if (u.retreat) { ctx.fillStyle = '#8f8'; ctx.font = 'bold 11px system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillText('+', 0, -36); }
  } else if (u.kind === 'titan') {
    // a lumbering giant: alternating legs, swinging arms, a heaving body,
    // and an overhead two-fisted slam when it attacks
    const ph = u.walk * 0.09, step = Math.sin(ph), f = u.face || 1;
    const swing = u.slamT > 0 ? 1 - Math.max(0, u.slamT - 0.18) / 0.32 : 0; // 0 raised → 1 crashing down
    const bob = -Math.abs(step) * 3 + (u.slamT > 0.18 ? -4 : 0);
    ctx.fillStyle = 'rgba(0,0,0,0.32)'; ctx.beginPath(); ctx.ellipse(0, r * 1.05, r * 1.05, r * 0.32, 0, 0, TAU); ctx.fill();
    // legs
    ctx.strokeStyle = '#3a3a42'; ctx.lineCap = 'round'; ctx.lineWidth = r * 0.42;
    for (const sd of [-1, 1]) {
      const lift = Math.max(0, sd * step) * 7;
      ctx.beginPath(); ctx.moveTo(sd * r * 0.38, r * 0.35 + bob); ctx.lineTo(sd * r * 0.45 + sd * step * 4, r * 0.98 - lift); ctx.stroke();
    }
    // arms: swinging while walking, raised high then hammered down in a slam
    for (const sd of [-1, 1]) {
      let ax, ay;
      if (u.slamT > 0) {
        const up = 1 - swing;
        ax = sd * r * (0.5 + 0.2 * swing) + f * swing * r * 0.5;
        ay = -r * 1.5 * up + r * 0.9 * swing + bob;
      } else {
        ax = sd * r * 1.05 + Math.sin(ph + (sd > 0 ? Math.PI : 0)) * 3;
        ay = r * 0.45 - Math.sin(ph + (sd > 0 ? Math.PI : 0)) * r * 0.35 + bob;
      }
      ctx.strokeStyle = '#46464f'; ctx.lineWidth = r * 0.36;
      ctx.beginPath(); ctx.moveTo(sd * r * 0.72, -r * 0.25 + bob); ctx.lineTo(ax, ay); ctx.stroke();
      circle(ax, ay, r * 0.27, '#55555e', c, 2);
    }
    // body and armour
    roundRect(-r * 0.85, -r * 0.75 + bob, r * 1.7, r * 1.25, r * 0.35);
    ctx.fillStyle = '#4a4a52'; ctx.fill(); ctx.strokeStyle = c; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = ec; ctx.fillRect(-r * 0.55, -r * 0.2 + bob, r * 1.1, r * 0.2);
    drawGlyph(ELEM_GLYPH[u.elem] || 'S', 0, r * 0.18 + bob, r * 0.5, ec);
    // head with horns and glowing eyes
    circle(f * r * 0.08, -r * 0.92 + bob, r * 0.4, '#3e3e46', c, 2);
    ctx.fillStyle = '#d8d0c0';
    for (const sd of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(sd * r * 0.25, -r * 1.1 + bob); ctx.lineTo(sd * r * 0.62, -r * 1.55 + bob); ctx.lineTo(sd * r * 0.4, -r * 0.98 + bob); ctx.fill();
    }
    const glow = u.slamT > 0 ? '#fff' : ec;
    circle(f * r * 0.08 - r * 0.15, -r * 0.95 + bob, 3, glow); circle(f * r * 0.08 + r * 0.15, -r * 0.95 + bob, 3, glow);
  } else if (u.kind === 'turret') {
    circle(4, 8, r, 'rgba(0,0,0,0.3)');
    circle(0, 0, r, '#5d5a56', '#3e3c39', 3);
    ctx.fillStyle = '#76726c'; ctx.fillRect(-r * 0.55, -r * 1.3, r * 1.1, r * 1.3);
    const ready = 1 - clamp(u.cd / u.def.cd, 0, 1), flashR = (u.fireFlash || 0) > 0 ? 10 : 0;
    const gr = 12 + ready * 8 + flashR + Math.sin(t * 6 + u.wob) * 1.5;
    const g = ctx.createRadialGradient(0, -r * 1.35, 0, 0, -r * 1.35, gr);
    g.addColorStop(0, '#fff'); g.addColorStop(0.4, ec); g.addColorStop(1, ec + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -r * 1.35, gr, 0, TAU); ctx.fill();
    // the crystal itself, turning slowly
    ctx.save(); ctx.translate(0, -r * 1.35); ctx.rotate(t * 1.2 + u.wob);
    ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(5, 0); ctx.lineTo(0, 7); ctx.lineTo(-5, 0); ctx.closePath();
    ctx.fillStyle = ec; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 1; ctx.stroke();
    ctx.restore();
    circle(0, 0, r - 3, null, c, 3);
    if (u.elem) drawGlyph(ELEM_GLYPH[u.elem], 0, 2, r * 0.9, ec);
  } else if (u.kind === 'nexus') {
    const g = ctx.createRadialGradient(0, 0, 10, 0, 0, r * 2.2);
    g.addColorStop(0, c + '66'); g.addColorStop(1, c + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 2.2, 0, TAU); ctx.fill();
    circle(0, 10, r, '#4b4844', '#2e2c29', 4);
    ctx.beginPath(); ctx.moveTo(0, -r * 1.9); ctx.lineTo(r * 0.55, -r * 0.2); ctx.lineTo(0, r * 0.5); ctx.lineTo(-r * 0.55, -r * 0.2); ctx.closePath();
    ctx.fillStyle = c; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  } else if (u.kind === 'sigil') {
    const g = ctx.createRadialGradient(0, 0, 4, 0, 0, r * 2.4);
    g.addColorStop(0, c + 'aa'); g.addColorStop(1, c + '00');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 2.4, 0, TAU); ctx.fill();
    ctx.save(); ctx.rotate(t * 0.8);
    circle(0, 0, r, 'rgba(10,10,20,0.85)', c, 3);
    ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i <= 5; i++) { const a = -Math.PI / 2 + ((i * 2) % 5) * TAU / 5; const px = Math.cos(a) * r * 0.85, py = Math.sin(a) * r * 0.85; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.stroke(); ctx.restore();
    if (u.wall > 0) {
      // the protective wall, with its countdown
      ctx.strokeStyle = `rgba(220,230,255,${0.5 + Math.sin(t * 6) * 0.2})`; ctx.lineWidth = 6;
      ctx.beginPath(); ctx.arc(0, 0, r + 26, 0, TAU); ctx.stroke();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(Math.ceil(u.wall) + 's', 0, -r - 34);
    }
  }
  if (u.flash > 0) circle(0, 0, r, 'rgba(255,255,255,0.6)');
  if (u.slow > 0) circle(0, 0, r + 3, null, 'rgba(58,176,255,0.8)', 2);
  if (u.poison > 0) circle(0, 0, r + 5, null, 'rgba(125,255,74,0.7)', 2);
  if (u.freeze > 0) circle(0, 0, r + 2, 'rgba(200,240,255,0.55)', '#e8f8ff', 2);
  drawStatus(u, r);
  ctx.restore();
  // health bar in team colour
  const w = u.structure ? r * 2.4 : Math.max(24, r * 2), y = u.y - r - (u.kind === 'nexus' ? r * 1.2 + 14 : u.kind === 'turret' ? r * 0.6 + 14 : 14);
  ctx.fillStyle = 'rgba(0,0,0,0.65)'; ctx.fillRect(u.x - w / 2, y, w, 5);
  ctx.fillStyle = c; ctx.fillRect(u.x - w / 2, y, w * Math.max(0, u.hp / u.maxHp), 5);
}

function drawCritter(a) {
  const c = TYPE_COLOR[a.elem], t = elapsed, r = a.r, x = a.x, y = a.y;
  circle(x + 2, y + r * 0.9, r * 0.8, 'rgba(0,0,0,0.25)');
  if (a.elem === 'fire') {          // Ember Pup: a little flame dog
    const hop = Math.abs(Math.sin(t * 12 + a.ang)) * 3;
    circle(x, y - hop, r, '#c84a1a', '#ffb04a', 2);
    ctx.fillStyle = '#ff8a3a';
    ctx.beginPath(); ctx.moveTo(x - r * 0.8, y - r * 0.5 - hop); ctx.lineTo(x - r * 0.4, y - r * 1.4 - hop); ctx.lineTo(x - r * 0.1, y - r * 0.6 - hop); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + r * 0.8, y - r * 0.5 - hop); ctx.lineTo(x + r * 0.4, y - r * 1.4 - hop); ctx.lineTo(x + r * 0.1, y - r * 0.6 - hop); ctx.fill();
    const fl = Math.sin(t * 16) * 3;
    ctx.beginPath(); ctx.moveTo(x - r, y - hop); ctx.quadraticCurveTo(x - r * 2, y - r - hop + fl, x - r * 1.6, y - r * 1.6 - hop); ctx.lineTo(x - r * 0.8, y - r * 0.3 - hop); ctx.fill();
    circle(x - 3, y - 2 - hop, 1.8, '#111'); circle(x + 3, y - 2 - hop, 1.8, '#111');
  } else if (a.elem === 'water') {   // Bubble Frog
    const sq = Math.sin(t * 5 + a.ang) * 0.08;
    ctx.beginPath(); ctx.ellipse(x, y, r * (1.1 + sq), r * (0.85 - sq), 0, 0, TAU); ctx.fillStyle = '#2f8fd8'; ctx.fill();
    circle(x - r * 0.45, y - r * 0.6, r * 0.35, '#bfe6ff'); circle(x + r * 0.45, y - r * 0.6, r * 0.35, '#bfe6ff');
    circle(x - r * 0.45, y - r * 0.6, r * 0.15, '#111'); circle(x + r * 0.45, y - r * 0.6, r * 0.15, '#111');
    circle(x + r * 1.1, y - r * 1.2 - (t * 20 % 12), 3, null, '#bfe6ff', 1);
  } else if (a.elem === 'earth') {   // Rock Turtle
    ctx.beginPath(); ctx.ellipse(x, y, r * 1.2, r * 0.9, 0, 0, TAU); ctx.fillStyle = '#6b5236'; ctx.fill();
    ctx.strokeStyle = '#3f3020'; ctx.lineWidth = 2; ctx.stroke();
    for (let i = 0; i < 3; i++) circle(x - r * 0.5 + i * r * 0.5, y - r * 0.15, r * 0.25, '#8a6a44');
    circle(x + r * 1.25, y, r * 0.35, '#8fa15a');
  } else if (a.elem === 'air') {     // Spark Sparrow
    const flap = Math.sin(t * 22 + a.ang) * 0.7;
    ctx.fillStyle = '#f5e663';
    for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + sd * r * 1.8, y - r * (0.4 + flap)); ctx.lineTo(x + sd * r, y + r * 0.4); ctx.closePath(); ctx.fill(); }
    circle(x, y, r * 0.7, '#fff6b0', '#d8c000', 1.5);
    ctx.fillStyle = '#ff9a2a'; ctx.beginPath(); ctx.moveTo(x + r * 0.6, y); ctx.lineTo(x + r * 1.1, y + 2); ctx.lineTo(x + r * 0.6, y + 3); ctx.fill();
  } else {                           // Lantern Sprite
    const fl = Math.sin(t * 3 + a.ang) * 3;
    const g = ctx.createRadialGradient(x, y + fl, 0, x, y + fl, r * 2.2);
    g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#c77dff'); g.addColorStop(1, 'rgba(199,125,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y + fl, r * 2.2, 0, TAU); ctx.fill();
    roundRect(x - r * 0.5, y - r * 0.6 + fl, r, r * 1.2, 3); ctx.fillStyle = '#ffe9a8'; ctx.fill();
    ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 1.5; ctx.stroke();
  }
  // a health bar for helpers that can be hurt
  if (a.hp < a.maxHp) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x - r, y - r - 12, r * 2, 3);
    ctx.fillStyle = c; ctx.fillRect(x - r, y - r - 12, r * 2 * Math.max(0, a.hp / a.maxHp), 3);
  }
}

function drawAlly(a) {
  const fade = Math.min(1, a.life / 2);
  if (a.kind === 'critter') { ctx.globalAlpha = 0.4 + fade * 0.6; drawCritter(a); ctx.globalAlpha = 1; return; }
  ctx.globalAlpha = 0.4 + fade * 0.6;
  if (a.kind === 'wisp') {
    const g = ctx.createRadialGradient(a.x, a.y, 0, a.x, a.y, 20);
    g.addColorStop(0, 'rgba(230,200,255,0.9)'); g.addColorStop(1, 'rgba(199,125,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(a.x, a.y, 20, 0, TAU); ctx.fill();
    circle(a.x, a.y, 6, '#fff');
  } else if (a.kind === 'imp') {
    circle(a.x, a.y, 10, '#d83a1a', '#ffb04a', 2);
    ctx.fillStyle = '#ffb04a';
    ctx.beginPath(); ctx.moveTo(a.x - 8, a.y - 6); ctx.lineTo(a.x - 5, a.y - 16); ctx.lineTo(a.x - 2, a.y - 8); ctx.fill();
    ctx.beginPath(); ctx.moveTo(a.x + 8, a.y - 6); ctx.lineTo(a.x + 5, a.y - 16); ctx.lineTo(a.x + 2, a.y - 8); ctx.fill();
    circle(a.x - 3, a.y - 1, 1.8, '#ff4'); circle(a.x + 3, a.y - 1, 1.8, '#ff4');
  } else if (a.kind === 'dragon') {
    const flap = Math.sin(elapsed * 8) * 0.5;
    circle(a.x + 6, a.y + 34, 22, 'rgba(0,0,0,0.25)');
    ctx.fillStyle = '#8a1e14';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(a.x + s * 58, a.y - 30 - flap * 30);
      ctx.lineTo(a.x + s * 44, a.y + 6);
      ctx.lineTo(a.x + s * 24, a.y + 10);
      ctx.closePath(); ctx.fill();
    }
    ctx.strokeStyle = '#c0301c'; ctx.lineWidth = 8; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(a.x, a.y + 10); ctx.quadraticCurveTo(a.x - 14, a.y + 34, a.x + 6, a.y + 44); ctx.stroke();
    circle(a.x, a.y, 16, '#c0301c', '#ffb04a', 2);
    circle(a.x, a.y - 18, 10, '#d8401e');
    circle(a.x - 4, a.y - 20, 2.2, '#ffd24a'); circle(a.x + 4, a.y - 20, 2.2, '#ffd24a');
  } else {
    circle(a.x + 3, a.y + 12, 16, 'rgba(0,0,0,0.3)');
    roundRect(a.x - 18, a.y - 18, 36, 36, 8); ctx.fillStyle = '#7d6a55'; ctx.fill();
    ctx.strokeStyle = '#4a3e30'; ctx.lineWidth = 3; ctx.stroke();
    circle(a.x - 6, a.y - 5, 3, '#8ff'); circle(a.x + 6, a.y - 5, 3, '#8ff');
  }
  ctx.globalAlpha = 1;
}

function drawPlayer(p = player) {
  const { x, y } = p;
  if (p.onBoat) drawBoatAt(x, y + 6, Math.atan2(p.face.y, p.face.x));
  if (p.dead) return;
  if (p.invuln > 0 && Math.floor(p.invuln * 20) % 2) return;
  if (p.empower > 0) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, 40);
    g.addColorStop(0, 'rgba(255,90,42,0.45)'); g.addColorStop(1, 'rgba(255,90,42,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 40, 0, TAU); ctx.fill();
  }
  if (!p.onBoat) circle(x + 3, y + 12, 13, 'rgba(0,0,0,0.3)');
  // robe
  ctx.beginPath(); ctx.moveTo(x - 15, y + 14); ctx.lineTo(x, y - 8); ctx.lineTo(x + 15, y + 14); ctx.closePath();
  ctx.fillStyle = p.robe || '#4b2d7a'; ctx.fill();
  circle(x, y - 6, 8, '#f1d2b0');
  // hat
  ctx.beginPath(); ctx.moveTo(x - 13, y - 10); ctx.lineTo(x + p.face.x * 4, y - 32); ctx.lineTo(x + 13, y - 10); ctx.closePath();
  ctx.fillStyle = p.hat || '#6a3fb0'; ctx.fill();
  ctx.fillStyle = '#ffd24a'; ctx.fillRect(x - 13, y - 12, 26, 3);
  // staff
  ctx.strokeStyle = '#8a5a2a'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(x + 14, y + 14); ctx.lineTo(x + 16, y - 18); ctx.stroke();
  circle(x + 16, y - 20, 4, p === player && seq.length ? ELEMENTS[seq[seq.length - 1]].color : '#c77dff');

  if (p.skin > 0) circle(x, y, 24, null, 'rgba(181,131,74,0.9)', 4);
  if (p.omni > 0) {
    // a ring of every element's colour, spinning, plus a gold crown
    for (let i = 0; i < OMNI_TYPES.length; i++) {
      const a = elapsed * 3 + i * TAU / OMNI_TYPES.length;
      circle(x + Math.cos(a) * 36, y + Math.sin(a) * 36, 5, TYPE_COLOR[OMNI_TYPES[i]]);
    }
    ctx.fillStyle = '#ffd24a';
    ctx.beginPath();
    ctx.moveTo(x - 11, y - 34); ctx.lineTo(x - 11, y - 44); ctx.lineTo(x - 5, y - 38); ctx.lineTo(x, y - 47);
    ctx.lineTo(x + 5, y - 38); ctx.lineTo(x + 11, y - 44); ctx.lineTo(x + 11, y - 34); ctx.closePath(); ctx.fill();
  }
  if (p.mirror > 0) {
    ctx.strokeStyle = `rgba(230,220,255,${0.5 + Math.sin(elapsed * 10) * 0.3})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(x, y, 30, 0, TAU); ctx.stroke();
  }
  if (p.sanct > 0) circle(x, y, 38, 'rgba(255,246,176,0.18)', 'rgba(255,246,176,0.9)', 3);
  if (p.regen > 0 && Math.random() < 0.2) particles.push({ x: x + rnd(-12, 12), y: y + 10, vx: 0, vy: -40, r: 2.5, life: 0.8, decay: 1.5, color: '#8f8' });
  if (p.phoenix > 0) circle(x, y + 14, 5 + Math.sin(elapsed * 4), '#ff8a3a');
  if (p.ward > 0) {
    circle(x, y, 30, 'rgba(199,125,255,0.12)', 'rgba(199,125,255,0.8)', 2);
    for (let i = 0; i < p.ward; i++) {
      const a = elapsed * 2 + i * TAU / p.ward;
      circle(x + Math.cos(a) * 30, y + Math.sin(a) * 30, 3, '#e6ccff');
    }
  }
}

function drawShot(s) {
  if (s.type === 'arrow') {
    const sp = Math.hypot(s.vx, s.vy) || 1, ux = s.vx / sp, uy = s.vy / sp;
    ctx.strokeStyle = '#d8c8a0'; ctx.lineWidth = 2.5; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(s.x - ux * 22, s.y - uy * 22); ctx.lineTo(s.x, s.y); ctx.stroke();
    ctx.fillStyle = '#ddd';
    ctx.beginPath(); ctx.moveTo(s.x + ux * 7, s.y + uy * 7);
    ctx.lineTo(s.x - uy * 4, s.y + ux * 4); ctx.lineTo(s.x + uy * 4, s.y - ux * 4); ctx.closePath(); ctx.fill();
    ctx.strokeStyle = '#c33'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(s.x - ux * 22 - uy * 4, s.y - uy * 22 + ux * 4); ctx.lineTo(s.x - ux * 18, s.y - uy * 18);
    ctx.moveTo(s.x - ux * 22 + uy * 4, s.y - uy * 22 - ux * 4); ctx.lineTo(s.x - ux * 18, s.y - uy * 18); ctx.stroke();
    return;
  }
  const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, s.r * 2.2);
  g.addColorStop(0, '#fff'); g.addColorStop(0.35, s.color); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 2.2, 0, TAU); ctx.fill();
}

function drawZone(z) {
  const a = Math.min(1, z.life);
  if (z.type === 'woven') { drawWovenPool(z, a); return; }
  if (z.type === 'mud') {
    circle(z.x, z.y, z.r, `rgba(90,60,30,${0.55 * a})`, `rgba(60,40,20,${0.8 * a})`, 3);
    for (let i = 0; i < 6; i++) circle(z.x + Math.cos(i * 1.7) * z.r * 0.55, z.y + Math.sin(i * 2.3) * z.r * 0.5, 5 + Math.sin(elapsed * 3 + i) * 2, `rgba(120,85,45,${a})`);
  } else if (z.type === 'vortex') {
    ctx.strokeStyle = `rgba(220,240,255,${0.5 * a})`; ctx.lineWidth = 3;
    for (let i = 0; i < 4; i++) {
      ctx.beginPath();
      for (let k = 0; k < 30; k++) {
        const rr = z.r * (1 - k / 30), ang = elapsed * 4 + i * TAU / 4 + k * 0.25;
        const x = z.x + Math.cos(ang) * rr, y = z.y + Math.sin(ang) * rr;
        k ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
      }
      ctx.stroke();
    }
    circle(z.x, z.y, 14, '#0a0a14', '#cfe8ff', 2);
  } else if (z.type === 'spring') {
    const g = ctx.createRadialGradient(z.x, z.y, 0, z.x, z.y, z.r);
    g.addColorStop(0, `rgba(120,255,170,${0.4 * a})`); g.addColorStop(1, 'rgba(60,200,140,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.fill();
    circle(z.x, z.y, z.r, null, `rgba(140,255,190,${0.6 * a})`, 2);
    for (let i = 0; i < 6; i++) {
      const y = z.y + z.r * 0.5 - ((elapsed * 30 + i * 17) % (z.r));
      circle(z.x + Math.cos(i * 1.9) * z.r * 0.5, y, 3, `rgba(200,255,220,${a})`);
    }
  }
}

function drawWovenPool(z, a) {
  const el = z.spec.elem, c = TYPE_COLOR[el], t = elapsed;
  const g = ctx.createRadialGradient(z.x, z.y, 0, z.x, z.y, z.r);
  g.addColorStop(0, c + '66'); g.addColorStop(1, c + '10');
  ctx.globalAlpha = a;
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.fill();
  circle(z.x, z.y, z.r, null, c + 'aa', 2);
  if (el === 'fire') for (let i = 0; i < 7; i++) {
    const px = z.x + Math.cos(i * 2.4) * z.r * 0.6, py = z.y + Math.sin(i * 1.7) * z.r * 0.5, h = 6 + Math.sin(t * 9 + i) * 3;
    ctx.fillStyle = i % 2 ? '#ffb04a' : '#ff5a2a'; ctx.beginPath(); ctx.moveTo(px - 4, py); ctx.quadraticCurveTo(px, py - h * 2, px + 4, py); ctx.fill();
  } else if (el === 'water') {
    ctx.strokeStyle = 'rgba(220,240,255,0.6)'; ctx.lineWidth = 1.5;
    for (let i = 0; i < 3; i++) { const rr = ((t * 25 + i * z.r / 3) % z.r); ctx.beginPath(); ctx.arc(z.x, z.y, rr, 0, TAU); ctx.stroke(); }
  } else if (el === 'earth') {
    for (let i = 0; i < 9; i++) circle(z.x + Math.cos(i * 2.1 + t * 0.5) * z.r * 0.55, z.y + Math.sin(i * 1.3 + t * 0.5) * z.r * 0.5, 3, z.spec.fx.has('poison') ? '#7dff4a' : '#6b4a22');
  } else if (el === 'air') {
    ctx.strokeStyle = 'rgba(255,250,200,0.6)'; ctx.lineWidth = 2;
    for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(z.x, z.y, z.r * (0.3 + i * 0.25), t * 4 + i, t * 4 + i + 2.2); ctx.stroke(); }
  } else if (el === 'spirit') {
    ctx.save(); ctx.translate(z.x, z.y); ctx.rotate(t * 0.4);
    ctx.strokeStyle = '#e6ccff'; ctx.lineWidth = 2; ctx.beginPath();
    for (let i = 0; i <= 5; i++) { const an = -Math.PI / 2 + ((i * 2) % 5) * TAU / 5; const px = Math.cos(an) * z.r * 0.7, py = Math.sin(an) * z.r * 0.7; i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
    ctx.stroke(); ctx.restore();
  }
  if (z.charged > 0) {
    // crackling lightning across the water
    ctx.strokeStyle = 'rgba(180,255,255,0.9)'; ctx.lineWidth = 2;
    for (let k = 0; k < 3; k++) {
      ctx.beginPath();
      let px = z.x + rnd(-z.r, z.r) * 0.7, py = z.y + rnd(-z.r, z.r) * 0.7; ctx.moveTo(px, py);
      for (let i = 0; i < 4; i++) { px += rnd(-18, 18); py += rnd(-18, 18); ctx.lineTo(px, py); }
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;
}

function drawEffects() {
  drawSideFx();
  drawSharedFx();
}

// one side's lingering spells, its charging hero and its shots
function drawSideFx() {
  for (const z of zones) {
    if (z.type === 'mud' || z.type === 'vortex' || z.type === 'spring' || z.type === 'woven') { drawZone(z); continue; }
    const a = Math.min(1, z.life) * 0.35;
    const g = ctx.createRadialGradient(z.x, z.y, 0, z.x, z.y, z.r);
    if (z.type === 'fire') { g.addColorStop(0, `rgba(255,110,40,${a * 1.5})`); g.addColorStop(1, 'rgba(120,30,10,0)'); }
    else { g.addColorStop(0, `rgba(125,255,74,${a})`); g.addColorStop(1, 'rgba(60,140,30,0)'); }
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(z.x, z.y, z.r, 0, TAU); ctx.fill();
    for (let i = 0; i < 5; i++) {
      const bx = z.x + Math.cos(i * 1.3 + elapsed) * z.r * 0.6, by = z.y + Math.sin(i * 2.1 + elapsed * 1.3) * z.r * 0.6;
      circle(bx, by, 4, z.type === 'fire' ? `rgba(255,200,90,${a * 2})` : `rgba(160,255,110,${a * 1.5})`);
    }
  }
  const ch = player.charging;
  if (ch) {
    // a ring tightens around the caster as the spell charges
    const k = 1 - ch.t / ch.max, tier = ch.key.length, col = TIER_COLOR[tier];
    if (tier === 7) {
      ctx.fillStyle = `rgba(20,0,8,${k * 0.5})`;
      ctx.fillRect(player.x - 3000, player.y - 3000, 6000, 6000);
      circle(player.x, player.y, 1000 * (1 - k) + 40, null, `rgba(255,51,85,${0.4 + k * 0.6})`, 4 + k * 8);
    } else {
      ctx.globalAlpha = 0.4 + k * 0.6;
      circle(player.x, player.y, 30 + (1 - k) * 25 * tier, null, col, 2 + k * 4);
      ctx.globalAlpha = 1;
    }
    for (let i = 0; i < tier; i++) {
      const a = elapsed * 6 + i * TAU / tier, d = 34 * (1 - k * 0.6);
      circle(player.x + Math.cos(a) * d, player.y + Math.sin(a) * d, 3 + k * 3, ELEMENTS[ch.key[i]].color);
    }
  }
  for (const w of waves) {
    const a = 1 - w.r / w.maxR;
    circle(w.x, w.y, w.r, null, `rgba(58,176,255,${a})`, 14);
    circle(w.x, w.y, w.r - 10, null, `rgba(200,240,255,${a * 0.7})`, 3);
  }
  for (const m of meteors) {
    const k = 1 - m.t / m.max;
    circle(m.x, m.y, 200, `rgba(255,90,42,${0.08 + k * 0.15})`, `rgba(255,90,42,${0.4 + k * 0.4})`, 2);
    const hx = m.x - 260 * (1 - k), hy = m.y - 420 * (1 - k);
    const g = ctx.createRadialGradient(hx, hy, 0, hx, hy, 30);
    g.addColorStop(0, '#fff'); g.addColorStop(0.4, '#ffb04a'); g.addColorStop(1, 'rgba(255,90,42,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(hx, hy, 30, 0, TAU); ctx.fill();
  }
  for (const s of shots) drawShot(s);
}

// visuals everyone shares: rings, bolts, particles, floating numbers
function drawSharedFx() {
  for (const e of fx) {
    const a = e.life / e.max;
    if (e.kind === 'ring') {
      ctx.globalAlpha = a;
      circle(e.x, e.y, e.r * (1.1 - a * 0.3), null, e.color, 3);
      ctx.globalAlpha = 1;
    } else if (e.kind === 'cone') {
      ctx.globalAlpha = a * 0.6;
      ctx.fillStyle = e.color;
      ctx.beginPath(); ctx.moveTo(e.x, e.y);
      ctx.arc(e.x, e.y, e.range * (1.1 - a * 0.3), e.ang - e.half, e.ang + e.half);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    } else if (e.kind === 'bolt') {
      ctx.strokeStyle = e.color || `rgba(160,255,255,${a})`;
      ctx.globalAlpha = e.color ? a : 1;
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let i = 0; i < e.pts.length - 1; i++) {
        const p = e.pts[i], q = e.pts[i + 1];
        ctx.moveTo(p.x, p.y);
        for (let k = 1; k < 6; k++) ctx.lineTo(p.x + (q.x - p.x) * k / 6 + rnd(-10, 10), p.y + (q.y - p.y) * k / 6 + rnd(-10, 10));
        ctx.lineTo(q.x, q.y);
      }
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
  for (const s of enemyShots) {
    circle(s.x, s.y, s.r + 3, 'rgba(0,0,0,0.4)');
    circle(s.x, s.y, s.r, s.color, '#fff', 1.5);
  }
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    circle(p.x, p.y, p.r, p.color);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  for (const t of floaters) {
    ctx.globalAlpha = Math.min(1, t.life / t.max * 1.5);
    ctx.font = `bold ${t.size}px system-ui, sans-serif`;
    ctx.fillStyle = '#000';
    ctx.fillText(t.text, t.x + 1, t.y + 1);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawWorld() {
  let camX = player.x - W / 2, camY = player.y - playerScreenY();
  if (shake > 0) { camX += rnd(-shake, shake); camY += rnd(-shake, shake); }
  ctx.save();
  ctx.translate(-camX, -camY);
  drawGround(camX, camY);
  drawShrine();
  if (mode !== 'battle') {
    drawLake(camX, camY);
    drawGrass(camX, camY);
    drawCastles(camX, camY);
  }
  drawSolids(camX, camY);
  if (mode === 'battle') drawLasers();
  for (const b of tempSolids) {
    ctx.globalAlpha = Math.min(1, b.life);
    const t = elapsed;
    if (b.elem === 'fire') {
      // a pillar of flame
      const h = b.r * (1.6 + Math.sin(t * 10 + b.x) * 0.25);
      const g = ctx.createRadialGradient(b.x, b.y, 2, b.x, b.y - h * 0.4, h);
      g.addColorStop(0, '#fff6b0'); g.addColorStop(0.4, '#ff8a3a'); g.addColorStop(1, 'rgba(255,90,42,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(b.x, b.y - h * 0.3, b.r, h, 0, 0, TAU); ctx.fill();
    } else if (b.elem === 'water') {
      // a block of ice
      ctx.beginPath();
      for (let i = 0; i < 6; i++) { const a2 = i * TAU / 6 + 0.5; i ? ctx.lineTo(b.x + Math.cos(a2) * b.r, b.y + Math.sin(a2) * b.r) : ctx.moveTo(b.x + Math.cos(a2) * b.r, b.y + Math.sin(a2) * b.r); }
      ctx.closePath(); ctx.fillStyle = 'rgba(190,230,255,0.85)'; ctx.fill(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
      circle(b.x - 4, b.y - 4, 3, '#fff');
    } else if (b.elem === 'air') {
      // a column of wind
      ctx.strokeStyle = 'rgba(255,250,200,0.8)'; ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) { ctx.beginPath(); ctx.arc(b.x, b.y, b.r * (0.5 + i * 0.3), t * 6 + i * 2, t * 6 + i * 2 + 2.5); ctx.stroke(); }
    } else if (b.elem === 'spirit') {
      // a shimmering illusion: walk-through, but it scrambles the mind
      ctx.globalAlpha *= 0.55 + Math.sin(t * 4 + b.y) * 0.2;
      circle(b.x, b.y, b.r, 'rgba(199,125,255,0.35)', '#e6ccff', 1.5);
      circle(b.x, b.y, b.r * 0.4, '#e6ccff');
    } else {
      circle(b.x + 3, b.y + 5, b.r, 'rgba(0,0,0,0.3)');
      circle(b.x, b.y, b.r, '#7a6a55', '#4e4236', 3);
      circle(b.x - 4, b.y - 4, b.r * 0.4, '#958268');
    }
    ctx.globalAlpha = 1;
  }
  drawTraps();
  if (versus && net.role === 'host') withSide('red', drawTraps);
  drawBoat();
  drawScrolls();
  for (const c of chests) drawChest(c);
  for (const f of foes) {
    if (f.dead || f.proxyOf) continue;
    if (f.x < camX - 120 || f.x > camX + W + 120 || f.y < camY - 120 || f.y > camY + H + 120) continue;
    f.boss ? drawBoss(f) : f.unit && !(f.hex > 0) ? drawUnit(f) : drawFoe(f);
  }
  for (const u of friends) if (!u.dead && inView(u.x, u.y, 120, camX, camY)) drawUnit(u);
  for (const sh of bshots) {
    if (sh.arrow) {
      const sp = Math.hypot(sh.vx, sh.vy) || 1;
      ctx.strokeStyle = sh.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(sh.x - sh.vx / sp * 12, sh.y - sh.vy / sp * 12); ctx.lineTo(sh.x, sh.y); ctx.stroke();
      continue;
    }
    if (sh.elem) {
      circle(sh.x + 3, sh.y + 6, sh.r * 0.8, 'rgba(0,0,0,0.25)');
      drawElemShot(sh);
      // a thin ring in the shooter's team colour, so you can tell whose it is
      circle(sh.x, sh.y, sh.r * 1.5, null, TEAM_COLOR[sh.team] + '99', 1);
      continue;
    }
    circle(sh.x, sh.y, sh.r + 4, 'rgba(0,0,0,0.35)');
    circle(sh.x, sh.y, sh.r, sh.color, '#fff', 1.5);
  }
  for (const a of allies) drawAlly(a);
  drawPlayer();
  if (versus) {
    // your friend's wizard, helpers and spells
    if (net.role === 'host') withSide('red', () => { for (const a of allies) drawAlly(a); drawPlayer(); drawSideFx(); });
    else if (otherHero) drawPlayer(otherHero);
  }
  drawSideFx();
  drawSharedFx();
  ctx.restore();
}

function drawTraps() {
  for (const t of traps) {
    const on = t.arm <= 0, c = t.spec ? TYPE_COLOR[t.spec.elem] : '#ff8a3a';
    circle(t.x, t.y, 9, '#3a2a1a', on ? c : '#776', 2);
    if (t.spec) drawGlyph(ELEM_GLYPH[t.spec.elem], t.x, t.y, 9, c);
    else if (on && Math.sin(elapsed * 8) > 0) circle(t.x, t.y, 3, '#ffb04a');
  }
}

// ── HUD ──────────────────────────────────────────────────────────────────────
function bar(x, y, w, h, frac, color, label) {
  roundRect(x, y, w, h, h / 2); ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
  if (frac > 0) { roundRect(x, y, Math.max(h, w * frac), h, h / 2); ctx.fillStyle = color; ctx.fill(); }
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 11px system-ui, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(label, x + 8, y + h - 4);
}

function drawHUD() {

    ctx.fillStyle = TEAM_COLOR.blue; ctx.fillText(bt, 14, 72);
    const bw = ctx.measureText(bt).width;

  }

  ctx.font = '12px system-ui, sans-serif';
  if (mode === 'battle' && teams) {
    const m = Math.floor(teams.time / 60), sec = Math.floor(teams.time % 60).toString().padStart(2, '0');
    ctx.fillText(`${m}:${sec} left   ·   most ground at the end: +${GROUND_BONUS}`, 14, 90);
  } else ctx.fillText(`Spells ${discovered.size}/${SPELL_COUNT}   Guardians ${bossesDown}/${BOSSES.length}`, 14, 90);
  if (mode === 'battle') drawBattleStatus(14, 110); else drawHunt(14, 108);

  const buffs = [];

  if (player.skin > 0)    buffs.push([`Stoneskin ${Math.ceil(player.skin)}`, TYPE_COLOR.earth]);
  if (player.haste > 0)   buffs.push([`Haste ${Math.ceil(player.haste)}`, TYPE_COLOR.air]);
  if (player.empower > 0) buffs.push([`Empower ${Math.ceil(player.empower)}`, TYPE_COLOR.fire]);
  if (player.omni > 0)    buffs.push([`Crown ${Math.ceil(player.omni)}`, TIER_COLOR[6]]);
  if (player.mirror > 0)  buffs.push([`Mirror ${Math.ceil(player.mirror)}`, TYPE_COLOR.mirror]);
  if (player.sanct > 0)   buffs.push([`Sanctuary ${Math.ceil(player.sanct)}`, TYPE_COLOR.holy]);
  if (player.regen > 0)   buffs.push([`Regen ${Math.ceil(player.regen)}`, '#8f8']);

  if (timeStop > 0)       buffs.push([`Time Stop ${Math.ceil(timeStop)}`, '#fff']);
  else if (timeWarp > 0)  buffs.push([`Slow-mo ${Math.ceil(timeWarp)}`, '#9cf']);
  let bx = 14;

    ctx.fillStyle = c;

  }

  drawMinimap();
  drawBuildButtons();
  drawCharges();

  {
    const r = soundRect();
    roundRect(r.x, r.y, r.w, r.h, 6);
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = sfx.on ? '#ddd' : '#888';
    ctx.font = '11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(sfx.on ? '♪ Sound on' : '♪ Sound off', r.x + r.w / 2, r.y + 16);
  }

  if (isTouch) {
    const r = tiltLabelRect();
    const ok = !!tilt.raw;
    const waiting = tilt.listening && !ok && performance.now() - tilt.startedAt < 1500;
    roundRect(r.x, r.y, r.w, r.h, 6);
    ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fill();
    ctx.strokeStyle = ok ? 'rgba(125,255,74,0.6)' : 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = ok ? '#bfffa0' : '#aaa';
    ctx.font = '11px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(ok ? 'Tilt on · level' : tilt.denied ? 'Tilt blocked' : waiting ? 'Tilt…' : 'Tilt off · retry', r.x + r.w / 2, r.y + 16);
    if (tilt.listening && !ok && !waiting && !tilt.warned) {

  }

  if (banner) {
    const a = Math.min(1, banner.life, (banner.max - banner.life) * 4);
    ctx.globalAlpha = Math.max(0, a);
    ctx.textAlign = 'center';
    ctx.font = 'bold 22px system-ui, sans-serif';
    ctx.fillStyle = '#000'; ctx.fillText(banner.text, W / 2 + 2, 172);
    ctx.fillStyle = '#ffe9a8'; ctx.fillText(banner.text, W / 2, 170);
    if (banner.sub) {
      ctx.font = '15px system-ui, sans-serif';
      ctx.fillStyle = '#ddd'; ctx.fillText(banner.sub, W / 2, 194);
    }
    ctx.globalAlpha = 1;
  }
}

function drawFireButton() {

// how much ground each side holds, and whose build turn is next
function drawBattleStatus(x, y) {
  if (!teams) return;
  const total = FIELD_CELLS, w = Math.min(170, W * 0.42);
  const b = teams.blue.cells / total, r = teams.red.cells / total;
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(x, y - 9, w, 9);
  ctx.fillStyle = TEAM_COLOR.blue; ctx.fillRect(x, y - 9, w * b, 9);
  ctx.fillStyle = TEAM_COLOR.red; ctx.fillRect(x + w * (1 - r), y - 9, w * r, 9);
  ctx.font = '10px system-ui, sans-serif';
  ctx.textAlign = 'left';

  ctx.fillStyle = teams.pending ? '#ffd24a' : '#aaa';
  ctx.fillText(bt, x, y + 26);
}

// The minion mix: a pentagon with one corner per element (laid out like the
// casting pentagram). Drag the dot toward the kinds you want more of.
function mixTri() {
  const R = Math.min(46, W * 0.11), cx = 44 + R, cy = 214 + R, pts = {};
  MINION_KINDS.forEach((k, i) => { const a = -Math.PI / 2 + i * TAU / 5; pts[k] = { x: cx + Math.cos(a) * R, y: cy + Math.sin(a) * R }; });
  return { R, cx, cy, pts };
}
function mixPoint() {
  const T = mixTri(), m = teams.blue.mix;
  if (teams.blue.dot) return teams.blue.dot;
  return { x: MINION_KINDS.reduce((a, k) => a + T.pts[k].x * m[k], 0), y: MINION_KINDS.reduce((a, k) => a + T.pts[k].y * m[k], 0) };
}
let mixOpen = false;
function mixToggleRect() { return { x: 14, y: 176, w: 74, h: 22 }; }
function mixToggleHit(x, y) {
  if (mode !== 'battle' || !teams) return false;
  const r = mixToggleRect();
  return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
}
function mixHit(x, y) {
  if (mode !== 'battle' || !teams || !mixOpen) return false;
  const T = mixTri();
  return Math.hypot(x - T.cx, y - T.cy) < T.R + 22;
}
// set the mix from a point: the closer to a corner, the more of that kind
function setMixAt(x, y) {
  const T = mixTri();
  let dx = x - T.cx, dy = y - T.cy, d = Math.hypot(dx, dy);
  const lim = T.R * 0.95;
  if (d > lim) { dx *= lim / d; dy *= lim / d; }
  const px = T.cx + dx, py = T.cy + dy;
  const w = MINION_KINDS.map(k => 1 / (Math.hypot(px - T.pts[k].x, py - T.pts[k].y) ** 2 + T.R * T.R * 0.08));
  const tot = w.reduce((a, b) => a + b, 0);
  teams.blue.mix = Object.fromEntries(MINION_KINDS.map((k, i) => [k, w[i] / tot]));
  teams.blue.dot = { x: px, y: py };
  if (net.role === 'guest') { const now = performance.now(); if (now - (net.mixT || 0) > 150) { net.mixT = now; net.send({ t: 'mix', mix: teams.blue.mix }); } }
}
function drawCharges() {
  if (mode !== 'battle' || !player.charge) return;
  const r = 7.5, gap = 4, y = 160;
  let x = 14 + r;
  for (const t of CHARGE_TYPES) {
    const c = player.charge[t], low = c < CHARGE_LOW, col = TYPE_COLOR[t];
    circle(x, y, r, 'rgba(0,0,0,0.6)', low ? 'rgba(255,90,90,0.9)' : 'rgba(255,255,255,0.25)', low ? 1.5 : 1);
    if (c > 0.01) {
      ctx.globalAlpha = low ? 0.45 : 1;
      ctx.fillStyle = col;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.arc(x, y, r - 1.5, -Math.PI / 2, -Math.PI / 2 + TAU * c); ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }
    x += r * 2 + gap;
  }
}

function drawMixToggle() {
  if (mode !== 'battle' || !teams) return;
  const r = mixToggleRect();
  roundRect(r.x, r.y, r.w, r.h, 11);
  ctx.fillStyle = mixOpen ? 'rgba(74,168,255,0.85)' : 'rgba(10,14,28,0.75)'; ctx.fill();
  ctx.strokeStyle = TEAM_COLOR.blue; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = mixOpen ? '#08111e' : '#cfe6ff';
  ctx.font = 'bold 11px system-ui, sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(mixOpen ? '▲ Mix · hide' : '▲ Minion mix', r.x + r.w / 2, r.y + 15);
}

function drawMixTri() {
  drawMixToggle();
  if (mode !== 'battle' || !teams || !mixOpen) return;
  const T = mixTri(), P = T.pts;
  ctx.beginPath();
  MINION_KINDS.forEach((k, i) => i ? ctx.lineTo(P[k].x, P[k].y) : ctx.moveTo(P[k].x, P[k].y));
  ctx.closePath();
  ctx.fillStyle = 'rgba(10,14,28,0.78)'; ctx.fill();
  ctx.strokeStyle = 'rgba(74,168,255,0.6)'; ctx.lineWidth = 1.5; ctx.stroke();
  // who beats whom: gold arrows along the Water → Fire → Air → Earth → Spirit cycle
  ctx.strokeStyle = 'rgba(255,210,74,0.55)'; ctx.fillStyle = 'rgba(255,210,74,0.75)'; ctx.lineWidth = 1.2;
  for (const e of ELEM_CYCLE) {
    const a = P[MINION_OF[e]], b = P[MINION_OF[elemBeats(e)]];
    const dx = b.x - a.x, dy = b.y - a.y, dl = Math.hypot(dx, dy);
    const sx = a.x + dx / dl * 9, sy = a.y + dy / dl * 9, ex = b.x - dx / dl * 9, ey = b.y - dy / dl * 9;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(ex, ey);
    ctx.lineTo(ex - dx / dl * 6 - dy / dl * 3.5, ey - dy / dl * 6 + dx / dl * 3.5); ctx.lineTo(ex - dx / dl * 6 + dy / dl * 3.5, ey - dy / dl * 6 - dx / dl * 3.5); ctx.closePath(); ctx.fill();
  }
  const counts = waveKinds(teams.blue.mix, teams.blue.minions).reduce((m, k) => (m[k] = (m[k] || 0) + 1, m), {});
  for (const k of MINION_KINDS) {
    const e = UNITS[k].elem, q = P[k], ox = q.x - T.cx, oy = q.y - T.cy, ol = Math.hypot(ox, oy);
    circle(q.x, q.y, 8, 'rgba(10,14,28,0.95)', TYPE_COLOR[e], 2);
    drawGlyph(ELEM_GLYPH[e], q.x, q.y, 11, TYPE_COLOR[e]);
    ctx.fillStyle = '#ddd'; ctx.font = 'bold 10px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(`${UNITS[k].name} ${counts[k] || 0}`, q.x + ox / ol * 22, q.y + oy / ol * 20 + 3);
  }
  const m = mixPoint();
  circle(m.x, m.y, 6, TEAM_COLOR.blue, '#fff', 2);
}
