<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const TAU = Math.PI * 2;

// Keep swipes inside the game: no page scrolling, pull-to-refresh or bounce.
for (const ev of ['touchstart', 'touchmove']) {
  document.addEventListener(ev, e => { if (e.cancelable) e.preventDefault(); }, { passive: false });
}
document.addEventListener('gesturestart', e => e.preventDefault());

// ── sound effects (synthesised, no files) ───────────────────────────────────
const sfx = { ctx: null, out: null, noise: null, on: true, last: {} };
try { sfx.on = localStorage.getItem('pentagram-sound') !== 'off'; } catch (_) {}

function audioInit() {
  if (sfx.ctx) { if (sfx.ctx.state === 'suspended') sfx.ctx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  try {
    sfx.ctx = new AC();
    sfx.out = sfx.ctx.createGain();
    sfx.out.gain.value = 0.45;
    sfx.out.connect(sfx.ctx.destination);
    const len = sfx.ctx.sampleRate;
    sfx.noise = sfx.ctx.createBuffer(1, len, len);
    const d = sfx.noise.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  } catch (_) { sfx.ctx = null; }
}

// skip a sound if the same one played a moment ago (hit spam, poison ticks)
function sfxReady(name, gap) {
  if (!sfx.on || !sfx.ctx || sfx.ctx.state !== 'running') return false;
  const now = sfx.ctx.currentTime;
  if (gap && sfx.last[name] && now - sfx.last[name] < gap) return false;
  sfx.last[name] = now;
  return true;
}

function tone(freq, dur, type, vol, slideTo, delay) {
  const c = sfx.ctx, t = c.currentTime + (delay || 0);
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(sfx.out);
  o.start(t); o.stop(t + dur + 0.05);
}

function hiss(dur, vol, filter, freq, slideTo, delay) {
  const c = sfx.ctx, t = c.currentTime + (delay || 0);
  const src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
  src.buffer = sfx.noise;
  f.type = filter || 'lowpass';
  f.frequency.setValueAtTime(freq || 1200, t);
  if (slideTo) f.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f); f.connect(g); g.connect(sfx.out);
  src.start(t, Math.random() * 0.5); src.stop(t + dur + 0.05);
}

const EL_NOTE = { S: 880, A: 784, W: 659, F: 587, E: 440 };

const SFX = {
  node(el, n)   { if (sfxReady('node')) tone(EL_NOTE[el] * (1 + n * 0.06), 0.14, 'triangle', 0.22); },
  fizzle()      { if (!sfxReady('fizzle')) return; hiss(0.3, 0.15, 'lowpass', 1500, 200); tone(220, 0.3, 'sawtooth', 0.05, 70); },
  weave(key)    { if (!sfxReady('weave')) return; [...key].forEach((el, i) => tone(EL_NOTE[el], 0.18, 'triangle', 0.14, null, i * 0.045)); },
  loaded()      { if (sfxReady('loaded')) tone(1320, 0.12, 'sine', 0.1, null, 0.05); },
  charge(tier, dur) { if (sfxReady('charge')) { tone(110 + tier * 20, dur, 'sawtooth', 0.05, 330 + tier * 90); hiss(dur, 0.06, 'bandpass', 300, 3000); } },
  release(key) {
    if (!sfxReady('release', 0.04)) return;
    const tier = key.length, el = key[tier - 1];
    if (el === 'F') hiss(0.35, 0.18, 'bandpass', 700, 180);
    else if (el === 'W') { tone(900, 0.25, 'sine', 0.14, 300); hiss(0.2, 0.08, 'highpass', 4000); }
    else if (el === 'E') { tone(120, 0.3, 'sine', 0.3, 50); hiss(0.15, 0.1, 'lowpass', 400); }
    else if (el === 'A') hiss(0.3, 0.2, 'bandpass', 2500, 600);
    else { tone(1200, 0.4, 'sine', 0.1); tone(1800, 0.4, 'sine', 0.06, null, 0.03); }
    if (tier >= 4) boom(0.25 + tier * 0.1);
  },
  lightning()   { if (sfxReady('zap', 0.05)) { hiss(0.12, 0.2, 'highpass', 3000); tone(90, 0.1, 'square', 0.06, 40); } },
  arrow()       { if (sfxReady('arrow')) { hiss(0.08, 0.14, 'highpass', 3000); tone(700, 0.07, 'triangle', 0.08, 350); } },
  hit()         { if (sfxReady('hit', 0.05)) hiss(0.05, 0.1, 'bandpass', 1800); },
  immune()      { if (sfxReady('immune', 0.2)) { tone(1400, 0.12, 'square', 0.05); tone(1900, 0.1, 'square', 0.03, null, 0.02); } },
  kill()        { if (sfxReady('kill', 0.04)) tone(360, 0.18, 'triangle', 0.12, 90); },
  hurt()        { if (sfxReady('hurt', 0.1)) { tone(220, 0.22, 'sawtooth', 0.12, 80); hiss(0.1, 0.1, 'lowpass', 900); } },
  block()       { if (sfxReady('block')) tone(1000, 0.2, 'triangle', 0.12, 1400); },
  heal()        { if (sfxReady('heal')) [523, 659, 784].forEach((f, i) => tone(f, 0.3, 'sine', 0.1, null, i * 0.07)); },
  buff()        { if (sfxReady('buff')) [440, 554, 659, 880].forEach((f, i) => tone(f, 0.25, 'triangle', 0.08, null, i * 0.05)); },
  summon()      { if (sfxReady('summon')) { tone(200, 0.5, 'sawtooth', 0.06, 600); hiss(0.4, 0.08, 'bandpass', 400, 2400); } },
  explode(big)  { if (sfxReady('explode', 0.05)) boom(big ? 1.4 : 0.5); },
  freeze()      { if (sfxReady('freeze')) { hiss(0.9, 0.18, 'highpass', 6000, 2000); [1568, 2093, 2637].forEach((f, i) => tone(f, 0.5, 'sine', 0.05, null, i * 0.06)); } },
  awaken()      { if (sfxReady('awaken', 1)) { tone(55, 1.1, 'sawtooth', 0.14, 45); tone(58, 1.1, 'sawtooth', 0.1, 40); } },
  bossDown()    { if (!sfxReady('bossDown')) return; boom(1.2); [392, 523, 659, 784].forEach((f, i) => tone(f, 0.45, 'triangle', 0.12, null, 0.3 + i * 0.12)); },
  scroll()      { if (sfxReady('scroll')) [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.5, 'sine', 0.1, null, i * 0.08)); },
  discover()    { if (sfxReady('discover')) [784, 1175].forEach((f, i) => tone(f, 0.35, 'triangle', 0.1, null, i * 0.1)); },
  splash()      { if (sfxReady('splash')) { hiss(0.5, 0.2, 'lowpass', 2000, 300); tone(300, 0.2, 'sine', 0.06, 150); } },
  death()       { if (sfxReady('death')) [392, 330, 262, 196].forEach((f, i) => tone(f, 0.4, 'triangle', 0.12, null, i * 0.18)); },
};
function boom(dur) { tone(90, dur, 'sine', 0.4, 28); hiss(dur, 0.3, 'lowpass', 900, 60); }

function toggleSound() {
  sfx.on = !sfx.on;
  try { localStorage.setItem('pentagram-sound', sfx.on ? 'on' : 'off'); } catch (_) {}
  audioInit();
  castMessage(sfx.on ? 'Sound on' : 'Sound off', '#ccc');
}

// ── helpers ──────────────────────────────────────────────────────────────────
function rnd(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function fmt(v) { return (Math.round(v * 10) / 10).toString(); }

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

// ── layout ───────────────────────────────────────────────────────────────────
let W = 0, H = 0, DPR = 1;
let panelTop = 0;
const PENT = { cx: 0, cy: 0, R: 0, S: 0, slot: 0, slotY: 0, msgY: 0 };

// Size to the body, not the window: embedded views can start at 0×0 and
// grow later, and the body excludes any safe-area padding on phones.
function viewSize() {
  const b = document.body;
  return {
    w: (b && b.clientWidth)  || window.innerWidth  || 0,
    h: (b && b.clientHeight) || window.innerHeight || 0,
  };
}

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const v = viewSize();
  W = v.w;
  H = v.h;
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  const R = Math.max(60, Math.min(W * 0.3, H * 0.14, 130));
  PENT.R  = R;
  PENT.S  = R * 0.42;
  PENT.cx = W / 2;
  PENT.cy = H - R * 0.81 - PENT.S / 2 - 18;
  PENT.slot  = Math.min(28, (W - 40) / 8);
  PENT.slotY = PENT.cy - R - PENT.S / 2 - 16 - PENT.slot / 2;
  PENT.msgY  = PENT.slotY - PENT.slot / 2 - 16;
  panelTop   = PENT.msgY - 18;
}
window.addEventListener('resize', resize);
if (window.ResizeObserver) new ResizeObserver(resize).observe(document.body);
resize();

function nodePos(i) {
  const a = -Math.PI / 2 + i * TAU / 5;
  return { x: PENT.cx + Math.cos(a) * PENT.R, y: PENT.cy + Math.sin(a) * PENT.R };
}
function nodeAt(x, y) {
  const half = PENT.S * 0.62;
  for (let i = 0; i < 5; i++) {
    const p = nodePos(i);
    if (Math.abs(x - p.x) < half && Math.abs(y - p.y) < half) return i;
  }
  return null;
}
function inCastZone(x, y) {
  return Math.hypot(x - PENT.cx, y - PENT.cy) < PENT.R * 1.45 ||
         (y > panelTop && Math.abs(x - PENT.cx) < PENT.R * 1.6);
}
function playerScreenY() { return panelTop * 0.5; }

// wobbly shoreline so the lake isn't a perfect ellipse
function lakeRadiusScale(a) { return 1 + 0.06 * Math.sin(3 * a) + 0.04 * Math.sin(5 * a + 1); }
function inLake(x, y) {
  const dx = (x - LAKE.x) / LAKE.rx, dy = (y - LAKE.y) / LAKE.ry;
  const s = lakeRadiusScale(Math.atan2(dy, dx));
  return dx * dx + dy * dy < s * s;
}
function isWater(x, y) {
  if (!inLake(x, y)) return false;
  for (const i of ISLANDS) if (Math.hypot(x - i.x, y - i.y) < i.r) return false;
  return true;
}
// point on the shore in a given direction from the lake centre
function shorePoint(dirX, dirY, inset) {
  const a = Math.atan2(dirY / LAKE.ry, dirX / LAKE.rx);
  const s = lakeRadiusScale(a) * inset;
  return { x: LAKE.x + Math.cos(a) * LAKE.rx * s, y: LAKE.y + Math.sin(a) * LAKE.ry * s };
}
// the dock faces the shrine

const walls = [];   // axis-aligned rectangles
const solids = [];  // circles: trees, rocks, towers
for (const c of CASTLES) {
  const { x, y, h, t } = c;
  // each side is a full wall, or two halves around a centred gate
  const side = (key, rx, ry, w, hh, horizontal) => {
    const gap = c.gates[key];
    if (!gap) { walls.push({ x: rx, y: ry, w, h: hh }); return; }
    if (horizontal) {
      const half = (w - gap) / 2;
      walls.push({ x: rx, y: ry, w: half, h: hh }, { x: rx + half + gap, y: ry, w: half, h: hh });
    } else {
      const half = (hh - gap) / 2;
      walls.push({ x: rx, y: ry, w, h: half }, { x: rx, y: ry + half + gap, w, h: half });
    }
  };
  side('N', x - h, y - h, 2 * h, t, true);
  side('S', x - h, y + h - t, 2 * h, t, true);
  side('W', x - h, y - h, t, 2 * h, false);
  side('E', x + h - t, y - h, t, 2 * h, false);

}
function inCastle(x, y, pad) {
  return CASTLES.some(c => Math.abs(x - c.x) < c.h + pad && Math.abs(y - c.y) < c.h + pad);
}

// scenery, generated once
const deco = [];
(function makeScenery() {
  const R = mulberry32(1337);
  const clear = (x, y, r) => {
    if (Math.abs(x) > WORLD - 20 || Math.abs(y) > WORLD - 20) return false;
    if (Math.hypot(x, y) < 230) return false;
    if (BOSSES.some(b => Math.hypot(x - b.x, y - b.y) < 200 || Math.hypot(x - b.x, y - (b.y + b.r + 60)) < 90)) return false;
    if (inCastle(x, y, 70)) return false;

    if (dx * dx + dy * dy < 1.25) return false;

    return !solids.some(s => Math.hypot(x - s.x, y - s.y) < s.r + r + 36); // leave room to walk between
  };
  const addTree = (x, y, s) => {
    const r = 13 * s;

  };
  for (const f of FORESTS) {
    for (let i = 0; i < 260; i++) {
      const a = R() * TAU, d = Math.sqrt(R()) * f.r;
      addTree(f.x + Math.cos(a) * d, f.y + Math.sin(a) * d, 0.8 + R() * 0.6);
    }
  }
  for (let i = 0; i < 260; i++) {
    const x = (R() * 2 - 1) * WORLD, y = (R() * 2 - 1) * WORLD, k = R();
    if (k < 0.5) addTree(x, y, 0.7 + R() * 0.6);
    else if (clear(x, y, 10)) solids.push({ x, y, r: 9 * (0.8 + R() * 0.6), kind: 'rock' });
  }

    const x = (R() * 2 - 1) * WORLD, y = (R() * 2 - 1) * WORLD;
    if (!isWater(x, y)) deco.push({ x, y, kind: 'grass', s: 0.7 + R() * 0.7 });
  }

// spatial grid so collision checks only look at nearby solids
const GRID = 200;
const solidGrid = new Map();
for (const s of solids) {
  const k = Math.floor(s.x / GRID) + ',' + Math.floor(s.y / GRID);
  if (!solidGrid.has(k)) solidGrid.set(k, []);
  solidGrid.get(k).push(s);
}
function solidsNear(x, y) {
  const gx = Math.floor(x / GRID), gy = Math.floor(y / GRID), out = [];
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const list = solidGrid.get((gx + i) + ',' + (gy + j));
    if (list) out.push(...list);
  }
  return out;
}

function inWall(x, y) {
  return walls.some(w => x > w.x && x < w.x + w.w && y > w.y && y < w.y + w.h);
}

// shove a circle out of trees, rocks, towers and castle walls
function pushOut(e, r) {
  for (const s of solidsNear(e.x, e.y)) {
    const dx = e.x - s.x, dy = e.y - s.y, d = Math.hypot(dx, dy), min = s.r + r;
    if (d < min && d > 0) { e.x = s.x + dx / d * min; e.y = s.y + dy / d * min; }
  }
  for (const w of walls) {
    const px = clamp(e.x, w.x, w.x + w.w), py = clamp(e.y, w.y, w.y + w.h);
    const dx = e.x - px, dy = e.y - py, d = Math.hypot(dx, dy);
    if (d >= r) continue;
    if (d > 0) { e.x = px + dx / d * r; e.y = py + dy / d * r; continue; }
    // centre is inside the wall: leave by the shortest way out
    const l = e.x - w.x, rr = w.x + w.w - e.x, t = e.y - w.y, b = w.y + w.h - e.y, m = Math.min(l, rr, t, b);
    if (m === l) e.x = w.x - r; else if (m === rr) e.x = w.x + w.w + r;
    else if (m === t) e.y = w.y - r; else e.y = w.y + w.h + r;
  }
}

function blockedForFoot(x, y, r) {
  if (isWater(x, y)) return true;
  if (inWall(x, y)) return true;
  return solidsNear(x, y).some(s => Math.hypot(x - s.x, y - s.y) < s.r + r * 0.6);
}

// ── feedback helpers ─────────────────────────────────────────────────────────
function showBanner(text, sub, life) { banner = { text, sub, life, max: life }; }
function castMessage(text, color) { castMsg = { text, color, life: 1.6 }; }
function floatText(x, y, text, color, size) {

}
function burst(x, y, color, n, spd) {

    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, r: rnd(2, 5), life: 1, decay: rnd(1.4, 2.8), color });

function ring(x, y, r, color, life) { fx.push({ kind: 'ring', x, y, r, color, life: life || 0.35, max: life || 0.35 }); }

// ── targeting & damage ───────────────────────────────────────────────────────
function nearestFoe(x, y, range, exclude) {
  let best = null, bd = range;
  for (const f of foes) {
    if (f.dead || (exclude && exclude.has(f))) continue;
    const d = Math.hypot(f.x - x, f.y - y) - f.r;
    if (d < bd) { bd = d; best = f; }
  }
  return best;
}

function aimFrom(src, range) {
  const t = nearestFoe(src.x, src.y, range || 600);
  if (t) {
    const dx = t.x - src.x, dy = t.y - src.y, d = Math.hypot(dx, dy) || 1;
    return { x: dx / d, y: dy / d, t };
  }
  return { x: player.face.x, y: player.face.y, t: null };
}

function damageFoe(f, dmg, type) {
  if (f.dead) return;
  let mult = 1;
  if (f.boss) {
    if (!f.def.weak.includes(type)) {
      SFX.immune();
      if (f.txtCd <= 0) { floatText(f.x, f.y - f.r - 10, 'IMMUNE', '#999', 15); f.txtCd = 0.6; }
      ring(f.x, f.y, f.r + 6, 'rgba(200,200,200,0.6)', 0.2);
      return;
    }
  } else {
    mult = f.def.mult[type] ?? 1;
  }
  if (player.empower > 0) mult *= 2;
  const d = dmg * mult;
  f.hp -= d;
  if (type !== 'poison') SFX.hit();
  f.flash = 0.12;
  const weak = f.boss || mult > 1.01;
  floatText(f.x + rnd(-8, 8), f.y - f.r - 6, fmt(d) + (weak && !f.boss ? '!' : ''),
            weak ? '#ffe14a' : mult < 0.99 ? '#aaa' : '#fff', weak ? 17 : 13);
  if (f.hp <= 0) killFoe(f);
}

function killFoe(f) {
  f.dead = true;
  f.boss ? SFX.bossDown() : SFX.kill();
  kills++;
  burst(f.x, f.y, f.boss ? f.def.color : f.def.color, f.boss ? 70 : 14, f.boss ? 420 : 260);
  if (f.boss) {
    bossesDown++;
    shake = 14;
    showBanner(`${f.def.name} is defeated!`, 'Its chest is unsealed', 4);
  }
}

function knock(f, fromX, fromY, force) {
  const dx = f.x - fromX, dy = f.y - fromY, d = Math.hypot(dx, dy) || 1;
  const k = f.boss ? 0.15 : 1;
  f.kx += dx / d * force * k;
  f.ky += dy / d * force * k;
}

function aoe(x, y, rad, dmg, type, push) {
  for (const f of foes) {
    if (f.dead) continue;
    if (Math.hypot(f.x - x, f.y - y) < rad + f.r) {
      damageFoe(f, dmg, type);
      if (push) knock(f, x, y, push);
    }
  }
  ring(x, y, rad, TYPE_COLOR[type], 0.4);
}

function hurtPlayer(d) {
  if (state !== 'play' || player.invuln > 0 || player.omni > 0) return;
  if (player.ward > 0) {
    player.ward--;
    SFX.block();
    player.invuln = 0.3;
    ring(player.x, player.y, 30, TYPE_COLOR.spirit, 0.3);
    floatText(player.x, player.y - 30, 'blocked', TYPE_COLOR.spirit, 14);
    return;
  }
  if (player.skin > 0) d *= 0.5;
  player.hp -= d;
  SFX.hurt();
  player.invuln = 0.5;
  shake = Math.max(shake, 6);
  burst(player.x, player.y, '#f44', 8, 180);
  floatText(player.x, player.y - 30, '-' + fmt(d), '#f55', 16);
  if (player.hp <= 0) {

    state = 'dead';
    SFX.death();
    overlayT = 0;
    seq = []; castPtr = null; finger = null;

}

  });

function chainLightning(dmg, jumps) {
  let cur = nearestFoe(player.x, player.y, 450);
  if (!cur) { castMessage('No target in range', '#8ff'); return; }
  SFX.lightning();
  const pts = [{ x: player.x, y: player.y }];
  const hit = new Set();
  for (let i = 0; i < jumps && cur; i++) {
    hit.add(cur);
    pts.push({ x: cur.x, y: cur.y });
    damageFoe(cur, dmg, 'lightning');
    cur = nearestFoe(cur.x, cur.y, 230, hit);

  fx.push({ kind: 'bolt', pts, life: 0.3, max: 0.3 });
}

function targetPoint(range, ahead) {
  const t = nearestFoe(player.x, player.y, range);
  if (t) return { x: t.x, y: t.y };
  return { x: player.x + player.face.x * ahead, y: player.y + player.face.y * ahead };
}

// Crown of All: invulnerable, and fires bolts that cycle through every damage type.
const OMNI_TYPES = ['fire', 'water', 'earth', 'air', 'lightning', 'poison', 'spirit', 'holy'];
function omniFire(dt) {
  if (player.omni <= 0) return;
  player.omniCd -= dt;
  if (player.omniCd > 0) return;
  player.omniCd = 0.15;
  const type = OMNI_TYPES[player.omniIdx++ % OMNI_TYPES.length];

function updateStorms(dt) {
  for (const s of storms) {
    s.t -= dt;
    if (s.t > 0) continue;
    s.t = 0.2;
    s.left--;
    const near = foes.filter(f => !f.dead && Math.hypot(f.x - player.x, f.y - player.y) < 480);
    if (!near.length) continue;
    const f = near[Math.floor(Math.random() * near.length)];
    damageFoe(f, 7, 'lightning');
    SFX.lightning();
    fx.push({ kind: 'bolt', pts: [{ x: f.x + rnd(-40, 40), y: f.y - 420 }, { x: f.x, y: f.y }], life: 0.25, max: 0.25 });
    burst(f.x, f.y, TYPE_COLOR.lightning, 10, 220);
    shake = Math.max(shake, 4);
  }
  storms = storms.filter(s => s.left > 0);

const ALLY_LIFE = { wisp: 20, imp: 18, golem: 30, dragon: 30 };
const ALLY_R = { wisp: 9, imp: 9, golem: 18, dragon: 26 };
function summon(kind) {

                life: ALLY_LIFE[kind], max: ALLY_LIFE[kind], cd: 0.4, ang: a, r: ALLY_R[kind] });
  burst(player.x + Math.cos(a) * 40, player.y + Math.sin(a) * 40, kind === 'dragon' ? '#ff5a2a' : '#fff', kind === 'dragon' ? 50 : 16, 260);

function castSequence() {
  if (!seq.length) return;
  const key = seq.join('');
  const sp = SPELLS[key];
  seq = [];
  if (!sp) {
    player.mana = Math.max(0, player.mana - 1);
    castMessage('…fizzle', '#888');
    SFX.fizzle();
    burst(player.x, player.y, '#777', 10, 120);
    return;
  }
  if (player.mana < sp.cost) { castMessage('Not enough mana', '#6af'); return; }
  player.mana -= sp.cost;
  const tier = key.length;
  castMessage(tier >= 4 ? `${sp.name} · ${TIERS[tier]}` : sp.name, TIER_COLOR[tier]);
  burst(player.x, player.y, ELEMENTS[key[tier - 1]].color, 6 * tier, 100 + 50 * tier);
  if (isAttack(sp)) {
    // attacks load onto the FIRE button; weaving a new one replaces the old
    player.loaded = { key, left: TIER_SHOTS[tier] };
    castMessage(`${sp.name} ×${TIER_SHOTS[tier]} · tap FIRE`, TIER_COLOR[tier]);
    SFX.weave(key); SFX.loaded();
  } else {
    if (tier >= 4) shake = Math.max(shake, (tier - 3) * 4);
    SFX.weave(key);
    (sp.kind === 'heal' ? SFX.heal : sp.kind === 'summon' ? SFX.summon : SFX.buff)();
    sp.cast();
  }
  if (!discovered.has(key)) {
    discovered.add(key);
    SFX.discover();
    showBanner(tier >= 5 ? `${TIERS[tier].toUpperCase()} SPELL!` : 'New spell discovered!',
               `${sp.name} · tier ${tier} ${TIERS[tier]} · ${sp.kind}`, tier >= 5 ? 4 : 3);
  }
}

// Press FIRE: quick spells go instantly, strong ones root you while they charge.
function fireLoaded() {
  const L = player.loaded;
  if (!L || player.charging || state !== 'play') return;
  const tier = L.key.length;
  L.left--;
  if (L.left <= 0) player.loaded = null;
  const windup = TIER_WINDUP[tier];
  if (windup > 0) { player.charging = { key: L.key, t: windup, max: windup }; SFX.charge(tier, windup); }
  else releaseSpell(L.key);
}

function releaseSpell(key) {
  SFX.release(key);
  const tier = key.length;
  if (tier >= 4) shake = Math.max(shake, (tier - 3) * 4);
  burst(player.x, player.y, TIER_COLOR[tier], 4 * tier, 80 + 40 * tier);

}

function shootArrow(wx, wy) {
  if (player.arrowCd > 0 || player.charging) return;
  player.arrowCd = 0.3;
  SFX.arrow();
  const dx = wx - player.x, dy = wy - player.y, d = Math.hypot(dx, dy) || 1;
  player.face = { x: dx / d, y: dy / d };
  launch(player.x, player.y, player.face, { dmg: 1, type: 'arrow', speed: 720, r: 5, life: 0.9 });
}

// ── update ───────────────────────────────────────────────────────────────────
function moveToward(e, tx, ty, spd, dt, stop) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  if (d <= stop || d === 0) return d;
  const step = Math.min(spd * dt, d - stop);
  e.x += dx / d * step;
  e.y += dy / d * step;
  return d;
}

function pickFoeKind(x, y) {
  const r = Math.random();
  for (const b of BOSSES) {
    if (Math.hypot(x - b.x, y - b.y) < 600 && r < 0.5) return b.minion;
  }
  const d = Math.hypot(x, y);
  if (d < 600)  return r < 0.65 ? 'slime' : 'bat';
  if (d < 1100) return r < 0.35 ? 'slime' : r < 0.6 ? 'bat' : r < 0.85 ? 'skeleton' : 'ember';
  return ['bat', 'skeleton', 'ember', 'shade', 'shade'][Math.floor(r * 5)];
}

function spawnFoes(dt) {
  spawnTimer -= dt;
  if (spawnTimer > 0) return;
  spawnTimer = Math.max(0.5, 1.4 - elapsed / 300);
  const cap = Math.min(24, 6 + Math.floor(elapsed / 25));
  if (foes.filter(f => !f.boss && !f.dead).length >= cap) return;
  const a = rnd(0, TAU), d = rnd(520, 760);
  const x = clamp(player.x + Math.cos(a) * d, -WORLD, WORLD);
  const y = clamp(player.y + Math.sin(a) * d, -WORLD, WORLD);
  if (Math.hypot(x, y) < 220) return;
  const kind = pickFoeKind(x, y);
  if ((kind !== 'bat' && isWater(x, y)) || blockedForFoot(x, y, 16)) return;
  foes.push(makeFoe(kind, x, y));
}

function bossAttack(b) {
  const col = b.def.color;
  if (b.def.attack === 'ring') {
    for (let i = 0; i < b.def.shots; i++) {
      const a = i / b.def.shots * TAU + elapsed;
      enemyShots.push({ x: b.x, y: b.y, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220, r: 8, dmg: b.def.dmg * 0.5, life: 3, color: col });
    }
    return;
  }
  const base = Math.atan2(player.y - b.y, player.x - b.x);
  const n = b.def.shots;
  for (let i = 0; i < n; i++) {
    const a = base + (i - (n - 1) / 2) * 0.22;
    enemyShots.push({ x: b.x, y: b.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, r: 8, dmg: b.def.dmg * 0.5, life: 3, color: col });
  }
}

function updateBoss(b, dt, dp) {
  const home = Math.hypot(b.def.x - b.x, b.def.y - b.y);
  if (!b.aggro && dp < 380) {
    b.aggro = true;
    b.shotCd = 1.2;
    showBanner(b.def.name, 'awakens', 2);
    SFX.awaken();
  }
  if (b.aggro && (dp > 700 || home > 900)) b.aggro = false;

  if (b.aggro) {
    moveToward(b, player.x, player.y, b.spd * (b.slow > 0 ? 0.6 : 1), dt, b.r + PLAYER_R - 4);
    b.shotCd -= dt;
    if (b.shotCd <= 0) { b.shotCd = b.def.rate; bossAttack(b); }
    if (b.def.summon) {
      b.summonCd -= dt;
      if (b.summonCd <= 0) {
        b.summonCd = 7;
        for (let i = 0; i < 2; i++) spawnQueue.push(makeFoe(b.def.summon, b.x + rnd(-70, 70), b.y + rnd(-70, 70)));
        ring(b.x, b.y, b.r + 40, b.def.color, 0.5);
      }
    }
  } else {
    moveToward(b, b.def.x, b.def.y, b.spd, dt, 2);
    b.hp = Math.min(b.maxHp, b.hp + b.maxHp * 0.08 * dt);
  }
}

function updateFoes(dt) {
  for (const f of foes) {
    if (f.dead) continue;
    f.flash = Math.max(0, f.flash - dt);
    f.hitCd -= dt; f.slow -= dt; f.txtCd -= dt;
    if (f.poison > 0) {
      f.poison -= dt;
      f.poisonTick -= dt;
      if (f.poisonTick <= 0) { f.poisonTick = 0.5; damageFoe(f, f.poisonDps * 0.5, 'poison'); }
      if (f.dead) continue;
    }
    if (f.freeze > 0) { f.freeze -= dt; continue; } // frozen solid: no moving, biting or shooting
    const dp = Math.hypot(player.x - f.x, player.y - f.y);
    const px = f.x, py = f.y;
    if (f.boss) {
      updateBoss(f, dt, dp);
    } else {
      if (dp > 1300) { f.dead = true; continue; }
      const spd = f.spd * (f.slow > 0 ? 0.5 : 1);
      moveToward(f, player.x, player.y, spd, dt, f.r + PLAYER_R - 2);
      if (f.kind === 'bat') { f.x += Math.cos(elapsed * 7 + f.wob) * 40 * dt; f.y += Math.sin(elapsed * 9 + f.wob) * 40 * dt; }
    }
    f.x += f.kx * dt; f.y += f.ky * dt;
    const damp = Math.max(0, 1 - 7 * dt);
    f.kx *= damp; f.ky *= damp;
    f.x = clamp(f.x, -WORLD, WORLD); f.y = clamp(f.y, -WORLD, WORLD);
    if (f.kind !== 'bat') {
      if (isWater(f.x, f.y)) { f.x = px; f.y = py; } // only bats fly over the lake
      pushOut(f, f.r);
    }

    if (dp < f.r + PLAYER_R + 2 && f.hitCd <= 0) {
      hurtPlayer(f.def.dmg);
      f.hitCd = 1;
      knock(f, player.x, player.y, 160);
    }
  }

  // keep regular foes from piling onto one spot
  const live = foes.filter(f => !f.dead && !f.boss);
  for (let i = 0; i < live.length; i++) {
    for (let j = i + 1; j < live.length; j++) {
      const a = live[i], b = live[j];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy), min = a.r + b.r;
      if (d > 0 && d < min) {
        const push = (min - d) / 2;
        a.x -= dx / d * push; a.y -= dy / d * push;
        b.x += dx / d * push; b.y += dy / d * push;
      }
    }
  }

  if (spawnQueue.length) { foes.push(...spawnQueue); spawnQueue = []; }
  foes = foes.filter(f => !f.dead || f.boss);
}

function updateShots(dt) {
  for (const s of shots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (inWall(s.x, s.y)) { s.life = 0; burst(s.x, s.y, '#999', 4, 100); continue; }
    for (const f of foes) {
      if (s.life <= 0) break;
      if (f.dead || s.hit.has(f)) continue;
      if (Math.hypot(f.x - s.x, f.y - s.y) < s.r + f.r) {
        s.hit.add(f);
        damageFoe(f, s.dmg, s.type);
        if (s.fx === 'slow') f.slow = 2.5;
        if (s.fx === 'poison') { f.poison = Math.max(f.poison, 3); f.poisonDps = Math.max(f.poisonDps, 0.6); }
        if (s.fx === 'explode') { SFX.explode(false); aoe(s.x, s.y, s.boomR, s.boom, s.type, 120); burst(s.x, s.y, s.color, 22, 300); }
        else burst(s.x, s.y, s.color, 5, 140);
        if (s.pierce-- <= 0) s.life = 0;
      }
    }
  }
  shots = shots.filter(s => s.life > 0);

  for (const s of enemyShots) {
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;
    if (inWall(s.x, s.y)) { s.life = 0; continue; }
    if (Math.hypot(player.x - s.x, player.y - s.y) < s.r + PLAYER_R) { hurtPlayer(s.dmg); s.life = 0; }
  }
  enemyShots = enemyShots.filter(s => s.life > 0);
}

function updateAllies(dt) {
  for (const a of allies) {
    a.life -= dt; a.cd -= dt;
    if (a.kind === 'wisp') {
      a.ang += 2.2 * dt;
      moveToward(a, player.x + Math.cos(a.ang) * 42, player.y + Math.sin(a.ang) * 42, 400, dt, 0);
      if (a.cd <= 0) {
        const t = nearestFoe(a.x, a.y, 420);
        if (t) { launch(a.x, a.y, aimFrom(a, 420), { dmg: 1, type: 'spirit', speed: 520, r: 5 }); a.cd = 0.7; }
      }
    } else if (a.kind === 'imp') {
      moveToward(a, player.x - player.face.x * 34 + 20, player.y - player.face.y * 34 - 18, 300, dt, 4);
      if (a.cd <= 0) {
        const t = nearestFoe(a.x, a.y, 450);
        if (t) { launch(a.x, a.y, aimFrom(a, 450), { dmg: 1.5, type: 'fire', speed: 480, r: 6 }); a.cd = 0.9; }
      }
    } else if (a.kind === 'golem') {
      const t = nearestFoe(a.x, a.y, 450);
      if (t) {
        const d = moveToward(a, t.x, t.y, 110, dt, a.r + t.r);
        if (d <= a.r + t.r + 8 && a.cd <= 0) {
          // ground slam: big hit on the target, splash around it
          aoe(t.x, t.y, 70, 3, 'earth', 200);
          damageFoe(t, 5, 'earth');
          knock(t, a.x, a.y, 320);
          shake = Math.max(shake, 3);
          a.cd = 0.9;
        }
      } else {
        moveToward(a, player.x, player.y, 130, dt, 55);
      }
    } else if (a.kind === 'dragon') {
      a.ang += 1.1 * dt;
      moveToward(a, player.x + Math.cos(a.ang) * 90, player.y + Math.sin(a.ang) * 60 - 40, 260, dt, 0);
      if (a.cd <= 0) {
        const t = nearestFoe(a.x, a.y, 600);
        if (t) {
          launch(a.x, a.y, aimFrom(a, 600), { dmg: 6, type: 'fire', speed: 560, r: 13, fx: 'explode', boom: 6, boomR: 120 });
          a.cd = 0.7;
        }
      }
    }
  }
  allies = allies.filter(a => {
    if (a.life > 0) return true;
    burst(a.x, a.y, '#aaa', 10, 120);
    return false;
  });
}

function updateEffects(dt) {
  for (const z of zones) {
    z.life -= dt; z.tick -= dt;
    if (z.tick <= 0) {
      z.tick = 0.5;
      for (const f of foes) {
        if (f.dead || Math.hypot(f.x - z.x, f.y - z.y) > z.r + f.r) continue;
        if (z.type === 'fire') { damageFoe(f, 1.5, 'fire'); continue; } // meteor crater
        damageFoe(f, 0.6, 'poison');
        f.poison = Math.max(f.poison, 2);
        f.poisonDps = Math.max(f.poisonDps, 1);
      }
    }
  }
  zones = zones.filter(z => z.life > 0);

  for (const w of waves) {
    w.r += w.speed * dt;
    for (const f of foes) {
      if (f.dead || w.hit.has(f)) continue;
      if (Math.abs(Math.hypot(f.x - w.x, f.y - w.y) - w.r) < f.r + 14) {
        w.hit.add(f);
        damageFoe(f, w.dmg, w.type);
        knock(f, w.x, w.y, 340);
      }
    }
  }
  waves = waves.filter(w => w.r < w.maxR);

  for (const m of meteors) {
    m.t -= dt;
    if (m.t <= 0) {
      aoe(m.x, m.y, 200, 25, 'fire', 380);
      SFX.explode(true);
      zones.push({ x: m.x, y: m.y, r: 140, life: 4, max: 4, tick: 0, type: 'fire' });
      burst(m.x, m.y, '#ff5a2a', 80, 560);
      burst(m.x, m.y, '#ffd24a', 40, 340);
      shake = Math.max(shake, 20);
      flash = Math.max(flash, 0.35);
    }
  }
  meteors = meteors.filter(m => m.t > 0);

  for (const e of fx) e.life -= dt;
  fx = fx.filter(e => e.life > 0);

  for (const p of particles) {
    p.x += p.vx * dt; p.y += p.vy * dt;
    const damp = Math.max(0, 1 - 4 * dt);
    p.vx *= damp; p.vy *= damp;
    p.life -= p.decay * dt;
  }
  particles = particles.filter(p => p.life > 0);

  for (const t of floaters) { t.y -= 40 * dt; t.life -= dt; }
  floaters = floaters.filter(t => t.life > 0);
}

function showScroll(combo, title) {
  SFX.scroll();
  state = 'reveal';
  reveal = { combo, name: SPELLS[combo].name, title, t: 0 };
  movePtr = null; movePos = null; moveStart = null;
  castPtr = null; finger = null; seq = [];
  player.charging = null;
}
function openChest(c) {
  c.opened = true;
  showScroll(c.boss.def.reward, 'AN ANCIENT SCROLL');
}

function closeReveal() {
  reveal = null;
  if (bossesDown === BOSSES.length && !wonShown) {
    wonShown = true;
    state = 'won';
    overlayT = 0;
  } else {
    state = 'play';
  }
}

function update(dt) {
  elapsed += dt;

  // movement: keyboard + held pointer on the field
  let mx = 0, my = 0;
  if (keys.KeyW || keys.ArrowUp)    my -= 1;
  if (keys.KeyS || keys.ArrowDown)  my += 1;
  if (keys.KeyA || keys.ArrowLeft)  mx -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  // a held finger only walks once it's clearly a hold or a drag, not a tap
  if (movePos && moveStart && (moveStart.moved || performance.now() - moveStart.t > 180)) {
    const dx = movePos.x - W / 2, dy = movePos.y - playerScreenY(), d = Math.hypot(dx, dy);
    if (d > 14) { mx += dx / d; my += dy / d; }
  }
  const t = tiltVector();
  mx += t.x; my += t.y;
  // analog: a gentle tilt walks slowly, anything else is capped at full speed
  let ml = Math.hypot(mx, my);
  player.moving = ml > 0.02 && !player.charging; // charging a big spell roots you
  if (player.moving) {
    mx /= ml; my /= ml;
    ml = Math.min(1, ml);
    movePlayer(mx, my, (player.onBoat ? 230 : 170) * ml * (player.haste > 0 ? 1.6 : 1) * dt);
    player.face = { x: mx, y: my };
    if (player.haste > 0 && Math.random() < 0.5) {
      particles.push({ x: player.x, y: player.y + 10, vx: 0, vy: 0, r: 3, life: 0.6, decay: 2, color: TYPE_COLOR.air });
    }
  }

  // board the boat by walking into it
  player.boardCd = Math.max(0, player.boardCd - dt);
  if (!player.onBoat && player.boardCd <= 0 && dist(player, boat) < 52) {
    player.onBoat = true;
    player.x = boat.x; player.y = boat.y;
    castMessage('All aboard! Sail to land to step off', '#bfe6ff');
    SFX.splash();
  }

  if (player.charging) {
    player.charging.t -= dt;
    if (player.charging.t <= 0) { const k = player.charging.key; player.charging = null; releaseSpell(k); }
  }
  player.arrowCd = Math.max(0, player.arrowCd - dt);

  player.invuln  = Math.max(0, player.invuln - dt);
  player.skin    = Math.max(0, player.skin - dt);
  player.haste   = Math.max(0, player.haste - dt);
  player.empower = Math.max(0, player.empower - dt);
  player.mana    = Math.min(player.maxMana, player.mana + 2.2 * dt);
  if (Math.hypot(player.x, player.y) < SHRINE_R) {
    player.hp   = Math.min(player.maxHp, player.hp + 3 * dt);
    player.mana = Math.min(player.maxMana, player.mana + 3 * dt);
  }

  spawnFoes(dt);
  updateFoes(dt);
  updateShots(dt);
  updateAllies(dt);
  updateStorms(dt);
  omniFire(dt);
  player.omni = Math.max(0, player.omni - dt);
  updateEffects(dt);

  for (const c of chests) {
    if (!c.opened && c.boss.dead && state === 'play' && dist(c, player) < 44) openChest(c);
  }
  for (const sc of scrolls) {
    if (!sc.taken && state === 'play' && dist(sc, player) < 34) {
      sc.taken = true;
      showScroll(sc.combo, 'A LOST SCROLL');
    }
  }
}

// Walk (or sail) one step, sliding along obstacles.
function movePlayer(dx, dy, step) {
  const nx = clamp(player.x + dx * step, -WORLD, WORLD);
  const ny = clamp(player.y + dy * step, -WORLD, WORLD);
  if (player.onBoat) {
    // the boat stays on water; steering into land steps you ashore
    const ahead = { x: nx + dx * 14, y: ny + dy * 14 };
    if (isWater(ahead.x, ahead.y)) {
      player.x = boat.x = nx; player.y = boat.y = ny;
      return;
    }
    // step ashore straight ahead, or a little to either side if that spot is taken
    const base = Math.atan2(dy, dx);
    for (const off of [0, 0.4, -0.4, 0.8, -0.8]) {
      for (const reach of [36, 50]) {
        const lx = player.x + Math.cos(base + off) * reach, ly = player.y + Math.sin(base + off) * reach;
        if (blockedForFoot(lx, ly, PLAYER_R)) continue;
        player.onBoat = false;
        player.boardCd = 1.2;
        player.x = lx; player.y = ly;
        return;
      }
    }
    return;
  }
  // on foot: no wading into the lake; slide along one axis if the other is blocked
  if (!isWater(nx, ny)) { player.x = nx; player.y = ny; }
  else if (!isWater(nx, player.y)) player.x = nx;
  else if (!isWater(player.x, ny)) player.y = ny;
  pushOut(player, PLAYER_R);
}

// ── tilt steering ────────────────────────────────────────────────────────────
// Walk by tilting the phone. Whatever angle you hold it at when tilt starts
// (or when you tap the tilt label) counts as "level".
const TILT_DEAD = 4, TILT_FULL = 18; // degrees
const tilt = { asked: false, listening: false, raw: null, base: null, startedAt: 0, warned: false };

function screenAngle() {
  const a = (screen.orientation && screen.orientation.angle) ?? window.orientation ?? 0;
  return ((a % 360) + 360) % 360;
}

function onOrient(e) {
  if (e.beta == null || e.gamma == null) return;
  const b = e.beta, g = e.gamma, a = screenAngle();
  // convert device axes into screen right (x) / screen down (y)
  let x, y;
  if (a === 90)       { x = b;  y = -g; }
  else if (a === 270) { x = -b; y = g; }
  else if (a === 180) { x = -g; y = -b; }
  else                { x = g;  y = b; }
  tilt.raw = { x, y };
  if (!tilt.base) tilt.base = { x, y };
}

function startTilt() {
  const D = window.DeviceOrientationEvent;
  if (!D) return;
  const listen = () => {
    if (!tilt.listening) window.addEventListener('deviceorientation', onOrient);
    tilt.listening = true;
    tilt.startedAt = performance.now();
    tilt.base = null;
  };
  // iOS asks the player first; this must run inside a tap
  if (typeof D.requestPermission === 'function') {
    D.requestPermission().then(r => { if (r === 'granted') listen(); }).catch(() => {});
  } else {
    listen();
  }
}

function levelTilt() { tilt.base = tilt.raw ? { ...tilt.raw } : null; }

function tiltVector() {
  if (!tilt.raw || !tilt.base) return { x: 0, y: 0 };
  const axis = v => {
    const m = Math.abs(v);
    return m < TILT_DEAD ? 0 : Math.sign(v) * Math.min(1, (m - TILT_DEAD) / (TILT_FULL - TILT_DEAD));
  };
  return { x: axis(tilt.raw.x - tilt.base.x), y: axis(tilt.raw.y - tilt.base.y) };
}

function fireButton() {
  const r = Math.max(28, Math.min(36, W * 0.085));
  return { x: W - 16 - r, y: H - 16 - r, r };
}
function fireButtonHit(x, y) {
  if (!player.loaded) return false;
  const b = fireButton();
  return Math.hypot(x - b.x, y - b.y) < b.r + 8;
}

function soundRect() {
  const s = Math.min(110, W * 0.26);
  return { x: W - s - 12, y: 12 + s + 4 + (isTouch ? 28 : 0), w: s, h: 24 };
}
function soundHit(x, y) {
  const r = soundRect();
  return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
}

const isTouch = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
function tiltLabelRect() {
  const s = Math.min(110, W * 0.26);
  return { x: W - s - 12, y: 12 + s + 4, w: s, h: 24 };
}
function tiltLabelHit(x, y) {
  if (!isTouch) return false;
  const r = tiltLabelRect();
  return x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h;
}

// ── input ─────────────────────────────────────────────────────────────────────
function castMove(x, y) {
  finger = { x, y };
  const n = nodeAt(x, y);
  if (n !== curNode) {
    curNode = n;
    if (n !== null && seq.length < MAX_SEQ) {
      seq.push(NODE_ORDER[n]);
      nodePulse[n] = 1;
      SFX.node(NODE_ORDER[n], seq.length);
    }
  }
}

function tapOverlay() {
  if (state === 'title') { startGame(); return true; }
  if (state === 'dead')  { if (overlayT > 0.8) respawn(); return true; }
  if (state === 'won')   { if (overlayT > 1.0) state = 'play'; return true; }
  if (state === 'reveal') { if (reveal.t > 1.2) closeReveal(); return true; }
  return false;
}

function localPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  audioInit();
  if (tapOverlay()) return;
  const { x, y } = localPos(e);
  if (soundHit(x, y)) { toggleSound(); return; }
  if (tiltLabelHit(x, y)) {
    if (tilt.raw) { levelTilt(); castMessage('Tilt levelled', '#ccc'); }
    else { tilt.asked = false; tilt.warned = false; } // try again on this tap's release
    return;
  }
  if (fireButtonHit(x, y)) { fireLoaded(); return; }
  if (castPtr === null && inCastZone(x, y)) {
    castPtr = e.pointerId;
    seq = [];
    curNode = null;
    castMove(x, y);
  } else if (movePtr === null) {
    movePtr = e.pointerId;
    movePos = { x, y };
    moveStart = { x, y, t: performance.now(), moved: false };
  }
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
});

canvas.addEventListener('pointermove', e => {
  if (e.pointerId === castPtr) { const p = localPos(e); castMove(p.x, p.y); }
  else if (e.pointerId === movePtr) {
    movePos = localPos(e);
    if (moveStart && Math.hypot(movePos.x - moveStart.x, movePos.y - moveStart.y) > 14) moveStart.moved = true;
  }
});

function endPointer(e, cancelled) {
  if (e.pointerId === castPtr) {
    if (state === 'play' && !cancelled) castSequence();
    seq = []; castPtr = null; finger = null; curNode = null;
  }
  if (e.pointerId === movePtr) {
    // a quick tap on the field shoots an arrow at that spot
    if (!cancelled && state === 'play' && moveStart && !moveStart.moved && performance.now() - moveStart.t < 250) {
      shootArrow(player.x + moveStart.x - W / 2, player.y + moveStart.y - playerScreenY());
    }
    movePtr = null; movePos = null; moveStart = null;
  }
}

canvas.addEventListener('pointerup', e => {
  // a finished tap is what iOS accepts for the motion-sensor prompt
  if (isTouch && !tilt.asked) { tilt.asked = true; startTilt(); }
  endPointer(e, false);
});
canvas.addEventListener('pointercancel', e => endPointer(e, true));
canvas.addEventListener('contextmenu', e => e.preventDefault());

window.addEventListener('keydown', e => {
  audioInit();
  if (e.code === 'KeyM') toggleSound();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Backspace'].includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  const confirm = e.code === 'Space' || e.code === 'Enter';
  if (state !== 'play') { if (confirm) tapOverlay(); return; }
  const el = KEY_TO_EL[e.code];
  if (el && castPtr === null && seq.length < MAX_SEQ) {
    seq.push(el);
    nodePulse[NODE_ORDER.indexOf(el)] = 1;
  }
  if (confirm && castPtr === null) { if (seq.length) castSequence(); else fireLoaded(); }
  if (e.code === 'KeyF') fireLoaded();
  if ((e.code === 'Backspace' || e.code === 'Escape') && castPtr === null) seq = [];
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// ── drawing helpers ──────────────────────────────────────────────────────────
function circle(x, y, r, fill, stroke, lw) {
  ctx.beginPath();
  ctx.arc(x, y, r, 0, TAU);
  if (fill)   { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// Alchemical element symbols
function drawGlyph(el, x, y, s, color) {
  const h = s * 0.42;
  ctx.save();
  ctx.translate(x, y);
  ctx.strokeStyle = color;
  ctx.lineWidth = Math.max(1.5, s * 0.09);
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';
  ctx.beginPath();
  if (el === 'F' || el === 'A') {
    ctx.moveTo(0, -h); ctx.lineTo(h * 0.95, h * 0.72); ctx.lineTo(-h * 0.95, h * 0.72); ctx.closePath();
    if (el === 'A') { ctx.moveTo(-h * 0.85, h * 0.1); ctx.lineTo(h * 0.85, h * 0.1); }
  } else if (el === 'W' || el === 'E') {
    ctx.moveTo(0, h); ctx.lineTo(h * 0.95, -h * 0.72); ctx.lineTo(-h * 0.95, -h * 0.72); ctx.closePath();
    if (el === 'E') { ctx.moveTo(-h * 0.85, -h * 0.1); ctx.lineTo(h * 0.85, -h * 0.1); }
  } else {
    ctx.arc(0, 0, h * 0.85, 0, TAU);
    ctx.moveTo(h * 0.3, 0);
    ctx.arc(0, 0, h * 0.3, 0, TAU);
  }
  ctx.stroke();
  ctx.restore();
}

function wrapText(text, x, y, maxW, lineH) {
  const words = text.split(' ');
  let line = '';
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) {
      ctx.fillText(line, x, y);
      line = w;
      y += lineH;
    } else {
      line = test;
    }
  }
  if (line) { ctx.fillText(line, x, y); y += lineH; }
  return y;
}

// ── world rendering ──────────────────────────────────────────────────────────
function drawGround(camX, camY) {
  ctx.fillStyle = '#060509';
  ctx.fillRect(camX, camY, W, H);
  ctx.fillStyle = '#152018';
  ctx.fillRect(-WORLD, -WORLD, WORLD * 2, WORLD * 2);

  // each guardian's land is tinted with its own colour
  for (const b of BOSSES) {
    const g = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 480);
    g.addColorStop(0, b.color + '30');
    g.addColorStop(1, b.color + '00');
    ctx.fillStyle = g;
    ctx.fillRect(b.x - 480, b.y - 480, 960, 960);
  }

  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  const step = 80;
  const x0 = Math.floor(camX / step) * step, y0 = Math.floor(camY / step) * step;
  ctx.beginPath();
  for (let x = x0; x < camX + W + step; x += step) { ctx.moveTo(x, camY); ctx.lineTo(x, camY + H); }
  for (let y = y0; y < camY + H + step; y += step) { ctx.moveTo(camX, y); ctx.lineTo(camX + W, y); }
  ctx.stroke();

  ctx.strokeStyle = 'rgba(199,125,255,0.35)';
  ctx.lineWidth = 3;
  ctx.strokeRect(-WORLD, -WORLD, WORLD * 2, WORLD * 2);
}

function inView(x, y, pad, camX, camY) {
  return x > camX - pad && x < camX + W + pad && y > camY - pad && y < camY + H + pad;
}

function lakePath(grow) {
  ctx.beginPath();
  for (let i = 0; i <= 72; i++) {
    const a = i / 72 * TAU, k = lakeRadiusScale(a);
    const x = LAKE.x + Math.cos(a) * (LAKE.rx * k + grow), y = LAKE.y + Math.sin(a) * (LAKE.ry * k + grow);
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.closePath();
}

function drawLake(camX, camY) {
  if (!inView(LAKE.x, LAKE.y, Math.max(LAKE.rx, LAKE.ry) + 80, camX, camY)) return;
  lakePath(14); ctx.fillStyle = '#6b6044'; ctx.fill();          // muddy bank
  lakePath(0);  ctx.fillStyle = '#123a5c'; ctx.fill();
  lakePath(-40); ctx.fillStyle = '#0f3150'; ctx.fill();
  // drifting ripples
  ctx.strokeStyle = 'rgba(160,210,255,0.18)';
  ctx.lineWidth = 2;
  for (let i = 0; i < 40; i++) {
    const a = i * 2.39, d = 0.15 + (i * 0.618 % 0.8);
    const x = LAKE.x + Math.cos(a) * LAKE.rx * d + Math.sin(elapsed * 0.6 + i) * 10;
    const y = LAKE.y + Math.sin(a) * LAKE.ry * d;
    if (!isWater(x, y)) continue;
    ctx.beginPath(); ctx.moveTo(x - 10, y); ctx.quadraticCurveTo(x, y - 4, x + 10, y); ctx.stroke();
  }
  for (const i of ISLANDS) {
    circle(i.x, i.y, i.r + 8, 'rgba(230,210,150,0.35)');
    circle(i.x, i.y, i.r, '#c9b27a');
    circle(i.x + 6, i.y + 6, i.r * 0.7, '#8fa15a');
  }
  // dock
  const dx = DOCK.x - LAKE.x, dy = DOCK.y - LAKE.y, d = Math.hypot(dx, dy);
  ctx.save();
  ctx.translate(DOCK.x, DOCK.y);
  ctx.rotate(Math.atan2(dy / d, dx / d));
  ctx.fillStyle = '#7a5532';
  ctx.fillRect(-60, -14, 90, 28);
  ctx.strokeStyle = '#4e3520'; ctx.lineWidth = 2;
  for (let k = -55; k < 30; k += 12) { ctx.beginPath(); ctx.moveTo(k, -14); ctx.lineTo(k, 14); ctx.stroke(); }
  ctx.restore();
}

function drawBoat() {
  if (player.onBoat) return; // drawn under the player instead
  drawBoatAt(boat.x, boat.y, Math.atan2(LAKE.y - boat.y, LAKE.x - boat.x));
}
function drawBoatAt(x, y, ang) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(ang);
  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath(); ctx.ellipse(3, 5, 34, 15, 0, 0, TAU); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(36, 0); ctx.quadraticCurveTo(20, -16, -28, -13); ctx.lineTo(-30, 13); ctx.quadraticCurveTo(20, 16, 36, 0);
  ctx.fillStyle = '#8a5a2e'; ctx.fill();
  ctx.strokeStyle = '#4e3218'; ctx.lineWidth = 3; ctx.stroke();
  ctx.fillStyle = '#6b431f'; ctx.fillRect(-22, -9, 44, 18);
  ctx.restore();
}

function drawCastles(camX, camY) {
  for (const c of CASTLES) {
    if (!inView(c.x, c.y, c.h + 60, camX, camY)) continue;
    // flagstone courtyard
    ctx.fillStyle = 'rgba(120,115,110,0.22)';
    ctx.fillRect(c.x - c.h, c.y - c.h, c.h * 2, c.h * 2);
    ctx.strokeStyle = 'rgba(0,0,0,0.12)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for (let k = -c.h; k <= c.h; k += 40) { ctx.moveTo(c.x + k, c.y - c.h); ctx.lineTo(c.x + k, c.y + c.h); ctx.moveTo(c.x - c.h, c.y + k); ctx.lineTo(c.x + c.h, c.y + k); }
    ctx.stroke();
    ctx.fillStyle = '#ddd';
    ctx.font = 'bold 12px Georgia, serif';
    ctx.textAlign = 'center';
    ctx.fillText(c.name, c.x, c.y - c.h - 14);
  }
  for (const w of walls) {
    if (!inView(w.x + w.w / 2, w.y + w.h / 2, Math.max(w.w, w.h), camX, camY)) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.fillRect(w.x + 4, w.y + 5, w.w, w.h);
    ctx.fillStyle = '#6d6a66';
    ctx.fillRect(w.x, w.y, w.w, w.h);
    // crenellations
    ctx.fillStyle = '#86827c';
    const horiz = w.w > w.h, len = horiz ? w.w : w.h;
    for (let k = 4; k < len - 6; k += 16) {
      if (horiz) ctx.fillRect(w.x + k, w.y + 2, 8, w.h - 4);
      else ctx.fillRect(w.x + 2, w.y + k, w.w - 4, 8);
    }
  }
}

function drawSolids(camX, camY) {
  for (const d of solids) {
    if (!inView(d.x, d.y, 60, camX, camY)) continue;
    if (d.kind === 'tree') {
      circle(d.x + 4, d.y + 6, 22 * d.s, 'rgba(0,0,0,0.3)');
      circle(d.x, d.y, 22 * d.s, d.v < 0.5 ? '#1f3a24' : '#24422a');
      circle(d.x - 6 * d.s, d.y - 6 * d.s, 12 * d.s, '#2f5535');
    } else if (d.kind === 'rock') {
      circle(d.x, d.y, d.r * 1.15, '#3a3d44');
      circle(d.x - d.r * 0.3, d.y - d.r * 0.3, d.r * 0.5, '#4b4f58');
    } else if (d.kind === 'palm') {
      ctx.strokeStyle = '#7a5a30'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(d.x, d.y + 10); ctx.lineTo(d.x + 3, d.y - 10); ctx.stroke();
      ctx.fillStyle = '#3f8a3a';
      for (let i = 0; i < 5; i++) {
        const a = i * TAU / 5 + 0.3;
        ctx.beginPath(); ctx.ellipse(d.x + 3 + Math.cos(a) * 12, d.y - 10 + Math.sin(a) * 12, 13, 5, a, 0, TAU); ctx.fill();
      }
    } else if (d.kind === 'tower') {
      circle(d.x + 4, d.y + 6, d.r, 'rgba(0,0,0,0.3)');
      circle(d.x, d.y, d.r, '#6d6a66', '#4a4744', 3);
      circle(d.x, d.y, d.r * 0.6, '#86827c');
    }
  }
}

function drawGrass(camX, camY) {
  ctx.strokeStyle = '#2c4a2f';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (const d of deco) {
    if (!inView(d.x, d.y, 20, camX, camY)) continue;
    for (let i = -1; i <= 1; i++) { ctx.moveTo(d.x + i * 4, d.y + 5); ctx.lineTo(d.x + i * 6, d.y - 6 * d.s); }
  }
  ctx.stroke();
}

function drawScrolls() {
  for (const sc of scrolls) {
    if (sc.taken) continue;
    const y = sc.y - 6 + Math.sin(elapsed * 3 + sc.x) * 3;
    const g = ctx.createRadialGradient(sc.x, y, 0, sc.x, y, 40);
    g.addColorStop(0, 'rgba(255,230,150,0.45)'); g.addColorStop(1, 'rgba(255,230,150,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(sc.x, y, 40, 0, TAU); ctx.fill();
    ctx.fillStyle = '#efe0b8';
    ctx.fillRect(sc.x - 12, y - 8, 24, 16);
    circle(sc.x - 12, y, 8, '#d8c48f');
    circle(sc.x + 12, y, 8, '#d8c48f');
    ctx.fillStyle = '#a33'; ctx.fillRect(sc.x - 2, y - 8, 4, 16);
  }
}

function drawShrine() {
  const pulse = 0.5 + Math.sin(elapsed * 2) * 0.2;
  circle(0, 0, SHRINE_R, `rgba(199,125,255,${0.08 + pulse * 0.08})`, `rgba(199,125,255,${pulse})`, 2);
  ctx.strokeStyle = `rgba(199,125,255,${pulse * 0.8})`;
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i <= 5; i++) {
    const a = -Math.PI / 2 + ((i * 2) % 5) * TAU / 5;
    const x = Math.cos(a) * SHRINE_R * 0.9, y = Math.sin(a) * SHRINE_R * 0.9;
    i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
  }
  ctx.stroke();
}

function drawChest(c) {
  const { x, y } = c;
  const ready = c.boss.dead && !c.opened;
  if (ready) {
    const g = ctx.createRadialGradient(x, y, 0, x, y, 70);
    g.addColorStop(0, `rgba(255,220,90,${0.35 + Math.sin(elapsed * 4) * 0.15})`);
    g.addColorStop(1, 'rgba(255,220,90,0)');
    ctx.fillStyle = g;
    ctx.fillRect(x - 70, y - 70, 140, 140);
  }
  ctx.fillStyle = 'rgba(0,0,0,0.35)';
  ctx.fillRect(x - 19, y - 6, 42, 26);
  ctx.fillStyle = c.opened ? '#4a3420' : '#7a5230';
  ctx.fillRect(x - 22, y - 10, 44, 26);
  ctx.fillStyle = c.opened ? '#2a1c10' : '#8e6238';
  if (c.opened) ctx.fillRect(x - 22, y - 24, 44, 10);
  else ctx.fillRect(x - 22, y - 18, 44, 10);
  ctx.strokeStyle = '#d8b24a';
  ctx.lineWidth = 2;
  ctx.strokeRect(x - 22, y - 10, 44, 26);
  if (!c.boss.dead) {
    ctx.strokeStyle = '#888';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x - 24, y - 16); ctx.lineTo(x + 24, y + 18);
    ctx.moveTo(x + 24, y - 16); ctx.lineTo(x - 24, y + 18);
    ctx.stroke();
    ctx.fillStyle = '#aaa';
    ctx.fillRect(x - 6, y - 2, 12, 10);
  } else if (!c.opened) {
    ctx.fillStyle = '#ffd24a';
    ctx.font = 'bold 12px system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('open me', x, y - 30);
  }
}

function drawFoe(f) {
  const d = f.def, r = f.r, t = elapsed;
  ctx.save();
  ctx.translate(f.x, f.y);
  circle(3, r * 0.7, r * 0.8, 'rgba(0,0,0,0.25)');
  if (f.kind === 'slime') {
    const sq = Math.sin(t * 6 + f.wob) * 0.1;
    ctx.save(); ctx.scale(1 + sq, 1 - sq);
    ctx.beginPath(); ctx.ellipse(0, 2, r * 1.1, r * 0.9, 0, 0, TAU); ctx.fillStyle = d.color; ctx.fill();
    circle(-r * 0.35, -r * 0.25, r * 0.25, 'rgba(255,255,255,0.35)');
    ctx.restore();
    circle(-4, -1, 2.5, '#111'); circle(4, -1, 2.5, '#111');
  } else if (f.kind === 'bat') {
    const flap = Math.sin(t * 18 + f.wob) * 0.6;
    ctx.fillStyle = '#5a3a70';
    for (const s of [-1, 1]) {
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(s * r * 2, -r * (0.6 + flap));
      ctx.lineTo(s * r * 1.4, r * 0.4);
      ctx.closePath(); ctx.fill();
    }
    circle(0, 0, r * 0.75, d.color);
    circle(-3, -2, 2, '#ff4'); circle(3, -2, 2, '#ff4');
  } else if (f.kind === 'skeleton') {
    ctx.strokeStyle = '#bbb'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, r * 1.1);
    ctx.moveTo(-r * 0.7, r * 0.5); ctx.lineTo(r * 0.7, r * 0.5); ctx.stroke();
    circle(0, -r * 0.2, r * 0.8, d.color);
    circle(-4, -r * 0.3, 3, '#111'); circle(4, -r * 0.3, 3, '#111');
    ctx.fillStyle = '#111'; ctx.fillRect(-4, r * 0.15, 8, 2);
  } else if (f.kind === 'ember') {
    const fl = 1 + Math.sin(t * 14 + f.wob) * 0.12;
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2 * fl);
    g.addColorStop(0, 'rgba(255,140,40,0.5)'); g.addColorStop(1, 'rgba(255,80,20,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 2 * fl, 0, TAU); ctx.fill();
    ctx.beginPath(); ctx.moveTo(0, -r * 1.4 * fl); ctx.quadraticCurveTo(r, 0, 0, r); ctx.quadraticCurveTo(-r, 0, 0, -r * 1.4 * fl);
    ctx.fillStyle = d.color; ctx.fill();
    circle(0, r * 0.1, r * 0.45, '#ffd24a');
  } else if (f.kind === 'shade') {
    ctx.globalAlpha = 0.85;
    ctx.beginPath(); ctx.moveTo(-r, r);
    ctx.quadraticCurveTo(-r * 1.1, -r * 1.3, 0, -r * 1.2);
    ctx.quadraticCurveTo(r * 1.1, -r * 1.3, r, r);
    for (let i = 0; i < 4; i++) ctx.lineTo(r - (i + 0.5) * r / 2, r - (i % 2 ? 0 : 6) + Math.sin(t * 6 + i) * 2);
    ctx.closePath(); ctx.fillStyle = d.color; ctx.fill();
    ctx.globalAlpha = 1;
    circle(-4, -r * 0.3, 2.5, '#c77dff'); circle(4, -r * 0.3, 2.5, '#c77dff');
  }
  if (f.flash > 0) circle(0, 0, r, 'rgba(255,255,255,0.7)');
  if (f.slow > 0) circle(0, 0, r + 3, null, 'rgba(58,176,255,0.8)', 2);
  if (f.poison > 0) circle(0, 0, r + 5, null, 'rgba(125,255,74,0.7)', 2);
  if (f.freeze > 0) circle(0, 0, r + 2, 'rgba(200,240,255,0.55)', '#e8f8ff', 2);
  ctx.restore();

  if (f.hp < f.maxHp) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(f.x - r, f.y - r - 12, r * 2, 4);
    ctx.fillStyle = '#e44'; ctx.fillRect(f.x - r, f.y - r - 12, r * 2 * Math.max(0, f.hp / f.maxHp), 4);
  }
}

function drawBoss(b) {
  if (b.dead) return;
  const d = b.def, r = b.r, t = elapsed;
  const aura = TYPE_COLOR[d.weak[0]];
  ctx.save();
  ctx.translate(b.x, b.y);

  // aura in the colour of what hurts it — a hint for the observant
  const pr = r + 14 + Math.sin(t * 3) * 5;

  g.addColorStop(0, aura + '00'); g.addColorStop(0.7, aura + '55'); g.addColorStop(1, aura + '00');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, pr + 10, 0, TAU); ctx.fill();

    }

    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.moveTo(-14, 10); ctx.lineTo(-10, 24); ctx.lineTo(-6, 10); ctx.fill();
    ctx.beginPath(); ctx.moveTo(14, 10); ctx.lineTo(10, 24); ctx.lineTo(6, 10); ctx.fill();
  } else if (d.id === 'sentinel') {

    ctx.strokeStyle = '#555a66'; ctx.lineWidth = 4; ctx.stroke();
    ctx.fillStyle = '#2a2d33'; ctx.fillRect(-r * 0.7, -r * 0.35, r * 1.4, r * 0.3);
    const eye = Math.sin(t * 1.5) * r * 0.45;
    circle(eye, -r * 0.2, 7, '#f33');
    ctx.fillStyle = '#6d717c';
    for (const s of [-1, 1]) for (const v of [-1, 1]) circle(s * r * 0.75, v * r * 0.75, 4, '#6d717c');
  } else if (d.id === 'lich') {

    ctx.fillStyle = '#2b2233'; ctx.fill();
    circle(0, -r * 0.35, r * 0.72, d.color, '#8a8470', 2);
