  }
}
// run one live effect (a shot, pool, trap…) at the power it was cast with
function atPotency(o, fn) { const prev = potency; potency = (o && o.pot) || 1; try { return fn(); } finally { potency = prev; } }

function castSequence() {
  if (!seq.length) return;
  const key = seq.join('');
  if (net.role === 'guest') {
    // the host runs the spell; remember it here for your spell book
    seq = [];
    net.send({ t: 'cast', k: key });
    if (SPELLS[key]) { SFX.weave(key); discovered.add(key); } else SFX.fizzle();
    return;
  }
  const sp = SPELLS[key];
  seq = [];
  if (!sp) {
    player.mana = Math.max(0, player.mana - 1);
    castMessage('…fizzle', '#888');
    SFX.fizzle();
    burst(player.x, player.y, '#777', 10, 120);
    return;
  }
  if (player.mana < sp.cost) { castMessage('Not enough mana', '#6af'); return; }
  player.mana -= sp.cost;
  castSigil(key, player.x, player.y);
  if (mode === 'battle') { const S = stats(curSide === 'red' ? 'red' : 'blue'); if (S) { const el = RUNE_ELEM[key[0]]; S.spells[el] = (S.spells[el] || 0) + 1; } }
  const tier = key.length;
  const pot = potencyOf(key), potTxt = pot > 1 ? ` · power ×${pot.toFixed(2)}` : '';
  castMessage((tier >= 4 ? `${sp.name} · ${TIERS[tier]}` : sp.name) + potTxt, TIER_COLOR[tier]);
  burst(player.x, player.y, ELEMENTS[key[tier - 1]].color, 6 * tier, 100 + 50 * tier);
  if (isAttack(sp) || sp.fire) {
    // aimed spells load onto the FIRE button; weaving a new one replaces the old
    if (sp.fire) castWithPotency(key, () => sp.cast());
    const n = sp.shots || TIER_SHOTS[tier];
    player.loaded = { key, left: n };
    castMessage(`${sp.name} ×${n}${potTxt} · tap FIRE`, TIER_COLOR[tier]);
    SFX.weave(key); SFX.loaded();
    if (sp.fire) SFX.summon();
  } else {
    if (tier >= 4) shake = Math.max(shake, (tier - 3) * 4);
    SFX.weave(key);
    (sp.kind === 'heal' ? SFX.heal : sp.kind === 'summon' ? SFX.summon : SFX.buff)();
    castWithPotency(key, () => sp.cast());
  }
  if (!discovered.has(key)) {
    discovered.add(key);
    if (curSide !== 'red') SFX.discover();
    showBanner(tier >= 5 ? `${TIERS[tier].toUpperCase()} SPELL!` : 'New spell discovered!',
               `${sp.name} · tier ${tier} ${TIERS[tier]} · complexity ${complexityOf(key).toFixed(1)}`, tier >= 5 ? 4 : 3);
  }
}

// Press FIRE: quick spells go instantly, strong ones root you while they charge.
function fireLoaded() {
  const L = player.loaded;
  if (!L || player.charging || state !== 'play') return;
  if (net.role === 'guest') { net.send({ t: 'fire' }); return; }
  const tier = L.key.length;
  L.left--;
  if (L.left <= 0) player.loaded = null;
  const windup = SPELLS[L.key].windup ?? TIER_WINDUP[tier];
  if (windup > 0) { player.charging = { key: L.key, t: windup, max: windup }; SFX.charge(tier, windup); }
  else releaseSpell(L.key);
}

function releaseSpell(key) {
  SFX.release(key);
  const tier = key.length;
  if (tier >= 4) shake = Math.max(shake, (tier - 3) * 4);
  burst(player.x, player.y, TIER_COLOR[tier], 4 * tier, 80 + 40 * tier);
  const sp = SPELLS[key];
  castSigil(key, player.x, player.y, true);
  castWithPotency(key, () => (sp.fire || sp.cast)());
}

function shootArrow(wx, wy) {
  if (player.arrowCd > 0 || player.charging) return;
  if (net.role === 'guest') {
    player.arrowCd = player.omni > 0 ? 0.22 : 0.3;
    const dx = wx - player.x, dy = wy - player.y, d = Math.hypot(dx, dy) || 1;
    player.face = { x: dx / d, y: dy / d };
    SFX.arrow();
    net.send({ t: 'arrow', x: -wx, y: wy });
    return;
  }
  SFX.arrow();
  const dx = wx - player.x, dy = wy - player.y, d = Math.hypot(dx, dy) || 1;
  player.face = { x: dx / d, y: dy / d };
  if (player.omni > 0) {
    // Crown of All: prism bolts, still one per press
    player.arrowCd = 0.22;
    launch(player.x, player.y, player.face, { dmg: 3, type: 'prism', speed: 760, r: 8, life: 1 });
    return;
  }
  player.arrowCd = 0.3;
  launch(player.x, player.y, player.face, { dmg: 1, type: 'arrow', speed: 720, r: 5, life: 0.9 });
}

// ── update ───────────────────────────────────────────────────────────────────
function moveToward(e, tx, ty, spd, dt, stop) {
  const dx = tx - e.x, dy = ty - e.y, d = Math.hypot(dx, dy);
  if (d <= stop || d === 0) return d;
  const step = Math.min(spd * dt, d - stop);
  e.x += dx / d * step;
  e.y += dy / d * step;
  return d;
}

function pickFoeKind(x, y) {
  const r = Math.random();
  for (const b of BOSSES) {
    if (Math.hypot(x - b.x, y - b.y) < 600 && r < 0.5) return b.minion;
  }
  const d = Math.hypot(x, y);
  if (d < 600)  return r < 0.65 ? 'slime' : 'bat';
  if (d < 1100) return r < 0.35 ? 'slime' : r < 0.6 ? 'bat' : r < 0.85 ? 'skeleton' : 'ember';
  return ['bat', 'skeleton', 'ember', 'shade', 'shade'][Math.floor(r * 5)];
}

function spawnFoes(dt) {
  spawnTimer -= dt;
  if (spawnTimer > 0) return;
  spawnTimer = Math.max(0.5, 1.4 - elapsed / 300);
  const cap = Math.min(24, 6 + Math.floor(elapsed / 25));
  if (foes.filter(f => !f.boss && !f.dead).length >= cap) return;
  const a = rnd(0, TAU), d = rnd(520, 760);
  const x = clamp(player.x + Math.cos(a) * d, -WORLD, WORLD);
  const y = clamp(player.y + Math.sin(a) * d, -WORLD, WORLD);
  if (Math.hypot(x, y) < 220) return;
  const kind = pickFoeKind(x, y);
  if ((kind !== 'bat' && isWater(x, y)) || blockedForFoot(x, y, 16)) return;
  foes.push(makeFoe(kind, x, y));
}

function bossAttack(b) {
  const col = b.def.color;
  if (b.def.attack === 'ring') {
    for (let i = 0; i < b.def.shots; i++) {
      const a = i / b.def.shots * TAU + elapsed;
      enemyShots.push({ x: b.x, y: b.y, vx: Math.cos(a) * 220, vy: Math.sin(a) * 220, r: 8, dmg: b.def.dmg * 0.5, life: 3, color: col });
    }
    return;
  }
  const base = Math.atan2(player.y - b.y, player.x - b.x);
  const n = b.def.shots;
  for (let i = 0; i < n; i++) {
    const a = base + (i - (n - 1) / 2) * 0.22;
    enemyShots.push({ x: b.x, y: b.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, r: 8, dmg: b.def.dmg * 0.5, life: 3, color: col });
  }
}

function updateBoss(b, dt, dp) {
  const home = Math.hypot(b.def.x - b.x, b.def.y - b.y);
  if (!b.aggro && dp < 380) {
    b.aggro = true;
    b.shotCd = 1.2;
    showBanner(b.def.name, 'awakens', 2);
    SFX.awaken();
  }
  if (b.aggro && (dp > 700 || home > 900)) b.aggro = false;

  if (b.aggro) {
    moveToward(b, player.x, player.y, b.spd * (b.slow > 0 ? 0.6 : 1), dt, b.r + PLAYER_R - 4);
    b.shotCd -= dt;
    if (b.shotCd <= 0) { b.shotCd = b.def.rate; bossAttack(b); }
    if (b.def.summon) {
      b.summonCd -= dt;
      if (b.summonCd <= 0) {
        b.summonCd = 7;
        for (let i = 0; i < 2; i++) spawnQueue.push(makeFoe(b.def.summon, b.x + rnd(-70, 70), b.y + rnd(-70, 70)));
        ring(b.x, b.y, b.r + 40, b.def.color, 0.5);
      }
    }
  } else {
    moveToward(b, b.def.x, b.def.y, b.spd, dt, 2);
    b.hp = Math.min(b.maxHp, b.hp + b.maxHp * 0.08 * dt);
  }
}

// Slow-mo and Time Stop act on enemies and their shots, never on you.
function timeScale() { return timeStop > 0 ? 0 : timeWarp > 0 ? 0.3 : 1; }

// Who a foe goes after: a taunting helper nearby, otherwise you.
function foeTarget(f) {
  let best = null, bd = 360;
  for (const a of allies) {
    if (a.kind !== 'imp' && a.kind !== 'golem' && !(a.kind === 'critter' && a.taunt)) continue;
    const d = Math.hypot(a.x - f.x, a.y - f.y);
    if (d < bd) { bd = d; best = a; }
  }
  return best || player;
}

function updateFoes(realDt) {
  const dt = realDt * timeScale();
  if (dt === 0) return; // time is stopped
  for (const f of foes) {
    if (f.dead || f.proxyOf) continue;
    f.flash = Math.max(0, f.flash - dt);
    f.hitCd -= dt; f.slow -= dt; f.txtCd -= dt;
    if (f.poison > 0) {
      f.poison -= dt;
      f.poisonTick -= dt;
      if (f.poisonTick <= 0) { f.poisonTick = 0.5; damageFoe(f, f.poisonDps * 0.5, 'poison'); }
      if (f.dead) continue;
    }
    if (f.burn > 0) {
      f.burn -= dt;
      f.burnTick = (f.burnTick || 0) - dt;
      if (f.burnTick <= 0) { f.burnTick = 0.5; damageFoe(f, 0.4, 'fire'); }
      if (f.dead) continue;
    }
    for (const k of ['hex', 'fear', 'confuse', 'root']) if (f[k] > 0) f[k] -= dt;
    // frozen, stunned or turned to stone: no moving, biting or shooting
    if (f.freeze > 0 || f.stun > 0 || f.stone > 0) {
      f.freeze = (f.freeze || 0) - dt; f.stun = (f.stun || 0) - dt; f.stone = (f.stone || 0) - dt;
      continue;
    }
    if (f.unit) {
      if (f.fear > 0) moveToward(f, f.x * 2 - player.x, f.y * 2 - player.y, f.spd, dt, 0);
      else if (f.confuse > 0) {
        if (Math.random() < dt * 1.5) f.wander = rnd(0, TAU);
        f.x += Math.cos(f.wander) * f.spd * dt; f.y += Math.sin(f.wander) * f.spd * dt;
      } else updateUnit(f, dt);
      if (!f.structure) {
        f.x += f.kx * dt; f.y += f.ky * dt;
        const dmp = Math.max(0, 1 - 7 * dt);
        f.kx *= dmp; f.ky *= dmp;
        f.x = clamp(f.x, -WORLD, WORLD); f.y = clamp(f.y, -boundY(), boundY());
        if (mode === 'battle') clampArena(f, f.r);
        if (!f.def.flying) pushOut(f, f.r);
      }
      continue;
    }
    const dp = Math.hypot(player.x - f.x, player.y - f.y);
    const px = f.x, py = f.y;
    let tgt = player;
    if (f.boss) {
      updateBoss(f, dt, dp);
      if (f.root > 0) { f.x = px; f.y = py; }
    } else {
      if (dp > 1300) { f.dead = true; continue; }
      let spd = f.spd * (f.slow > 0 ? 0.5 : 1) * (f.hex > 0 ? 0.4 : 1);
      if (f.root > 0) spd = 0;
      if (f.fear > 0) {
        moveToward(f, f.x * 2 - player.x, f.y * 2 - player.y, spd * 1.1, dt, 0); // run away
      } else if (f.confuse > 0) {
        if (Math.random() < dt * 1.5) f.wander = rnd(0, TAU);
        f.x += Math.cos(f.wander) * spd * dt; f.y += Math.sin(f.wander) * spd * dt;
      } else {
        tgt = foeTarget(f);
        moveToward(f, tgt.x, tgt.y, spd, dt, f.r + (tgt === player ? PLAYER_R : tgt.r) - 2);
        if (f.kind === 'bat' && spd > 0) { f.x += Math.cos(elapsed * 7 + f.wob) * 40 * dt; f.y += Math.sin(elapsed * 9 + f.wob) * 40 * dt; }
      }
    }
    f.x += f.kx * dt; f.y += f.ky * dt;
    const damp = Math.max(0, 1 - 7 * dt);
    f.kx *= damp; f.ky *= damp;
    f.x = clamp(f.x, -WORLD, WORLD); f.y = clamp(f.y, -boundY(), boundY());
    if (f.kind !== 'bat') {
      if (isWater(f.x, f.y)) { f.x = px; f.y = py; } // only bats fly over the lake
      pushOut(f, f.r);
    }

    // bites: frogs, the frightened and the confused don't bite
    if (f.hex > 0 || f.fear > 0 || f.confuse > 0) continue;
    if (tgt !== player) {
      if (Math.hypot(tgt.x - f.x, tgt.y - f.y) < f.r + tgt.r + 4 && f.hitCd <= 0) {
        tgt.hp -= f.def.dmg; f.hitCd = 1;
        burst(tgt.x, tgt.y, '#ccc', 5, 120);
        if (tgt.hp <= 0) tgt.life = 0;
      }
    } else if (dp < f.r + PLAYER_R + 2 && f.hitCd <= 0) {
      hurtPlayer(f.def.dmg);
      f.hitCd = 1;
      knock(f, player.x, player.y, 160);
    }
  }

  // keep regular foes from piling onto one spot
  separate(foes.filter(f => !f.boss));

  if (spawnQueue.length) { foes.push(...spawnQueue); spawnQueue = []; }
  foes = foes.filter(f => !f.dead || f.boss || f.proxyOf);
}

function updateShots(dt) {
  for (const s of shots) {
    potency = s.pot || 1;
    // Seeking weaves curve toward the nearest foe
    if (s.spec && s.spec.finish === 'S' && s.fx === 'woven') {
      const t = nearestFoe(s.x, s.y, 320, s.hit);
      if (t) {
        const sp = Math.hypot(s.vx, s.vy), want = Math.atan2(t.y - s.y, t.x - s.x), cur = Math.atan2(s.vy, s.vx);
        let d = Math.atan2(Math.sin(want - cur), Math.cos(want - cur));
        const a = cur + clamp(d, -5 * dt, 5 * dt);
        s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp;
      }
    }
    s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt; s.spin += dt * 8;
    shotTrailFx(s, dt);
    if (inWall(s.x, s.y)) { s.life = 0; burst(s.x, s.y, '#999', 4, 100); continue; }
    for (const f of foes) {
      if (s.life <= 0) break;
      if (f.dead || s.hit.has(f)) continue;
      if (Math.hypot(f.x - s.x, f.y - s.y) < s.r + f.r) {
        s.hit.add(f);
        const dealt = damageFoe(f, s.dmg, s.type, s.ally);
        if (s.fx === 'woven') { applyWovenFx(f, s.spec, dealt, s); react(s.type, s.x, s.y, 40); wovenFinishHit(s, f); }
        shotImpact(s, f);
        if (s.fx === 'slow') f.slow = 2.5;
        if (s.fx === 'burn') f.burn = Math.max(f.burn || 0, 2);
        if (s.fx === 'freeze') applyCC(f, 'freeze', 3);
        if (s.fx === 'hex') applyCC(f, 'hex', 6);
        if (s.fx === 'drain' && dealt) healPlayer(dealt * 0.6 / potency);
        if (s.fx === 'poison') { f.poison = Math.max(f.poison, 3); f.poisonDps = Math.max(f.poisonDps, 0.6); }
        if (s.fx === 'explode') { SFX.explode(false); aoe(s.x, s.y, s.boomR, s.boom, s.type, 120); }
        else if (s.fx === 'woven') elemHit(ELEM_OF[s.type] || s.type, s.x, s.y, 0.8);
        if (s.pierce-- <= 0) s.life = 0;
      }
    }
  }
  shots = shots.filter(s => s.life > 0);

  const edt = dt * timeScale();
  for (const s of enemyShots) {
    s.x += s.vx * edt; s.y += s.vy * edt; s.life -= edt;
    if (inWall(s.x, s.y)) { s.life = 0; continue; }
    if (solidTemps().some(b => Math.hypot(b.x - s.x, b.y - s.y) < b.r + s.r)) { s.life = 0; burst(s.x, s.y, '#999', 4, 100); continue; }
    const guard = allies.find(a => a.kind === 'golem' && Math.hypot(a.x - s.x, a.y - s.y) < a.r + s.r + 4);
    if (guard) { guard.hp -= s.dmg; if (guard.hp <= 0) guard.life = 0; s.life = 0; burst(s.x, s.y, '#aaa', 5, 100); continue; }
    if (Math.hypot(player.x - s.x, player.y - s.y) < s.r + PLAYER_R + (player.mirror > 0 ? 14 : 0)) {
      if (player.mirror > 0) {
        // Mirror Shield: send it back as your own shot; reflected magic hurts even guardians
        const sp = Math.hypot(s.vx, s.vy) || 1;
        launch(s.x, s.y, { x: -s.vx / sp, y: -s.vy / sp }, { dmg: s.dmg * 2, type: 'mirror', speed: sp * 1.4, r: s.r });
        SFX.block();
        s.life = 0;
        continue;
      }
      hurtPlayer(s.dmg); s.life = 0;
    }
  }
  enemyShots = enemyShots.filter(s => s.life > 0);
}

function updateAllies(dt) {
  for (const a of allies) {
    potency = a.pot || 1;
    a.life -= dt; a.cd -= dt;
    if (a.kind === 'wisp') {
      // circles you and slowly heals you
      a.ang += 2.2 * dt;
      moveToward(a, player.x + Math.cos(a.ang) * 42, player.y + Math.sin(a.ang) * 42, 400, dt, 0);
      if (a.cd <= 0) {
        a.cd = 1;
        if (player.hp < player.maxHp) { healPlayer(0.8); fx.push({ kind: 'bolt', pts: [{ x: a.x, y: a.y }, { x: player.x, y: player.y }], life: 0.2, max: 0.2, color: '#9f9' }); }
      }
    } else if (a.kind === 'imp') {
      // runs ahead of you and draws enemies to it
      moveToward(a, player.x + player.face.x * 110, player.y + player.face.y * 110, 200, dt, 4);
      pushOut(a, a.r);
    } else if (a.kind === 'golem') {
      // plants itself between you and the nearest enemy; soaks bites and shots
      const t = nearestFoe(player.x, player.y, 400);
      const tx = t ? player.x + (t.x - player.x) * 0.45 : player.x + 50, ty = t ? player.y + (t.y - player.y) * 0.45 : player.y;
      moveToward(a, tx, ty, 120, dt, 4);
      pushOut(a, a.r);
    } else if (a.kind === 'critter') {
      updateCritter(a, dt);
    } else if (a.kind === 'dragon') {
      a.ang += 1.1 * dt;
      moveToward(a, player.x + Math.cos(a.ang) * 90, player.y + Math.sin(a.ang) * 60 - 40, 260, dt, 0);
      if (!player.loaded || player.loaded.key !== 'FFSAFF') a.life = Math.min(a.life, 1.5); // out of breath: flies off
    }
  }
  allies = allies.filter(a => {
    if (a.life > 0) return true;
    if (a.kind === 'critter' && a.spec.finish === 'F') {
      // a Volatile helper goes out with a bang
      wovenBurstAt(a.x, a.y, 80, 2 * a.spec.power, a.spec);
      puff(a.x, a.y, '#8a7a70', 3, 18, 30);
    } else if (a.kind === 'imp') {
      // the decoy goes out with a bang
      aoe(a.x, a.y, 90, 4, 'fire', 220);
      burst(a.x, a.y, '#ff8a3a', 30, 320);
      SFX.explode(false);
    } else burst(a.x, a.y, '#aaa', 10, 120);
    return false;
  });
}

function updateEffects(dt) {
  for (const z of zones) {
    potency = z.pot || 1;
    z.life -= dt; z.tick -= dt;
    if (z.tick <= 0) {
      z.tick = 0.5;
      for (const f of foes) {
        if (f.dead || Math.hypot(f.x - z.x, f.y - z.y) > z.r + f.r) continue;
        if (z.type === 'fire') { damageFoe(f, 1.5, 'fire'); continue; } // meteor crater
        if (z.type === 'mud') { applyCC(f, 'root', 0.7); continue; }
        if (z.type === 'vortex') { damageFoe(f, 0.5, 'air'); continue; }
        if (z.type === 'spring') continue;
        if (z.type === 'woven') {
          const dealt = damageFoe(f, 0.5 * z.spec.power, z.spec.elem);
          applyWovenFx(f, z.spec, dealt, z, true);
          if (z.charged > 0) { damageFoe(f, 0.8, 'lightning'); applyCC(f, 'stun', 0.5); }
          continue;
        }
        damageFoe(f, 0.6, 'poison');
        f.poison = Math.max(f.poison, 2);
        f.poisonDps = Math.max(f.poisonDps, 1);
      }
    }
  }
  potency = 1;
  for (const z of zones) {
    if (z.type === 'vortex') {
      // drag everything inside toward the eye
      for (const f of foes) {
        if (f.dead || f.structure) continue;
        const dx = z.x - f.x, dy = z.y - f.y, d = Math.hypot(dx, dy);
        if (d > z.r || d < 6) continue;
        const pull = (f.boss ? 40 : 260) * dt;
        f.x += dx / d * Math.min(pull, d); f.y += dy / d * Math.min(pull, d);
      }
    }
    if (z.type === 'woven') {
      if (z.charged > 0 && z.charged < 90) z.charged -= dt;
      const fin = z.spec.finish;
      if (fin === 'W' && z.r0) z.r = Math.min(z.r0 * 1.7, z.r + z.r0 * 0.15 * dt);                 // Spreading
      if (fin === 'A' && z.r0) { const t = nearestFoe(z.x, z.y, 500); if (t) moveToward(z, t.x, t.y, 45, dt, 0); } // Drifting
      if (fin === 'S' && z.r0) for (const f of foes) {                                                 // Pulling
        if (f.dead || f.structure) continue;
        const dx = z.x - f.x, dy = z.y - f.y, d = Math.hypot(dx, dy);
        if (d < z.r * 1.3 && d > 8) { const pull = (f.boss ? 15 : 70) * dt; f.x += dx / d * pull; f.y += dy / d * pull; }
      }
      // a sacred circle (or any pool with a Spirit upgrade) heals you while you stand in it
      if ((z.spec.elem === 'spirit' || z.spec.heal) && Math.hypot(player.x - z.x, player.y - z.y) < z.r)
        player.hp = Math.min(player.maxHp, player.hp + 1.5 * (z.pot || 1) * dt);
      // a whirlwind drags enemies toward its eye
      if (z.spec.elem === 'air') for (const f of foes) {
        if (f.dead || f.structure) continue;
        const dx = z.x - f.x, dy = z.y - f.y, d = Math.hypot(dx, dy);
        if (d < z.r && d > 6) { const pull = (f.boss ? 20 : 90) * dt; f.x += dx / d * pull; f.y += dy / d * pull; }
      }
    }
    if (z.type === 'spring' && Math.hypot(player.x - z.x, player.y - z.y) < z.r) {
      player.hp = Math.min(player.maxHp, player.hp + 2.5 * (z.pot || 1) * dt);
      player.mana = Math.min(player.maxMana, player.mana + 1 * dt);
    }
  }
  for (const z of zones) if (z.life <= 0 && z.type === 'woven' && z.spec.finish === 'F' && z.r0 && !z.erupted) {
    // Erupting: the pool goes up in one last blast
    z.erupted = true; potency = z.pot || 1;
    wovenBurstAt(z.x, z.y, z.r * 1.1, 3 * z.spec.power, z.spec);
    puff(z.x, z.y, '#8a7a70', 3, 24, 40);
  }
  potency = 1;
  zones = zones.filter(z => z.life > 0);

  for (const t of traps) {
    potency = t.pot || 1;
    t.arm -= dt; t.life -= dt;
    if (t.arm > 0) continue;
    if (foes.some(f => !f.dead && Math.hypot(f.x - t.x, f.y - t.y) < f.r + 26)) {
      if (t.spec) { wovenBurstAt(t.x, t.y, 85 * t.spec.size, 3.5 * t.spec.power, t.spec); SFX.explode(false); t.life = 0; continue; }
      aoe(t.x, t.y, 75, 4, 'fire', 260);
      fx.push({ kind: 'nova', elem: 'fire', x: t.x, y: t.y, r: 75, life: 0.5, max: 0.5 });
      puff(t.x, t.y, '#8a7a70', 3, 20, 40);
      SFX.explode(false);
      t.life = 0;
    }
  }
  traps = traps.filter(t => t.life > 0);

  for (const b of tempSolids) {
    potency = b.pot || 1;
    if (curSide === 'blue') b.life -= dt;
    if (!b.spec || (b.side || 'blue') !== curSide) continue;
    b.tick -= dt;
    if (b.tick > 0) continue;
    b.tick = 0.5;
    for (const f of foes) {
      if (f.dead || f.structure || Math.hypot(f.x - b.x, f.y - b.y) > b.r + f.r + 8) continue;
      const dmg = b.elem === 'fire' ? 0.8 * b.spec.power : b.elem === 'air' ? 0.3 * b.spec.power : 0;
      const dealt = dmg ? damageFoe(f, dmg, b.elem) : 0;
      applyWovenFx(f, b.spec, dealt, b);
      if (b.elem === 'spirit') applyCC(f, 'confuse', 3 * b.spec.dur);
    }
    // Soothing walls mend the caster who shelters by them
    if (b.spec.finish === 'S' && Math.hypot(player.x - b.x, player.y - b.y) < 70) { player.hp = Math.min(player.maxHp, player.hp + 0.25); shapeBits(b.x, b.y - 10, 'plus', '#9dffb0', 1, 30, 50); }
  }
  if (curSide === 'blue') tempSolids = tempSolids.filter(b => {
    if (b.life > 0) return true;
    if (b.spec && b.spec.finish === 'F') {
      // Exploding walls go off as they crumble (on their caster's side)
      const caster = b.side === 'red' ? (versus ? rivalP : leadMage) : player;
      if (b.side !== 'red' || caster) withSide(b.side || 'blue', () => wovenBurstAt(b.x, b.y, 55, 1.5 * b.spec.power, b.spec), caster);
    }
    puff(b.x, b.y, '#c2a57a', 1, 12, 10);
    return false;
  });

  for (const w of waves) {
    potency = w.pot || 1;
    w.r += w.speed * dt;
    if (Math.random() < 0.8) { const a = rnd(0, TAU); particles.push({ shape: 'drop', x: w.x + Math.cos(a) * w.r, y: w.y + Math.sin(a) * w.r, vx: Math.cos(a) * 80, vy: Math.sin(a) * 80 - 90, r: 3, life: 0.7, decay: 1.8, color: '#e8f8ff', rot: 0, spin: 0 }); }
    for (const f of foes) {
      if (f.dead || w.hit.has(f)) continue;
      if (Math.abs(Math.hypot(f.x - w.x, f.y - w.y) - w.r) < f.r + 14) {
        w.hit.add(f);
        damageFoe(f, w.dmg, w.type);
        knock(f, w.x, w.y, 340);
      }
    }
  }
  waves = waves.filter(w => w.r < w.maxR);

  for (const m of meteors) {
    potency = m.pot || 1;
    m.t -= dt;
    if (m.t <= 0) {
      aoe(m.x, m.y, 200, 25, 'fire', 380);
      SFX.explode(true);
      zones.push({ x: m.x, y: m.y, r: 140, life: 4, max: 4, tick: 0, type: 'fire', pot: potency });
      fx.push({ kind: 'cracks', ...crackLines(m.x, m.y, 220, 9), life: 2, max: 2 });
      fx.push({ kind: 'nova', elem: 'fire', x: m.x, y: m.y, r: 200, life: 0.6, max: 0.6 });
      puff(m.x, m.y, '#8a7a70', 6, 40, 50);
      burst(m.x, m.y, '#ff5a2a', 80, 560);
      burst(m.x, m.y, '#ffd24a', 40, 340);
      shake = Math.max(shake, 20);
      flash = Math.max(flash, 0.35);
    }
  }
  meteors = meteors.filter(m => m.t > 0);
  potency = 1;
  if (curSide === 'blue') decayVisuals(dt);
}

// shared visuals fade (once a frame, whoever's side is running)
function decayVisuals(dt) {
  for (const e of fx) e.life -= dt;
  fx = fx.filter(e => e.life > 0);

  const w = windAt();
  for (const p of particles) {
    if (p.home) { const dx = player.x - p.x, dy = player.y - p.y, d = Math.hypot(dx, dy) || 1; p.vx += dx / d * 900 * dt; p.vy += dy / d * 900 * dt; if (d < 16) p.life = 0; }
    if (p.shape) { p.rot += (p.spin || 0) * dt; if (p.shape === 'drop') p.vy += 160 * dt; }
    p.x += p.vx * dt; p.y += p.vy * dt;
    const damp = Math.max(0, 1 - (p.puff || p.leaf ? 1.5 : p.home ? 0.5 : p.shape ? 2.5 : 4) * dt);
    p.vx *= damp; p.vy *= damp;
    if (p.puff || p.leaf) p.vx += w * 30 * dt; // the breeze carries smoke and leaves
    if (p.leaf) { p.rot += p.spin * dt; p.vy += 10 * dt; }
    p.life -= p.decay * dt;
  }
  particles = particles.filter(p => p.life > 0);

  for (const t of floaters) { t.y -= 40 * dt; t.life -= dt; }
  floaters = floaters.filter(t => t.life > 0);
}

function showScroll(combo, title) {
  SFX.scroll();
  state = 'reveal';
  reveal = { combo, name: SPELLS[combo].name, title, t: 0 };
  movePtr = null; movePos = null; moveStart = null;
  castPtr = null; finger = null; seq = [];
  player.charging = null;
}
function openChest(c) {
  c.opened = true;
  showScroll(c.boss.def.reward, 'AN ANCIENT SCROLL');
}

function closeReveal() {
  reveal = null;
  if (bossesDown === BOSSES.length && !wonShown) {
    wonShown = true;
    state = 'won';
    overlayT = 0;
  } else {
    state = 'play';
  }
}

function heroMove(dt) {
  // movement: keyboard + held pointer on the field (not while waiting to respawn)
  let mx = 0, my = 0;
  if (state !== 'play') { movePos = null; for (const k in keys) keys[k] = false; }
  if (keys.KeyW || keys.ArrowUp)    my -= 1;
  if (keys.KeyS || keys.ArrowDown)  my += 1;
  if (keys.KeyA || keys.ArrowLeft)  mx -= 1;
  if (keys.KeyD || keys.ArrowRight) mx += 1;
  if (movePos && moveStart && moveStart.shooting) {
    shootArrow(player.x + movePos.x - W / 2, player.y + movePos.y - playerScreenY()); // held: keep firing
  } else if (movePos && moveStart && (moveStart.moved || performance.now() - moveStart.t > 180)) {
    // without tilt, a held finger walks once it's clearly a hold or a drag, not a tap
    const dx = movePos.x - W / 2, dy = movePos.y - playerScreenY(), d = Math.hypot(dx, dy);
    if (d > 14) { mx += dx / d; my += dy / d; }
  }
  const t = tiltVector();
  mx += t.x; my += t.y;
  // analog: a gentle tilt walks slowly, anything else is capped at full speed
  let ml = Math.hypot(mx, my);
  player.moving = ml > 0.02 && !player.charging && state === 'play'; // charging a big spell roots you
  if (player.moving) {
    mx /= ml; my /= ml;
    ml = Math.min(1, ml);
    movePlayer(mx, my, (player.onBoat ? 230 : 170) * ml * (player.haste > 0 ? 1.6 : 1) * dt);
    player.face = { x: mx, y: my };
    if (player.haste > 0 && Math.random() < 0.5) {
      particles.push({ x: player.x, y: player.y + 10, vx: 0, vy: 0, r: 3, life: 0.6, decay: 2, color: TYPE_COLOR.air });
    }
  }
}

function update(dt) {
  elapsed += dt;

  heroMove(dt);

  // board the boat by walking into it
  player.boardCd = Math.max(0, player.boardCd - dt);
  if (!player.onBoat && player.boardCd <= 0 && dist(player, boat) < 52) {
    player.onBoat = true;
    player.x = boat.x; player.y = boat.y;
    castMessage('All aboard! Sail to land to step off', '#bfe6ff');
    SFX.splash();
  }

  heroTimers(dt);
  timeWarp = Math.max(0, timeWarp - dt);
  timeStop = Math.max(0, timeStop - dt);

  if (mode === 'battle') updateBattle(dt);
  else spawnFoes(dt * timeScale());
  updateFoes(dt);
  potency = 1;
  updateShots(dt);
  updateAllies(dt);
  updateStorms(dt);
  updateEffects(dt);
  potency = 1;
  if (versus) updateRival(dt);

  for (const c of chests) {
    if (!c.opened && c.boss.dead && state === 'play' && dist(c, player) < 44) openChest(c);
  }
  for (const sc of scrolls) {
    if (!sc.taken && state === 'play' && dist(sc, player) < 34) {
      sc.taken = true;
      showScroll(sc.combo, 'A LOST SCROLL');
    }
  }
}

// timers, mana and buffs for whichever hero is current
function heroTimers(dt) {
  if (player.charging) {
    player.charging.t -= dt;
    if (player.charging.t <= 0) { const k = player.charging.key; player.charging = null; releaseSpell(k); }
  }
  player.arrowCd = Math.max(0, player.arrowCd - dt);

  player.invuln  = Math.max(0, player.invuln - dt);
  player.skin    = Math.max(0, player.skin - dt);
  player.haste   = Math.max(0, player.haste - dt);
  player.empower = Math.max(0, player.empower - dt);
  const inEnemyGround = mode === 'battle' && cellOwner(player.x, player.y) === (curSide === 'red' ? 1 : 2);
  player.mana    = Math.min(player.maxMana, player.mana + (inEnemyGround ? 0.6 : 2.2) * dt);
  const fp = fountainPos(curSide);
  if ((state === 'play' || curSide === 'red') && !player.dead && Math.hypot(player.x - fp.x, player.y - fp.y) < SHRINE_R) {
    player.hp   = Math.min(player.maxHp, player.hp + 3 * dt);
    player.mana = Math.min(player.maxMana, player.mana + 3 * dt);
  }

  for (const k of ['omni', 'mirror', 'sanct', 'phoenix', 'regen']) player[k] = Math.max(0, player[k] - dt);
  if (player.charge) for (const t of CHARGE_TYPES) player.charge[t] = Math.min(1, player.charge[t] + CHARGE_REGEN * dt);
  if (player.chargeTxtCd > 0) player.chargeTxtCd -= dt;
  if (player.regen > 0) player.hp = Math.min(player.maxHp, player.hp + 1.2 * dt);
}

// Walk (or sail) one step, sliding along obstacles.
function movePlayer(dx, dy, step) {
  let nx = clamp(player.x + dx * step, -WORLD, WORLD);
  let ny = clamp(player.y + dy * step, -boundY(), boundY());
  if (mode === 'battle') { const c = clampArena({ x: nx, y: ny }, PLAYER_R); nx = c.x; ny = c.y; }
  if (player.onBoat) {
    // the boat stays on water; steering into land steps you ashore
    const ahead = { x: nx + dx * 14, y: ny + dy * 14 };
    if (isWater(ahead.x, ahead.y)) {
      player.x = boat.x = nx; player.y = boat.y = ny;
      return;
    }
    // step ashore straight ahead, or a little to either side if that spot is taken
    const base = Math.atan2(dy, dx);
    for (const off of [0, 0.4, -0.4, 0.8, -0.8]) {
      for (const reach of [36, 50]) {
        const lx = player.x + Math.cos(base + off) * reach, ly = player.y + Math.sin(base + off) * reach;
        if (blockedForFoot(lx, ly, PLAYER_R)) continue;
        player.onBoat = false;
        player.boardCd = 1.2;
        player.x = lx; player.y = ly;
        return;
      }
    }
    return;
  }
  // on foot: no wading into the lake; slide along one axis if the other is blocked
  if (!isWater(nx, ny)) { player.x = nx; player.y = ny; }
  else if (!isWater(nx, player.y)) player.x = nx;
  else if (!isWater(player.x, ny)) player.y = ny;
  pushOut(player, PLAYER_R);
}


// ── battle mode ─────────────────────────────────────────────────────────────
// A 5-minute points match between blue (you) and red. It ends when the clock
// runs out (most points wins) or a home base is destroyed (its destroyer wins).
// Three ways to score:
//  · Ground: towers joined by laser lines enclose each side's ground. The
//    side holding more ground when the match ends scores 140.
//  · Kills fill a tally: a minion adds 1, a titan 5, a wizard (or a hero) 10;
//    every 5 on the tally is a point. A turret is worth 5 points outright,
//    and a duel friend's wizard 10.
//  · Sigils: each side has one sigil in its own ground. Destroying the
//    other side's scores 50 and earns a bonus build; it reappears elsewhere
//    behind a 15s wall. Destroying a base scores 60 and ends the match.
// Build turns alternate: on yours, build a turret (claims open ground) or a titan.
let difficulty = 'easy';
let friends = [];   // blue units and structures (your side)
let bshots = [];    // shots from units and towers
let teams = null;
let links = [];     // laser walls between friendly towers
const MATCH_TIME = 300, BUILD_EVERY = 10, SIGIL_WALL = 15, GROUND_BONUS = 140, BASE_BONUS = 60;
const FRONT_X = WORLD * 0.32; // the line (±) behind which each side holds 30% of the oval at the start
const TEAM_COLOR = { blue: '#4aa8ff', red: '#ff4a5a' };
const UNITS = {
  // five kinds of minion, one per element; weak alone but plentiful
  wisp:   { name: 'Wisp',   elem: 'spirit', pts: 1, hp: 3.5, spd: 72, r: 9,  range: 140, dmg: 0.55, cd: 1.0, aggro: 220, ranged: true, flying: true },
  archer: { name: 'Archer', elem: 'water',  pts: 1, hp: 3,   spd: 64, r: 9,  range: 170, dmg: 0.55, cd: 1.2, aggro: 230, ranged: true },
  imp:    { name: 'Imp',    elem: 'fire',   pts: 1, hp: 3.5, spd: 84, r: 10, range: 24,  dmg: 0.9, cd: 0.9, aggro: 220 },
  brute:  { name: 'Brute',  elem: 'earth',  pts: 1, hp: 6,   spd: 56, r: 12, range: 24,  dmg: 0.8, cd: 1.1, aggro: 200 },
  flyer:  { name: 'Flyer',  elem: 'air',    pts: 1, hp: 3.6, spd: 96, r: 9,  range: 22,  dmg: 0.65, cd: 0.8, aggro: 220, flying: true },
  wizard: { name: 'Wizard', pts: 1, hp: 26,  spd: 86, r: 15, range: 250, dmg: 2.5, cd: 1.4, aggro: 330, ranged: true },
  titan:  { name: 'Titan',  pts: 1, hp: 55,  spd: 32, r: 30, range: 48,  dmg: 3,   cd: 2.2, aggro: 240, splash: 45 },
  // turrets sting but don't dominate; a few focused hits bring one down
  turret: { name: 'Turret', pts: 1, hp: 45,  spd: 0,  r: 24, range: 260, dmg: 2.2, cd: 1.4, aggro: 260, ranged: true, structure: true },
  nexus:  { name: 'Base',   pts: 0, hp: 250, spd: 0,  r: 55, range: 300, dmg: 2.5, cd: 1.6, aggro: 300, ranged: true, structure: true },

for (const k in UNITS) { UNITS[k].mult = {}; UNITS[k].color = '#ccc'; }

// Spirit: the enemy hits softer and takes more damage.

const resDmgIn  = team => (1 - resOf(team).earth) * (1 + resOf(otherTeam(team)).spirit);

// every point is booked under a heading, for the breakdown at the end

function addUnit(team, kind, x, y, elem) {

// ── territory ──
// Each side's towers are joined by lines; the shape they make together with that
// side's back edge of the map is its ground. Where two shapes overlap, the ground
// goes to whoever's tower is nearer. Counted on a grid of small cells.
const CELL = 50, COLS = Math.ceil(WORLD * 2 / CELL), ROWS = Math.ceil(ARENA_H * 2 / CELL);
const terr = new Int8Array(COLS * ROWS); // 0 open ground, 1 blue, 2 red
const inOval = new Uint8Array(COLS * ROWS); // cells that are part of the field
let FIELD_CELLS = 0;
for (let j = 0; j < ROWS; j++) for (let i = 0; i < COLS; i++) {
  const c = { x: -WORLD + (i + 0.5) * CELL, y: -ARENA_H + (j + 0.5) * CELL };
  if (inArena(c.x, c.y)) { inOval[j * COLS + i] = 1; FIELD_CELLS++; }
}
let hulls = { blue: [], red: [] };
function cellCenter(i, j) { return { x: -WORLD + (i + 0.5) * CELL, y: -ARENA_H + (j + 0.5) * CELL }; }
function cellOwner(x, y) {

// convex hull (monotone chain); points keep their tower reference if they have one

  for (const q of p) { while (lo.length >= 2 && cross(lo[lo.length - 2], lo[lo.length - 1], q) <= 0) lo.pop(); lo.push(q); }

// red's build turn: a turret on the open spot that adds the most ground, or a

function redBuild() {
  const T = teams, sk = aiSkill();
  const base = polyArea(hulls.red), opts = [];
  for (let k = 0, n = Math.round(20 + 60 * sk); k < n; k++) {
    const i = Math.floor(Math.random() * COLS), j = 1 + Math.floor(Math.random() * (ROWS - 2));

  let best = opts.length ? opts[Math.min(opts.length - 1, Math.floor(Math.random() * Math.max(1, opts.length * (1 - sk) * 0.8)))] : null;

// Who a unit fights: the nearest opponent it can see (walled sigils and bases are ignored).
function findTarget(u) {
  const opp = u.team === 'blue'
    ? foes.concat(rivalHelpers())
    : (state === 'play' && !player.onBoat ? [player] : []).concat(friends, allies.filter(a => a.kind === 'critter'));
  let best = null, bd = u.def.aggro;
  if (smartRed(u) && sharp(u)) {
    let bs = -Infinity;
    for (const o of opp) {
      if (o.dead || (o.unit && shielded(o))) continue;
      const d = Math.hypot(o.x - u.x, o.y - u.y) - (o.r || PLAYER_R);
      if (d > bd) continue;
      const sc = smartScore(u, o, d);
      if (sc > bs) { bs = sc; best = o; }
    }
    u.lastTgt = best;
    return best;
  }
  for (const o of opp) {
    if (o.dead || (o.unit && shielded(o))) continue;
    const d = Math.hypot(o.x - u.x, o.y - u.y) - (o.r || PLAYER_R);
    if (d < bd) { bd = d; best = o; }
  }
  return best;
}

// Where a unit heads when nothing is in reach: the enemy sigil (unless walled),
// otherwise the nearest enemy turret, otherwise the edge of the enemy base.
// Your orders for a unit (red always attacks turrets, then the base).
function rivalHelpers() { return (versus && net.role === 'host') || aiMagic() ? redSide.allies.filter(a => a.kind === 'critter' && a.life > 0) : []; }

function teamStance(team) { return team === 'blue' ? teams.order : (versus && teams.redOrder) || 'spread'; }

function orderFor(u) {
  if (!teams) return 'attackTurrets';
  const ords = u.team === 'blue' ? teams.orders : versus ? teams.redOrders : null;
  if (!ords) return 'attackTurrets';
  if (isMinion(u)) return ords.minion;
  if (u.kind === 'titan') return ords.titan;
  return 'attackTurrets';
}

// Where a guard stands: by the base, or by the turret most under threat
// (or the one furthest forward when none is).
function guardPost(u, what) {
  const home = nexusOf(u.team);
  if (what === 'base' || !teamList(u.team).some(t => t.kind === 'turret' && !t.dead)) return home;
  const enemies = teamList(otherTeam(u.team)).filter(o => !o.dead && !o.structure);
  let best = null, score = -Infinity;
  for (const t of teamList(u.team)) {
    if (t.kind !== 'turret' || t.dead) continue;
    const near = enemies.filter(o => Math.hypot(o.x - t.x, o.y - t.y) < 450).length;
    const sc = near * 1000 - Math.abs(t.x) * 0.5 - Math.hypot(t.x - u.x, t.y - u.y) * 0.1;
    if (sc > score) { score = sc; best = t; }
  }
  return best || home;
}

function objectiveFor(u) {
  if (smartRed(u)) { const o = smartObjective(u); if (o) return o; }
  const enemy = teamList(otherTeam(u.team)).filter(o => !o.dead && o.structure && !shielded(o));
  if (orderFor(u) === 'attackBase') { const nx = nexusOf(otherTeam(u.team)); if (nx) return nx; }
  if (u.kind !== 'titan') { const sig = enemy.find(o => o.kind === 'sigil'); if (sig) return sig; }
  let best = null, bd = Infinity;
  for (const o of enemy) { if (o.kind !== 'turret') continue; const d = Math.hypot(o.x - u.x, o.y - u.y); if (d < bd) { bd = d; best = o; } }
  if (best) return best;
  const nx = nexusOf(otherTeam(u.team));
  return nx || null; // no turrets left: go for the base
}

function unitAttack(u, tgt) {
  if (u.cd > 0 || u.hex > 0 || u.def.passive) return;
  u.cd = u.def.cd;
  const atk = tiredAtk(u) * (u.power || 1) * resDmgOut(u.team);
  if (isMinion(u)) u.tired = Math.min(1, (u.tired || 0) + TIRE_PER_SWING);
  if (u.def.ranged) {
    const dx = tgt.x - u.x, dy = tgt.y - u.y, d = Math.hypot(dx, dy) || 1;
    const big = u.structure, sp = big ? 360 : 420;
    const boom = u.kind === 'wizard' && Math.random() < 0.2 ? 70 : 0; // wizards sometimes throw a fireball
    const small = u.kind === 'archer';
    const oy = u.kind === 'turret' ? -u.r * 1.35 : 0; // turrets fire from their crystal
    bshots.push({ team: u.team, src: u.elem, elem: u.elem, x: u.x + dx / d * u.r, y: u.y + oy + dy / d * u.r, vx: dx / d * sp, vy: dy / d * sp,
                  dmg: u.def.dmg * atk * (boom ? 1.3 : 1), r: big ? 9 : boom ? 9 : small ? 4 : 6, life: 1.8, boom, arrow: small,
                  color: TYPE_COLOR[u.elem] || TEAM_COLOR[u.team], spin: rnd(0, TAU) });
    u.fireFlash = 0.18;
    return;
  }
  if (u.kind === 'titan') {
    // the slam lands a beat after the swing starts
    u.slamT = 0.5;
    u.slamAt = { x: tgt.x, y: tgt.y, tgt };
    return;
  }
  hitUnit(tgt, u.def.dmg * atk * matchup(u.elem, tgt));
}

function titanSlam(u) {
  const { x, y, tgt } = u.slamAt;
  const pw = (u.power || 1) * resDmgOut(u.team);
  if (tgt && !tgt.dead) hitUnit(tgt, u.def.dmg * pw * matchup(u.elem, tgt));
  // everything of the other side nearby gets hit too
  const opp = u.team === 'blue' ? foes : friends.concat(state === 'play' ? [player] : []);
  for (const o of opp) if (o !== tgt && !o.dead && Math.hypot(o.x - x, o.y - y) < u.def.splash) hitUnit(o, u.def.dmg * 0.5 * pw * matchup(u.elem, o));
  ring(x, y, u.def.splash, TYPE_COLOR[u.elem] || TEAM_COLOR[u.team], 0.35);
  ring(x, y, u.def.splash * 0.5, '#d8c8a0', 0.25);
  if (u.elem) elemHit(u.elem, x, y, 2.6);
  for (let i = 0; i < 14; i++) {
    const a = rnd(0, TAU), sp = rnd(60, 180);
    particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.5, r: rnd(3, 6), life: 1, decay: rnd(1.5, 2.5), color: '#8a7a5e' });
  }
  shake = Math.max(shake, 5);
  SFX.explode(false);
  u.slamAt = null;
}

// Damage from the AI and laser walls. Your own hits go through damageFoe.
function hitUnit(t, dmg) {
  if (t === player) { hurtPlayer(dmg); return; }
  if (t.proxyOf) { if (!t.dead) hurtPlayer(dmg, heroOf(t)); return; }
  if (t.kind === 'critter') { t.hp -= dmg; burst(t.x, t.y, '#ccc', 4, 100); if (t.hp <= 0) t.life = 0; return; }
  if (t.dead) return;
  if (shielded(t)) {
    if (t.txtCd <= 0) { floatText(t.x, t.y - t.r - 10, shieldText(t), '#bde', 13); t.txtCd = 0.8; }
    return;
  }
  t.hp -= minionHit(t, mageGuard(t, dmg)) * (t.unit ? resDmgIn(t.team) : 1);
  t.flash = 0.12;
  if (t.hp <= 0) unitFell(t);
}

// A unit is gone. Whoever's side it wasn't on scores for it.
function unitFell(u) {
  if (u.mage && u.mage.phoenix > 0) {
    // a red wizard's Phoenix: back up once, in flames
    u.mage.phoenix = 0; u.hp = u.maxHp;
    burst(u.x, u.y, '#ffb04a', 50, 420);
    floatText(u.x, u.y - 50, 'PHOENIX!', '#ff8a3a', 18);
    return;
  }
  u.dead = true;
  const by = otherTeam(u.team);
  if (u.kind === 'sigil') { teamScore(by, u.def.pts, u.x, u.y - u.r - 20, 'Sigils'); const S = stats(by); if (S) S.sigils++; }

  burst(u.x, u.y, TEAM_COLOR[u.team], u.structure ? 60 : 14, u.structure ? 420 : 240);
  if (u.kind === 'wizard') teams[u.team].wizQ.push({ t: 12 });
  if (u.kind === 'sigil') {
    teams[u.team].sigilT = 3;
    shake = Math.max(shake, 10);
    SFX.bossDown();
    showBanner(by === 'blue' ? `You broke the red sigil! +${u.def.pts}` : `Red broke your sigil! +${u.def.pts} to red`, 'Bonus build turn for ' + (by === 'blue' ? 'you!' : 'red'), 3);
    teams.bonus = teams.bonus || { blue: 0, red: 0 };
    teams.bonus[by]++;

  if (u.kind === 'nexus') { battleOver(u.team); return; }
  if (u.kind === 'turret') {
    shake = Math.max(shake, 12);
    SFX.explode(true);
    computeTerritory();
    showBanner(u.team === 'red' ? 'Red turret destroyed!' : 'Your turret has fallen!', 'That ground is open again', 3);
  }
}

// who'd get the ground bonus right now (null if level)
function groundLeader() {
  if (!teams || teams.blue.cells === teams.red.cells) return null;
  return teams.blue.cells > teams.red.cells ? 'blue' : 'red';
}

// The match ends when the clock runs out or a base falls. Destroying a base
// scores 60; the 140 for the most ground is paid now; then most points wins.
function battleOver(baseFell) {
  if (state !== 'play' && state !== 'dead') return;
  if (baseFell) { teams[otherTeam(baseFell)].score += BASE_BONUS; bookScore(otherTeam(baseFell), 'Base', BASE_BONUS); }
  computeTerritory();
  if (teams.stats) teams.stats.land.push([Math.round(MATCH_TIME - teams.time), teams.blue.cells, teams.red.cells]);
  const g = groundLeader();
  if (g) { teams[g].score += GROUND_BONUS; teams.groundTo = g; bookScore(g, 'Most ground', GROUND_BONUS); }
  const b = teams.blue.score, r = teams.red.score;
  teams.endedBy = baseFell ? 'base' : 'time';
  teams.baseFell = baseFell;
  teams.result = b > r ? 'win' : b < r ? 'lose' : 'draw';
  state = teams.result === 'win' ? 'won' : 'lost';
  overlayT = 0; endScroll = 0;
  flash = 1;
  teams.result === 'win' ? SFX.bossDown() : SFX.death();

}

function updateUnit(u, dt) {

  u.cd -= dt * (1 - (u.stagger || 0)) * (mode === 'battle' ? resRate(u.team) : 1); // rattled: attacks come slower

    u.slamT -= dt;
    if (u.slamT <= 0.18 && u.slamAt) titanSlam(u);
    if (u.slamT > 0) return; // a titan mid-swing stays put
  }
  if (u.kind === 'sigil') { u.wall = Math.max(0, u.wall - dt); return; }
  if (u.castT > 0) return; // a wizard winding up a spell stands still

    if (t && Math.hypot(t.x - u.x, t.y - u.y) <= u.def.range + (t.r || PLAYER_R)) unitAttack(u, t);
    return;
  }

  if (u.kind === 'wizard' && u.hp < u.maxHp * 0.3) u.retreat = true;
  // Very Hard: worn-out minions go home to rest instead of fighting at half strength
  if (smartRed(u) && aiSkill() >= 0.5 && sharp(u) && isMinion(u) && u.tired > 0.7 && !u.retreat) { u.retreat = true; u.inPush = false; }

        const d = Math.hypot(t.x - u.x, t.y - u.y) - (t.r || PLAYER_R);
        if (d > u.def.range - 4) { tx = t.x; ty = t.y; } else unitAttack(u, t);
      } else {

        const fwd = -teamSide(u.team) * 0.6; // stand mostly on the side facing the enemy

        if (Math.hypot(tx - u.x, ty - u.y) < 10) tx = null;
      }
    }

    const L = teamLeader(u.team);
    const t = findTarget(u);

      const d = Math.hypot(t.x - u.x, t.y - u.y) - (t.r || PLAYER_R);
      if (d > u.def.range - 4) { tx = t.x; ty = t.y; } else unitAttack(u, t);
    } else {
      const rad = u.kind === 'titan' ? 120 : u.kind === 'wizard' ? 90 : 60 + (u.wob % 1) * 50;
      tx = L.x - L.face.x * 40 + Math.cos(u.slot) * rad;
      ty = L.y - L.face.y * 40 + Math.sin(u.slot) * rad;
      if (Math.hypot(tx - u.x, ty - u.y) < 10) tx = null;
    }
  } else {
    const t = findTarget(u);
    if (t) {
      const d = Math.hypot(t.x - u.x, t.y - u.y) - (t.r || PLAYER_R);
      if (d > u.def.range - 4) { tx = t.x; ty = t.y; } else {
        unitAttack(u, t);
        // Very Hard: shooters step back from anything that wants to get close
        if (smartRed(u) && aiSkill() >= 0.75 && sharp(u) && u.def.ranged && !t.structure && d < u.def.range * 0.5 && !(t.def && t.def.ranged)) { tx = u.x + (u.x - t.x); ty = u.y + (u.y - t.y); }
      }
    } else {
      const o = objectiveFor(u);
      if (o) {
        // spread out along the field until close, then converge
        const near = Math.abs(o.x - u.x) < 420;
        tx = o.x; ty = near ? o.y : (u.laneY + o.y) / 2;
      }
    }
  }
  if (tx !== null) {
    const spd = u.spd * resSpeed(u.team) * (u.mage && u.mage.haste > 0 ? 1.6 : 1) * (u.slow > 0 ? 0.5 : 1) * (u.hex > 0 ? 0.4 : 1) * (u.root > 0 ? 0 : 1) * tiredSpd(u);
    const ox = u.x, oy = u.y;
    moveToward(u, tx, ty, spd, dt, 0);
    const moved = Math.hypot(u.x - ox, u.y - oy);
    if (isMinion(u)) u.tired = Math.min(1, (u.tired || 0) + moved * TIRE_PER_PX);
    u.walk += moved;
    u.face = u.x !== ox ? Math.sign(u.x - ox) : u.face || 1;
    if (u.kind === 'titan' && moved > 0 && Math.floor(u.walk / 34) !== Math.floor((u.walk - moved) / 34)) {
      // footfall: a puff of dust under the stepping foot
      const side = Math.floor(u.walk / 34) % 2 ? 1 : -1;
      for (let i = 0; i < 4; i++) particles.push({ x: u.x + side * u.r * 0.45, y: u.y + u.r * 0.95, vx: rnd(-40, 40), vy: rnd(-25, 0), r: rnd(2, 4), life: 0.8, decay: 2.2, color: '#7a6c54' });
    }
  }
}

// ── elemental shot effects ──
function shotTrail(sh) {
  const sp = Math.hypot(sh.vx, sh.vy) || 1, bx = -sh.vx / sp, by = -sh.vy / sp;
  const p = (color, r, life, spread) => particles.push({ x: sh.x + bx * sh.r, y: sh.y + by * sh.r, vx: bx * 40 + rnd(-spread, spread), vy: by * 40 + rnd(-spread, spread), r, life, decay: 2.6, color });
  switch (sh.elem) {
    case 'fire':   p(Math.random() < 0.5 ? '#ffb04a' : '#ff5a2a', rnd(2, 4), 0.8, 30); break;   // embers
    case 'water':  p('#bfe6ff', rnd(1.5, 2.5), 0.6, 20); break;                                 // droplets
    case 'earth':  p('#8a6a44', rnd(1.5, 3), 0.7, 25); break;                                   // grit
    case 'air':    p('rgba(255,250,200,0.8)', 1.5, 0.5, 40); break;                             // gusts
    case 'spirit': p(Math.random() < 0.5 ? '#e6ccff' : '#c77dff', rnd(1.5, 2.5), 0.9, 15); break; // motes
  }
}
// an impact shaped like its element; size scales the effect
function elemHit(elem, x, y, size) {

  const c = TYPE_COLOR[elem];

    for (let i = 0; i < n; i++) {
      const a = rnd(0, TAU), s = rnd(spd * 0.3, spd);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - (up || 0), r: rnd(rmin, rmax), life: 1, decay: rnd(1.8, 3), color });
    }

  else if (elem === 'earth') puff(x, y + 4, '#c2a57a', n + 1, 14 * size, 12);
  else if (elem === 'water') puff(x, y, '#e8f6ff', 1, 14 * size, 8);
  else if (elem === 'air') leafSwirl(x, y, 3 + n * 2, 160 * size);
  else if (elem === 'spirit') puff(x, y, '#e6ccff', 1, 18 * size, 10);

    case 'fire':   spray(10 * size, 180 * size, '#ff5a2a', 2, 4, 60); spray(6 * size, 120 * size, '#ffd24a', 1.5, 3, 80); break;
    case 'water':  ring(x, y, 16 * size, '#bfe6ff', 0.35); spray(10 * size, 160 * size, '#3ab0ff', 1.5, 3, 40); break;
    case 'earth':  spray(8 * size, 140 * size, '#8a6a44', 2, 5); spray(5 * size, 90 * size, '#b5834a', 2, 4); break;
    case 'air':    ring(x, y, 14 * size, '#f5e663', 0.25); ring(x, y, 24 * size, 'rgba(255,250,200,0.6)', 0.4); spray(6 * size, 200 * size, '#fffbe0', 1, 2); break;
    case 'spirit': ring(x, y, 18 * size, c, 0.45); spray(10 * size, 120 * size, '#e6ccff', 1.5, 3); break;
  }
}
function drawElemShot(sh) {
  const sp = Math.hypot(sh.vx, sh.vy) || 1, ux = sh.vx / sp, uy = sh.vy / sp, r = sh.r;
  ctx.save();
  ctx.translate(sh.x, sh.y);
  switch (sh.elem) {
    case 'fire': {
      // a flickering fireball with a flame tail
      const fl = 1 + Math.sin(sh.spin * 3) * 0.15;
      ctx.rotate(Math.atan2(uy, ux));
      const g = ctx.createLinearGradient(-r * 3.5, 0, r, 0);
      g.addColorStop(0, 'rgba(255,90,42,0)'); g.addColorStop(0.6, 'rgba(255,90,42,0.8)'); g.addColorStop(1, '#ffd24a');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.moveTo(-r * 3.5 * fl, 0); ctx.quadraticCurveTo(-r, -r * 1.1, r * 0.4, -r * 0.8); ctx.lineTo(r * 0.4, r * 0.8); ctx.quadraticCurveTo(-r, r * 1.1, -r * 3.5 * fl, 0); ctx.fill();
      const c2 = ctx.createRadialGradient(r * 0.2, 0, 0, r * 0.2, 0, r * 1.1);
      c2.addColorStop(0, '#fff'); c2.addColorStop(0.4, '#ffd24a'); c2.addColorStop(1, '#ff5a2a');
      ctx.fillStyle = c2; ctx.beginPath(); ctx.arc(r * 0.2, 0, r * fl, 0, TAU); ctx.fill();
      break;
    }
    case 'water': {
      // a droplet pointed the way it flies
      ctx.rotate(Math.atan2(uy, ux));
      ctx.beginPath(); ctx.moveTo(r * 1.6, 0); ctx.quadraticCurveTo(0, -r * 1.2, -r, 0); ctx.quadraticCurveTo(0, r * 1.2, r * 1.6, 0);
      ctx.fillStyle = '#3ab0ff'; ctx.fill();
      ctx.strokeStyle = '#bfe6ff'; ctx.lineWidth = 1.5; ctx.stroke();
      circle(r * 0.3, -r * 0.3, r * 0.3, 'rgba(255,255,255,0.85)');
      break;
    }
    case 'earth': {
      // a tumbling chunk of rock
      ctx.rotate(sh.spin);
      ctx.beginPath();
      for (let i = 0; i < 6; i++) { const a = i * TAU / 6, rr = r * (i % 2 ? 0.8 : 1.15); i ? ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr) : ctx.moveTo(Math.cos(a) * rr, Math.sin(a) * rr); }
      ctx.closePath(); ctx.fillStyle = '#8a6a44'; ctx.fill(); ctx.strokeStyle = '#5a4430'; ctx.lineWidth = 1.5; ctx.stroke();
      circle(-r * 0.25, -r * 0.25, r * 0.3, '#b5834a');
      break;
    }
    case 'air': {
      // a spinning wind blade
      ctx.rotate(sh.spin * 1.5);
      ctx.strokeStyle = '#f5e663'; ctx.lineCap = 'round';
      for (let i = 0; i < 3; i++) {
        ctx.lineWidth = 2.5 - i * 0.6; ctx.globalAlpha = 1 - i * 0.25;

      }
      ctx.globalAlpha = 1;
      circle(0, 0, r * 0.35, '#fffbe0');
      break;
    }
    case 'spirit': {
      // a glowing orb with sparks circling it
      const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r * 2.2);
      g.addColorStop(0, '#fff'); g.addColorStop(0.35, '#c77dff'); g.addColorStop(1, 'rgba(199,125,255,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 2.2, 0, TAU); ctx.fill();

      break;
    }
  }
  ctx.restore();
}

// split a wave between the three minion kinds by the mix (largest remainders)
function waveKinds(mix, n) {
  const raw = MINION_KINDS.map(k => mix[k] * n), out = raw.map(Math.floor);
  let left = n - out.reduce((a, b) => a + b, 0);
  const order = raw.map((v, i) => [v - Math.floor(v), i]).sort((a, b) => b[0] - a[0]);
  for (let k = 0; k < left; k++) out[order[k][1]]++;
  return MINION_KINDS.flatMap((k, i) => Array(out[i]).fill(k));
}
// red's mix: random on Easy; on Hard it leans toward whatever beats your favourite
// the element that beats the most common element in a list of units (null if empty)
function counterTo(list) {
  const n = {};
  for (const u of list) n[u.elem] = (n[u.elem] || 0) + (u.kind === 'titan' ? 3 : 1);
  const top = Object.keys(n).sort((a, b) => n[b] - n[a])[0];
  return top ? ELEM_CYCLE.find(e => elemBeats(e) === top) : null;
}
function redMix() {
  // lean toward whatever beats your army and turrets; the sharper, the harder it leans
  const sk = aiSkill();
  const w = MINION_KINDS.map(() => 0.3 + Math.random() * (1 - sk));
  for (const u of friends) {
    if (u.dead || !u.elem || u.kind === 'nexus' || u.kind === 'sigil') continue;
    const counter = MINION_KINDS.find(k => elemBeats(UNITS[k].elem) === u.elem);
    w[MINION_KINDS.indexOf(counter)] += (u.kind === 'titan' || u.kind === 'turret' ? 0.4 : 0.15) * sk;

  const t = w.reduce((a, b) => a + b, 0);
  return Object.fromEntries(MINION_KINDS.map((k, i) => [k, w[i] / t]));
}

// ── Very Hard: red thinks as one army ──
// Twice a second red picks one target (an open sigil first, else the turret
// that's cheapest to break, else the base), gathers its army at a rally
// point, then pushes together. Units near a threatened red building break
// off to defend it. Each unit focuses fire with its neighbours, ranged units
// back away from melee, and tired minions go home to rest.
// ── red's commander: every level plays to win ──
// Red always chases points: it weighs what each target is worth (a sigil 50
// and a bonus build, a turret 5 plus the ground it holds, the base 60 and the
// match), watches the scoreboard and the land race, and pushes, defends or
// gambles to come out ahead. The level sets how WELL it does that: how often
// it rethinks, how sound its choices are, how tightly the army masses and
// focuses fire, whether it defends, kites and rests its tired minions.

const net = { role: null, send: () => {}, sendT: 0, posT: 0, mixT: 0 };
let curSide = 'blue';                       // whose spells are being run right now (host)
let rivalP = null, rivalProxy = null, hostProxy = null;
let otherHero = null;                       // guest: the host's wizard, to draw
let unitSeq = 0;
const redSide = { shots: [], allies: [], traps: [], zones: [], waves: [], meteors: [], storms: [], discovered: new Set(), seq: [] };
let netEvents = [];                         // host → guest: visual effects and messages to replay

// Run fn as your friend: their wizard is "player", blue's units are the targets,
// and their own spells, helpers and pools are the live lists.
function withSide(side, fn, caster) {
  if (side !== 'red' || !(versus ? net.role === 'host' : aiMagic())) return fn();
  const saved = { player, foes, shots, allies, traps, zones, waves, meteors, storms, discovered, seq };
  player = caster || rivalP;
  foes = blueTargets();
  ({ shots, allies, traps, zones, waves, meteors, storms, discovered, seq } = redSide);
  curSide = 'red';
  try { return fn(); }
  finally {
    Object.assign(redSide, { shots, allies, traps, zones, waves, meteors, storms, discovered, seq });
    ({ player, foes, shots, allies, traps, zones, waves, meteors, storms, discovered, seq } = saved);
    curSide = 'blue';
  }
}
// what your friend's spells can hit: blue's units, your helpers, and you
function blueTargets() {
  hostProxy.x = hostP.x; hostProxy.y = hostP.y; hostProxy.dead = state !== 'play' || hostP.onBoat;
  return friends.filter(u => !u.dead).concat(allies.filter(a => a.kind === 'critter').map(helperTarget), [hostProxy]);
}
// helpers can be hit like units
function helperTarget(a) {
  if (!a.asTarget) a.asTarget = { unit: true, team: 'helper', kind: 'helper', helper: a, def: { mult: {}, pts: 2, name: 'Helper' }, structure: true, r: a.r };
  const t = a.asTarget; t.x = a.x; t.y = a.y; t.hp = a.hp; t.maxHp = a.maxHp; t.dead = a.life <= 0;
  return t;
}
function heroProxy(of, team) {
  return { unit: true, proxyOf: of, team, kind: 'hero', def: { mult: {}, pts: 10, name: 'Wizard', reach: 0 }, structure: true, r: PLAYER_R, hp: 1, maxHp: 1, x: 0, y: 0, dead: false, txtCd: 0 };
}
function heroOf(proxy) { return proxy.proxyOf === 'rival' ? rivalP : hostP; }

function makeRival() {
  const keep = player;
  player = {};
  resetPlayer();
  rivalP = player;
  player = keep;
  rivalP.isRival = true;
  rivalP.robe = '#7a2d2d'; rivalP.hat = '#c03a3a';
  const fp = fountainPos('red');
  rivalP.x = fp.x; rivalP.y = fp.y; rivalP.face = { x: -1, y: 0 };
  rivalP.tp = 0;
}

function startVersusHost(send) {
  net.role = 'host'; net.send = send; versus = true;
  startBattle('easy');
  unitSeq = 0; for (const u of friends.concat(foes)) u.id = ++unitSeq;
  makeRival();
  Object.assign(redSide, { shots: [], allies: [], traps: [], zones: [], waves: [], meteors: [], storms: [], discovered: new Set(), seq: [] });
  rivalProxy = heroProxy('rival', 'red');
  hostProxy = heroProxy('host', 'blue');
  foes.push(rivalProxy);
  teams.redOrder = 'spread';
  teams.redOrders = { minion: 'attackTurrets', titan: 'attackTurrets' };
  teams.pendingRed = null; teams.buildElemRed = 'water';
  showBanner('Duel! Universes collide', 'Your friend leads the red universe', 4);
  net.send({ t: 'start' });
}

// your friend fell: back at their fountain in 5 seconds
function rivalDown() {
  rivalP.hp = 0; rivalP.dead = true; rivalP.respawnT = 5;
  rivalProxy.dead = true;
  rivalP.charging = null; rivalP.loaded = null;
  burst(rivalP.x, rivalP.y, TEAM_COLOR.red, 30, 260);
  scoreKill('blue', 'hero', rivalP.x, rivalP.y - 30);
  showBanner('You defeated your friend’s wizard! +10', '', 2.5);
  netEvents.push(['you-fell']);
}

function updateRival(dt) {
  if (rivalP.dead) {
    rivalP.respawnT -= dt;
    if (rivalP.respawnT <= 0) {
      const tp = rivalP.tp + 1;
      withSide('red', () => { resetPlayer(); });
      Object.assign(rivalP, { isRival: true, robe: '#7a2d2d', hat: '#c03a3a', dead: false, invuln: 2, tp });
      const fp = fountainPos('red'); rivalP.x = fp.x; rivalP.y = fp.y; rivalP.face = { x: -1, y: 0 };
      rivalProxy.dead = false;
    }
  }
  rivalProxy.x = rivalP.x; rivalProxy.y = rivalP.y; rivalProxy.dead = !!rivalP.dead;
  withSide('red', () => {
    if (!player.dead) heroTimers(dt);
    potency = 1;
    updateShots(dt);
    updateAllies(dt);
    updateStorms(dt);
    updateEffects(dt);
    potency = 1;
  });
  // ship the battle to your friend
  net.sendT -= dt;
  if (net.sendT <= 0) { net.sendT = 0.1; net.send(makeSnapshot()); netEvents = []; }
}

// your friend's actions arrive here (positions are in the host's coordinates)
function hostReceive(m) {
  if (!versus || !rivalP) return;
  const R = fn => withSide('red', fn);
  switch (m.t) {
    case 'pos':
      if (!rivalP.dead && !rivalP.charging && m.tp === rivalP.tp) { rivalP.x = m.x; rivalP.y = m.y; rivalP.face = { x: m.fx, y: m.fy }; }
      break;
    case 'cast': if (!rivalP.dead && /^[SWFEA]{1,7}$/.test(m.k)) R(() => { seq = m.k.split(''); castSequence(); }); break;
    case 'fire': if (!rivalP.dead) R(fireLoaded); break;
    case 'arrow': if (!rivalP.dead) R(() => shootArrow(m.x, m.y)); break;
    case 'build':
      if (teams.pendingRed && !rivalP.dead) {
        teams.buildElemRed = ELEM_CYCLE.includes(m.elem) ? m.elem : 'fire';
        if (m.key === 'turret') {
          if (canBuildAt(rivalP.x, rivalP.y, 'red')) { buildTurret('red', rivalP.x, rivalP.y, teams.buildElemRed); teams.pendingRed = null; }
          else netEvents.push(['msg', 'Can’t build here: not in red ground or on a tree, rock or tower', '#ccc']);
        } else { buildTitan('red', teams.buildElemRed); teams.pendingRed = null; }
      }
      break;
    case 'mix': if (m.mix) teams.red.mix = Object.fromEntries(MINION_KINDS.map(k => [k, Math.max(0, +m.mix[k] || 0)])); break;
    case 'order': teams.redOrder = m.v === 'follow' ? 'follow' : 'spread'; break;
    case 'orders': if (m.grp === 'minion' || m.grp === 'titan') teams.redOrders[m.grp] = m.v; break;
    case 'skin': teams.redSkin = m.v === 'space' ? 'space' : 'wizard'; break;
    case 'bye': friendLeft(); break;
  }
}

// a duel's red side is in your friend's hands (even while their wizard
// respawns) until they leave; then the computer takes over
function rivalPlaying() { return versus && net.role === 'host' && rivalP && !(rivalP.dead && rivalP.respawnT > 1e8); }

function friendLeft() {
  if (!versus) return;
  setTimeout(hangUp, 0);
  showBanner('Your friend left', 'The red side carries on without them', 3);
  if (net.role === 'host') {
    if (rivalProxy) rivalProxy.dead = true;
    if (rivalP) { rivalP.dead = true; rivalP.respawnT = 1e9; }
    teams.pendingRed = null;
  } else {
    mirrorArena(false); versus = false; net.role = null; otherHero = null;
    if (state === 'play' || state === 'dead') state = 'title';
  }
}

// ── the live picture the host sends ──
const UNIT_KINDS = Object.keys(UNITS);
const STATUS_KEYS = ['freeze', 'stun', 'stone', 'hex', 'fear', 'confuse', 'root', 'burn', 'poison', 'slow'];
const r1 = v => Math.round((v || 0) * 10) / 10;
function packHero(p, disc) {
  return {
    x: Math.round(p.x), y: Math.round(p.y), hp: r1(p.hp), mhp: p.maxHp, mana: r1(p.mana), mm: p.maxMana,
    fx: r1(p.face.x), fy: r1(p.face.y), inv: r1(p.invuln),
    b: ['skin', 'haste', 'empower', 'ward', 'mirror', 'sanct', 'regen', 'phoenix', 'omni'].map(k => r1(p[k])),
    ch: p.charging ? [p.charging.key, r1(p.charging.t), p.charging.max] : null,
    ld: p.loaded ? [p.loaded.key, p.loaded.left] : null,
    cg: p.charge ? CHARGE_TYPES.map(t => r1(p.charge[t])) : null,
    dead: !!p.dead, rt: r1(p.respawnT), tp: p.tp || 0, disc,
  };
}
function makeSnapshot() {
  const T = teams, both = (a, b) => a.concat(b);
  return {
    t: 'snap', sk: mySkin,
    st: state, res: T.result, bd: state === 'won' || state === 'lost' ? T.breakdown || null : null,
    ss: state === 'won' || state === 'lost' ? T.stats || null : null, eb: T.endedBy || null, bf: T.baseFell || null, gt: T.groundTo || null,
    sc: [T.blue.score, T.red.score], time: r1(T.time), tl: T.tally ? [T.tally.blue, T.tally.red] : [0, 0], rs: T.res || null,
    bt: [T.build.team, r1(T.build.t)], pr: T.pendingRed ? r1(T.pendingRed.t) : null,
    me: packHero(rivalP, redSide.discovered.size), host: packHero(hostP, discovered.size),
    u: friends.concat(foes).filter(u => !u.dead && !u.proxyOf).map(u => [
      u.id, u.team === 'blue' ? 0 : 1, UNIT_KINDS.indexOf(u.kind), Math.round(u.x), Math.round(u.y), r1(u.hp), r1(u.maxHp),
      u.elem ? ELEM_CYCLE.indexOf(u.elem) : -1, r1(u.wall), Math.round(u.walk || 0), r1(u.slamT), u.face || 1, r1(u.fireFlash),
      u.retreat ? 1 : 0, r1(Math.max(0, u.cd || 0) / (u.def.cd || 1)),
      STATUS_KEYS.map(k => r1(u[k] > 0 ? u[k] : 0)), r1(u.tired),
    ]),
    bs: bshots.map(s => [s.team === 'blue' ? 0 : 1, Math.round(s.x), Math.round(s.y), Math.round(s.vx), Math.round(s.vy), s.r, s.elem || '', s.arrow ? 1 : 0]),
    sh: both(shots, redSide.shots).map(s => [Math.round(s.x), Math.round(s.y), Math.round(s.vx), Math.round(s.vy), r1(s.r), s.type]),
    zn: both(zones, redSide.zones).map(z => [z.type || '', Math.round(z.x), Math.round(z.y), Math.round(z.r), r1(z.life), z.max, z.spec ? z.spec.elem : '', z.spec && z.spec.fx.has('poison') ? 1 : 0, r1(z.charged)]),
    tr: both(traps, redSide.traps).map(t => [Math.round(t.x), Math.round(t.y), t.arm > 0 ? 1 : 0, t.spec ? t.spec.elem : '']),
    ts: tempSolids.map(b => [Math.round(b.x), Math.round(b.y), b.r, r1(b.life), b.elem || '', b.solid === false ? 0 : 1]),
    al: both(allies.map(a => [a, 0]), redSide.allies.map(a => [a, 1])).map(([a, side]) => [a.kind, Math.round(a.x), Math.round(a.y), r1(a.life), a.elem || '', r1(a.r), r1(a.hp), r1(a.maxHp), r1(a.ang), side]),
    wv: both(waves, redSide.waves).map(w => [Math.round(w.x), Math.round(w.y), Math.round(w.r), w.maxR]),
    mt: both(meteors, redSide.meteors).map(m => [Math.round(m.x), Math.round(m.y), r1(m.t), m.max]),
    ev: netEvents.slice(0, 160),
  };
}

// ── the friend's side: a mirrored copy of the battle ──
// Everything is flipped left↔right and blue↔red, so you're blue on the left.
let guestUnits = new Map();
let solidsMirrored = false;
function mirrorArena(on) {
  if (solidsMirrored === on) return;
  for (const o of battleSolids) o.x = -o.x;
  battleGrid.clear();
  for (const [k, v] of buildGrid(battleSolids)) battleGrid.set(k, v);
  solidsMirrored = on;
}
const flipTeam = t => (t === 'blue' ? 'red' : 'blue');

function startVersusGuest(send) {
  net.role = 'guest'; net.send = send; versus = true;
  setMode('battle'); mirrorArena(true);
  difficulty = 'easy';
  resetPlayer(); clearCombat();
  const fp = fountainPos(); player.x = fp.x; player.y = fp.y; player.face = { x: 1, y: 0 }; player.tp = 0;
  foes = []; friends = []; bshots = []; links = []; chests = []; scrolls = []; boat.x = boat.y = 1e6;
  discovered = new Set(); score = 0; elapsed = 0; kills = 0;
  teams = {
    blue: { score: 0, cells: 0, minions: 10, mix: evenMix() }, red: { score: 0, cells: 0, mix: evenMix() },
    time: MATCH_TIME, terrRecalc: 0, build: { team: 'blue', t: BUILD_EVERY }, pending: null, result: null,
    order: 'spread', orders: { minion: 'attackTurrets', titan: 'attackTurrets' }, buildElem: 'water',
  };
  guestUnits = new Map(); otherHero = null;
  net.send({ t: 'skin', v: mySkin });
  state = 'play';
  showBanner('Duel! Universes collide', 'Your universe is blue, on the left', 4);
}

function unpackHero(h, into) {
  Object.assign(into, {
    hp: h.hp, maxHp: h.mhp, mana: h.mana, maxMana: h.mm, invuln: h.inv,
    charging: h.ch ? { key: h.ch[0], t: h.ch[1], max: h.ch[2] } : null,
    loaded: h.ld ? { key: h.ld[0], left: h.ld[1] } : null,
    dead: h.dead,
  });
  ['skin', 'haste', 'empower', 'ward', 'mirror', 'sanct', 'regen', 'phoenix', 'omni'].forEach((k, i) => into[k] = h.b[i]);
  if (h.cg) into.charge = Object.fromEntries(CHARGE_TYPES.map((t, i) => [t, h.cg[i]]));
  return into;
}

function guestReceive(m) {
  if (m.t === 'bye') { friendLeft(); return; }
  if (m.t !== 'snap' || net.role !== 'guest') return;
  const X = x => -x;
  // you
  const me = m.me;
  unpackHero(me, player);
  if (me.tp !== player.tp || me.dead) { player.x = X(me.x); player.y = me.y; player.tp = me.tp; } // respawned or blinked
  if (me.dead) { if (state === 'play') { state = 'dead'; } overlayT = 5 - me.rt; }
  else if (state === 'dead') state = 'play';
  teams.redSkin = m.sk === 'space' ? 'space' : 'wizard'; // the host's look is the red side's
  // the host's wizard
  otherHero = unpackHero(m.host, otherHero || { robe: '#7a2d2d', hat: '#c03a3a', isRival: true });
  otherHero.x = X(m.host.x); otherHero.y = m.host.y; otherHero.face = { x: -m.host.fx, y: m.host.fy };
  // scores and turns (flipped: you are "blue")
  teams.blue.score = m.sc[1]; teams.red.score = m.sc[0]; teams.time = m.time;
  if (m.tl) teams.tally = { blue: m.tl[1], red: m.tl[0] };
  if (m.rs) teams.res = { blue: m.rs.red, red: m.rs.blue };
  teams.build = { team: flipTeam(m.bt[0]), t: m.bt[1] };
  if (m.pr === null) teams.pending = null; else if (!teams.pending || teams.pending.t > m.pr + 0.5) teams.pending = { t: m.pr };
  // units: keep the same objects so they glide between pictures
  const seen = new Set(), F = [], E = [];
  for (const a of m.u) {
    const [id, team, ki, x, y, hp, mhp, ei, wall, walk, slam, face, ff, ret, cdf, st, tired] = a;
    const kind = UNIT_KINDS[ki], def = UNITS[kind];
    let u = guestUnits.get(id);
    if (!u) { u = { id, unit: true, kind, def, x: X(x), y, wob: rnd(0, TAU), slot: rnd(0, TAU), kx: 0, ky: 0, structure: !!def.structure, r: def.r }; guestUnits.set(id, u); }
    Object.assign(u, { team: flipTeam(team ? 'red' : 'blue'), tx: X(x), ty: y, hp, maxHp: mhp, elem: ei >= 0 ? ELEM_CYCLE[ei] : null,
                       wall, walk, slamT: slam, face: -face, fireFlash: ff, retreat: !!ret, cd: cdf * def.cd, tired: tired || 0, dead: false });
    STATUS_KEYS.forEach((k, i) => u[k] = st[i]);
    seen.add(id);
    (u.team === 'blue' ? F : E).push(u);
  }
  for (const id of guestUnits.keys()) if (!seen.has(id)) guestUnits.delete(id);
  friends = F; foes = E;
  bshots = m.bs.map(([t, x, y, vx, vy, r, el, ar]) => { const team = flipTeam(t ? 'red' : 'blue'); return { team, x: X(x), y, vx: -vx, vy, r, elem: el || null, arrow: !!ar, spin: rnd(0, TAU), color: TYPE_COLOR[el] || TEAM_COLOR[team], life: 2 }; });
  shots = m.sh.map(([x, y, vx, vy, r, type]) => ({ x: X(x), y, vx: -vx, vy, r, type, color: TYPE_COLOR[type] || '#fff', life: 2 }));
  zones = m.zn.map(([type, x, y, r, life, max, el, poison, charged]) => ({ type: type || undefined, x: X(x), y, r, life, max, charged, tick: 1,
    spec: el ? { elem: el, fx: new Set(poison ? ['poison'] : []) } : undefined }));
  traps = m.tr.map(([x, y, arming, el]) => ({ x: X(x), y, arm: arming ? 1 : 0, spec: el ? { elem: el } : undefined }));
  tempSolids = m.ts.map(([x, y, r, life, el, solid]) => ({ x: X(x), y, r, life, elem: el || undefined, solid: !!solid }));
  allies = m.al.map(([kind, x, y, life, el, r, hp, mhp, ang]) => ({ kind, x: X(x), y, life, max: life, elem: el || undefined, r, hp, maxHp: mhp, ang }));
  waves = m.wv.map(([x, y, r, maxR]) => ({ x: X(x), y, r, maxR, speed: 0, hit: new Set() }));
  meteors = m.mt.map(([x, y, t, max]) => ({ x: X(x), y, t, max }));
  // effects and messages
  for (const e of m.ev) {
    switch (e[0]) {
      case 'ft': floatText(X(e[1]), e[2], e[3], e[4], e[5]); break;
      case 'ring': ring(X(e[1]), e[2], e[3], e[4], e[5]); break;
      case 'eh': elemHit(e[1], X(e[2]), e[3], e[4]); break;
      case 'msg': castMessage(e[1], e[2]); break;
      case 'banner': showBanner(e[1], e[2], e[3]); break;
      case 'you-fell': SFX.death(); break;
    }
  }
  // the end (from your side)
  if (m.st === 'won' || m.st === 'lost') {
    if (m.bd) teams.breakdown = { blue: m.bd.red, red: m.bd.blue };
    if (m.ss) teams.stats = { blue: m.ss.red, red: m.ss.blue, land: m.ss.land.map(([t, b, r]) => [t, r, b]) };
    if (state !== 'won' && state !== 'lost') {
      teams.result = m.res === 'win' ? 'lose' : m.res === 'lose' ? 'win' : 'draw';
      teams.endedBy = m.eb; teams.baseFell = m.bf ? flipTeam(m.bf) : null; teams.groundTo = m.gt ? flipTeam(m.gt) : null;
      state = teams.result === 'win' ? 'won' : 'lost';
      overlayT = 0; flash = 1; endScroll = 0;
      teams.result === 'win' ? SFX.bossDown() : SFX.death();
    }
  }
}

// the friend's own loop: move yourself, let everything else glide to the latest picture
function guestUpdate(dt) {
  elapsed += dt;
  if (state === 'play' && !player.dead) heroMove(dt);
  player.arrowCd = Math.max(0, (player.arrowCd || 0) - dt);
  const k = Math.min(1, dt * 12);
  for (const u of friends.concat(foes)) { u.x += (u.tx - u.x) * k; u.y += (u.ty - u.y) * k; u.flash = Math.max(0, (u.flash || 0) - dt); }
  for (const s of bshots) { s.x += s.vx * dt; s.y += s.vy * dt; s.spin += dt * 9; if (s.elem && !s.arrow && Math.random() < 0.5) shotTrail(s); }
  for (const s of shots) { s.x += s.vx * dt; s.y += s.vy * dt; }
  if (teams.pending) teams.pending.t = Math.max(0, teams.pending.t - dt);
  teams.time = Math.max(0, teams.time - dt);
  teams.terrRecalc -= dt;
  if (teams.terrRecalc <= 0) { teams.terrRecalc = 0.5; computeTerritory(); }
  decayVisuals(dt);
  // tell the host where you are (in their coordinates)
  net.posT -= dt;
  if (net.posT <= 0 && state === 'play') { net.posT = 0.05; net.send({ t: 'pos', x: -player.x, y: player.y, fx: -player.face.x, fy: player.face.y, tp: player.tp }); }
}

function netReceive(m) { if (net.role === 'host') hostReceive(m); else if (net.role === 'guest') guestReceive(m); }

function leaveDuel() {
  if (!versus) return;
  try { net.send({ t: 'bye' }); } catch (_) {}
  if (net.role === 'guest') mirrorArena(false);
  versus = false; net.role = null;
  rivalP = null; otherHero = null;
  setTimeout(hangUp, 300); // let the goodbye go out first
}

// ── lobby: host a duel or join one with a code ──
// Two ways to find each other are tried side by side: PeerJS's free
// matchmaking server, and Trystero, which meets through public Nostr relays.
// If one is down the other still works. The friend who joins plays on
// whichever opens first and says hello on it; the host plays on the one the
// hello arrives on. After that the phones talk directly.
const PEER_PREFIX = 'pentagram-duel-';
const PEERJS_URL = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
const TRYSTERO_URL = 'https://cdn.jsdelivr.net/npm/trystero@0.26.0/+esm';
const TRYSTERO_APP = 'pentagram-duel-v1';
// relay servers for when two networks can't reach each other directly
const TURN = [{ urls: ['turn:eu-0.turn.peerjs.com:3478', 'turn:us-0.turn.peerjs.com:3478'], username: 'peerjs', credential: 'peerjsp' }];
const ICE_SERVERS = [{ urls: 'stun:stun.l.google.com:19302' }, ...TURN];
const lobby = { role: null, code: null, paths: [], chosen: null, state: {}, try: null };

function loadPeer() {
  if (window.Peer) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = PEERJS_URL;
    s.onload = () => res(); s.onerror = () => rej(new Error('Could not load PeerJS'));
    document.head.appendChild(s);
  });
}
function hangUp() {
  for (const p of lobby.paths) try { p.close(); } catch (_) {}
  lobby.paths = []; lobby.chosen = null; lobby.role = null; lobby.state = {}; lobby.try = null;
}
// a path is one way of reaching the other phone: { name, send(m), close() }
function pathData(path, m) {
  if (lobby.chosen) { if (path === lobby.chosen) netReceive(m); return; }
  if (lobby.role === 'host' && m && m.t === 'hello') choosePath(path);
}
function pathOpen(path) {
  if (lobby.role !== 'guest' || lobby.chosen) return;

  }
}

window.addEventListener('keydown', e => {
